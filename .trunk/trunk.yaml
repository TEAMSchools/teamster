version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - bandit@1.9.4
    - actionlint@1.7.12
    - git-diff-check
    - gitleaks@8.30.1
    - hadolint@2.15.1
    - isort@9.0.2
    - markdownlint@0.49.1
    - osv-scanner@2.6.0
    - oxipng@10.2.1
    - prettier@3.9.9
    - pyright@1.1.414
    - ruff@0.16.10
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - sqlfluff@4.4.0
    - sqlfmt@0.32.0
    - svgo@4.1.0
    - taplo@0.10.0
    - yamllint@1.38.0
    - sql-banned-syntax
  disabled:
    - pinact
    - grype
    - terrascan
    - black
    - checkov
    - flake8
    - sql-formatter
    - trivy
    - trufflehog
  ignore:
    - paths:
        - src/teamster/**
      linters:
        - sqlfluff
        - sqlfmt
        - sql-banned-syntax
    - paths:
        - src/teamster/libraries/dlt_sources/**
      linters:
        - pyright
        - sqlfluff
        - sqlfmt
    - paths:
        - src/dbt/**
      linters:
        - actionlint
        - bandit
        - git-diff-check
        - hadolint
        - isort
        - markdownlint
        - osv-scanner
        - oxipng
        - pyright
        - ruff
        - shellcheck
        - shfmt
        - svgo
        - taplo
    - paths:
        - src/cube/package-lock.json
      linters:
        - osv-scanner
    - paths:
        - .k8s/**/values.yaml
      linters:
        - ALL
    - paths:
        - .claude/skills/zendesk-help-articles/references/design-system/**
      linters:
        - ALL
  definitions:
    - name: ruff
      commands:
        - name: format
          enabled: true
    - name: sql-banned-syntax
      files: [sql]
      commands:
        - name: lint
          run: python3 scripts/check_sql_banned_syntax.py ${target}
          success_codes: [0, 1]
          read_output_from: stdout
          output: regex
          parse_regex:
            "(?P<path>.*):(?P<line>\\d+):(?P<col>\\d+):
            \\[(?P<severity>[^\\]]*)\\] (?P<message>[^(]*) \\((?P<code>[^)]*)\\)"
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
