version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - pinact@4.1.1
    - grype@0.117.0
    - bandit@1.9.4
    - actionlint@1.7.12
    - git-diff-check
    - gitleaks@8.30.1
    - hadolint@2.15.1
    - isort@8.0.1
    - markdownlint@0.49.1
    - osv-scanner@2.5.1
    - oxipng@10.2.0
    - prettier@3.9.6
    - pyright@1.1.413
    - ruff@0.16.3
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - sqlfluff@4.3.0
    - sqlfmt@0.32.0
    - svgo@4.0.2
    - taplo@0.10.0
    - yamllint@1.38.0
  disabled:
    - terrascan
    - black
    - checkov
    - flake8
    - sql-formatter
    - trivy
    - trufflehog
  ignore:
    - paths:
        - src/teamster/**
      linters:
        - sqlfluff
        - sqlfmt
    - paths:
        - src/teamster/libraries/dlt_sources/**
      linters:
        - pyright
        - sqlfluff
        - sqlfmt
    - paths:
        - src/dbt/**
      linters:
        - actionlint
        - bandit
        - git-diff-check
        - hadolint
        - isort
        - markdownlint
        - osv-scanner
        - oxipng
        - pyright
        - ruff
        - shellcheck
        - shfmt
        - svgo
        - taplo
    - paths:
        - src/cube/package-lock.json
      linters:
        - osv-scanner
    - paths:
        - .k8s/**/values.yaml
      linters:
        - ALL
  definitions:
    - name: ruff
      commands:
        - name: format
          enabled: true
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
