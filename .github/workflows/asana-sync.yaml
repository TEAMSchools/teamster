name: Asana Sync

# Ticks "Data Marts + Semantic Layer" rows done once live in Cube and sets
# their needs-data / needs-cube tags (scripts/asana_sync.py). Runs 20 minutes
# before each refresh of the build status page, whose generator reads those
# ticks and tags on its own 4-hour schedule.
on:
  schedule:
    - cron: 40 3-23/4 * * *
  workflow_dispatch:
    inputs:
      apply:
        description: Write the changes (unchecked previews them)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Asana Sync
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # For repo checkout; the script reads src/cube/model on origin/main

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # A scheduled run writes only once the repo variable ASANA_SYNC_APPLY is
      # 'true', which is set after reading a preview run's log; until then it
      # previews.
      - name: Sync
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          APPLY:
            ${{ (github.event_name == 'schedule' && vars.ASANA_SYNC_APPLY ==
            'true') || inputs.apply }}
        run: |
          if [ "${APPLY}" = "true" ]; then
            uv run --no-project --with requests python scripts/asana_sync.py --apply
          else
            uv run --no-project --with requests python scripts/asana_sync.py
          fi
