name: cube sandbox contract

on:
  pull_request:
    paths:
      - src/cube/**
      - src/teamster/cube_sandbox/**
      - tests/cube_sandbox/**
      # checks.stale_manifest reads the dbt `not_null` tests under marts, so a
      # dbt PR adding or removing one changes build()'s output. Without this
      # path that PR never runs the check and lands a stale manifest.
      - src/dbt/kipptaf/models/marts/**
      # scripts/ carries the isolation and RLS-matrix runners the tests below
      # cover.
      - scripts/**
      - tests/scripts/**
      - tests/test_cube_rls_matrix.py
      - .github/workflows/cube-sandbox-contract.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # For repo checkout. Nothing here writes.

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/astral-sh/setup-uv
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Model, snapshot and manifest are compared at the SAME commit, so this
      # reads no moving input and cannot cry wolf. It runs before the tests
      # because it is the cheaper failure to read.
      - name: Check the model, snapshot and manifest agree
        run: uv run python -m teamster.cube_sandbox.checks

      # The gate the generator's contract actually rests on: fabricate the
      # tiny profile, write it as Avro, read it back and score every cell the
      # manifest declares. Zero uncovered, or the generator does not satisfy
      # its own specification. It runs the CLI rather than only the unit test
      # so the entry points stay reachable — four of the five deliverables
      # once had none.
      - name: Generate the tiny profile and score it against the manifest
        run: |
          uv run python -m teamster.cube_sandbox.generate --scale tiny
          uv run python -m teamster.cube_sandbox.coverage

      # The RLS-matrix and isolation tests live outside tests/cube_sandbox and
      # no other workflow runs them, so about 30 tests never ran in CI.
      - name: Run the cube sandbox tests
        run: >-
          uv run pytest tests/cube_sandbox tests/test_cube_rls_matrix.py
          tests/scripts/test_cube_sandbox_isolation.py -v
