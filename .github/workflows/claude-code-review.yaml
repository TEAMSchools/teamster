name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - scripts/**
      # A PR editing a workflow runs that PR's own version of it, so a change
      # here reviews itself. Kept in scope anyway: CI-config defects are exactly
      # the class this workflow was silently failing to catch.
      - .github/workflows/**
      - "!**/*.md"

jobs:
  claude-review:
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1.0.191
        with:
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/dbt-labs/dbt-agent-skills.git
            https://github.com/dagster-io/skills.git
            https://github.com/obra/superpowers.git
          plugins: |
            superpowers@superpowers-dev
            context7@claude-plugins-official
            dagster-expert@dagster
            dignified-python@dagster
            dbt@dbt-agent-marketplace
          track_progress: true
          prompt: >-
            /superpowers:requesting-code-review ${{ github.repository
            }}/pull/${{ github.event.pull_request.number }}.

            Apply dignified-python for Python standards, dagster-expert for
            Dagster assets and pipelines, and
            dbt:using-dbt-for-analytics-engineering for dbt models and
            transformations.

            Also evaluate the changed code through the /simplify lens: reuse
            (prefer existing macros, models, and helpers over reinventing),
            simplification, efficiency, and altitude and dead-code cleanup. This
            job has read-only repo access, so report these as review findings
            only; do not apply or commit fixes.

            For SQL and dbt changes, read src/dbt/CLAUDE.md (and the nearest
            per-project CLAUDE.md) and verify the code follows its SQL
            conventions, SQL column ordering (ST06), and SQL formatting
            sections. Examples (not exhaustive): max one level of function
            nesting, no QUALIFY, no ORDER BY in models, no SELECT DISTINCT or
            row_number() = 1 to mask upstream duplicates, no subqueries against
            tables or CTEs, cast early and once, correct ON vs WHERE placement,
            and no pass-through import CTEs. Cite the specific convention for
            each violation.

            Environment: you run in GitHub Actions with NO warehouse or data
            access. No BigQuery connection, and none of the cube, dbt, dagster,
            or bigquery MCP servers are available. You cannot run queries, `dbt
            show`, `dbt compile`, or materialize any model. Do not state
            data-dependent claims (row counts, null rates, join fan-out, grain
            or duplicate violations, value distributions) as fact. When a
            finding depends on the data, label it "needs local verification" and
            give the exact query or dbt command the author should run.

            Review what is checkable statically: SQL and Jinja logic,
            ref()/source() wiring, incremental and materialization config, join
            grain inferred from schema, test coverage, and PII exposure. Before
            reporting a repo-convention violation, confirm the convention
            against existing models with the Grep tool; do not invent naming or
            style rules the codebase does not already follow. Report every issue
            you find, including ones you are uncertain about; do not withhold
            lower-severity findings. Include a confidence level and a severity
            label for each finding so a human can rank them.

            Execution model: this job is a single non-interactive turn sequence.
            There is no wake-up and no second invocation — when you stop
            producing output the process exits and any unfinished work is lost.
            Never end a turn waiting on background work. If you dispatch review
            subagents, dispatch them synchronously (run_in_background: false)
            and collect their results in the same turn; otherwise review inline.
            Posting the review with update_claude_comment must be your final
            action, and must happen even if some checks are still incomplete.
          allowed_bots: dbt-cloud
          include_fix_links: false
          use_sticky_comment: true
          display_report: true
          # A second --allowedTools accumulates with the action's own list
          # (parse-sdk-options.ts ACCUMULATING_FLAGS) rather than replacing it,
          # so the comment-update and git-push tools stay allowed. The
          # --disallowedTools set is upstream's tested workaround for
          # anthropics/claude-code-action#1462: these tools assume a turn can be
          # resumed later, which a headless run cannot do. Not gated by
          # --allowedTools, so denying them explicitly is the only guard.
          claude_args: >-
            --model sonnet --effort xhigh --allowedTools "Skill,Bash(git
            diff:*),Bash(git log:*),Bash(git show:*),Bash(git
            rev-parse:*),Bash(git merge-base:*)" --disallowedTools
            "ScheduleWakeup,SendMessage,Monitor,Workflow"
