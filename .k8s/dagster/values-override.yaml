########################################################################################
# Dagster Cloud: Config for Dagster Cloud's hosted resources
########################################################################################
dagsterCloud:
  # Specify the Dagster Cloud deployments (e.g. dev, staging, prod) that the agent
  # should serve.
  deployments:
    - prod

  # Specify whether the agent should also serve branch deployments for your
  # organization.
  branchDeployments: true

########################################################################################
# Dagster Cloud Agent: Configuration for the Dagster Cloud (User) Agent
########################################################################################
dagsterCloudAgent:
  resources:
    requests:
      cpu: 500m # Autopilot minimum of 500m required for using pod anti affinity
      memory: 2.0Gi # extended-duration minimum (safe-to-evict: "false")
    limits:
      cpu: 750m
      memory: 2.5Gi

  podSecurityContext:
    runAsUser: 1001 # provided non-root user in image versions 0.14.0 and above

  terminationGracePeriodSeconds: 60

  env:
    # Reduce cleanup delay for orphaned code server deployments left by previous
    # agent IDs after Helm upgrades. Defaults: grace=3600s, interval=1800s.
    # With replicas: 1, each upgrade leaves 1 orphaned deployment per location.
    # The grace period must exceed the worst-case first reconcile so replacements
    # are reconciled before orphans are deleted -- CLAUDE.md: "do not set grace
    # period below reconciliation time". That worst case is now ~1200s (see the
    # readinessProbe note below), so 900s would sit under it; 1500s restores the
    # invariant. Cost is bounded: orphans linger ~10 min longer, and only after a
    # helm upgrade.
    DAGSTER_CLOUD_CLEANUP_SERVER_GRACE_PERIOD_SECONDS: "1500"
    DAGSTER_CLOUD_CLEANUP_SERVER_CHECK_INTERVAL: "600"

  readinessProbe:
    exec:
      command:
        - /bin/bash
        - -c
        - test -f /tmp/finished_initial_reconciliation_sentinel.txt
    # Must cover the WORST-CASE first reconcile, because the sentinel this probe
    # tests is only written after the first full _reconcile returns
    # (user_code_launcher.py, gated on _reconcile_count == 0). Per location that
    # is deploymentStartupTimeout (900s) + serverProcessStartupTimeout (300s) =
    # 1200s, and locations are reconciled concurrently via asyncio.gather, so
    # ~1200s total rather than 5x that. 130 x 10s = 1300s leaves margin. Raising
    # deploymentStartupTimeout without raising this stalls the agent rollout on
    # exactly the helm upgrade that ships it.
    failureThreshold: 130 # 21.7 min (130 × 10s) for initial reconciliation
    initialDelaySeconds: 0
    periodSeconds: 10

  # maxSurge: 200% surges the new pod above the current replica for zero-downtime
  # Helm upgrades. Combined with requiredDuringSchedulingIgnoredDuringExecution
  # hostname anti-affinity, this requires a distinct node briefly. On Autopilot
  # this is provisioned on demand; a stalled rollout indicates capacity exhaustion.
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0%
      maxSurge: 200%

  # Single replica minimizes k8s Service churn from dual-agent reconciliation
  # (both replicas independently recreate code server Deployments/Services on
  # every control-plane update, doubling ClusterIP transitions and gRPC gaps).
  replicas: 1

  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

  # Hard-pin to built-in Scale-Out (T2D, amd64) under pod-based pricing.
  # Multi-key nodeSelector is allowed by Warden — only multiple values for
  # the same key are rejected. Image is amd64-only; arm64 is not an option.
  nodeSelector:
    cloud.google.com/compute-class: Scale-Out
    kubernetes.io/arch: amd64

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - dagster-cloud-agent
          topologyKey: kubernetes.io/hostname

  additionalPodSpecConfig:
    priorityClassName: dagster-agent

  # Agent container securityContext — not set because the agent runs Dagster's
  # own image (UID 1001), not ours (UID 1234). Spec Section 2 covers workspace
  # and run pods only. The Helm chart does support this field.

########################################################################################
# Workspace: Configuration for pods (launched by the agent) that run Dagster user code
########################################################################################
workspace:
  # Time the agent waits for a code server DEPLOYMENT to become ready -- in
  # practice, for the pod to be scheduled. Distinct from
  # serverProcessStartupTimeout below, which only starts once the Deployment
  # exists. The chart default is 300s, which sits inside the 3-9 minute NAP
  # FailedScheduling window documented in CLAUDE.md, so an ordinary provisioning
  # wait times out. On timeout the agent uploads an error, the control plane
  # records the location as ERROR, and _should_trigger_recovery then refuses to
  # retry ("control plane agrees there is an error") -- the location stays dead
  # until a push or a manual redeploy.
  #
  # Agent-global, so it applies to branch deployments too
  # (dagsterCloud.branchDeployments): a branch deployment that cannot schedule now
  # takes 15 minutes to report instead of 5. Raising this also moves the agent's
  # worst-case first reconcile, which the readinessProbe and cleanup grace period
  # below are sized against -- change all three together.
  deploymentStartupTimeout: 900

  serverProcessStartupTimeout: 300

  # Raw k8s configuration for the Kubernetes Deployment created for each code location.
  serverK8sConfig:
    containerConfig:
      env:
        - name: DAGSTER_GRPC_MAX_WORKERS
          value: "20"
      resources:
        # Autopilot minimum of 0.5 vCPU & 2 GiB required for scale-out pods using
        # workload separation: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-resource-requests#workload-separation
        requests:
          cpu: 500m
          memory: 2.0Gi
        limits:
          # Bumped from 750m to 1000m on 2026-04-24 after a kipptaf code
          # server pod hit the GKE High CPU Limit alert (self-resolved in
          # 68s). Dagster+ Hybrid's sensor/schedule/asset daemons run in
          # the control plane, but code servers still serve sensor
          # evaluations, workspace snapshots, and gRPC health checks —
          # kipptaf's large definitions module (every integration) bursts
          # above 750m during sensor eval waves.
          cpu: 1000m
          memory: 2.5Gi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        runAsGroup: 1234
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    podTemplateSpecMetadata: # raw config for the pod's metadata
      annotations:
        operator.1password.io/auto-restart: "true"
        # Blocks cluster-autoscaler relocation of code servers. Second attempt.
        #
        # First attempt 2026-08-18 (#4921) was reverted the same day: run pods
        # sat at priority 1000 and code servers at 0, so pinning a code server
        # to its node left preemption as the only way for a run pod to claim
        # capacity. Agent "Could not reach user code server" errors ran ~62x
        # baseline and code-server Preempted ~118x within the hour.
        #
        # #5187 removed the run-pod PriorityClass, so run pods and code servers
        # are both at 0 and preemption between them is impossible. That closes
        # the failure mode #4921 measured. What remains is the one the
        # annotation was always meant to stop: the autoscaler killing a code
        # server pod during a ScaleDown. On 2026-09-09 that killed kippmiami's
        # code server while the agent was re-uploading its metadata, and one
        # gRPC UNAVAILABLE left the location in a terminal ERROR (#5187 covers
        # the same mechanism with preemption as the trigger).
        #
        # Cost: a node holding a code server cannot consolidate, so run pods
        # that fit nowhere wait for NAP instead. Keep-or-revert rule, judged at
        # matched run-pod load (~25+ Scheduled events per 15 min): revert if
        # code-server Preempted or agent gRPC errors rise above the 0/0 baseline
        # from the #4921 measurement; keep if ScaleDown kills of code servers
        # drop to 0 and Preempted stays at 0.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    podSpecConfig:
      # Hard-pin to built-in Scale-Out arm64 (T2A) under pod-based pricing.
      # No fallback — arm64 STOCKOUT will leave pods Pending. Code servers
      # tolerate this: PDB-protected (`maxUnavailable: 1` -- see extraManifests
      # below; do NOT switch to minAvailable, per CLAUDE.md), Dagster Cloud
      # serves the last-good Deployment until replacements bind.
      nodeSelector:
        cloud.google.com/compute-class: Scale-Out
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              managed_by: K8sUserCodeLauncher
              deployment_name: prod
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              managed_by: K8sUserCodeLauncher
              deployment_name: prod

  # Raw k8s configuration for the Kubernetes Job and Pod created for each run. See:
  # https://docs.dagster.io/deployment/guides/kubernetes/customizing-your-deployment
  runK8sConfig:
    jobSpecConfig:
      # backoffLimit is retries (not total attempts): 1 = 2 total pod attempts
      # before K8s marks the Job Failed. Kept low so genuine application errors
      # surface quickly via Dagster's run retry (dagster/will_retry).
      backoffLimit: 1
      # K8s sets the DisruptionTarget pod condition when a pod is terminated by
      # priority-class preemption, eviction API (node drain), graceful node
      # shutdown, or taint-based eviction. On Autopilot, GKE system-critical
      # pods (priority 2,000,000,000) routinely preempt our dagster-run pods
      # (priority 0) to land kube-dns, fluent-bit, metrics-agent, etc. —
      # this is unavoidable cluster-wide behavior. podFailurePolicy with
      # action=Ignore makes the Job controller treat those disruptions as
      # not-a-failure: the Job transparently replaces the pod without counting
      # against backoffLimit. Genuine app failures (non-zero exits without
      # DisruptionTarget) still consume the retry budget as before.
      # GA in K8s 1.31+; cluster is on 1.34.4.
      podFailurePolicy:
        rules:
          - action: Ignore
            onPodConditions:
              - type: DisruptionTarget
    containerConfig:
      # Autopilot enforces special minimum values for resource requests on extended
      # duration Pods: https://cloud.google.com/kubernetes-engine/docs/concepts/autopilot-resource-requests#workload-separation
      resources:
        requests:
          cpu: 500m
          memory: 2.0Gi
        limits:
          # Bumped from 1000m to 1750m to cover non-dbt step pods whose p95 CPU
          # usage is ~950m with observed peaks to 1.45 cores. 1750m gives ~20%
          # headroom above the 14-day max, staying below the most aggressive
          # per-asset dbt override (2250m). Dbt assets keep their own higher
          # per-asset limit overrides in Python asset definitions.
          cpu: 1750m
          memory: 2.5Gi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        runAsGroup: 1234
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    podTemplateSpecMetadata: # raw config for the pod's metadata
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    podSpecConfig:
      # No priorityClassName: run pods stay at default priority 0, the same tier
      # as code servers. The `dagster-run` PriorityClass (value 1000) was removed
      # 2026-09-08 after a run pod preempted the kippcamden code server while
      # the agent was re-uploading its metadata (#5187). A single gRPC
      # UNAVAILABLE in that window writes ERROR to the control plane, and the
      # agent never retries a location the control plane already marks as
      # errored -- so the location stayed down for four days. Equal priority
      # means a run pod that finds no room waits for Node Auto Provisioning
      # instead of preempting a code server. The kubelet eviction-order
      # argument for 1000 never applied: the required anti-affinity below keeps
      # run pods and code servers off the same node.
      #
      # Hard-pin to built-in Scale-Out arm64 (T2A) under pod-based pricing.
      # No fallback — arm64 STOCKOUT will leave run pods Pending until
      # capacity returns. `podFailurePolicy` (`DisruptionTarget` → `Ignore`)
      # already absorbs autoscaler/preemption disruption mid-run; STOCKOUT
      # affects scheduling, not running pods.
      nodeSelector:
        cloud.google.com/compute-class: Scale-Out
        kubernetes.io/arch: arm64
      affinity:
        # Hard-block run/step pods from sharing a node with code servers
        # (with both at priority 0, a run pod that fits nowhere waits for a
        # new node rather than preempting a code server) or with the
        # agent (protects the single-replica agent from kubelet node-pressure
        # eviction by bursty run workloads). Each term is evaluated
        # independently — a candidate node is rejected if EITHER selector
        # matches a pod already on it. Autopilot provisions new nodes on
        # demand when existing nodes can't satisfy the constraint; per-pod
        # billing means this adds only startup latency, not direct cost.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  managed_by: K8sUserCodeLauncher
                  deployment_name: prod
              topologyKey: kubernetes.io/hostname
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: dagster-cloud-agent
              topologyKey: kubernetes.io/hostname

  # Specify TTL for user code servers.
  # By default full deployment servers do not have a TTL.
  # Branch deployments servers have a default TTL of 24 hours
  # The max code servers defaults to 25, and only applies to servers with TTL.
  serverTTL:
    branchDeployments:
      ttlSeconds: 3600

  onlyAllowUserDefinedK8sConfigFields:
    containerConfig:
      resources: true
      env: true
      volumeMounts: true
    podSpecConfig:
      nodeSelector: true
      affinity: true
      volumes: true
    podTemplateSpecMetadata:
      annotations: true
    jobSpecConfig:
      ttlSecondsAfterFinished: true
    jobMetadata:
      annotations: true

########################################################################################
# Extra Manifests: (Optional) Create additional k8s resources within this chart
########################################################################################
extraManifests:
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: dca-pdb
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          app.kubernetes.io/instance: user-cloud
          app.kubernetes.io/name: dagster-cloud-agent
          component: agent
          deployment: agent
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: kippcamden-pdb
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment_name: prod
          managed_by: K8sUserCodeLauncher
          location_name: kippcamden
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: kippmiami-pdb
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment_name: prod
          managed_by: K8sUserCodeLauncher
          location_name: kippmiami
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: kippnewark-pdb
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment_name: prod
          managed_by: K8sUserCodeLauncher
          location_name: kippnewark
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: kipppaterson-pdb
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment_name: prod
          managed_by: K8sUserCodeLauncher
          location_name: kipppaterson
  - apiVersion: scheduling.k8s.io/v1
    kind: PriorityClass
    metadata:
      name: dagster-agent
    value: 1000
    globalDefault: false
    preemptionPolicy: PreemptLowerPriority
    description: >-
      Elevates agent pods above run/step and code server pods (priority 0) so
      nothing in this namespace can preempt the single-replica agent. The agent
      pins to amd64 nodes and the others to arm64, so it never preempts them.
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: kipptaf-pdb
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment_name: prod
          managed_by: K8sUserCodeLauncher
          location_name: kipptaf
