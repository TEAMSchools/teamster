<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIPP NJ | Miami — Data dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin: 0; background: var(--surface-page); } </style>
</head>
<body data-theme="newark">
<div id="root"></div>
<script type="text/babel" src="./DashSidebar.jsx"></script>
<script type="text/babel" src="./DashTopbar.jsx"></script>
<script type="text/babel" src="./Charts.jsx"></script>
<script type="text/babel" src="./DataTable.jsx"></script>
<script type="text/babel" src="./DashBody.jsx"></script>
<script type="text/babel">
  const { DashSidebar, DashTopbar, DashBody } = window;
  function App() {
    const [section, setSection] = React.useState('overview');
    const [school, setSchool] = React.useState('Network — all schools');
    const [range, setRange] = React.useState('ytd');
    return (
      <div style={{ display: 'flex', minHeight: '100vh' }}>
        <DashSidebar active={section} onNav={setSection} />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
          <DashTopbar school={school} onSchool={setSchool} range={range} onRange={setRange} />
          <DashBody section={section} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
