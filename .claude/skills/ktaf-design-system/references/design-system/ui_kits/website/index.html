<!-- @startingPoint section="Website" subtitle="Full marketing homepage with region switcher and enrollment modal" viewport="1280x900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIPP NJ | Miami — Marketing site</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin: 0; background: var(--surface-page); } </style>
</head>
<body data-theme="newark">
<div id="root"></div>
<script type="text/babel" src="./PhotoFrame.jsx"></script>
<script type="text/babel" src="./SiteHeader.jsx"></script>
<script type="text/babel" src="./Hero.jsx"></script>
<script type="text/babel" src="./StatBand.jsx"></script>
<script type="text/babel" src="./SchoolFinder.jsx"></script>
<script type="text/babel" src="./ValueProps.jsx"></script>
<script type="text/babel" src="./CTABand.jsx"></script>
<script type="text/babel" src="./SiteFooter.jsx"></script>
<script type="text/babel" src="./ApplyModal.jsx"></script>
<script type="text/babel">
  const { SiteHeader, Hero, StatBand, SchoolFinder, ValueProps, CTABand, SiteFooter, ApplyModal } = window;

  function App() {
    const [region, setRegion] = React.useState('newark');
    const [apply, setApply] = React.useState(false);
    React.useEffect(() => { document.body.setAttribute('data-theme', region); }, [region]);
    const open = () => setApply(true);
    return (
      <React.Fragment>
        <SiteHeader region={region} onRegion={setRegion} onApply={open} />
        <Hero region={region} onApply={open} />
        <StatBand />
        <SchoolFinder region={region} />
        <ValueProps />
        <CTABand onApply={open} />
        <SiteFooter />
        {apply && <ApplyModal region={region} onClose={() => setApply(false)} />}
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
