<!-- @dsCard group="Slides" viewport="1280x720" name="Title slide" subtitle="Indigo cover with big display headline; logo sits quietly in the footer" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;height:100%;}
  .slide{width:1280px;height:720px;background:var(--kipp-indigo);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:80px;box-sizing:border-box;}
  .accent-bar{position:absolute;top:0;left:0;width:14px;height:100%;background:var(--brand-accent);}
  .headline{margin-top:auto;}
  .eyebrow{font-family:var(--font-brand);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand-accent);}
  h1{font-family:var(--font-brand);font-weight:700;font-size:84px;line-height:1.0;letter-spacing:-.01em;margin:18px 0 0;max-width:18ch;color:#fff;}
  .footer{display:flex;align-items:flex-end;justify-content:space-between;margin-top:56px;padding-top:28px;border-top:1px solid rgba(255,255,255,.18);}
  .logo{height:54px;width:auto;flex:none;}
  .meta{font-family:var(--font-sans);font-size:20px;color:var(--indigo-200);text-align:right;}
</style>
</head>
<body data-theme="newark">
  <div class="slide">
    <div class="accent-bar"></div>
    <div class="headline">
      <div class="eyebrow">2025–26 Network Results</div>
      <h1>Our kids will change the world</h1>
    </div>
    <div class="footer">
      <img class="logo" src="../assets/logo-horizontal-white.png" alt="KIPP NJ | Miami">
      <div class="meta">Board of Directors · June 2026</div>
    </div>
  </div>
</body>
</html>
