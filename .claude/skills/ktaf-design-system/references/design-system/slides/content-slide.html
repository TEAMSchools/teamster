<!-- @dsCard group="Slides" viewport="1280x720" name="Content + image slide" subtitle="Headline and points beside a photo placeholder" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;height:100%;}
  .slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;box-sizing:border-box;}
  .left{padding:72px 64px 72px 80px;display:flex;flex-direction:column;justify-content:center;}
  .eyebrow{font-family:var(--font-brand);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand-accent);}
  h2{font-family:var(--font-brand);font-weight:700;font-size:50px;line-height:1.04;letter-spacing:-.01em;color:var(--text-strong);margin:12px 0 28px;}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:20px;}
  li{display:flex;gap:16px;font-family:var(--font-sans);font-size:21px;line-height:1.4;color:var(--text-body);}
  .dot{flex:none;width:30px;height:30px;border-radius:var(--radius-md);background:var(--kipp-indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:14px;margin-top:2px;}
  .photo{background:var(--blue-100);display:flex;align-items:center;justify-content:center;color:var(--blue-700);position:relative;}
  .photo .cap{position:absolute;bottom:16px;right:18px;font-family:var(--font-brand);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;}
</style>
</head>
<body data-theme="newark">
  <div class="slide">
    <div class="left">
      <div class="eyebrow">What's working</div>
      <h2>Three drivers of our results</h2>
      <ul>
        <li><span class="dot">1</span><span>Joyful, rigorous classrooms where kids want to be.</span></li>
        <li><span class="dot">2</span><span>Coaching and support for every first-year teacher.</span></li>
        <li><span class="dot">3</span><span>Data the whole team can act on, every week.</span></li>
      </ul>
    </div>
    <div class="photo">
      <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:.6"><rect x="3" y="5" width="18" height="14"/><circle cx="9" cy="10" r="2"/><path d="M3 17l5-4 4 3 3-2 6 5"/></svg>
      <span class="cap">Photography</span>
    </div>
  </div>
</body>
</html>
