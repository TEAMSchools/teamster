<!-- @dsCard group="Slides" viewport="1280x720" name="Section divider" subtitle="Full-bleed accent slide for section breaks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;height:100%;}
  .slide{width:1280px;height:720px;background:var(--brand-accent);color:var(--brand-on-accent);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:80px;box-sizing:border-box;}
  .num{font-family:var(--font-mono);font-weight:700;font-size:28px;opacity:.5;}
  .eyebrow{font-family:var(--font-brand);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.12em;opacity:.7;margin-top:8px;}
  h2{font-family:var(--font-brand);font-weight:700;font-size:76px;line-height:1.02;letter-spacing:-.01em;margin:14px 0 0;max-width:20ch;}
  .rule{width:120px;height:8px;background:var(--kipp-indigo);margin-top:36px;border-radius:var(--radius-pill);}
</style>
</head>
<body data-theme="newark">
  <div class="slide">
    <div class="num">02</div>
    <div class="eyebrow">Section</div>
    <h2>Academic outcomes</h2>
    <div class="rule"></div>
  </div>
</body>
</html>
