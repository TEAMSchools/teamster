<!-- @dsCard group="Slides" viewport="1280x720" name="Quote slide" subtitle="Large pull-quote on indigo with attribution" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;height:100%;}
  .slide{width:1280px;height:720px;background:var(--kipp-indigo);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:80px 96px;box-sizing:border-box;}
  .mark{font-family:var(--font-brand);font-weight:700;font-size:160px;line-height:.6;color:var(--brand-accent);height:80px;}
  blockquote{font-family:var(--font-brand);font-weight:700;font-size:48px;line-height:1.18;letter-spacing:-.01em;margin:0;max-width:24ch;text-wrap:balance;}
  .by{display:flex;align-items:center;gap:16px;margin-top:40px;}
  .avatar{width:56px;height:56px;border-radius:50%;background:var(--brand-accent);color:var(--brand-on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-brand);font-weight:700;font-size:20px;}
  .name{font-family:var(--font-brand);font-weight:700;font-size:20px;}
  .role{font-family:var(--font-sans);font-size:16px;color:var(--indigo-200);}
</style>
</head>
<body data-theme="newark">
  <div class="slide">
    <div class="mark">&ldquo;</div>
    <blockquote>When teammates are supported, our students run to school.</blockquote>
    <div class="by">
      <div class="avatar">AR</div>
      <div>
        <div class="name">Aisha Robinson</div>
        <div class="role">Principal, KIPP Rise Academy · Newark</div>
      </div>
    </div>
  </div>
</body>
</html>
