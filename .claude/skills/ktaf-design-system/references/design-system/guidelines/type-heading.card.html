<!-- @dsCard group="Type" viewport="700x240" name="The brand heading" subtitle="Semibold, ALL CAPS with .04em tracking — the signature Whitney treatment, rendered in the system stack" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface-card); }
  .eyebrow { font-family: var(--font-brand); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--brand-accent); }
  .head { font-family: var(--font-brand); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-strong); font-size: 40px; line-height: 1.05; margin-top: 10px; }
  .sub { font-family: var(--font-brand); font-weight: 700; font-size: 22px; color: var(--text-strong); margin-top: 16px; }
  .note { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 14px; }
</style>
</head>
<body>
  <div class="eyebrow">Knowledge is Power</div>
  <div class="head">Our kids will<br>change the world</div>
  <div class="sub">Headlines in copy stay sentence case</div>
  <div class="note">font-weight 600 · text-transform uppercase · letter-spacing .04em</div>
</body>
</html>
