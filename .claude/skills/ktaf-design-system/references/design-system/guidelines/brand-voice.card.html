<!-- @dsCard group="Brand" viewport="700x250" name="Voice & tone" subtitle="Smart, slightly irreverent, youthful — and always succinct" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 26px; background: var(--surface-card); }
  .lede { font-family: var(--font-brand); font-weight: 600; text-transform: uppercase; letter-spacing:.04em; color: var(--text-strong); font-size: 15px; margin-bottom: 14px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .col h4 { font-family: var(--font-brand); font-size: 11px; text-transform: uppercase; letter-spacing:.08em; margin:0 0 8px; }
  .right h4 { color: var(--status-success); }
  .wrong h4 { color: var(--status-danger); }
  .col p { font-family: var(--font-sans); font-size: 13.5px; line-height: 1.45; color: var(--text-body); padding: 9px 11px; border-radius: var(--radius-md); }
  .right p { background: var(--status-success-surface); }
  .wrong p { background: var(--status-danger-surface); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="lede">Teach and lead with us.</div>
  <div class="grid">
    <div class="col right"><h4>Right way</h4><p>First-year teachers get the support they need.</p></div>
    <div class="col wrong"><h4>Wrong way</h4><p>First-year, entry-level teachers receive professional development from seasoned, master teachers.</p></div>
  </div>
</body>
</html>
