<!-- @dsCard group="Type" viewport="700x320" name="Type scale" subtitle="Display through caption, brand sans" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--surface-card); }
  .row { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--divider); padding: 9px 0; }
  .row:last-child { border-bottom: none; }
  .spec { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); width: 110px; flex: none; }
  .demo { font-family: var(--font-brand); color: var(--text-strong); line-height: 1.05; }
</style>
</head>
<body>
  <div class="row"><span class="spec">display-xl 60</span><span class="demo" style="font-size:48px;font-weight:700;letter-spacing:-.01em">Run to school</span></div>
  <div class="row"><span class="spec">h1 38 / 700</span><span class="demo" style="font-size:34px;font-weight:700">Promises are sacred</span></div>
  <div class="row"><span class="spec">h2 30 / 700</span><span class="demo" style="font-size:26px;font-weight:700">Outstanding teammates</span></div>
  <div class="row"><span class="spec">h3 24 / 600</span><span class="demo" style="font-size:22px;font-weight:600">To and through college</span></div>
  <div class="row"><span class="spec">body 16 / 400</span><span class="demo" style="font-size:16px;font-weight:400;color:var(--text-body)">Candid, kid-focused, succinct.</span></div>
  <div class="row"><span class="spec">caption 13</span><span class="demo" style="font-size:13px;font-weight:400;color:var(--text-muted)">Newark · Camden · Paterson · Miami</span></div>
</body>
</html>
