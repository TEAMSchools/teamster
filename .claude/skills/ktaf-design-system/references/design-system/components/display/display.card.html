<!-- @dsCard group="Components" viewport="700x430" name="Cards, badges, tags & stats" subtitle="Surfaces, status pills, chips, big-number callouts and avatars" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface-sunken); }
  .grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items:start; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  h5 { font-family:var(--font-brand); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:0 0 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Card, Badge, Tag, StatCallout, Avatar, AvatarGroup } = window.KIPPNJMiamiDesignSystem_1916b9;
  function Demo(){
    return (
      <div className="grid">
        <Card elevation="md">
          <h5>Badges</h5>
          <div className="row">
            <Badge tone="success" dot>On track</Badge>
            <Badge tone="indigo">K–4</Badge>
            <Badge tone="warning">Watch</Badge>
          </div>
          <h5>Tags</h5>
          <div className="row">
            <Tag selectable selected>Newark</Tag>
            <Tag dotColor="var(--viz-2)">Math</Tag>
            <Tag onRemove={()=>{}}>Grade 5</Tag>
          </div>
          <h5>Avatars</h5>
          <AvatarGroup>
            <Avatar name="Aisha Brown" tone="indigo"/>
            <Avatar name="Marcus Lee" tone="accent"/>
            <Avatar name="Dana Cole"/>
          </AvatarGroup>
        </Card>

        <Card pop>
          <StatCallout value="95.2%" label="College enrollment" sub="Class of 2025" trend={{dir:'up',text:'+3.1 pts'}}/>
        </Card>

        <Card inverse accentBar>
          <StatCallout value="9,000" label="Students" tone="inverse" size="lg"/>
        </Card>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
