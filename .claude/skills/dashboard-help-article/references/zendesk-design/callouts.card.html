<!-- @dsCard group="Zendesk" viewport="700x260" name="Callout set" subtitle="Note, Tip, Warning, Critical — table-based, sanitizer-safe" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        padding: 20px 24px;
        background: var(--surface-card);
      }
      td div {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <table
      style="width: 100%; border-collapse: collapse; margin: 0 0 12px"
      cellpadding="0"
      cellspacing="0"
    >
      <tbody>
        <tr>
          <td
            style="
              padding: 12px 16px;
              background-color: #f0fafe;
              border: 1px solid #bce5f7;
              border-left: 4px solid #57c0e9;
              font-family:
                &quot;Hanken Grotesk&quot;, Whitney, &quot;Helvetica Neue&quot;,
                Helvetica, Arial, sans-serif;
            "
          >
            <div
              style="
                padding-bottom: 3px;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.07em;
                color: #1f7fb0;
              "
            >
              Note
            </div>
            <div style="font-size: 13px; line-height: 1.55; color: #2a3340">
              Neutral context the reader should know.
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <table
      style="width: 100%; border-collapse: collapse; margin: 0 0 12px"
      cellpadding="0"
      cellspacing="0"
    >
      <tbody>
        <tr>
          <td
            style="
              padding: 12px 16px;
              background-color: #f9fbe9;
              border: 1px solid #e4eea0;
              border-left: 4px solid #c3d52e;
              font-family:
                &quot;Hanken Grotesk&quot;, Whitney, &quot;Helvetica Neue&quot;,
                Helvetica, Arial, sans-serif;
            "
          >
            <div
              style="
                padding-bottom: 3px;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.07em;
                color: #7e8c12;
              "
            >
              Tip
            </div>
            <div style="font-size: 13px; line-height: 1.55; color: #2a3340">
              Optional advice that saves the reader time.
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <table
      style="width: 100%; border-collapse: collapse; margin: 0 0 12px"
      cellpadding="0"
      cellspacing="0"
    >
      <tbody>
        <tr>
          <td
            style="
              padding: 12px 16px;
              background-color: #fff6e8;
              border: 1px solid #fcd99b;
              border-left: 4px solid #f9a21a;
              font-family:
                &quot;Hanken Grotesk&quot;, Whitney, &quot;Helvetica Neue&quot;,
                Helvetica, Arial, sans-serif;
            "
          >
            <div
              style="
                padding-bottom: 3px;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.07em;
                color: #b96b00;
              "
            >
              Warning
            </div>
            <div style="font-size: 13px; line-height: 1.55; color: #2a3340">
              Something that will go wrong if ignored.
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <table
      style="width: 100%; border-collapse: collapse; margin: 0"
      cellpadding="0"
      cellspacing="0"
    >
      <tbody>
        <tr>
          <td
            style="
              padding: 12px 16px;
              background-color: #fef0ef;
              border: 1px solid #f7b9b6;
              border-left: 4px solid #ee3c37;
              font-family:
                &quot;Hanken Grotesk&quot;, Whitney, &quot;Helvetica Neue&quot;,

            "
          >
            <div
              style="
                padding-bottom: 3px;

                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.07em;
                color: #b81f1b;
              "
            >
              Critical
            </div>
            <div style="font-size: 13px; line-height: 1.55; color: #2a3340">
              Data loss, security, or student privacy. Use sparingly.
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
