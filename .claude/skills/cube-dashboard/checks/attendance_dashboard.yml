# Validation checks for the Attendance Dashboard (Tableau workbook
# 87c13e78-a912-40a4-95dd-33248fc1cbd3). Run with the cube-dashboard skill.
# Every metric's SQL reproduces the Tableau formula on the dashboard's own table.
# Grains come from `cube_validate.py grains` over the workbook's published
# dashboards; a grain with a no-Cube-member dimension is also checked without it.
dashboard: attendance_dashboard
task_gid: "1213823788919470"
workbook_luid: 87c13e78-a912-40a4-95dd-33248fc1cbd3
table: teamster-332318.kipptaf_tableau.rpt_tableau__attendance_dashboard
view: student_attendance_enrollment_daily_view

dimensions:
  date: { cube: attendance_date, sql: calendardate }
  day: { cube: attendance_date, granularity: day, sql: calendardate }
  month:
    {
      cube: attendance_date,
      granularity: month,
      sql: "date_trunc(calendardate, month)",
    }
  academic_year: { cube: dates_academic_year, sql: academic_year }
  region: { cube: regions_region_name, sql: region }
  school: { cube: locations_abbreviation, sql: school_abbreviation }
  grade_level: { cube: grade_level, sql: grade_level }
  term: { cube: terms_term_name, sql: term }
  school_level: { cube: locations_grade_band, sql: school_level }
  # Tableau shows three IEP statuses; Cube has a boolean, so both sides group by it.
  iep: { cube: is_iep, sql: iep_status != 'No IEP' }
  gender: { cube: gender_identity, sql: gender }
  # Same decode as dim_students.race.
  ethnicity:
    cube: race
    sql: >-
      case ethnicity when 'B' then 'Black/African American' when 'H' then
      'Hispanic or Latino' when 'T' then 'Two or More Races' when 'W' then
      'White' when 'I' then 'American Indian or Alaska Native' when 'A' then
      'Asian' when 'P' then 'Native Hawaiian or Other Pacific Islander' when 'N'
      then 'Not Hispanic or Latino' else 'Not Listed' end
  # Cube's is_ell is false when no ELL span exists; a null lep_status means the same.
  ell: { cube: is_ell, sql: "coalesce(lep_status, false)" }
  # Same decode as dim_students.enrollment_status.
  enroll_status:
    cube: enrollment_status
    sql: >-
      case enroll_status when -2 then 'Inactive' when -1 then 'Pre-registered'
      when 0 then 'Currently Enrolled' when 1 then 'Inactive' when 2 then
      'Transferred Out' when 3 then 'Graduated' when 4 then 'Imported as
      Historical' end
  # No Cube member: grains using these are reported as not comparable.
  homeroom:
    { cube: null, sql: "if(school_level = 'HS', teacher_name, section_number)" }
  teacher_name: { cube: null, sql: teacher_name }
  team: { cube: null, sql: team }
  schoolid: { cube: null, sql: schoolid }
  is_truant_current: { cube: null, sql: is_truant }
  c_504_status: { cube: null, sql: c_504_status }
  is_counselingservices: { cube: null, sql: is_counselingservices }
  nj_overall_student_tier: { cube: null, sql: nj_overall_student_tier }
  is_self_contained: { cube: null, sql: is_self_contained }
  ms_attended: { cube: null, sql: ms_attended }
  grouping: { cube: null, sql: region }
  view_by: { cube: null, sql: calendardate }
  region_filter: { cube: null, sql: region }
  student: { cube: null, sql: student_number }

# Every NJ tab hard-codes these three regions (Miami - NSLP is Miami-only).
hard_filters:
  - { dim: region, values: [Camden, Newark, Paterson] }

# The rpt_ table holds school days only (membershipvalue = 1); Cube's fact also
# carries break days, which count_students would count at a day grain.
cube_filters:
  - { member: is_in_session_day, operator: equals, values: ["true"] }

rows:
  - row_gid: "1219087795895880"
    name: "% On-Time (standalone)"
    # Tableau: AVG(ABS((IF is_present = 0 THEN NULL ELSE Is Tardy END) - 1)); Is Tardy uses the Att Code group's Tardy bin.
    metrics:
      - cube: pct_ontime
        kind: rate
        num:
          sum(if(school_level = 'OD' or is_present = 0, null, if(att_code in
          ('ET', 'T', 'T10', 'TLE'), 0, 1)))
        den: countif(school_level != 'OD' and is_present != 0)
        # The Attendance Metric sheets drop out-of-district students (School Level -
        # OOD Filter Set excludes school_level = 'OD'); Cube has no member for that.
        missing_members: [out_of_district]
        num_without:
          sum(if(is_present = 0, null, if(att_code in ('ET', 'T', 'T10', 'TLE'),
          0, 1)))
        den_without: countif(is_present != 0)
    grains:
      - []
      - [grade_level]
      - [grade_level, month]
      - [grade_level, is_truant_current]
