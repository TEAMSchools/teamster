  - row_gid: "1214703929266204"
    name: "# Tardy"
    # Tableau: SUM(IIF([Att Code (group)] = 'Tardy', 1, 0)) on Student - Team Counts, whose Exclude HRs filter drops rows with no homeroom.
    metrics:
      - cube: count_tardy_days
        kind: count
        diagnose_by: { cube: attendance_code, sql: att_code }
        sql:
          countif(att_code in ('ET', 'T', 'T10', 'TLE') and
          coalesce(if(school_level = 'HS', teacher_name, section_number),
          'NotHere') != 'NotHere')
