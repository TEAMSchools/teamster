    sql: is_foundations
  is_replacement:
    cube: is_replacement
    sql: is_replacement
  tutoring:
    cube: null
    sql: tutoring_nj
  low_25:
    cube: null
    sql: is_low_25_fl
  dibels:
    cube: null
    sql: dibels_most_recent_composite
  gifted:
    cube: is_gifted
    sql: gifted_and_talented = 'Y'
  other_context:
    cube: null
    sql: state_test_proficiency
hard_filters:
  - dim: region
    values:
      - Camden
      - Newark
      - Paterson
cube_filters:
  - member: assessment_type
    operator: equals
    values:
      - illuminate
  - member: response_type
    operator: equals
    values:
      - overall
      - not_taken
truth_filters:
  - sql: student_number is not null
    datasource: rpt_tableau__ddi_dashboard (kipptaf_tableau)
  - sql: coalesce(response_type, '') != 'walkthrough'
    datasource: rpt_tableau__ddi_dashboard (kipptaf_tableau)
  - (response_type is null or response_type = 'overall')
handled:
  "filter: Response Type [c06d56]":
    response_type is in every grain, so each response type is compared on its
    own.
  "filter: Academic Year [170633]":
    The year is the viewer's choice; 2025-26 and 2026-27 are each compared.
  "filter: Response Type [c1aae5]":
    response_type is in every grain, so each response type is compared on its
    own.
  "filter: Is Normed Scope [fa09b8]":
    "missing_members untagged_assessments: the *_without SQL keeps tagged
    assessments only."
rows:
  - row_gid: "1219284654682073"
    name: "% Complete (student-level, this week)"
    metrics:
      - cube: pct_taken
        kind: rate
        tableau:
          - "% Complete"
        datasource: rpt_tableau__ddi_dashboard (kipptaf_tableau)
        num:
          count(distinct if(is_complete = 1, concat(student_number, '-',
          assessment_id), null))
        den: count(distinct concat(student_number, '-', assessment_id))
    grains:
      - []
      - - region
        - grade_subject
        - module_code
        - title
        - assessment_id
      - - region
        - module_code
        - title
        - assessment_id
      - - assessment_id
      - - region
        - assessment_id
      - - region
        - school
        - assessment_id
    not_checked:
      - construct: "set: Exclude NULL Assessment ID [3982af]"
        why:
          A Tableau-only calculation, parameter or grouping with no Cube
          counterpart.
      - construct: "filter: is_current_week [fa09b8]"
        why:
          Narrows this sheet to a slice by a field Cube has no member for (term,
          discipline group, bright-spot status and the like), or hides future
          assessments; the check compares the unfiltered population.
      - construct: "lod: % Complete [d8a41a]"
        why:
          A Tableau-only calculation, parameter or grouping with no Cube
          counterpart.
  - row_gid: "1219087843079530"
    name: "% Completion (module completion rate)"
