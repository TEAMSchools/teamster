dashboard: ddi_suite_completion
task_gid: "1213823831345180"
extract:
  workbook_luid: 6d82b643-59a8-4106-b2f9-97ddf7f638e7
  datasource: rpt_tableau__assessment_dashboard (kipptaf_tableau)
cube_source_table: teamster-332318.kipptaf_marts.fct_assessment_scores_enrollment_scoped
view: student_assessment_scores_view
dashboards:
  - Landing Page
  - Mastery Over Time [Region]
  - Mastery Over Time [School]
  - Mastery Over Time [Classroom]
  - O3 View
  - DKI View
  - Module Dashboard
  - Assessment Dashboard
window:
  academic_years:
    - 2025
    - 2026
settle:
  days: 7
  date: coalesce(date_taken, administered_at)
  truth: coalesce(date_taken, administered_at) < '{cutoff}'
  cube:
    - or:
        - member: date_taken
          operator: beforeDate
          values:
            - "{cutoff}"
        - and:
            - member: date_taken
              operator: notSet
            - member: date_day
              operator: beforeDate
              values:
                - "{cutoff}"
dimensions:
  region:
    cube: region_name
    sql: region
  school:
    cube: abbreviation
    sql: school
  grade_level:
    cube: grade_level
    sql: grade_level
  academic_year:
    cube: academic_year
    sql: academic_year
  response_type:
    cube: response_type
    sql: coalesce(response_type, 'not_taken')
  assessment_id:
    cube: source_assessment_id
    sql: cast(assessment_id as string)
  title:
    cube: title
    sql: title
  module_type:
    cube: module_type
    sql: module_type
  module_code:
    cube: module_code
    sql: concat(module_type, module_number)
    sql_by_datasource:
      rpt_tableau__ddi_dashboard (kipptaf_tableau): module_code
  subject_area:
    cube: academic_subject
    sql: subject_area
  standard_code:
    cube: response_type_code
    sql: standard_code
    sql_by_datasource:
      rpt_tableau__ddi_dashboard (kipptaf_tableau): response_type_code
  section:
    cube: identifier
    sql: section_number
    sql_by_datasource:
      rpt_tableau__ddi_dashboard (kipptaf_tableau): course_section
  teacher:
    cube: staff_lead_teacher_full_name
    sql: teacher_name
    sql_by_datasource:
      rpt_tableau__ddi_dashboard (kipptaf_tableau): course_teacher_name
  iep:
    cube: is_iep
    sql: iep_status like '%SPED%'
    sql_by_datasource:
      rpt_tableau__ddi_dashboard (kipptaf_tableau): iep_status = 'Has IEP'
  performance_band:
    cube: performance_band_label_number
    sql: performance_band_number
    sql_by_datasource:
      rpt_tableau__ddi_dashboard (kipptaf_tableau):
        performance_band_label_number
  student_number:
    cube: lea_student_identifier
    sql: student_number
    person: true
  week_start:
    cube: null
    sql: week_start_monday
  term:
    cube: null
    sql: term
  discipline:
    cube: null
    sql: subject_area
  grade_subject:
    cube: null
    sql: concat(grade_level, subject_area)
  standard_label:
    cube: null
    sql: standard_code
  domain:
    cube: null
    sql: response_type_root_description
  bucket:
    cube: null
    sql: nj_student_tier
  ml:
    cube: null
    sql: lep_status
    sql_by_datasource:
      rpt_tableau__ddi_dashboard (kipptaf_tableau): ml_status
  team:
    cube: null
    sql: team
  school_level:
    cube: grade_band
    sql: school_level
  head_of_school:
    cube: null
    sql: head_of_school
  scope:
    cube: null
    sql: scope
  is_normed:
    cube: null
    sql: is_normed_scope
  view_by:
    cube: null
    sql: school
  goal:
    cube: null
    sql: grade_goal
  is_foundations:
