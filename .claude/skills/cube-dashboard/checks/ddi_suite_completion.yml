# Set from `cube_validate.py settle`; rerun it when the refresh schedule changes.
settle:
  days: 5
  date: coalesce(date_taken, administered_at)
  truth: coalesce(date_taken, administered_at) < '{cutoff}'
  cube:
    - or:
        - member: date_taken
          operator: beforeDate
          values:
            - "{cutoff}"
        - and:
            - member: date_taken
              operator: notSet
            - member: date_day
              operator: beforeDate
              values:
                - "{cutoff}"
