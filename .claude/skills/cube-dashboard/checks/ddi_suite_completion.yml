hard_filters:
  - dim: region
    values:
      - Camden
      - Newark
      - Paterson
cube_filters:
  - member: assessment_type
    operator: equals
    values:
      - illuminate
  - member: response_type
    operator: equals
    values:
      - overall
      - not_taken
        # rpt_tableau__ddi_dashboard drops WPP assessments (its module_type != 'WPP'
        # filter), so Cube leaves them out beside that extract only.
  - member: module_type
    operator: notEquals
    values:
      - WPP
    datasource: rpt_tableau__ddi_dashboard (kipptaf_tableau)
truth_filters:
  - sql: student_number is not null
    datasource: rpt_tableau__ddi_dashboard (kipptaf_tableau)
  - sql: coalesce(response_type, '') != 'walkthrough'
    datasource: rpt_tableau__ddi_dashboard (kipptaf_tableau)
  - (response_type is null or response_type = 'overall')
handled:
  "filter: Response Type [c06d56]":
    response_type is in every grain, so each response type is compared on its
    own.
  "filter: Academic Year [170633]":
    The year is the viewer's choice; 2025-26 and 2026-27 are each compared.
  "filter: Response Type [c1aae5]":
    response_type is in every grain, so each response type is compared on its
    own.
  "filter: Is Normed Scope [fa09b8]":
    The untagged_assessments mismatch's variants keep tagged assessments only.
open_issues_task: "1219086050133309"
mismatches:
  completion_always_100:
    title:
      "fix(tableau): DDI Module Dashboard's 75% completion filter never hides a
      module, because % Completion reads 100% everywhere"
    fix: dashboard
    what:
      'The Module Dashboard''s % Completion divides "# Students Complete -
      Overall" by "# Students Possible - Overall". Both count only rows whose
      response type is overall, and every overall row has a score, so a student
      who never tested counts in neither. The value is 100% wherever anyone
      tested. People see it in two places: the "% Completion: From 75%" filter
      at the top, which is meant to hide low-completion modules and never hides
      one, and the Summary column in the drill-down panel after clicking an
      assessment, which always reads 100%.'
    evidence:
      In the extract, no module x school x grade group in Camden, Newark or
      Paterson falls below 100%.
  untagged_assessments:
    title:
      "fix: decide whether Cube answers for Illuminate assessments with no
      AppSheet tag"
    what:
      Cube carries only the assessments tagged in AppSheet. The DDI Suite's
      Assessment Dashboard tab shows every Illuminate assessment, tagged or not,
      so its counts run higher. Either Cube adds untagged assessments, or the
      Assessment Dashboard shows tagged ones only.
    fix: undecided
    evidence:
      "Seek, 2025-26, overall rows in the top band: Cube 5,819; the extract
      23,368, of which 5,916 are tagged."
  illuminate_dates_disagree:
    title: "data(illuminate): assessments whose year tag and date disagree"
    what:
      For 8 assessments, Illuminate's year tag and the assessment date point to
      different school years (one date was typed a year late), so the dashboard
      files them by the tag and Cube by the date. Fixing the source data fixes
      both.
    fix: source
    issue: 3801
    evidence:
      Assessments 185525, 186256, 188349, 188353, 189131, 189344, 189353,
      189354.
  fact_repeats_rows:
    title:
      "fix(cube): the assessment fact has more rows than students on 49 DDI
      assessments"
    what:
      "On 49 Illuminate assessments in 2025-26 and 2026-27, the assessment fact
      behind Cube has more rows than students: 6,476 extra rows. They count as
      assigned, so Cube's % Complete runs low. On 2026-27's three largest, the
      tested counts match the dashboard and the extra rows are not-tested
      placeholders."
    fix: cube
    evidence:
      "2026-27 % Complete: Cube 71.9%, the DDI weekly extract 73.5%; without
      these assessments and the misdated ones, Cube 73.0%. Assessments: 186226,
      189859, 189866, 203401, 203403, 203406, 203409, 203413, 203416, 203417,
      203420, 203424, 203427, 203435, 203437, 203439, 203441, 203449, 203639,
      204224, 204251, 204264, 204292, 204866, 204869, 204996, 204999, 205002,
      205008, 205010, 205012, 205156, 205780, 205956, 206202, 206205, 206208,
      206212, 206216, 206220, 206712, 206835, 207058, 207066, 207845, 226255,
      226299, 226306, 226804."
