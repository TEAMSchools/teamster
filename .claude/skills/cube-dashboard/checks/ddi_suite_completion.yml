members:
  untagged_assessments:
    what:
      Illuminate assessments with no AppSheet tag (is_normed_scope false). The
      Assessment Dashboard view shows them; the Module Dashboard and DKI views
      do not.
    lives_in:
      rpt_tableau__assessment_dashboard carries every Illuminate assessment;
      fct_assessment_scores_enrollment_scoped's internal branch carries tagged
      ones only.
    suggested_edit:
      Decide whether Cube should answer for untagged assessments. If so, carry
      them in the fact (or a sibling fact) with is_internal_assessment false; if
      not, scope the Assessment Dashboard rebuild to tagged assessments.
