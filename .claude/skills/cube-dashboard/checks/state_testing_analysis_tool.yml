members:
  dashboard_discipline:
    what:
      "The dashboard's discipline: Math holds the grade-level tests plus Algebra
      I (ALG01) and Geometry (GEO01)."
    lives_in:
      The extract's discipline field. Cube has academic_subject, which names
      Algebra I and Geometry separately, and courses.discipline, which comes
      from the score's section and is empty for homeroom-resolved scores.
    suggested_edit:
      Settle which subjects count as math (an open network question in the
      assessment orchestrator), then add that test-level discipline to
      dim_assessments and expose it on student_assessment_scores_view.
  grade_range_group:
    what:
      "The dashboard's grade range: each test-and-grade pair binned as 3-8 or
      HS."
    lives_in:
      A Tableau group over test_code and grade_level in the STAT workbook.
    suggested_edit:
      Decide whether grade range is a reporting definition the network keeps; if
      so, add it to dim_assessments or the enrollment dim and expose it on the
      view.
