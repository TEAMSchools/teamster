dashboards:
  - State Testing Analysis Tool (STAT) - Landing Page
  - Overview
  - Demographics
  - Teacher/Student Roster
  - Proficiency YoY
  - Advanced Comps
window:
  academic_years:
    - 2025
dimensions:
  region:
    cube: region_name
    sql: region
  state:
    cube: state
    sql: case when region = 'Miami' then 'FL' else 'NJ' end
  school:
    cube: abbreviation
    sql: school
  school_level:
    cube: grade_band
    sql: school_level
  test_code:
    cube: module_code
    sql: test_code
  admin:
    cube: administration_period
    sql: admin
  grade_level:
    cube: grade_level
    sql: grade_level
  academic_year:
    cube: academic_year
    sql: cast(academic_year as int64)
  discipline:
    cube: academic_subject
    sql:
      case when test_code = 'ALG01' then 'Algebra I' when test_code = 'GEO01'
      then 'Geometry' when discipline = 'ELA' then 'English Language Arts' when
      discipline = 'Math' then 'Mathematics' else discipline end
  dashboard_discipline:
    cube: null
    sql: discipline
  performance_band:
    cube: proficiency_level
    sql: performance_band
  performance_band_level:
    cube: performance_band_label_number
    sql: performance_band_level
  is_proficient:
    cube: is_mastery
    sql: is_proficient
  ml:
    cube: is_ell
    sql: lep_status
  iep:
    cube: is_iep
    sql: iep_status
  gifted:
    cube: is_gifted
    sql: gifted_and_talented
  teacher:
    cube: staff_lead_teacher_full_name
    sql: teacher_name
    person: a teacher
  student_number:
    cube: lea_student_identifier
    sql: student_number
    person: true
  proficiency_standard:
    cube: null
    sql: is_proficient
  below_far_below:
    cube: null
    sql: performance_band_level
  is_504:
    cube: null
    sql: is_504
  nj_student_tier:
    cube: null
    sql: nj_student_tier
  ms_attended:
    cube: null
    sql: ms_attended
  teacher_current:
    cube: null
    sql: teacher_name_current
    person: a teacher
  school_current:
    cube: null
    sql: school_current
  most_recent_grade_level:
    cube: null
