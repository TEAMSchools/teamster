# Tableau shows grade 0 as "K".
# Mapped: the aggregate sheets. Skipped (agreed 2026-10-13): the student-level
# distributions, the link and filter sheets.
sheets:
  Module - Overall - Network Overview:
    datasource: rpt_tableau__assessment_dashboard (kipptaf_tableau)
    dims:
      Grade Level:
        {
          cube: student_assessment_scores_view.grade_level,
          sql: grade_level,
          values: { K: "0" },
        }
      # Shows the school's abbreviation (an alias of the id).
      Schoolid:
        { cube: student_assessment_scores_view.abbreviation, sql: school }
      Title: { cube: student_assessment_scores_view.title, sql: title }
    measures: &mastery
      Mastery:
        cube: student_assessment_scores_view.pct_proficient
        sql: avg(case when is_mastery then 1.0 when not is_mastery then 0.0 end)
  Module - Overall - Summary:
    datasource: rpt_tableau__assessment_dashboard (kipptaf_tableau)
    dims:
      ATTR(STR([Grade Level])):
        {
          cube: student_assessment_scores_view.grade_level,
          sql: grade_level,
          values: { K: "0" },
        }
      Module Number Raw:
        { cube: student_assessment_scores_view.module_code, sql: module_number }
      Module Type:
        { cube: student_assessment_scores_view.module_type, sql: module_type }
      Subject Area:
        {
          cube: student_assessment_scores_view.academic_subject,
          sql: subject_area,
        }
    # Avg. % Completion is a fixed-level calculation averaged across schools and
    # grades; it reads 100% everywhere (#5891), so it stays unmapped.
    measures:
      <<: *mastery
      Avg. Percent Correct:
        cube: student_assessment_scores_view.avg_percent_correct
        sql: avg(percent_correct)
  Module - Overall - Teacher:
    datasource: rpt_tableau__assessment_dashboard (kipptaf_tableau)
    dims:
      Grade Level:
        {
          cube: student_assessment_scores_view.grade_level,
          sql: grade_level,
          values: { K: "0" },
        }
      Module Number Raw:
        { cube: student_assessment_scores_view.module_code, sql: module_number }
      school: { cube: student_assessment_scores_view.abbreviation, sql: school }
      Section Number:
        cube:
          - student_assessment_scores_view.course_title
          - student_assessment_scores_view.identifier
        sql: course_name || ' - ' || section_number
        # HS labels read "<teacher> - <course> - <section>"; ES/MS labels read
        # "G<grade> - <teacher> - <section>" (kindergarten as G0, K or GK).
        # Anchored so neither pattern can capture a teacher's name.
        keys:
          - ^(?!G?(?:\d+|K) - ).*? - (.+ - \S+)$
          - ^G?(?:\d+|K) - .* - (\S+)$
      Title: { cube: student_assessment_scores_view.title, sql: title }
    # Teacher Name stays unmapped: never a dimension.
    measures: *mastery
  Module - Overall - Band Distribution:
    datasource: rpt_tableau__assessment_dashboard (kipptaf_tableau)
    # The LOD band column exports blank; the band shows in Performance Band Number.
    # % of Students is a share of rows, not of students: verified to reproduce
    # all 5 band percentages on the 2026-10-09 extract.
    dims:
      Performance Band Number:
        cube: student_assessment_scores_view.performance_band_label_number
        sql: performance_band_number
    measures:
      Distinct count of Student Number:
        cube: student_assessment_scores_view.count_students
        sql: count(distinct student_number)
      "% of Students":
        cube: student_assessment_scores_view.count_scored
        sql: count(student_number)
        table_calc: percent_of_total
  # Performance Band (group) is a Tableau group of band numbers; compare checks
  # it bin by bin from the manifest's groups.
  Module - Standard - Band Distribution:
    datasource: rpt_tableau__assessment_dashboard (kipptaf_tableau)
    dims:
      Performance Band (group):
        {
          cube: student_assessment_scores_view.performance_band_label_number,
          sql: performance_band_number,
        }
      Standard Code:
        {
          cube: student_assessment_scores_view.response_type_code,
          sql: standard_code,
        }
      Standard Description:
        {
          cube: student_assessment_scores_view.response_type_description,
          sql: standard_description,
        }
      Title: { cube: student_assessment_scores_view.title, sql: title }
    measures:
      <<: *mastery
      Avg. Percent Correct:
        cube: student_assessment_scores_view.avg_percent_correct
        sql: avg(percent_correct)
  Module - Overall - Assessments Over Time:
    datasource: rpt_tableau__assessment_dashboard (kipptaf_tableau)
    dims:
      Grade Level:
        {
          cube: student_assessment_scores_view.grade_level,
          sql: grade_level,
          values: { K: "0" },
        }
      Module Number Raw:
        { cube: student_assessment_scores_view.module_code, sql: module_number }
      Module Type:
        { cube: student_assessment_scores_view.module_type, sql: module_type }
      Module Type (group):
        { cube: student_assessment_scores_view.module_type, sql: module_type }
      Schoolid:
        { cube: student_assessment_scores_view.abbreviation, sql: school }
      Title: { cube: student_assessment_scores_view.title, sql: title }
    # Avg. % Completion is left unmapped, as on Summary.
    measures:
      <<: *mastery
      Avg. % Mastery - IEP:
        cube: student_assessment_scores_view.pct_proficient
        sql: avg(case when is_mastery then 1.0 when not is_mastery then 0.0 end)
        where: strpos(iep_status, 'SPED') > 0
        cube_filters:
          - member: student_assessment_scores_view.is_iep
            operator: equals
            values: ["true"]
      Avg. % Mastery - Gen Ed:
        cube: student_assessment_scores_view.pct_proficient
        sql: avg(case when is_mastery then 1.0 when not is_mastery then 0.0 end)
        # Tableau's NOT CONTAINS on a blank status is blank, so a blank stays out.
        where: strpos(iep_status, 'SPED') = 0
        cube_filters:
          - member: student_assessment_scores_view.is_iep
            operator: equals
            values: ["false"]
      "% Mastery - IEP Diff from GenEd":
        diff: [Avg. % Mastery - IEP, Avg. % Mastery - Gen Ed]

mismatches:
  # Built in; this attaches the filed issue (rollup build range, 2026-10-13).
  cube-routes-disagree:
    issue: 5883
  # Off-grade scores: the dashboard counts them under the enrolled grade, Cube's
  # fact drops them. A variant ties cells to it once the live run shows which.
  off-grade-scores:
    title:
      "fix(cube): decide whether a score on another grade's assessment counts,
      since the DDI dashboard counts it and Cube drops it"
    what: >-
      Students who sat another grade's assessment count on the dashboard under
      their enrolled grade; Cube's fact leaves those rows out.
    fix: undecided
    issue: 5885

