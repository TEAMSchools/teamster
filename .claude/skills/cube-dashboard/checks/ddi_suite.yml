      - construct: "filter: Dashboard View Filter [747a2f]"
        why:
          Narrows this sheet to a slice by a field Cube has no member for (term,
          discipline group, bright-spot status and the like), or hides future
          assessments; the check compares the unfiltered population.
      - construct: "table_calc: Mastery [774b8e]"
        why:
          Computed from the table on screen (share of total, rank or running
          value); the base aggregate is checked.
      - construct: "group: School Level (School) [5ba400]"
        why:
          A Tableau-only calculation, parameter or grouping with no Cube
          counterpart.
members:
  untagged_assessments:
    what:
      Illuminate assessments with no AppSheet tag (is_normed_scope false). The
      Assessment Dashboard view shows them; the Module Dashboard and DKI views
      do not.
    lives_in:
      rpt_tableau__assessment_dashboard carries every Illuminate assessment;
      fct_assessment_scores_enrollment_scoped's internal branch carries tagged
      ones only.
    suggested_edit:
      Decide whether Cube should answer for untagged assessments. If so, carry
      them in the fact (or a sibling fact) with is_internal_assessment false; if
      not, scope the Assessment Dashboard rebuild to tagged assessments.
