# Team (homeroom) and head of school are left out of the trees: the descent
# stops at the last level with a Cube member, and Cube has neither (school
# implies head of school).

# The DDI Suite shows Illuminate assessments in Camden, Newark and Paterson.
cube_filters:
  - member: student_assessment_scores_view.assessment_type
    operator: equals
    values:
      - illuminate
  - member: student_assessment_scores_view.region_name
    operator: equals
    values:
      - Camden
      - Newark
      - Paterson

# Filter captions not shown as a column. School ids map to Cube's abbreviation
# through the extract's `school` column; 5173 spans several schools, so it has
# no lookup and its states report a missing member.
filters:
  Region:
    cube: student_assessment_scores_view.region_name
  Schoolid:
    cube: student_assessment_scores_view.abbreviation
    values: &schools
      "73258": BOLD
      "732513": Justice
      "73259": KURA
      "73257": Life
      "73253": NCA
      "732511": NLH
      "732514": Purpose
      "73252": Rise
      "73256": Seek
      "73254": SPARK
      "133570965": TEAM
      "73255": THRIVE
      "179903": Hatch
      "179904": KHS
      "179902": LSM
      "179901": LSP
      "179905": Sumner
      "1234": PPES
      "2": PPMS
  # A Tableau group of school ids; each bin expands to the ids the extract has,
  # all in the lookup but 5173, which falls in Other.
  School Level (School):
    cube: student_assessment_scores_view.abbreviation
    values: *schools
  NJ Tutoring:
    cube: null
    sql: case when tutoring_nj then 'Tutored' else 'Not Tutored' end
  Academic Year:
    cube: student_assessment_scores_view.academic_year
  # A Tableau group of subject areas; its bin members are the same strings as
  # Cube's academic_subject.
  Subject Area (group):
    cube: student_assessment_scores_view.academic_subject
  Response Type:
    cube: student_assessment_scores_view.response_type
    values:
      O: overall
      overall: overall
      standard: standard
      group: group
  Performance Band Number:
    cube: student_assessment_scores_view.performance_band_label_number
  Standard Code:
    cube: student_assessment_scores_view.response_type_code
  Standard Description:
    cube: student_assessment_scores_view.response_type_description
  Grade Level:
    cube: student_assessment_scores_view.grade_level
  Module Type:
    cube: student_assessment_scores_view.module_type
  # DDI's module code is the module_number column.
  Module Number Raw:
    cube: student_assessment_scores_view.module_code
  Lep Status:
    cube: student_assessment_scores_view.is_ell
  Is Foundations:
    cube: student_assessment_scores_view.is_foundations
  Is Replacement:
    cube: student_assessment_scores_view.is_replacement

# Is Normed Scope hides nothing today (every default row is normed); compare
# warns if that changes. % Completion is a FIXED-LOD filter compare cannot
# count; it hides nothing while the measure reads 100% everywhere (#5891).
ignore_sheet_filters: ["% Completion", Is Normed Scope]

# A grade spans schools, so `plan` would make grade a cross-cut; the analyst
# descends school, then grade.
accept_nesting:
  - [grade_level, schoolid]

# From `plan` on 2026-10-09, agreed with the analyst.
trees:
  rpt_tableau__assessment_dashboard (kipptaf_tableau):
    region:
      - region
      - schoolid
      - grade_level
    module_type:
      - module_type
      - module_number

# Team is left out: Cube has no member for it, so each team state would end
# missing_member, and a homeroom value can name a person.
cross_cuts:
  rpt_tableau__assessment_dashboard (kipptaf_tableau):
    - c_504_status
    - dibels_most_recent_composite
    - iep_status
    - is_foundations
    - is_pathways
    - is_replacement
    - is_sipps
    - lep_status
    - nj_student_tier
    - state_test_proficiency
    - subject_area
    - territory
