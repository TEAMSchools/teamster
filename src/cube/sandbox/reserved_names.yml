  - Taurasi
  - Swoopes
  - Catchings
  - Fowles
  - Griner
  - Ionescu
  - McCoughtry
  - Ogwumike
  - Delle Donne
  - Plum
  - Diggins-Smith
  - Sutton-Brown
  - Weatherspoon
  - Vandersloot
  - Ogunbowale
  - Meesseman
  - Holdsclaw
  - Magbegor
  - Loyd
  - Ndour

  # NBA
  - Antetokounmpo
  - Dončić
  - Jokić
  - Embiid
  - Wembanyama
  - Ginóbili
  - Nowitzki
  - Mutombo
  - Divac
  - Kukoč
  - Gasol
  - O'Neal
  - O'Quinn
  - Ilgauskas
  - Porziņģis
  - Valančiūnas
  - Siakam
