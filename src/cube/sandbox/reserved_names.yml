# KTAF reserved synthetic-person namespace.
#
# Fabricated people, built from the names of public and fictional figures:
# professional basketball players active within the last thirty years, and
# Marvel characters. They describe no KTAF person, so this file carries no
# PII and is committed deliberately.
#
# THE CONTRACT
#
# Every synthetic person takes a surname from `surnames` and a given name
# from `given_names`.
#
# What makes a name self-identifying is not that the word is invented. It is
# that NO KTAF PERSON HAS ONE. Measured against production on 2026-09-24: of
# 4,807 staff, ZERO carry a surname from this list, and across 31,297
# students no surname here appears either. Given names are not held to that
# bar and do not need to be — 91 staff share one — because the surname is
# the tripwire.
#
# That is a weaker guarantee than the coined surnames it replaces
# (Fennworth, Quillamber and the rest), and the trade is deliberate. Coined
# words were self-evidently fake to anyone reading one. These are only
# verifiably absent, which a person cannot see and a script can. The
# tripwire itself is unchanged and is the part that matters: a surname
# outside this list means something has gone wrong.
#
# ADDING A NAME: run it against production first.
#
#   SELECT COUNT(*) FROM `teamster-332318.kipptaf_marts.dim_staff`
#   WHERE LOWER(last_name) = LOWER('<candidate>')
#
# plus the matching `\b<candidate>\b` check against dim_students.full_name.
# Anything above zero is out, however good the name is.
#
# REJECTED, and why, so nobody re-proposes them:
#
#   Basketball   Stewart (65 real people), Leslie (12), Iverson (8), Ewing,
#                Olajuwon, Rodman, Barkley, Whalen, Augustus, Bonner, Boston,
#                Charles, Collier, Cooper, Dupree, Griffith, Sims, Toliver.
#   Marvel/X-Men Parker (79), Xavier (76), Rogers (55), Barnes (46),
#                McCoy (23), Richards (17), Grey, Wagner, Drake, Summers,
#                Braddock, Banner, Octavius.
#   Wu-Tang      Legal surnames only: Smith (407), Jones (388), Hill (93),
#                Turner (80), Hunter (47), Hawkins (36), Woods (24),
#                Diggs (11), Coles (10), Grice (2). Every one collides.
#   No Limit /   Same problem, worse: Williams (699), Jackson (288),
#   Cash Money   Thomas (218), Carter (142), Miller (122), Young (78),
#                Tyler (60), Gray (48), Dorsey (14), Virgil (4). All ten out.
#
# Stage names would have passed where legal names did not, which is the
# whole lesson: a performer's invented name is reserved the way a coined
# word is, and their given name is as common as anyone else's.
#
# Given names carry the character class they exercise, because that is where
# the characters that break layout, sorting and escaping live. Coverage
# asserts every class appears in a generated dataset rather than trusting a
# random sample to include the hard ones.

# 59 surnames: 20 WNBA, 20 NBA, 19 Marvel and X-Men. Every one verified to
# match no KTAF staff member and no KTAF student.
surnames:
