# Each entry names the class it exercises. `plain` entries are the common
# case; every other class must appear at least once in a generated dataset.
given_names:
  - { name: Diana, class: plain }
  - { name: Sheryl, class: plain }
  - { name: Tamika, class: plain }
  - { name: Sylvia, class: plain }
  - { name: Brittney, class: plain }
  - { name: Nneka, class: plain }
  - { name: Sabrina, class: plain }
  - { name: Kelsey, class: plain }
  - { name: Joel, class: plain }
  - { name: Dirk, class: plain }
  - { name: Dikembe, class: plain }
  - { name: Vlade, class: plain }
  - { name: Pascal, class: plain }
  - { name: Ororo, class: plain }
  - { name: Wanda, class: plain }

  # Very short. Often mistaken for a truncation bug.
  - { name: Pau, class: short }
  - { name: Manu, class: short }
  - { name: Sue, class: short }
  - { name: Ezi, class: short }
  - { name: Riri, class: short }

  # Single character. Breaks initials logic and fixed-width columns.
  # Professor X goes by exactly this, which is the only reason a one-letter
  # name in here is not a fabrication of convenience.
  - { name: X, class: single_char }
  - { name: J, class: single_char }

  # Apostrophe. Breaks naive SQL string building and CSV quoting, and is the
  # most common hard character in the real data — 7.1% of enrolled students
  # carry one.
  - { name: T'Challa, class: apostrophe }
  - { name: A'ja, class: apostrophe }
  - { name: D'Angelo, class: apostrophe }
  - { name: De'Aaron, class: apostrophe }

  # Hyphen. Breaks tokenizing on the separator.
  - { name: Jean-Paul, class: hyphen }
  - { name: Karl-Anthony, class: hyphen }

  # Space inside the given name. Breaks "split on space to get the surname".
  - { name: Anna Marie, class: internal_space }
  - { name: José Juan, class: internal_space }

  # Diacritics. Break collation, sorting, and naive ASCII normalisation.
  # Every non-ASCII name in production is accented Latin — zero non-Latin
  # script and zero right-to-left, across both staff and students — so those
  # two classes were removed rather than fabricated.
  - { name: Žydrūnas, class: diacritic }
  - { name: Dāvis, class: diacritic }
  - { name: Nicolò, class: diacritic }
  - { name: Théo, class: diacritic }

  # Internal capital. Breaks title-casing that lowercases the rest.
  - { name: DeMar, class: internal_capital }
  - { name: LaMelo, class: internal_capital }
  - { name: JaVale, class: internal_capital }

  # All caps, as source systems frequently store it.
  - { name: CANDACE, class: all_caps }

  # Long enough to overflow a column.
  - { name: Chamique, class: long }
  - { name: Shaquille, class: long }
  - { name: Domantas, class: long }
