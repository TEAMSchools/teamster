# Cube never loads this folder (it reads src/cube/model/ only). Network-grant
# email: pass --email or set CUBE_VALIDATION_EMAIL; never write it here.
view: student_attendance_enrollment_daily_view
fact: kipptaf_marts.fct_student_attendance_enrollment_daily
time_dimension: attendance_date
shared:
  # One row per student and code day, as rpt_tableau__attendance_dashboard
  # keeps them.
  grain: &grain
    - { dashboard: student_number, cube: lea_student_identifier }
    - { dashboard: calendardate, cube: attendance_date }
  # The Grade Rollup and Roster sheets show currently enrolled students only
  # (enroll_status = 0). Cube has no enroll-status member, so students who left
  # read as Cube-only rows.
  enrolled: &enrolled
    confirmed: true
    workbook: 87c13e78-a912-40a4-95dd-33248fc1cbd3
    dashboard_view: kipptaf_tableau.rpt_tableau__attendance_dashboard
    filters:
      Academic Year: { dashboard: academic_year, cube: dates_academic_year }
      Region: { dashboard: region, cube: regions_region_name }
    defaults: { Academic Year: "2026", Region: [Camden, Newark, Paterson] }
    cuts: [{}, { Region: Miami }]
    dashboard_filters:
      - { dashboard: enroll_status, values: [0] }
    scope:
      - { cube: membership_value, values: [1] }
      - { cube: attendance_value, operator: set }
  # A student who changed homeroom or school exports one Roster row per Team,
  # Teacher Name and Schoolid; every Roster field adds up, so those rows sum.
  roster: &roster
    <<: *enrolled
    sheet: Student - Attendance Roster
    decimals: 0
    split_rows: sum
    dims:
      - { dashboard: student_number, cube: lea_student_identifier }
      - { dashboard: grade_level, cube: grade_level }
