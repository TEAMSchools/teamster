view: student_attendance_enrollment_daily_view
fact: kipptaf_marts.fct_student_attendance_enrollment_daily
time_dimension: attendance_date

shared:
  base: &base
    confirmed: true
    workbook: 87c13e78-a912-40a4-95dd-33248fc1cbd3
    dashboard_view: kipptaf_tableau.rpt_tableau__attendance_dashboard
    cuts: [{}]
    rows:
      grain:
        - { dashboard: student_number, cube: lea_student_identifier }
        - { dashboard: calendardate, cube: attendance_date }
      values:
        - { dashboard: is_present, cube: attendance_value }
        - { dashboard: is_tardy, cube: is_tardy }
        - { dashboard: att_code, cube: attendance_code }
    # The fact keeps a row for every enrolled break day; the dashboard keeps
    # school days only.
    scope:
      - { cube: is_in_session_day, values: [true] }
    proof: null

  # Student Attendance Tracker sheets share the year, region and enroll
  # status filters (filter groups 19, 35 and 5). Cube codes enrollment status
  # as a label, so the dashboard's code 0 is a dashboard filter and Cube's
  # "Currently Enrolled" a scope.
  student_tracker: &student_tracker
    <<: *base
    filters:
      Academic Year: { dashboard: academic_year, cube: dates_academic_year }
      Region: { dashboard: region, cube: regions_region_name }
    defaults: { Academic Year: "2026", Region: [Camden, Newark, Paterson] }
    dashboard_filters:
      - { dashboard: enroll_status, values: [0] }
    scope:
      - { cube: is_in_session_day, values: [true] }
      - { cube: enrollment_status, values: [Currently Enrolled] }

  roster: &roster
    <<: *student_tracker
    sheet: Student - Attendance Roster
    dims:
      - { dashboard: student_number, cube: lea_student_identifier }
      - { dashboard: grade_level, cube: grade_level }
    shelves: { drop: [Lastfirst, Team, Teacher Name] }

  # Exclude HRs (a set on the Homeroom calc) drops homerooms from this sheet,
  # and Cube has no homeroom member to map it to. Whether those homerooms
  # belong in the counts is an owner question for the review.
  team_counts: &team_counts
    <<: *student_tracker
    sheet: Student - Team Counts
    dims:
      - { dashboard: term, cube: terms_term_name }
    shelves: { drop: [Homeroom] }

  # Attendance Rollup: the Attendance Metric parameter picks the measure.
  y1: &y1
    <<: *base
    sheet_field: Avg. Attendance Metric
    filters:
      Academic Year: { dashboard: academic_year, cube: dates_academic_year }
      Region: { dashboard: region, cube: regions_region_name }
      Grade Level: { dashboard: grade_level, cube: grade_level }
      School Level: { dashboard: school_level, cube: locations_grade_band }
    defaults: { Academic Year: "2026", Region: [Camden, Newark, Paterson] }
    dims:
      - { dashboard: school_abbreviation, cube: locations_abbreviation }
      - { dashboard: grade_level, cube: grade_level }

comparisons:
  # --- Student - Grade Rollup ------------------------------------------------
  - id: ada-grade-rollup
    <<: *student_tracker
    measure: avg_daily_attendance
    sheet: Student - Grade Rollup
    sheet_field: "% ADA"
    probe: avg(is_present)
    decimals: 3
    dims:
      - { dashboard: grade_level, cube: grade_level }
    definitions:
      dashboard:
        Average of is_present over the report's day rows, enrolled students
        (enroll_status 0), NJ regions.
      cube:
        avg_daily_attendance, sum of attendance_value over full-membership days
        with recorded attendance.
    proof:
      fingerprint: 1f0bf42a77c8b8b6cf663e930582ac115d26618d2185e3c1af8de5bb9645b81d
      cells: 13
      proven_at: "2026-10-31T00:01:32.842474+00:00"
      workbook_updated_at: "2026-10-30T19:15:07+00:00"
      probe_fingerprint: d9da557dc13628af139773ffa540d01427e9eee0336891b9535f4155ba914057
      source_fingerprint: d23a125a36dda494e2bd783996f887680171ac3b37b4d8fbc650381c73a60562
      cuts:
        - "{}"
      totals_skipped: 1
      missing_cuts: []
      missing_filters:
        - Enroll Status
        - Iep Status
        - Is Truant Current
        - School
        - Schoolid
        - Term
      restricting_filters:
        - Enroll Status
      filter_notes: {}
      missing_columns:
        Enroll Status: enroll_status
        Term: term
        School: school_abbreviation
        Schoolid: schoolid
        Iep Status: iep_status

  - id: ontime-grade-rollup
    <<: *student_tracker
    measure: pct_ontime
    sheet: Student - Grade Rollup
    sheet_field: "% On-Time"
    probe: >-
      avg(case when is_present = 0 then null else 1 - if(att_code in ('ET', 'T',
      'T10', 'TLE'), 1, 0) end)
    decimals: 3
    dims:
      - { dashboard: grade_level, cube: grade_level }
    definitions:
      dashboard:
        Share of non-absent day rows whose att_code is not in the Tardy group
        (ET, T, T10, TLE).
      cube:
        pct_ontime, on-time present days over present days; tardy is any
        T-prefixed code.
    proof:
      fingerprint: 1f0bf42a77c8b8b6cf663e930582ac115d26618d2185e3c1af8de5bb9645b81d
      cells: 13
      proven_at: "2026-10-31T00:02:08.807538+00:00"
