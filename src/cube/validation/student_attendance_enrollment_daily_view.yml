  - id: truant-y1-region
    <<: *y1
    measure: pct_truant
    sheet: Y1 ADA - Region
    parameters: { Attendance Metric: Truant/On Track for Truancy }
    filters:
      Academic Year: { dashboard: academic_year, cube: dates_academic_year }
      Region: { dashboard: region, cube: regions_region_name }
      Calendardate: { dashboard: calendardate, cube: attendance_date }
    cuts: [{ Calendardate: "2026-10-29" }]
    dims:
      - { dashboard: region, cube: regions_region_name }
      - { dashboard: grade_level, cube: grade_level }
    rows:
      grain:
        - { dashboard: student_number, cube: lea_student_identifier }
        - { dashboard: calendardate, cube: attendance_date }
      values:
        - { dashboard: is_truant, cube: is_truant }
        - { dashboard: is_present, cube: attendance_value }
    probe_sql: >-
      SELECT {dims}, AVG(t) AS value FROM (
        SELECT r.*, f.t FROM ({rows}) AS r
        LEFT JOIN (
          SELECT student_number AS sn, academic_year AS ay,
            MAX(IF(calendardate = (SELECT MAX(calendardate) FROM ({rows}))
              AND enroll_status = 0, CAST(is_truant AS INT64), NULL)) AS t
          FROM ({rows}) GROUP BY 1, 2) AS f
        ON f.sn = r.student_number AND f.ay = r.academic_year
        WHERE {where})
      GROUP BY {dims}
    decimals: 3
    definitions:
      dashboard:
        Each enrolled student's truancy flag on the report's latest date,
        averaged over the slice's day rows.
      cube:
        pct_truant, students meeting the regional truancy rule as of the pinned
        date over students with recorded attendance.
    proof:
      fingerprint: 4c3c569aa99d615df55fe7939d966b4fd1d76f3de2acc77ce418d5e47fc29b1c
      cells: 35
