  - id: ontime-grade-rollup
    <<: *enrolled
    measure: pct_ontime
    sheet: Student - Grade Rollup
    sheet_field: "% On-Time"
    # The workbook's Tardy code group, not is_tardy.
    probe: >-
      AVG(CASE WHEN is_present = 0 THEN NULL WHEN att_code IN ('ET', 'T', 'T10',
      'TLE') THEN 0 ELSE 1 END)
    decimals: 3
    dims:
      - { dashboard: grade_level, cube: grade_level }
    rows:
      grain: *grain
      values:
        - { dashboard: att_code, cube: attendance_code }
