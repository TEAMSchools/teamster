    comparison: absences-roster
    cells: true
    call: domain_owner
    reason:
      "704 students differ: the dashboard counts the Absent code group (A, A-E,
      AD, D, X); Cube counts every membership day worth 0 attendance (1 -
      attendance value), which takes in other codes. Most differing cells are
      Miami, whose codes the workbook's group does not list. 22 cells where Cube
      has a value and the dashboard is blank are not yet explained. Owner: which
      absence count is right?"
    fingerprints: *id003
