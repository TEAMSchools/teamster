      totals_skipped: 1
      missing_cuts: []
      missing_filters:
        - Enroll Status
        - Iep Status
        - Is Truant Current
        - School
        - Schoolid
        - Term
      restricting_filters:
        - Enroll Status
      filter_notes: {}
      missing_columns:
        Enroll Status: enroll_status
        Term: term
        School: school_abbreviation
        Schoolid: schoolid
        Iep Status: iep_status

