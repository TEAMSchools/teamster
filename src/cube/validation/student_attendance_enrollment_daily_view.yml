    comparison: tardy-roster
    cells: true
    call: domain_owner
    reason:
      "58 students differ by the tardy code list: the dashboard counts ET, T,
      T10, TLE; Cube counts codes starting with T (adds TD and TE, omits ET). In
      Miami, Cube is blank where the dashboard shows 0: Miami has no tardy flag
      (is_tardy is null on every Miami row this year). Owner: which definition
      is right, and should Miami tardies read 0 or blank?"
    fingerprints: *id002
