  # --- Attendance Rollup: chronic absenteeism and truancy ---------------------
  # Both are student-level LOD calcs in the workbook. The cut pins one school
  # day, where each student's last date in the slice is that day, so rows pair
  # 1:1 with Cube's daily rows and Cube's "as of the pinned date" rates apply.
  - id: chronic-y1-region
    <<: *y1
    measure: pct_chronically_absent
    sheet: Y1 ADA - Region
    parameters: { Attendance Metric: Chronic Absenteeism }
    filters:
      Academic Year: { dashboard: academic_year, cube: dates_academic_year }
      Region: { dashboard: region, cube: regions_region_name }
      Calendardate: { dashboard: calendardate, cube: attendance_date }
    cuts: [{ Calendardate: "2026-10-29" }]
    dims:
      - { dashboard: region, cube: regions_region_name }
      - { dashboard: grade_level, cube: grade_level }
    probe_sql: >-
      SELECT {dims}, AVG(v) AS value FROM (
        SELECT *, CASE WHEN calendardate = MAX(calendardate) OVER (
            PARTITION BY {dims}, student_number, academic_year)
          THEN CASE WHEN ada_running IS NULL THEN NULL
            WHEN academic_year = 2026 AND enroll_status = 2 THEN NULL
            WHEN ada_running <= 0.9 THEN 1 ELSE 0 END END AS v
        FROM ({rows}) WHERE {where})
      GROUP BY {dims}
    decimals: 3
    definitions:
      dashboard:
        Share of students whose running ADA on their last date in the slice is
        90% or lower; current-year transferred-out students are left out.
      cube:
        pct_chronically_absent, students at ADA tier 3 or 4 as of the pinned
        date over students with recorded attendance.
    proof:
      fingerprint: 4c3c569aa99d615df55fe7939d966b4fd1d76f3de2acc77ce418d5e47fc29b1c
      cells: 35
      proven_at: "2026-10-31T00:06:26.781195+00:00"
