    measure: avg_daily_attendance
    confirmed: true
    workbook: 87c13e78-a912-40a4-95dd-33248fc1cbd3
    sheet: Y1 ADA - Region
    dashboard_view: kipptaf_tableau.rpt_tableau__attendance_dashboard
    probe: avg(is_present)
    decimals: 3
    dims:
      - { dashboard: region, cube: regions_region_name }
      - { dashboard: grade_level, cube: grade_level }
    filters:
      Academic Year: { dashboard: academic_year, cube: dates_academic_year }
      Region: { dashboard: region, cube: regions_region_name }
    defaults: { Academic Year: "2026", Region: [Camden, Newark, Paterson] }
    cuts: [{}, { Region: Miami }]
    # Mirrors rpt_tableau__attendance_dashboard's row filter (membershipvalue
    # = 1 and attendancevalue is not null). Applied to Cube only.
    scope:
      - { cube: membership_value, values: [1] }
      - { cube: attendance_value, operator: set }
    rows:
      grain:
        - { dashboard: student_number, cube: lea_student_identifier }
        - { dashboard: calendardate, cube: attendance_date }
      values:
        - { dashboard: is_present, cube: attendance_value }
    proof:
      fingerprint: 4c3c569aa99d615df55fe7939d966b4fd1d76f3de2acc77ce418d5e47fc29b1c
      cells: 45
      proven_at: "2026-10-27T18:54:39.317359+00:00"
      workbook_updated_at: "2026-10-27T10:24:57+00:00"
      probe_fingerprint: b8656a821108bd2efa0bb6b624582d4d8e003d16ca17c5fbb818843c6372ee95
      cuts:
        - "{}"
        - '{"Region": "Miami"}'
      totals_skipped: 29
