  - id: enrolled-only-ontime-grade-rollup
    comparison: ontime-grade-rollup
    group:
      column: dashboard_filter
      values:
        - enroll_status
    call: domain_owner
    reason:
      "The Grade Rollup and Roster show currently enrolled students only
      (enroll_status = 0). Cube counts every student enrolled on a day,
      including students who have since left. Cube's enrollment_status member
      ('Currently Enrolled') can reproduce the dashboard's population. Owner:
