# Cube never loads this folder (it reads src/cube/model/ only). Network-grant
# email: pass --email or set CUBE_VALIDATION_EMAIL; never write it here.
view: student_assessment_scores_view
fact: kipptaf_marts.fct_assessment_scores_enrollment_scoped
time_dimension: assessment_date
tasks:
  cube_fix: https://github.com/TEAMSchools/teamster/issues/5668
  dashboard_fix: https://app.asana.com/1/913513768672/project/1213735218595734/task/1213823831345180
shared:
  # DKI - Assessment Mastery Grid shows Grade/Subject (a calc) by Week Start
  # Monday, Module Code and School. Neither the calc nor the week has a Cube
  # member, so the proof copy drops both and shows Grade Level and Subject Area
  # instead; Tableau recomputes the average at that grain. The sheet's
  # Discipline filter (ELA only) is cleared, to validate every subject.
  dki: &dki
    confirmed: true
    workbook: 6d82b643-59a8-4106-b2f9-97ddf7f638e7
    sheet: DKI - Assessment Mastery Grid
    dashboard_view: kipptaf_tableau.rpt_tableau__ddi_dashboard
    decimals: 2
    filters: &dki_filters
      Academic Year: { dashboard: academic_year, cube: academic_year }
      Response Type: { dashboard: response_type, cube: response_type }
      Region: { dashboard: region, cube: region_name }
      School: { dashboard: school, cube: abbreviation }
      Grade Level: { dashboard: grade_level, cube: grade_level }
      Subject Area: { dashboard: subject_area, cube: academic_subject }
      Module Code: { dashboard: module_code, cube: module_code }
      # The student flags (Refs #6375). Cube picks the ELA or math value by the
      # assessment's subject, as the dashboard's columns do.
      is_sipps: { dashboard: is_sipps, cube: is_sipps }
      is_low_25_fl: { dashboard: is_low_25_fl, cube: is_low_25 }
      state_test_proficiency:
        { dashboard: state_test_proficiency, cube: state_test_proficiency }
      Dibels Most Recent Composite:
        {
          dashboard: dibels_most_recent_composite,
          cube: dibels_most_recent_composite,
        }
    defaults: { Academic Year: "2026" }
    cuts: [{ Response Type: overall }, { Response Type: standard }]
    # The DDI datasource holds only assessments tagged into the stack
    # (Illuminate and Focus Assessments).
    scope:
      - { cube: is_internal_assessment, values: [true] }
    # Exclude Future Assessments: administered_at on or before the coming
    # Sunday. Cube has no such member.
    dashboard_filters:
      - { dashboard: administered_at, operator: lte, days_from_week_end: 0 }
    rows: &dki_rows
      grain:
        - { dashboard: student_number, cube: lea_student_identifier }
        - { dashboard: assessment_id, cube: source_assessment_id }
        - { dashboard: response_type, cube: response_type }
        - { dashboard: response_type_code, cube: response_type_code }
      values:
        - { dashboard: is_mastery_int, cube: is_mastery }
  school: &school
    <<: *dki
    # Student Tier is the bucket of the assessment's subject (Refs #6192).
    filters:
      <<: *dki_filters
      Student Tier: { dashboard: nj_student_tier, cube: bucket }
    dims:
      - { dashboard: school, cube: abbreviation }
      - { dashboard: grade_level, cube: grade_level }
      - { dashboard: subject_area, cube: academic_subject }
      - { dashboard: module_code, cube: module_code }
    # Every field on rows: with fields on columns too, Tableau's export fills
    # the whole grid, empty cells included.
    shelves:
      drop: [Week Start Monday, Grade/Subject, Module Code, School]
      add: { rows: [School, Module Code, Grade Level, Subject Area] }
      clear_filters: [Discipline]
  region: &region
    <<: *dki
    filters:
      <<: *dki_filters
      Student Tier: { dashboard: nj_student_tier, cube: bucket }
    dims:
      - { dashboard: region, cube: region_name }
      - { dashboard: grade_level, cube: grade_level }
      - { dashboard: subject_area, cube: academic_subject }
    shelves:
      drop: [Week Start Monday, Grade/Subject, School, Module Code]
      add: { rows: [Region, Grade Level, Subject Area] }
      clear_filters: [Discipline]
  # Module Dashboard bucket sheets (Refs #6192): one column per bucket through
  # Measure Names, on the assessment dashboard's own datasource. Each sheet is
  # a panel: a click on the Grade Heatmap filters it to one grade and module,
  # whose fields sit on Detail. The proof copy clears those action filters and
  # puts grade, module and subject on rows, so each export row is what one
  # click shows. It also clears the Subject Area group, so Math rows prove
  # math_bucket too. % Completion stays: a range filter cannot be cleared, and
  # it keeps every group, since an overall row exists only where a student has
  # a score.
  bucket_module: &bucket_module
    confirmed: true
    workbook: 6d82b643-59a8-4106-b2f9-97ddf7f638e7
    dashboard_view: kipptaf_tableau.rpt_tableau__assessment_dashboard
    filters:
      Academic Year: { dashboard: academic_year, cube: academic_year }
      Response Type: { dashboard: response_type, cube: response_type }
      Region: { dashboard: region, cube: region_name }
      Grade Level: { dashboard: grade_level, cube: grade_level }
      Module Type: { dashboard: module_type, cube: module_type }
      Module Number Raw: { dashboard: module_number, cube: module_code }
      Subject Area: { dashboard: subject_area, cube: academic_subject }
      nj_student_tier: { dashboard: nj_student_tier, cube: bucket }
      # The student flags (Refs #6375).
      is_sipps: { dashboard: is_sipps, cube: is_sipps }
      NJ Tutoring: { dashboard: tutoring_nj, cube: is_tutoring }
      is_low_25_fl: { dashboard: is_low_25_fl, cube: is_low_25 }
      state_test_proficiency:
        { dashboard: state_test_proficiency, cube: state_test_proficiency }
      dibels_most_recent_composite:
        {
          dashboard: dibels_most_recent_composite,
          cube: dibels_most_recent_composite,
        }
    defaults: { Academic Year: "2026" }
    cuts: [{ Response Type: overall }]
    dims:
      - { dashboard: grade_level, cube: grade_level }
      - { dashboard: module_type, cube: module_type }
      - { dashboard: module_number, cube: module_code }
      - { dashboard: subject_area, cube: academic_subject }
    # The workbook's Mastery calc: 1, 0, or blank where is_mastery is null.
    dashboard_columns:
      is_mastery_int: case when is_mastery then 1 when not is_mastery then 0 end
    shelves:
      add: { rows: [Grade Level, Module Type, Module Number Raw, Subject Area] }
      clear_filters:
        - Subject Area (group)
        - Action (Grade Level,Schoolid)
        - Action (Module Type (group),Grade Level,Module Number Raw,Module Type)
          1
        - Action (Section Number,Grade Level)
        - Action (Section Number,Grade Level,Module Number Raw)
        - Action (Section Number,Grade Level,Module Number Raw,school)
    rows: &bucket_rows
      grain:
        - { dashboard: student_number, cube: lea_student_identifier }
        - { dashboard: assessment_id, cube: source_assessment_id }
        - { dashboard: response_type, cube: response_type }
        - { dashboard: standard_code, cube: response_type_code }
      values:
        - { dashboard: is_mastery_int, cube: is_mastery }
  # Bucket N Students: distinct students in the bucket with a mastery verdict,
  # blank when there are none.
  bucket_students: &bucket_students
    <<: *bucket_module
    sheet: Module - Overall - Bucket Counts
    measure: count_students
    decimals: 0
    definitions:
      dashboard: >-
        COUNTD of student_number where nj_student_tier is the bucket and
        is_mastery is not null; blank when 0.
      cube: >-
        count_students with bucket in the bucket and is_mastery set.
  # Bucket N Mastery: the average of Mastery over the bucket's scores.
  bucket_mastery: &bucket_mastery
    <<: *bucket_module
    sheet: Module - Overall - Bucket Mastery
    measure: pct_proficient
    decimals: 2
    definitions:
      dashboard: >-
        AVG of Mastery (1, 0, or blank) where nj_student_tier is the bucket.
      cube: pct_proficient with bucket in the bucket.
comparisons:
  - id: mastery-dki-school
    <<: *school
    measure: pct_proficient
    sheet_field: Avg. Is Mastery Int
    probe: avg(is_mastery_int)
    # The student-flag cuts sit here alone: one sheet proves each mapping.
    # SIPPS and Low 25 have no true rows in 2026, so they get no cut.
    cuts:
      - { Response Type: overall }
      - { Response Type: standard }
      - { Response Type: overall, state_test_proficiency: Below/Far Below }
      - {
          Response Type: overall,
          Dibels Most Recent Composite: Well Below Benchmark,
        }
    proof:
      fingerprint: 3c570b06fff00569956ab30062ec5971502aa895511df28e3e73d894b00496c6
      cells: 3285
      proven_at: "2026-11-12T13:03:25.299380+00:00"
      workbook_updated_at: "2026-11-12T06:44:35+00:00"
      probe_fingerprint: 8cce34f2bea64e939a9602b9d87589092767700b09df9bfe33a340e2df35b104
      source_fingerprint: d9ff221cb778a49a9bbdfcf16e8dbfe368b7b1640fb68fa44caad7c655e18817
      cuts:
        - '{"Response Type": "overall"}'
        - '{"Response Type": "standard"}'
        - '{"Response Type": "overall", "state_test_proficiency": "Below/Far
          Below"}'
        - '{"Dibels Most Recent Composite": "Well Below Benchmark", "Response
          Type": "overall"}'
      totals_skipped: 541
      shelves:
        drop:
          - Week Start Monday
          - Grade/Subject
          - Module Code
          - School
        clear_filters:
          - Discipline
        add:
          rows:
            - School
            - Module Code
            - Grade Level
            - Subject Area
      missing_cuts: []
      missing_filters:
