  # pct_taken also covers count_assigned and count_taken, its denominator and
  # numerator, which no sheet shows on their own.
  - id: pct_taken__assessments_over_time
    <<: *asmt
    measure: pct_taken
    # proficiency_rollup carries every member this comparison uses, and the
    # validator compares only queries that read the fact. The primary key is
    # never null and not in the rollup, so this scope keeps every row.
    scope:
      - { cube: assessment_score_key, operator: set }
    sheet: Module - Overall - Assessments Over Time
    sheet_field: Avg. % Completion
    decimals: 2
    dims:
      - { dashboard: module_type, cube: module_type }
      - { dashboard: module_number, cube: module_code }
      - { dashboard: grade_level, cube: grade_level }
    # % Completion sums fixed-grain counts, so its >= 0.75 filter needs nested
    # windows, which no dashboard_columns expression can hold. Tableau averages
    # it once per fixed group, not per row.
    sheet_query_sql: >-
      WITH base AS (SELECT * FROM ({rows}) WHERE {where}), fixed_in AS (SELECT
      *,
        COUNT(DISTINCT IF(response_type = 'overall' AND percent_correct IS NOT
      NULL,
          student_number, NULL)) OVER (PARTITION BY academic_year, subject_area,
          module_type, module_number, schoolid, grade_level, is_pathways) AS
      n_complete,
        COUNT(DISTINCT IF(response_type = 'overall', student_number, NULL)) OVER
          (PARTITION BY academic_year, subject_area, module_type, module_number,
          schoolid, grade_level, is_pathways) AS n_possible
        FROM base),
      fixed_out AS (SELECT *,
        SAFE_DIVIDE(
          SUM(n_complete) OVER (PARTITION BY academic_year, subject_area,
            module_type, module_number, schoolid, grade_level, is_replacement),
          SUM(n_possible) OVER (PARTITION BY academic_year, subject_area,
            module_type, module_number, schoolid, grade_level, is_replacement))
          AS pct_completion
        FROM fixed_in),
      fixed_groups AS (SELECT DISTINCT academic_year, subject_area, module_type,
        module_number, schoolid, grade_level, is_replacement, pct_completion
        FROM fixed_out WHERE pct_completion >= 0.75)
      SELECT {dims}, AVG(pct_completion) AS value FROM fixed_groups GROUP BY
      {dims}
    # The sheet keeps only normed assessments; the dashboard model sets
    # is_normed_scope from is_internal_assessment.
    filters:
      Academic Year: { dashboard: academic_year, cube: academic_year }
      Module Number Raw: { dashboard: module_number, cube: module_code }
      Is Normed Scope:
        { dashboard: is_normed_scope, cube: is_internal_assessment }
    defaults:
      Academic Year: 2026
      Is Normed Scope: true
    shelves:
      clear_filters:
        [Subject Area (group), Dashboard View Filter, Response Type]
    definitions:
      dashboard: >-
        AVG(% Completion), the average across school, subject and replacement
        groups of # Students Complete over # Students Possible (distinct
        students with an overall row, with and without a percent_correct),
        showing only groups at 75% completion or more.
      cube:
        Assessments sat (count_taken) over assessments assigned
        (count_assigned), Illuminate only.
    rebuild_check:
      fingerprint: 61f22060602a79ac904c20d0bdc1b9285b20664dae760a8684edb5e59c5c84bf
      cells: 148
      matched_at: "2026-11-16T12:45:40.649485+00:00"
