  # Goal distance, as the DDI Suite colors its cells: the highest
  # differentiated goal in the cell minus the cell's mastery rate. The probes
  # rebuild Grade/School/Region Goal (Differentiated) on the extract's columns,
  # the K-2 QA goals hard-coded as the workbook has them today (Refs #6192).
  - id: goal-distance-dki-school
    <<: *school
    measure: grade_goal_distance
    sheet_field: Goal Distance - Grade/Subject
    probe: >-
      max(case when region in ('Camden', 'Newark', 'Paterson') and grade_level <
      9 and subject_area in ('AP Language', 'English 100', 'English 200',
      'English 300', 'English 400', 'Text Study') and module_type = 'ET' then
      0.8 when region in ('Camden', 'Newark', 'Paterson') and grade_level > 9
      and module_type = 'ET' then 0.8 when region in ('Camden', 'Newark',
      'Paterson') and grade_level <= 2 and (subject_area in ('AP Language',
      'English 100', 'English 200', 'English 300', 'English 400', 'Text Study')
      or subject_area in ('Algebra I', 'Algebra I MS', 'Algebra II', 'AP Pre
      Calculus', 'Geometry', 'Geometry Honors', 'Math 4', 'Mathematics')) and
      module_type in ('QA', 'CRQ') then case concat(region, ' ',
      cast(grade_level as string), ' ', case when subject_area in ('AP
      Language', 'English 100', 'English 200', 'English 300', 'English 400',
      'Text Study') then 'ELA' when subject_area in ('Algebra I', 'Algebra I
      MS', 'Algebra II', 'AP Pre Calculus', 'Geometry', 'Geometry Honors', 'Math
      4', 'Mathematics') then 'Math' end) when 'Newark 0 ELA' then 0.78 when
      'Newark 1 ELA' then 0.63 when 'Newark 2 ELA' then 0.76 when 'Newark 0
      Math' then 0.90 when 'Newark 1 Math' then 0.79 when 'Newark 2 Math' then
      0.71 when 'Camden 0 ELA' then 0.61 when 'Camden 1 ELA' then 0.63 when
      'Camden 2 ELA' then 0.76 when 'Camden 0 Math' then 0.83 when 'Camden 1
      Math' then 0.77 when 'Camden 2 Math' then 0.53 when 'Paterson 0 ELA' then
      0.78 when 'Paterson 1 ELA' then 0.50 when 'Paterson 2 ELA' then 0.64 when
      'Paterson 0 Math' then 0.90 when 'Paterson 1 Math' then 0.78 when
      'Paterson 2 Math' then 0.79 end when region in ('Camden', 'Newark',
      'Paterson') and grade_level > 0 and grade_level < 9 and subject_area in
      ('Algebra I', 'Algebra I MS', 'Algebra II', 'AP Pre Calculus', 'Geometry',
      'Geometry Honors', 'Math 4', 'Mathematics') and module_type = 'CRQ' then
      grade_goal + 0.1 when region in ('Camden', 'Newark', 'Paterson') and
      grade_level > 2 and (subject_area in ('AP Language', 'English 100',
      'English 200', 'English 300', 'English 400', 'Text Study') or subject_area
      in ('Algebra I', 'Algebra I MS', 'Algebra II', 'AP Pre Calculus',
      'Geometry', 'Geometry Honors', 'Math 4', 'Mathematics') or subject_area in
      ('Biology', 'Chemistry', 'Human Anatomy and Physiology', 'Physics',
      'Science')) and module_type = 'TP' then grade_goal + 0.1 else grade_goal
      end) - avg(is_mastery_int)
    proof:
      fingerprint: 3c570b06fff00569956ab30062ec5971502aa895511df28e3e73d894b00496c6
      cells: 2730
      proven_at: "2026-11-12T13:10:15.557408+00:00"
      workbook_updated_at: "2026-11-12T06:44:35+00:00"
      probe_fingerprint: 322b3285fed80a647535c19890abea528e2c589f2330687cc6a466f1e7af0dd6
      source_fingerprint: d9ff221cb778a49a9bbdfcf16e8dbfe368b7b1640fb68fa44caad7c655e18817
      cuts:
        - '{"Response Type": "overall"}'
        - '{"Response Type": "standard"}'
      totals_skipped: 376
      shelves:
        drop:
