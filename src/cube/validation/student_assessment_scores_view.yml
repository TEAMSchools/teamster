  - id: school-c3-prior-year
    comparison: mastery-dki-school
    cause:
      {
        side: dashboard,
        label:
          "the response rollup dates the administration in a prior academic
          year, so the dashboard cannot place it in 2026",
      }
    call: domain_owner
    reason:
      int_assessments__response_rollup dates the administration in a prior
      academic year while Cube dates it by its canonical administered date, so
      the dashboard's academic-year join misses it. Which date is right? If the
      rollup's is wrong, this becomes a source fix.
    fingerprints:
