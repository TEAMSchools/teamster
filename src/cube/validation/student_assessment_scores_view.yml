  # DKI - Assessment Mastery Bars colors each row by Performance Bands - 3
  # Level, a workbook calc that bins performance_band_label_number by school
  # level instead of reading the band set's mastery band. dashboard_columns
  # rebuilds that calc under its own name, so its export header maps to it.
  # A band outside both bins (6 and up) shows as its own number, as the
  # workbook's bins leave it. Cells differ where the school-level guess and the
  # band set disagree. The sheet shows each level's share of Student Count
  # (COUNTD of students) across the levels of its row; the probe rebuilds that
  # percent of total. Overall rows only: on standard rows a student counts at
  # every level a standard reached, as pct_students_at_level's ai_context says.
  - id: levels-dki-mastery-bars
    <<: *dki
    sheet: DKI - Assessment Mastery Bars
    measure: pct_students_at_level
    cuts: [{ Response Type: overall }]
    # The sheet's % of Total divides by TOTAL(COUNTD(student)), the row's
    # distinct students, not the sum of its levels: a student at 2 levels counts
    # once below the line.
    probe_sql: |
      select {dims}, count(distinct student_number) / any_value(students) as value
      from (
        select *,
          count(distinct student_number) over (
            partition by school, grade_level, subject_area, module_code
          ) as students
        from ({rows})
        where {where}
      )
      group by {dims}
    dashboard_columns:
      Calculation_3457427549115576330: |
        case
          when performance_band_label_number is null then null
          when school_level = 'HS' then case cast(performance_band_label_number as int64)
            when 1 then 'Below' when 2 then 'Approaching'
            when 3 then 'At/Above' when 4 then 'At/Above' when 5 then 'At/Above'
            else format('%.1f', cast(performance_band_label_number as float64))
          end
          else case cast(performance_band_label_number as int64)
            when 1 then 'Below' when 2 then 'Below' when 3 then 'Approaching'
            when 4 then 'At/Above' when 5 then 'At/Above'
            else format('%.1f', cast(performance_band_label_number as float64))
          end
        end
    dims:
      - { dashboard: school, cube: abbreviation }
      - { dashboard: grade_level, cube: grade_level }
      - { dashboard: subject_area, cube: academic_subject }
      - { dashboard: module_code, cube: module_code }
      - { dashboard: Calculation_3457427549115576330, cube: mastery_level }
    shelves:
      drop: [Grade/Subject, School]
      add: { rows: [School, Grade Level, Subject Area] }
      # The action filter applies only after a click on the grid; unclicked,
      # the dashboard shows every row.
      clear_filters:
        - Discipline
        - Action (Grade/Subject,Module Code,School,Week Start Monday)
    rows:
      grain:
        - { dashboard: student_number, cube: lea_student_identifier }
        - { dashboard: assessment_id, cube: source_assessment_id }
        - { dashboard: response_type, cube: response_type }
        - { dashboard: response_type_code, cube: response_type_code }
      values:
        - {
            dashboard: performance_band_label_number,
            cube: performance_band_label_number,
          }
    proof:
      fingerprint: 8be8411cbf75a6f2141e46e61238e18c998d4fcd1f58de2bdefc33d3cc0d6be5
      cells: 3682
      proven_at: "2026-11-12T13:22:58.441491+00:00"
