    comparison: mastery-dki-school
    cause: { side: dashboard, label: sheet filter administered_at }
    call: deliberate
    reason:
      The sheet's Exclude Future Assessments filter hides assessments
      administered after the coming Sunday. It is a display filter on the sheet,
      not a different definition; Cube has no such member.
