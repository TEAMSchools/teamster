  - id: pct_students_at_level__dki_bars
    <<: *ddi
    measure: pct_students_at_level
    sheet: DKI - Assessment Mastery Bars
    sheet_field: "% of Total Student Count"
    decimals: 2
    dims:
      - { dashboard: school, cube: abbreviation }
      - { dashboard: module_code, cube: module_code }
      - { dashboard: grade_level, cube: grade_level }
      - { dashboard: subject_area, cube: academic_subject }
      - { dashboard: Calculation_3457427549115576330, cube: mastery_level }
    dashboard_columns:
      Calculation_3457427549115576330: >-
        COALESCE(CASE WHEN school_level = 'HS' THEN CASE WHEN
        performance_band_label_number = 1 THEN 'Below' WHEN
        performance_band_label_number = 2 THEN 'Approaching' WHEN
        performance_band_label_number IN (3, 4, 5) THEN 'At/Above' END ELSE CASE
        WHEN performance_band_label_number IN (1, 2) THEN 'Below' WHEN
        performance_band_label_number = 3 THEN 'Approaching' WHEN
        performance_band_label_number IN (4, 5) THEN 'At/Above' END END,
        CAST(performance_band_label_number AS STRING))
    # Tableau's percent of total on a distinct count divides by the distinct
    # students in the partition, not the sum of the marks.
    sheet_query_sql: >-
      WITH base AS (SELECT *, COUNT(DISTINCT student_number) OVER (PARTITION BY
        school, module_code, grade_level, subject_area) AS n_cell
        FROM ({rows}) WHERE {where})
      SELECT {dims}, COUNT(DISTINCT student_number) / ANY_VALUE(n_cell) AS value
      FROM base GROUP BY {dims}
    shelves:
      drop: [Grade/Subject]
      add: { rows: [Grade Level, Subject Area] }
      clear_filters:
        [
          Discipline,
          Exclude Future Assessments,
          "Action (Grade/Subject,Module Code,School,Week Start Monday)",
        ]
    definitions:
      dashboard: >-
        Percent of distinct students in each of 3 levels, grouped from fixed
        band numbers (ES/MS 1-2 Below, 3 Approaching, 4-5 At/Above; HS 1 Below,
        2 Approaching, 3-5 At/Above).
      cube: >-
        Percent of distinct students at each mastery_level, set relative to each
        band set's mastery band.
