        WHEN subject_area IN ('Spanish') THEN 'World Language' ELSE 'Other' END)
        IN ('ELA', 'Math') AND module_type IN ('QA', 'CRQ') THEN CASE
        CONCAT(region, ' ', CAST(grade_level AS STRING), ' ', (CASE WHEN
        subject_area IN ('CCR 1', 'CCR 3', 'CCR 4') THEN 'CCR' WHEN subject_area
        IN ('AP Language', 'English 100', 'English 200', 'English 300', 'English
        400', 'Text Study') THEN 'ELA' WHEN subject_area IN ('Algebra I',
        'Algebra I MS', 'Algebra II', 'AP Pre Calculus', 'Geometry', 'Geometry
        Honors', 'Math 4', 'Mathematics') THEN 'Math' WHEN subject_area IN
        ('Biology', 'Chemistry', 'Human Anatomy and Physiology', 'Physics',
        'Science') THEN 'Science' WHEN subject_area IN ('African American
        Studies', 'AP African American Studies', 'AP US History', 'AP World
        History', 'Economics and Civics', 'Social Studies', 'US History', 'US
        History AfricanAmerican', 'World History') THEN 'Social Studies' WHEN
        subject_area IN ('Spanish') THEN 'World Language' ELSE 'Other' END))
        WHEN 'Newark 0 ELA' THEN 0.78 WHEN 'Newark 1 ELA' THEN 0.63 WHEN 'Newark
        2 ELA' THEN 0.76 WHEN 'Newark 0 Math' THEN 0.9 WHEN 'Newark 1 Math' THEN
        0.79 WHEN 'Newark 2 Math' THEN 0.71 WHEN 'Camden 0 ELA' THEN 0.61 WHEN
        'Camden 1 ELA' THEN 0.63 WHEN 'Camden 2 ELA' THEN 0.76 WHEN 'Camden 0
        Math' THEN 0.83 WHEN 'Camden 1 Math' THEN 0.77 WHEN 'Camden 2 Math' THEN
        0.53 WHEN 'Paterson 0 ELA' THEN 0.78 WHEN 'Paterson 1 ELA' THEN 0.5 WHEN
        'Paterson 2 ELA' THEN 0.64 WHEN 'Paterson 0 Math' THEN 0.9 WHEN
        'Paterson 1 Math' THEN 0.78 WHEN 'Paterson 2 Math' THEN 0.79 END WHEN
        region IN ('Camden', 'Newark', 'Paterson') AND grade_level > 0 AND
        grade_level < 9 AND (CASE WHEN subject_area IN ('CCR 1', 'CCR 3', 'CCR
        4') THEN 'CCR' WHEN subject_area IN ('AP Language', 'English 100',
        'English 200', 'English 300', 'English 400', 'Text Study') THEN 'ELA'
        WHEN subject_area IN ('Algebra I', 'Algebra I MS', 'Algebra II', 'AP Pre
        Calculus', 'Geometry', 'Geometry Honors', 'Math 4', 'Mathematics') THEN
        'Math' WHEN subject_area IN ('Biology', 'Chemistry', 'Human Anatomy and
        Physiology', 'Physics', 'Science') THEN 'Science' WHEN subject_area IN
        ('African American Studies', 'AP African American Studies', 'AP US
        History', 'AP World History', 'Economics and Civics', 'Social Studies',
        'US History', 'US History AfricanAmerican', 'World History') THEN
        'Social Studies' WHEN subject_area IN ('Spanish') THEN 'World Language'
        ELSE 'Other' END) = 'Math' AND module_type = 'CRQ' THEN grade_goal + 0.1
        WHEN region IN ('Camden', 'Newark', 'Paterson') AND grade_level > 2 AND
        (CASE WHEN subject_area IN ('CCR 1', 'CCR 3', 'CCR 4') THEN 'CCR' WHEN
        subject_area IN ('AP Language', 'English 100', 'English 200', 'English
        300', 'English 400', 'Text Study') THEN 'ELA' WHEN subject_area IN
        ('Algebra I', 'Algebra I MS', 'Algebra II', 'AP Pre Calculus',
        'Geometry', 'Geometry Honors', 'Math 4', 'Mathematics') THEN 'Math' WHEN
        subject_area IN ('Biology', 'Chemistry', 'Human Anatomy and Physiology',
        'Physics', 'Science') THEN 'Science' WHEN subject_area IN ('African
        American Studies', 'AP African American Studies', 'AP US History', 'AP
        World History', 'Economics and Civics', 'Social Studies', 'US History',
        'US History AfricanAmerican', 'World History') THEN 'Social Studies'
        WHEN subject_area IN ('Spanish') THEN 'World Language' ELSE 'Other' END)
        IN ('ELA', 'Math', 'Science') AND module_type = 'TP' THEN grade_goal +
        0.1 ELSE grade_goal END
    sheet_query: >-
      CASE WHEN MAX(grade_goal_tableau) < AVG(is_mastery_int) THEN 'exceeded'
      WHEN MAX(grade_goal_tableau) = AVG(is_mastery_int) THEN 'met' WHEN
      MAX(grade_goal_tableau) > AVG(is_mastery_int) THEN 'not met' END
    shelves:
      drop: [Grade/Subject]
      add: { rows: [Grade Level, Subject Area] }
      clear_filters: [Measure Names, Discipline, Exclude Future Assessments]

