view: student_assessment_scores_view
fact: kipptaf_marts.fct_assessment_scores_enrollment_scoped
# Weeks are the only date on any compared sheet; rows cast this to DATE on both sides.
time_dimension: school_week_start_date

# Where a fix_cube or fix_dashboard answer's task points: the Cube-fix issue and
# the DDI Suite's dashboard-fix task in Asana.
tasks:
  cube_fix: "#6417"
  dashboard_fix: https://app.asana.com/0/0/1220348719767537

# Each comparison opens with `- id:`: write_rebuild_check finds a comparison by
# that line, so a comparison that opens with its `<<:` merge cannot be written.
shared:
  ddi: &ddi
    confirmed: true
    rebuild_check: null
    workbook: 6d82b643-59a8-4106-b2f9-97ddf7f638e7
    dashboard_view: kipptaf_tableau.rpt_tableau__ddi_dashboard
    filters:
      Academic Year: { dashboard: academic_year, cube: academic_year }
      Response Type: { dashboard: response_type, cube: response_type }
    # The DKI overall sheets keep only overall rows, which also keeps out the
    # staff walkthrough rows Cube does not hold.
    defaults:
      Academic Year: 2026
      Response Type: overall
    cuts: []
    rows:
      grain:
        - { dashboard: student_number, cube: lea_student_identifier }
        - { dashboard: assessment_id, cube: source_assessment_id }
        - { dashboard: response_type_code, cube: response_type_code }
      values:
        - { dashboard: is_mastery, cube: is_mastery }
  ddi_standard: &ddi_standard
    <<: *ddi
    # The DKI standards sheets keep only standard rows.
    defaults:
      Academic Year: 2026
      Response Type: standard
  asmt: &asmt
    confirmed: true
    rebuild_check: null
    workbook: 6d82b643-59a8-4106-b2f9-97ddf7f638e7
    dashboard_view: kipptaf_tableau.rpt_tableau__assessment_dashboard
    filters:
      Academic Year: { dashboard: academic_year, cube: academic_year }
      Module Number Raw: { dashboard: module_number, cube: module_code }
    defaults:
      Academic Year: 2026
    cuts: []
    rows:
      grain:
        - { dashboard: student_number, cube: lea_student_identifier }
        - { dashboard: assessment_id, cube: source_assessment_id }
        - { dashboard: standard_code, cube: response_type_code }
        # An assessment's overall and group rows can share a NULL code; the
        # description tells them apart.
        - { dashboard: standard_description, cube: response_type_description }
      values:
        - { dashboard: percent_correct, cube: percent_correct }
  sot: &sot
    <<: *asmt
    sheet: Standards Over Time - Overview
    defaults: {}
    dims:
      - { dashboard: academic_year, cube: academic_year }
      - { dashboard: subject_area, cube: academic_subject }
      - { dashboard: response_type, cube: response_type }
    shelves:
      drop: [Standard Domain, Standard Code]
      add: { rows: [Subject Area, Response Type] }
      clear_filters: [Subject Area (group), Response Type]

