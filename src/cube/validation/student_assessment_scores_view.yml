    dims:
      - { dashboard: school, cube: abbreviation }
      - { dashboard: grade_level, cube: grade_level }
      - { dashboard: subject_area, cube: academic_subject }
    dashboard_columns:
      grade_goal_tableau: >-
        CASE WHEN region IN ('Camden', 'Newark', 'Paterson') AND grade_level < 9
        AND (CASE WHEN subject_area IN ('CCR 1', 'CCR 3', 'CCR 4') THEN 'CCR'
        WHEN subject_area IN ('AP Language', 'English 100', 'English 200',
        'English 300', 'English 400', 'Text Study') THEN 'ELA' WHEN subject_area
        IN ('Algebra I', 'Algebra I MS', 'Algebra II', 'AP Pre Calculus',
        'Geometry', 'Geometry Honors', 'Math 4', 'Mathematics') THEN 'Math' WHEN
        subject_area IN ('Biology', 'Chemistry', 'Human Anatomy and Physiology',
        'Physics', 'Science') THEN 'Science' WHEN subject_area IN ('African
        American Studies', 'AP African American Studies', 'AP US History', 'AP
        World History', 'Economics and Civics', 'Social Studies', 'US History',
        'US History AfricanAmerican', 'World History') THEN 'Social Studies'
        WHEN subject_area IN ('Spanish') THEN 'World Language' ELSE 'Other' END)
        = 'ELA' AND module_type = 'ET' THEN 0.8 WHEN region IN ('Camden',
        'Newark', 'Paterson') AND grade_level > 9 AND module_type = 'ET' THEN
        0.8 WHEN region IN ('Camden', 'Newark', 'Paterson') AND grade_level <= 2
        AND (CASE WHEN subject_area IN ('CCR 1', 'CCR 3', 'CCR 4') THEN 'CCR'
        WHEN subject_area IN ('AP Language', 'English 100', 'English 200',
        'English 300', 'English 400', 'Text Study') THEN 'ELA' WHEN subject_area
