cubes:
  - name: student_attendance_periods
    public: false
    sql_table: kipptaf_marts.fct_student_attendance_periods

    joins:
      # Join on the raw DATE key, not a time dimension — Cube wraps time
      # dimensions in the query-timezone conversion (convertTz) inside join
      # predicates, which breaks the equality against the unconverted
      # fact-side date under any non-UTC timezone (#4298).
      - name: dates
        sql: "{dates.date_key} = {CUBE}.period_end_date_key"
        relationship: many_to_one

      - name: locations
        sql: "{locations.location_key} = {CUBE}.location_key"
        relationship: many_to_one

    dimensions:
      - name: student_attendance_period_key
        description: >-
          Surrogate key derived from student_number, _dbt_source_project,
          location_key, period_type, and period_start_date_key. Primary key for
          this fact.
        sql: student_attendance_period_key
        type: string
        primary_key: true
        public: false

      - name: period_type
        description: >-
          Selects the grain: year, month, or week. Week is the PowerSchool
          school week (not a clean Monday-Sunday ISO grid). Each period_type
          produces exactly one pre-computed row per eligible student per period
          — no anchor filter is needed or accepted. The dates join is on
          period_end_date_key, so a single-date filter selects the periods that
          ended on that date rather than pinning a point in time within one.
        sql: period_type
        type: string
        public: true

      - name: period_start_date
        description: >-
          Start of the period. For period_type = year, July 1 of the academic
          year. For month, the first of the calendar month. For week, the
          PowerSchool school-week start (week_start_monday).
        sql: CAST(period_start_date_key AS TIMESTAMP)
        type: time
        public: true

      - name: period_end_date
        description: >-
          Last membership day observed within the period as of this snapshot —
          not the period's calendar end date. Join target for the dates cube
          (joined on the raw period_end_date_key column, not this time dimension
          — Cube's query-timezone conversion inside a join predicate breaks the
          equality under any non-UTC timezone, #4298).
        sql: CAST(period_end_date_key AS TIMESTAMP)
        type: time
        public: true

      - name: ada_tier
        description: >-
          Cumulative ADA tier as of period_end_date, based on membership days
          accumulated since the start of the academic year. Tier 1 = 95%+ (on
          track). Tier 2 = 90-94% (at risk). Tier 3 = 80-89% (chronic — also
          is_chronically_absent). Tier 4 = below 80% (severe chronic — also
          is_chronically_absent). Null when the student has zero membership days
          year-to-date.
        sql: ada_tier
        type: string
        public: true

    measures:
      - name: count_students
        description: >-
          CA-eligible student-school records in the period
          (n_membership_days_ytd >= 10 — the KIPP Foundation chronic-absence
          eligibility floor). Counted per school: a student who changed schools
          mid-period is counted once per school, the same enrollment-stint grain
          the legacy year-end/month-end/week-end measures on student_attendance
          use — not a network-wide distinct headcount. This is the shared
          denominator for every rate measure on this cube — display it alongside
          a rate whenever population size matters, especially early in an
          academic year when eligibility is still accumulating and the
          denominator is a fraction of full enrollment.
        sql: student_attendance_period_key
        type: count_distinct
        public: true
        filters:
          - sql: "{CUBE}.is_ca_eligible"

      - name: count_chronically_absent
        description: >-
          CA-eligible student-school records with cumulative ADA below 90%
          (ada_tier Tier 3 or Tier 4) as of period_end_date. Same per-school
          counting grain as count_students.
        sql: student_attendance_period_key
        type: count_distinct
        public: true
        filters:
          - sql: "{CUBE}.is_ca_eligible"
          - sql: "{CUBE}.is_chronically_absent"

      - name: pct_chronically_absent
        description: >-
          Chronic absence rate — count_chronically_absent / count_students.
          Always display count_students alongside this rate: eligibility is
          cumulative from the start of the academic year, so early periods carry
          a much smaller denominator than later ones. Example: 2025-08 measured
          1,317 eligible against 10,513 total enrollments network-wide (12.5%),
          while the rate itself barely moved (19.49% to 18.53%). This is
          expected, not broken data — all three reconciliation authorities
          define eligibility this way, and KIPP Foundation chronic-absence
          criteria item 1 already requires the eligible-student count to be
          shown beside the rate for the same reason.
        sql: "1.0 * {count_chronically_absent} / NULLIF({count_students}, 0)"
        type: number
        format: percent
        public: true

      - name: _count_tier_1_2
        sql: student_attendance_period_key
        type: count_distinct
        public: false
        filters:
          - sql: "{CUBE}.is_ca_eligible"
          - sql: "{CUBE}.ada_tier IN ('Tier 1', 'Tier 2')"

      - name: pct_tier_1_2
        description: >-
          Percentage of CA-eligible students with cumulative ADA at or above 90%
          (Tier 1 or Tier 2) as of period_end_date. Denominator is
          count_students.
        sql: "1.0 * {_count_tier_1_2} / NULLIF({count_students}, 0)"
        type: number
        format: percent
        public: true

      - name: _count_tier_3
        sql: student_attendance_period_key
        type: count_distinct
        public: false
        filters:
          - sql: "{CUBE}.is_ca_eligible"
          - sql: "{CUBE}.ada_tier = 'Tier 3'"

      - name: pct_tier_3
        description: >-
          Percentage of CA-eligible students with cumulative ADA between 80% and
          89% (Tier 3) as of period_end_date. Denominator is count_students.
        sql: "1.0 * {_count_tier_3} / NULLIF({count_students}, 0)"
        type: number
        format: percent
        public: true

      - name: count_truants
        description: >-
          CA-eligible student-school records meeting regional truancy criteria
          as of period_end_date. Miami: 15+ absences in a 90-day rolling window.
          NJ regions: projected absences reach 50+ for the year. Same per-school
          counting grain as count_students.
        sql: student_attendance_period_key
        type: count_distinct
        public: true
        filters:
          - sql: "{CUBE}.is_ca_eligible"
          - sql: "{CUBE}.is_truant"

      - name: pct_truant
        description: >-
          Percentage of CA-eligible students meeting truancy criteria as of
          period_end_date. Denominator is count_students.
        sql: "1.0 * {count_truants} / NULLIF({count_students}, 0)"
        type: number
        format: percent
        public: true
