cubes:
  - name: student_enrollments
    public: false
    sql_table: kipptaf_marts.fct_student_attendance_daily

    joins:
      # Join on the raw DATE key, not the date_day time dimension — Cube wraps
      # time dimensions in the query-timezone conversion (convertTz) inside
      # join predicates, which breaks the equality against the unconverted
      # fact-side date under any non-UTC timezone (#4298).
      - name: dates
        sql: "{dates.date_key} = {CUBE}.date_key"
        relationship: many_to_one

      # Location, student identity, grade, and status are all reached via
      # student_school_enrollments (single FK route, no diamond). The prior
      # direct locations join is removed because fct_student_attendance_daily
      # has no location_key column.
      - name: student_school_enrollments
        sql: >
          {student_school_enrollments.student_enrollment_key} =
          {CUBE}.student_enrollment_key
        relationship: many_to_one

    dimensions:
      - name: student_attendance_daily_key
        description: >-
          Surrogate key derived from student_number, _dbt_source_project, and
          calendardate. Primary key of the underlying attendance daily fact.
        sql: student_attendance_daily_key
        type: string
        primary_key: true

      - name: student_enrollment_key
        description: >-
          FK to student_school_enrollments (the stint dimension). Surrogate key
          from student_number, _dbt_source_project, academic_year, entrydate.
        sql: student_enrollment_key
        type: string

      - name: is_current_record
        description: >-
          TRUE on the school's latest attendance day that has occurred (per
          school × academic year, capped at today). Default point-in-time
          enrollment anchor — drives count_students at year / no grouping.
        sql: is_current_record
        type: boolean
        public: true

      - name: is_month_end_record
        description: >-
          TRUE on the school's latest attendance day of each calendar month. Use
          for month-granularity point-in-time enrollment trends.
        sql: is_enrollment_month_end_record
        type: boolean
        public: true

      - name: is_week_end_record
        description: >-
          TRUE on the school's latest attendance day of each PowerSchool school
          week. Group the weekly trend by dates_school_week_start_date (not
          Cube's native ISO week).
        sql: is_enrollment_week_end_record
        type: boolean
        public: true

      - name: is_latest_record
        description: >-
          TRUE on the last attendance day of each enrollment stint. Per-stint
          "served" marker — not a period-end anchor; distinct from
          is_current_record.
        sql: is_latest_record
        type: boolean
        public: true

    measures:
      - name: count_students
        description: >-
          Distinct students enrolled at any point within the queried range —
          ever-enrolled during the range, not a point-in-time headcount. Pinning
          a single date (filter dates_date_day to one date, e.g. 2025-10-01)
          makes the result point-in-time for that date; for a point-in-time
          as-of figure at year, month, or week grain without pinning a date, use
          count_students_year_end, count_students_month_end, or
          count_students_week_end instead — see the four-measure comparison
          below. Matches the topline Total Enrollment methodology — enrollment
          is by entry/exit dates, not status. A week or month with no in-session
          days (e.g. winter or February break) has no rows in the underlying
          fact at all, so it is absent from a grouped result rather than reading
          as 0 — read trends on instructional periods, or fill the gap in the BI
          layer.

          Four measures on this cube report a headcount, and their names alone
          don't distinguish them — picking by name returns a plausible-looking
          but different number. count_students: ever-enrolled during the queried
          range, unless a single date is pinned. count_students_year_end:
          point-in-time, as of each school's most recent in-session day.
          count_students_month_end: point-in-time, as of each month's last
          in-session day. count_students_week_end: point-in-time, as of each
          school week's last in-session day.
        sql: "{student_school_enrollments.student_key}"
        type: count_distinct
        public: true

      - name: count_students_year_end
        description: >-
          Distinct students enrolled as of each school's most recent in-session
          day (today for the current year, the last day of school for completed
          years) — the year-end / current headcount. Filters to
          is_current_record, so the anchor is baked in and no dates_date_day
          filter or grouping is required; this is what count_students returns
          when queried with no time grouping. Matches the topline Total
          Enrollment methodology — enrollment is by entry/exit dates, not
          status. Note: across multiple schools, each is counted as of its own
          latest in-session day, so a network total can mix as-of dates within
          the final weeks of a year.
        sql: "{student_school_enrollments.student_key}"
        type: count_distinct
        public: true
        filters:
          - sql: "{CUBE}.is_current_record"

      - name: count_students_month_end
        description: >-
          Distinct students enrolled as of each school's latest in-session day
          of each calendar month — the month-end headcount. Filters to the
          underlying is_enrollment_month_end_record column (exposed as the
          is_month_end_record dimension), so the anchor is baked in and no
          dates_date_day filter is required; group by dates_month_number /
          dates_month_name (or a monthly dates_date_day granularity) to trend
          it. Matches the topline Total Enrollment methodology — enrollment is
          by entry/exit dates, not status. Read trends on instructional periods,
          or carry the prior value forward in the BI layer (the daily fact is
          in-session-days only by design). A month can read 0 for two different
          reasons that look identical in the output: a month with no in-session
          days at all (e.g. a winter break spanning the whole month) has no
          point-in-time snapshot to count; separately, a month that DOES have
          in-session days but whose month-end anchor day falls outside your
          query's own date range also reads 0, because this measure's anchor is
          a filter on the aggregate itself — it zeroes the count rather than
          dropping the month from the result the way an out-of-range month would
          be dropped entirely. Don't read a trailing 0 as "enrollment fell to
          zero" without first checking whether the anchor day was inside your
          date range.
        sql: "{student_school_enrollments.student_key}"
        type: count_distinct
        public: true
        filters:
          - sql: "{CUBE}.is_enrollment_month_end_record"

      - name: count_students_week_end
        description: >-
          Distinct students enrolled as of each school's latest in-session day
          of each PowerSchool school week — the week-end headcount. Filters to
          the underlying is_enrollment_week_end_record column (exposed as the
          is_week_end_record dimension), so the anchor is baked in and no
          dates_date_day filter is required; group by
          dates_school_week_start_date (PowerSchool school weeks, not Cube's ISO
          granularity: "week") to trend it. Matches the topline Total Enrollment
          methodology — enrollment is by entry/exit dates, not status. Read
          trends on instructional periods, or carry the prior value forward in
          the BI layer (the daily fact is in-session-days only by design). A
          week can read 0 for two different reasons that look identical in the
          output: a week with no in-session days at all (e.g. winter or February
          break) has no point-in-time snapshot to count; separately, a week that
          DOES have in-session days but whose week-end anchor day falls outside
          your query's own date range also reads 0, because this measure's
          anchor is a filter on the aggregate itself — it zeroes the count
          rather than dropping the week from the result the way an out-of-range
          week would be dropped entirely. Don't read a trailing 0 as "enrollment
          fell to zero" without first checking whether the anchor day was inside
          your date range.
        sql: "{student_school_enrollments.student_key}"
        type: count_distinct
        public: true
        filters:
          - sql: "{CUBE}.is_enrollment_week_end_record"
