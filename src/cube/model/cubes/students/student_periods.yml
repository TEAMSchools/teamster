cubes:
  - name: student_periods
    public: false
    sql_table: kipptaf_marts.fct_student_periods

    joins:
      # Join on the raw DATE key, not a time dimension — Cube wraps time
      # dimensions in the query-timezone conversion (convertTz) inside join
      # predicates, which breaks the equality against the unconverted
      # fact-side date under any non-UTC timezone (#4298).
      - name: dates
        sql: "{dates.date_key} = {CUBE}.period_end_date_key"
        relationship: many_to_one

      - name: locations
        sql: "{locations.location_key} = {CUBE}.location_key"
        relationship: many_to_one

    dimensions:
      - name: student_period_key
        description: >-
          Surrogate key derived from student_number, _dbt_source_project,
          location_key, academic_year, period_type, and period_start_date_key.
          Primary key for this fact.
        sql: student_period_key
        type: string
        primary_key: true
        public: false

      - name: period_type
        description: >-
          Selects the grain: year, month, or week. Week is the PowerSchool
          school week (not a clean Monday-Sunday ISO grid). Each period_type
          produces exactly one pre-computed row per eligible student per period
          — no anchor filter is needed or accepted. The dates join is on
          period_end_date_key, so a single-date filter selects the periods that
          ended on that date rather than pinning a point in time within one.
        sql: period_type
        type: string
        public: true

      - name: period_start_date
        description: >-
          Start of the period. For period_type = year, July 1 of the academic
          year. For month, the first of the calendar month. For week, the
          PowerSchool school-week start (week_start_monday).
        sql: CAST(period_start_date_key AS TIMESTAMP)
        type: time
        public: true

      - name: period_end_date
        description: >-
          Last membership day observed within the period as of this snapshot —
          not the period's calendar end date. Join target for the dates cube
          (joined on the raw period_end_date_key column, not this time dimension
          — Cube's query-timezone conversion inside a join predicate breaks the
          equality under any non-UTC timezone, #4298).
        sql: CAST(period_end_date_key AS TIMESTAMP)
        type: time
        public: true

      - name: academic_year
        description: >-
          Academic year this period belongs to, per the fact's own school-year
          assignment — not derived from period_end_date's calendar year. The
          dates join resolves period_end_date_key through a pure July-1 calendar
          cutover, which can disagree with the fact's assignment across the June
          30 / July 1 boundary.
        sql: academic_year
        type: number
        public: true

      - name: academic_year_label
        description: >-
          Full span label for academic_year (e.g. "2025-2026" for the year
          beginning July 2025), derived from the fact's own school-year
          assignment rather than the period_end_date calendar year — see
          academic_year for why that distinction matters here.
        sql: >-
          CONCAT(CAST({CUBE}.academic_year AS STRING), '-',
          CAST({CUBE}.academic_year + 1 AS STRING))
        type: string
        public: true

      - name: ada_tier
        description: >-
          Cumulative ADA tier as of period_end_date, based on membership days
          accumulated since the start of the academic year. Tier 1 is 95% and
          above (on track). Tier 2 is strictly above 90.0%; Tier 3 includes
          exactly 90.0%, extending down through 80% inclusive (chronic — also
          is_chronically_absent). Tier 4 is below 80% (severe chronic — also
          is_chronically_absent). Null when the student has zero membership days
          year-to-date.
        sql: ada_tier
        type: string
        public: true

    measures:
      - name: count_students
        description: >-
          Student-school records served at any point in the period, with no
          eligibility floor applied. Counted per school, so a student who
          changed schools mid-period is counted once per school. This is a
          served-during-the-period count, which is a different question from
          enrolled on the period's last day — for that, pin the date on
          student_days_view. Do NOT use this as the denominator for any rate on
          this cube; every rate here is scoped to count_students_min_10_days.
        sql: student_period_key
        type: count_distinct
        public: true

      - name: count_students_min_10_days
        description: >-
          Students with at least 10 cumulative membership days year-to-date at
          that school — the KIPP Foundation chronic-absence eligibility floor,
          and the shared denominator for every rate measure on this cube. A
          membership day requires recorded attendance, so a school-year with
          enrollment but no attendance data contributes nobody here and cannot
          distort a rate. Counted per school, so a student who changed schools
          mid-period is counted once per school. Display it beside any rate
          whenever population size matters, especially early in an academic year
          when eligibility is still accumulating and this runs far below
          count_students.
        sql: student_period_key
        type: count_distinct
        public: true
        filters:
          - sql: "{CUBE}.is_ca_eligible"

      - name: count_chronically_absent
        description: >-
          CA-eligible student-school records with cumulative ADA at or below
          90.0% (ada_tier Tier 3 or Tier 4) as of period_end_date. Same
          per-school counting grain as count_students.
        sql: student_period_key
        type: count_distinct
        public: true
        filters:
          - sql: "{CUBE}.is_ca_eligible"
          - sql: "{CUBE}.is_chronically_absent"

      - name: pct_chronically_absent
        description: >-
          Chronic absence rate — count_chronically_absent divided by
          count_students_min_10_days. Excludes anyone with fewer than 10
          membership days year-to-date, so it is not a share of everyone
          enrolled. Always display count_students alongside this rate:
          eligibility is cumulative from the start of the academic year, so
          early periods carry a much smaller denominator than later ones.
          Example: by August 31 of AY2025, the maximum membership days any
          student had reached was 8, so zero students were CA-eligible that
          month — August has no chronic-absence rate at all, not a small one.
          Cumulative through September 30, eligible reached 9,236 against 9,381
          student-school pairs with any attendance day (17.8%); through October
          31, eligible reached 9,328 (18.3%). This is expected, not broken data
          — all three reconciliation authorities define eligibility this way,
          and KIPP Foundation chronic-absence criteria item 1 already requires
          the eligible-student count to be shown beside the rate for the same
          reason.
        sql:
          "1.0 * {count_chronically_absent} /
          NULLIF({count_students_min_10_days}, 0)"
        type: number
        format: percent
        public: true

      - name: _count_tier_1_2
        sql: student_period_key
        type: count_distinct
        public: false
        filters:
          - sql: "{CUBE}.is_ca_eligible"
          - sql: "{CUBE}.ada_tier IN ('Tier 1', 'Tier 2')"

      - name: pct_tier_1_2
        description: >-
          Percentage of CA-eligible students with cumulative ADA strictly above
          90.0% (Tier 1 or Tier 2) as of period_end_date. Tier 2 is strictly
          above 90.0%; Tier 3 includes exactly 90.0%. Denominator is
          count_students.

          Denominator is count_students_min_10_days, so anyone with fewer than
          10 membership days year-to-date is excluded from both sides.
        sql: "1.0 * {_count_tier_1_2} / NULLIF({count_students_min_10_days}, 0)"
        type: number
        format: percent
        public: true

      - name: _count_tier_3
        sql: student_period_key
        type: count_distinct
        public: false
        filters:
          - sql: "{CUBE}.is_ca_eligible"
          - sql: "{CUBE}.ada_tier = 'Tier 3'"

      - name: pct_tier_3
        description: >-
          Percentage of CA-eligible students with cumulative ADA from 80%
          through 90.0% inclusive (Tier 3) as of period_end_date. Tier 2 is
          strictly above 90.0%; Tier 3 includes exactly 90.0%. Denominator is
          count_students.

          Denominator is count_students_min_10_days, so anyone with fewer than
          10 membership days year-to-date is excluded from both sides.
        sql: "1.0 * {_count_tier_3} / NULLIF({count_students_min_10_days}, 0)"
        type: number
        format: percent
        public: true

      - name: count_truants
        description: >-
          CA-eligible student-school records meeting regional truancy criteria
          as of period_end_date. Miami: 15+ absences in a 90-day rolling window.
          NJ regions: projected absences reach 50+ for the year. Same per-school
          counting grain as count_students. The CA-eligibility floor (10+
          membership days) is a KIPP Foundation chronic-absence criterion that
          this fact also applies to truancy — neither the Miami nor the NJ
          truancy rule itself requires a minimum membership-day count.
        sql: student_period_key
        type: count_distinct
        public: true
        filters:
          - sql: "{CUBE}.is_ca_eligible"
          - sql: "{CUBE}.is_truant"

      - name: pct_truant
        description: >-
          Percentage of CA-eligible students meeting truancy criteria as of
          period_end_date. Denominator is count_students — because count_truants
          applies the chronic-absence eligibility floor to truancy as well, this
          rate's denominator is CA-eligible students, not all students the
          regional truancy rule itself would consider.

          Denominator is count_students_min_10_days, so anyone with fewer than
          10 membership days year-to-date is excluded from both sides.
        sql: "1.0 * {count_truants} / NULLIF({count_students_min_10_days}, 0)"
        type: number
        format: percent
        public: true
