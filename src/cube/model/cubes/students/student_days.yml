cubes:
  - name: student_days
    public: false
    sql_table: kipptaf_marts.fct_student_days

    joins:
      # Join on the raw DATE key, not the date_day time dimension — Cube wraps
      # time dimensions in the query-timezone conversion (convertTz) inside
      # join predicates, which breaks the equality against the unconverted
      # fact-side date under any non-UTC timezone (#4298).
      - name: dates
        sql: "{dates.date_key} = {CUBE}.date_key"
        relationship: many_to_one

      - name: student_school_enrollments
        sql: >
          {student_school_enrollments.student_enrollment_key} =
          {CUBE}.student_enrollment_key
        relationship: many_to_one

      # location reached via student_school_enrollments.location_key; calendar
      # joined on (date_key, enrollment's location_key)
      - name: school_calendars
        sql: >
          {school_calendars.date_key} = {CUBE}.date_key AND
          {school_calendars.location_key} =
          {student_school_enrollments.location_key}
        relationship: many_to_one

      - name: terms
        sql: "{terms.term_key} = {CUBE}.term_key"
        relationship: many_to_one

    dimensions:
      - name: student_day_key
        description: >-
          Surrogate key derived from student_number, _dbt_source_relation, and
          calendardate. Primary key for this fact.
        sql: student_day_key
        type: string
        primary_key: true

      - name: is_in_session_day
        description: >-
          Whether school was in session for this student's school on this day.
          False on a break day, which carries enrollment but no attendance and a
          membership_value of zero. Filter to true for anything that should only
          consider school days; leave it open for enrollment questions, which is
          what makes a point-in-time count resolve on a weekend or holiday.
        sql: is_in_session_day
        type: boolean
        public: true

      - name: attendance_date
        description: >-
          This day's calendar date, read from the fact rather than through the
          dates join. Prefer it over dates_date_day for any single-date or
          date-range filter: it compiles to a predicate on fct_student_days' own
          date_key, which is the table's partitioning column, whereas a
          dates_date_day filter lands on dim_dates and leaves the whole fact to
          be scanned. Both return the same rows.
        # {CUBE} is required, not stylistic: a bare date_key is ambiguous
        # against dim_dates.date_key on any view carrying the dates join, and
        # filtering this dimension then failed outright with "Column name
        # date_key is ambiguous". Grouping by it compiled; only filters broke.
        sql: CAST({CUBE}.date_key AS TIMESTAMP)
        type: time
        public: true

      - name: attendance_code
        description:
          Attendance identifier set by school. Examples Tardy, Absent, etc.
        sql: attendance_code
        type: string
        public: true

      - name: attendance_category
        description: >-
          Coarse attendance category derived from the is_* flags with priority
          ordering (suspension > absent > tardy > present). Values:
          Out-of-School Suspension, In-School Suspension, Absent, Tardy,
          Present. Use this column for GROUP BY in BI tools; use the raw
          attendance_code for specific-code drill-down.
        sql: attendance_category
        type: string
        public: true

      - name: attendance_value
        description: >-
          Daily attendance value — a real number, typically a fraction of 1
          where 1 is a full attendance day. Used with membership_value to
          compute ADA. Precision depends on the source SIS's attendance mode
          (full-day vs period-level vs day-part); see source_model for
          provenance.
        sql: attendance_value
        type: number
        public: true

      - name: membership_value
        description: >-
          The amount of a student's membership this school claims. If a student
          attends more than one school each one will only be able to claim a
          certain portion of the membership. The largest number for this will
          usually be 1 and fractions expressed as decimals. Like .5 or .25.
        sql: membership_value
        type: number
        public: true

      - name: present_weight
        description: >-
          Weighted presence value. 0.67 for tardy (T-prefix codes), otherwise
          equals attendance_value. Fractional by design — not a 0/1 flag.
        sql: present_weight
        type: number
        public: true

      - name: is_absent
        description:
          1 if the student was absent, 0 if present. Sum-friendly flag.
        sql: is_absent
        type: number
        public: true

      - name: is_tardy
        description:
          1 if the student was tardy (T-prefix attendance code), 0 otherwise.
        sql: is_tardy
        type: number
        public: true

      - name: is_ontime
        description: >-
          1 if the attendance code is not a T-prefix tardy code, 0 if tardy.
          Note: this is 1 for absent days as well as on-time present days — use
          pct_ontime for an on-time rate that correctly excludes absent days.
        sql: is_ontime
        type: number
        public: true

      - name: is_oss
        description: >-
          1 if the student received out-of-school suspension on this date (OS,
          OSS, OSSP, SHI codes), 0 otherwise.
        sql: is_oss
        type: number
        public: true

      - name: is_iss
        description: >-
          1 if the student received in-school suspension on this date (S, ISS
          codes), 0 otherwise.
        sql: is_iss
        type: number
        public: true

      - name: is_suspended
        description: >-
          1 if the student was suspended (any type) on this date. Union of
          is_oss and is_iss codes.
        sql: is_suspended
        type: number
        public: true

      - name: is_truant
        description: >-
          Day-level flag: TRUE if the student met regional truancy criteria as
          of this date. Miami: 15+ absences in a 90-day rolling window. NJ
          regions: projected absences reach 50+ for the year.

          Grain trap — this flag is re-stamped on every daily row, and the NJ
          projection moves as the year progresses. Filtering it over a date
          range therefore counts students truant on ANY day in the range, not a
          period-end snapshot, and the count runs high: early in an academic
          year it runs high several-fold, because one absence in the first days
          projects past 50 on a one-day denominator. Use this dimension for
          day-level drill-down (which days was a student flagged), and take the
          period-end truancy count and rate from student_periods_view's
          count_truants / pct_truant.
        sql: is_truant
        type: boolean
        public: true

      - name: n_membership_days_ytd
        description: >-
          Membership days accumulated from the start of the academic year at
          this school, through and including this date. Counts only days with a
          recorded attendance value, so a day whose register was never taken
          raises neither this nor n_present_days_ytd. Unchanged across break
          days, because a break day contributes zero -- so this resolves on a
          weekend or a holiday with the value from the last school day.
        sql: n_membership_days_ytd
        type: number
        public: true

      - name: n_present_days_ytd
        description: >-
          Attendance accumulated from the start of the academic year at this
          school, through and including this date, over the same days
          n_membership_days_ytd counts. Divide by n_membership_days_ytd for one
          student's cumulative ADA as of this date. That is a per-student figure
          -- for a population ADA over a date range use avg_daily_attendance,
          which sums both sides over the slice and is not the same number.
        sql: n_present_days_ytd
        type: number
        public: true

      - name: ada_tier
        description: >-
          Cumulative ADA band as of this date. Tier 1 at 95% and above, Tier 2
          strictly above 90.0%, Tier 3 from 80% through 90.0% inclusive, Tier 4
          below 80%. Null when the student has no membership days yet.

          Exactly 90.0% is Tier 3, and therefore chronically absent. Evaluated
          on accumulated counts cross-multiplied against each other, never on an
          averaged float. Computed once in fct_student_days;
          student_periods_view reads the same column at period end rather than
          recomputing it, so the two views cannot disagree.
        sql: ada_tier
        type: string
        public: true

      - name: is_chronically_absent
        description: >-
          Whether ada_tier is Tier 3 or Tier 4 as of this date. Derived from
          ada_tier, never recomputed, so the flag and the tier cannot drift
          apart. A student with only a handful of membership days still carries
          a tier -- show count_students beside any rate built on this.
        sql: is_chronically_absent
        type: boolean
        public: true

    measures:
      - name: count_students
        description: >-
          Distinct students with a row in the queried slice. Enrollment is by
          entry and exit dates, never by status. Leave the date open for an
          ever-enrolled count over a range; pin attendance_date to a single date
          for a point-in-time headcount as of that date — attendance_date rather
          than dates_date_day, because it prunes the fact's date partition and
          dates_date_day does not. No anchor filter is needed or available — the
          fact carries a row for every calendar day a student was enrolled,
          break days included, so a weekend or holiday resolves the same as a
          school day. For students served across a whole period, use
          student_periods_view.count_students instead, which answers a different
          question from enrolled on the period's last day.
        sql: "{student_school_enrollments.student_key}"
        type: count_distinct
        public: true

      # Numerator and denominator must span the SAME set of days, or days
      # present in one and absent from the other silently become absences.
      # attendance_value IS NULL means attendance was never recorded, not that
      # the student was absent — those days carry membership_value = 1, so
      # leaving them in the denominator alone counted them as absences (#4744).
      # membership_value = 1 matches rpt_tableau__attendance_dashboard and drops
      # the pre-AY2021 membership_value = 0 rows that carry a real
      # attendance_value and would otherwise inflate the numerator only. It
      # would also drop fractional dual-enrollment days, which count_absent_days
      # keeps via membership_value > 0 — no such row exists today (zero rows
      # outside {0, 1} across all 12.8M), but if dual enrollment ever produces
      # one, ADA and count_absent_days will span different day sets.
      - name: _sum_attendance_value
        sql: attendance_value
        type: sum
        public: false
        filters:
          - sql: "{CUBE}.membership_value = 1"

      - name: _sum_membership_value
        sql: membership_value
        type: sum
        public: false
        filters:
          - sql: "{CUBE}.membership_value = 1"
          - sql: "{CUBE}.attendance_value IS NOT NULL"

      - name: avg_daily_attendance
        description: >-
          Average Daily Attendance (ADA) — attendance value summed over full
          membership days, divided by the count of those days. Days with no
          recorded attendance value are excluded from both numerator and
          denominator, matching the attendance dashboard; counting them in the
          denominator alone would report them as absences.
        sql: "{_sum_attendance_value} / NULLIF({_sum_membership_value}, 0)"
        type: number
        format: percent
        public: true

      # Same numerator/denominator symmetry as ADA: a tardy code recorded on a
      # day with no attendance value is excluded here, because
      # _count_present_days already excludes it (is_absent is NULL whenever
      # attendance_value is, so `is_absent = 0` never matches).
      - name: _sum_tardy
        sql: is_tardy
        type: sum
        public: false
        filters:
          - sql: "{CUBE}.membership_value = 1"
          - sql: "{CUBE}.attendance_value IS NOT NULL"

      - name: _count_present_days
        sql: "1"
        type: sum
        public: false
        filters:
          - sql: "{CUBE}.membership_value = 1"
          - sql: "{CUBE}.is_absent = 0"

      - name: pct_tardy
        description: >-
          Percentage of present days where the student was tardy (tardy days /
          present days). Absent days and days with no recorded attendance value
          are excluded from both numerator and denominator.

          Date filter behavior: filtering to a single date returns that day's
          tardy rate only. For a cumulative YTD rate as of a given date, use a
          date range from the start of the academic year (e.g. 2025-07-01
          through the target date).
        sql: "1.0 * {_sum_tardy} / NULLIF({_count_present_days}, 0)"
        type: number
        format: percent
        public: true

      - name: pct_ontime
        description: >-
          Percentage of present days where the student arrived on time (on-time
          days / present days). Complement of pct_tardy. Absent days and days
          with no recorded attendance value are excluded from both numerator and
          denominator.

          Date filter behavior: filtering to a single date returns that day's
          on-time rate only. For a cumulative YTD rate as of a given date, use a
          date range from the start of the academic year (e.g. 2025-07-01
          through the target date).
        sql: >-
          1.0 * ({_count_present_days} - {_sum_tardy}) /
          NULLIF({_count_present_days}, 0)
        type: number
        format: percent
        public: true

      - name: count_absent_days
        description: >-
          Total number of absence days (sum of is_absent). Filtered to
          membership_value > 0 to exclude non-enrollment days while retaining
          partial-membership days (dual-enrolled students). Not restricted to
          membership_value = 1 — partial days count as absences too.
        sql: is_absent
        type: sum
        public: true
        filters:
          - sql: "{CUBE}.membership_value > 0"

      # Pin attendance_date for every measure below. Each one counts students
      # whose cumulative position crossed a line, and the fact re-stamps that
      # position on every day -- so over an open date range these count students
      # who crossed on ANY day in the range, which runs high and is almost never
      # the question. Pinned to one date they are a true point-in-time rate, and
      # they answer it on a weekend or a holiday too, because the cumulative
      # columns carry across break days.
      #
      # student_periods_view answers the same questions at year, month and week
      # end without a pinned date, off the same columns. Use that for a trend.

      # Denominator for every rate below. count_students is the population, but
      # it includes rows enrolled with no recorded attendance -- Miami before
      # AY2026, and 19 to 424 rows a year elsewhere -- whose ada_tier and
      # is_truant are null, so they can never reach a numerator. Dividing by
      # count_students would deflate every rate by that population (#4744).
      - name: _count_students_with_attendance
        sql: "{student_school_enrollments.student_key}"
        type: count_distinct
        public: false
        filters:
          - sql: "{CUBE}.n_membership_days_ytd > 0"

      - name: count_chronically_absent
        description: >-
          Students at Tier 3 or Tier 4 as of the pinned date. Pin
          attendance_date. No minimum-membership-day floor is applied, so early
          in an academic year this counts students judged on very few days --
          show count_students beside it. Counted per school; the cumulative
          position it reads accumulates per student across a school change.
        sql: "{student_school_enrollments.student_key}"
        type: count_distinct
        public: true
        filters:
          - sql: "{CUBE}.is_chronically_absent"

      - name: pct_chronically_absent
        description: >-
          Share of students at Tier 3 or Tier 4 as of the pinned date.
          Denominator is every student with at least one recorded attendance day
          in the slice. No minimum-membership-day floor applies. Rows enrolled
          with no recorded attendance are excluded from both sides, so the gap
          cannot deflate the rate (#4744). Pin attendance_date, and show
          count_students beside this: a rate over students with only a few
          membership days each is volatile, not wrong.
        sql:
          "1.0 * {count_chronically_absent} /
          NULLIF({_count_students_with_attendance}, 0)"
        type: number
        format: percent
        public: true

      - name: count_truants
        description: >-
          Students meeting regional truancy criteria as of the pinned date.
          Miami: 15+ absences in a 90-day rolling window. NJ regions: projected
          absences reach 50+ for the year. Pin attendance_date.

          Neither regional rule requires a minimum membership-day count. Miami's
          is self-limiting -- 15 absences implies at least 15 membership days --
          while the NJ projection can fire in a student's first days, so early
          in an academic year this runs high.
        sql: "{student_school_enrollments.student_key}"
        type: count_distinct
        public: true
        filters:
          - sql: "{CUBE}.is_truant"

      - name: pct_truant
        description: >-
          Share of students meeting regional truancy criteria as of the pinned
          date. Denominator is every student with at least one recorded
          attendance day in the slice. No minimum-membership-day floor applies.
          Rows enrolled with no recorded attendance are excluded from both
          sides, so the gap cannot deflate the rate (#4744). Truancy has no
          eligibility concept in either regional rule. Pin attendance_date.
        sql:
          "1.0 * {count_truants} / NULLIF({_count_students_with_attendance}, 0)"
        type: number
        format: percent
        public: true
