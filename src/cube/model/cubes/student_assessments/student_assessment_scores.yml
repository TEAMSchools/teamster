cubes:
  - name: student_assessment_scores
    public: false
    sql_table: kipptaf_marts.fct_assessment_scores_enrollment_scoped

    joins:
      - name: student_assessment_administrations
        sql: >
          {student_assessment_administrations.assessment_administration_key} =
          {CUBE}.assessment_administration_key
        relationship: many_to_one

      # Calendar / academic-year rollups join dates on assessment_date_key (the
      # administration date where present, else the student's test date), NOT on
      # the administration's own date — that is null for state and vendor
      # sources, so joining there returned null academic_year for them (#4546).
      # dates is reached only through this single path (no diamond). Join on the
      # raw DATE key, never a time dimension: Cube wraps time dimensions in the
      # query-timezone convertTz inside join predicates, which zeroes the join
      # under any non-UTC timezone (#4298).
      - name: dates
        sql: "{dates.date_key} = {CUBE}.assessment_date_key"
        relationship: many_to_one

      - name: student_section_enrollments
        sql: >
          {student_section_enrollments.student_section_enrollment_key} =
          {CUBE}.student_section_enrollment_key
        relationship: many_to_one

      # Reporting quarter of the score, keyed on the fact's own term_key (the
      # quarter containing the administration/test date at the section's school).
      # Reached only through this path: the section dim no longer carries a term
      # FK, so there is no diamond back to terms (#4484).
      - name: terms
        sql: "{terms.term_key} = {CUBE}.term_key"
        relationship: many_to_one

    dimensions:
      - name: assessment_score_key
        description: Surrogate key. Primary key for this fact.
        sql: assessment_score_key
        type: string
        primary_key: true

      - name: date_taken
        description: >-
          Date the assessment was taken (completion date). Every source. Null on
          every Illuminate not_taken row, and null or wrong on a small share of
          other Illuminate rows.
        sql: CAST(test_date_key AS TIMESTAMP)
        type: time
        public: true
        meta:
          ai_context: >-
            A standalone date, not joined to the calendar. Do not use it to find
            the most recent diagnostic; administration_period covers that. To
            filter by date use assessment_date; for year and calendar rollups
            use date_day and academic_year. All 3 read the administration date
            for the internal sources (Illuminate and Apex) and college, and the
            test date for state tests and vendor diagnostics (i-Ready, DIBELS,
            STAR).

      - name: assessment_date
        description: >-
          The date each score is anchored to: the administration date for
          internal and college assessments, the test date for state and vendor
          assessments. Holds the same date as date_day, read from this fact
          rather than through the dates join. Filter assessment_date, not
          date_day, for a single date or a date range: it filters the fact's own
          partitioning column, so only the matching months are read, while a
          date_day filter reads every month. Use date_day and the other dates
          members for grouping by calendar parts, and academic_year_label for
          school-year filters.
        # {CUBE} is required: an unqualified column inside an expression is
        # ambiguous against same-named columns on joined cubes, and filters on
        # the member then fail (see attendance_date).
        sql: CAST({CUBE}.assessment_date_key AS TIMESTAMP)
        type: time
        public: true

      - name: term_key
        description: FK to terms — the reporting quarter containing the score.
        sql: term_key
        type: string

      - name: enrollment_resolution
        description: >-
          How the section enrollment was resolved: subject_section (the section
          for the assessment's subject, active on the test date) or homeroom
          (the student's HR section, used when no subject section resolved).
        sql: enrollment_resolution
        type: string
        public: true
        meta:
          ai_context: >-
            Filter to subject_section for course- and section-level rollups.

      - name: proficiency_level
        description: >-
          Proficiency label; the vocabulary is per source. i-Ready: 3 or More
          Grade Levels Below, 2 Grade Levels Below, 1 Grade Level Below, Early
          On Grade Level, Mid or Above Grade Level. DIBELS: Well Below
          Benchmark, Below Benchmark, At Benchmark, Above Benchmark, and Tested
          Out on some subtest (group) rows. STAR and FL state: Level 1 to Level
          5; STAR is null on a share of rows. NJSLA: Did Not Yet Meet
          Expectations, Partially Met Expectations, Approached Expectations, Met
          Expectations, Exceeded Expectations. NJSLA Science: the same without
          Partially Met Expectations. NJGPA: Graduation Ready, Not Yet
          Graduation Ready. Illuminate and Apex: the performance band label,
          whose spelling varies by band set (for example Level 1, Low Level 1,
          Low 1). Tier-movement rates are not comparable across instruments:
          fewer, wider tiers mechanically raise the stayed-the-same rate.
        sql: proficiency_level
        type: string
        public: true
        meta:
          ai_context: >-
            On Illuminate and Apex rows, a band can carry more than one label
            spelling; group by performance_band_label_number there. For STAR
            rows with no proficiency level, filter it with notSet; equals "null"
            matches the literal string and returns zero rows. DIBELS rows with
            no verdict nearly all carry Tested Out here, not null. To find every
            row with no verdict, filter is_mastery with notSet.

      - name: performance_band_label_number
        description: >-
          Position of the score's band within the performance band set it was
          scored against. Illuminate and Apex only; null for every other source.
          Band sets differ in cut points, in band count, and in which band
          starts mastery, so band 5 is not always the top. Not comparable across
          assessments, or across response types within one assessment: standard
          and group rows can carry different band labels than the assessment's
          overall rows.
        sql: performance_band_label_number
        type: number
        public: true
        meta:
          ai_context: >-
            Compare band numbers within one assessment and one response_type.
            There, prefer this number to proficiency_level text for grouping and
            ordering; on standard and group rows a few bands carry more than one
            label spelling.

      - name: is_mastery
        description: >-
          Per-row proficient flag that pct_proficient is built from. The bar is
          per source: i-Ready, Early On Grade Level and Mid or Above Grade Level
          — Early On is a looser bar than at or above grade level; DIBELS, At
          and Above Benchmark; STAR and FL, Level 3 and up; NJSLA, Met and
          Exceeded Expectations; NJGPA, Graduation Ready; Illuminate, set by
          each assessment's band set, so an Illuminate rate mixes different
          bars; Apex, Level 3 and up in the assessment's band set. Null where
          the source gives no verdict: Illuminate not_taken rows, DIBELS Tested
          Out subtests, STAR rows with no level, Apex assessments with no band
          set, and a few Illuminate, Apex and DIBELS rows with no band or level.
        sql: is_mastery
        type: boolean
        public: true
        meta:
          ai_context: >-
            For i-Ready at or above grade level, filter proficiency_level to Mid
            or Above Grade Level instead. When reporting an Illuminate or Apex
            rate, say which assessments it covers.

      - name: scale_score
        description: >-
          Scale score achieved. Every source except Illuminate and Apex, which
          report percent_correct instead; also null on some i-Ready and DIBELS
          group rows. Scales differ by source and are not comparable across
          sources or subjects; within i-Ready the scale also compresses at
          higher grades, so a change in score is not comparable between
          elementary and middle grades.
        sql: scale_score
        type: number
        public: true
        meta:
          ai_context: >-
            Report a scale-score change separately for elementary and middle
            grades, and as a point difference, not a percent of the BOY score.
            Do not label a computed change with i-Ready's growth-measure names;
            those norms are not in this view.

      - name: percent_correct
        description: >-
          Percent of questions answered correctly, on a 0 to 100 scale.
          Illuminate and Apex only; null for every other source.
        sql: percent_correct
        type: number
        public: true

      - name: response_type
        description: >-
          Response-type breakdown. Never null; 4 values: overall (a subject,
          course-level or composite score; every source), group (a strand or
          domain rollup within a subject; Illuminate, i-Ready and DIBELS),
          standard (one standard; Illuminate and Apex only) and not_taken (an
          Illuminate assessment a student was assigned and never sat, with no
          recorded response; Illuminate only). Not additive across values.
        sql: response_type
        type: string
        public: true
        meta:
          ai_context: >-
            Filter it on every query; default to overall unless a standard or
            group breakdown is asked for.

      - name: response_type_code
        description: >-
          Breakdown identifier — the standard code on Illuminate and Apex
          standard rows (a Florida B.E.S.T. code on Apex, for example
          ELA.3.V.1.3), the domain on i-Ready group rows, the subtest on DIBELS
          group rows. Null on Illuminate group rows and on every overall and
          not_taken row. Some CCSS Math standards carry 2 spellings
          (CCSS.Math.Content.8.EE.C.8.b and CCSS.Math.Content.8.EE.C.8b), and a
          small share of older rows have an empty code (an empty string, not
          null).
        sql: response_type_code
        type: string
        public: true
        meta:
          ai_context: >-
            For a standards rollup, merge the 2 spellings first: remove a dot
            only when it sits right before a trailing lowercase letter. Then
            recompute the rate from the merged counts (summed count_proficient
            over summed count_scored); never average the 2 reported rates. For
            an Illuminate group-level cut, group on response_type_description —
            this code is null there, so keying on it drops every Illuminate
            group row and keeps i-Ready and DIBELS.

      - name: response_type_description
        description: >-
          Human-readable breakdown label. Populated on standard rows and every
          group row; null on overall and not_taken. A few labels, on standard
          and group rows, carry punctuation, capitalization or spacing variants
          of the same text. On Apex standard rows it repeats response_type_code.
        sql: response_type_description
        type: string
        public: true

      - name: response_type_root_description
        description: >-
          Top level the standard rolls up to. Populated on every Illuminate and
          Apex standard row and null on every other row. On Illuminate rows, the
          CCSS domain; unreliable for Illuminate content aligned to Florida's
          own standards, whose codes do not fit the CCSS hierarchy. On Apex
          rows, the whole subject framework (for example Mathematics
          (B.E.S.T.)(Focus)), not a domain.
        sql: response_type_root_description
        type: string
        public: true
        meta:
          ai_context: >-
            Use it for a domain rollup on Illuminate rows only; on Apex rows it
            returns 1 row per subject.

      - name: is_replacement
        description: >-
          Replacement-curriculum flag, set on Illuminate and Apex rows. TRUE
          when a K-8 student sat a replacement-curriculum Illuminate assessment
          off their enrolled grade level; FALSE on every Apex row. Null for
          every other source (the state tests and the i-Ready, DIBELS and STAR
          diagnostics), which have no replacement-curriculum concept. Never TRUE
          here: no replacement-curriculum sitting resolves to a section
          enrollment, so none survive enrollment scoping.
        sql: is_replacement
        type: boolean
        public: true

    measures:
      # Three nested counts, widest first: assigned contains taken contains
      # scored. Each answers a different question and they are not
      # interchangeable — see each description. Renamed from count_scores in
      # #5501, which counted the widest population under the narrowest name.
      # COUNT(*) over the unique PK (assessment_score_key): additive, so pre-
      # aggregations roll it up to any grain.
      - name: count_assigned
        description: >-
          Every assessment row, including the Illuminate not_taken rows where a
          student was assigned an assessment and never sat it. The widest of 3
          nested counts: assigned contains taken contains scored.
        type: count
        public: true
        # Forces joins to student_assessments and regions so all proficiency
        # measures share one CTE, enabling side-by-side queries without
        # BigQuery's "query too complex" multi-CTE fan-out error.
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
        meta:
          ai_context: >-
            For assessments actually sat use count_taken; for the population
            pct_proficient is computed over use count_scored.

      - name: count_taken
        description: >-
          Assessments a student actually sat: every row except the Illuminate
          not_taken placeholders. Only Illuminate records non-participation, so
          for every other source this equals count_assigned. Wider than
          count_scored, because a sat assessment can carry no proficiency
          verdict: STAR rows with no level (Early Literacy and nearly all
          kindergarten, where STAR publishes no benchmark), and DIBELS Tested
          Out subtests.
        type: count
        public: true
        filters:
          - sql: "{CUBE}.response_type != 'not_taken'"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
        meta:
          ai_context: >-
            Use this for "how many assessments were taken".

      # Exact count_distinct: non-additive, so a rollup pre-aggregation cannot
      # re-aggregate it to a coarser grain. Switch to count_distinct_approx
      # (HLL) if this is pre-aggregated and an approximate distinct is
      # acceptable.
      - name: count_students
        description: >-
          Distinct students (per student-year) with a score in the filtered
          slice.
        sql: "{student_section_enrollments.student_enrollment_key}"
        type: count_distinct
        public: true
        meta:
          ai_context: >-
            Heavier than the plain counts, and has timed out at standard grain;
            use count_taken there, and report it as assessments taken, not
            students.

      - name: _sum_proficient
        description: >-
          Additive proficient-score count (1 per mastered response). Building
          block for pct_proficient.
        sql: "IF({CUBE}.is_mastery, 1, 0)"
        type: sum
        public: false
        # Forces joins to student_assessments and regions so all proficiency
        # measures share one CTE, enabling side-by-side queries without
        # BigQuery's "query too complex" multi-CTE fan-out error.
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"

      # Exact count_distinct: non-additive, so proficiency_rollup cannot serve
      # it and every query using it reads the fact. Measured 2026-09-30 at
      # standard grain (one year, Illuminate, by response_type_code): 7.5s,
      # well inside the MCP deadline, so it carries no timeout caveat.
      - name: count_assessments
        description: >-
          Distinct internal assessments in the filtered set — not sittings, not
          scored responses. Illuminate and Apex only: every other source has no
          source_assessment_id, so it reads 0 there.
        sql: "{student_assessment_administrations.source_assessment_id}"
        type: count_distinct
        public: true
        # Same join-forcing filters as the other counts, so every measure
        # shares one CTE (see count_assigned).
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
        meta:
          ai_context: >-
            Use this for "how many times was this assessed", with
            assessment_type filtered to 1 source: each source numbers its own
            assessments. A standard resting on 1 assessment is a thin base for a
            trend; say so rather than trending it.

      - name: count_scored
        description: >-
          Assessments carrying a proficiency verdict (is_mastery set). The
          narrowest count, and the denominator of pct_proficient.
        type: count
        public: true
        # Forces joins to student_assessments and regions so all proficiency
        # measures share one CTE, enabling side-by-side queries without
        # BigQuery's "query too complex" multi-CTE fan-out error.
        filters:
          - sql: "{CUBE}.is_mastery IS NOT NULL"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
        meta:
          ai_context: >-
            Report it alongside pct_proficient whenever the rate carries weight;
            it is the n the rate rests on.

      - name: count_proficient
        description: >-
          Assessments where the student met the proficiency threshold. The
          numerator of pct_proficient, whose denominator is count_scored.
        sql: "{_sum_proficient}"
        type: number
        public: true
        meta:
          ai_context: >-
            Use this for "how many were proficient" rather than multiplying
            pct_proficient by a count.

      # Built from additive primitives (count_taken / count_assigned) so pre-
      # aggregations roll it up to any grain.
      - name: pct_taken
        description: >-
          Grain: meaningful only within Illuminate; pooling across sources is a
          silent-failure trap. Participation rate: assessments sat / assessments
          assigned. Every other source reads 100% by construction, Apex
          included: Apex has rows only for students who tested.
        sql: "1.0 * {count_taken} / NULLIF({count_assigned}, 0)"
        type: number
        format: percent
        public: true
        meta:
          ai_context: >-
            Filter assessment_type to illuminate before reporting it. There is
            no participation rate for Apex; say so rather than reporting 100%.

      # Built from additive primitives (_sum_proficient / count_scored) so
      # pre-aggregations roll it up to any grain.
      - name: pct_proficient
        description: >-
          Proficiency rate: proficient scores / scores carrying a verdict
          (count_scored). The headline metric, and the only score measure on a
          common 0-to-1 scale across sources; the mastery bar behind it differs
          by source.
        sql: "1.0 * {_sum_proficient} / NULLIF({count_scored}, 0)"
        type: number
        format: percent
        public: true
        meta:
          ai_context: >-
            Pair it with count_scored; never multiply it by count_assigned to
            get a proficient count.

      - name: _sum_percent_correct
        description: >-
          Additive sum of percent_correct (nulls ignored). Building block for
          avg_percent_correct.
        sql: percent_correct
        type: sum
        public: false

      - name: _count_percent_correct
        description: >-
          Count of rows with a non-null percent_correct (internal scores).
          Building block for avg_percent_correct.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.percent_correct IS NOT NULL"

      - name: avg_percent_correct
        description: >-
          Grain: recomputes at any query grain, but meaningful only within a
          single subject/standard — pooling percent-correct across assessments
          is a silent-failure trap (numerically valid, semantically
          meaningless). Average percent correct. Illuminate and Apex only; null
          for every other source. Built from additive primitives so
          pre-aggregations roll it up.
        sql: "{_sum_percent_correct} / NULLIF({_count_percent_correct}, 0)"
        type: number
        public: true

      - name: _sum_scale_score
        description: >-
          Additive sum of scale_score (nulls ignored). Building block for
          avg_scale_score.
        sql: scale_score
        type: sum
        public: false

      - name: _count_scale_score
        description: >-
          Count of rows with a non-null scale_score (every source except
          Illuminate and Apex). Building block for avg_scale_score.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.scale_score IS NOT NULL"

      - name: avg_scale_score
        description: >-
          Grain: recomputes at any query grain, but meaningful only within a
          single assessment source/subject/grade — scale scores are not
          comparable across sources, so pooling them is a silent-failure trap
          (numerically valid, semantically meaningless). Average scale score,
          built from additive primitives so pre-aggregations roll it up.
        sql: "{_sum_scale_score} / NULLIF({_count_scale_score}, 0)"
        type: number
        public: true

      - name: _sum_proficient_formative
        description: >-
          Additive proficient-score count scoped to formative module types (QA,
          MQQ, CRQ). Building block for pct_proficient_formative.
        sql: "IF({CUBE}.is_mastery, 1, 0)"
        type: sum
        public: false
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} IN ('QA', 'MQQ', 'CRQ')"

      - name: _count_scored_formative
        description: >-
          Count of rows carrying a proficiency verdict (is_mastery set), scoped
          to formative module types (QA, MQQ, CRQ). Building block for
          pct_proficient_formative — a row with no verdict cannot enter the
          numerator, so counting it only drags the rate down.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.is_mastery IS NOT NULL"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} IN ('QA', 'MQQ', 'CRQ')"

      # Built from additive primitives so pre-aggregations roll it up.
      - name: pct_proficient_formative
        description: >-
          Proficiency rate across the QA, MQQ and CRQ module types only;
          excludes every other module type (TP, UA, ET, BL, WPP and older
          types). Pools Illuminate and Apex rows, which share the QA and MQQ
          types. Its denominator counts only rows with a proficiency verdict, as
          in pct_proficient. CRQ is also available alone as pct_proficient_crq.
        sql:
          "1.0 * {_sum_proficient_formative} / NULLIF({_count_scored_formative},
          0)"
        type: number
        format: percent
        public: true
        meta:
          ai_context: >-
            Not "all internal checkpoints". For that, build the rollup from the
            intended module types and flag the pooling choice as an open
            decision. Filter assessment_type to compare 1 source's rate.

      - name: _sum_proficient_crq
        description: >-
          Additive proficient-score count scoped to Constructed Response
          Questions (CRQ). Building block for pct_proficient_crq.
        sql: "IF({CUBE}.is_mastery, 1, 0)"
        type: sum
        public: false
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} = 'CRQ'"

      - name: _count_scored_crq
        description: >-
          Count of rows carrying a proficiency verdict (is_mastery set), scoped
          to Constructed Response Questions (CRQ). Building block for
          pct_proficient_crq — a row with no verdict cannot enter the numerator,
          so counting it only drags the rate down.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.is_mastery IS NOT NULL"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} = 'CRQ'"

      - name: pct_proficient_crq
        description: >-
          Proficiency rate for Constructed Response Questions (CRQ) across all
          regions. CRQ is a subset of pct_proficient_formative. The denominator
          excludes rows with no proficiency verdict (is_mastery unset), matching
          pct_proficient. Built from additive primitives so pre-aggregations
          roll it up.
        sql: "1.0 * {_sum_proficient_crq} / NULLIF({_count_scored_crq}, 0)"
        type: number
        format: percent
        public: true

    pre_aggregations:
      # Rollup on the additive proficiency primitives. A rollup serves a query
      # only when it carries every member the query filters or groups on, so
      # each dimension below is one real queries use (#5557), and the RLS
      # scoping keys (region_key, abbreviation) are here so region and school
      # viewers hit it. Add a dimension only if it adds few rows at this grain;
      # one determined by a member already here adds width, not rows.
      - name: proficiency_rollup
        measures:
          # All three nested counts plus the proficient sum, so every rate the
          # view exposes is servable: without count_scored every pct_proficient
          # query falls back to the fact, and without count_taken every
          # pct_taken query does.
          - student_assessment_scores.count_assigned
          - student_assessment_scores.count_taken
          - student_assessment_scores.count_scored
          - student_assessment_scores._sum_proficient
        dimensions:
          - dates.academic_year
          # Derived from academic_year. The view's descriptions make it the
          # canonical year filter (#5402).
          - dates.academic_year_label
          - student_assessments.module_code
          # module_type is determined by module_code above; it lets queries
          # filter by the coarser QA / MQQ / CRQ grouping.
          - student_assessments.module_type
          # assessment_type (the source picker: dibels, illuminate,
          # state_nj_njsla...) and title are nearly determined by the module,
          # subject and administration already here.
          - student_assessments.assessment_type
          - student_assessments.title
          - student_assessments.academic_subject
          - student_assessments.grade_level_tested
          - student_assessment_administrations.administration_period
          - student_assessment_scores.response_type_code
          # response_type is determined by response_type_code above.
          # response_type_description is not: the code is null on the
          # Illuminate group rows where the description is populated. Measure
          # its row cost across this whole dimension list, not on the
          # code/description pair alone, which overstates it. It serves the
          # standard-level cut (filter response_type = 'standard', break out
          # by response_type_description).
          - student_assessment_scores.response_type
          - student_assessment_scores.response_type_description
          # enrollment_resolution serves the subject_section-only cut.
          # proficiency_level and is_mastery multiply rows and stay out
          # (measurements on #5557).
          - student_assessment_scores.enrollment_resolution
          - students.race
          - students.gender_identity
          - student_school_enrollments.grade_level
          # is_iep is the one independent addition (binary, so at most 2x rows);
          # it serves the IEP-vs-gen-ed disparity cut.
          - student_enrollment_status.is_iep
          - locations.region_key
          - locations.abbreviation
          # region_name is determined by region_key above; it supports
          # region-name filters ("Newark").
          - regions.region_name
          # Lead teacher key + name, for proficiency-by-teacher queries. The
          # name is 1:1 with the key and must also be exposed on the view, or a
          # name-grouped query falls back to the fact.
          - student_section_enrollments.lead_teacher_staff_key
          - staff_lead_teacher.full_name
        # Partitioned build: Cube builds each quarterly partition as its own
        # job, in parallel. Quarters, not years, because Cube's Q3 starts July 1,
        # so a school year is exactly four partitions and the refresh window
        # below can start on a school-year boundary; Cube partitions only on
        # built-in grains, so a July-June year is not available. The anchor is
        # assessment_date, a fact-side column, so each partition's filter
        # prunes to three monthly BigQuery partitions of the fact (partition_by
        # in its properties yml). Anchoring on dates.date_day would put the
        # filter on joined dim_dates and scan the whole fact per partition. Not
        # date_taken either: it is corrupt for a small share of rows. A state or
        # vendor window that straddles a quarter boundary splits its scores
        # across two partitions by each score's anchor date: correct per-score
        # attribution, not a fan-out (#4546). Every stored measure is a count or
        # sum, so splitting rows finer never changes a rate. A query that uses
        # date_day as its time dimension, as a range or a grouping, cannot use
        # this rollup; academic_year filters and assessment_date can.
        time_dimension: student_assessment_scores.assessment_date
        granularity: quarter
        partition_granularity: quarter
        # Serve a date range only when it aligns with the quarter grain. Cube's
        # default (true, via
        # CUBEJS_PRE_AGGREGATIONS_ALLOW_NON_STRICT_DATE_RANGE_MATCH) compares
        # any range to each row's bucket start, so a Sep-Oct range returns 0
        # rows (#5744). Misaligned ranges read the fact; academic_year filters
        # and quarter-aligned ranges, July-June school years included, hit the
        # rollup.
        allow_non_strict_date_range_match: false
        # Bound the build range to real assessment history. Without it, Cube
        # derives the range from the time_dimension's min and max, so one stray
        # far-past or far-future assessment_date_key would add empty
        # partitions (#4460). The floor sits below the earliest
        # assessment_date_key carrying a score; rows outside [floor, today] fall
        # back to the fact.
        build_range_start:
          sql: SELECT DATE('2015-07-01')
        build_range_end:
          sql: SELECT CURRENT_DATE('America/New_York')
        # Rebuild a partition when the fact rebuilds (a full CREATE OR REPLACE,
        # on the cron in its properties yml), but only partitions on or after
        # July 1 of the previous school year. The window start is today minus
        # 18 months, truncated to January 1, plus 6 months. Cube runs this key
        # once per partition every 30 minutes, with FILTER_PARAMS bound to that
        # partition's date range. Late state results land in the previous
        # school year at the latest; older partitions return a constant and
        # never rebuild, so a backfill of older history needs a manual rebuild
        # in Cube Cloud. Each July 1 the four quarters leaving the window change
        # key to 'frozen' and rebuild once; that yearly burst is expected. If
        # FILTER_PARAMS fails to bind it renders as 1 = 1, and every partition
        # falls back to rebuilding on each fact change. last_modified_time also
        # moves on metadata-only changes (descriptions, labels). Literal block
        # (|-) so the formatter cannot reflow the SQL.
        # test_refresh_key_sql_names_its_cubes_table guards the table name.
        refresh_key:
          every: 30 minute
          sql: |-
            SELECT IF(
              EXISTS (
                SELECT 1
                FROM UNNEST(GENERATE_DATE_ARRAY(
                  DATE_ADD(
                    DATE_TRUNC(
                      DATE_SUB(CURRENT_DATE('America/New_York'), INTERVAL 18 MONTH),
                      YEAR
                    ),
                    INTERVAL 6 MONTH
                  ),
                  CURRENT_DATE('America/New_York')
                )) AS d
                WHERE {FILTER_PARAMS.student_assessment_scores.assessment_date.filter('TIMESTAMP(d)')}
              ),
              CAST(last_modified_time AS STRING),
              'frozen'
            )
            FROM kipptaf_marts.__TABLES__
            WHERE table_id = 'fct_assessment_scores_enrollment_scoped'
