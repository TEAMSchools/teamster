cubes:
  - name: student_assessment_scores
    public: false
    sql_table: kipptaf_marts.fct_assessment_scores_enrollment_scoped

    joins:
      - name: student_assessment_administrations
        sql: >
          {student_assessment_administrations.assessment_administration_key} =
          {CUBE}.assessment_administration_key
        relationship: many_to_one

      # Calendar / academic-year rollups join dates on assessment_date_key (the
      # administration date where present, else the student's test date), NOT on
      # the administration's own date — that is null for state and vendor
      # sources, so joining there returned null academic_year for them (#4546).
      # dates is reached only through this single path (no diamond). Join on the
      # raw DATE key, never a time dimension: Cube wraps time dimensions in the
      # query-timezone convertTz inside join predicates, which zeroes the join
      # under any non-UTC timezone (#4298).
      - name: dates
        sql: "{dates.date_key} = {CUBE}.assessment_date_key"
        relationship: many_to_one

      - name: student_section_enrollments
        sql: >
          {student_section_enrollments.student_section_enrollment_key} =
          {CUBE}.student_section_enrollment_key
        relationship: many_to_one

      # Reporting quarter of the score, keyed on the fact's own term_key (the
      # quarter containing the administration/test date at the section's school).
      # Reached only through this path: the section dim no longer carries a term
      # FK, so there is no diamond back to terms (#4484).
      - name: terms
        sql: "{terms.term_key} = {CUBE}.term_key"
        relationship: many_to_one

    dimensions:
      - name: assessment_score_key
        description: Surrogate key. Primary key for this fact.
        sql: assessment_score_key
        type: string
        primary_key: true

      - name: date_taken
        description: >-
          Date the assessment was taken (completion date), as a standalone date
          dimension not joined to a calendar cube. date_taken is corrupt for a
          small share of internal rows, so calendar and academic-year rollups
          use the date_day / academic_year members instead (backed by
          assessment_date_key: the administration date for internal and college,
          the reliable test date for state and vendor). Populated for state and
          vendor rows; nullable for a small share of internal rows lacking a
          recorded sitting.
        sql: CAST(test_date_key AS TIMESTAMP)
        type: time
        public: true

      - name: term_key
        description: FK to terms — the reporting quarter containing the score.
        sql: term_key
        type: string

      - name: enrollment_resolution
        description: >-
          How the section enrollment was resolved: subject_section or homeroom.
          Filter to subject_section for course/section-level rollups.
        sql: enrollment_resolution
        type: string
        public: true

      - name: proficiency_level
        description: >-
          Proficiency band label (performance band for internal, achievement
          level for state).
        sql: proficiency_level
        type: string
        public: true

      - name: performance_band_label_number
        description: >-
          Numeric ordering of the performance band label within the band scale.
          Null for state assessments.
        sql: performance_band_label_number
        type: number
        public: true

      - name: is_mastery
        description: >-
          TRUE if the student met the mastery/proficiency threshold for this
          assessment.
        sql: is_mastery
        type: boolean
        public: true

      - name: scale_score
        description:
          Scale score achieved. Null for internal (percent-correct) rows.
        sql: scale_score
        type: number
        public: true

      - name: percent_correct
        description: Percent correct. Null for state assessments.
        sql: percent_correct
        type: number
        public: true

      - name: response_type
        description: >-
          Response-type breakdown. Never null; four values — overall (every
          source), standard and not_taken (Illuminate only), and group
          (Illuminate, i-Ready and DIBELS). Not additive across values, so
          filter it explicitly; default to overall.
        sql: response_type
        type: string
        public: true

      - name: response_type_code
        description: Short code identifying the response type. Null for state.
        sql: response_type_code
        type: string
        public: true

      - name: response_type_description
        description: Human-readable response-type description. Null for state.
        sql: response_type_description
        type: string
        public: true

      - name: response_type_root_description
        description: >-
          Description of the root (top-level) response type. Null for state.
        sql: response_type_root_description
        type: string
        public: true

      - name: is_replacement
        description: >-
          Illuminate-only flag. TRUE when a K-8 student sat a
          replacement-curriculum assessment off their enrolled grade level. Null
          for all non-Illuminate sources (state and vendor: iReady, DIBELS,
          STAR), which have no replacement-curriculum concept.
        sql: is_replacement
        type: boolean
        public: true

    measures:
      # Three nested counts, widest first: assigned contains taken contains
      # scored. Each answers a different question and they are not
      # interchangeable — see each description. Renamed from count_scores in
      # #5501, which counted the widest population under the narrowest name.
      - name: count_assigned
        description: >-
          Every assessment row, including the Illuminate not_taken rows where a
          student was assigned an assessment and never sat it. This is the
          widest of the three counts and the denominator for pct_taken. For
          assessments actually sat use count_taken; for the population
          pct_proficient is computed over use count_scored. COUNT(*) over the
          unique PK (assessment_score_key) — additive, so pre-aggregations roll
          it up to any grain.
        type: count
        public: true
        # Forces joins to student_assessments and regions so all proficiency
        # measures share one CTE, enabling side-by-side queries without
        # BigQuery's "query too complex" multi-CTE fan-out error.
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"

      - name: count_taken
        description: >-
          Assessments a student actually sat — every row except the Illuminate
          not_taken placeholders. Use this for "how many assessments were
          taken". It is wider than count_scored: a student can sit an assessment
          that carries no proficiency verdict, which is most STAR kindergarten
          and Early Literacy rows and the DIBELS K-2 phonics subtests. Only
          Illuminate can express non-participation, so for every other source
          this equals count_assigned.
        type: count
        public: true
        filters:
          - sql: "{CUBE}.response_type != 'not_taken'"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"

      - name: count_students
        description: >-
          Distinct students (per student-year) with a score in the filtered
          slice. Exact count_distinct — non-additive, so a rollup
          pre-aggregation cannot re-aggregate it to a coarser grain; switch to
          count_distinct_approx (HLL) if/when this is pre-aggregated and an
          approximate distinct is acceptable.
        sql: "{student_section_enrollments.student_enrollment_key}"
        type: count_distinct
        public: true

      - name: _sum_proficient
        description: >-
          Additive proficient-score count (1 per mastered response). Building
          block for pct_proficient.
        sql: "IF({CUBE}.is_mastery, 1, 0)"
        type: sum
        public: false
        # Forces joins to student_assessments and regions so all proficiency
        # measures share one CTE, enabling side-by-side queries without
        # BigQuery's "query too complex" multi-CTE fan-out error.
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"

      - name: count_scored
        description: >-
          Assessments carrying a proficiency verdict (is_mastery set) — the
          narrowest of the three counts and the denominator pct_proficient is
          computed over. A row with no verdict cannot enter the numerator, so
          counting it would only drag the rate down. Narrower than count_taken
          by the rows that were sat but cannot be judged: STAR publishes no
          proficiency benchmark for kindergarten at any subject or for Early
          Literacy at any grade, and the DIBELS K-2 phonics subtests have no
          benchmark level set upstream. Report this alongside pct_proficient
          whenever the rate carries weight — it is the n the rate rests on, and
          it is not count_assigned.
        type: count
        public: true
        # Forces joins to student_assessments and regions so all proficiency
        # measures share one CTE, enabling side-by-side queries without
        # BigQuery's "query too complex" multi-CTE fan-out error.
        filters:
          - sql: "{CUBE}.is_mastery IS NOT NULL"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"

      - name: pct_taken
        description: >-
          Grain: recomputes at any query grain, but meaningful only within
          Illuminate — pooling it across sources is a silent-failure trap
          (numerically valid, semantically meaningless). Participation rate —
          assessments sat / assessments assigned. Only Illuminate records
          non-participation, so every other source reads exactly 100% by
          construction rather than by fact, and a pooled cross-source rate is
          diluted by sources that cannot express a no-show. Filter
          assessment_type to illuminate before reporting this. Built from
          additive primitives (count_taken / count_assigned) so pre-aggregations
          roll it up to any grain.
        sql: "1.0 * {count_taken} / NULLIF({count_assigned}, 0)"
        type: number
        format: percent
        public: true

      - name: pct_proficient
        description: >-
          Proficiency/mastery rate — proficient scores / scores carrying a
          proficiency verdict. The headline, source-agnostic metric (the only
          score measure comparable across the incompatible scales of internal vs
          state assessments). Its denominator is count_scored, NOT
          count_assigned, so multiplying this rate by count_assigned overstates
          the proficient count — by 1.49x on STAR. Pair it with count_scored,
          which is the n it rests on. Built from additive primitives
          (_sum_proficient / count_scored) so pre-aggregations roll it up to any
          grain.
        sql: "1.0 * {_sum_proficient} / NULLIF({count_scored}, 0)"
        type: number
        format: percent
        public: true

      - name: _sum_percent_correct
        description: >-
          Additive sum of percent_correct (nulls ignored). Building block for
          avg_percent_correct.
        sql: percent_correct
        type: sum
        public: false

      - name: _count_percent_correct
        description: >-
          Count of rows with a non-null percent_correct (internal scores).
          Building block for avg_percent_correct.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.percent_correct IS NOT NULL"

      - name: avg_percent_correct
        description: >-
          Grain: recomputes at any query grain, but meaningful only within a
          single subject/standard — pooling percent-correct across assessments
          is a silent-failure trap (numerically valid, semantically
          meaningless). Average percent correct, internal-effective (null for
          state), built from additive primitives so pre-aggregations roll it up.
        sql: "{_sum_percent_correct} / NULLIF({_count_percent_correct}, 0)"
        type: number
        public: true

      - name: _sum_scale_score
        description: >-
          Additive sum of scale_score (nulls ignored). Building block for
          avg_scale_score.
        sql: scale_score
        type: sum
        public: false

      - name: _count_scale_score
        description: >-
          Count of rows with a non-null scale_score (state scores). Building
          block for avg_scale_score.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.scale_score IS NOT NULL"

      - name: avg_scale_score
        description: >-
          Grain: recomputes at any query grain, but meaningful only within a
          single assessment source/subject/grade — scale scores are not
          comparable across sources, so pooling them is a silent-failure trap
          (numerically valid, semantically meaningless). Average scale score,
          built from additive primitives so pre-aggregations roll it up.
        sql: "{_sum_scale_score} / NULLIF({_count_scale_score}, 0)"
        type: number
        public: true

      - name: _sum_proficient_formative
        description: >-
          Additive proficient-score count scoped to formative module types (QA,
          MQQ, CRQ). Building block for pct_proficient_formative.
        sql: "IF({CUBE}.is_mastery, 1, 0)"
        type: sum
        public: false
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} IN ('QA', 'MQQ', 'CRQ')"

      - name: _count_scored_formative
        description: >-
          Count of rows carrying a proficiency verdict (is_mastery set), scoped
          to formative module types (QA, MQQ, CRQ). Building block for
          pct_proficient_formative — a row with no verdict cannot enter the
          numerator, so counting it only drags the rate down.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.is_mastery IS NOT NULL"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} IN ('QA', 'MQQ', 'CRQ')"

      - name: pct_proficient_formative
        description: >-
          Proficiency rate across all formative module types (Quick Assessments,
          Multiple-Choice Quick Questions, and Constructed Response Questions).
          CRQ is included and also available as the standalone
          pct_proficient_crq measure. The denominator excludes rows with no
          proficiency verdict (is_mastery unset), matching pct_proficient. Built
          from additive primitives so pre-aggregations roll it up.
        sql:
          "1.0 * {_sum_proficient_formative} / NULLIF({_count_scored_formative},
          0)"
        type: number
        format: percent
        public: true

      - name: _sum_proficient_crq
        description: >-
          Additive proficient-score count scoped to Constructed Response
          Questions (CRQ). Building block for pct_proficient_crq.
        sql: "IF({CUBE}.is_mastery, 1, 0)"
        type: sum
        public: false
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} = 'CRQ'"

      - name: _count_scored_crq
        description: >-
          Count of rows carrying a proficiency verdict (is_mastery set), scoped
          to Constructed Response Questions (CRQ). Building block for
          pct_proficient_crq — a row with no verdict cannot enter the numerator,
          so counting it only drags the rate down.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.is_mastery IS NOT NULL"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} = 'CRQ'"

      - name: pct_proficient_crq
        description: >-
          Proficiency rate for Constructed Response Questions (CRQ) across all
          regions. CRQ is a subset of pct_proficient_formative. The denominator
          excludes rows with no proficiency verdict (is_mastery unset), matching
          pct_proficient. Built from additive primitives so pre-aggregations
          roll it up.
        sql: "1.0 * {_sum_proficient_crq} / NULLIF({_count_scored_crq}, 0)"
        type: number
        format: percent
        public: true

    pre_aggregations:
      # Rollup on the additive proficiency primitives for the standard-level
      # proficiency-by-demographic hot path. Includes the RLS scoping keys
      # (locations.region_key / locations.abbreviation) so region/school viewers
      # hit the rollup rather than falling back to the fact. Also includes the
      # lead teacher (key + name) so "proficiency by teacher" queries — grouped
      # by lead_teacher_staff_key or staff_lead_teacher.full_name — hit the
      # rollup. A rollup only serves a query whose grouped members are all in
      # it, so the name must be here (and exposed on the view) or a name-grouped
      # query falls back to the fact. The key adds cardinality; the name is 1:1
      # with the key (adds width, not rows).
      - name: proficiency_rollup
        measures:
          # All three nested counts plus the proficient sum, so every rate the
          # view exposes is servable here. A rollup only serves a query whose
          # every referenced member is in it: without count_scored every
          # pct_proficient query falls back to the fact, and without
          # count_taken every pct_taken query does.
          - student_assessment_scores.count_assigned
          - student_assessment_scores.count_taken
          - student_assessment_scores.count_scored
          - student_assessment_scores._sum_proficient
        dimensions:
          - dates.academic_year
          - student_assessments.module_code
          # module_type is functionally determined by module_code above, so it
          # adds no rollup rows; it lets queries filter by the coarser
          # QA / MQQ / CRQ grouping.
          - student_assessments.module_type
          - student_assessments.academic_subject
          - student_assessments.grade_level_tested
          - student_assessment_administrations.administration_period
          - student_assessment_scores.response_type_code
          # response_type (overall / standard / group / not_taken) is
          # effectively determined by response_type_code above: 1,863 distinct
          # codes against 1,865 code+type pairs, so it adds no meaningful
          # cardinality. response_type_description is NOT determined by the
          # code — it is null on all 2,797,958 Illuminate group rows where the
          # description is populated, so ~900 descriptions share one null code.
          # Measure the cost at THIS grain, not on the code/description pair
          # alone: in isolation the pair looks like a 1.49x multiplier, but
          # across the rollup's full dimension set it is 1.13x — 2,372,041 rows
          # without the description against 2,690,413 with it (2026-09-23),
          # because teacher, school, race, grade and module already separate
          # most of those rows. Cheap at that size, and it serves the
          # standard-level cut the working group runs (filter
          # response_type = 'standard', break out by response_type_description
          # — the IEP-vs-gen-ed-by-standard pilot pattern, WG 2026-07-02). A
          # rollup only serves a query whose every member it carries, so
          # dropping it would push that cut back to the fact.
          - student_assessment_scores.response_type
          - student_assessment_scores.response_type_description
          - students.race
          - students.gender_identity
          - student_school_enrollments.grade_level
          # is_iep is the one independent addition (binary, so at most 2x rows);
          # it serves the IEP-vs-gen-ed disparity cut.
          - student_enrollment_status.is_iep
          - locations.region_key
          - locations.abbreviation
          # region_name is functionally determined by region_key above (zero
          # added rows) — supports region-name filter phrasing (e.g. "Newark").
          - regions.region_name
          # lead teacher (key + name) so proficiency-by-teacher queries hit the
          # rollup rather than the ~14.2M-row fact; the key adds cardinality,
          # the name is 1:1 with the key (width, not rows).
          - student_section_enrollments.lead_teacher_staff_key
          - staff_lead_teacher.full_name
        # Partitioned refresh: without a time_dimension, Cube rebuilds this
        # entire rollup from the ~14.2M-row fact on every refresh_key check,
        # regardless of what changed. dates.date_day (via
        # student_assessment_scores -> dates, keyed on assessment_date_key), not
        # the cube's own date_taken, is the time anchor — date_taken is
        # documented above as corrupt for a small share of rows, whereas
        # assessment_date_key is the administration date where present, else the
        # test date. Year partitioning (not day/month) matches how corrections
        # actually land: restatements replace a whole academic year at a time,
        # so a correction only invalidates the partition(s) touching that year,
        # not the full history.
        # State/vendor administrations are diagnostic windows, not single days,
        # so one straddling July 1 lands its scores across two academic_year
        # partitions here, by each score's own test date. That is correct
        # per-score attribution, not a fan-out: 0 state administrations split
        # today, only a handful of iReady/DIBELS windows do (#4546 finding 3).
        time_dimension: dates.date_day
        granularity: year
        partition_granularity: year
        # Bound the build range to real assessment history. Without this, Cube
        # derives the range from the time_dimension's min/max — and
        # dates.date_day resolves through dim_dates, whose calendar spine runs
        # to 9999, so the scheduled-refresh worker enumerates ~8,000 empty
        # yearly partitions (this is why #4460 was reverted). Floor is set below
        # the earliest assessment_date_key carrying a score (2015-08-14, verified
        # 2026-07-20 -- vendor test dates are all later, so the coalesced key's
        # min is unchanged from the administration-date min); the end tracks
        # today. Yields ~12 partitions. Rows outside [floor, today] fall back to
        # the fact (currently none); state and vendor scores now fall in range,
        # so they are covered by this rollup too.
        build_range_start:
          sql: SELECT DATE('2015-07-01')
        build_range_end:
          sql: SELECT CURRENT_DATE('America/New_York')
        refresh_key:
          every: 1 day
