cubes:
  - name: student_assessment_scores
    public: false
    sql_table: kipptaf_marts.fct_assessment_scores_enrollment_scoped

    joins:
      - name: student_assessment_administrations
        sql: >
          {student_assessment_administrations.assessment_administration_key} =
          {CUBE}.assessment_administration_key
        relationship: many_to_one

      # Calendar / academic-year rollups join dates on assessment_date_key (the
      # administration date where present, else the student's test date), NOT on
      # the administration's own date — that is null for state and vendor
      # sources, so joining there returned null academic_year for them (#4546).
      # dates is reached only through this single path (no diamond). Join on the
      # raw DATE key, never a time dimension: Cube wraps time dimensions in the
      # query-timezone convertTz inside join predicates, which zeroes the join
      # under any non-UTC timezone (#4298).
      - name: dates
        sql: "{dates.date_key} = {CUBE}.assessment_date_key"
        relationship: many_to_one

      - name: student_section_enrollments
        sql: >
          {student_section_enrollments.student_section_enrollment_key} =
          {CUBE}.student_section_enrollment_key
        relationship: many_to_one

      # Reporting quarter of the score, keyed on the fact's own term_key (the
      # quarter containing the administration/test date at the section's school).
      # Reached only through this path: the section dim no longer carries a term
      # FK, so there is no diamond back to terms (#4484).
      - name: terms
        sql: "{terms.term_key} = {CUBE}.term_key"
        relationship: many_to_one

    dimensions:
      - name: assessment_score_key
        description: Surrogate key. Primary key for this fact.
        sql: assessment_score_key
        type: string
        primary_key: true

      - name: date_taken
        description: >-
          Date the assessment was taken (completion date). Every source; null or
          wrong on a small share of Illuminate rows.
        sql: CAST(test_date_key AS TIMESTAMP)
        type: time
        public: true
        meta:
          ai_context: >-
            A standalone date, not joined to the calendar, and not to find the
            most recent diagnostic: that is the latest named round in
            administration_period. For year and calendar rollups use date_day
            and academic_year, which read the administration date for Illuminate
            and college and the test date for state tests and vendor diagnostics
            (i-Ready, DIBELS, STAR).

      - name: term_key
        description: FK to terms — the reporting quarter containing the score.
        sql: term_key
        type: string

      - name: enrollment_resolution
        description: >-
          How the section enrollment was resolved: subject_section (the section
          for the assessment's subject, active on the test date) or homeroom
          (the student's HR section, used when no subject section resolved).
        sql: enrollment_resolution
        type: string
        public: true
        meta:
          ai_context: >-
            Filter to subject_section for course- and section-level rollups.

      - name: proficiency_level
        description: >-
          Proficiency label; the vocabulary is per source. i-Ready: 3 or More
          Grade Levels Below, 2 Grade Levels Below, 1 Grade Level Below, Early
          On Grade Level, Mid or Above Grade Level. DIBELS: Well Below
          Benchmark, Below Benchmark, At Benchmark, Above Benchmark, and Tested
          Out on some subtest (group) rows. STAR and FL state: Level 1 to Level
          5; STAR is null on a share of rows. NJSLA and NJSLA Science: Did Not
          Yet Meet Expectations, Partially Met Expectations, Approached
          Expectations, Met Expectations, Exceeded Expectations. NJGPA:
          Graduation Ready, Not Yet Graduation Ready. Illuminate: the
          performance band label. Tier-movement rates are not comparable across
          instruments: fewer, wider tiers mechanically raise the stayed-the-same
          rate.
        sql: proficiency_level
        type: string
        public: true
        meta:
          ai_context: >-
            On Illuminate standard and group rows, a band can carry more than
            one label spelling; group by performance_band_label_number there.
            For STAR rows with no proficiency level, filter it with notSet;
            equals "null" matches the literal string and returns zero rows.
            DIBELS rows with no verdict nearly all carry Tested Out here, not
            null. To find every row with no verdict, filter is_mastery with
            notSet.

      - name: performance_band_label_number
        description: >-
          Position of the score's band within the performance band set it was
          scored against. Illuminate only; null for every other source. Band
          sets differ in cut points, in band count, and in which band starts
          mastery, so band 5 is not always the top. Not comparable across
          assessments, or across response types within one assessment: standard
          and group rows can carry different band labels than the assessment's
          overall rows.
        sql: performance_band_label_number
        type: number
        public: true
        meta:
          ai_context: >-
            Compare band numbers within one assessment and one response_type.
            There, prefer this number to proficiency_level text for grouping and
            ordering; on standard and group rows a few bands carry more than one
            label spelling.

      - name: is_mastery
        description: >-
          Per-row proficient flag that pct_proficient is built from. The bar is
          per source: i-Ready, Early On Grade Level and Mid or Above Grade Level
          — Early On is a looser bar than at or above grade level; DIBELS, At
          and Above Benchmark; STAR and FL, Level 3 and up; NJSLA, Met and
          Exceeded Expectations; NJGPA, Graduation Ready; Illuminate, set by
          each assessment's band set, so an Illuminate rate mixes different
          bars. Null where the source gives no verdict: Illuminate not_taken
          rows, DIBELS Tested Out subtests, and STAR rows with no level.
        sql: is_mastery
        type: boolean
        public: true
        meta:
          ai_context: >-
            For i-Ready at or above grade level, filter proficiency_level to Mid
            or Above Grade Level instead. When reporting an Illuminate rate, say
            which assessments it covers.

      - name: scale_score
        description: >-
          Scale score achieved. Every source except Illuminate, which reports
          percent_correct instead. Scales differ by source and are not
          comparable across sources or subjects; within i-Ready the scale also
          compresses at higher grades, so a change in score is not comparable
          between elementary and middle grades.
        sql: scale_score
        type: number
        public: true
        meta:
          ai_context: >-
            Report a scale-score change separately for elementary and middle
            grades, and as a point difference, not a percent of the BOY score.
            Do not label a computed change with i-Ready's growth-measure names;
            those norms are not in this view.

      - name: percent_correct
        description: >-
          Percent of questions answered correctly. Illuminate only; null for
          every other source.
        sql: percent_correct
        type: number
        public: true

      - name: response_type
        description: >-
          Response-type breakdown. Never null; 4 values: overall (a subject,
          course-level or composite score; every source), group (a strand or
          domain rollup within a subject; Illuminate, i-Ready and DIBELS),
          standard (one Illuminate standard; Illuminate only) and not_taken (an
          Illuminate assessment a student was assigned and never sat, with no
          recorded response). Not additive across values.
        sql: response_type
        type: string
        public: true
        meta:
          ai_context: >-
            Filter it on every query; default to overall unless a standard or
            group breakdown is asked for.

      - name: response_type_code
        description: >-
          Breakdown identifier — the standard code on Illuminate standard rows,
          the domain on i-Ready group rows, the subtest on DIBELS group rows.
          Null on Illuminate group rows and on every overall and not_taken row.
          Some CCSS Math standards carry 2 spellings (8.EE.C.8.b and 8.EE.C.8b),
          and a small share of older rows have an empty code (an empty string,
          not null).
        sql: response_type_code
        type: string
        public: true
        meta:
          ai_context: >-
            For a standards rollup, merge the 2 spellings first: remove a dot
            only when it sits right before a trailing lowercase letter. Then
            recompute the rate from the merged counts (pct_proficient ×
            count_scored, summed, over summed count_scored); never average the 2
            reported rates. For an Illuminate group-level cut, group on
            response_type_description — this code is null there, so keying on it
            drops every Illuminate group row and keeps i-Ready and DIBELS.

      - name: response_type_description
        description: >-
          Human-readable breakdown label. Populated on standard rows and every
          group row; null on overall and not_taken. A few standards carry
          whitespace variants of the same label.
        sql: response_type_description
        type: string
        public: true

      - name: response_type_root_description
        description: >-
          CCSS domain the standard rolls up to. Populated only on Illuminate
          standard rows that resolve a parent standard. Unreliable for
          Illuminate content aligned to Florida's own standards, whose codes do
          not fit the CCSS hierarchy.
        sql: response_type_root_description
        type: string
        public: true

      - name: is_replacement
        description: >-
          Illuminate-only flag. TRUE when a K-8 student sat a
          replacement-curriculum assessment off their enrolled grade level. Null
          for every other source (the state tests and the i-Ready, DIBELS and
          STAR diagnostics), which have no replacement-curriculum concept.
        sql: is_replacement
        type: boolean
        public: true

    measures:
      # Three nested counts, widest first: assigned contains taken contains
      # scored. Each answers a different question and they are not
      # interchangeable — see each description. Renamed from count_scores in
      # #5501, which counted the widest population under the narrowest name.
      # COUNT(*) over the unique PK (assessment_score_key): additive, so pre-
      # aggregations roll it up to any grain.
      - name: count_assigned
        description: >-
          Every assessment row, including the Illuminate not_taken rows where a
          student was assigned an assessment and never sat it. The widest of 3
          nested counts: assigned contains taken contains scored.
        type: count
        public: true
        # Forces joins to student_assessments and regions so all proficiency
        # measures share one CTE, enabling side-by-side queries without
        # BigQuery's "query too complex" multi-CTE fan-out error.
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
        meta:
          ai_context: >-
            For assessments actually sat use count_taken; for the population
            pct_proficient is computed over use count_scored.

      - name: count_taken
        description: >-
          Assessments a student actually sat: every row except the Illuminate
          not_taken placeholders. Only Illuminate records non-participation, so
          for every other source this equals count_assigned. Wider than
          count_scored, because a sat assessment can carry no proficiency
          verdict: STAR rows with no level, and DIBELS Tested Out subtests.
        type: count
        public: true
        filters:
          - sql: "{CUBE}.response_type != 'not_taken'"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
        meta:
          ai_context: >-
            Use this for "how many assessments were taken".

      # Exact count_distinct: non-additive, so a rollup pre-aggregation cannot
      # re-aggregate it to a coarser grain. Switch to count_distinct_approx
      # (HLL) if this is pre-aggregated and an approximate distinct is
      # acceptable.
      - name: count_students
        description: >-
          Distinct students (per student-year) with a score in the filtered
          slice.
        sql: "{student_section_enrollments.student_enrollment_key}"
        type: count_distinct
        public: true
        meta:
          ai_context: >-
            Heavier than the plain counts, and has timed out at standard grain;
            use count_taken there, and report it as assessments taken, not
            students.

      - name: _sum_proficient
        description: >-
          Additive proficient-score count (1 per mastered response). Building
          block for pct_proficient.
        sql: "IF({CUBE}.is_mastery, 1, 0)"
        type: sum
        public: false
        # Forces joins to student_assessments and regions so all proficiency
        # measures share one CTE, enabling side-by-side queries without
        # BigQuery's "query too complex" multi-CTE fan-out error.
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"

      # Exact count_distinct: non-additive, so proficiency_rollup cannot serve
      # it and every query using it reads the fact. Measured 2026-09-30 at
      # standard grain (one year, Illuminate, by response_type_code): 7.5s,
      # well inside the MCP deadline, so it carries no timeout caveat.
      - name: count_assessments
        description: >-
          Distinct Illuminate assessments in the filtered set — not sittings,
          not scored responses. Illuminate only: every other source has no
          source_assessment_id, so it reads 0 there.
        sql: "{student_assessment_administrations.source_assessment_id}"
        type: count_distinct
        public: true
        # Same join-forcing filters as the other counts, so every measure
        # shares one CTE (see count_assigned).
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
        meta:
          ai_context: >-
            Use this for "how many times was this assessed". A standard resting
            on 1 assessment is a thin base for a trend; say so rather than
            trending it.

      - name: count_scored
        description: >-
          Assessments carrying a proficiency verdict (is_mastery set). The
          narrowest count, and the denominator of pct_proficient.
        type: count
        public: true
        # Forces joins to student_assessments and regions so all proficiency
        # measures share one CTE, enabling side-by-side queries without
        # BigQuery's "query too complex" multi-CTE fan-out error.
        filters:
          - sql: "{CUBE}.is_mastery IS NOT NULL"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
        meta:
          ai_context: >-
            Report it alongside pct_proficient whenever the rate carries weight;
            it is the n the rate rests on.

      - name: count_proficient
        description: >-
          Assessments where the student met the proficiency threshold. The
          numerator of pct_proficient, whose denominator is count_scored.
        sql: "{_sum_proficient}"
        type: number
        public: true
        meta:
          ai_context: >-
            Use this for "how many were proficient" rather than multiplying
            pct_proficient by a count.

      # Built from additive primitives (count_taken / count_assigned) so pre-
      # aggregations roll it up to any grain.
      - name: pct_taken
        description: >-
          Grain: meaningful only within Illuminate; pooling across sources is a
          silent-failure trap. Participation rate: assessments sat / assessments
          assigned. Every other source reads 100% by construction.
        sql: "1.0 * {count_taken} / NULLIF({count_assigned}, 0)"
        type: number
        format: percent
        public: true
        meta:
          ai_context: >-
            Filter assessment_type to illuminate before reporting it.

      # Built from additive primitives (_sum_proficient / count_scored) so
      # pre-aggregations roll it up to any grain.
      - name: pct_proficient
        description: >-
          Proficiency rate: proficient scores / scores carrying a verdict
          (count_scored). The headline metric, and the only score measure
          comparable across sources' incompatible scales.
        sql: "1.0 * {_sum_proficient} / NULLIF({count_scored}, 0)"
        type: number
        format: percent
        public: true
        meta:
          ai_context: >-
            Pair it with count_scored; never multiply it by count_assigned to
            get a proficient count.

      - name: _sum_percent_correct
        description: >-
          Additive sum of percent_correct (nulls ignored). Building block for
          avg_percent_correct.
        sql: percent_correct
        type: sum
        public: false

      - name: _count_percent_correct
        description: >-
          Count of rows with a non-null percent_correct (internal scores).
          Building block for avg_percent_correct.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.percent_correct IS NOT NULL"

      - name: avg_percent_correct
        description: >-
          Grain: recomputes at any query grain, but meaningful only within a
          single subject/standard — pooling percent-correct across assessments
          is a silent-failure trap (numerically valid, semantically
          meaningless). Average percent correct. Illuminate only; null for every
          other source. Built from additive primitives so pre-aggregations roll
          it up.
        sql: "{_sum_percent_correct} / NULLIF({_count_percent_correct}, 0)"
        type: number
        public: true

      - name: _sum_scale_score
        description: >-
          Additive sum of scale_score (nulls ignored). Building block for
          avg_scale_score.
        sql: scale_score
        type: sum
        public: false

      - name: _count_scale_score
        description: >-
          Count of rows with a non-null scale_score (every source except
          Illuminate). Building block for avg_scale_score.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.scale_score IS NOT NULL"

      - name: avg_scale_score
        description: >-
          Grain: recomputes at any query grain, but meaningful only within a
          single assessment source/subject/grade — scale scores are not
          comparable across sources, so pooling them is a silent-failure trap
          (numerically valid, semantically meaningless). Average scale score,
          built from additive primitives so pre-aggregations roll it up.
        sql: "{_sum_scale_score} / NULLIF({_count_scale_score}, 0)"
        type: number
        public: true

      - name: _sum_proficient_formative
        description: >-
          Additive proficient-score count scoped to formative module types (QA,
          MQQ, CRQ). Building block for pct_proficient_formative.
        sql: "IF({CUBE}.is_mastery, 1, 0)"
        type: sum
        public: false
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} IN ('QA', 'MQQ', 'CRQ')"

      - name: _count_scored_formative
        description: >-
          Count of rows carrying a proficiency verdict (is_mastery set), scoped
          to formative module types (QA, MQQ, CRQ). Building block for
          pct_proficient_formative — a row with no verdict cannot enter the
          numerator, so counting it only drags the rate down.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.is_mastery IS NOT NULL"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} IN ('QA', 'MQQ', 'CRQ')"

      # Built from additive primitives so pre-aggregations roll it up.
      - name: pct_proficient_formative
        description: >-
          Proficiency rate across the QA, MQQ and CRQ module types only;
          excludes TP, UA, ET and WPP, about a third of module-coded Illuminate
          scores. Its denominator counts only rows with a proficiency verdict,
          as in pct_proficient. CRQ is also available alone as
          pct_proficient_crq.
        sql:
          "1.0 * {_sum_proficient_formative} / NULLIF({_count_scored_formative},
          0)"
        type: number
        format: percent
        public: true
        meta:
          ai_context: >-
            Not "all internal checkpoints". For that, build the rollup from the
            intended module types and flag the pooling choice as an open
            decision.

      - name: _sum_proficient_crq
        description: >-
          Additive proficient-score count scoped to Constructed Response
          Questions (CRQ). Building block for pct_proficient_crq.
        sql: "IF({CUBE}.is_mastery, 1, 0)"
        type: sum
        public: false
        filters:
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} = 'CRQ'"

      - name: _count_scored_crq
        description: >-
          Count of rows carrying a proficiency verdict (is_mastery set), scoped
          to Constructed Response Questions (CRQ). Building block for
          pct_proficient_crq — a row with no verdict cannot enter the numerator,
          so counting it only drags the rate down.
        type: count
        public: false
        filters:
          - sql: "{CUBE}.is_mastery IS NOT NULL"
          - sql: "{student_assessments.assessment_key} IS NOT NULL"
          - sql: "{regions.region_key} IS NOT NULL"
          - sql: "{student_assessments.module_type} = 'CRQ'"

      - name: pct_proficient_crq
        description: >-
          Proficiency rate for Constructed Response Questions (CRQ) across all
          regions. CRQ is a subset of pct_proficient_formative. The denominator
          excludes rows with no proficiency verdict (is_mastery unset), matching
          pct_proficient. Built from additive primitives so pre-aggregations
          roll it up.
        sql: "1.0 * {_sum_proficient_crq} / NULLIF({_count_scored_crq}, 0)"
        type: number
        format: percent
        public: true

    pre_aggregations:
      # Rollup on the additive proficiency primitives for the standard-level
      # proficiency-by-demographic hot path. Includes the RLS scoping keys
      # (locations.region_key / locations.abbreviation) so region/school viewers
      # hit the rollup rather than falling back to the fact. Also includes the
      # lead teacher (key + name) so "proficiency by teacher" queries — grouped
      # by lead_teacher_staff_key or staff_lead_teacher.full_name — hit the
      # rollup. A rollup only serves a query whose grouped members are all in
      # it, so the name must be here (and exposed on the view) or a name-grouped
      # query falls back to the fact. The key adds cardinality; the name is 1:1
      # with the key (adds width, not rows).
      - name: proficiency_rollup
        measures:
          # All three nested counts plus the proficient sum, so every rate the
          # view exposes is servable here. A rollup only serves a query whose
          # every referenced member is in it: without count_scored every
          # pct_proficient query falls back to the fact, and without
          # count_taken every pct_taken query does.
          - student_assessment_scores.count_assigned
          - student_assessment_scores.count_taken
          - student_assessment_scores.count_scored
          - student_assessment_scores._sum_proficient
        dimensions:
          - dates.academic_year
          - student_assessments.module_code
          # module_type is functionally determined by module_code above, so it
          # adds no rollup rows; it lets queries filter by the coarser
          # QA / MQQ / CRQ grouping.
          - student_assessments.module_type
          - student_assessments.academic_subject
          - student_assessments.grade_level_tested
          - student_assessment_administrations.administration_period
          - student_assessment_scores.response_type_code
          # response_type is effectively determined by response_type_code
          # above, so it adds no meaningful cardinality.
          # response_type_description is NOT: the code is null on the
          # Illuminate group rows where the description is populated, so many
          # descriptions share one null code. Measure that cost at THIS grain
          # before acting on it — on the code/description pair alone the
          # multiplier looks several times larger than it is across the
          # rollup's full dimension set, where teacher, school, race, grade and
          # module already separate most of the rows. It measured small enough
          # to ignore, and it serves the standard-level cut the working group
          # runs (filter response_type = 'standard', break out by
          # response_type_description — the IEP-vs-gen-ed-by-standard pilot
          # pattern, WG 2026-07-02). A rollup only serves a query whose every
          # member it carries, so dropping it would push that cut back to the
          # fact. To re-measure: count distinct combinations of this
          # pre-aggregation's dimension list with and without the description.
          - student_assessment_scores.response_type
          - student_assessment_scores.response_type_description
          - students.race
          - students.gender_identity
          - student_school_enrollments.grade_level
          # is_iep is the one independent addition (binary, so at most 2x rows);
          # it serves the IEP-vs-gen-ed disparity cut.
          - student_enrollment_status.is_iep
          - locations.region_key
          - locations.abbreviation
          # region_name is functionally determined by region_key above (zero
          # added rows) — supports region-name filter phrasing (e.g. "Newark").
          - regions.region_name
          # lead teacher (key + name) so proficiency-by-teacher queries hit the
          # rollup rather than the ~14.2M-row fact; the key adds cardinality,
          # the name is 1:1 with the key (width, not rows).
          - student_section_enrollments.lead_teacher_staff_key
          - staff_lead_teacher.full_name
        # Partitioned refresh: without a time_dimension, Cube rebuilds this
        # entire rollup from the ~14.2M-row fact on every refresh_key check,
        # regardless of what changed. dates.date_day (via
        # student_assessment_scores -> dates, keyed on assessment_date_key), not
        # the cube's own date_taken, is the time anchor — date_taken is
        # documented above as corrupt for a small share of rows, whereas
        # assessment_date_key is the administration date where present, else the
        # test date. Year partitioning (not day/month) matches how corrections
        # actually land: restatements replace a whole academic year at a time,
        # so a correction only invalidates the partition(s) touching that year,
        # not the full history.
        # State/vendor administrations are diagnostic windows, not single days,
        # so one straddling July 1 lands its scores across two academic_year
        # partitions here, by each score's own test date. That is correct
        # per-score attribution, not a fan-out: 0 state administrations split
        # today, only a handful of iReady/DIBELS windows do (#4546 finding 3).
        time_dimension: dates.date_day
        granularity: year
        partition_granularity: year
        # Bound the build range to real assessment history. Without this, Cube
        # derives the range from the time_dimension's min/max — and
        # dates.date_day resolves through dim_dates, whose calendar spine runs
        # to 9999, so the scheduled-refresh worker enumerates ~8,000 empty
        # yearly partitions (this is why #4460 was reverted). Floor is set below
        # the earliest assessment_date_key carrying a score (2015-08-14, verified
        # 2026-07-20 -- vendor test dates are all later, so the coalesced key's
        # min is unchanged from the administration-date min); the end tracks
        # today. Yields ~12 partitions. Rows outside [floor, today] fall back to
        # the fact (currently none); state and vendor scores now fall in range,
        # so they are covered by this rollup too.
        build_range_start:
          sql: SELECT DATE('2015-07-01')
        build_range_end:
