cubes:
  - name: student_assessment_administrations
    public: false
    sql_table: kipptaf_marts.dim_assessment_administrations

    joins:
      # The calendar / dates join lives on student_assessment_scores (keyed on
      # assessment_date_key), NOT here: state and vendor administrations carry a
      # null administered_date_key, so joining dates on it returned null
      # academic_year for every non-Illuminate source (#4546). The scores cube
      # joins dates on the coalesced calendar date instead, which is populated
      # for all sources. This cube keeps only its FK to student_assessments.
      - name: student_assessments
        sql: "{student_assessments.assessment_key} = {CUBE}.assessment_key"
        relationship: many_to_one

    dimensions:
      - name: assessment_administration_key
        description: >-
          Surrogate key for the administration occurrence. Primary key.
        sql: assessment_administration_key
        type: string
        primary_key: true

      # FK to student_assessments — descriptors come from that cube, not here.
      - name: assessment_key
        description: FK to student_assessments (canonical-representative row).
        sql: assessment_key
        type: string

      - name: administration_period
        description: >-
          Window within the academic year; the vocabulary is per source. i-Ready
          and DIBELS: BOY, MOY, EOY, plus Outside Round for i-Ready sittings
          outside the 3 windows. STAR: Fall, Winter, Spring. NJGPA: Fall (the
          routine retake window) and Spring. NJSLA and NJSLA Science: Spring. FL
          FAST: PM1 to PM3; FL end-of-course and science: PM3. College: the
          College Board round. Every source except Illuminate. i-Ready and
          DIBELS EOY falls after spring state testing; MOY is the last named
          round before it.
        sql: administration_period
        type: string
        public: true
        meta:
          ai_context: >-
            Only meaningful with assessment_type scoped. A BOY/MOY/EOY filter
            drops Outside Round, so say which windows you used. "Most recent
            diagnostic" is the latest named round in the latest
            academic_year_label, not the max date_taken. An EOY-versus-state
            comparison in one year is concurrent, not predictive; use MOY.

      - name: test_type
        description: >-
          Official vs Practice for college-entrance administrations. Null for
          Illuminate, state, and AP.
        sql: test_type
        type: string
        public: true

      - name: source_assessment_id
        description: >-
          Illuminate assessment id at the administration grain (the canonical
          id). Illuminate only; null for every other source.
        sql: source_assessment_id
        type: number
        public: true
        meta:
          ai_context: >-
            "How many times was this assessed" is a distinct count of this, not
            a row count; count_assessments is that count.
