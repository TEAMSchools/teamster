cubes:
  - name: student_assessments
    public: false
    sql_table: kipptaf_marts.dim_assessments

    dimensions:
      - name: assessment_key
        description: >-
          Surrogate key (type, module_code, source_assessment_id, test_type).
          Primary key. Member-grained for Illuminate and Focus Assessments;
          canonical for state/college/AP.
        sql: assessment_key
        type: string
        primary_key: true

      - name: title
        description: Display name of the assessment.
        sql: title
        type: string
        public: true

      - name: academic_subject
        description: >-
          Subject tested; the vocabulary is per source. State tests: English
          Language Arts, Mathematics, Science, and course names for
          end-of-course tests (Algebra I, Algebra II, Geometry, Civics). i-Ready
          and STAR: Math and Reading, plus Early Literacy for STAR. DIBELS:
          Reading. Illuminate: course-level names, with no English Language Arts
          value; its ELA equivalent is Text Study, alongside Writing, English
          100–400, CCR and AP courses, and math appears as Mathematics and
          course names such as Algebra I and Geometry. Focus Assessments: Text
          Study, Mathematics, Science and Social Studies. College: Math, EBRW,
          Reading, English, Science, and score names such as Combined and
          Composite. AP: the course name (for example Biology, Calculus BC).
          Distinct from the course's discipline.
        sql: academic_subject
        type: string
        public: true
        meta:
          ai_context: >-
            Check this member's values for the source before filtering; a wrong
            label returns zero rows with no error. Which labels count as 'math'
            or 'ELA' across sources is an open decision; say which labels you
            included.

      - name: assessment_type
        description: >-
          Source-system category — illuminate and apex (KIPP-authored internal
          interims, from Illuminate and from Focus Assessments, Focus's Apex
          module); iready, dibels and star (vendor diagnostics); college (SAT,
          ACT and PSAT, Official and Practice); ap; the NJ state tests
          state_nj_njsla, state_nj_njsla_science, state_nj_njgpa and
          state_nj_parcc; the FL state tests state_fl_fast, state_fl_science,
          state_fl_eoc and state_fl_fsa; and the _unknown fallbacks. An open
          list. From spring 2026, NJSLA and NJGPA are computer-adaptive, and no
          field separates adaptive from fixed-form scores. NJSLA Science did not
          change.
        sql: "{CUBE}.`type`"
        type: string
        public: true
        meta:
          ai_context: >-
            Use this member to select a source. For internal results in general,
            filter is_internal_assessment instead: a school can move from
            illuminate to apex between years, so filtering 1 of them drops that
            school's other years. college, ap, state_nj_parcc, state_fl_fsa and
            the _unknown fallbacks carry no scores on this view today, so zero
            rows for them is coverage, not a failure; treat that list as
            current, not closed. Flag any NJSLA or NJGPA comparison that crosses
            spring 2026 as possibly comparing 2 scales; never present that trend
            as settled.

      - name: category
        description: >-
          Assessment category by format/content (e.g., CMA, CGI, NJSLA, FAST,
          SAT).
        sql: category
        type: string
        public: true

      - name: module_code
        description: >-
          Code identifying the assessment within its source. Illuminate and
          Focus Assessments: the checkpoint code within a module type (for
          example QA1, MQQ2), from tags set in the assessment app; one code
          spans every subject assessed in that round, and an untagged assessment
          has none. State tests: subject and grade (for example ELA05, MAT08,
          ALG01; ELAGP and MATGP for NJGPA). i-Ready and STAR: the subject.
          DIBELS: Composite. College: the test and score (for example sat_math,
          act_composite, psat10_ebrw). AP: the College Board exam number.
        sql: module_code
        type: string
        public: true
        meta:
          ai_context: >-
            Not a subject filter on its own for Illuminate or Focus Assessments,
            where one code spans every subject in its round. Always pair it with
            academic_subject. Which codes exist varies by source, subject, grade
            and region, so check the exact slice before pooling across
            checkpoints. Code names are not reliably chronological; to order
            checkpoints, group by module_code and date_taken and read the dates.

      - name: module_type
        description: >-
          Module type of an internal assessment, from tags set in the assessment
          app. An open list: QA (Quick Assessments), MQQ (Multiple-Choice Quick
          Questions), CRQ (Constructed Response Questions), UA (Unit
          Assessment), TP (Test Prep Quiz), ET (Exit Ticket), WPP (Writing
          Process Piece), BL, and older types. Illuminate and Focus Assessments
          share the codes. Null for an untagged assessment and for every other
          source.
        sql: module_type
        type: string
        public: true
        meta:
          ai_context: >-
            pct_proficient_formative covers only QA, MQQ and CRQ.

      - name: grade_level_tested
        description: >-
          Grade the assessment targets; 0 is kindergarten. Illuminate, Focus
          Assessments and state tests only; null for every other source, for the
          NJSLA end-of-course tests (Algebra I, Geometry, Algebra II), and for a
          small share of Illuminate and Focus Assessments tests.
        sql: grade_level_tested
        type: number
        public: true
        meta:
          ai_context: >-
            For a vendor diagnostic (i-Ready, DIBELS, STAR) or an NJSLA
            end-of-course test, filter grade_level instead; this member returns
            zero rows with no error. Where both are populated they answer
            different questions, and which one grade-band reporting should use
            is an open decision; say which you used.

      - name: scope
        description: >-
          How scores link to students: enrollment (tied to a section enrollment)
          or student.
        sql: scope
        type: string
        public: true

      - name: is_internal_assessment
        description: >-
          TRUE for the KIPP-authored interims, Illuminate and Focus Assessments;
          FALSE for every other source, including the i-Ready, DIBELS and STAR
          diagnostics KIPP administers itself.
        sql: is_internal_assessment
        type: boolean
        public: true
        meta:
          ai_context: >-
            Filter it to TRUE for internal results in any region or year, since
            a school's internal source can change between years. FALSE groups
            vendor diagnostics with state tests, so filter assessment_type to
            select an external source.
