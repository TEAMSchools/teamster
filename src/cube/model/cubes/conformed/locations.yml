cubes:
  - name: locations
    public: false
    sql_table: kipptaf_marts.dim_locations

    joins:
      - name: regions
        sql: "{regions.region_key} = {CUBE}.region_key"
        relationship: many_to_one

      - name: staff_head_of_school
        sql:
          "{staff_head_of_school.staff_key} = {CUBE}.head_of_school_staff_key"
        relationship: many_to_one

    dimensions:
      - name: location_key
        description: Surrogate key derived from location name.
        sql: location_key
        type: string
        primary_key: true

      - name: region_key
        description: >-
          Foreign key to regions. Surrogate key derived from
          `business_unit_code` so this column hashes exactly the keys produced
          by `regions.region_key`. Network-level locations (e.g., KIPP NJ) map
          to KIPP_TAF.
        sql: region_key
        type: string

      - name: head_of_school_staff_key
        description: >-
          Staff key of the school's head of school — the manager of the school's
          School Leader (or School Leader in Residence), as the staff roster
          reports today. Usually a Head of Schools; sometimes a Managing
          Director or Chief Academic Officer. While the School Leader seat is
          vacant, the manager most of the school's Assistant School Leaders
          report to. FK to dim_staff. Current state only, so a past year shows
          today's head of school. Null for campus rows, for schools with no
          school leadership on the roster, and when that manager is not active.
        sql: head_of_school_staff_key
        type: string

      - name: location_name
        description: Canonical location name.
        sql: "{CUBE}.`name`"
        type: string
        public: true

      - name: abbreviation
        description: Short display name for the location.
        sql: abbreviation
        type: string
        public: true

      - name: grade_band
        description: >-
          Grade band the school serves (ES, MS, HS): a school attribute, not a
          student's grade.
        sql: grade_band
        type: string
        public: true
        meta:
          # Shared with staff_directory, which has no grade_level; the student
          # views add the grade_level pointer in their own overrides.
          ai_context: >-
            A grade_band filter is a school filter.

      - name: campus
        description: Physical campus name. Multiple schools may share a campus.
        sql: campus
        type: string
        public: true

      - name: is_campus
        description:
          TRUE if this location record represents a campus-level entity.
        sql: is_campus
        type: boolean

      - name: city
        description:
          City. Nullable for non-physical rows (e.g., campus rollups).
        sql: city
        type: string
        public: true
