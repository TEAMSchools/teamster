views:
  - name: student_periods_view
    description: >-
      Student counts and rates as of the end of a period — chronic absence, ADA
      tier mix and truancy. Use this view for "how many students crossed a line"
      questions (chronic absence rate this year, ADA tier mix this month,
      truancy trend by week).

      Every measure here is student-weighted: it counts students against a
      threshold they reached cumulatively by period end. There is no
      attendance-rate measure on this view and no ADA — those are day-weighted
      and live on student_days_view, which is also where day-level questions
      belong (was a student absent on a given date, a calendar heatmap,
      day-of-week patterns). This view carries pre-computed period snapshots;
      that one carries the row-level daily record. A question that wants both a
      rate-of-students and an attendance rate is two queries, one per view: do
      not substitute pct_chronically_absent or pct_tier_1_2 for ADA, and do not
      rebuild chronic absence from daily rows.

      Set period_type to year, month, or week to select the grain and group by
      period_start_date. No anchor filter is needed or accepted — the row
      already is the period-end value, so there is nothing to pin it to: a
      single-date filter narrows which periods you get back rather than
      selecting a point in time within one. A row exists only for a period in
      which the student had a membership day at that school, so a withdrawn
      student stops appearing rather than carrying forward, and a trend's
      denominator shifts between points.

      Eligibility (count_students_min_10_days) is cumulative from the start of
      the academic year, so early periods carry a much smaller denominator than
      later ones — this is expected, not broken data. Example: by August 31 of
      AY2025, the maximum membership days any student had reached was 8, so zero
      students were CA-eligible that month — August has no chronic-absence rate
      at all, not a small one. Cumulative through September 30, eligible reached
      9,236 against 9,381 student-school pairs with any attendance day (17.8%);
      through October 31, eligible reached 9,328 (18.3%). All three
      reconciliation authorities define eligibility this way, and KIPP
      Foundation chronic-absence criteria item 1 already requires the
      eligible-student count to be shown beside the rate — always display
      count_students_min_10_days alongside any rate measure on this view, and
      especially so for the first weeks or first month of an academic year.

      Miami is present in count_students for every year, but its attendance only
      from AY2026 forward — the accepted result of the Focus cutover, and the
      same gap every Tableau attendance surface has. Miami's pre-AY2026 rows
      carry no membership days, so they never reach count_students_min_10_days
      and cannot move a rate. See fct_student_periods for why. Paterson's
      presence-derived measures (ada_tier, pct_chronically_absent, truancy)
      carry a known upstream uncertainty from incomplete PowerSchool
      attendance-conversion items (#4193), unquantified as of AY2025;
      count_students_min_10_days is unaffected — see fct_student_periods for
      detail.

    cubes:
      - join_path: student_periods
        includes:
          - count_students
          - count_students_min_10_days
          - count_chronically_absent
          - pct_chronically_absent
          - pct_tier_1_2
          - pct_tier_3
          - count_truants
          - pct_truant
          - period_type
          - period_start_date
          - period_end_date
          - academic_year
          - academic_year_label
          - ada_tier
          - is_ca_eligible
          - is_chronically_absent
          - is_truant
          - n_membership_days_ytd
          - n_present_days_ytd

      - join_path: student_periods.student_school_enrollments.locations
        prefix: true
        includes:
          - location_name
          - abbreviation
          - region_key
          - grade_band
          - campus
          - city

      - join_path: student_periods.student_school_enrollments
        prefix: false
        includes:
          - student_enrollment_key
          - grade_level
          - graduation_year
          - entry_date
          - exit_date
          - is_retained_year

      - join_path: student_periods.student_school_enrollments.students
        prefix: false
        includes:
          - student_key
          - full_name
          - birth_date
          - lea_student_identifier
          - state_student_identifier
          - gender_identity
          - race
          - enrollment_status
          - is_gifted

      - join_path: student_periods.student_school_enrollments.student_enrollment_status
        prefix: false
        includes:
          - is_ell
          - is_iep
          - iep_classification
          - special_education_code
          - special_education_name
          - special_education_placement
          - is_meal_eligible
          - meal_eligibility

      - join_path: student_periods.student_school_enrollments.student_homeroom_section.staff_homeroom_teacher
        prefix: true
        includes:
          - full_name
          - first_name
          - last_name

      - join_path: student_periods.terms
        prefix: true
        includes:
          - semester
          - term_name
          - term_code
          - term_type

      - join_path: student_periods.student_school_enrollments.locations.regions
        prefix: true
        includes:
          - region_name
          - state

    meta:
      folders:
        - name: Attendance
          members:
            - period_type
            - ada_tier
            - is_ca_eligible
            - is_chronically_absent
            - is_truant
            - n_membership_days_ytd
            - n_present_days_ytd
        - name: Date
          members:
            - period_start_date
            - period_end_date
            - academic_year
            - academic_year_label
        - name: Term
          members:
            - terms_semester
            - terms_term_name
            - terms_term_code
            - terms_term_type
        - name: Location
          members:
            - locations_location_name
            - locations_abbreviation
            - locations_region_key
            - locations_grade_band
            - locations_campus
            - locations_city
            - regions_region_name
            - regions_state
        - name: Student
          members:
            - student_key
            - full_name
            - birth_date
            - lea_student_identifier
            - state_student_identifier
            - gender_identity
            - race
            - enrollment_status
            - is_gifted
        - name: Status
          members:
            - is_ell
            - is_iep
            - iep_classification
            - special_education_code
            - special_education_name
            - special_education_placement
            - is_meal_eligible
            - meal_eligibility
        - name: Enrollment
          members:
            - student_enrollment_key
            - grade_level
            - graduation_year
            - entry_date
            - exit_date
            - is_retained_year
        - name: Teacher
          members:
            - staff_homeroom_teacher_full_name
            - staff_homeroom_teacher_first_name
            - staff_homeroom_teacher_last_name

    access_policy:
      # Row-level location scoping, mirrored from student_days_view. A
      # viewer holds exactly one student-<scope> group (buildGroups); none =>
      # no group => default-deny. row_level uses this view's flat location
      # member names (see the includes block above), not cube-qualified
      # paths.
      - group: student-region
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: locations_region_key
              operator: equals
              values: ["{ securityContext.region_key }"]
      - group: student-school
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: locations_abbreviation
              operator: equals
              values: ["{ securityContext.location_abbreviation }"]
      - group: student-network
        member_level:
          includes: "*"
        # network: no row_level (sees all locations)
