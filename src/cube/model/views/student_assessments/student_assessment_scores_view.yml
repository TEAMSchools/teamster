views:
  - name: student_assessment_scores_view
    description: >-
      Assessment scores across Illuminate interims, NJ and FL state tests, and
      vendor diagnostics (i-Ready, DIBELS, STAR), one row per student x
      assessment x administration x response type. Enrollment-scoped: a score
      appears only if it resolves to a section enrollment. pct_proficient is the
      source-agnostic headline; scale_score is null for Illuminate rows and
      percent_correct is null for every other source. response_type splits
      scores into overall, standard and group rows: standard is Illuminate only,
      and group covers Illuminate, i-Ready and DIBELS. There is no growth
      measure. The Date members resolve for every source but read different
      dates: the administration date for Illuminate and college, the test date
      for state tests and vendor diagnostics, so a cross-source date cut mixes
      the two. Contains direct student identifiers; see access_policy for PII
      gating.

    cubes:
      - join_path: student_assessment_scores
        includes:
          - count_assigned
          - count_taken
          - count_scored
          - count_proficient
          - count_students
          - count_assessments
          - pct_taken
          - pct_proficient
          - pct_proficient_formative
          - pct_proficient_crq
          - avg_percent_correct
          - avg_scale_score
          - assessment_score_key
          - date_taken
          - enrollment_resolution
          - proficiency_level
          - performance_band_label_number
          - is_mastery
          - scale_score
          - percent_correct
          - response_type
          - response_type_code
          - response_type_description
          - response_type_root_description
          - is_replacement

      - join_path: student_assessment_scores.student_assessment_administrations.student_assessments
        includes:
          - title
          - academic_subject
          - assessment_type
          - category
          - module_code
          - module_type
          - grade_level_tested
          - scope
          - is_internal_assessment

      - join_path: student_assessment_scores.student_assessment_administrations
        includes:
          - administration_period
          - test_type
          - source_assessment_id

      - join_path: student_assessment_scores.dates
        includes:
          - date_day
          - academic_year
          - academic_year_label
          - month_number
          - month_name

      - join_path: student_assessment_scores.student_section_enrollments.course_sections.courses
        includes:
          - discipline
          - course_title
          - course_code
          - credit_type
          - name: is_foundations
            meta:
              ai_context: >-
                The only intervention signal on this view; there is no program-
                or MTSS-tracking dimension. Treat it as course enrollment, not a
                record of intervention services delivered.

      - join_path: student_assessment_scores.student_section_enrollments.course_sections
        includes:
          - identifier
          - period

      - join_path: student_assessment_scores.student_section_enrollments
        includes:
          - student_section_enrollment_key
          - student_enrollment_key
          - entry_date
          - exit_date
          - is_dropped_section
          - is_dropped_course
          - lead_teacher_staff_key

      - join_path: student_assessment_scores.student_section_enrollments.staff_lead_teacher
        prefix: true
        includes:
          - name: full_name
            meta:
              ai_context: >-
                Stored Last, First. Resolve a name against staff_directory
                before filtering; a zero-row result is not proof the teacher has
                no students.
          - first_name
          - last_name

      - join_path: student_assessment_scores.student_section_enrollments.student_school_enrollments
        includes:
          - grade_level
          - graduation_year
          - year_in_network
          - is_retained_year

      - join_path: >-
          student_assessment_scores.student_section_enrollments.student_school_enrollments.student_enrollment_status
        includes:
          - is_ell
          - is_iep
          - iep_classification
          - special_education_code
          - special_education_name
          - special_education_placement
          - is_meal_eligible
          - meal_eligibility

      - join_path: >-
          student_assessment_scores.student_section_enrollments.student_school_enrollments.students
        includes:
          - student_key
          - full_name
          - birth_date
          - lea_student_identifier
          - state_student_identifier
          - district_student_identifier
          - salesforce_contact_id
          - gender_identity
          - race
          - enrollment_status
          - is_gifted

      - join_path: >-
          student_assessment_scores.student_section_enrollments.student_school_enrollments.locations
        includes:
          - location_name
          - abbreviation
          - region_key
          - name: grade_band
            meta:
              ai_context: >-
                A grade_band filter is a school filter. For a student's grade,
                use grade_level.
          - campus
          - city

      - join_path: >-
          student_assessment_scores.student_section_enrollments.student_school_enrollments.locations.regions
        includes:
          - region_name
          - state

      - join_path: student_assessment_scores.terms
        includes:
          - semester
          - term_name
          - term_code
          - term_type

    meta:
      ai_context: >-
        Totals will not reconcile to vendor-diagnostic or state reports, because
        of enrollment scoping; i-Ready Outside Round sittings lose the most, so
        treat those counts as a floor. Coverage is uneven by region, source and
        year, and a source's first year can be partial; check volume by region
        and year before calling a narrow result a failure or trending across a
        boundary. A gap between two instruments on the same students is a
        calibration difference until shown otherwise: report both rates side by
        side and flag it rather than presenting an achievement gap. Any growth
        figure is analyst-built; say so. Students can sit a diagnostic more than
        once in a window, mostly i-Ready. Repeat sittings inflate pct_proficient
        and count_scored (count_students is already distinct); de-duplicate them
        before a student-level rate, and since which sitting counts is an open
        decision, say which you kept. A missing current-year state result is a
        release lag, not a defect. Query this view, not upstream i-Ready tables,
        which carry re-pull duplicates. A CCSS code's own grade can differ from
        grade_level_tested; that is spiral review, not an error.
      folders:
        - name: Assessment
          members:
            - title
            - academic_subject
            - assessment_type
            - category
            - module_code
            - module_type
            - grade_level_tested
            - scope
            - is_internal_assessment
            - administration_period
            - test_type
            - source_assessment_id
            - date_taken
            - enrollment_resolution
            - proficiency_level
            - performance_band_label_number
            - is_mastery
            - scale_score
            - percent_correct
            - response_type
            - response_type_code
            - response_type_description
            - response_type_root_description
            - is_replacement
        - name: Date
          members:
            - date_day
            - academic_year
            - academic_year_label
            - month_number
            - month_name
        - name: Course
          members:
            - discipline
            - course_title
            - course_code
            - credit_type
            - is_foundations
            - identifier
            - period
        - name: Term
          members:
            - semester
            - term_name
            - term_code
            - term_type
        - name: Location
          members:
            - location_name
            - abbreviation
            - region_key
            - grade_band
            - campus
            - city
            - region_name
            - state
        - name: Student
          members:
            - student_key
            - full_name
            - birth_date
            - lea_student_identifier
            - state_student_identifier
            - district_student_identifier
            - salesforce_contact_id
            - gender_identity
            - race
            - enrollment_status
            - is_gifted
        - name: Status
          members:
            - is_ell
            - is_iep
            - iep_classification
            - special_education_code
            - special_education_name
            - special_education_placement
            - is_meal_eligible
            - meal_eligibility
        - name: Enrollment
          members:
            - student_section_enrollment_key
            - student_enrollment_key
            - entry_date
            - exit_date
            - grade_level
            - graduation_year
            - year_in_network
            - is_retained_year
            - is_dropped_section
            - is_dropped_course
        - name: Teacher
          members:
            - lead_teacher_staff_key
            - staff_lead_teacher_full_name
            - staff_lead_teacher_first_name
            - staff_lead_teacher_last_name

    access_policy:
      # Row-level location scoping (was queryRewrite.studentRowFilters). A
      # single flat `student` group (buildGroups) gated on the viewer's
      # precomputed allowed_student_abbreviations array being non-empty — not
      # three separate tier groups. The array is the viewer's base
      # student_location_scope UNIONED with every individual-exception grant
      # that has includes_student_data (see src/cube/access.js), which lets an
      # exception add one specific extra school, not just a whole network/
      # region tier. row_level uses this view's flat location member name (see
      # the includes/folders below) — bare `abbreviation`, not
      # `locations_abbreviation`, since this view's locations join is
      # unprefixed (prefix: false above).
      # Teacher fields (staff_lead_teacher_* names, lead_teacher_staff_key) ride
      # the wildcard include — staff-directory-tier info, not student PII.
      - group: student
        member_level:
          includes: "*"
        row_level:
          filters:
            - member: abbreviation
              operator: equals
              values: "{ securityContext.allowed_student_abbreviations }"
