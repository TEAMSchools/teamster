snapshots:
  - name: snapshot_kippadb__standardized_test_rollup
    relation: ref("int_kippadb__standardized_test_rollup")
    config:
      schema: kippadb
      strategy: check
      unique_key:
        - school_specific_id
        - test_type
        - test_subject
      check_cols:
        - score
      dbt_valid_to_current: "'9999-12-31'"
      meta:
        dagster:
          group: kippadb
          asset_key:
            - kipptaf
            - kippadb
            - snapshot_kippadb__standardized_test_rollup
  - name: snapshot_kippadb__app_rollup
    relation: ref("int_kippadb__app_rollup")
    config:
      schema: kippadb
      strategy: check
      unique_key: applicant
      check_cols:
        - is_submitted_ba
        - is_accepted_ba
        - is_matriculated_ba
        - is_submitted_quality_bar_4yr_int
      dbt_valid_to_current: "'9999-12-31'"
      meta:
        dagster:
          # Nightly instead of the default eager snapshot condition. A
          # snapshot inherits dbt_table_automation_condition() (materialized is
          # 'snapshot', not view/ephemeral), so it re-fires on ANY upstream data
          # change, recursing through view chains — ~101 executions/day. Its only
          # consumer, int_topline__college_matriculation_weekly, is itself on
          # `0 0 * * *`, so every other execution was invisible downstream.
          #
          # Zero history is lost: this snapshot last captured a change on 2026-07-22, ~2,200
          # executions ago.
          # Sharing the consumer's tick lets the deps-in-progress guard
          # serialize the pass. Refs #4821
          automation_condition:
            cron_schedule: 0 0 * * *
          asset_key:
            - kipptaf
            - kippadb
            - snapshot_kippadb__app_rollup
