snapshots:
  - name: snapshot_students__attendance_interventions_rollup
    relation: ref("int_students__attendance_interventions_rollup")
    config:
      schema: students
      strategy: check
      # schoolid is not a key column: it is NULL for most students, and a NULL
      # key never matches, so no version would ever close (#5381)
      unique_key:
        - student_number
        - academic_year
      check_cols:
        - successful_call_count
        - total_anticipated_calls
        - pct_interventions_complete
      dbt_valid_to_current: "'9999-12-31'"
      meta:
        dagster:
          group: students
          # Nightly instead of the default eager snapshot condition. A
          # snapshot inherits dbt_table_automation_condition() (materialized is
          # 'snapshot', not view/ephemeral), so it re-fires on ANY upstream data
          # change, recursing through view chains. Its only consumer,
          # int_topline__attendance_interventions_weekly, is disabled; the
          # snapshot keeps capturing nightly so its history has no gap if that
          # chain returns. Refs #4821
          automation_condition:
            cron_schedule: 0 0 * * *
          asset_key:
            - kipptaf
            - students
            - snapshot_students__attendance_interventions_rollup
