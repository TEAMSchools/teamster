seeds:
  - name: seed_ignite__treatment_sections
    description:
      The IGNITE site-lead classroom list, resolved to PowerSchool course and
      section numbers. One row per class the site leads reported running an R2I
      practice in. Seventeen rows are resolved and one is a duplicate of a
      section already resolved under another row, so every class the site leads
      reported now maps to an exact course and section number. Teacher names are
      deliberately absent — they are staff PII and the resolution worksheet
      holding them stays in local scratch. Match a `ref_id` beginning `Q` to the
      correspondingly numbered question in that worksheet. Resolution used class
      period plus the ICR/ICS suffix PowerSchool carries in section numbers,
      corroborated by teacher-of-record; course names could not be matched
      directly because the site-lead list numbers courses in Arabic (ENG100,
      Algebra 1) where PowerSchool uses Roman (English I, Algebra I).
    config:
      column_types:
        ref_id: string
        school_name: string
        academic_year: int64
        course_number: string
        section_number: string
        class_period: string
        treatment_cp: int64
        treatment_rdc: int64
        treatment_rr: int64
        status: string
    columns:
      - name: ref_id
        description:
          Stable row label. `R` rows are resolved; `Q` rows correspond to the
          numbered questions sent to school staff.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: school_name
        description:
          PowerSchool school name, used as part of the section join key.

      - name: academic_year
        description:
          Start year of the school year, so 2024 is SY2024-2025. The site-lead
          list expressed these as `24-25` and `25-26`.

      - name: course_number
        description:
          PowerSchool course number. Null while `status` is `pending`.

      - name: section_number
        description:
          PowerSchool section number. Null while `status` is `pending`.

      - name: class_period
        description:
          Class period as the site leads reported it, kept as text because
          double-block classes read `1-2` and `5-6`. Retained for audit; the
          join uses course and section number.

      - name: treatment_cp
        description:
          Co-planning indicator. Zero on every row — Mathematica confirmed only
          routine data cycles ran at KIPP NJ.

      - name: treatment_rdc
        description: Routine data cycles indicator.

      - name: treatment_rr
        description: Repeated reading indicator. Zero on every row.

      - name: status
        description:
          One of `resolved`, `pending` or `duplicate`. Only `resolved` rows are
          read downstream, so a pending section would contribute no treated
          students; no row is pending as of 2026-09-30. A `duplicate` row names
          a section another row already resolves — it is kept so the question it
          answers stays auditable, and excluded so the section join cannot fan
          out.
        data_tests:
          - accepted_values:
              arguments:
                values: [resolved, pending, duplicate]
              config:
                severity: error
          - not_null:
              config:
                severity: error

  - name: seed_ignite__school_nces_ids
    description:
      NCES identifiers for the three KIPP NJ schools enrolling grades 9-12,
      which Mathematica requires as `school_id`. These are public Common Core of
      Data values and exist nowhere in the warehouse — every `nces_id` column
      elsewhere in this project refers to a college, and every `nces_course_id`
      is a SCED course code. Both KIPP NJ regions are single-school districts in
      the Common Core of Data, so the campus structure KIPP uses internally has
      no federal counterpart — the two Newark high schools share one school
      identifier, and there is no finer one to reach for. Values verified
      against the NCES school listing for each district on 2026-09-30.
    config:
      column_types:
        schoolid: int64
        school_name: string
        region: string
        nces_lea_id: string
        nces_school_id: string
    columns:
      - name: schoolid
        description: PowerSchool school id, the join key to enrollment data.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: school_name
        description: PowerSchool school name, for human verification only.

      - name: region
        description: KIPP NJ region, either Newark or Camden.

      - name: nces_lea_id
        description:
          NCES local education agency identifier, seven digits. Retained to
          record where the school identifier came from and to make the
          single-school structure legible; it is not sent to Mathematica.

      - name: nces_school_id
        description:
          NCES school identifier sent to Mathematica as `school_id`, twelve
          digits. Held as text rather than a number because it is an identifier
          no arithmetic applies to, and because a twelve-digit number renders in
          scientific notation when the outbound workbook is opened in Excel. The
          two Newark rows deliberately share a value — see the seed description.
