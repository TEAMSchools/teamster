models:
  - name: int_students__student_core_fields
    description: >-
      SIS-agnostic student core fields spine, carrying IEP and English learner
      status keyed on student_number. Resolves the PowerSchool branch's
      studentsdcid to student_number so mart consumers join on the network
      student number instead of the PowerSchool-internal dcid; the Miami branch
      resolves student_number natively from Focus with the same unprefix rule
      int_students__students applies. Neither field has a usable Focus source,
      so both carry forward from the frozen PowerSchool archive for returning
      Miami students.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - _dbt_source_project
    columns:
      - name: spedlep
        description: >-
          IEP classification. For Miami, carried forward from the frozen
          PowerSchool archive because Focus ESE fields are not yet populated;
          null for Miami students new since the freeze.
        data_tests:
          - not_null:
              config:
                severity: warn
                where: _dbt_source_project = 'kippmiami'
      - name: lep_status
        description: >-
          English learner status. For Miami, carried forward from the frozen
          PowerSchool archive; null for Miami students new since the freeze.
          Focus's own ELL field is populated but defaulted -- 3,819 of 3,964
          students sit at "Not applicable", including 211 the archive flags as
          LEP -- so reading it would overwrite real status with a default.
        data_tests:
          - not_null:
              config:
                severity: warn
                where: _dbt_source_project = 'kippmiami'
      - name: student_number
        description: Canonical network student number.
      - name: _dbt_source_relation
        description: >-
          Source relation, passed through from the PowerSchool staging model or
          the Focus wrapper.
      - name: _dbt_source_project
        description: >-
          District code location, passed through from the PowerSchool staging
          model or the Focus wrapper.
