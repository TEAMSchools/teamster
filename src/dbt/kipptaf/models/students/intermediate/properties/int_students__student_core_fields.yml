models:
  - name: int_students__student_core_fields
    description: >-
      SIS-agnostic student core fields spine, carrying IEP and English learner
      status keyed on student_number. Resolves the PowerSchool branch's
      studentsdcid to student_number so mart consumers join on the network
      student number instead of the PowerSchool-internal dcid; the Miami branch
      resolves student_number natively from Focus with the same unprefix rule
      int_students__students applies. Neither field has a usable Focus source,
      so both carry forward from the frozen PowerSchool archive for returning
      Miami students.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - _dbt_source_project
    columns:
      - name: spedlep
        description: >-
          IEP classification. For Miami, read from the Focus ESE
          Exceptionalities log via int_focus__students.spedlep: a placed,
          undismissed, non-gifted entry. Its absence does not mean the student
          has no IEP, so it reads null rather than 'No IEP'.
        data_tests:
          - not_null:
              config:
                severity: warn
                where: _dbt_source_project = 'kippmiami'
      - name: lep_status
        description: >-
          English learner status. For Miami, read from Focus's FLDOE ELL code:
          LY is currently LEP, the followup/exited/not-applicable codes are not,
          and the tested-or-pending codes read null because they are genuinely
          unknown. Flags 5 students against the frozen archive's 221 -- most
          Miami students still sit at the Focus default, a gap for Ops to close.
        data_tests:
          - not_null:
              config:
                severity: warn
                where: _dbt_source_project = 'kippmiami'
      - name: student_number
        description: Canonical network student number.
      - name: _dbt_source_relation
        description: >-
          Source relation, passed through from the PowerSchool staging model or
          the Focus wrapper.
      - name: _dbt_source_project
        description: >-
          District code location, passed through from the PowerSchool staging
          model or the Focus wrapper.
