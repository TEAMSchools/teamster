models:
  - name: int_students__bucket_assignments_rollup
    description: >-
      Each student's latest stored bucket per academic year and subject, from
      int_students__bucket_assignments: the assignment with the latest
      assignment_date wins. One row per academic_year x _dbt_source_project x
      student_number x subject. This is the dashboards' year rule, read by
      int_extracts__student_enrollments_subjects for nj_student_tier; Cube's
      per-enrollment buckets come from dim_student_enrollment_status instead.
      Bucket 4 is never stored - consumers coalesce a missing row to Bucket 4.
    config:
      meta:
        contains_pii: true
        standard_exempt:
          A5: >-
            Latest-assignment-wins is the business rule (the newest stored
            assignment is the official one for the year), not source-duplicate
            masking; a true double upload still surfaces through
            n_active_assignments.
          A4: >-
            Shares its (_dbt_source_project, academic_year, student_number,
            subject) key with int_assessments__goal_benchmarks, but the two hold
            different facts from different sources (a stored bucket assignment
            versus a benchmark score panel), so neither extends the other.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - _dbt_source_project
              - student_number
              - subject
          config:
            severity: error
    columns:
      - name: academic_year
        description: Academic year of the assignment (Focus syear as-is).
      - name: _dbt_source_project
        description: >-
          District code location the assignment came from, carried through from
          int_students__bucket_assignments.
      - name: student_number
        description: Network student number (the Focus student_id for Miami).
      - name: subject
        description: Reading or Math.
      - name: bucket
        description:
          Latest stored bucket label for the year; the "everyone else" Bucket 4
          has no stored row.
      - name: bucket_store
        description: Which system holds the assignment (powerschool or focus).
      - name: assignment_date
        description: >-
          Program enter date (PowerSchool) or group-membership created date
          (Focus) of the latest assignment.
      - name: n_active_assignments
        description: >-
          Count of the student's assignments for the year and subject still
          active today, carried through from int_students__bucket_assignments.
          More than 1 means a double upload that the latest-wins pick hides.

unit_tests:
  - name: unit_int_students__bucket_assignments_rollup
    description: >-
      Keeps the latest assignment of a student who changed bucket mid-year, and
      passes a single assignment through.
    model: int_students__bucket_assignments_rollup
    given:
      - input: ref("int_students__bucket_assignments")
        format: sql
        rows: |
          select
              2026 as academic_year,
              'kippnewark' as _dbt_source_project,
              5001 as student_number,
              'Math' as `subject`,
              'Bucket 2' as bucket,
              'powerschool' as bucket_store,
              date '2026-09-01' as assignment_date,
              date '2026-10-01' as exit_date,
              1 as n_active_assignments
          union all
          select
              2026,
              'kippnewark',
              5001,
              'Math',
              'Bucket 3',
              'powerschool',
              date '2026-10-02',
              date '2099-06-30',
              1
          union all
          select
              2026,
              'kippcamden',
              5001,
              'Math',
              'Bucket 1',
              'powerschool',
              date '2026-09-01',
              date '2099-06-30',
              1
    expect:
      rows:
        - academic_year: 2026
          _dbt_source_project: kippnewark
          student_number: 5001
          subject: Math
          bucket: Bucket 3
          bucket_store: powerschool
          assignment_date: 2026-10-02
          n_active_assignments: 1
        - academic_year: 2026
          _dbt_source_project: kippcamden
          student_number: 5001
          subject: Math
          bucket: Bucket 1
          bucket_store: powerschool
          assignment_date: 2026-09-01
          n_active_assignments: 1
