models:
  - name: int_students__early_application_criteria
    description:
      One row per KIPP Forward early-application goal, from the goals tab of the
      KIPP Forward Early Apps Settings sheet
      (stg_google_sheets__kfwd__early_apps_goals), with its band's display
      order. Each goal belongs to 1 GPA band and sets the college type, URM bar,
      and number of colleges a senior needs.
      int_students__early_application_criteria_scaffold scores seniors against
      these rows, and the tracker's Summary tab takes its goal rows and labels
      from them. A goal whose band is not on the gpa_bands tab is left out.
    columns:
      - name: criterion_code
        data_type: string
        description: Stable key for the goal, such as ea_78.
        data_tests:
          - unique:
              config:
                severity: error
      - name: criterion_sort
        data_type: int64
        description: Display order of the goal.
      - name: gpa_band
        data_type: string
        description:
          GPA band the goal applies to, matching gpa_band in
          int_students__early_application_gpa_bands.
      - name: band_sort
        data_type: int64
        description: Display order of the goal's GPA band.
      - name: criterion_label
        data_type: string
        description: Readable goal name for the tracker.
      - name: required_type
        data_type: string
        description:
          Application type a college must have to count — ED, EA, or any.
      - name: type_label
        data_type: string
        description:
          The required type as the near-miss text names it — ED, EA, ED or EA,
          or early.
      - name: urm_bar
        data_type: int64
        description:
          Minimum URM graduation rate, 0 to 100, a college needs to qualify.
      - name: required_count
        data_type: int64
        description: Number of qualifying colleges the goal needs.
      - name: requires_full_need
        data_type: boolean
        description: True when a qualifying college must meet full need.
      - name: sets_aside_full_need
        data_type: boolean
        description:
          True for the goal that does not count the college already used for the
          band's full-need goal.
