models:
  - name: int_students__promotional_status_metrics_unpivot
    description: >-
      Long form of int_students__promotional_status_metrics, one row per
      student, academic year, reporting term, and metric. Its metric column is
      the vocabulary a policy sheet row may name, so a metric the sheet
      references that is absent here never evaluates. Every metric is cast to
      float64 so a sheet condition is uniformly metric, comparator, value. Rows
      with a null metric value are kept so the policy's if_missing rule can
      decide them.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
              - term_name
              - metric
          config:
            severity: error
    columns:
      - name: student_number
        data_type: int64
        description: Student number assigned by the school.
        config:
          meta:
            contains_pii: true
      - name: academic_year
        data_type: int64
        description: Starting calendar year of the school year.
      - name: term_name
        data_type: string
        description: Reporting term name (Q1-Q4).
      - name: region
        data_type: string
        description: Student region, used to scope policy rules.
      - name: grade_level
        data_type: int64
        description: Grade level, used to scope policy rules. K is 0.
      - name: metric
        data_type: string
        description: >-
          Name of the metric column in int_students__promotional_status_metrics
          this row carries.
      - name: metric_value
        data_type: float64
        description: >-
          The metric's value for the student-term, null when the student has no
          value for it.
        config:
          meta:
            contains_pii: true
