models:
  - name: int_students__course_enrollments
    description: >-
      SIS-neutral course enrollment spine. Each row is one student's enrolment
      in one section. Unions the four PowerSchool district
      `base_powerschool__course_enrollments` sources with Miami's Focus
      schedule, conformed inline to the PowerSchool column vocabulary. The Miami
      PowerSchool branch is scoped to years before Focus coverage begins.
      Replaces `base_powerschool__course_enrollments` as the canonical
      course-enrollment-grain source.
    config:
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cc_dcid
              - _dbt_source_project
    columns:
      - name: cc_dcid
        description: >-
          Course enrollment identifier. For Miami, the Focus
          `student_schedule_id`, unique across all 19,295 rows of
          `int_focus__schedule`, the deduplicated kipptaf wrapper.
        data_type: int64
      - name: is_dropped_section
        description: >-
          Whether the student unenrolled from this section before its expected
          end. PowerSchool derives it from its `sectionid < 0` convention. Focus
          has no equivalent, so the Miami value is an INFERENCE: the schedule
          row's `end_date` falls before its marking period ends, and the student
          still holds an open schedule row that year. The second half excludes a
          withdrawal sweep, which closes every one of a leaver's rows at once
          and is not a drop -- it stands in for PowerSchool's own `dateleft =
          exitdate` exclusion. Both regions therefore mean the same thing by the
          column, reached two different ways. Measured 2026-08-27: 2.97% of
          Miami AY2026 rows, against 0.23% to 8.55% across the three NJ regions
          at the same point in the year. See #4968.
        data_type: bool
      - name: is_dropped_course
        description: >-
          Whether every section of this course was dropped for the student that
          year. Both regions window `is_dropped_section` over the same scope --
          one student, one course, one year -- so the values are comparable;
          PowerSchool reaches that scope through `cc_studyear`, which is a
          student-and-year composite key rather than a bare year. The Miami
          value carries the inference described on `is_dropped_section`.
        data_type: bool
      - name: cc_dateenrolled
        description: >-
          For PowerSchool, the date the student joined the section. For Miami,
          the Focus schedule `start_date`, which is the marking period's start
          date rather than a join date -- so a future-term row carries a future
          date. Established on #5002; the measurement lives on
          `int_focus__schedule`.
        data_type: date
      - name: cc_dateleft
        description: >-
          For PowerSchool, the date the student left the section. For Miami, the
          Focus schedule `end_date`, which is null while the row is open -- the
          normal state, true of 96.8% of Miami AY2026 rows. Downstream joins
          must coalesce it to an open-ended sentinel rather than compare it
          directly.
        data_type: date
      - name: is_homeroom
        description: >-
          Whether this enrollment is a homeroom. PowerSchool from the `HR%`
          course-number convention, Focus from a `Homeroom%` course title. Focus
          coverage is elementary-only, tracked on #4868.
        data_type: bool
      - name: students_student_number
        description: >-
          Canonical network student number. For Miami, from
          `int_focus__students.student_number`, which already has the 8400
          Miami-Dade district prefix stripped.
        data_type: int64
        config:
          meta:
            contains_pii: true
      - name: teachernumber
        description: >-
          Lead teacher's PowerSchool teacher number. For Miami, resolved from
          the Focus `teacher_id` through `int_focus__users` to the staff roster:
          first by `ein`, falling back to a case-insensitive match on email for
          a user whose `ein` doesn't resolve.
        data_type: string
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__users
            source_column: teachernumber
      - name: _dbt_source_project
        description: >-
          Region prefix extracted from `_dbt_source_relation`. Carried through
          from `int_powerschool__course_enrollments_union` on the PowerSchool
          branch and from `int_focus__schedule` on the Focus branch -- both
          derive it via the same `extract_source_project` macro. Used as a
          region discriminator in downstream surrogate keys, consistent across
          all upstream union tables.
        data_type: string
      - name: region
        description: >-
          Title-case region derived from `_dbt_source_project` via
          `extract_region`, on both the PowerSchool and Focus branches.
        data_type: string
      - name: is_ap_course
        description: >-
          Conditional on `ap_course_subject`, a New Jersey state reporting
          crosswalk. Null for Miami's Focus branch, which is Florida and has no
          such crosswalk.
        data_type: bool
      - name: courses_credittype
        description: >-
          Normalizes variant credit type codes (ELA -> ENG, Math -> MATH,
          Science -> SCI, Homeroom -> HR) caused by a 2023 PowerSchool plugin
          glitch in one region that produced non-standard values for that year's
          records. Null for Miami's Focus branch, which has no equivalent field.
        data_type: string
      - name: standardized_discipline
        description: >-
          Course subject discipline with 'SOC' normalized to 'Civics'; all other
          discipline values pass through unchanged. Null for Miami's Focus
          branch, which has no equivalent field.
        data_type: string
      - name: rn_student_year_illuminate_subject_desc
        description: >-
          Row number of value partitioned by `_dbt_source_relation`,
          `cc_studyear`, `illuminate_subject_area` ordered by `cc_termid`,
          `cc_dateenrolled`, `cc_dateleft`, all descending. Null for Miami's
          Focus branch, which does not compute this window.
        data_type: int64
