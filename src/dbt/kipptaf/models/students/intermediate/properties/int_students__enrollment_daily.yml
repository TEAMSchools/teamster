models:
  - name: int_students__enrollment_daily
    description: >-
      One row per enrollment stint per calendar day, network-wide and
      SIS-neutral. This is the row source for the daily and period student facts
      -- it decides which student-days exist, and attendance is joined onto it
      downstream rather than the other way round.

      Days come from dim_dates rather than the school calendar, because the
      Focus calendar emits in-session days only and would leave Miami with no
      break-day rows from AY2026 forward while the NJ regions had them. The
      school calendar is instead left-joined to stamp is_in_session_day, so a
      day the calendar does not carry is simply not in session.

      Each stint's day window is clamped to its school's own academic year --
      from the year's first in-session day to its last, capped at today. That
      clamp is load-bearing. PowerSchool rolls NJ stints over on 1 July while
      Focus dates Miami stints to the real first day of school, so an unclamped
      window would report roughly 20,000 Newark students enrolled in mid-July
      against almost no Miami students, purely from a source-system date
      convention. Clamping makes any calendar date comparable across regions.

      Carrying enrollment across break days is what lets a point-in-time
      question land on any date, including a weekend or a holiday, without a
      per-school anchor flag. Enrollment attributes are stint attributes and so
      are constant across the window by construction, not carried by a window
      function. No attendance is carried -- attendance is absent on a
      non-session day, which is what keeps break days out of every rate
      denominator downstream.

      Miami is present throughout, because both parents retain it. The
      enrollment spine is the same one Topline and the Tableau extracts read,
      and int_students__calendar_day keeps the frozen PowerSchool archive for
      the years Focus does not cover.
    config:
      materialized: table
      meta:
        dagster:
          # Its only readers are the two attendance enrollment facts, so it
          # shares their tick (fct_student_attendance_enrollment_daily). An
          # eager rebuild fires on every calendar or terms update through the
          # upstream views and buys freshness nothing reads.
          automation_condition:
            cron_schedule: 0 6,15 * * *
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [
                student_number,
                _dbt_source_project,
                academic_year,
                entrydate,
                calendardate,
              ]
          config:
            severity: error
    columns:
      - name: calendardate
        description: >-
          The calendar day this row represents. Present for every day in the
          stint's clamped window, in session or not.

      - name: student_number
        description: Network-wide student identifier.

      - name: _dbt_source_project
        description: District code location the enrollment stint came from.

      - name: academic_year
        description: >-
          Academic year of the enrollment stint, expressed as the calendar year
          in which the year ends.

      - name: entrydate
        description: >-
          First day of the enrollment stint as the source system records it.
          Part of the stint's natural key, so it feeds the enrollment surrogate
          key downstream.

      - name: schoolid
        description: Network school number.

      - name: grade_level
        description: Grade level of the enrollment stint.

      - name: enroll_status
        description: >-
          Source-system enrollment status code for the stint. Carried for
          downstream filtering only -- this model decides membership by entry
          and exit dates, never by status.

      - name: week_start_date
        description: >-
          First day of the school calendar week containing this day. Null on a
          day the school calendar does not carry.

      - name: week_end_date
        description: >-
          Last day of the school calendar week containing this day. Null on a
          day the school calendar does not carry.

      - name: week_start_monday
        description: >-
          Monday of the school week containing this day. Null on a break day
          that falls outside every school week.

      - name: week_end_sunday
        description: >-
          Sunday of the school week containing this day. Null on a break day
          that falls outside every school week.

      - name: week_number_academic_year
        description: >-
          Ordinal school week within the academic year. Null on a break day that
          falls outside every school week.

      - name: term
        description: >-
          Reporting term covering this day. Null on a day that falls outside
          every term window, which includes most long breaks.

      - name: semester
        description: >-
          Semester covering this day. Null on a day that falls outside every
          term window.

      - name: yearid
        description: >-
          Legacy PowerSchool year identifier, derived from academic_year.
          Transitional, kept so existing consumers can migrate independently.

      - name: is_in_session_day
        description: >-
          Whether school was in session for this school on this day. False on
          every carried break day, and false on a day the school calendar does
          not carry at all.

      - name: membershipvalue
        description: >-
          Membership weight for the day, taken from the school calendar. Zero on
          every carried break day, so a break day can never reach a rate
          denominator downstream.

unit_tests:
  - name: test_int_students__enrollment_daily_stint_windows
    description:
      Two back-to-back stints for one student. The first opens on the 1 July
      rollover and is clamped to the year's first in-session day; its exitdate
      is exclusive, so its last row is the day before the second stint's
      entrydate. The open second stint runs to the year's last in-session day. A
      calendar holiday and an uncarried weekend both get rows that are not in
      session and carry zero membership.
    model: int_students__enrollment_daily
    given:
      - input: ref('int_extracts__student_enrollments')
        rows:
          - student_number: 1001
            _dbt_source_project: kippnewark
            academic_year: 2024
            entrydate: 2024-07-01
            exitdate: 2024-09-06
            schoolid: 101
            grade_level: 5
            enroll_status: 2
          - student_number: 1001
            _dbt_source_project: kippnewark
            academic_year: 2024
            entrydate: 2024-09-06
            exitdate: null
            schoolid: 101
            grade_level: 5
            enroll_status: 0
      - input: ref('int_students__calendar_day')
        rows:
          - schoolid: 101
            _dbt_source_project: kippnewark
            academic_year: 2024
            date_value: 2024-09-03
            insession: 1
            is_in_session: true
            membershipvalue: 1.0
            week_start_date: 2024-09-02
            week_end_date: 2024-09-06
          - schoolid: 101
            _dbt_source_project: kippnewark
            academic_year: 2024
            date_value: 2024-09-04
            insession: 1
            is_in_session: true
            membershipvalue: 1.0
            week_start_date: 2024-09-02
            week_end_date: 2024-09-06
          - schoolid: 101
            _dbt_source_project: kippnewark
            academic_year: 2024
            date_value: 2024-09-05
            insession: 0
            is_in_session: false
            membershipvalue: 1.0
            week_start_date: 2024-09-02
            week_end_date: 2024-09-06
          - schoolid: 101
            _dbt_source_project: kippnewark
            academic_year: 2024
            date_value: 2024-09-06
            insession: 1
            is_in_session: true
            membershipvalue: 1.0
            week_start_date: 2024-09-02
            week_end_date: 2024-09-06
          - schoolid: 101
            _dbt_source_project: kippnewark
            academic_year: 2024
            date_value: 2024-09-09
            insession: 1
            is_in_session: true
            membershipvalue: 1.0
            week_start_date: 2024-09-09
            week_end_date: 2024-09-13
      - input: ref('dim_dates')
        rows:
          - date_key: 2024-09-01
          - date_key: 2024-09-02
          - date_key: 2024-09-03
          - date_key: 2024-09-04
          - date_key: 2024-09-05
          - date_key: 2024-09-06
          - date_key: 2024-09-07
          - date_key: 2024-09-08
          - date_key: 2024-09-09
          - date_key: 2024-09-10
      - input: ref('int_students__calendar_week')
        rows:
          - schoolid: 101
            _dbt_source_project: kippnewark
            week_start_monday: 2024-09-02
            week_end_sunday: 2024-09-08
            week_number_academic_year: 1
          - schoolid: 101
            _dbt_source_project: kippnewark
            week_start_monday: 2024-09-09
            week_end_sunday: 2024-09-15
            week_number_academic_year: 2
      - input: ref('int_students__terms')
        rows:
          - schoolid: 101
            _dbt_source_project: kippnewark
            term: Q1
            semester: S1
            term_start_date: 2024-09-03
            term_end_date: 2024-11-08
    expect:
      rows:
        - entrydate: 2024-07-01
          calendardate: 2024-09-03
          is_in_session_day: true
          membershipvalue: 1.0
          week_start_date: 2024-09-02
          week_number_academic_year: 1
          term: Q1
        - entrydate: 2024-07-01
          calendardate: 2024-09-04
          is_in_session_day: true
          membershipvalue: 1.0
          week_start_date: 2024-09-02
          week_number_academic_year: 1
          term: Q1
        - entrydate: 2024-07-01
          calendardate: 2024-09-05
          is_in_session_day: false
          membershipvalue: 0.0
          week_start_date: 2024-09-02
          week_number_academic_year: 1
          term: Q1
        - entrydate: 2024-09-06
          calendardate: 2024-09-06
          is_in_session_day: true
          membershipvalue: 1.0
          week_start_date: 2024-09-02
          week_number_academic_year: 1
          term: Q1
        - entrydate: 2024-09-06
          calendardate: 2024-09-07
          is_in_session_day: false
          membershipvalue: 0.0
          week_start_date: null
          week_number_academic_year: 1
          term: Q1
        - entrydate: 2024-09-06
          calendardate: 2024-09-08
          is_in_session_day: false
          membershipvalue: 0.0
          week_start_date: null
          week_number_academic_year: 1
          term: Q1
        - entrydate: 2024-09-06
          calendardate: 2024-09-09
          is_in_session_day: true
          membershipvalue: 1.0
          week_start_date: 2024-09-09
          week_number_academic_year: 2
          term: Q1
