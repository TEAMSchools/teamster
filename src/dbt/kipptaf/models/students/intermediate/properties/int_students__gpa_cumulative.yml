models:
  - name: int_students__gpa_cumulative
    description: >-
      SIS-neutral cumulative GPA, one row per student and school. Cumulative GPA
      is calculated per school, not per year, so there is no year in the grain.
      Unions PowerSchool's `int_powerschool__gpa_cumulative` with Miami's Focus
      `int_focus__student_gpa_cumulative`, conformed to the PowerSchool column
      vocabulary, and computes the KTAF GPA bands once for both systems.


      **Focus wins over the Miami PowerSchool archive.** Where a Miami student
      has both a frozen PowerSchool value and a Focus value at the same school,
      only the Focus row is kept. The two never agree, and Focus always shows
      fewer cumulative credits, so the Focus value does not appear to include
      the student's PowerSchool history at that school.


      **Focus keeps the latest school year.** Focus writes a cumulative row per
      school year; `int_focus__student_gpa_cumulative` keeps only the newest one
      per student and school.


      **Miami Focus coverage is partial, and that comes from the source.** A
      Miami student missing from Focus has no imported course history, and falls
      back to the PowerSchool archive where one exists.
    # A view, so int_extracts__student_enrollments never reads a stale build.
    # The uniqueness test below then runs only on code change. A duplicate
    # here still fails the hourly grain test on
    # int_extracts__student_enrollments, and the Focus grain is tested on the
    # focus package's stg_focus__student_gpa_calculated. Refs #6044
    config:
      materialized: view
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - schoolid
              - _dbt_source_project
          config:
            severity: error
    columns:
      - name: _dbt_source_relation
        data_type: string
        description: District relation the row was unioned from.
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from `_dbt_source_relation`.
      - name: student_number
        data_type: int64
        description: >-
          Network student number. The only student key both branches share.
        config:
          meta:
            contains_pii: true
      - name: studentid
        data_type: int64
        description: >-
          PowerSchool student id. Null on every Focus row — Focus has no
          PowerSchool student id.
      - name: schoolid
        data_type: int64
        description: >-
          PowerSchool school id. On the Focus branch it is
          `stg_google_sheets__people__locations.powerschool_school_id`, reached
          by joining Focus's `school_number` to that model's `focus_school_id`.
      - name: calculated_academic_year
        data_type: int64
        description: >-
          Academic year the SIS calculated the value in, from Focus's `syear`.
          Null on every PowerSchool row, which stores only the current value.
      - name: cumulative_y1_gpa
        data_type: float64
        description: >-
          Cumulative weighted GPA. Mapped from Focus's
          `cumulative_weighted_gpa`, which is the weighted measure despite the
          unqualified PowerSchool column name.
      - name: cumulative_y1_gpa_unweighted
        data_type: float64
        description: >-
          Cumulative unweighted GPA. Mapped from Focus's `cumulative_gpa`.
      - name: cumulative_y1_gpa_projected
        data_type: float64
        description: >-
          Projected year-end cumulative weighted GPA. Null on every Focus row —
          Focus projects nothing.
      - name: cumulative_y1_gpa_projected_unweighted
        data_type: float64
        description: >-
          Projected year-end cumulative unweighted GPA. Null on every Focus row.
      - name: cumulative_y1_gpa_projected_s1
        data_type: float64
        description: >-
          Projected cumulative weighted GPA counting current-year Y1 grades as
          of the end of Q2. Null on every Focus row.
      - name: cumulative_y1_gpa_projected_s1_unweighted
        data_type: float64
        description: >-
          Unweighted counterpart of `cumulative_y1_gpa_projected_s1`. Null on
          every Focus row.
      - name: core_cumulative_y1_gpa
        data_type: float64
        description: >-
          Cumulative weighted GPA over math, science, English and social studies
          courses only. Null on every Focus row.
      - name: earned_credits_cum
        data_type: float64
        description: >-
          Cumulative credits earned. Mapped from Focus's `cumulative_credits`.
      - name: earned_credits_cum_projected
        data_type: float64
        description: >-
          Projected cumulative credits earned, counting in-progress courses.
          Null on every Focus row.
      - name: potential_credits_cum
        data_type: float64
        description: Cumulative credits attempted. Null on every Focus row.
      - name: class_rank
        data_type: int64
        description: >-
          Class rank as the SIS computed it. Null on every PowerSchool row —
          that chain does not produce a rank — and populated on only a handful
          of Focus rows so far, so it is not yet usable as a reporting measure.
      - name: cumulative_y1_gpa_unweighted_band
        data_type: int64
        description: >-
          KTAF GPA band for `cumulative_y1_gpa_unweighted` (4 = 3.00 and above,
          3 = 2.50–2.99, 2 = 2.00–2.49, 1 = below 2.00). Null when the GPA is
          null.
      - name: cumulative_y1_gpa_projected_unweighted_band
        data_type: int64
        description: >-
          KTAF GPA band for `cumulative_y1_gpa_projected_unweighted`, on the
          same cut-offs. Null when the projected GPA is null, which is every
          Focus row.

unit_tests:
  - name: unit_int_students__gpa_cumulative__focus_over_powerschool
    description: >-
      A Focus row replaces the PowerSchool archive row for the same student and
      school. A Focus row from before 2026 is dropped, so that student keeps the
      PowerSchool archive row.
    model: int_students__gpa_cumulative
    given:
      - input: ref("int_focus__student_gpa_cumulative")
        format: sql
        rows: |
          select
              1 as student_id,
              10 as school_id,
              2027 as syear,
              cast(null as int64) as class_rank,
              numeric '3.1' as cumulative_gpa,
              numeric '3.4' as cumulative_weighted_gpa,
              numeric '12' as cumulative_credits,
              '`t`.`kippmiami_focus`.`x`' as _dbt_source_relation,
              'kippmiami' as _dbt_source_project
          union all
          select
              2,
              10,
              2025,
              null,
              numeric '1.0',
              numeric '1.0',
              numeric '4',
              '`t`.`kippmiami_focus`.`x`',
              'kippmiami'
      - input: ref("int_focus__students")
        rows:
          - student_id: 1
            student_number: 84000001
          - student_id: 2
            student_number: 84000002
      - input: ref("int_focus__schools")
        rows:
          - id: 10
            school_number: 2008A
      - input: ref("stg_google_sheets__people__locations")
        rows:
          - focus_school_id: 2008A
            powerschool_school_id: 30200
      - input: ref("int_powerschool__gpa_cumulative")
        rows:
          - students_student_number: 84000001
            schoolid: 30200
            cumulative_y1_gpa_unweighted: 2.2
            _dbt_source_project: kippmiami
          - students_student_number: 84000002
            schoolid: 30200
            cumulative_y1_gpa_unweighted: 2.7
            _dbt_source_project: kippmiami
    expect:
      rows:
        - student_number: 84000001
          schoolid: 30200
          calculated_academic_year: 2027
          cumulative_y1_gpa_unweighted: 3.1
          cumulative_y1_gpa_unweighted_band: 4
        - student_number: 84000002
          schoolid: 30200
          calculated_academic_year: null
          cumulative_y1_gpa_unweighted: 2.7
          cumulative_y1_gpa_unweighted_band: 3
