models:
  - name: int_students__section_504_status
    description:
      One row per PowerSchool student per region, with the student's 504 status
      from 2 sources side by side — the NJ state field PID_504_TF in
      PowerSchool, and whether EdPlan holds an active 504 plan. This model must
      stay a view, because the EdPlan rule reads the current date when it is
      queried.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - _dbt_source_project
          config:
            severity: error
    columns:
      - name: student_number
        data_type: int64
        description: PowerSchool student number.
        config:
          meta:
            contains_pii: true
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from _dbt_source_relation.
      - name: is_504_state_field
        data_type: boolean
        description:
          The NJ state field PID_504_TF on the student's current PowerSchool
          record, from stg_powerschool__s_nj_stu_x. Null when the student has no
          S_NJ_STU_X record. Not interchangeable with
          int_students__student_enrollments.is_504, which prefers the
          past-enrollment copy in S_NJ_REN_X; the AutoComm write-back needs the
          value on the current record.
        config:
          meta:
            contains_pii: true
      - name: has_active_edplan_504_plan
        data_type: boolean
        description:
          True when int_edplan__section_504_active_plan_rollup has a row for the
          student, meaning EdPlan holds a Currently Valid 504 plan ending today
          or later, or with no end date. False otherwise, including regions with
          no EdPlan 504 report.
        config:
          meta:
            contains_pii: true

unit_tests:
  - name: test_section_504_status
    description:
      One row per real PowerSchool student per region. A student with no
      S_NJ_STU_X record keeps their row with a null state field. Joins match
      within a region, so the same student number in another region does not
      pick up Newark's state field or plan. Placeholder students and EdPlan
      plans for students PowerSchool does not have add no row.
    model: int_students__section_504_status
    given:
      - input: ref('stg_powerschool__students')
        format: sql
        rows: |
          select
            4001 as student_number,
            'kippnewark' as _dbt_source_project,
            104001 as dcid
          union all select 4002, 'kippnewark', 104002
          union all select 4003, 'kippnewark', 104003
          union all select 4001, 'kippcamden', 104001
          union all select 4005, 'kippnewark', 0
      - input: ref('stg_powerschool__s_nj_stu_x')
        format: sql
        rows: |
          select
            104001 as studentsdcid,
            'kippnewark' as _dbt_source_project,
            true as is_504
          union all select 104003, 'kippnewark', false
      - input: ref('int_edplan__section_504_active_plan_rollup')
        format: sql
        rows: |
          select 4001 as student_number, 'kippnewark' as _dbt_source_project
          union all select 4002, 'kippnewark'
          union all select 9999, 'kippnewark'
    expect:
      rows:
        - {
            student_number: 4001,
            _dbt_source_project: kippnewark,
            is_504_state_field: true,
            has_active_edplan_504_plan: true,
          }
        - {
            student_number: 4002,
            _dbt_source_project: kippnewark,
            is_504_state_field: null,
            has_active_edplan_504_plan: true,
          }
        - {
            student_number: 4003,
            _dbt_source_project: kippnewark,
            is_504_state_field: false,
            has_active_edplan_504_plan: false,
          }
        - {
            student_number: 4001,
            _dbt_source_project: kippcamden,
            is_504_state_field: null,
            has_active_edplan_504_plan: false,
          }
