models:
  - name: int_students__contacts
    description:
      Network-wide long-format student contact list — one row per (student,
      contact slot). NJ cutover regions (Newark, Camden, Paterson) source from
      the Finalsite `int_finalsite__student_contacts` model, crosswalked to a
      PowerSchool student number and scoped to students that have one; the
      remaining region (Miami) sources from PowerSchool, mapping the priority-1
      contact to `contact_1` and the priority-3-and-higher emergency contacts to
      `emergency_1` through `emergency_4`. Feeds the contact pivot,
      `dim_student_contact_persons`, and `bridge_student_contacts`. Phone
      columns carry E.164-normalized values from the Finalsite branch and raw
      PowerSchool values from the Miami branch — mixed format by source region.
    config:
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - _dbt_source_project
              - contact_slot
          config:
            severity: error
    columns:
      - name: student_number
        data_type: integer
        description: The student this contact belongs to.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: contact_slot
        data_type: string
        description:
          Which contact this row represents — `contact_1`, `contact_2`, or
          `emergency_1` through `emergency_4`.
        data_tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values:
                  - contact_1
                  - contact_2
                  - emergency_1
                  - emergency_2
                  - emergency_3
                  - emergency_4
              config:
                severity: error
      - name: _dbt_source_project
        data_type: string
        description:
          The district code location this contact was sourced from
          (`kippnewark`, `kippcamden`, `kippmiami`, `kipppaterson`).
        data_tests:
          - not_null:
              config:
                severity: error
      - name: personid
        data_type: string
        description:
          PowerSchool person id of the contact, for PowerSchool-sourced regions;
          null for Finalsite-sourced regions. Used with `_dbt_source_project` to
          key the contact person in the dimension.
      - name: finalsite_contact_id
        data_type: string
        description:
          Finalsite contact UUID of the contact person, for Finalsite-sourced
          `contact_1`/`contact_2` rows; null for PowerSchool regions and for
          emergency slots (which have no linked contact record). Used to key the
          contact person in the dimension.
      - name: contact_name
        data_type: string
        description: The contact's full name.
        config:
          meta:
            contains_pii: true
      - name: relationship
        data_type: string
        description: The contact's relationship to the student.
      - name: email_current
        data_type: string
        description: The contact's current email address, if any.
        config:
          meta:
            contains_pii: true
      - name: phone_mobile
        data_type: string
        description: The contact's phone number typed as mobile/cell, if any.
        config:
          meta:
            contains_pii: true
      - name: phone_home
        data_type: string
        description: The contact's phone number typed as home, if any.
        config:
          meta:
            contains_pii: true
      - name: phone_daytime
        data_type: string
        description:
          The contact's phone number typed as daytime, if any. Always null for
          Finalsite-sourced regions, which have no daytime phone type.
        config:
          meta:
            contains_pii: true
      - name: phone_work
        data_type: string
        description: The contact's phone number typed as work, if any.
        config:
          meta:
            contains_pii: true
      - name: phone_primary
        data_type: string
        description:
          The contact's first/best phone number regardless of type — a fallback
          for phones the typed columns miss.
        config:
          meta:
            contains_pii: true
      - name: address_home
        data_type: string
        description:
          The contact's home address. Always null for emergency slots, which
          carry no address.
        config:
          meta:
            contains_pii: true
      - name: is_emergency
        data_type: boolean
        description:
          True for every `emergency_*` slot. For `contact_1`/`contact_2`, false
          on the Finalsite branch by construction; a Miami PowerSchool
          priority-1 contact keeps its own PowerSchool emergency flag and can be
          true.
      - name: is_pickup
        data_type: boolean
        description:
          Whether the contact is authorized for pickup. Null for Finalsite
          `contact_1` and `contact_2` rows.
      - name: is_custodial
        data_type: boolean
        description:
          Whether the contact has custody. Null for Finalsite `contact_1` and
          `contact_2` rows.
      - name: is_household_member
        data_type: boolean
        description:
          Whether the contact lives with the student. Null for Finalsite
          `contact_1` and `contact_2` rows.

unit_tests:
  - name: test_focus_slotting_contact_1_and_emergency_ranks
    description: >-
      Pins the Focus branch slotting. student_number is the Focus
      local_student_id with its 8400 prefix stripped. contact_1 is the
      sort_order 1 link. emergency_N ranks every emergency-flagged link by
      sort_order INCLUDING the sort_order 1 link, so the primary contact
      deliberately occupies both contact_1 and emergency_1. A link that is not
      emergency-flagged and is not sort_order 1 produces no row at all.
    model: int_students__contacts
    given:
      - input: ref('int_focus__student_contacts')
        format: sql
        rows: |
          select
            1 as student_id,
            10 as person_id,
            'Mother' as relationship,
            1 as sort_order,
            'Guardian A' as contact_name,
            '305-555-0001' as phone_mobile,
            cast(null as string) as phone_home,
            cast(null as string) as phone_daytime,
            cast(null as string) as phone_work,
            '305-555-0001' as phone_primary,
            true as is_emergency,
            true as is_pickup,
            true as is_custodial,
            true as is_household_member,
            'kippmiami' as _dbt_source_project,
            'a@example.org' as email,
            '1 Main St' as home_address,
            '8400123456' as local_student_id
          union all
          select
            1, 20, 'Father', 2, 'Guardian B',
            '305-555-0002', null, null, null, '305-555-0002',
            true, true, false, true,
            'kippmiami', 'b@example.org', '1 Main St', '8400123456'
          union all
          select
            1, 30, 'Neighbor', 3, 'Guardian C',
            '305-555-0003', null, null, null, '305-555-0003',
            false, false, false, false,
            'kippmiami', 'c@example.org', '2 Other St', '8400123456'
      - input: ref('int_finalsite__student_contacts')
        format: sql
        rows: |
          select
            cast(null as string) as contact_slot,
            cast(null as string) as finalsite_contact_id,
            cast(null as string) as contact_name,
            cast(null as string) as relationship,
            cast(null as string) as phone_mobile,
            cast(null as string) as phone_home,
            cast(null as string) as phone_daytime,
            cast(null as string) as phone_work,
            cast(null as string) as phone_primary,
            cast(null as bool) as is_emergency,
            cast(null as bool) as is_pickup,
            cast(null as bool) as is_custodial,
            cast(null as bool) as is_household_member,
            cast(null as string) as _dbt_source_project,
            cast(null as string) as email,
            cast(null as string) as home_address,
            cast(null as string) as finalsite_enrollment_id
          limit 0
      - input: ref('int_finalsite__contact_id_attributes')
        format: sql
        rows: |
          select
            cast(null as string) as finalsite_enrollment_id,
            cast(null as string) as _dbt_source_project,
            cast(null as string) as powerschool_student_number
          limit 0
    expect:
      rows:
        - {
            student_number: 123456,
            _dbt_source_project: kippmiami,
            contact_slot: contact_1,
            relationship: Mother,
            is_emergency: true,
            is_custodial: true,
          }
        - {
            student_number: 123456,
            _dbt_source_project: kippmiami,
            contact_slot: emergency_1,
            relationship: Mother,
            is_emergency: true,
            is_custodial: true,
          }
        - {
            student_number: 123456,
            _dbt_source_project: kippmiami,
            contact_slot: emergency_2,
            relationship: Father,
            is_emergency: true,
            is_custodial: false,
          }
