models:
  - name: int_students__athletic_eligibility

    columns:
      - name: _dbt_source_relation
        data_type: string
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from `_dbt_source_relation`.

      - name: academic_year
        data_type: int64

      - name: yearid
        data_type: int64

        description:
          A number representing which year the term belongs to, such as 13 for
          2003-2004. Thenumber is equal to the ID of the year term divided by
          100. Maintained in the Terms table.Required. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__gradeschoolconfig
            source_column: yearid
      - name: schoolid
        data_type: int64

        description:
          The School_Number of the associated Schools record. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__storedgrades
            source_column: schoolid
      - name: student_number
        data_type: int64

        description: Student Number assigned by the school. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: student_number
            contains_pii: true
            column_role: primary_key
      - name: students_dcid
        data_type: int64

      - name: studentid
        data_type: int64

        description:
          The internal number and ID of the associated Students record.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__storedgrades
            source_column: studentid
            column_role: foreign_key
      - name: grade_level
        data_type: int64

        description:
          The grade level the student was in when the grade was stored. This
          simply copies the students'current grade level in to this field.
          Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__storedgrades
            source_column: grade_level
      - name: grade_level_prev
        data_type: int64

      - name: dob
        data_type: date

        description: Date of birth.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: dob
            contains_pii: true
      - name: ada
        data_type: float64

      - name: cy_unweighted_term_q1
        data_type: float64

      - name: cy_weighted_term_q1
        data_type: float64

      - name: cy_unweighted_s1_ada
        data_type: float64

      - name: cy_weighted_s1_ada
        data_type: float64

      - name: py_y1_unweighted_ada
        data_type: float64

      - name: py_y1_weighted_ada
        data_type: float64

      - name: cy_q1_gpa
        data_type: float64

      - name: cy_s1_gpa
        data_type: float64

      - name: cy_y1_gpa
        data_type: float64

      - name: py_y1_gpa
        data_type: float64

      - name: py_credits
        data_type: float64

      - name: met_py_credits
        data_type: boolean

      - name: met_cy_credits
        data_type: boolean

      - name: is_first_time_ninth
        data_type: boolean

      - name: is_age_eligible
        data_type: boolean

      - name: q1_ae_status
        data_type: string

        description:
          The grade level the student was in when the grade was stored. This
          simply copies the students'current grade level in to this field.
          Indexed. Categorical mapping of grade_level, is_age_eligible,
          is_first_time_ninth, met_py_credits, py_y1_gpa, py_y1_unweighted_ada.
      - name: q2_ae_status
        data_type: string

        description:
          The grade level the student was in when the grade was stored. This
          simply copies the students'current grade level in to this field.
          Indexed. Categorical mapping of ada, cy_q1_gpa, cy_weighted_term_q1,
          cy_y1_gpa, grade_level, is_age_eligible, is_first_time_ninth,
          met_py_credits.
      - name: q3_ae_status
        data_type: string

        description:
          The grade level the student was in when the grade was stored. This
          simply copies the students'current grade level in to this field.
          Indexed. Categorical mapping of ada, cy_s1_gpa, cy_weighted_s1_ada,
          cy_y1_gpa, grade_level, is_age_eligible, met_cy_credits.
      - name: q4_ae_status
        data_type: string
        description:
          The grade level the student was in when the grade was stored. This
          simply copies the students'current grade level in to this field.
          Indexed. Categorical mapping of ada, cy_s1_gpa, cy_weighted_s1_ada,
          cy_y1_gpa, grade_level, is_age_eligible, met_cy_credits.

unit_tests:
  - name: test_athletic_eligibility_age_cutoff_and_ms_dual_probation
    description:
      Two policy rules. Age — a student whose 19th birthday falls before
      September 1 of the academic year is ineligible, and one who turns 19 on
      September 1 is not. Middle school — below 90 percent attendance together
      with a 2.2 to 2.49 GPA is probation on both counts in Q2 through Q4, never
      a blank status.
    model: int_students__athletic_eligibility
    overrides:
      vars:
        current_academic_year: 2026
    given:
      - input: ref('int_extracts__student_enrollments')
        rows:
          - student_number: 1
            studentid: 1
            yearid: 36
            academic_year: 2026
            grade_level: 10
            grade_level_prev: 9
            dob: 2007-08-31
            rn_year: 1
            enroll_status: 0
            region: Newark
            _dbt_source_project: kippnewark
          - student_number: 2
            studentid: 2
            yearid: 36
            academic_year: 2026
            grade_level: 10
            grade_level_prev: 9
            dob: 2007-09-01
            rn_year: 1
            enroll_status: 0
            region: Newark
            _dbt_source_project: kippnewark
          - student_number: 3
            studentid: 3
            yearid: 36
            academic_year: 2026
            grade_level: 7
            grade_level_prev: 6
            dob: 2013-01-01
            ada: 0.85
            rn_year: 1
            enroll_status: 0
            region: Newark
            _dbt_source_project: kippnewark
      - input: ref('int_powerschool__gpa_term_pivot')
        rows:
          - studentid: 3
            yearid: 36
            gpa_term_q1: 2.3
            gpa_y1_q2: 2.3
            gpa_y1_cur: 2.3
            _dbt_source_project: kippnewark
      - input: ref('stg_powerschool__storedgrades')
        rows:
          - studentid: 99
            yearid: 35
            academic_year: 2025
            storecode: Y1
            earnedcrhrs: 5
            _dbt_source_project: kippnewark
      - input: ref('base_powerschool__final_grades')
        rows:
          - studentid: 99
            yearid: 36
            storecode: Q2
            y1_letter_grade_adjusted: A
            _dbt_source_project: kippnewark
    expect:
      rows:
        - student_number: 1
          is_age_eligible: false
          q2_ae_status: Ineligible - Age
          q3_ae_status: Ineligible - Age
          q4_ae_status: Ineligible - Age
        - student_number: 2
          is_age_eligible: true
          q2_ae_status: null
          q3_ae_status: null
          q4_ae_status: null
        - student_number: 3
          is_age_eligible: true
          q2_ae_status: Probation - ADA and GPA
          q3_ae_status: Probation - ADA and GPA
          q4_ae_status: Probation - ADA and GPA
