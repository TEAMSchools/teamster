models:
  - name: int_students__schools
    description: >-
      SIS-agnostic school spine. Unions the PowerSchool school staging view for
      the three New Jersey regions with the conformed Focus branch for Miami.
      The Miami PowerSchool archive is excluded for every school Focus carries,
      because Focus now carries Miami school identity and including both
      double-counts; the 999999 "Graduated Students" sentinel Focus never
      received stays on the archive branch so alumni graduate placeholder
      enrollment rows keep their school attributes.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - school_number
              - _dbt_source_project
    columns:
      - name: school_number
        description: Canonical network school number.
      - name: _dbt_source_project
        description:
          District code location, passed through from the source union view.
      - name: _dbt_source_relation
        description: Source relation, passed through from the source union view.
