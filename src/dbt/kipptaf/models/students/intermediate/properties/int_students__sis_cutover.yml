models:
  - name: int_students__sis_cutover
    description: >-
      The academic year Miami's attendance moved from PowerSchool to Focus,
      derived from the first year Focus holds recorded attendance. One row.
      Every int_students__* conform but one scopes both sides of its Miami union
      on it, so that PowerSchool serves the years below it and Focus serves it
      and forward. The exception is int_students__terms, which states the
      cutover year as a literal. This value moves with a Focus attendance
      backfill and the terms boundary must not, so the two are deliberately
      independent; that model's description gives the reasoning.
    columns:
      - name: focus_start_academic_year
        description: >-
          First academic year with recorded Focus attendance. Currently 2026.
        data_tests:
          - not_null:
              config:
                severity: error
