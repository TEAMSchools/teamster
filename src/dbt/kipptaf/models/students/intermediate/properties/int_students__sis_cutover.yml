models:
  - name: int_students__sis_cutover
    description: >-
      The academic year Miami's attendance moved from PowerSchool to Focus,
      derived from the first year Focus holds recorded attendance. One row.
      Disabled: every int_students__* conform now states the 2026 cutover year
      as a literal instead. A derived value moves with a Focus attendance
      backfill, and the network treats this boundary as permanent, so the two
      disagreed about what the number means.
    config:
      enabled: false
    columns:
      - name: focus_start_academic_year
        description: >-
          First academic year with recorded Focus attendance. Currently 2026.
        data_tests:
          - not_null:
              config:
                enabled: false
                severity: error
