models:
  - name: int_students__graduation_pathway_scores
    description: >-
      Every graduation pathway a New Jersey high school student could satisfy,
      paired with the score they earned against it. One row per student,
      subject, score type, assessment version and sitting, whether or not the
      score cleared the cut score -- the dashboard shows near misses, so nothing
      is filtered out here. Scores arrive from three places, the state
      assessment file, hand entry in PowerSchool for transfer students, and the
      college board assessments. Students whose pathway PowerSchool already
      decided still get one row per subject so they do not disappear from
      reporting. int_students__graduation_path_codes rolls this up into a
      per-student standing.
    config:
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - _dbt_source_project
              - student_number
              - discipline
              - score_type
              - assessment_version
              - rn_highest
          config:
            severity: error
    columns:
      - name: _dbt_source_relation
        data_type: string
        description: Source relation identifier from dbt_utils.union_relations.
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from `_dbt_source_relation`.
      - name: students_dcid
        data_type: int64
        description: PowerSchool durable identifier for the student.
      - name: studentid
        data_type: int64
        description: >-
          PowerSchool student identifier, unique only within its own instance.
      - name: student_number
        data_type: int64
        description: Student number assigned by the school.
        config:
          meta:
            contains_pii: true
      - name: state_studentnumber
        data_type: string
        description: State-assigned student number.
        config:
          meta:
            contains_pii: true
      - name: salesforce_id
        data_type: string
        description: KIPP Forward contact identifier for the student.
      - name: grade_level
        data_type: int64
        description: Grade the student is in.
      - name: enroll_status
        data_type: int64
        description: >-
          PowerSchool enrollment status. Not filtered here, so consumers that
          want only actively enrolled students filter on 0 themselves.
      - name: cohort
        data_type: int64
        description: >-
          Graduating class the student entered high school with. Frozen at first
          year in the school, so a retained or accelerated student can sit an
          assessment alongside a different class.
      - name: discipline
        data_type: string
        description: ELA or Math.
      - name: powerschool_credittype
        data_type: string
        description: Credit type the subject maps to in PowerSchool.
      - name: ps_grad_path_code
        data_type: string
        description: >-
          Pathway code already recorded in PowerSchool. M is IEP, N is portfolio
          appeal, O is attempted but passed nothing, P is incomplete credits.
          Any of those four means PowerSchool has decided and no cut score
          applies.
      - name: has_fafsa
        data_type: boolean
        description: Whether the student has met the FAFSA requirement.
      - name: njgpa_season_11th
        data_type: boolean
        description: >-
          True once NJGPA results have landed, which is late June. Before that
          11th graders are not held to the test requirement.
      - name: fafsa_season_12th
        data_type: boolean
        description: >-
          True on or after the January FAFSA deadline of the student's senior
          year. FAFSA is tracked before then but not counted against them.
      - name: pathway_option
        data_type: string
        description: >-
          Assessment that could satisfy the pathway. Both NJGPA versions share
          the value NJGPA, so a change of test version does not create a new
          option downstream.
      - name: score_type
        data_type: string
        description: >-
          Specific score within the assessment, matching the code the source
          system reports and the cut score sheet keys on.
      - name: pathway_code
        data_type: string
        description: >-
          Letter New Jersey uses to report which pathway was met. S is the state
          assessment, E is ACT, D is SAT, J is PSAT10, K is PSAT/NMSQT.
      - name: cutoff
        data_type: int64
        description: >-
          Lowest score that satisfies this pathway for the student's cohort,
          subject and assessment version. Zero where PowerSchool already
          decided.
      - name: assessment_version
        data_type: string
        description: >-
          Which version of the assessment the score and cut score belong to. The
          retired NJGPA and the adaptive NJGPA-A use different scales, so a
          score is only ever compared against the cut score set for its own
          scale.
      - name: scale_score
        data_type: numeric
        description: >-
          Score the student earned. Null where the student has no score for this
          pathway, which is the usual case, since every student is paired with
          every pathway their cohort has a cut score for.
      - name: subject_area
        data_type: string
        description:
          Subject the score belongs to, as the source system labels it.
      - name: met_pathway_cutoff
        data_type: boolean
        description: >-
          Whether this score reached its cut score. False rather than null when
          there is no score, so it can be aggregated directly.
      - name: attempted_njgpa_ela
        data_type: boolean
        description: >-
          Whether the student sat the NJGPA in English language arts at all.
          Sitting it at least once is a prerequisite for any other pathway to
          count toward graduation.
      - name: attempted_njgpa_math
        data_type: boolean
        description: Whether the student sat the NJGPA in mathematics at all.
      - name: points_short
        data_type: numeric
        description: >-
          Score minus cut score. Negative means the student fell short, positive
          means they cleared it. Null where there is no score.
      - name: rn_highest
        data_type: int64
        description: >-
          Ranks a student's sittings of the same score type, highest score
          first. Consumers wanting one row per score type filter on 1.

unit_tests:
  - name: test_njgpa_cut_score_boundaries_per_assessment_version
    description: >-
      Pins the cut score boundary for each NJGPA version, and pins that a score
      is only ever compared against the cut score for its own version. NJGPA-A
      is graduation ready at 450 and the retired NJGPA at 725, on scales that do
      not overlap, and both arrive with the same assessment_name and the same
      testcode. The class of 2027 carries a cut score row for each version, so
      every student here produces two rows -- one that matches their score and
      one that matches nothing. A retired-scale score of 700 must not clear the
      450 cut score, which is the regression this test exists to catch.
    model: int_students__graduation_pathway_scores
    given:
      - input: ref('int_extracts__student_enrollments_subjects')
        format: sql
        rows: |
          select
            'kippnewark_powerschool' as _dbt_source_relation,
            'kippnewark' as _dbt_source_project,
            1 as students_dcid,
            1 as studentid,
            1 as student_number,
            '1' as state_studentnumber,
            cast(null as string) as salesforce_id,
            12 as grade_level,
            0 as enroll_status,
            2027 as cohort,
            'ELA' as discipline,
            'ENG' as powerschool_credittype,
            true as met_fafsa_requirement,
            cast(null as string) as ps_grad_path_code,
            1 as rn_undergrad,
            'Newark' as region
          union all
          select 'kippnewark_powerschool', 'kippnewark', 2, 2, 2, '2', null,
            12, 0, 2027, 'ELA', 'ENG', true, null, 1, 'Newark'
          union all
          select 'kippnewark_powerschool', 'kippnewark', 3, 3, 3, '3', null,
            12, 0, 2027, 'ELA', 'ENG', true, null, 1, 'Newark'
          union all
          select 'kippnewark_powerschool', 'kippnewark', 4, 4, 4, '4', null,
            12, 0, 2027, 'ELA', 'ENG', true, null, 1, 'Newark'
          union all
          select 'kippnewark_powerschool', 'kippnewark', 5, 5, 5, '5', null,
            12, 0, 2027, 'ELA', 'ENG', true, null, 1, 'Newark'

      - input: ref('int_pearson__all_assessments')
        format: sql
        rows: |
          select
            1 as localstudentidentifier,
            'ELA' as discipline,
            cast(450 as numeric) as testscalescore,
            'ELAGP' as testcode,
            'NJGPA' as assessment_name,
            'NJGPA-A' as assessment_version,
            cast(1 as numeric) as testscorecomplete
          union all
          select 2, 'ELA', cast(449 as numeric), 'ELAGP', 'NJGPA', 'NJGPA-A',
            cast(1 as numeric)
          union all
          select 3, 'ELA', cast(725 as numeric), 'ELAGP', 'NJGPA', 'NJGPA',
            cast(1 as numeric)
          union all
          select 4, 'ELA', cast(724 as numeric), 'ELAGP', 'NJGPA', 'NJGPA',
            cast(1 as numeric)
          union all
          select 5, 'ELA', cast(700 as numeric), 'ELAGP', 'NJGPA', 'NJGPA',
            cast(1 as numeric)
          union all
          select 5, 'ELA', cast(500 as numeric), 'ELAGP', 'NJGPA', 'NJGPA-A',
            cast(1 as numeric)

      - input: ref('stg_google_sheets__student_graduation_path_cutoffs')
        format: sql
        rows: |
          select
            2027 as cohort,
            'ELA' as discipline,
            'NJGPA' as pathway_option,
            'ELAGP' as score_type,
            'S' as pathway_code,
            725 as cutoff,
            'NJGPA' as assessment_version
          union all
          select 2027, 'ELA', 'NJGPA', 'ELAGP', 'S', 450, 'NJGPA-A'

      - input: ref('int_powerschool__state_assessments_transfer_scores')
        format: sql
        rows: |
          select
            cast(null as int64) as studentid,
            cast(null as string) as discipline,
            cast(null as float64) as testscalescore,
            cast(null as string) as testcode,
            cast(null as string) as assessment_name,
            cast(null as string) as assessment_version
          limit 0

      - input: ref('int_assessments__college_assessment')
        format: sql
        rows: |
          select
            cast(null as int64) as student_number,
            cast(null as numeric) as scale_score,
            cast(null as string) as score_type,
            cast(null as string) as subject_area,
            cast(null as string) as scope,
            cast(null as string) as course_discipline
          limit 0
    expect:
      rows:
        - {
            student_number: 1,
            assessment_version: NJGPA-A,
            cutoff: 450,
            scale_score: 450,
            met_pathway_cutoff: true,
          }
        - {
            student_number: 1,
            assessment_version: NJGPA,
            cutoff: 725,
            scale_score: null,
            met_pathway_cutoff: false,
          }
        - {
            student_number: 2,
            assessment_version: NJGPA-A,
            cutoff: 450,
            scale_score: 449,
            met_pathway_cutoff: false,
          }
        - {
            student_number: 2,
            assessment_version: NJGPA,
            cutoff: 725,
            scale_score: null,
            met_pathway_cutoff: false,
          }
        - {
            student_number: 3,
            assessment_version: NJGPA-A,
            cutoff: 450,
            scale_score: null,
            met_pathway_cutoff: false,
          }
        - {
            student_number: 3,
            assessment_version: NJGPA,
            cutoff: 725,
            scale_score: 725,
            met_pathway_cutoff: true,
          }
        - {
            student_number: 4,
            assessment_version: NJGPA-A,
            cutoff: 450,
            scale_score: null,
            met_pathway_cutoff: false,
          }
        - {
            student_number: 4,
            assessment_version: NJGPA,
            cutoff: 725,
            scale_score: 724,
            met_pathway_cutoff: false,
          }
        - {
            student_number: 5,
            assessment_version: NJGPA-A,
            cutoff: 450,
            scale_score: 500,
            met_pathway_cutoff: true,
          }
        - {
            student_number: 5,
            assessment_version: NJGPA,
            cutoff: 725,
            scale_score: 700,
            met_pathway_cutoff: false,
          }
