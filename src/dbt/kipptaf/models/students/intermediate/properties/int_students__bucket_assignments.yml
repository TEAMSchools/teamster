models:
  - name: int_students__bucket_assignments
    description: >-
      The single home for stored student bucket assignments. PowerSchool special
      programs (NJ) and Focus custom student groups (Miami), decoded from the
      program or group name ("Bucket 1 - ELA"). One row per academic_year x
      region x student_number x subject; where a student has assignment history
      (rollout-PD amendments exit and re-enter), the latest assignment_date
      wins. Bucket 4 is never stored - consumers coalesce a missing row to
      Bucket 4. Region is part of the grain because student numbers repeat
      across PowerSchool instances.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - academic_year
            - region
            - student_number
            - subject
          config:
            severity: error
    columns:
      - name: subject
        description: >-
          Reading or Math, decoded from the program or group name; null when the
          name's discipline token is neither ELA nor Math, so a typo surfaces
          instead of defaulting to a subject.
        data_tests:
          - not_null
          - accepted_values:
              values: [Reading, Math]
      - name: bucket
        description:
          Stored bucket label; the "everyone else" Bucket 4 has no stored row.
        data_tests:
          - not_null
          - accepted_values:
              values: [Bucket 1, Bucket 2, Bucket 3]
      - name: n_active_assignments
        description: >-
          Count of assignments on this grain still active today (no exit date,
          or a future one - PowerSchool stores a scheduled year-end exit on live
          rows); more than 1 means a double upload that the latest-wins pick is
          masking.
        data_tests:
          - dbt_utils.expression_is_true:
              expression: <= 1
              config:
                severity: warn
      - name: academic_year
        description: Academic year of the assignment (Focus syear as-is).
      - name: region
        description: Newark, Camden, Paterson, or Miami.
      - name: student_number
        description: Network student number (the Focus student_id for Miami).
      - name: bucket_store
        description: Which system holds the assignment (powerschool or focus).
      - name: assignment_date
        description: >-
          Program enter date (PowerSchool) or group-membership created date
          (Focus).

unit_tests:
  - name: unit_int_students__bucket_assignments
    description: >-
      Decodes both stores, picks the latest assignment on re-assignment
      (PowerSchool stores a scheduled future year-end exit on live rows and a
      past exit on amended-out rows), counts a same-subject double upload,
      excludes non-bucket programs, and keeps same-number students in different
      regions apart.
    model: int_students__bucket_assignments
    given:
      - input: ref("int_powerschool__spenrollments")
        rows:
          - studentid: 11
            academic_year: 2026
            specprog_name: Bucket 2 - Math
            enter_date: 2026-09-01
            exit_date: 2026-10-01
            _dbt_source_relation: "`t`.`kippnewark_powerschool`.`x`"
            _dbt_source_project: kippnewark
          - studentid: 11
            academic_year: 2026
            specprog_name: Bucket 3 - Math
            enter_date: 2026-10-02
            exit_date: 2099-06-30
            _dbt_source_relation: "`t`.`kippnewark_powerschool`.`x`"
            _dbt_source_project: kippnewark
          - studentid: 12
            academic_year: 2026
            specprog_name: MTSS Math
            enter_date: 2026-09-01
            exit_date: null
            _dbt_source_relation: "`t`.`kippnewark_powerschool`.`x`"
            _dbt_source_project: kippnewark
          - studentid: 13
            academic_year: 2026
            specprog_name: Bucket 1 - ELA
            enter_date: 2026-09-01
            exit_date: 2099-06-30
            _dbt_source_relation: "`t`.`kippcamden_powerschool`.`x`"
            _dbt_source_project: kippcamden
          - studentid: 13
            academic_year: 2026
            specprog_name: Bucket 2 - ELA
            enter_date: 2026-09-05
            exit_date: 2099-06-30
            _dbt_source_relation: "`t`.`kippcamden_powerschool`.`x`"
            _dbt_source_project: kippcamden
      - input: ref("int_extracts__student_enrollments")
        rows:
          - studentid: 11
            student_number: 5001
            academic_year: 2026
            rn_year: 1
            _dbt_source_project: kippnewark
          - studentid: 12
            student_number: 5002
            academic_year: 2026
            rn_year: 1
            _dbt_source_project: kippnewark
          - studentid: 13
            student_number: 5001
            academic_year: 2026
            rn_year: 1
            _dbt_source_project: kippcamden
      - input: ref("stg_focus__student_groups")
        format: sql
        rows: |
          select
              90 as id,
              'Bucket 2 - ELA' as title,
              cast(null as date) as end_date,
              'kippmiami' as _dbt_source_project
      - input: ref("stg_focus__students_join_groups")
        format: sql
        rows: |
          select
              90 as group_id,
              84001234 as student_id,
              2026 as syear,
              timestamp '2026-09-17 12:00:00' as created_at,
              'kippmiami' as _dbt_source_project
    expect:
      rows:
        - academic_year: 2026
          region: Newark
          student_number: 5001
          subject: Math
          bucket: Bucket 3
          bucket_store: powerschool
          assignment_date: 2026-10-02
          n_active_assignments: 1
        - academic_year: 2026
          region: Camden
          student_number: 5001
          subject: Reading
          bucket: Bucket 2
          bucket_store: powerschool
          assignment_date: 2026-09-05
          n_active_assignments: 2
        - academic_year: 2026
          region: Miami
          student_number: 84001234
          subject: Reading
          bucket: Bucket 2
          bucket_store: focus
          assignment_date: 2026-09-17
          n_active_assignments: 1
