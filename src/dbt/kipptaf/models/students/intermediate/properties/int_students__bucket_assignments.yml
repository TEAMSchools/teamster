              'Bucket 2 - Math' as specprog_name,
              date '2026-09-01' as enter_date,
              date '2026-10-01' as exit_date,
              'kippnewark' as _dbt_source_project,
              '`t`.`kippnewark_powerschool`.`x`' as _dbt_source_relation,
              cast(null as int64) as dcid,
              cast(null as int64) as id,
              cast(null as int64) as programid,
              cast(null as int64) as gradelevel,
              cast(null as string) as sp_comment,
              cast(null as string) as exitcode,
              1 as rn_student_program_year_desc,
              false as is_current,
              false as is_out_of_district,
              false as is_self_contained
          union all
          select
              11,
              5001,
              2026,
              'Bucket 3 - Math',
              date '2026-10-02',
              date '2099-06-30',
              'kippnewark',
              '`t`.`kippnewark_powerschool`.`x`',
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as string),
              cast(null as string),
              1,
              false,
              false,
              false
          union all
          select
              12,
              5002,
              2026,
              'MTSS Math',
              date '2026-09-01',
              cast(null as date),
              'kippnewark',
              '`t`.`kippnewark_powerschool`.`x`',
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as string),
              cast(null as string),
              1,
              false,
              false,
              false
          union all
          select
              13,
              5001,
              2026,
              'Bucket 1 - ELA',
              date '2026-09-01',
              date '2099-06-30',
              'kippcamden',
              '`t`.`kippcamden_powerschool`.`x`',
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as string),
              cast(null as string),
              1,
              false,
              false,
              false
          union all
          select
              13,
              5001,
              2026,
              'Bucket 2 - ELA',
              date '2026-09-05',
              date '2099-06-30',
              'kippcamden',
              '`t`.`kippcamden_powerschool`.`x`',
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as string),
              cast(null as string),
              1,
              false,
              false,
              false
          union all
          select
              21,
              84005678,
              2025,
              'Bucket 1 - Math',
              date '2024-09-10',
              date '2025-06-04',
              'kippmiami',
              '`t`.`kippmiami_powerschool`.`x`',
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as string),
              cast(null as string),
              1,
              false,
              false,
              false
          union all
          select
              14,
              5003,
              2026,
              'Bucket 1 - ELA',
              date '2026-09-01',
              date '2026-09-02',
              'kippnewark',
              '`t`.`kippnewark_powerschool`.`x`',
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as string),
              cast(null as string),
              1,
              false,
              false,
              false
          union all
          select
              14,
              5003,
              2026,
              'Bucket 2 - ELA',
              date '2026-09-01',
              date '2099-06-30',
              'kippnewark',
              '`t`.`kippnewark_powerschool`.`x`',
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as int64),
              cast(null as string),
              cast(null as string),
              1,
              false,
