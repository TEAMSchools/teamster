models:
  - name: int_students__bucket_assignments
    description: >-
      The single home for stored student bucket assignments. Unions PowerSchool
      special programs (NJ, and the frozen Miami archive for 2024-25 and
      2025-26) from int_powerschool__bucket_programs with Focus custom student
      groups (Miami from 2026-27) from int_focus__bucket_memberships, keeping
      PowerSchool programs only for students enrolled in that region and year.
      One row per stored assignment (academic_year x _dbt_source_project x
      student_number x subject x assignment_date), so a student's mid-year
      changes and rollout-PD amendments (exit and re-enter) all stay; the source
      models settle 2 assignments stored on the same day. Bucket 4 is never
      stored. rn_assignment_year_desc = 1 is the student's latest assignment for
      the year, and dim_student_bucket_status turns these rows into enrollment
      spans. _dbt_source_project is part of the grain because student numbers
      repeat across regions.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - _dbt_source_project
              - student_number
              - subject
              - assignment_date
          config:
            severity: error
    columns:
      - name: subject
        description: >-
          Reading or Math, decoded from the program or group name; null when the
          name has no hyphenated discipline token or the token is neither ELA
          nor Math, so a typo surfaces instead of defaulting to a subject.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Reading, Math]
      - name: bucket
        description:
          Stored bucket label; the "everyone else" Bucket 4 has no stored row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Bucket 1, Bucket 2, Bucket 3]
      - name: n_active_assignments
        description: >-
          Count of the student's assignments for the year and subject still
          active today (no exit date, or a future one). The exit date is
          per-assignment in PowerSchool (live rows carry a scheduled year-end
          exit) but is the GROUP's end date in Focus, where a membership has no
          end date of its own. More than 1 means a double upload.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: <= 1
              config:
                severity: warn
      - name: academic_year
        description: Academic year of the assignment (Focus syear as-is).
      - name: _dbt_source_project
        description: >-
          District code location the assignment came from, carried through from
          int_powerschool__bucket_programs or int_focus__bucket_memberships.
      - name: student_number
        description: Network student number (the Focus student_id for Miami).
      - name: bucket_store
        description: Which system holds the assignment (powerschool or focus).
      - name: assignment_date
        description: >-
          Program enter date (PowerSchool) or group-membership created date
          (Focus).
      - name: exit_date
        description: >-
          Program exit date (PowerSchool), the first day the assignment no
          longer applies, or the group's end date (Focus). Null when the
          assignment has no end.
      - name: rn_assignment_year_desc
        description: >-
          Rank of the assignment within the student's year and subject, latest
          assignment_date first. 1 is the student's bucket for the year, the
          dashboards' year rule.

unit_tests:
  - name: unit_int_students__bucket_assignments
    description: >-
      Keeps PowerSchool programs only for students enrolled in that region and
      year, keeps same-number students in different regions apart, matches Miami
      archive programs on student_number, passes Focus memberships through, and
      ranks a student's mid-year change latest first.
    model: int_students__bucket_assignments
    given:
      - input: ref("int_powerschool__bucket_programs")
        format: sql
        rows: |
          select
              2026 as academic_year,
              'kippnewark' as _dbt_source_project,
              5001 as student_number,
              'Math' as `subject`,
              'Bucket 2' as bucket,
              date '2026-09-01' as assignment_date,
              date '2026-10-01' as exit_date,
              1 as n_active_assignments
          union all
          select
              2026,
              'kippnewark',
              5001,
              'Math',
              'Bucket 3',
              date '2026-10-02',
              date '2099-06-30',
              1
          union all
          select
              2026,
              'kippcamden',
              5001,
              'Reading',
              'Bucket 1',
              date '2026-09-01',
              date '2099-06-30',
              1
          union all
          select
              2026,
              'kippnewark',
              5009,
              'Reading',
              'Bucket 2',
              date '2026-09-01',
              date '2099-06-30',
              1
          union all
          select
              2025,
              'kippmiami',
              84005678,
              'Math',
              'Bucket 1',
              date '2024-09-10',
              date '2025-06-04',
              0
      - input: ref("int_extracts__student_enrollments")
        rows:
          - student_number: 5001
            academic_year: 2026
            rn_year: 1
            _dbt_source_project: kippnewark
          - student_number: 5001
            academic_year: 2026
            rn_year: 1
            _dbt_source_project: kippcamden
          - student_number: 84005678
            academic_year: 2025
            rn_year: 1
            _dbt_source_project: kippmiami
      - input: ref("int_focus__bucket_memberships")
        format: sql
        rows: |
          select
              2026 as academic_year,
              'kippmiami' as _dbt_source_project,
              84001234 as student_number,
              'Reading' as `subject`,
              'Bucket 2' as bucket,
              date '2026-09-17' as assignment_date,
              cast(null as date) as exit_date,
              1 as n_active_assignments
    expect:
      rows:
        - academic_year: 2026
          _dbt_source_project: kippnewark
          student_number: 5001
          subject: Math
          bucket: Bucket 2
          bucket_store: powerschool
          assignment_date: 2026-09-01
          exit_date: 2026-10-01
          n_active_assignments: 1
          rn_assignment_year_desc: 2
        - academic_year: 2026
          _dbt_source_project: kippnewark
          student_number: 5001
          subject: Math
          bucket: Bucket 3
          bucket_store: powerschool
          assignment_date: 2026-10-02
          exit_date: 2099-06-30
          n_active_assignments: 1
          rn_assignment_year_desc: 1
        - academic_year: 2026
          _dbt_source_project: kippcamden
          student_number: 5001
          subject: Reading
          bucket: Bucket 1
          bucket_store: powerschool
          assignment_date: 2026-09-01
          exit_date: 2099-06-30
          n_active_assignments: 1
          rn_assignment_year_desc: 1
        - academic_year: 2025
          _dbt_source_project: kippmiami
          student_number: 84005678
          subject: Math
          bucket: Bucket 1
          bucket_store: powerschool
          assignment_date: 2024-09-10
          exit_date: 2025-06-04
          n_active_assignments: 0
          rn_assignment_year_desc: 1
        - academic_year: 2026
          _dbt_source_project: kippmiami
          student_number: 84001234
          subject: Reading
          bucket: Bucket 2
          bucket_store: focus
          assignment_date: 2026-09-17
          exit_date: null
          n_active_assignments: 1
          rn_assignment_year_desc: 1
