models:
  - name: int_students__bucket_assignments
    description: >-
      The single home for stored student bucket assignments. PowerSchool special
      programs (NJ) and Focus custom student groups (Miami), decoded from the
      program or group name ("Bucket 1 - ELA"). One row per academic_year x
      _dbt_source_project x student_number x subject; where a student has
      assignment history (rollout-PD amendments exit and re-enter), the latest
      assignment_date wins. That pick is a business rule (the newest stored
      assignment is the official one), not source-duplicate masking, which is
      why it lives in this domain model rather than staging; a true double
      upload still surfaces through n_active_assignments. Bucket 4 is never
      stored - consumers coalesce a missing row to Bucket 4. _dbt_source_project
      is part of the grain because student numbers repeat across regions.
    config:
      meta:
        contains_pii: true
        standard_exempt:
          A5: >-
            Latest-assignment-wins is the business rule (the newest stored
            assignment is the official one), not source-duplicate masking; a
            true double upload still surfaces through n_active_assignments.
          A4: >-
            Shares its (_dbt_source_project, academic_year, student_number,
            subject) key with int_assessments__goal_benchmarks, but the two hold
            different facts from different sources (a stored bucket assignment
            versus a benchmark score panel), so neither extends the other.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - _dbt_source_project
              - student_number
              - subject
          config:
            severity: error
    columns:
      - name: subject
        description: >-
          Reading or Math, decoded from the program or group name; null when the
          name has no hyphenated discipline token or the token is neither ELA
          nor Math, so a typo surfaces instead of defaulting to a subject.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Reading, Math]
      - name: bucket
        description:
          Stored bucket label; the "everyone else" Bucket 4 has no stored row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Bucket 1, Bucket 2, Bucket 3]
      - name: n_active_assignments
        description: >-
          Count of assignments on this grain still active today (no exit date,
          or a future one). The exit date is per-assignment in PowerSchool (live
          rows carry a scheduled year-end exit) but is the GROUP's end date in
          Focus, where a membership has no end date of its own. More than 1
          means a double upload that the latest-wins pick is masking.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: <= 1
              config:
                severity: warn
      - name: academic_year
        description: Academic year of the assignment (Focus syear as-is).
      - name: _dbt_source_project
        description: >-
          District code location the assignment came from, carried through from
          int_powerschool__spenrollments or
          int_focus__student_group_memberships.
      - name: student_number
        description: Network student number (the Focus student_id for Miami).
      - name: bucket_store
        description: Which system holds the assignment (powerschool or focus).
      - name: assignment_date
        description: >-
          Program enter date (PowerSchool) or group-membership created date
          (Focus).

unit_tests:
  - name: unit_int_students__bucket_assignments
    description: >-
      Decodes both stores, picks the latest assignment on re-assignment
      (PowerSchool stores a scheduled future year-end exit on live rows and a
      past exit on amended-out rows), counts a same-subject double upload,
      excludes non-bucket groups and programs, and keeps same-number students in
      different regions apart.
    model: int_students__bucket_assignments
    given:
      - input: ref("int_powerschool__spenrollments")
        rows:
          - studentid: 11
            academic_year: 2026
            specprog_name: Bucket 2 - Math
            enter_date: 2026-09-01
            exit_date: 2026-10-01
            _dbt_source_relation: "`t`.`kippnewark_powerschool`.`x`"
            _dbt_source_project: kippnewark
          - studentid: 11
            academic_year: 2026
            specprog_name: Bucket 3 - Math
            enter_date: 2026-10-02
            exit_date: 2099-06-30
            _dbt_source_relation: "`t`.`kippnewark_powerschool`.`x`"
            _dbt_source_project: kippnewark
          - studentid: 12
            academic_year: 2026
            specprog_name: MTSS Math
            enter_date: 2026-09-01
            exit_date: null
            _dbt_source_relation: "`t`.`kippnewark_powerschool`.`x`"
            _dbt_source_project: kippnewark
          - studentid: 13
            academic_year: 2026
            specprog_name: Bucket 1 - ELA
            enter_date: 2026-09-01
            exit_date: 2099-06-30
            _dbt_source_relation: "`t`.`kippcamden_powerschool`.`x`"
            _dbt_source_project: kippcamden
          - studentid: 13
            academic_year: 2026
            specprog_name: Bucket 2 - ELA
            enter_date: 2026-09-05
            exit_date: 2099-06-30
            _dbt_source_relation: "`t`.`kippcamden_powerschool`.`x`"
            _dbt_source_project: kippcamden
      - input: ref("int_extracts__student_enrollments")
        rows:
          - studentid: 11
            student_number: 5001
            academic_year: 2026
            rn_year: 1
            _dbt_source_project: kippnewark
          - studentid: 12
            student_number: 5002
            academic_year: 2026
            rn_year: 1
            _dbt_source_project: kippnewark
          - studentid: 13
            student_number: 5001
            academic_year: 2026
            rn_year: 1
            _dbt_source_project: kippcamden
      - input: ref("int_focus__student_group_memberships")
        format: sql
        rows: |
          select
              84001234 as student_id,
              2026 as syear,
              timestamp '2026-09-17 12:00:00' as created_at,
              'Bucket 2 - ELA' as title,
              cast(null as date) as end_date,
              'kippmiami' as _dbt_source_project
          union all
          select
              84001234,
              2026,
              timestamp '2026-09-17 12:00:00',
              'Advisory 5A',
              cast(null as date),
              'kippmiami'
    expect:
      rows:
        - academic_year: 2026
          _dbt_source_project: kippnewark
          student_number: 5001
          subject: Math
          bucket: Bucket 3
          bucket_store: powerschool
          assignment_date: 2026-10-02
          n_active_assignments: 1
        - academic_year: 2026
          _dbt_source_project: kippcamden
          student_number: 5001
          subject: Reading
          bucket: Bucket 2
          bucket_store: powerschool
          assignment_date: 2026-09-05
          n_active_assignments: 2
        - academic_year: 2026
          _dbt_source_project: kippmiami
          student_number: 84001234
          subject: Reading
          bucket: Bucket 2
          bucket_store: focus
          assignment_date: 2026-09-17
          n_active_assignments: 1
