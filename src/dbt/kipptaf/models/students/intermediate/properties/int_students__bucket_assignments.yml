models:
  - name: int_students__bucket_assignments
    description: >-
      The single home for stored student bucket assignments. PowerSchool special
      programs (NJ, and the frozen Miami archive for 2024-25 and 2025-26) and
      Focus custom student groups (Miami from 2026-27), decoded from the program
      or group name ("Bucket 1 - ELA"). One row per stored assignment
      (academic_year x _dbt_source_project x student_number x subject x
      assignment_date), so a student's mid-year changes and rollout-PD
      amendments (exit and re-enter) all stay. When 2 assignments share an
      assignment_date, the active one, then the latest exit, then the higher
      bucket label wins; a true double upload still surfaces through
      n_active_assignments. Bucket 4 is never stored. The latest assignment per
      year is int_students__bucket_assignments_rollup, and
      dim_student_bucket_status turns these rows into enrollment spans.
      _dbt_source_project is part of the grain because student numbers repeat
      across regions.
    config:
      meta:
        contains_pii: true
        standard_exempt:
          A5: >-
            Picking 1 of 2 assignments stored on the same day is the business
            rule (an active assignment supersedes one entered and exited that
            day), not source-duplicate masking; a true double upload still
            surfaces through n_active_assignments.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - _dbt_source_project
              - student_number
              - subject
              - assignment_date
          config:
            severity: error
    columns:
      - name: subject
        description: >-
          Reading or Math, decoded from the program or group name; null when the
          name has no hyphenated discipline token or the token is neither ELA
          nor Math, so a typo surfaces instead of defaulting to a subject.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Reading, Math]
      - name: bucket
        description:
          Stored bucket label; the "everyone else" Bucket 4 has no stored row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Bucket 1, Bucket 2, Bucket 3]
      - name: n_active_assignments
        description: >-
          Count of the student's assignments for the year and subject still
          active today (no exit date, or a future one). The exit date is
          per-assignment in PowerSchool (live rows carry a scheduled year-end
          exit) but is the GROUP's end date in Focus, where a membership has no
          end date of its own. More than 1 means a double upload.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: <= 1
              config:
                severity: warn
      - name: academic_year
        description: Academic year of the assignment (Focus syear as-is).
      - name: _dbt_source_project
        description: >-
          District code location the assignment came from, carried through from
          int_powerschool__spenrollments or
          int_focus__student_group_memberships.
      - name: student_number
        description: Network student number (the Focus student_id for Miami).
      - name: bucket_store
        description: Which system holds the assignment (powerschool or focus).
      - name: assignment_date
        description: >-
          Program enter date (PowerSchool) or group-membership created date
          (Focus).
      - name: exit_date
        description: >-
          Program exit date (PowerSchool), the first day the assignment no
          longer applies, or the group's end date (Focus). Null when the
          assignment has no end.

unit_tests:
  - name: unit_int_students__bucket_assignments
    description: >-
      Decodes both stores, keeps every assignment on re-assignment (PowerSchool
      stores a scheduled future year-end exit on live rows and a past exit on
      amended-out rows), keeps the active one of 2 assignments stored on the
      same day, counts a same-subject double upload, excludes non-bucket groups
      and programs and Focus bucket groups before the 2026-27 cutover, keeps
      same-number students in different regions apart, and matches Miami archive
      programs, whose enrollments carry no studentid, on student_number.
