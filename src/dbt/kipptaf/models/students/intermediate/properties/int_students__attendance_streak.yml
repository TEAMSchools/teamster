models:
  - name: int_students__attendance_streak
    description: >-
      SIS-neutral consecutive-day attendance streaks -- the successor to
      int_powerschool__attendance_streak, which stays a pure PowerSchool union.
      The PowerSchool branch is year-scoped so the frozen Miami archive keeps
      serving the years Focus does not cover; Focus serves AY2026 forward. The
      Focus branch keys its streak_id on student_number rather than studentid,
      which is null for Focus, so the two branches occupy disjoint hash spaces
      and no NJ streak key changes.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [streak_id, att_code, _dbt_source_project]
          config:
            severity: error
    columns:
      - name: streak_id
        description: Surrogate key for the streak.
      - name: student_number
        description: Network student number.
        config:
          meta:
            contains_pii: true
      - name: studentid
        description: >-
          PowerSchool internal student id. Null for Miami rows sourced from
          Focus, which has no equivalent id at this grain -- this is why the
          streak fact's join key was repointed from studentid to student_number
          in this same change.
      - name: yearid
        description: Academic year minus 1990.
      - name: att_code
        description: >-
          The attendance code for a code streak, or the stringified attendance
          value for a value streak. Focus rows reassemble this same two-family
          shape from int_focus__attendance_streak's streak_type/streak_value
          split, with a null streak_value (daily code is null on a present day)
          coalesced to 'P' to match PowerSchool's present-streak label.
      - name: streak_start_date
        description: First calendar date of the streak.
      - name: streak_end_date
        description: Last calendar date of the streak.
      - name: streak_length_membership
        description: Count of membership days in the streak.
      - name: streak_length_calendar
        description: Count of calendar days spanned by the streak, inclusive.
      - name: _dbt_source_relation
        description: Source relation the row was unioned from.
      - name: _dbt_source_project
        description: Originating district project.
