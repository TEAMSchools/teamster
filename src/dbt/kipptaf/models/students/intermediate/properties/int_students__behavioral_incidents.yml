models:
  - name: int_students__behavioral_incidents
    description: >-
      DeansList behavioral incidents across all regions, one row per incident,
      with the canonical school location attached from the people locations
      sheet.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - incident_id
              - _dbt_source_project
          config:
            severity: error
    columns:
      - name: location_key
        description: >-
          Surrogate key for the canonical school location, matched on the
          DeansList school id. Null when the incident's school matches no
          location on the people locations sheet.
        data_tests:
          - relationships:
              arguments:
                to: ref("dim_locations")
                field: location_key
