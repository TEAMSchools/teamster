models:
  - name: int_students__gpa_term
    description: >-
      Term-grained GPA, one row per student, school, academic year and reporting
      term. Reads the shared `int_powerschool__gpa` package union and keys it on
      `student_number`, the student key every SIS shares. PowerSchool only:
      Focus's `student_gpa_calculated` carries `marking_period_id = -1` on every
      row, the vendor's course-history GPA, so Miami has no term GPA from AY2026
      on. Miami rows here come from the frozen PowerSchool archive and stop at
      AY2025. Cumulative GPA lives in `int_students__gpa_cumulative`.
    config:
      materialized: table
      meta:
        dagster:
          # 0 4 matches the gradebook_and_gpa_dashboard batch that feeds
          # fct_grades_gpa (category_grades, gradebook_assignments_scores,
          # final_grades), so ~any_deps_in_progress serializes the pass.
          # Refs #5082
          automation_condition:
            cron_schedule: 0 4 * * *
    data_tests:
      # Scoped to rows that resolved a student_number. int_powerschool__gpa_term
      # carries 4 Camden AY2015 rows at schoolid 0 whose students_student_number
      # is null directly on the package fact, so they collide with each other.
      # They are kept rather than dropped, and fct_grades_gpa excludes them
      # anyway on its inner join to enrollment.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
              - schoolid
              - term_name
              - _dbt_source_project
          config:
            where: student_number is not null
    columns:
      - name: _dbt_source_relation
        data_type: string
        description: District relation the row was unioned from.
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from `_dbt_source_relation`.
      - name: student_number
        data_type: int64
        description: >-
          Network student number, and what `fct_grades_gpa` joins enrollment and
          `int_students__gpa_cumulative` on.
        config:
          meta:
            contains_pii: true
      - name: studentid
        data_type: int64
        description: PowerSchool student id.
      - name: schoolid
        data_type: int64
        description: PowerSchool school id.
      - name: yearid
        data_type: int64
        description: >-
          PowerSchool year id, `academic_year - 1990`. `fct_grades_gpa` joins
          reporting terms on it.
      - name: academic_year
        data_type: int64
        description: Academic year, named for the fall of the school year.
      - name: term_name
        data_type: string
        description: Reporting term the row covers.
      - name: semester
        data_type: string
        description: Semester the term falls in.
      - name: gpa_term
        data_type: float64
        description: Weighted GPA earned in this term alone.
      - name: gpa_y1
        data_type: float64
        description: Weighted year-to-date GPA as of this term.
      - name: gpa_y1_unweighted
        data_type: float64
        description: Unweighted year-to-date GPA as of this term.
      - name: gpa_semester
        data_type: float64
        description: Weighted GPA earned across the semester this term sits in.
      - name: n_failing_y1
        data_type: int64
        description: Count of year-to-date course grades below passing.
      - name: total_credit_hours_term
        data_type: float64
        description: Credit hours attempted in this term alone.
      - name: total_credit_hours_y1
        data_type: float64
        description: Credit hours attempted year-to-date as of this term.
      - name: grade_avg_term
        data_type: float64
        description: Average percent grade across this term's courses.
      - name: grade_avg_y1
        data_type: float64
        description: Average percent grade across year-to-date courses.
