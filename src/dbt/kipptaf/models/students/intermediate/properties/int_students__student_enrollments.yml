models:
  - name: int_students__student_enrollments
    # config:
    #   materialized: table
    description: |
      Complete enrollment history for every student, across both network SIS
      systems. The three New Jersey regions come from PowerSchool; Miami comes
      from Focus, conformed to the PowerSchool column names and value domains.

      Excludes no-show students, who share an entry and exit date, and students
      with an inactive enrollment status, which PowerSchool uses mainly for
      duplicate records.

      Also carries the demographic data and student identifiers the enrollment
      consumers read. Columns PowerSchool supplies and Focus does not are null
      for Miami -- `is_self_contained` (a SPED service-delivery fact Focus does
      not carry, left null rather than asserted false per #4968), the KIPP
      Forward exit codes (`exit_code_kf`, `exit_code_ts`),
      `advisor_teachernumber` (no network teacher number in Focus), `rn_school`,
      `rn_undergrad`, `track`, and `cohort_graduated`.

      `is_enrolled_y1` and `is_enrolled_recent` are derived for Miami from the
      roster's enrollment dates, using PowerSchool's expressions.
      `is_out_of_district` is derived from `custom_863`, the IDEA educational
      environment, with `reporting_schoolid`, `reporting_school_name` and
      `school_level` branching on the same match -- PowerSchool derives all
      four from one special-programs record, so Focus branches all four on one
      option (#5041). Every Miami student holds `custom_863`'s default today,
      so the flag resolves false for every Miami row, exactly as it did while
      it was a literal. `is_enrolled_y1`, `is_enrolled_recent` and
      `is_out_of_district` were all null before #4996, which silently removed
      Miami from every consumer that filtered on them.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
              - schoolid
              - entrydate
    columns:
      - name: is_enrolled_y1
        data_type: boolean
        description: >-
          Whether the student held an enrollment at any point in the academic
          year. Derived from the enrollment dates on both SIS branches, taken to
          the year grain so any qualifying stint counts. True on every row in
          every region today, because neither branch leaves an exit date unset.
        data_tests:
          - not_null
      - name: is_enrolled_recent
        data_type: boolean
        description: >-
          Whether the student completed the academic year or is currently
          enrolled. Mid-year withdrawals are false, which is how consumers drop
          them. Derived on both SIS branches from the enrollment dates against
          the last day of the school year, taken to the year grain.
        data_tests:
          - not_null
      - name: is_out_of_district
        data_type: boolean
        description: >-
          Whether the student is served in an out-of-district placement.
          PowerSchool reads it off an "Out of District" special program. Miami
          derives it from `custom_863`, the IDEA educational environment, and it
          is true for the age 6-21 options that place a student at another
          institution -- correctional facility, center school, public
          residential facility, hospital or homebound, and private school with
          public school services -- which is PowerSchool's out-of-district set
          exactly. Florida's age 3-5 options are excluded, since Miami enrolls
          no pre-K. Every Miami student holds the default option today, so this
          resolves false for every Miami row.
        data_tests:
          - not_null
      - name: homeless_code
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - N
                  - Y1
                  - Y2
        description:
          Homelessness code for the enrollment year — N for not homeless, Y1 for
          homeless while in the physical custody of a parent or legal guardian,
          Y2 for homeless and unaccompanied. For the New Jersey regions, read
          from `stg_powerschool__studentcorefields` for the current academic
          year and from `stg_powerschool__s_nj_ren_x` for closed years. For
          Miami, decoded from the Focus homelessness fields in
          `int_focus__students`, but only for the current academic year --
          closed Miami years still read the NJ re-enrollment extension, which is
          always null for Miami.
      - name: homeless_primary_nighttime_residence_code
        data_type: int64
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]
                quote: false
        description:
          Primary nighttime residence code for the enrollment year — 1 for
          shelters or transitional housing, 2 for doubled-up, 3 for unsheltered,
          4 for hotels or motels. Zero means no selection was made. For the New
          Jersey regions, read from `stg_powerschool__s_nj_stu_x` for the
          current academic year and from `stg_powerschool__s_nj_ren_x` for
          closed years. For Miami, decoded from the Focus homelessness fields in
          `int_focus__students`, but only for the current academic year --
          closed Miami years still read the NJ re-enrollment extension, which is
          always null for Miami.
      - name: student_number
        data_type: int64
        description: |-
          Student Number assigned by the school. Indexed. For Miami, the
          8400-prefixed Focus student id; the bare pre-migration number is no
          longer a join key.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: student_number
            contains_pii: true
            column_role: primary_key
      - name: _dbt_source_relation
        data_type: string
      - name: studentid
        data_type: int64
        description:
          The internal number and ID of the associated Students record.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__storedgrades
            source_column: studentid
            column_role: foreign_key
      - name: students_dcid
        data_type: int64
      - name: reenrollments_dcid
        data_type: int64
      - name: grade_level
        data_type: int64
        description:
          "The grade the student is in. Since this is an integer: 0=Kindergarten
          1, -2=Preschool. Indexed."
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: grade_level
      - name: schoolid
        data_type: int64
        description: The School_Number of the associated Schools record.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: schoolid
      - name: entrydate
        data_type: date
        description:
          The date the student enrolled in school for the current enrollment.
          Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: entrydate
      - name: exitdate
        data_type: date
        description:
          The date the student exited for the current/last enrollment. This is
          the day after a student-attended class. For example, if the last day
          the student is in school is a Wednesday, Thursdayis the exit day.
          Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: exitdate
      - name: entrycode
        data_type: string
        description:
          The code representing how or why the student entered school. These
          codes are stored in Gen Table [6] cat=entrycodes. These are set in
          school setup.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: entrycode
      - name: exitcode
        data_type: string
        description:
          The code representing how or why the student exited the school. These
          codes are stored in Gen Table [6] cat=exitcodes. These are set in
          school setup.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: exitcode
      - name: exitcomment
        data_type: string
        description: Any comments for the student exiting this school.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: exitcomment
      - name: fteid
        data_type: int64
        description:
          The internal number for the FTE with which this record is associated.
          Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: fteid
      - name: state_studentnumber
        data_type: string
        description:
          The state-assigned student number for the student. In most cases, this
          number should stay thesame from school to school.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: state_studentnumber
            contains_pii: true
      - name: first_name
        data_type: string
        description: Students' first name.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: first_name
            contains_pii: true
      - name: middle_name
        data_type: string
        description:
          Student's middle name. PowerSchool for NJ regions; Focus students for
          Miami.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: middle_name
            contains_pii: true
      - name: last_name
        data_type: string
        description: Students last name.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: last_name
            contains_pii: true
      - name: lastfirst
        data_type: string
        description: Last, First, Mi. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: lastfirst
            contains_pii: true
      - name: enroll_status
        data_type: int64
        description: The enrollment status of the student.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: enroll_status
      - name: dob
        data_type: date
        description: Date of birth.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: dob
            contains_pii: true
      - name: street
        data_type: string
        description: Student's street address.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: street
            contains_pii: true
      - name: city
        data_type: string
        description: City element of the students address.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: city
            contains_pii: true
      - name: state
        data_type: string
        description: State element of address.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: state
      - name: zip
        data_type: string
        description: Students zip code.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: zip
            contains_pii: true
      - name: home_phone
        data_type: string
        description: Home phone number for the student. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: home_phone
            contains_pii: true
      - name: fedethnicity
        data_type: int64
        description: >-
          Numerical answer to the question "Is the student Hispanic or Latino?"
          1 = yes, 0 = no. PowerSchool for NJ regions; for Miami, derived from
          the Focus "Ethnicity Hispanic or Latino" select option label.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: fedethnicity
      - name: next_school
        data_type: int64
        description:
          The school the student will be attending the next school year. It is
          likely this will be the sameschool. The information is stored as the
          internal ID on the schools table for that school.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: next_school
      - name: sched_nextyeargrade
        data_type: int64
        description:
          The grade the student is going to be in next year. If the student is
          being retained, this shouldbe the same as the current grade level.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: sched_nextyeargrade
      - name: highest_grade_level_achieved
        data_type: int64
      - name: gender
        data_type: string
        description: M=Male F=Female. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: gender
      - name: ethnicity
        data_type: string
        description:
          Heritage background of a student. The codes assigned here are stored
          in the Gen Table [6]Cat=Ethnicity. These are set in school setup.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: ethnicity
      - name: yearid
        data_type: int64
        description:
          A number representing which year the term belongs to, such as 13 for
          2003-2004. Thenumber is equal to the ID of the year term divided by
          100. Maintained in the Terms table.Required. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__gradeschoolconfig
            source_column: yearid
      - name: academic_year
        data_type: int64
      - name: exit_code_kf
        data_type: string
      - name: exit_code_ts
        data_type: string
      - name: track
        data_type: string
        description:
          A-H or blank. This represents the times of year a student goes to
          school. This is most commonwith year-round schools.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: track
      - name: cohort_primary
        data_type: int64
      - name: rn_all
        data_type: int64
      - name: rn_year
        data_type: int64
      - name: rn_school
        data_type: int64
      - name: grade_level_prev
        data_type: int64
      - name: yearid_prev
        data_type: int64
      - name: rn_undergrad
        data_type: int64
      - name: year_in_school
        data_type: int64
      - name: year_in_network
        data_type: int64
      - name: is_enrolled_oct01
        data_type: boolean
      - name: is_enrolled_oct15
        data_type: boolean
      - name: is_enrolled_mar15
        data_type: boolean
      - name: is_retained_year
        data_type: boolean
      - name: cohort_graduated
        data_type: int64
      - name: is_retained_ever
        data_type: boolean
      - name: boy_status
        data_type: string
      - name: cohort_secondary
        data_type: int64
      - name: entry_schoolid
        data_type: int64
      - name: entry_grade_level
        data_type: int64
      - name: school_name
        data_type: string
      - name: school_abbreviation
        data_type: string
      - name: is_homeless
        data_type: boolean
      - name: advisory_name
        data_type: string
      - name: advisor_teachernumber
        data_type: string
      - name: advisor_lastfirst
        data_type: string
      - name: cohort
        data_type: int64
      - name: is_self_contained
        data_type: boolean
        description: >-
          Whether the student is served in a self-contained classroom. Null for
          Miami: Focus records no placement fact, and the nearest field
          (`ese_fefp_code_label`) encodes Florida funding levels rather than
          placement, so false would assert a verified negative the data cannot
          support. Consumers that filter `not is_self_contained` therefore still
          exclude Miami.
      - name: reporting_schoolid
        data_type: int64
        description: >-
          School the enrollment reports under. Matches `schoolid` unless
          `is_out_of_district` is true, in which case PowerSchool supplies the
          special program's `programid` and Miami supplies the `custom_863`
          option id -- a hospital or a center school has no Florida school
          number to use instead.
      - name: reporting_school_name
        data_type: string
        description: >-
          Name of the school named by `reporting_schoolid`. The real school name
          for an in-district enrollment; for an out-of-district placement, the
          PowerSchool special-program name, or for Miami the decoded
          `custom_863` option label.
      - name: school_level
        data_type: string
        description: >-
          ES, MS or HS for an in-district enrollment, or `OD` when
          `is_out_of_district` is true, matching `reporting_schoolid`.
      - name: _dbt_source_project
        data_type: string
        description: |
          Region prefix extracted from `_dbt_source_relation` via
          `regexp_extract(..., r'(kipp\w+)_')`. Used as a region discriminator
          in downstream surrogate keys, consistent across all upstream union
          tables.
      - name: region
        data_type: string
      - name: code_location
        data_type: string
      - name: advisor_email
        data_type: string
      - name: advisor_phone
        data_type: string
      - name: student_web_id
        data_type: string
        description:
          The generated username for the student, derived from their name and
          birth date. Serves as the student user ID for logging in to
          PowerSchool Parent, and is the local part of their Google Workspace
          address. Populated for every region.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_people__student_logins
            source_column: username
            contains_pii: true
      - name: student_web_password
        data_type: string
        description:
          The generated default password for the student, derived from their
          last name and birth year. Serves as the password for Student_Web_ID
          and as the initial Google Workspace password. Populated for every
          region.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_people__student_logins
            source_column: default_password
            contains_pii: true
      - name: student_email_google
        data_type: string
        description: Conditional on email, google_email, region.
        config:
          meta:
            contains_pii: true
      - name: fleid
        data_type: string
        description:
          Florida Education Identifier, from Focus florida_education_identifier.
          Miami only; the PowerSchool u_studentsuserfields copy is retired.
        config:
          meta:
            contains_pii: true
      - name: newark_enrollment_number
        data_type: string
      - name: infosnap_id
        data_type: string
      - name: infosnap_opt_in
        data_type: string
      - name: media_release
        data_type: string
      - name: rides_staff
        data_type: string
      - name: districtcoderesident
        data_type: string
      - name: referral_date
        data_type: date
      - name: parental_consent_eval_date
        data_type: date
      - name: eligibility_determ_date
        data_type: date
      - name: initial_iep_meeting_date
        data_type: date
      - name: parent_consent_intial_iep_date
        data_type: date
      - name: annual_iep_review_meeting_date
        data_type: date
      - name: reevaluation_date
        data_type: date
      - name: parent_consent_obtain_code
        data_type: string
      - name: initial_process_delay_reason
        data_type: string
      - name: special_education_placement
        data_type: string
      - name: time_in_regular_program
        data_type: string
      - name: early_intervention_yn
        data_type: string
      - name: determined_ineligible_yn
        data_type: string
      - name: counseling_services_yn
        data_type: string
      - name: occupational_therapy_serv_yn
        data_type: string
      - name: physical_therapy_services_yn
        data_type: string
      - name: speech_lang_theapy_services_yn
        data_type: string
      - name: other_related_services_yn
        data_type: string
      - name: lepbegindate
        data_type: date
      - name: lependdate
        data_type: date
      - name: gifted_and_talented
        data_type: string
        description:
          First non-null of the NJ state-extension value, the PowerSchool
          student-user-fields value, and the Focus value for Miami (from
          `int_focus__students`, via `focus_conformed`), defaulting to N when
          none are set.
      - name: lunch_balance
        data_type: float64
      - name: is_504
        data_type: boolean
        description:
          For the New Jersey regions, first non-null of `pid_504_tf`, `is_504`.
          For Miami, `int_focus__students.is_504`, read from the Focus "Section
          504 Eligible" field (custom_621), which is unset for nearly every
          student today. Null means unknown 504 status, not the absence of a
          plan.
      - name: is_fldoe_fte_2
        data_type: boolean
        description: Conditional on region, survey_2.
      - name: is_fldoe_fte_3
        data_type: boolean
        description: Conditional on region, survey_3.
      - name: is_fldoe_fte_all
        data_type: boolean
        description: Conditional on region, survey_2, survey_3.
      - name: special_education_code
        data_type: string
        description:
          Database extension field associated to the Students table. Conditional
          on region, special_education_code, spedlep.
      - name: spedlep
        data_type: string
        description: Database extension field associated to the Students table.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__studentcorefields
            source_column: spedlep
      - name: lep_status
        data_type: boolean
        description: Student Limited English Proficiency status.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__studentcorefields
            source_column: lep_status
      - name: lunch_status
        data_type: string
        description:
          Categorical lunch-status mapping for the New Jersey regions, based on
          academic_year, eligibility_name, is_directly_certified, lunchstatus,
          region, and rn_year -- P for full pay, R for reduced, F for free, E
          for exempt, T for temporary. Null for Miami today -- Focus's meal
          field currently carries only a school-level CEP direct-certification
          code, not an individual determination. The underlying Focus mapping
          (in int_focus__students) resolves to F, R or P as soon as Focus
          records a per-student determination.
      - name: lunch_application_status
        data_type: string
        description:
          "This is the Lunch status copied from the student table. Represents
          the portion of lunch a studentmust pay for: Blank=No status P=Full pay
          R=Reduced F=Free E=Exempt T=Temporary FDC=Free-DC Categorical mapping
          of academic_year, eligibility, eligibility_determination_reason,
          is_directly_certified, lunchstatus, region, rn_year."
      - name: graduation_year
        data_type: int64
        description: Student graduation year.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__studentcorefields
            source_column: graduation_year
      - name: pearson_local_student_identifier
        data_type: int64
        description:
          The student's KIPP `student_number`, used to join NJ Pearson
          state-assessment records, where it is reported as the
          LocalStudentIdentifier.
      - name: is_enrolled_fdos
        data_type: boolean
        description:
          Whether the student was enrolled as of the first day of school.
      - name: advisory_section_number
        data_type: string
        description:
          Identifier for the student's advisory section. For the three New
          Jersey regions, the PowerSchool section number. For Miami, the
          homeroom's college name (KIPP names Miami homerooms after colleges --
          Gonzaga, FAMU, Spelman); the frozen archive instead stored a grade
          digit plus the college name.
      - name: lep_tf
        data_type: int64
        description:
          Raw NJ state-extension LEP flag for the enrollment year. Null outside
          New Jersey.
      - name: liep_parent_refusal_date
        data_type: date
        description:
          Date a parent refused LEP services, from the NJ state extension. Null
          outside New Jersey.
      - name: programtypecode
        data_type: string
        description:
          NJ bilingual/ESL program type code, from the state extension. Null
          outside New Jersey.
      - name: home_language
        data_type: string
        description:
          Home language reported for the student, from the NJ state extension.
          Null outside New Jersey.
      - name: salesforce_contact_id
        data_type: string
        description: Salesforce contact record ID.
        config:
          meta:
            contains_pii: true
      - name: salesforce_contact_college_match_display_gpa
        data_type: numeric
        description: GPA the Salesforce contact displays for college match.
      - name: salesforce_contact_kipp_hs_class
        data_type: int64
        description: KIPP high school class year from the Salesforce contact.
      - name: salesforce_contact_owner_id
        data_type: string
        description: Salesforce user ID of the contact's owner.
      - name: salesforce_contact_owner_name
        data_type: string
        description: Name of the Salesforce contact's owner.
        config:
          meta:
            contains_pii: true
      - name: salesforce_contact_owner_phone
        data_type: string
        description: Phone number of the Salesforce contact's owner.
        config:
          meta:
            contains_pii: true
      - name: salesforce_contact_owner_email
        data_type: string
        description: Email address of the Salesforce contact's owner.
        config:
          meta:
            contains_pii: true
      - name: illuminate_student_id
        data_type: int64
        description:
          Student identifier in Illuminate, matched on the student's
          local_student_id.
        config:
          meta:
            contains_pii: true
      - name: ktc_cohort
        data_type: int64
        description:
          KIPP Through College cohort year -- the Salesforce contact's KIPP HS
          class when present, otherwise the enrollment cohort.
      - name: salesforce_contact_df_has_fafsa
        data_type: string
        description:
          Whether the Salesforce contact has a FAFSA submission on file.
      - name: salesforce_contact_college_match_gpa_band
        data_type: string
        description:
          GPA band for college match, bucketed from
