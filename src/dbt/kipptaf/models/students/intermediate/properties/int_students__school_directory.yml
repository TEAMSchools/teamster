models:
  - name: int_students__school_directory
    description: >
      Which schools offered which grade levels in which academic years, derived
      from enrollment rather than school metadata -- so a school opening,
      closing, merging or adding a grade shows up as rows appearing and
      disappearing, with no open or close date to maintain.

      PowerSchool branch only so far. Miami self-terminates at SY25-26 here
      because its PowerSchool archive is frozen; Focus and Finalsite branches
      are still to come, which is what school_source is for.

      A grade counts as offered if any enrollment row exists for it, active or
      not -- filtering to currently-enrolled students would blank out every
      historic year.

      TODO -- SRE rollover practice, and the change it needs first. At SY27
      rollover, SRE should enter placeholder students in Finalsite assigned to
      every grade level of every school planned for that year, so the incoming
      branch stops depending on a real applicant having been routed to a campus.
      Those ids then go on the finalsite exclude_ids sheet to keep them off the
      FRESH dashboard.

      This does NOT work as the models stand. stg_finalsite__status_report
      applies the exclusion itself, upstream of this model, so placeholder ids
      added to exclude_ids would be filtered out before reaching the directory
      and would show up in neither place. The exclusion has to move down into
      the FRESH models and rpt_gsheets__finalsite__log -- the only other
      consumers of that staging model -- or this branch has to read the four
      per-region sources ahead of the exclusion. Decide that before asking SRE
      to enter anything.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - region
              - ps_schoolid
              - grade_level
    columns:
      - name: _dbt_source_project
        description: >
          Dagster code location owning the row -- kippnewark, kippcamden,
          kippmiami or kipppaterson. Passed through from the enrollment model on
          the two SIS branches; derived from region on the Finalsite branch,
          which has no SIS record to carry it.
        data_tests:
          - not_null
      - name: region
        description: >
          Region name -- Camden, Miami, Newark or Paterson. Matches the region
          values on stg_google_sheets__reporting__terms, so it joins to the
          assessment calendar without translation.
        data_tests:
          - not_null
      - name: academic_year
        description: >
          Academic year the school offered this grade level, as the starting
          calendar year -- 2026 is SY26-27.
        data_tests:
          - not_null
      - name: school_source
        description: >
          Which system is authoritative for the row. Only powerschool today; the
          Focus and Finalsite branches will add values. Downstream consumers
          rank on this -- int_tableau__fresh_enrollment_scaffold prefers a SIS
          row over a Finalsite one when a school has both.
        data_tests:
          - not_null
      - name: schoolid
        description: >
          Network school number, unique across regions. The Focus branch
          projects ps_schoolid, not Focus's internal school id, so both branches
          share one namespace. Excludes 999999, the graduated-students
          placeholder.
      - name: grade_level
        description: >
          Grade level offered at the school that year, with kindergarten as 0.
