models:
  - name: stg_overgrad__universities
    config:
      materialized: table
      contract:
        enforced: true
    columns:
      - name: id
        data_type: int64
        data_tests:
          - unique:
              config:
                severity: error
      - name: ipeds_id
        data_type: int64
      - name: city
        data_type: string
      - name: name
        data_type: string
      - name: object
        data_type: string
      - name: public_school
        description: >-
          Whether Overgrad classifies the institution as publicly controlled.
          Null where Overgrad has not classified it.
        data_type: boolean
      - name: state
        data_type: string
      - name: status
        data_type: string
      - name: university_type
        description: >-
          Overgrad's institution length category: `four_year`, `two_year`, or
          `less_than_two_year`. Null where Overgrad has not categorized it.
        data_type: string
