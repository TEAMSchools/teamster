sources:
  # retired in #5110: kippmiami no longer builds the deanslist package
  - name: kippmiami_deanslist
    description: >-
      Miami's DeansList archive. Miami no longer uses DeansList, so these tables
      are frozen and nothing rebuilds them. The kipptaf unions keep them so
      Miami's behavior history stays queryable. The dataset must not be dropped.
      Declared BQ-native (plain schema, no target branch) so every target reads
      the prod tables directly.
    schema: kippmiami_deanslist
    tables:
      - name: stg_deanslist__behavior
        config:
          meta:
            dagster:
              group: deanslist
              asset_key:
                - kippmiami
                - deanslist
                - stg_deanslist__behavior
      - name: int_deanslist__comm_log
        config:
          meta:
            dagster:
              group: deanslist
              asset_key:
                - kippmiami
                - deanslist
                - int_deanslist__comm_log
      - name: stg_deanslist__incidents
        config:
          meta:
            dagster:
              group: deanslist
              asset_key:
                - kippmiami
                - deanslist
                - stg_deanslist__incidents
      - name: stg_deanslist__terms
        config:
          meta:
            dagster:
              group: deanslist
              asset_key:
                - kippmiami
                - deanslist
                - stg_deanslist__terms
      - name: stg_deanslist__users
        config:
