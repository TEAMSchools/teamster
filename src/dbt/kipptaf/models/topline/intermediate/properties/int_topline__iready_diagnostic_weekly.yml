models:
  - name: int_topline__iready_diagnostic_weekly
    description: >-
      Weekly i-Ready diagnostic proficiency and stretch-growth flags, one row
      per student, discipline and week inside an IREX reporting term in the
      current and prior academic year. A student whose enrollment stint changes
      during a week keeps one row, taken from the stint enrolled on the Monday,
      or the later stint when both are. Feeds int_topline__student_metrics.
    config:
      materialized: table
      meta:
        dagster:
          # table + nightly cron flattens the ~660-stage view-inlined plan of
          # int_topline__student_metrics without eager rebuilds; shares its
          # midnight tick (deps-in-progress guard serializes). Refs #4153
          automation_condition:
            cron_schedule: 0 0 * * *
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
              - week_start_monday
              - discipline
          config:
            severity: error
    columns:
      - name: student_number
        description: KIPP student number of the enrolled student.
        config:
          meta:
            contains_pii: true
      - name: academic_year
        description: Academic year the week belongs to.
      - name: week_start_monday
        description: Monday that opens the week.
      - name: week_end_sunday
        description: Sunday that closes the week.
      - name: discipline
        description: Subject discipline the row reports on (ELA or Math).
      - name: is_proficient
        description:
          1 when the student's diagnostic for the term's test round is
          proficient, 0 when it is not, null when no diagnostic matched.
        config:
          meta:
            contains_pii: true
      - name: is_bfb_stretch_growth_int
        description:
          For students whose baseline diagnostic placed below or far below grade
          level, 1 when progress to annual stretch growth has reached 100
          percent and 0 when it has not. Null for every other student.
        config:
          meta:
            contains_pii: true
