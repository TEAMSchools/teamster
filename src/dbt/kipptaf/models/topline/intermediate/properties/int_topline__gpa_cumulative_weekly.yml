models:
  - name: int_topline__gpa_cumulative_weekly
    description: >-
      Projected unweighted cumulative GPA carried onto the enrollment week
      spine, one row per enrolled student-week for middle and high school in the
      current and prior academic year. The GPA comes from
      snapshot_powerschool__gpa_cumulative, matched to the snapshot version in
      effect at the instant the week closes, so each week reports the freshest
      value known during it. That boundary instant is built in the local
      timezone, and comparing it against the version's validity span as a
      half-open interval resolves every week to exactly one version. Snapshot
      rows captured from developer dev schemas are excluded, because their
      region prefix otherwise matches the join and repeats the week. Feeds
      int_topline__student_metrics, which scores each row against the 3.00 bar.
    config:
      materialized: table
      meta:
        dagster:
          # table + nightly cron flattens the ~660-stage view-inlined plan of
          # int_topline__student_metrics without eager rebuilds; shares its
          # midnight tick (deps-in-progress guard serializes). Refs #4153
          automation_condition:
            cron_schedule: 0 0 * * *
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
              - week_start_monday
          config:
            severity: error
    columns:
      - name: student_number
        description: KIPP student number of the enrolled student.
      - name: academic_year
        description: Academic year the enrollment week belongs to.
      - name: week_start_monday
        description: Monday that opens the enrollment week.
      - name: week_end_sunday
        description:
          Sunday that closes the enrollment week, and the date the snapshot
          boundary instant is built from.
      - name: cumulative_y1_gpa_projected_unweighted
        description:
          Projected unweighted cumulative GPA in effect when the week closed, as
          captured by the snapshot. Null where no snapshot version covers that
          instant.
