models:
  - name: int_topline__iready_lessons_weekly
    description: >-
      Weekly i-Ready personalized-instruction lessons passed and time on task,
      one row per student, discipline and school week in the current and prior
      academic year. A student whose enrollment stint changes during a week
      keeps one row, taken from the stint enrolled on the Monday, or the later
      stint when both are. Feeds int_topline__student_metrics.
    config:
      materialized: table
      meta:
        dagster:
          # table + nightly cron flattens the ~660-stage view-inlined plan of
          # int_topline__student_metrics without eager rebuilds; shares its
          # midnight tick (deps-in-progress guard serializes). Refs #4153
          automation_condition:
            cron_schedule: 0 0 * * *
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
              - week_start_monday
              - discipline
          config:
            severity: error
    columns:
      - name: student_number
        description: KIPP student number of the enrolled student.
        config:
          meta:
            contains_pii: true
      - name: academic_year
        description: Academic year the week belongs to.
      - name: week_start_monday
        description: Monday that opens the week.
      - name: week_end_sunday
        description: Sunday that closes the week.
      - name: discipline
        description: Subject discipline the row reports on (ELA or Math).
      - name: n_lessons_passed_week
        description:
          Personalized-instruction lessons the student passed that week, from
          the weekly i-Ready instruction summary. Null when no weekly summary
          row exists.
        config:
          meta:
            contains_pii: true
      - name: time_on_task_min_week
        description:
          Minutes the student spent on personalized-instruction lessons that
          week. Null when no weekly summary row exists.
        config:
          meta:
            contains_pii: true
