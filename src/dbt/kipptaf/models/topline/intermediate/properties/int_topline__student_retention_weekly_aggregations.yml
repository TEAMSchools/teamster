models:
  - name: int_topline__student_retention_weekly_aggregations
    config:
      enabled: false
      materialized: table
      meta:
        dagster:
          # cron instead of eager: int_students__retention_over_time updates
          # all day, and each rebuild would cascade to
          # rpt_tableau__topline_cascade_dashboard, whose Tableau refresh runs
          # once a day. Same treatment as int_topline__student_metrics (the
          # chain's other table input). Refs #4559
          automation_condition:
            cron_schedule: 30 0 * * *
