  - name: test_contacts_relation_crosswalk
    description:
      A lowercase Finalsite rel_type is rolled up to its nearest Focus value,
      split by the guardian's own gender where gender is present and falling
      back to the non-gendered value otherwise. A value with no Focus equivalent
      becomes None. Based on the fixture shape of test_contacts_two_guardians,
      with twelve guardian rows over one student varying rel_type and the
      guardian's own gender — parent with F/Male/null gender, relative with no
      Focus equivalent, aunt/uncle with F/Male/null (the null case has no
      non-gendered fallback and rolls to None), grandparent with M/null (same
      no-fallback shape), and stepparent with Female/M/null (which DOES have a
      non-gendered fallback of Stepparent). Gender spelling is deliberately
      mixed (`F`/`M` and `Female`/`Male`) across cases to exercise both forms
      the real column carries.
