  - name: test_contacts_phone_junk_and_type
    description:
      A repeated-digit number that survives clean_phone's NANP check is nulled
      here, since clean_phone itself never returns NULL for a non-null input --
      and its type is nulled along with it, since a junk-rejected slot carries
      no contact to guess a type for (not a phantom Cell Phone declaration on an
      empty slot). A real number passes through unchanged and gets its type
      mapped normally. The second guardian has only one phone -- CONTACT2_TYPE
      and CONTACT2_VALUE are both null for that slot, the case that produced
      thousands of phantom type declarations before this fix.
    model: rpt_focus__contacts
    given:
      - input: ref('stg_finalsite__contact_relationships')
        format: sql
