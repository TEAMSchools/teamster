      Emergency and pickup are Y on every row. The first contact per student is
      Y for resides_with_stud and custody; a later contact sharing a household
      with the first is Y, and one with no household overlap is N. Based on the
      fixture shape of test_contacts_relation_crosswalk, with one student and
      three guardian relationships. Aaa sorts first on the existing ranked
      ordering (contact_group, group_rank, last_name), so it is the first
      contact and carries household hh-1. Bbb shares hh-1 with it; Ccc carries
      hh-9, which does not overlap.
