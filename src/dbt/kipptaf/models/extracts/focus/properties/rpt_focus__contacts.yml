models:
  - name: rpt_focus__contacts
    description:
      One row per (student, contact) — guardians plus emergency-contact slots —
      reshaped into the Focus `CONTACTS` SFTP template layout. Fans out guardian
      contact rows from `stg_finalsite__contact_relationships` (adult
      relationship types — parent, guardian, grandparent, stepparent, relative,
      aunt/uncle) inner-joined to `stg_finalsite__contacts` for guardian
      attributes, gated to in-scope students via
      `int_finalsite__enrollment_lifecycle`. The student's Focus id
      (`student_id`) is inner-joined from
      `int_finalsite__contact_id_attributes`, excluding students without a
      minted Focus id. A second join to `stg_finalsite__contacts` on the
      student's own `finalsite_enrollment_id` restricts the feed to guardians of
      students whose own `status` is `enrolled` — the guardian's own status is
      not considered. The address comes from
      `int_finalsite__contact_address_of_record`, resolved from the guardian's
      own household linkage; a guardian whose linkage does not resolve keeps
      their row and gets a null address. Produces 58 columns in
      `CONTACTS_LAYOUT` order. `SORT_ORDER` ranks guardians per student by
      `is_primary desc` so the primary contact sorts first. Emergency contacts
      are appended from the four `emrg_N` slots on
      `int_finalsite__contact_custom_attributes` — they are custom fields on the
      student's own record rather than relationship rows, so the relationship
      filter never sees them. Phone slots `CONTACT1_*` and `CONTACT2_*` map a
      guardian's two phones; an emergency row additionally fills `CONTACT3_*`
      from its third phone. `TYPE` and `VALUE` for `CONTACT4` through `CONTACT7`
      are always null — no branch of this model populates those slots. Every
      slot also carries a `CALLOUT` and an `SMS` flag, both null wherever that
      slot has no phone number (so slots 4 through 7 are always null on both).
      Where a slot has a number, `CALLOUT` is `Y` unless the Finalsite phone
      opt-in for that slot is explicitly false, in which case both `CALLOUT` and
      `SMS` are `N`. Otherwise `SMS` is `N` only for a Work Phone or Workplace
      type, and `Y` in every other case. Guardian phones carry no opt-in signal
      — the Finalsite phone object for guardians has only a type and a number —
      so `CALLOUT`/`SMS` on guardian rows follow only the type-based rule. Focus
      column header casing is applied at transport time via
      `file_config.format.header_replacements`; dbt column names remain
      lowercase snake_case.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_id
              - sort_order
    columns:
      - name: student_relation
        data_type: string
        description:
          Relationship of the contact to the student, crosswalked to the Focus
          STUDENT_RELATION vocabulary. Guardian rows roll their lowercase
          Finalsite rel_type up to the nearest Focus value, split by the
          guardian's own gender where gender is populated. Emergency rows carry
          the Finalsite emrg_N relationship label through the same crosswalk and
          have no gender to split on. Anything without a Focus equivalent
          becomes None.
        data_tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values:
                  - Mother
                  - Father
                  - Parent
                  - Guardian
                  - Grandmother
                  - Grandfather
                  - Aunt
                  - Uncle
                  - Stepfather
                  - Stepmother
                  - Stepparent
                  - Surrogate
                  - None
              config:
                severity: error
      - name: student_id
        data_type: string
        description:
          Focus student id of the student this contact belongs to, from
          `int_finalsite__contact_id_attributes.focus_student_id_prefixed`. Rows
          for students without a minted Focus id are excluded from this extract.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: sort_order
        data_type: int64
        description:
          Ordinal rank of this contact within the student. Guardian rows come
          first, ordered by `is_primary desc` then last and first name, with
          `relationship_id` as a stable tiebreak; emergency-slot rows follow in
          `emrg_1` through `emrg_4` order. KIPP Miami populates no
          `emrg_N_priority_ss`, so emergency rows are not interleaved by
          priority.
        data_tests:
          - not_null
      - name: first_name
        data_type: string
        description:
          Guardian's first name from their Finalsite contact record on guardian
          rows; the emergency contact's first name (`emrg_N_name_first_name`) on
          emergency rows.
        data_tests:
          - not_null
      - name: last_name
        data_type: string
        description:
          Guardian's last name from their Finalsite contact record on guardian
          rows; the emergency contact's last name (`emrg_N_name_last_name`) on
          emergency rows.
        data_tests:
          - not_null
      - name: contact1_type
        data_type: string
        description:
          Phone type for the first contact slot, mapped to the Focus display
          vocabulary. A blank or unrecognized Finalsite type defaults to Cell
          Phone rather than dropping the contact, but only when the slot carries
          a number — null when the slot has none (including when CONTACT1_VALUE
          was junk-rejected).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Cell Phone
                  - Home Phone
                  - Work Phone
                  - Workplace
                  - Alternate Phone
              config:
                severity: error
      - name: contact2_type
        data_type: string
        description:
          Phone type for the second contact slot, mapped to the Focus display
          vocabulary. A blank or unrecognized Finalsite type defaults to Cell
          Phone rather than dropping the contact, but only when the slot carries
          a number — null when the slot has none (including when CONTACT2_VALUE
          was junk-rejected).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Cell Phone
                  - Home Phone
                  - Work Phone
                  - Workplace
                  - Alternate Phone
              config:
                severity: error
      - name: contact3_type
        data_type: string
        description:
          Phone type for the third contact slot, mapped to the Focus display
          vocabulary. A blank or unrecognized Finalsite type defaults to Cell
          Phone rather than dropping the contact, but only when the slot carries
          a number — null when the slot has none (including when CONTACT3_VALUE
          was junk-rejected).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Cell Phone
                  - Home Phone
                  - Work Phone
                  - Workplace
                  - Alternate Phone
              config:
                severity: error
      - name: middle_name
        data_type: string
        description:
          Guardian's middle name from their Finalsite contact record on guardian
          rows. On emergency rows, sourced from `emrg_1_name_middle_name` /
          `emrg_2_name_middle_name` — the `emrg_3` and `emrg_4` slots have no
          middle-name field in the Finalsite pivot, so this column is always
          null for those rows.
      - name: resides_with_stud
        data_type: string
        description:
          Y when this contact is the student's first contact by SORT_ORDER, or
          shares a Finalsite household with that first contact. N otherwise,
          including when household membership is unknown on either side.
      - name: custody
        data_type: string
        description:
          Same rule as RESIDES_WITH_STUD — Y for the student's first contact by
          SORT_ORDER or any later contact sharing a household with it, N
          otherwise.
      - name: emergency
        data_type: string
        description:
          Always Y. Every contact in this feed is treated as an emergency
          contact (#4769 decision G).
      - name: pickup
        data_type: string
        description:
          Always Y. Every contact in this feed is authorized for pickup (#4769
          decision G). Note this overwrites the emergency branch's own
          `emrg_N_pickup_yn` field, not the phone opt-in signal — no contact
          currently has `emrg_N_pickup_yn` explicitly false, so this overwrites
          nothing today.
      - name: address
        data_type: string
        description:
          Line 1 of the guardian's resolved address from
          `int_finalsite__contact_address_of_record` on guardian rows. A
          guardian linked to several households gets the most complete one, not
          just the one that resolves unambiguously — null means only that none
          of the guardian's households carries a street line. The row is still
          sent either way. Always null on emergency rows for a different reason
          — emergency contacts are custom fields on the student's record with no
          household in Finalsite, so there is no address to resolve.
      - name: address2
        data_type: string
        description:
          Line 2 (apartment or unit) of the guardian's resolved address on
          guardian rows. Legitimately null when the household has no unit line,
          and null whenever the address is unresolved. Always null on emergency
          rows — emergency contacts have no household in Finalsite to resolve an
          address from.
      - name: city
        data_type: string
        description:
          City of the guardian's resolved address on guardian rows. Null when
          unresolved, and possibly null on a resolved but incomplete address.
          Always null on emergency rows — emergency contacts have no household
          in Finalsite to resolve an address from.
      - name: state
        data_type: string
        description:
          State of the guardian's resolved address on guardian rows. Null when
          unresolved, and possibly null on a resolved but incomplete address.
          Always null on emergency rows — emergency contacts have no household
          in Finalsite to resolve an address from.
      - name: zipcode
        data_type: string
        description:
          ZIP code of the guardian's resolved address on guardian rows. Null
          when unresolved, and possibly null on a resolved but incomplete
          address. Always null on emergency rows — emergency contacts have no
          household in Finalsite to resolve an address from.
      - name: email
        data_type: string
        description:
          Guardian's email address from their Finalsite contact record on
          guardian rows; the emergency contact's email (`emrg_N_email`) on
          emergency rows.
      - name: contact1_value
        data_type: string
        description:
          Number of the guardian's first phone (`phone_1_number`) on guardian
          rows; the emergency contact's first phone number
          (`emrg_N_phone_1_number`) on emergency rows. Repeated-digit
          placeholder numbers that survive clean_phone's NANP validation are
          nulled here.
      - name: contact1_blocked
        data_type: string
        description:
          Block flag for first phone; not sourced from Finalsite — always null.
      - name: contact1_unlisted
        data_type: string
        description:
          Unlisted flag for first phone; not sourced from Finalsite — always
          null.
      - name: contact1_callout
        data_type: string
        description:
          Callout flag for first phone. Null when the slot is empty. N when the
          Finalsite phone opt-in for this slot (emergency rows only) is
          explicitly false, honoring a recorded refusal of phone contact — Y
          otherwise. Guardian rows carry no opt-in signal, so this is always Y
          when CONTACT1_VALUE carries a number.
      - name: contact1_sms
        data_type: string
        description:
          SMS opt-in flag for first phone. Null when CONTACT1_VALUE is empty. N
          when the Finalsite phone opt-in for this slot (emergency rows only) is
          explicitly false, or when CONTACT1_TYPE is Work Phone or Workplace; Y
          otherwise. Guardian rows carry no opt-in signal, so only the type rule
          applies to them.
      - name: contact2_value
        data_type: string
        description:
          Number of the guardian's second phone (`phone_2_number`) on guardian
          rows; the emergency contact's second phone number
          (`emrg_N_phone_2_number`) on emergency rows. Repeated-digit
          placeholder numbers that survive clean_phone's NANP validation are
          nulled here.
      - name: contact2_blocked
        data_type: string
        description:
          Block flag for second phone; not sourced from Finalsite — always null.
      - name: contact2_unlisted
        data_type: string
        description:
          Unlisted flag for second phone; not sourced from Finalsite — always
          null.
      - name: contact2_callout
        data_type: string
        description:
          Callout flag for second phone. Null when the slot is empty. N when the
          Finalsite phone opt-in for this slot (emergency rows only) is
          explicitly false, honoring a recorded refusal of phone contact — Y
          otherwise. Guardian rows carry no opt-in signal, so this is always Y
          when CONTACT2_VALUE carries a number.
      - name: contact2_sms
        data_type: string
        description:
          SMS opt-in flag for second phone. Null when CONTACT2_VALUE is empty. N
          when the Finalsite phone opt-in for this slot (emergency rows only) is
          explicitly false, or when CONTACT2_TYPE is Work Phone or Workplace; Y
          otherwise. Guardian rows carry no opt-in signal, so only the type rule
          applies to them.
      - name: contact3_value
        data_type: string
        description:
          Number of the emergency contact's third phone
          (`emrg_N_phone_3_number`). Null on guardian rows for a different
          reason -- guardians carry two phones. Repeated-digit placeholder
          numbers that survive clean_phone's NANP validation are nulled here
          too.
      - name: contact3_blocked
        data_type: string
        description:
          Block flag for third contact slot; not sourced from Finalsite — always
          null.
      - name: contact3_unlisted
        data_type: string
        description:
          Unlisted flag for third contact slot; not sourced from Finalsite —
          always null.
      - name: contact3_callout
        data_type: string
        description:
          Callout flag for third contact slot. Null when the slot is empty
          (always the case on guardian rows, which never populate CONTACT3). N
          when the Finalsite phone opt-in for this slot is explicitly false,
          honoring a recorded refusal of phone contact — Y otherwise.
      - name: contact3_sms
        data_type: string
        description:
          SMS opt-in flag for third contact slot. Null when CONTACT3_VALUE is
          empty (always the case on guardian rows). N when the Finalsite phone
          opt-in for this slot is explicitly false, or when CONTACT3_TYPE is
          Work Phone or Workplace; Y otherwise.
      - name: contact4_type
        data_type: string
        description:
          Type label for fourth contact slot; not sourced from Finalsite —
          always null.
      - name: contact4_value
        data_type: string
        description:
          Number for fourth contact slot; not sourced from Finalsite — always
          null.
      - name: contact4_blocked
        data_type: string
        description:
          Block flag for fourth contact slot; not sourced from Finalsite —
          always null.
      - name: contact4_unlisted
        data_type: string
        description:
          Unlisted flag for fourth contact slot; not sourced from Finalsite —
          always null.
      - name: contact4_callout
        data_type: string
        description:
          Callout flag for fourth contact slot; not sourced from Finalsite —
          always null. The slot is never populated, so there is no phone number
          to gate the flag on.
      - name: contact4_sms
        data_type: string
        description:
          SMS opt-in flag for fourth contact slot; not sourced from Finalsite —
          always null, for the same reason as CONTACT4_CALLOUT.
      - name: contact5_type
        data_type: string
        description:
          Type label for fifth contact slot; not sourced from Finalsite — always
          null.
      - name: contact5_value
        data_type: string
        description:
          Number for fifth contact slot; not sourced from Finalsite — always
          null.
      - name: contact5_blocked
        data_type: string
        description:
          Block flag for fifth contact slot; not sourced from Finalsite — always
          null.
      - name: contact5_unlisted
        data_type: string
        description:
          Unlisted flag for fifth contact slot; not sourced from Finalsite —
          always null.
      - name: contact5_callout
        data_type: string
        description:
          Callout flag for fifth contact slot; not sourced from Finalsite —
          always null. The slot is never populated, so there is no phone number
          to gate the flag on.
      - name: contact5_sms
        data_type: string
        description:
          SMS opt-in flag for fifth contact slot; not sourced from Finalsite —
          always null, for the same reason as CONTACT5_CALLOUT.
      - name: contact6_type
        data_type: string
        description:
          Type label for sixth contact slot; not sourced from Finalsite — always
          null.
      - name: contact6_value
        data_type: string
        description:
          Number for sixth contact slot; not sourced from Finalsite — always
          null.
      - name: contact6_blocked
        data_type: string
        description:
          Block flag for sixth contact slot; not sourced from Finalsite — always
          null.
      - name: contact6_unlisted
        data_type: string
        description:
          Unlisted flag for sixth contact slot; not sourced from Finalsite —
          always null.
      - name: contact6_callout
        data_type: string
        description:
          Callout flag for sixth contact slot; not sourced from Finalsite —
          always null. The slot is never populated, so there is no phone number
          to gate the flag on.
      - name: contact6_sms
        data_type: string
        description:
          SMS opt-in flag for sixth contact slot; not sourced from Finalsite —
          always null, for the same reason as CONTACT6_CALLOUT.
      - name: contact7_type
        data_type: string
        description:
          Type label for seventh contact slot; not sourced from Finalsite —
          always null.
      - name: contact7_value
        data_type: string
        description:
