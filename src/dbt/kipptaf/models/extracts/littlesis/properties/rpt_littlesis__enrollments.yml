models:
  - name: rpt_littlesis__enrollments
    description: >-
      Section enrollments for LittleSIS. Network-wide, Miami included, and
      already served by an explicit Focus branch rather than the PowerSchool leg
      -- Miami held 13,425 rows in prod as of 2026-08-27. The `not
      sec.is_dropped_section` filter applies only to the PowerSchool leg.
      Ratified on #4996.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - section_id
              - student_id
          config:
            severity: error
    columns:
      - name: school_id
        data_type: int64
      - name: course_id
        data_type: string
      - name: section_id
        data_type: int64
      - name: term_id
        data_type: int64
      - name: section_number
        data_type: string
      - name: period
        data_type: string
      - name: room
        data_type: string
      - name: student_id
        data_type: int64
      - name: student_gsuite_email
        data_type: string
      - name: school_name
        data_type: string
      - name: teacher_gsuite_email
        data_type: string
      - name: class_name
        data_type: string
