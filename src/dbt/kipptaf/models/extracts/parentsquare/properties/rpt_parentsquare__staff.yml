models:
  - name: rpt_parentsquare__staff
    description:
      ParentSquare `staff.csv` for KIPP Newark — one row per (Operations leader,
      school). Membership is the hand-curated `TS-DL-Regional Ops Leaders`
      distribution list, scoped to active Newark regional-office Operations
      staff, which is the user population the Integration Planner designates —
      no school staff and no teachers. Sourcing from the group rather than a
      hardcoded list of individuals means Ops owns the roster and it tracks role
      changes without a code change; no job-title or job-function rule
      reproduces the same set. Each leader is emitted once per operating school
      because ParentSquare's staff file is per-school and a staff member may
      appear at more than one, which is what grants them school-level access
      everywhere and what makes every `rpt_parentsquare__sections.staff_id`
      resolve at its own school. No district-office row is emitted — the schools
      feed carries only the twelve operating schools, so a `school_id` of 0
      would have nothing to match.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - school_id
              - staff_id
          config:
            severity: error
    columns:
      - name: staff_id
        data_type: string
        description:
          The leader's employee number as a string — stable, unique per person,
          and free of spaces as ParentSquare requires. Repeats across the
          schools a leader is assigned to, which the spec permits.
        data_tests:
          - not_null
      - name: school_id
        data_type: string
        description:
          PowerSchool `school_number` as a string. Matches a
          `rpt_parentsquare__schools` row.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_parentsquare__schools')
                field: school_id
              config:
                severity: error
      - name: email
        data_type: string
        description:
          The leader's KIPP Google account. ParentSquare requires an email or a
          phone to sync a staff user, and the Integration Planner sets access
          via the KIPP Google account, so this is the field ParentSquare matches
          the user on.
        config:
          meta:
            contains_pii: true
      - name: title
        data_type: string
        description: The leader's job title as recorded on the staff roster.
      - name: first_name
        data_type: string
        description: The leader's given name.
        config:
          meta:
            contains_pii: true
      - name: last_name
        data_type: string
        description: The leader's family name.
        config:
          meta:
            contains_pii: true
