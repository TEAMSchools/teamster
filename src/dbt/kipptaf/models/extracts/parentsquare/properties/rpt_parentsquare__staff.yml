models:
  - name: rpt_parentsquare__staff
    description:
      ParentSquare `staff.csv` for the KIPP NJ regions — one row per (Operations
      leader, operating school in that leader's own region). Each district's
      thin `extracts/parentsquare` wrapper slices this to its own
      `code_location`, and that wrapper is what ParentSquare receives.
      Membership is the hand-curated `TS-DL-Regional Ops Leaders` distribution
      list, scoped to active regional-office Operations staff, which is the user
      population the Integration Planner designates — no school staff and no
      teachers. Sourcing from the group rather than a hardcoded list of
      individuals means Ops owns the roster and it tracks role changes without a
      code change; no job-title or job-function rule reproduces the same set.
      Each leader is emitted once per operating school in their own region
      because ParentSquare's staff file is per-school and a staff member may
      appear at more than one, which is what grants them school-level access
      everywhere and what makes every `rpt_parentsquare__sections.staff_id`
      resolve at its own school. The region-keyed join is what keeps a leader
      out of another region's file. No district-office row is emitted — the
      schools feed carries only operating schools, so a `school_id` of 0 would
      have nothing to match.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - school_id
              - staff_id
          config:
            severity: error
    columns:
      - name: staff_id
        data_type: string
        description:
          The leader's employee number as a string — stable, unique per person,
          and free of spaces as ParentSquare requires. Repeats across the
          schools a leader is assigned to, which the spec permits.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: school_id
        data_type: string
        description:
          PowerSchool `school_number` as a string. Matches a
          `rpt_parentsquare__schools` row.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('rpt_parentsquare__schools')
                field: school_id
              config:
                severity: error
      - name: code_location
        data_type: string
        description:
          Dagster code location of the region this row belongs to — the leader's
          `home_work_location_dagster_code_location`, which also scopes the
          school fan-out. Present so each district's thin
          `extracts/parentsquare` wrapper can slice the feed to its own region;
          it is not part of the ParentSquare file and no wrapper projects it.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: email
        data_type: string
        description:
          The leader's KIPP Google account, from the staff roster's
          `google_email` — the @apps.teamschools.org address, not the
          @kippnj.org / @kippteamandfamily.org one on `mail`. ParentSquare
          requires an email or a phone to sync a staff user and these users
          authenticate through Google, so this is the field ParentSquare matches
          the user on. This feed emits no phone column, so a null here means an
          unusable staff row.
        data_tests:
          # `google_email` is nullable on the roster, and since membership comes
          # from a mutable Ops-owned group a leader can be added without one. Fail
          # loudly rather than drop the row: unlike the parent and emergency
          # feeds, silently dropping a leader would remove someone's access with
          # no signal, and a leader with no KIPP Google account cannot use
          # ParentSquare at all — that is an Ops data fix, not a row to discard.
          # It also protects the section owner, which is picked from this feed.
          - not_null:
              config:
                severity: error
        config:
          meta:
            contains_pii: true
      - name: title
        data_type: string
        description: The leader's job title as recorded on the staff roster.
      - name: first_name
        data_type: string
        description: The leader's given name.
        config:
          meta:
            contains_pii: true
      - name: last_name
        data_type: string
        description: The leader's family name.
        config:
          meta:
            contains_pii: true
