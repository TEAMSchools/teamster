models:
  - name: rpt_parentsquare__rosters
    description:
      ParentSquare `rosters.csv` for KIPP Newark — one row per enrolled student,
      placing them in their school-and-grade section. Together with
      `rpt_parentsquare__sections` this satisfies ParentSquare's roster
      requirement at the school-and-grade granularity the Integration Planner
      specified, without any teacher-classroom data. Both models read the same
      enrollment filter and build `section_id` the same way, so every row
      resolves to a section by construction; the relationships tests below
      enforce that rather than assume it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - section_id
              - student_id
          config:
            severity: error
    columns:
      - name: student_id
        data_type: string
        description:
          PowerSchool `student_number` as a string. Matches a
          `rpt_parentsquare__students` row.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_parentsquare__students')
                field: student_id
              config:
                severity: error
      - name: section_id
        data_type: string
        description:
          The student's school-and-grade section. Matches a
          `rpt_parentsquare__sections` row.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_parentsquare__sections')
                field: section_id
              config:
                severity: error
      - name: school_id
        data_type: string
        description:
          PowerSchool `school_number` as a string. Matches a
          `rpt_parentsquare__schools` row.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_parentsquare__schools')
                field: school_id
              config:
                severity: error
