models:
  - name: rpt_parentsquare__rosters
    description:
      ParentSquare `rosters.csv` for the KIPP NJ regions — one row per enrolled
      student, placing them in their school-and-grade section. Each district's
      thin `extracts/parentsquare` wrapper slices this to its own
      `code_location`, and that wrapper is what ParentSquare receives. Together
      with `rpt_parentsquare__sections` this satisfies ParentSquare's roster
      requirement at the school-and-grade granularity the Integration Planner
      specified, without any teacher-classroom data. Both models read the same
      enrollment filter and build `section_id` the same way, so every row
      resolves to a section by construction; the relationships tests below
      enforce that rather than assume it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - section_id
              - student_id
          config:
            severity: error
    columns:
      - name: student_id
        data_type: string
        description:
          PowerSchool `student_number` as a string. Matches a
          `rpt_parentsquare__students` row.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('rpt_parentsquare__students')
                field: student_id
              config:
                severity: error
      - name: section_id
        data_type: string
        description:
          The student's school-and-grade section. Matches a
          `rpt_parentsquare__sections` row.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('rpt_parentsquare__sections')
                field: section_id
              config:
                severity: error
      - name: school_id
        data_type: string
        description:
          PowerSchool `school_number` as a string. Matches a
          `rpt_parentsquare__schools` row.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('rpt_parentsquare__schools')
                field: school_id
              config:
                severity: error
      - name: code_location
        data_type: string
        description:
          Dagster code location of the region this row belongs to. Present so
          each district's thin `extracts/parentsquare` wrapper can slice the
          feed to its own region; it is not part of the ParentSquare file and no
          wrapper projects it.
        data_tests:
          - not_null:
              config:
                severity: error
