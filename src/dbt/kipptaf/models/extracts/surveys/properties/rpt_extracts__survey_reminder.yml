models:
  - name: rpt_extracts__survey_reminder
    description:
      One row per staff email with at least one incomplete survey in a round
      that is open now, for the current academic year. Feeds the survey reminder
      list. Gallup Q12 and TNTP Insight are excluded upstream in
      rpt_tableau__survey_completion.
    columns:
      - name: email
        data_type: string
        description:
          Work email of a staff member who has not completed a current survey
          round.
        config:
          meta:
            contains_pii: true
        data_tests:
          - unique
