models:
  - name: int_tableau__finalsite_student_scaffold
    config:
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - enrollment_academic_year
              - finalsite_id
              - enrollment_type
              - grouped_status_timeframe
              - goal_name
              - goal_type
          config:
            severity: error
    columns:
      - name: enrollment_academic_year
        data_type: int64
        description: >-
          The Finalsite recruitment cycle this record belongs to, in start-year
          form (AY2026-2027 = 2026). Scoped to the finalsite_recruitment_year
          variable, not current_academic_year.
      - name: enrollment_academic_year_display
        data_type: string
        description: >-
          The same cycle in hyphenated short form for reporting labels, e.g.
          "2026-27".
      - name: org
        data_type: string
        description: Always "KTAF" (verified constant, network-wide).
      - name: region
        data_type: string
        description: One of "Newark", "Camden", "Miami", "Paterson".
      - name: schoolid
        data_type: int64
        description: >-
          PowerSchool-space school id the student is assigned to in Finalsite,
          resolved from the free-text assigned_school through
          int_people__location_crosswalk. 0 when Finalsite has no school
          assigned.
      - name: school
        data_type: string
        description: >-
          Short school abbreviation for schoolid, from the same crosswalk. "No
          School Assigned" when Finalsite has none.
      - name: finalsite_id
        data_type: string
        description: >-
          Finalsite enrollment id -- the grain of this model together with
          enrollment_academic_year, and the key downstream QC joins on.
        config:
          meta:
            contains_pii: true
      - name: powerschool_student_number
        data_type: int64
        description: >-
          Student number as reported by Finalsite, used to match against the SIS
          enrollment record. Null for applicants with no SIS identity yet.
        config:
          meta:
            contains_pii: true
      - name: first_name
        data_type: string
        description: Student first name, initcapped in the finalsite package.
        config:
          meta:
            contains_pii: true
      - name: last_name
        data_type: string
        description: Student last name.
        config:
          meta:
            contains_pii: true
      - name: grade_level
        data_type: int64
        description: >-
          Grade level as reported by Finalsite, decoded to an integer in the
          finalsite package (PK = -1, K = 0, 1-12 as themselves). Compared
          against sis_grade_level to produce is_grade_level_mismatch.
      - name: enroll_status
        data_type: int64
        description: >-
          Enrollment status from the matched SIS enrollment record (PowerSchool,
          or Focus for Miami) -- 0 currently enrolled, 2 withdrawn, 3 graduated.
          Null when no SIS record matched, which is the case
          is_missing_sis_record covers downstream. Distinct from
          finalsite_expected_enroll_status, which is derived from Finalsite
          rather than read from the SIS. Exposed as sis_enroll_status on
          rpt_tableau__fresh_dashboard_qc, where the pairing needs to be
          explicit; kept as enroll_status here because the other two
          fresh_dashboard views expose it under that name.
      - name: gender
        data_type: string
        description: Student gender as recorded in Finalsite.
        config:
          meta:
            contains_pii: true
      - name: birthdate
        data_type: date
        description: Student date of birth as recorded in Finalsite.
        config:
          meta:
            contains_pii: true
      - name: self_contained
        data_type: string
        description: >-
          Finalsite self-contained special-education indicator. Values are mixed
          in the source -- "Yes", "No", and a literal "false" -- so treat it as
          a label rather than a clean boolean.
      - name: enrollment_type
        data_type: string
        description: >-
          "New" or "Returning" -- whether Finalsite is recruiting this student
          into the network or re-enrolling them. Part of this model's grain, and
          what valid_detailed_status on the crosswalk is scoped against.
      - name: is_enrolled_fdos
        data_type: boolean
        description: >-
          True when the matched SIS enrollment record has the student enrolled
          on the first day of school. Sourced from the SIS side, so it reflects
          PowerSchool's or Focus's own calculation rather than anything
          Finalsite reports. Known caveat -- Focus computes this against a
          single network-wide first day per school year, so Miami schools that
          start later than the earliest one report false for nearly every
          student. See docs/models/fresh-dashboard-data-model.md.
      - name: is_enrolled_oct01
        data_type: boolean
        description: >-
          True when the matched SIS enrollment record covers October 1 of the
          enrollment year.
      - name: is_enrolled_oct15
        data_type: boolean
        description: >-
          True when the matched SIS enrollment record covers October 15 of the
          enrollment year.
      - name: is_enrolled_mar15
        data_type: boolean
        description: >-
          True when the matched SIS enrollment record covers March 15 of the
          enrollment year.
      - name: latest_status
        data_type: string
        description: >-
          The student's most recent Finalsite status for this cycle, picked per
          enrollment by status date then status rank. This is the single value
          the dashboard treats as "where the student is now", and what
          finalsite_expected_enroll_status is derived from.
      - name: is_same_day_status_tie
        data_type: boolean
        description: >-
          True when a student has more than one distinct Finalsite status set on
          the same calendar day. Computed in same_day_duplicate_flags (in the
          model SQL) directly off int_finalsite__status_report_unpivot, before
          the crosswalk join fans a single detailed_status out to multiple
          status_group_value rows (by design) -- counting after that fan-out
          inflated this flag from a handful of genuine same-day duplicates to
          ~30% of enrollments, verified empirically. Also deduplicates a same
          (enrollment, status, date) recurring under more than one loaded
          _dagster_partition_key.
      - name: aligned_enrollment_type
        data_type: string
        description: >-
          Always "All" today. Exists so goal rows that apply regardless of New
          vs Returning can join without duplicating per enrollment_type.
      - name: grouped_status_timeframe
        data_type: string
        description: >-
          "Current" for the student's status as it stands now, or "Ever" for a
          status they passed through at any point. Funnel goal types (Inquiries,
          Applications, Offers, Assigned School, Accepted, Conversion) are
          counted "Ever"; everything else is counted "Current".
      - name: goal_name
        data_type: string
        description: >-
          The specific goal this row counts toward, from the status_crosswalk
          goal-group mapping. See docs/models/fresh-dashboard-data-model.md for
          the full glossary.
      - name: goal_type
        data_type: string
        description: >-
          The funnel bucket this row counts toward -- Inquiries, Applications,
          Offers, Accepted, Waitlisted, Deferred, Enrolled, Conversion and the
          rest. A single Finalsite status fans out to several goal_type rows by
          design, which is why this model's grain includes it.
      - name: days_in_grouped_status
        data_type: int64
        description: >-
          Days the student has been in the current grouped status, inclusive --
          a status set and ended on the same day counts as 1 rather than 0.
          Feeds the Pending Offers day-bucket splits on the dashboard.
      - name: finalsite_expected_enroll_status
        data_type: int64
        description: >-
          Enrollment status implied by the Finalsite latest_status (0 =
          Enrolled, 1 = Mid Year Withdrawal/Never Attended/Summer Withdraw), for
          comparison against the SIS's actual enroll_status. Derived entirely
          from Finalsite -- it reads nothing from the SIS, and states what the
          SIS ought to show if Finalsite is correct.
      - name: sis_grade_level
        data_type: int64
        description: >-
          Grade level from the matched SIS enrollment record (PowerSchool, or
          Focus for Miami), for comparison against the Finalsite-reported
          grade_level.
      - name: sis_school
        data_type: string
        description: >-
          School name from the matched SIS enrollment record (PowerSchool, or
          Focus for Miami).
      - name: sis_schoolid
        data_type: int64
        description: >-
          School ID from the matched SIS enrollment record (PowerSchool, or
          Focus for Miami), for comparison against schoolid.
      - name: is_enroll_status_mismatch
        data_type: boolean
        description: >-
          True when finalsite_expected_enroll_status disagrees with the SIS's
          actual enroll_status -- Finalsite says enrolled while the SIS says
          withdrawn or graduated, or Finalsite says withdrawn while the SIS says
          currently enrolled.
      - name: is_grade_level_mismatch
        data_type: boolean
        description: >-
          True when the Finalsite-reported grade_level differs from the SIS's
          sis_grade_level. Null rather than true when no SIS record matched,
          since it is a plain inequality comparison.
      - name: is_school_mismatch
        data_type: boolean
        description: >-
          True when the Finalsite-reported schoolid differs from the SIS's
          sis_schoolid. Null rather than true when no SIS record matched, since
          it is a plain inequality comparison.
