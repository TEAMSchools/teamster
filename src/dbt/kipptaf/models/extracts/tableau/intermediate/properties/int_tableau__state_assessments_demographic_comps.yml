models:
  - name: int_tableau__state_assessments_demographic_comps
    description: >
      KTAF's own proficiency counts, shaped to sit beside the state, city and
      neighborhood comparison figures on the state assessment dashboard.
      Student-level Spring scores (grade 3 and up, academic year 2018 onward)
      are joined to each student's first enrollment row of the year for
      demographics, then aggregated with GROUPING SETS. One row per academic
      year, district_state, assessment_name and test_code, crossed with region
      (kept or rolled up) and either no demographic (the total) or exactly one
      of gender, aggregate ethnicity, lunch status, ML status or IEP status.
      Three score sources feed it. NJ official scores come from
      int_assessments__state_scores. NJ preliminary scores come from
      int_pearson__student_list_report (2024 onward) and are included only for
      an assessment and year that has no Spring rows yet in
      int_assessments__state_nj_scores, so the branch switches itself off once
      official scores land. FL official scores come from
      int_assessments__state_scores for Miami. No row is student-level, but a
      region, test code and demographic cell can be very small, and nothing here
      suppresses small cells.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - district_state
              - region
              - assessment_name
              - test_code
              - comparison_entity
              - comparison_demographic_group
              - comparison_demographic_subgroup
    columns:
      - name: academic_year
        data_type: int64
        description: School year in which the assessment was administered.
      - name: district_state
        data_type: string
        description: KTAF district-state label (e.g. KTAF NJ, KTAF FL).
      - name: region
        data_type: string
        description: >
          KIPP region (Camden, Newark, Paterson, Miami). NULL when this row
          represents the district-level rollup across all regions.
      - name: assessment_name
        data_type: string
        description:
          Top-level assessment program name (e.g. NJSLA, NJGPA, NJSLA Science).
      - name: test_code
        data_type: string
        description: >
          Aligned subject-and-grade test code (e.g. ELA03, MAT08, ELAGP). ALG01
          is not split by school level, so one row can hold students from
          several school levels. ELA11 is excluded from NJ official scores: it
          appeared in Spring 2019 (academic_year = 2018) data but was not a
          recognized NJSLA test code and NJ published no comparison benchmarks
          for it.
      - name: total_proficient_students
        data_type: float64
        description: >-
          Number of scored results at or above proficient in the group, computed
          as the proficient share times total_students and rounded to a whole
          number.
      - name: total_students
        data_type: int64
        description: >-
          Number of scored student results in the group (student-test rows, not
          distinct students).
      - name: percent_proficient
        data_type: float64
        description:
          Share of scored results in the group at or above proficient, 0 to 1.
      - name: focus_level
        data_type: string
        description: >
          Which demographic dimension is active in this GROUPING SET row
          (gender, aggregate_ethnicity, lunch_status, ml_status, iep_status).
          'all_null' when all demographic dimensions are rolled up (Total row).
      - name: comparison_demographic_group
        data_type: string
        description: >
          Broad category label for the active demographic dimension (Total,
          Gender, Aggregate Ethnicity, Subgroup).
      - name: comparison_demographic_subgroup
        data_type: string
        description: >
          Specific demographic value for the active dimension (e.g. All
          Students, Female, African American, Economically Disadvantaged, ML,
          Students With Disabilities).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - African American
                  - Asian
                  - American Indian
                  - Hispanic
                  - Native Hawaiian
                  - Other
                  - White
                  - Blank
              config:
                severity: warn
                where: comparison_demographic_group = 'Aggregate Ethnicity'
      - name: comparison_entity
        data_type: string
        description: >
          'Region' when the row is scoped to a specific region; the
          district_state value (e.g. KTAF NJ) when region is rolled up to the
          district level.
      - name: school_level
        data_type: string
        description: >-
          School level (ES, MS, HS) from the state test comparison sheet,
          matched on test_code and each student's school level (with fixed
          overrides for Hatch grades 3 and 4 in 2021-2023 and PPES grade 5 in
          2023). The model takes any one value per group, so a test code taken
          at more than one school level (ALG01) reports an arbitrary one.
      - name: grade_range_band
        data_type: string
        description: >-
          Grade range (e.g. 3-5, 6-8) from the state test comparison sheet,
          matched the same way as school_level; any one value per group.
      - name: discipline
        data_type: string
        description: >-
          Subject discipline (ELA, Math, Science) from the state test comparison
          sheet, matched the same way as school_level; any one value per group.
