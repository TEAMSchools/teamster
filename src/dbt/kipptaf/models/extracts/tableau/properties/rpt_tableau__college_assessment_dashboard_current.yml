models:
  - name: rpt_tableau__college_assessment_dashboard_current
    description: >-
      Currently enrolled high school students measured against KIPP Forward's
      attempt and benchmark goals, one row per student per goal. The workbook
      aggregates these rows into its school, regional and network views, so the
      model no longer emits a row per granularity level.


      That collapse is possible because goals stopped varying by school and
      region. One goal now applies at every level, and grade is the only
      dimension a goal is still stated at.


      Reads the By Grade branch of int_google_sheets__kippfwd__goals_unpivot, so
      thresholds and targets arrive paired and neither sheet is joined here. ACT
      is excluded, matching what this report has always covered.


      Only a total-level Benchmark is grade-specific. Attempts and section
      thresholds apply to every student regardless of grade, which is how the
      retired goals sheet carried them.


      See docs/models/carat-dashboard-data-model.md.
    columns:
      - name: academic_year
        data_type: int64
      - name: academic_year_display
        data_type: string
      - name: state
        data_type: string
      - name: region
        data_type: string
      - name: schoolid
        data_type: int64
      - name: school
        data_type: string
      - name: student_number
        data_type: int64
      - name: grade_level
        data_type: int64
      - name: enroll_status
        data_type: int64
      - name: iep_status
        data_type: string
      - name: is_504
        data_type: boolean
      - name: grad_iep_exempt_status_overall
        data_type: string
      - name: lep_status
        data_type: boolean
      - name: ktc_cohort
        data_type: int64
      - name: graduation_year
        data_type: int64
      - name: year_in_network
        data_type: int64
      - name: college_match_gpa
        data_type: numeric
      - name: college_match_gpa_bands
        data_type: string
      - name: expected_test_type
        data_type: string
      - name: expected_scope
        data_type: string
      - name: expected_subject_area
        data_type: string
      - name: expected_aligned_subject_area
        data_type: string
      - name: expected_score_type
        data_type: string
      - name: expected_goal_type
        data_type: string
      - name: expected_goal_subtype
        data_type: string
      - name: expected_metric_name
        data_type: string
      - name: expected_metric_label
        data_type: string
      - name: expected_metric_min_score
        data_type: float64
      - name: expected_metric_pct_goal
        data_type: float64
      - name: test_type
        data_type: string
      - name: scope
        data_type: string
      - name: subject_area
        data_type: string
      - name: score_type
        data_type: string
      - name: ktaf
        data_type: string
        description: >-
          The constant KTAF, so the network view is an aggregation over a column
          rather than a grand total. state, region, school and schoolid carry
          the narrower levels, and all four now share one goal per grade and
          metric — the sheet no longer differentiates a goal by school or
          region.
      - name: score
        data_type: float64
        description: >-
          The student's best result for this metric — their highest scale score
          on a Benchmark row, their lifetime sitting count on an Attempts row.
          Null where they have no result for the score type, which is how a
          non-test-taker stays visible rather than being dropped.
      - name: met_min_score_int
        data_type: int64
        description: >-
          Whether score clears expected_metric_min_score. Reads 0 rather than
          null when score is null, so an average over it treats a non-test-taker
          as not meeting the bar.
      - name: alt_met_min_score_int
        data_type: int64
        description: >-
          The same comparison, except that 1 Attempt requires score to equal the
          threshold rather than clear it, so a student who sat the test twice is
          not counted under the one-attempt metric.
      - name: benchmark_tier
        data_type: string
        description: >-
          Which readiness band the student's score falls in for this score type
          — College-Ready, HS-Grad Ready, or No Benchmark Met. The three are
          mutually exclusive and cover every test taker, so a share of test
          takers sums to one across them.


          Derived from both tiers evaluated over the same student and score
          type, which is why it can be read off a single row. It replaces four
          wide met_min_board_* flags, whose thresholds were a duplicate encoding
          of the HS-Ready and College-Ready cut scores the scaffold already
          carries.


          Null on Attempts rows, which have no readiness band, and null where
          score is null — so filtering it non-null gives the test-taker
          population these bands are reported over.
