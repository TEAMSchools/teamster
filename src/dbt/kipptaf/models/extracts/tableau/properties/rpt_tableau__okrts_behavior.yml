models:
  - name: rpt_tableau__okrts_behavior
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - region
              - academic_year
              - week_start_monday
              - behavior_category
              - behavior
              - entry_staff
          config:
            severity: error
    columns:
      - name: student_number
        data_type: int64
        data_tests:
          - not_null:
              config:
                severity: error
      - name: region
        data_type: string
        data_tests:
          - not_null:
              config:
                severity: error
      - name: week_start_monday
        data_type: date
        data_tests:
          - not_null:
              config:
                severity: error
      - name: academic_year
        data_type: int64
      - name: student_name
        data_type: string
      - name: enroll_status
        data_type: int64
      - name: cohort
        data_type: int64
      - name: school_level
        data_type: string
      - name: school
        data_type: string
      - name: grade_level
        data_type: int64
      - name: gender
        data_type: string
      - name: ethnicity
        data_type: string
      - name: lunch_status
        data_type: string
      - name: is_retained_year
        data_type: boolean
      - name: rn_year
        data_type: int64
      - name: term
        data_type: string
      - name: week_end_sunday
        data_type: date
      - name: days_in_session
        data_type: int64
      - name: category_type
        data_type: string
        description:
          Conformed behavior grouping. One of `BEAT`, `Corrective`, or `Habits
          of Excellence`. Derived from `behavior_category` and closed by
          construction -- a category the derivation does not map is dropped
          rather than passed through null, so this column has no other values.
          `Habits of Excellence` is middle- and high-school only.
      - name: behavior
        data_type: string
        description:
          Behavior name, conformed. Any parenthetical qualifier is stripped, so
          AY2025's `Accountability (Excellence)` and a plain `Accountability`
          are one member. `TEAMwork` is normalized to `Teamwork`, which the
          Tableau colour map and manual sort expect.
      - name: behavior_category
        data_type: string
        description:
          Raw DeansList behavior category. Lets consumers separate the three
          Values families -- `Values`, `Values (5)` and `Values (10 Point
          Bonus)` all map to category_type BEAT, but only `Values` is comparable
          year over year.
      - name: entry_staff
        data_type: string
      - name: total_points
        data_type: int64
      - name: behavior_count
        data_type: int64
      - name: homeroom_section
        data_type: string
      - name: homeroom_teacher_name
        data_type: string
      - name: ml_status
        data_type: string
      - name: status_504
        data_type: string
      - name: iep_status
        data_type: string
      - name: self_contained_status
        data_type: string
      - name: homeless_status
        data_type: string
        description:
          Decoded homelessness status for the enrollment year. Null for Miami,
          which does not populate the underlying PowerSchool field.
      - name: homeless_primary_nighttime_residence
        data_type: string
        description:
          Decoded primary nighttime residence for the enrollment year. Collected
          in New Jersey only, so null elsewhere.
      - name: behavior_month
        data_type: int64
      - name: school_enrollment_by_week
        data_type: int64
      - name: school_iep_enrollment_by_week
        data_type: int64
      - name: is_earned_progress_to_quarterly
        data_type: int64
        description: >-
          1 when the student has a Progress to Quarterly Incentive award in the
          week, otherwise 0. Awards are bucketed into Sunday-start weeks and
          labeled by the Monday, so a Sunday-dated award counts toward the
          following week.
      - name: is_earned_quarterly_incentive
        data_type: int64
        description: >-
          1 when the student has an Earned Quarterly Incentive award in the
          week's quarter, otherwise 0. The award's quarter is the reporting term
          (dim_terms, type RT) at the award's school whose dates hold the award
          date. DeansList dates each award on the last day of the quarter it
          rewards, often a weekend or other day without school, so the date is
          matched to term dates rather than to a school week.
      - name: state_studentnumber
        data_type: string

unit_tests:
  - name: unit_rpt_okrts_behavior_quarterly_award_quarter
    description: >-
      DeansList dates an Earned Quarterly Incentive on the last day of the
      quarter it rewards. 1001 earns a Q1 award dated on a Sunday quarter end,
      and 1002 earns one dated on a Monday quarter end that is not a school day.
      Both flag every Q1 week and no Q2 week.
    model: rpt_tableau__okrts_behavior
    overrides:
      vars:
        current_academic_year: 2026
    given:
      - input: ref("int_extracts__student_enrollments_weeks")
        rows:
          - &week_q1
            _dbt_source_project: kippnewark
            student_number: 1001
            schoolid: 100
            deanslist_school_id: 1
            academic_year: 2026
            week_start_monday: 2026-10-26
            week_end_sunday: 2026-11-01
            term: Q1
            is_enrolled_week: true
          - &week_q2
            <<: *week_q1
            week_start_monday: 2026-11-02
            week_end_sunday: 2026-11-08
            term: Q2
          - &week_q1_camden
            <<: *week_q1
            _dbt_source_project: kippcamden
            student_number: 1002
            schoolid: 200
            deanslist_school_id: 2
          - <<: *week_q1_camden
            week_start_monday: 2026-11-02
            week_end_sunday: 2026-11-08
            term: Q2
      - input: ref("stg_deanslist__behavior")
        rows:
          - student_school_id: 1001
            dl_school_id: 1
            academic_year: 2026
            behavior: Earned Quarterly Incentive
            behavior_date: 2026-11-01
          - student_school_id: 1002
            dl_school_id: 2
            academic_year: 2026
            behavior: Earned Quarterly Incentive
            behavior_date: 2026-11-02
      - input: ref("int_people__location_crosswalk")
        rows:
          - location_deanslist_school_id: 1
            location_powerschool_school_id: 100
          - location_deanslist_school_id: 2
            location_powerschool_school_id: 200
      - input: ref("int_students__calendar_week")
        rows: []
      - input: ref("dim_terms")
        rows:
          - &term_q1
            school_id: 100
            type: RT
            term_name: Q1
            academic_year: 2026
            start_date: 2026-07-01
            end_date: 2026-11-01
          - <<: *term_q1
            term_name: Q2
            start_date: 2026-11-02
            end_date: 2027-02-01
          - <<: *term_q1
            school_id: 200
            end_date: 2026-11-02
          - <<: *term_q1
            school_id: 200
            term_name: Q2
            start_date: 2026-11-03
            end_date: 2027-02-01
    expect:
      rows:
        - student_number: 1001
          week_start_monday: 2026-10-26
          term: Q1
          is_earned_quarterly_incentive: 1
        - student_number: 1001
          week_start_monday: 2026-11-02
          term: Q2
          is_earned_quarterly_incentive: 0
        - student_number: 1002
          week_start_monday: 2026-10-26
          term: Q1
          is_earned_quarterly_incentive: 1
        - student_number: 1002
          week_start_monday: 2026-11-02
          term: Q2
          is_earned_quarterly_incentive: 0
