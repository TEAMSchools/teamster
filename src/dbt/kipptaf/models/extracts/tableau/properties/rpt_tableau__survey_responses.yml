models:
  - name: rpt_tableau__survey_responses
    columns:
      - name: location_clean_name
        data_type: string
        description: >-
          Canonical location from int_people__location_crosswalk. Drives the
          Tableau location gate; retired name aliases collapse onto their
          canonical clean name here.
        data_tests:
          - not_null
      - name: home_business_unit_name
        data_type: string
        description: >-
          Legal entity. Drives the Tableau entity gate. Never location_region,
          which is a property of the location rather than the person.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TEAM Academy Charter School
                  - KIPP Cooper Norcross Academy
                  - KIPP Miami
                  - KIPP Paterson
                  - KIPP TEAM and Family Schools Inc.
      - name: survey_id
        data_type: string
      - name: survey_title
        data_type: string
      - name: survey_response_id
        data_type: string
      - name: survey_response_link
        data_type: string
      - name: survey_code
        data_type: string
      - name: survey_type
        data_type: string
      - name: academic_year
        data_type: int64
      - name: date_started
        data_type: timestamp
      - name: date_submitted
        data_type: timestamp
      - name: answer_value
        data_type: numeric
      - name: is_open_ended
        data_type: int64
      - name: round_rn
        data_type: int64
      - name: employee_number
        data_type: int64
      - name: respondent_name
        data_type: string
      - name: is_manager
        data_type: boolean
      - name: race_ethnicity
        data_type: string
      - name: gender
        data_type: string
      - name: manager_name
        data_type: string
      - name: manager_user_principal_name
        data_type: string
      - name: alumni_status
        data_type: string
      - name: community_grew_up
        data_type: string
      - name: community_professional_exp
        data_type: string
      - name: level_of_education
        data_type: string
      - name: assignment_status
        data_type: string
      - name: campus_name
        data_type: string
      - name: home_department_name
        data_type: string
      - name: job_function
        data_type: string
        description: >-
          Drives the Tableau role predicate. Null where the roster records no
          job function for the person.
      - name: job_title
        data_type: string
      - name: mail
        data_type: string
        description: Post-cutover Tableau identity.
      - name: user_principal_name
        data_type: string
      - name: sam_account_name
        data_type: string
      - name: reports_to_mail
        data_type: string
      - name: reports_to_sam_account_name
        data_type: string
      - name: primary_grade_level_taught
        data_type: int64
      - name: question_shortname
        data_type: string
      - name: answer
        data_type: string
      - name: question_title
        data_type: string
      - name: rated_department_code
        data_type: string
        description: >-
          Code for the department a support-survey question rates. The Survey
          Dashboard's department gate matches group membership against this
          column; null or blank reaches only the all-access and cross-department
          branches.
      - name: rated_department_name
        data_type: string
        description: Display label for rated_department_code.
