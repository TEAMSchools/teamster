models:
  - name: rpt_tableau__kfwd_career_launch_survey
    description: >-
      KIPP Forward alumni and Career Launch survey responses for the Career
      Launch Tableau views, built as a full join of the two. Each alumnus (HSG
      or TAF status, cohort at or before the current academic year) has one row
      per graduated postsecondary enrollment, or a single row when they have
      none. Only the rn_graduated = 1 row takes survey answers, and it repeats
      once per matched response; an alumnus with no matched response keeps null
      survey columns. A response that matches no alumnus gets its own row with
      null alumni columns and is_unmatched_response true. A response matches an
      alumnus when the respondent email equals their primary or secondary
      Salesforce email, when the reconciliation form links it to their contact,
      or when its respondent Salesforce id is their contact id (Alchemer
      responses carrying an id, and every Bulk Add row). Responses the
      reconciliation form marks Exclude are dropped. Survey answer columns hold
      the text as entered and are null when the response's survey did not ask
      that question. For alumni counts, filter to rn_respondent = 1,
      rn_graduated = 1, and is_unmatched_response false.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - contact_id
              - response_id
              - enrollment_id
          config:
            severity: error
    columns:
      - name: contact_id
        data_type: string
        description:
          Salesforce contact id of the alumnus. Null on a response that matched
          no alumnus.
      - name: sf_first_name
        data_type: string
        description: Alumnus first name from Salesforce.
        config:
          meta:
            contains_pii: true
      - name: sf_last_name
        data_type: string
        description: Alumnus last name from Salesforce.
        config:
          meta:
            contains_pii: true
      - name: sf_lastfirst
        data_type: string
        description:
          Alumnus name as Last, First from Salesforce, falling back to the
          PowerSchool student name.
        config:
          meta:
            contains_pii: true
      - name: contact_kipp_ms_graduate
        data_type: boolean
        description:
          Whether the Salesforce contact records the alumnus as a KIPP middle
          school graduate.
        config:
          meta:
            contains_pii: true
      - name: contact_kipp_hs_graduate
        data_type: boolean
        description:
          Whether the Salesforce contact records the alumnus as a KIPP high
          school graduate.
        config:
          meta:
            contains_pii: true
      - name: contact_kipp_hs_class
        data_type: int64
        description: KIPP high school class year on the Salesforce contact.
        config:
          meta:
            contains_pii: true
      - name: college_match_display_gpa
        data_type: numeric
        description:
          College Match Display GPA (high school GPA) from the Salesforce
          contact.
        config:
          meta:
            contains_pii: true
      - name: kipp_region_name
        data_type: string
        description: KIPP region on the Salesforce contact.
        config:
          meta:
            contains_pii: true
      - name: contact_description
        data_type: string
        description: Free-text Description field on the Salesforce contact.
        config:
          meta:
            contains_pii: true
      - name: contact_gender
        data_type: string
        description: Gender on the Salesforce contact.
        config:
          meta:
            contains_pii: true
      - name: contact_ethnicity
        data_type: string
        description: Ethnicity on the Salesforce contact.
        config:
          meta:
            contains_pii: true
      - name: expected_college_grad_date
        data_type: date
        description:
          Expected college graduation date from the Salesforce contact.
        config:
          meta:
            contains_pii: true
      - name: actual_college_grad_date
        data_type: date
        description: Actual college graduation date from the Salesforce contact.
        config:
          meta:
            contains_pii: true
      - name: current_kipp_student
        data_type: string
        description:
          Current KIPP Student value on the Salesforce contact, or 'Missing from
          Salesforce' when blank.
        config:
          meta:
            contains_pii: true
      - name: contact_owner_name
        data_type: string
        description: Name of the Salesforce user who owns the contact.
      - name: pursuing_degree_type
        data_type: string
        description:
          Degree type of the graduated postsecondary enrollment on this row.
          Null when the alumnus has no graduated enrollment.
        config:
          meta:
            contains_pii: true
      - name: type
        data_type: string
        description:
          Salesforce type of the graduated postsecondary enrollment on this row;
          never High School or Middle School. Null when the alumnus has no
          graduated enrollment.
        config:
          meta:
            contains_pii: true
      - name: start_date
        data_type: date
        description:
          Start date of the graduated postsecondary enrollment on this row.
        config:
          meta:
            contains_pii: true
      - name: actual_end_date
        data_type: date
        description:
          Actual end date of the graduated postsecondary enrollment on this row.
        config:
          meta:
            contains_pii: true
      - name: major
        data_type: string
        description:
          Major of the graduated postsecondary enrollment on this row.
        config:
          meta:
            contains_pii: true
      - name: status
        data_type: string
        description:
          Status of the enrollment on this row — always Graduated, or null when
          the alumnus has no graduated enrollment.
        config:
          meta:
            contains_pii: true
      - name: ecc
        data_type: numeric
        description:
          Adjusted six-year minority graduation rate of the institution of the
          graduated enrollment on this row, from its Salesforce account. Null
          when the alumnus has no graduated enrollment.
        config:
          meta:
            contains_pii: true
      - name: institution
        data_type: string
        description:
          Name of the institution of the graduated enrollment on this row, from
          its Salesforce account.
        config:
          meta:
            contains_pii: true
      - name: enrollment_id
        data_type: string
        description:
          Salesforce id of the graduated postsecondary enrollment on this row.
          Null when the alum has no graduated enrollment.
      - name: reconciliation_response_id
        data_type: string
        description:
          The response_id when the career launch reconciliation form links this
          response to this alum's contact. Null when it does not, including a
          response matched only by email or Salesforce id, and on rows with no
          alum or no response.
      - name: college_programs
        data_type: string
        description:
          The alumnus's Salesforce College Program records, separated by
          semicolons, each as the organization name followed by its opportunity
          dates in parentheses when present. Leaves out records marked Not
          Matched or Wait-listed and records with no application status. Null
          when there are none.
        config:
          meta:
            contains_pii: true
      - name: is_basta
        data_type: boolean
        description:
          True when the alumnus has a Project BASTA College Program record that
          college_programs includes.
        config:
          meta:
            contains_pii: true
      - name: is_braven
        data_type: boolean
        description:
          True when the alumnus has a Braven College Program record that
          college_programs includes.
        config:
          meta:
            contains_pii: true
      - name: is_backrs
        data_type: boolean
        description:
          True when the alumnus has a Backrs College Program record that
          college_programs includes.
        config:
          meta:
            contains_pii: true
      - name: is_kippnj_internship
        data_type: boolean
        description:
          True when the alumnus has a College Program record with KIPP New
          Jersey - Camden or KIPP New Jersey - Newark that college_programs
          includes.
        config:
          meta:
            contains_pii: true
      - name: hs_gpa_bands
        data_type: string
        description: >-
          Band of college_match_display_gpa — 3.50+, 3.00-3.49, 2.50-2.99,
          2.00-2.50 (which covers 2.00 to 2.49), or <2.00. Null when there is no
          GPA.
        config:
          meta:
            contains_pii: true
      - name: sf_email
        data_type: string
        description: Salesforce primary email, lowercased.
        config:
          meta:
            contains_pii: true
      - name: sf_secondary_email
        data_type: string
        description: Salesforce secondary email, lowercased.
        config:
          meta:
            contains_pii: true
      - name: expected_grad_date_month
        data_type: int64
        description: Month number of expected_college_grad_date.
        config:
          meta:
            contains_pii: true
      - name: expected_grad_date_year
        data_type: int64
        description: Year of expected_college_grad_date.
        config:
          meta:
            contains_pii: true
      - name: actual_end_date_month
        data_type: int64
        description: Month number of actual_end_date.
        config:
          meta:
            contains_pii: true
      - name: actual_end_date_year
        data_type: int64
        description: Year of actual_end_date.
        config:
          meta:
            contains_pii: true
      - name: rn_graduated
        data_type: int64
        description:
          Order of this row's graduated enrollment among the alumnus's graduated
          enrollments, earliest actual_end_date first. 1 on the single row of an
          alumnus with no graduated enrollment; null on a response that matched
          no alumnus.
      - name: survey_id
        data_type: string
        description:
          Id of the survey the response came from — the Alchemer survey id, the
          Google Form id, or bulk_add for Bulk Add rows. Null on rows with no
          response.
      - name: survey_title
        data_type: string
        description:
          Source of the response — Alchemer survey, Google Form v1, Google Form
          v2, or Bulk Add. Null on rows with no response.
      - name: response_id
        data_type: string
        description:
          Id of the survey response; for a Bulk Add row, a hash of its contact
          id. Null on rows with no response.
      - name: response_date_submitted
        data_type: timestamp
        description:
          When the response was submitted. Null for Bulk Add rows and rows with
          no response.
        config:
          meta:
            contains_pii: true
      - name: respondent_user_principal_name
        data_type: string
        description:
          Respondent email on the response, lowercased, used to match it to an
          alumnus. Null for Bulk Add rows.
        config:
          meta:
            contains_pii: true
      - name: after_grad
        data_type: string
        description: Answer to the post-graduation plan question.
        config:
          meta:
            contains_pii: true
      - name: alumni_dob
        data_type: string
        description: Date of birth the respondent entered.
        config:
          meta:
            contains_pii: true
      - name: alumni_email
        data_type: string
        description: Email the respondent entered on the survey.
        config:
          meta:
            contains_pii: true
      - name: alumni_phone
        data_type: string
        description: Phone number the respondent entered on the survey.
        config:
          meta:
            contains_pii: true
      - name: cell_number
        data_type: string
        description: Cell phone number the respondent entered on the survey.
        config:
          meta:
            contains_pii: true
      - name: company
        data_type: string
        description: Employer the respondent named.
        config:
          meta:
            contains_pii: true
      - name: complete_program
        data_type: string
        description: Answer to the complete_program survey question.
        config:
          meta:
            contains_pii: true
      - name: debt_amount
        data_type: string
        description: Debt amount the respondent reported.
        config:
          meta:
            contains_pii: true
      - name: debt_binary
        data_type: string
        description: Whether the respondent reported having debt.
        config:
          meta:
            contains_pii: true
      - name: first_name
        data_type: string
        description: First name the respondent entered on the survey.
        config:
          meta:
            contains_pii: true
      - name: grad_school_major
        data_type: string
        description: Graduate school major the respondent reported.
        config:
          meta:
            contains_pii: true
      - name: grad_school_name
        data_type: string
        description: Graduate school the respondent reported.
        config:
          meta:
            contains_pii: true
      - name: highest_level_of_education
        data_type: string
        description: Highest level of education the respondent reported.
        config:
          meta:
            contains_pii: true
      - name: job_sat
        data_type: string
        description: Answer to the job satisfaction question.
        config:
          meta:
            contains_pii: true
      - name: last_name
        data_type: string
        description: Last name the respondent entered on the survey.
        config:
          meta:
            contains_pii: true
      - name: linkedin
        data_type: string
        description: Answer to the linkedin survey question.
        config:
          meta:
            contains_pii: true
      - name: linkedin_link
        data_type: string
        description: LinkedIn profile link the respondent entered.
        config:
          meta:
            contains_pii: true
      - name: not_pursuing_plan
        data_type: string
        description: Answer to the not_pursuing_plan survey question.
        config:
          meta:
            contains_pii: true
      - name: reenrollment
        data_type: string
        description: Answer to the reenrollment survey question.
        config:
          meta:
            contains_pii: true
      - name: role
        data_type: string
        description: Job role the respondent reported.
        config:
          meta:
            contains_pii: true
      - name: satisfied_program
        data_type: string
        description: Answer to the satisfied_program survey question.
        config:
          meta:
            contains_pii: true
      - name: search_focus
        data_type: string
        description: Answer to the search_focus survey question.
        config:
          meta:
            contains_pii: true
      - name: annual_income
        data_type: string
        description:
          Salary answer as entered, from the income question or, when that is
          blank, its alternate version.
        config:
          meta:
            contains_pii: true
      - name: benefits
        data_type: string
        description:
          Benefits answer as entered, from the benefits question or, when that
          is blank, its alternate version.
        config:
          meta:
            contains_pii: true
      - name: annual_income_clean
        data_type: float64
        description: >-
          Dollar amount parsed from annual_income — the bottom of a range
          ($45,000 - $49,999 gives 45000), the stated amount for an "or more"
          answer, otherwise the first dollar amount. Null when annual_income
          holds no dollar amount.
        config:
          meta:
            contains_pii: true
      - name: season_label_expected
        data_type: string
        description:
          Spring and the year when expected_college_grad_date falls in January
          to June, otherwise Fall and the year. Null when there is no expected
          date.
        config:
          meta:
            contains_pii: true
      - name: season_label
        data_type: string
        description:
          Spring and the year when actual_end_date falls in January to June,
          otherwise Fall and the year. Null when the row has no graduated
          enrollment.
        config:
          meta:
            contains_pii: true
      - name: is_unmatched_response
        data_type: boolean
        description:
          True on a response row that matched no alumnus; false on every alumni
          row.
      - name: rn_respondent
        data_type: int64
        description:
          Ranks the alumnus's rows, Bulk Add rows first, then newest
          response_date_submitted; rn_respondent = 1 is the current response.
          Rows with no response tie, so the pick among them is arbitrary. Null
          on a response that matched no alumnus.
      - name: es_graduated
        data_type: string
        description:
          PowerSchool abbreviation of the elementary school the alumnus
          graduated from.
        config:
          meta:
            contains_pii: true
      - name: tier
        data_type: string
        description:
          Subject of the alumnus's most recent Salesforce contact note whose
          subject ends in Tier and a number.
        config:
          meta:
            contains_pii: true
      - name: advising_provider
        data_type: string
        description:
          Organization advising the alumnus, from the Salesforce contact.
        config:
          meta:
            contains_pii: true
      - name: postsec_advisor
        data_type: string
        description:
          Salesforce Contact ID of the postsecondary advisor assigned to the
          alumnus on their Salesforce contact record.
      - name: college_counselor
        data_type: string
        description:
          College counselor assigned to the alumnus, resolved from the
          counselor's own Salesforce contact record.
      - name: advisor
        data_type: string
        description:
          Effective advisor for the alumnus — 'Collab' when the advising
          provider is KIPP NYC, otherwise the name of the alumnus's
          postsecondary advisor.
      - name: high_school_graduated_from
        data_type: string
        description:
          High school the alumnus graduated from, from their Salesforce contact
          record.
        config:
          meta:
            contains_pii: true
      - name: is_special_education
        data_type: boolean
        description:
          Whether the alumnus has a recorded IEP date, used as a
          special-education indicator.
        config:
          meta:
            contains_pii: true
      - name: middle_school_attended
        data_type: string
        description:
          Middle school the alumnus attended, from their Salesforce contact
          record.
        config:
          meta:
            contains_pii: true
      - name: most_recent_iep_date
        data_type: date
        description:
          Date of the alumnus's most recent IEP on their Salesforce contact
          record.
        config:
          meta:
            contains_pii: true
      - name: ktc_cohort
        data_type: int64
        description:
          KIPP-to-college cohort year for the alumnus, from their Salesforce
          contact record.
        config:
          meta:
            contains_pii: true
      - name: currently_enrolled_school
        data_type: string
        description:
          School the alumnus is currently enrolled in, from their Salesforce
          contact record.
        config:
          meta:
            contains_pii: true
      - name: current_college_cumulative_gpa
        data_type: numeric
        description:
          Current cumulative college GPA, from the alumnus's Salesforce contact
          record.
        config:
          meta:
            contains_pii: true
      - name: primary_phone
        data_type: string
        description: Mobile phone from the alumnus's Salesforce contact record.
        config:
          meta:
            contains_pii: true
      - name: secondary_phone
        data_type: string
        description: Home phone from the alumnus's Salesforce contact record.
        config:
          meta:
            contains_pii: true
      - name: career_conversation_notes
        data_type: string
        description:
          Free-text notes from the alumnus's KFWD career conversation, logged in
          the KFWD AppSheet app. NULL when no conversation is recorded.
        config:
          meta:
            contains_pii: true
      - name: is_resume_score
        data_type: boolean
        description:
          Whether a resume was scored during the KFWD career conversation. False
          when no conversation is recorded.
        config:
          meta:
            contains_pii: true
      - name: is_linkedin
        data_type: boolean
        description:
          Whether the alumnus's LinkedIn profile was discussed during the KFWD
          career conversation. False when no conversation is recorded.
        config:
          meta:
            contains_pii: true
      - name: is_mock_interview_or_prep
        data_type: boolean
        description:
          Whether mock interview or interview preparation was discussed during
          the KFWD career conversation. False when no conversation is recorded.
        config:
          meta:
            contains_pii: true
      - name: is_professional_references_list
        data_type: boolean
        description:
          Whether the professional references list was discussed during the KFWD
          career conversation. False when no conversation is recorded.
        config:
          meta:
            contains_pii: true
      - name: is_job_search_template
        data_type: boolean
        description:
          Whether the job search template was discussed during the KFWD career
          conversation. False when no conversation is recorded.
        config:
          meta:
            contains_pii: true
      - name: is_cover_letter_template
        data_type: boolean
        description:
          Whether the cover letter template was discussed during the KFWD career
          conversation. False when no conversation is recorded.
        config:
          meta:
            contains_pii: true
      - name: is_work_samples
        data_type: boolean
        description:
          Whether work samples were discussed during the KFWD career
          conversation. False when no conversation is recorded.
        config:
          meta:
            contains_pii: true
      - name: cc1_count
        data_type: int64
        description:
          Number of school years (July to June) in which the alumnus has at
          least one CC1 Career Conversation contact note in Salesforce; not the
          number of notes. Zero when none.
        config:
          meta:
            contains_pii: true
      - name: cc2_count
        data_type: int64
        description:
          Number of school years (July to June) in which the alumnus has at
          least one CC2 Career Conversation contact note in Salesforce; not the
          number of notes. Zero when none.
        config:
          meta:
            contains_pii: true
      - name: cc3_count
        data_type: int64
        description:
          Number of school years (July to June) in which the alumnus has at
          least one CC3 Career Conversation contact note in Salesforce; not the
          number of notes. Zero when none.
        config:
          meta:
            contains_pii: true
      - name: cc4_count
        data_type: int64
        description:
          Number of school years (July to June) in which the alumnus has at
          least one CC4 Career Conversation contact note in Salesforce; not the
          number of notes. Zero when none.
        config:
          meta:
            contains_pii: true
      - name: cc5_count
        data_type: int64
        description:
          Number of school years (July to June) in which the alumnus has at
          least one CC5 Career Conversation contact note in Salesforce; not the
          number of notes. Zero when none.
        config:
          meta:
            contains_pii: true
      - name: cc_total_count
        data_type: int64
        description:
          Sum of cc1_count through cc5_count, so it counts step-and-school-year
          pairs with a Career Conversation note, not notes. Zero when none.
        config:
          meta:
            contains_pii: true
      - name: career_conversation_items_complete_count
        data_type: int64
        description:
          Number of the seven KFWD career conversation checklist items (resume
          score, LinkedIn, mock interview or prep, professional references list,
          job search template, cover letter template, work samples) marked
          complete for the alumnus in the Career Conversation Tracker AppSheet
          app. Zero when no conversation is recorded.
        config:
          meta:
            contains_pii: true
      - name: is_career_conversation_complete
        data_type: boolean
        description:
          Whether all seven KFWD career conversation checklist items are marked
          complete for the alumnus in the Career Conversation Tracker AppSheet
          app. False when any item is incomplete or no conversation is recorded.
        config:
          meta:
            contains_pii: true
      - name: last_ccr_date
        data_type: date
        description:
          Contact note date of the alumnus's most recent Career Conversation
          (CC1 through CC5) record in Salesforce, across all academic years.
          NULL when no Career Conversation note is logged.
        config:
          meta:
            contains_pii: true
      - name: launch_assessed_at
        data_type: datetime
        description: >-
          When the alumnus's latest Career Launch assessment took place, from
          the KIPP Forward Career Launch AppSheet app. The readiness columns
          (levels, points, launch_score, launch_stage, has_all_levels,
          coaching_focus, next_action) come from that same assessment, repeat on
          every row for the alumnus, and are NULL when the alumnus has never
          been assessed.
        config:
          meta:
            contains_pii: true
      - name: career_ready_level
        data_type: int64
        description: Career Ready level, 1 to 4, on the latest assessment.
        config:
          meta:
            contains_pii: true
      - name: active_search_level
        data_type: int64
        description: Active Search level, 1 to 4, on the latest assessment.
        config:
          meta:
            contains_pii: true
      - name: internship_experience_level
        data_type: int64
        description:
          Internship / Experience level, 1 to 4, on the latest assessment.
        config:
          meta:
            contains_pii: true
      - name: network_level
        data_type: int64
        description: Network level, 1 to 4, on the latest assessment.
        config:
          meta:
            contains_pii: true
      - name: career_ready_points
        data_type: int64
        description: Rubric points for the Career Ready level.
        config:
          meta:
            contains_pii: true
      - name: active_search_points
        data_type: int64
        description: Rubric points for the Active Search level.
        config:
          meta:
            contains_pii: true
      - name: internship_experience_points
        data_type: int64
        description: Rubric points for the Internship / Experience level.
        config:
          meta:
            contains_pii: true
      - name: network_points
        data_type: int64
        description: Rubric points for the Network level.
        config:
          meta:
            contains_pii: true
      - name: gpa_points
        data_type: int64
        description: >-
          GPA points from the alumnus's current college GPA; 0 when they have
          none. NULL when the alumnus has never been assessed.
        config:
          meta:
            contains_pii: true
      - name: launch_score
        data_type: int64
        description: >-
          Career Launch score out of 100 on the latest assessment: the four
          indicator points plus GPA points, scored with today's rubric and GPA.
        config:
          meta:
            contains_pii: true
      - name: launch_stage
        data_type: string
        description: Career Launch stage for the launch score.
        config:
          meta:
            contains_pii: true
      - name: has_all_levels
        data_type: boolean
        description: >-
          True when the latest assessment has all four indicator levels. A
          missing level counts as 0 points, so filter on this before comparing
          scores.
        config:
          meta:
            contains_pii: true
      - name: coaching_focus
        data_type: string
        description: Coaching focus agreed on the latest assessment.
        config:
          meta:
            contains_pii: true
      - name: next_action
        data_type: string
        description: Next step agreed on the latest assessment.
        config:
          meta:
            contains_pii: true
