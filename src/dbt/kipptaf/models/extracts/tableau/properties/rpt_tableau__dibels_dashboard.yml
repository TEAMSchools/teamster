models:
  - name: rpt_tableau__dibels_dashboard
    description: >-
      Amplify DIBELS benchmark and progress-monitoring results, one UNION ALL
      branch per data method -- BM (Benchmark administrations), Internal (the
      in-house PM goal method) and Aimline (Amplify's per-student aimline). Each
      branch drives off the enrollment spine crossed with that method's
      expectation gate, so untested students keep a row, then LEFT JOINs the
      scores, the participation roster and the method's criteria model. The PM
      joins name model_type so each method reads only its own rows.

      Network-wide in principle, Miami included, but **in practice Miami returns
      no rows here.** The grain filter reads `not s.is_self_contained`, which is
      null for every Miami row because Focus records no self-contained
      placement. The model declines to assert false for a fact the data does not
      carry, so Miami stays out until Focus supplies a placement field or Ops
      confirms a mapping.

      Rows are not guaranteed unique -- the ELA course-enrollment join can fan a
      student out when more than one qualifying section matches.

      The `*_status` and `*_category` columns form a grid: three granularities
      (measure standard, measure name code, round) crossed with four comparison
      lenses (the method's own goal, the benchmark standard, aimline and
      benchmark combined, and the trajectory). A Tableau selector picks one
      cell, so every view reads a string rather than converting a flag.

      At measure-standard grain the four lenses are
      measure_standard_goal_status, admin_benchmark_goal_status,
      aimline_category and aimline_trajectory_category. At measure-name-code
      grain they are measure_name_code_goal_status,
      measure_name_code_benchmark_status,
      measure_name_code_aimline_benchmark_status and
      measure_name_code_trajectory_status. At round grain they are
      pm_round_status, round_benchmark_status, aimline_round_category and
      round_trajectory_status.

      The coarser grains are strictly stricter, never looser: a coarser grain
      never reads met where a finer one does not. If that ever inverts, a rollup
      window is wrong.

      The names are not uniform, deliberately. Five columns use
      `<grain>_<lens>_status`; the others use `_goal_status` or `_category` with
      the grain in varying positions. Three of the older names are shared with
      the internal method, so renaming them would force a rebind of the internal
      Tableau tabs as well.

      The six combined-lens and trajectory columns (aimline_category,
      aimline_trajectory_category, aimline_round_category and the three
      `*_aimline_benchmark_status` / `*_trajectory_status` columns) are
      Aimline-only and null on BM and Internal rows -- those lenses have no
      meaning without an aimline. The own-goal and benchmark lenses are PM-only
      and null on every Benchmark row. On PM rows they are never null, because
      the criteria models carry scored rows only and this model coalesces the
      resulting gap to `Not Tested` -- a student who was expected to test and
      was not. So a null in an own-goal or benchmark column means a Benchmark
      row, and nothing else.
    columns:
      - name: _dbt_source_relation
        data_type: string
        description:
          Source relation the row was unioned from. Encodes schema plus table
          name, so never join on it -- join the materialized
          _dbt_source_project.
      - name: academic_year
        data_type: int64
        description:
          Starting calendar year of the school year (e.g. 2025 for 2025-2026).
      - name: academic_year_display
        data_type: string
        description: The school year in its written form, e.g. 2025-2026.
      - name: district
        data_type: string
        description: Legal district entity the school belongs to.
      - name: state
        data_type: string
        description: Two-letter state code of the school.
      - name: region
        data_type: string
        description:
          The city form of the region -- Newark, Camden, Miami, Paterson.
      - name: school_level
        data_type: string
        description: Grade band of the school, e.g. ES, MS, HS.
      - name: schoolid
        data_type: int64
        description:
          PowerSchool school id. A database key, not a school-facing number.
      - name: school
        data_type: string
        description: School name.
      - name: studentid
        data_type: int64
        description:
          PowerSchool internal student key. Not the school-facing student
          number.
      - name: student_number
        data_type: int64
        description: Student Number assigned by the school.
        config:
          meta:
            contains_pii: true
      - name: student_name
        data_type: string
        description: Student's name as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: grade_level_int
        data_type: int64
        description:
          Grade level the student is enrolled in, as an integer with K mapped to
          0.
      - name: is_out_of_district
        data_type: boolean
        description: Whether the student is placed outside the district.
      - name: gender
        data_type: string
        description: Gender as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: ethnicity
        data_type: string
        description: Race or ethnicity as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: is_homeless
        data_type: boolean
        description: Whether the student is identified as homeless.
        config:
          meta:
            contains_pii: true
      - name: iep_status
        data_type: string
        description: Special-education status as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: is_504
        data_type: boolean
        description: Whether the student has a Section 504 plan.
        config:
          meta:
            contains_pii: true
      - name: lep_status
        data_type: boolean
        description: Whether the student is identified as an English learner.
        config:
          meta:
            contains_pii: true
      - name: lunch_status
        data_type: string
        description: Free or reduced lunch eligibility as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: gifted_and_talented
        data_type: string
        description: Gifted-and-talented identification as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: enroll_status
        data_type: int64
        description: SIS enrollment status code. The dashboard keeps 0, 2 and 3.
      - name: advisory
        data_type: string
        description: Advisory or homeroom the student belongs to.
        config:
          meta:
            contains_pii: true
      - name: cohort
        data_type: int64
        description: Expected graduation year.
        config:
          meta:
            contains_pii: true
      - name: hos
        data_type: string
        description: Head of School for the student's school.
      - name: nj_student_tier
        data_type: string
        description: New Jersey intervention tier assigned to the student.
        config:
          meta:
            contains_pii: true
      - name: tutoring_nj
        data_type: boolean
        description:
          Whether the student is in the New Jersey tutoring programme.
        config:
          meta:
            contains_pii: true
      - name: is_sipps
        data_type: boolean
        description: Whether the student is in SIPPS instruction.
        config:
          meta:
            contains_pii: true
      - name: assessment_type
        data_type: string
        description:
          Whether the row is a Benchmark administration or a PM round.
      - name: model_type
        data_type: string
        description: >-
          Which data model produced the row -- BM for Benchmark, Internal for
          the in-house PM goal method, Aimline for Amplify's per-student
          aimline. Both PM methods run K-8 in parallel, so any view that counts
          PM rows must filter this column or every eligible student is counted
          once per method.
      - name: expected_start_date
        data_type: date
        description:
          First day of the expected round or administration window, from the
          expectation gate.
      - name: expected_end_date
        data_type: date
        description:
          Last day of the expected round or administration window, from the
          expectation gate.
      - name: expected_test
        data_type: string
        description: The administration or PM season the row is expected in.
      - name: expected_month_round
        data_type: string
        description: Calendar month of the expected window.
      - name: expected_grade_level_int
        data_type: int64
        description: Grade the assessment is expected at, as an integer.
      - name: expected_measure_name_code
        data_type: string
        description: Short code of the measure expected in this round.
      - name: expected_measure_name
        data_type: string
        description: Full name of the measure expected in this round.
      - name: expected_measure_standard
        data_type: string
        description: The measure standard expected in this round.
      - name: admin_goal_season
        data_type: string
        description: The administration the Benchmark goal applies to.
      - name: admin_goal
        data_type: float64
        description:
          The school's Benchmark goal for this grade and administration, from
          the BM goals sheet. Never padded.
      - name: admin_goal_grade_range
        data_type: float64
        description: The grade-range Benchmark goal, from the BM goals sheet.
      - name: n_admin_season_school_gl_all
        data_type: int64
        description: Students at the school in this grade and administration.
      - name: n_admin_season_school_gl_at_above
        data_type: int64
        description:
          Students at the school in this grade and administration scoring At or
          Above Benchmark.
      - name: n_admin_season_school_gl_bl_wb
        data_type: int64
        description:
          Students at the school in this grade and administration scoring Below
          or Well Below Benchmark.
      - name: n_admin_season_school_gl_at_above_expected
        data_type: int64
        description:
          Students the school's goal implies should score At or Above Benchmark.
      - name: n_admin_season_school_gl_at_above_gap
        data_type: float64
        description:
          Distance between the school's At or Above count and its goal.
      - name: n_admin_season_region_gl_all
        data_type: int64
        description: Students in the region in this grade and administration.
      - name: n_admin_season_region_gl_at_above
        data_type: int64
        description:
          Students in the region in this grade and administration scoring At or
          Above Benchmark.
      - name: n_admin_season_region_gl_bl_wb
        data_type: int64
        description:
          Students in the region in this grade and administration scoring Below
          or Well Below Benchmark.
      - name: n_admin_season_region_gl_at_above_expected
        data_type: int64
        description:
          Students the region's goal implies should score At or Above Benchmark.
      - name: n_admin_season_region_gl_at_above_gap
        data_type: float64
        description:
          Distance between the region's At or Above count and its goal.
      - name: grade_level
        data_type: int64
        description:
          Grade the assessment is expected at, as an integer. Duplicated from
          the expectation gate for the workbook's convenience.
      - name: expected_grade_level
        data_type: string
        description: Grade the assessment is expected at, in its written form.
      - name: average_starting_words
        data_type: int64
        description:
          The cohort's starting average for the measure, from the frozen PM
          goals sheet. Internal rows only.
      - name: pm_round_days
        data_type: int64
        description:
          In-session school days in this round's window. Internal rows only.
      - name: pm_days
        data_type: int64
        description:
          Total in-session school days across the season's PM rounds. Internal
          rows only.
      - name: benchmark_goal
        data_type: float64
        description:
          Amplify's published grade-level standard for the season, unpadded.
          From the PM goals sheet on Internal rows and the by-levels expectation
          gate on Aimline rows; null on Benchmark rows.
      - name: benchmark_goal_padded
        data_type: float64
        description:
          The published standard plus academics' 3-word planning buffer. The
          figure every internal calculation reads and the bar its at-grade-level
          verdict compares against. Internal rows only.
      - name: required_growth_words
        data_type: int64
        description:
          The gap the cohort owes for the season -- benchmark_goal_padded minus
          average_starting_words. Internal rows only.
      - name: daily_growth_rate
        data_type: float64
        description: Words of growth owed per school day. Internal rows only.
      - name: round_growth_words_goal
        data_type: int64
        description:
          This round's share of the season's growth, proportional to its school
          days. The season's first round also carries the starting words.
          Internal rows only.
      - name: goal
        data_type: float64
        description:
          The moving target the score is compared against in this round. It
          splits by method -- cumulative_growth_words from the frozen PM goals
          sheet on Internal rows, aimline_value_by_date on Aimline rows. Both
          climb across the season, so the two methods answer the same question
          here and a view can read one column. Null on Benchmark rows. The
          season endpoint is a different quantity and lives in
          aimline_season_student_goal.
        config:
          meta:
            contains_pii: true
      - name: aimline_season_student_goal
        data_type: float64
        description:
          The student's own end-of-season target on the aimline method -- where
          the aimline lands on the last day of the season. It is individual to
          the student, so it does not have to equal the benchmark goal. Null on
          every internal-method and benchmark row.
        config:
          meta:
            contains_pii: true
      - name: aimline_season_student_goal_gap
        data_type: float64
        description:
          Measure-standard score minus aimline_season_student_goal -- negative
          when the student is short of the season target, positive when past it.
          Null on every internal-method and benchmark row, and wherever either
          input is null.
        config:
          meta:
            contains_pii: true
      - name: benchmark_goal_gap
        data_type: float64
        description:
          Measure-standard score minus benchmark_goal -- negative when the
          student is below the grade-level standard, positive when above it.
          benchmark_goal on a PM row is the next benchmark's standard, so a
          BOY->MOY round is measured against the MOY bar. Populated on both PM
          methods; null on Benchmark rows, and wherever either input is null.
        config:
          meta:
            contains_pii: true
      - name: schedule_student_number
        data_type: int64
        description:
          Student number on the matched course-enrollment row. Null where no ELA
          section matched.
      - name: teacherid
        data_type: int64
        description: PowerSchool teacher id on the matched ELA section.
      - name: teacher_name
        data_type: string
        description: Teacher of the matched ELA section.
        config:
          meta:
            contains_pii: true
      - name: course_name
        data_type: string
        description: Name of the matched ELA course.
      - name: course_number
        data_type: string
        description: Course number of the matched ELA section.
      - name: section_number
        data_type: string
        description: Section number of the matched ELA section.
      - name: mclass_student_number
        data_type: int64
        description:
          Student number on the matched Amplify score row. Null where the
          student was not scored.
      - name: assessment_grade
        data_type: string
        description: Grade level of the assessment administered.
      - name: period
        data_type: string
        description:
          For a Benchmark row the administration -- BOY, MOY or EOY. For a PM
          row the PM season, BOY->MOY or MOY->EOY.
      - name: client_date
        data_type: date
        description:
          Date the probe was administered on the device. Null where the student
          was not scored.
      - name: start_date
        data_type: date
        description:
          First day of the round or administration window, from the matched
          score row. Null where the student was not scored -- slice on
          expected_start_date instead.
      - name: end_date
        data_type: date
        description:
          Last day of the round or administration window, from the matched score
          row. Null where the student was not scored -- slice on
          expected_end_date instead.
      - name: measure_name
        data_type: string
        description: Full measure name, e.g. Oral Reading Fluency.
      - name: measure_name_code
        data_type: string
        description:
          Short measure abbreviation, e.g. ORF from Reading Fluency (ORF). NWF
          and ORF are the only codes holding more than one standard.
      - name: measure_standard
        data_type: string
        description:
          The individual measure evaluated -- Reading Fluency (ORF) and Reading
          Accuracy (ORF-Accu) are separate standards under one code.
      - name: measure_standard_score
        data_type: float64
        description:
          The score recorded for the measure. On a PM row this is the student's
          best score for that measure in that round.
        config:
          meta:
            contains_pii: true
      - name: measure_standard_level
        data_type: string
        description:
          Amplify's benchmark level for the score, e.g. At or Above Benchmark.
          Benchmark rows only; scored PM rows read NA.
        config:
          meta:
            contains_pii: true
      - name: measure_standard_level_int
        data_type: int64
        description: measure_standard_level as an ordinal. Benchmark rows only.
      - name: measure_percentile
        data_type: float64
        description: National percentile for the score. Benchmark rows only.
        config:
          meta:
            contains_pii: true
      - name: measure_semester_growth
        data_type: string
        description:
          Amplify's semester growth classification. Benchmark rows only; scored
          PM rows read NA.
      - name: measure_year_growth
        data_type: string
        description:
          Amplify's year growth classification. Benchmark rows only; scored PM
          rows read NA.
      - name: boy_composite
        data_type: string
        description: The student's BOY composite level.
        config:
          meta:
            contains_pii: true
      - name: moy_composite
        data_type: string
        description: The student's MOY composite level.
        config:
          meta:
            contains_pii: true
      - name: eoy_composite
        data_type: string
        description: The student's EOY composite level.
        config:
          meta:
            contains_pii: true
      - name: aggregated_measure_standard_level
        data_type: string
        description:
          Composite level rolled up across the measures in the administration.
          Benchmark rows only.
      - name: foundation_measure_standard_level
        data_type: string
        description:
          Level used by the Foundations goal tracker. Benchmark rows only.
      - name: expected_row_count
        data_type: int64
        description:
          How many measures the round expected of this student, from the
          expectation gate.
      - name: actual_row_count
        data_type: int64
        description:
          How many of the round's expected measures the student was actually
          scored on, counted per data method.
      - name: completed_test_round
        data_type: boolean
        description:
          Whether the student was tested on every measure the round expected.
      - name: completed_test_round_int
        data_type: int64
        description:
          completed_test_round as 1/0, for aggregation in the BI layer.
      - name: round_test_status
        data_type: string
        description: >-
          The round's testing state in academics' words — Not Tested, Round
          Incomplete, or Fully Tested. Carried from
          int_students__dibels_participation_roster, which owns it. Use this for
          percent fully tested by round.

          Round grain, not row grain, so it repeats across every expected
          measure in the round.
      - name: participation_group
        data_type: string
        description: >-
          Combo on the rows making up the blended participation view academics
          asked to see -- every Benchmark row, the internal method for K-2, and
          aimline for grades 3-8 -- and Not Combo on the alternates, meaning
          aimline K-2 and internal 3-8. Filter to Combo for one participation
          rate across the network: a PM student is expected under both methods,
          so an unfiltered rate counts them twice. Set in
          int_students__dibels_participation_roster, where the K-2 versus 3-8
          boundary is hardcoded, and read off the ENROLLED grade level rather
          than the assessed grade.
      - name: met_measure_standard_goal
        data_type: int64
        description: >-
          1 when the measure hit its goal for the round, else 0. The single
          measure-standard verdict for both PM methods, against a different
          target each — the Internal branch compares the score to the round's
          cumulative growth target, the Aimline branch carries Amplify's verdict
          against the student's own aimline. Null means the student did not sit
          the measure, and on an Aimline row additionally means Amplify
          published no verdict for a probe they did sit. The labelled twin
          separates those two states. Null is never a miss.
        config:
          meta:
            contains_pii: true
      - name: met_admin_benchmark_goal
        data_type: int64
        description: >-
          1 when the score reaches the benchmark goal -- at grade level rather
          than on pace. Recomputed each round and not latched.

          The bar differs by method, deliberately. Internal compares against
          benchmark_goal plus academics' 3-word planning buffer; Aimline
          compares against the bare published standard, because the pad exists
          to make a cohort trajectory land past the bar and Aimline builds no
          trajectory. So the same student, score, standard and round can read 1
          on Aimline and 0 on Internal, never the other way. T&L's recorded
          choice; do not reconcile the two columns or union them as one metric.
      - name: met_admin_benchmark_goal_unpadded
        data_type: int64
        description: >-
          met_admin_benchmark_goal against the bare published standard, with no
          planning buffer. Internal rows only -- null on Benchmark rows and on
          Aimline rows, where met_admin_benchmark_goal is already unpadded and a
          second copy would be redundant.

          It is here so a consumer wanting an at-grade-level figure that IS
          comparable across the two PM methods has it without a model change.
          Binding it to a view in place of met_admin_benchmark_goal changes a
          published number, so that is T&L's call.
      - name: met_measure_name_code_goal
        data_type: int64
        description:
          1 when every measure standard under this measure_name_code met its
          goal, else 0.
      - name: met_pm_round_criteria
        data_type: int64
        description:
          The round-level rollup of met_measure_name_code_goal, combined by
          pm_goal_criteria.
      - name: met_pm_round_overall_criteria
        data_type: int64
        description:
          met_pm_round_criteria gated on participation, so a round counts as met
          only when the student was tested on everything it expected.
      - name: measure_standard_goal_status
        data_type: string
        description: >-
          met_measure_standard_goal as a label. The vocabulary differs by method
          on purpose -- Met / Not Met on Internal rows, Meeting Aimline / Below
          Aimline on Aimline rows, so a reader sees what the verdict is measured
          against. Not Tested on both where the student did not sit the measure,
          plus No Aimline Data on Aimline rows where Amplify published no
          verdict for a probe that WAS sat -- a state the Internal method has no
          equivalent for, and not a miss.

          Both PM branches populate this, so one BI field addresses either
          method; a view combining them needs its own colour legend, since the
          two value sets do not overlap except on Not Tested.
        config:
          meta:
            contains_pii: true
      - name: measure_name_code_goal_status
        data_type: string
        description: >-
          met_measure_name_code_goal as a label, and the twin of
          measure_standard_goal_status one grain up. Same value sets and the
          same method split -- Met / Not Met on Internal, Meeting Aimline /
          Below Aimline / No Aimline Data on Aimline, Not Tested on both.

          It answers a different question from its sibling, and the difference
          is large. The sibling reports one measure STANDARD; this reports
          whether the student met the goal on every standard under the measure
          name code. NWF and ORF have two standards each, the other codes one,
          so only those two differ -- but on ORF the gap is large, because the
          two ORF standards (Reading Fluency and Reading Accuracy) often
          disagree on student-rounds where both were scored.

          Use this column when a view is labelled by measure and the sibling
          when it is labelled by measure standard. Reading a standard-grain rate
          under a measure-grain label overstates attainment.
        config:
          meta:
            contains_pii: true
      - name: admin_benchmark_goal_status
        data_type: string
        description: >-
          met_admin_benchmark_goal as a label -- Met Benchmark, Did Not Meet
          Benchmark, or Not Tested where the student did not sit the measure.
          Populated on both PM methods.

          The only status column whose values read identically on both, because
          the benchmark standard is the one grain that does not depend on
          method. The other three carry aimline vocabulary on Aimline rows and
          internal vocabulary on Internal rows. The values name the benchmark
          explicitly so a reader can tell Met Benchmark from Meeting Aimline at
          a glance.

          Three-valued on both, with no No Aimline Data equivalent: a verdict
          needs only Amplify's published grade-level standard, which exists for
          every expected row this extract carries, so a student who sat the
          measure always has one.

          The bar differs by method even though the wording does not. See
          met_admin_benchmark_goal for the consequence.
        config:
          meta:
            contains_pii: true
      - name: pm_round_status
        data_type: string
        description: >-
          The round verdict as words -- Met / Not Met on Internal rows, Meeting
          Aimline / Below Aimline / No Aimline Data on Aimline rows, plus Round
          Incomplete and Not Tested on both. Separates a round that could not be
          evaluated from one that was failed.

          Round grain: a window max over the student's round broadcasts one
          value to every measure-standard row of that round.
      - name: aimline_cohort_level
        data_type: string
        description: >-
          The student's composite level at the benchmark that opened the PM
          season, Below Benchmark or Well Below Benchmark, and the cohort key
          the by-levels expectation gate is split on. Aimline rows only.
      - name: missed_aimline_consecutive
        data_type: int64
        description: >-
          1 when this round and the round the measure was previously expected in
          both fell below the aimline -- T&L's two-in-a-row signal, per measure
          and within one PM season. Aimline rows only.
        config:
          meta:
            contains_pii: true
      - name: aimline_round_category
        data_type: string
        description: >-
          The reporting category for the whole round rather than one measure
          standard, so a student appears once however many measures they sat.
          Aimline rows only. The roster's round_test_status decides first -- Not
          Tested and Round Incomplete rounds carry that label on every row --
          and a fully tested round takes the aimline model's round category, or
          Not Tested where the student has no row there.

          Below Aimline outranks No Aimline Data in this rollup, as academics
          confirmed: a student below the aimline on one measure and carrying no
          published aimline on another reads Below Aimline.

          Read this when a view spans every measure the round expected, and
          aimline_category when the view is scoped to a single measure standard.
          The two disagree by design: a student below the aimline on any one
          measure reads Below Aimline for the round, so the round-level share
          below is the higher of the two.
        config:
          meta:
            contains_pii: true
      - name: aimline_category
        data_type: string
        description: >-
          T&L's reporting category -- Meeting Aimline, Meeting Benchmark;
          Meeting Aimline, Not Yet at Benchmark; Below Aimline; No Aimline Data,
          Meeting Benchmark; No Aimline Data, Not Yet at Benchmark; or Round
          Incomplete. Aimline rows only, and Not Tested here where the student
          has no row in the aimline model at all.

          Round Incomplete and Not Tested are different states: Round Incomplete
          means the student sat some of the round's measures but not all, Not
          Tested means no row exists because they sat nothing. Do not collapse
          them.
        config:
          meta:
            contains_pii: true
      - name: expected_round_number
        data_type: string
        description:
          The expected PM round, or the Benchmark administration's round number,
          as a string for the Tableau filter.
      - name: expected_round_label
        data_type: string
        description: >-
          The PM round as a reader-facing label -- the season, a colon, and the
          round, e.g. `BOY->MOY: R1`. PM rows only; a benchmark administration
          has no PM round and would invent one.

          NOT purely cosmetic, although it looks it. Round numbers run 1-8
          uniquely across the year in the NJ regions, 1-4 in BOY->MOY and 5-8 in
          MOY->EOY -- but Miami runs THREE rounds per season where NJ runs four,
          so Miami's round 4 is in MOY->EOY while every NJ round 4 is in
          BOY->MOY. A filter on the bare number silently mixes two halves of the
          year.

          The ambiguity is latent rather than live: Miami currently produces no
          rows in this model at all (see the model description), so today every
          round number resolves to one season. It becomes real the day Miami
          appears.
      - name: expected_round_selection
        data_type: string
        description: >-
          The round as a filter value, with one substitution: on the row that IS
          its cohort's current round the value reads `Current` instead of the
          round label. Every other row carries its label, e.g. `BOY->MOY: R1`.
          Benchmark rows carry the administration season, or `Current` on the
          latest opened administration.

          It exists so one filter selection follows every region to wherever it
          actually is. Regions are not in step -- Miami can sit weeks behind the
          NJ regions on every round -- so a view pinned to a round number is
          wrong for somebody as soon as the calendars diverge. Selecting
          `Current` returns Camden's round 3 and Newark's round 4 together, each
          being that region's present round.

          The trade is deliberate: once a round is current for a region it is no
          longer selectable by number HERE. Camden's round 3 reads `Current`
          while Newark's round 3 reads its label, so "everyone's round 3" comes
          from expected_round_number or expected_round_label instead. The three
          columns are companions, not alternatives.

          Current means the latest round whose window has OPENED, per academic
          year, region and grade -- not the round whose window contains today,
          which would go blank between rounds. Before the first round of a year
          opens, no row is current and every row shows its label.

          Non-current rows carry the label rather than the bare number because
          round numbers are not unique network-wide: Miami runs three rounds per
          season where NJ runs four, so Miami's round 4 is MOY->EOY while every
          NJ round 4 is BOY->MOY.

          Evaluated at query time in the local timezone, so a Tableau extract
          freezes it at the nightly refresh and the dashboard reads as of last
          night.
      - name: measure_standard_round_verdicts
        data_type: string
        description: >-
          Every round of this season's verdicts for this measure standard, one
          character per round in round order, hyphen separated -- so a round 3
          row reads something like `B-B-A` and carries the student's whole
          season to date without the view having to stack rows.

          A is at or above -- Amplify's own wording for meeting the aimline, and
          met on the internal method. B is below, meaning below aimline or not
          met. ? is an aimline row Amplify published no value for, and . is a
          round the student did not test. The same letter means the same thing
          on both methods, which is the point of using one alphabet for two
          vocabularies, and A/B is the pair school leaders already read on
          Amplify's own reports. No token is the hyphen, so the string stays
          parseable when a student missed rounds -- `B-B-.` is three rounds, not
          four.

          Scoped to the administration season, so it never runs BOY->MOY into
          MOY->EOY -- the two seasons have different goals and a string spanning
          both would read as one trajectory when it is two. Null on Benchmark
          rows, which have no PM round sequence.

          Built over the expectation spine rather than over scored rows, so a
          round the student skipped appears as . rather than vanishing and
          shortening the string. The string length is therefore the number of
          rounds expected of that student in that season.

          Repeats on every row of its partition, being a season-level value on a
          round-level row. Count students on it only with a round filter, or it
          multiplies by the round count.

          Where the course-enrollment join fans a student out, a partition
          carries a round twice and its string holds a repeated character.
        config:
          meta:
            contains_pii: true
      - name: measure_name_code_benchmark_status
        data_type: string
        description: >-
          Whether the student met the benchmark standard on EVERY measure
          standard under this measure name code -- Met Benchmark, Did Not Meet
          Benchmark, or Not Tested. Populated on both PM methods.

          Not Tested carries two states that the extract's coalesce flattens
          into one. A LEFT JOIN miss means the student sat nothing. An explicit
          null from the intermediate means the student DID sit the round but
          Amplify published no benchmark goal for one of its measures, so the
          rollup has nothing to judge. The second state depends on Miami's null
          benchmark goals, and Miami produces no rows in this extract, so the
          conflation is latent, not live. It becomes real the day Miami appears,
          and the honest fix then is a fourth value rather than a wider Not
          Tested.

          The measure-name-code rung of the benchmark lens, between
          admin_benchmark_goal_status at measure-standard grain and
          round_benchmark_status at round grain.
        config:
          meta:
            contains_pii: true
      - name: round_benchmark_status
        data_type: string
        description: >-
          Whether the student met the benchmark standard on EVERY measure
          standard the round expected -- Met Benchmark, Did Not Meet Benchmark,
          or Not Tested, plus Round Incomplete on Aimline rows for a round the
          student did not finish (Internal rows still score partial rounds).
          Populated on both PM methods.

          Not Tested carries two states that the extract's coalesce flattens
          into one. A LEFT JOIN miss means the student sat nothing. An explicit
          null from the intermediate means the student DID sit the round but
          Amplify published no benchmark goal for one of its measures, so the
          rollup has nothing to judge. The second state depends on Miami's null
          benchmark goals, and Miami produces no rows in this extract, so the
          conflation is latent, not live. It becomes real the day Miami appears,
          and the honest fix then is a fourth value rather than a wider Not
          Tested.

          Round grain, so it repeats on every measure-standard row of that
          student's round. Count distinct students rather than rows.
        config:
          meta:
            contains_pii: true
      - name: measure_name_code_aimline_benchmark_status
        data_type: string
        description: >-
          T&L's combined reporting category rolled up to the measure name code
          -- the same seven values aimline_category carries at measure-standard
          grain, applied to the worst state the student holds on any standard
          under the code.

          Aimline rows only; the lens has no meaning without an aimline.
        config:
          meta:
            contains_pii: true
      - name: measure_name_code_trajectory_status
        data_type: string
        description: >-
          The trajectory category rolled up to the measure name code -- Below
          Aimline, On Aimline Below Benchmark, On Track to Benchmark, No Aimline
          Data, or Not Tested.

          Differs from measure_name_code_aimline_benchmark_status by ignoring
          round completion, which is the same distinction
          aimline_trajectory_category has from aimline_category one grain down.
          Aimline rows only.
        config:
          meta:
            contains_pii: true
      - name: round_trajectory_status
        data_type: string
        description: >-
          The trajectory category rolled up to the whole round, ignoring round
          completion. Same five values as the measure-name-code version.

          Aimline rows only, round grain, so it repeats across the round's
          measure-standard rows.
        config:
          meta:
            contains_pii: true
      - name: schedule_student_grade_level
        data_type: string
        description:
          Grade taken from the last character of the matched ELA course name.
      - name: measure_test_status
        data_type: string
        description: >-
          Whether THIS measure was tested — Tested or Not Tested. Row grain, so
          it is the field behind percent tested.

          Aggregate it per measure per round, never pooled. A single network
          figure hides the variation that matters: per-measure per-round rates
          within one season spread widely around the pooled figure.

          Group by expected_measure_standard, not expected_measure_name_code.
          The name code merges sub-measures off one probe, and while a pair is
          never split once both are expected, the two are not always both
          expected. Reading Accuracy is a BOY to MOY measure only, with zero
          expected rows in rounds 5 to 8 where Reading Fluency runs on, so a
          name-code rate blends two populations in one season and means only one
          of them in the other.

          Academics separate the two questions and this column is the measure
          half: a student who did not sit a measure the round expected did not
          test that measure, whatever the round's own state. round_test_status
          answers the round question, and the two agree — every measure in a Not
          Tested round reads Not Tested, every measure in a Fully Tested round
          reads Tested, and only a Round Incomplete round mixes them.

          Derived from whether a scored row joined, which is why this extract is
          the only place it can live: both PM criteria models carry scored rows
          only, so an untested measure has no row in them at all. The expected
          measure comes from the expectation gate this model joins.
      - name: scheduled
        data_type: int64
        description: 1 when the student matched an ELA section, else 0.
      - name: aimline_trajectory_category
        data_type: string
        description: >-
          Academics' four reporting buckets for the aimline views, plus the
          untested row. Five values — `Below Aimline`, `On Aimline, Below
          Benchmark`, `On Track to Benchmark`, `No Aimline Data` and `Not
          Tested`; the second carries a comma of its own, so quote it when
          filtering. Aimline rows only — null on the BM and Internal branches.
          Every aimline row lands in exactly one bucket, so the five sum to the
          expected rows and a percent-of-total stack needs no filtering.

          It crosses the two flags directly, `met_measure_standard_goal` for the
          verdict and `met_admin_benchmark_goal` for the trajectory, and that is
          deliberate rather than reading `aimline_category`. The category
          applies T&L's benchmark-wins rule, so rows below the aimline but at
          benchmark sit in Meeting Aimline, Meeting Benchmark — reporting a
          below-aimline row as meeting one. For the intervention-targeting views
          these buckets feed, the verdict is what academics mean.

          It also ignores round completeness, where `aimline_category` puts
          Round Incomplete first and overrides everything. Academics' legend has
          no Round Incomplete slice, so a row here classifies on its own verdict
          whatever the round's state. The two columns therefore disagree on
          Round Incomplete rows by design — do not union or compare them.
          `round_test_status` still carries the round question separately.
      - name: mtss_enrollment
        data_type: string
        description: MTSS programme the student is enrolled in, if any.
        config:
          meta:
            contains_pii: true
