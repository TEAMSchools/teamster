models:
  - name: rpt_tableau__dibels_dashboard
    description: >-
      Amplify DIBELS benchmark and progress-monitoring results. Network-wide,
      Miami included in principle — Miami is a DIBELS region with 48 AY2026 rows
      in the expected-assessments sheet and 20,698 AY2025 Amplify results. **In
      practice Miami still returns no rows here.** The grain filter reads `not
      s.is_self_contained`, which is null for every Miami row because Focus
      records no self-contained placement. #4968 and #5038 both decline to
      assert false for a fact the data does not carry, so Miami stays out until
      Focus supplies a placement field or Ops confirms a mapping. Ratified on
      #4996.

      The three `*_status` columns — `measure_standard_goal_status`,
      `admin_benchmark_goal_status`, `pm_round_status` — are labelled twins of
      the `met_*` flags beside them, so the dashboard's goal-type selector can
      pick a column instead of converting a flag. They are PM-only and null on
      every Benchmark row. On PM rows they are never null, because
      `int_amplify__pm_met_criteria` carries scored rows only and this model
      coalesces the resulting gap to `Not Tested` — a student who was expected
      to test and was not. So a null here means a Benchmark row, and nothing
      else.
    columns:
      - name: _dbt_source_relation
        data_type: string
        description:
          Source relation the row was unioned from. Encodes schema plus table
          name, so never join on it -- join the materialized
          _dbt_source_project.
      - name: academic_year
        data_type: int64
        description:
          Starting calendar year of the school year (e.g. 2025 for 2025-2026).
      - name: academic_year_display
        data_type: string
        description: The school year in its written form, e.g. 2025-2026.
      - name: district
        data_type: string
        description: Legal district entity the school belongs to.
      - name: state
        data_type: string
        description: Two-letter state code of the school.
      - name: region
        data_type: string
        description:
          The city form of the region -- Newark, Camden, Miami, Paterson.
      - name: school_level
        data_type: string
        description: Grade band of the school, e.g. ES, MS, HS.
      - name: schoolid
        data_type: int64
        description:
          PowerSchool school id. A database key, not a school-facing number.
      - name: school
        data_type: string
        description: School name.
      - name: studentid
        data_type: int64
        description:
          PowerSchool internal student key. Not the school-facing student
          number.
      - name: student_number
        data_type: int64
        description: Student Number assigned by the school. Indexed.
        config:
          meta:
            contains_pii: true
      - name: student_name
        data_type: string
        description: Student's name as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: grade_level_int
        data_type: int64
        description:
          Grade level the student is enrolled in, as an integer with K mapped to
          0.
      - name: is_out_of_district
        data_type: boolean
        description: Whether the student is placed outside the district.
      - name: gender
        data_type: string
        description: Gender as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: ethnicity
        data_type: string
        description: Race or ethnicity as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: is_homeless
        data_type: boolean
        description: Whether the student is identified as homeless.
        config:
          meta:
            contains_pii: true
      - name: iep_status
        data_type: string
        description: Special-education status as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: is_504
        data_type: boolean
        description: Whether the student has a Section 504 plan.
        config:
          meta:
            contains_pii: true
      - name: lep_status
        data_type: boolean
        description: Whether the student is identified as an English learner.
        config:
          meta:
            contains_pii: true
      - name: lunch_status
        data_type: string
        description: Free or reduced lunch eligibility as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: gifted_and_talented
        data_type: string
        description: Gifted-and-talented identification as recorded in the SIS.
        config:
          meta:
            contains_pii: true
      - name: enroll_status
        data_type: int64
        description: SIS enrollment status code. The dashboard keeps 0, 2 and 3.
      - name: advisory
        data_type: string
        description: Advisory or homeroom the student belongs to.
        config:
          meta:
            contains_pii: true
      - name: cohort
        data_type: int64
        description: Expected graduation year.
        config:
          meta:
            contains_pii: true
      - name: hos
        data_type: string
        description: Head of School for the student's school.
      - name: nj_student_tier
        data_type: string
        description: New Jersey intervention tier assigned to the student.
        config:
          meta:
            contains_pii: true
      - name: tutoring_nj
        data_type: boolean
        description:
          Whether the student is in the New Jersey tutoring programme.
        config:
          meta:
            contains_pii: true
      - name: is_sipps
        data_type: boolean
        description: Whether the student is in SIPPS instruction.
        config:
          meta:
            contains_pii: true
      - name: assessment_type
        data_type: string
        description:
          Whether the row is a Benchmark administration or a PM round.
      - name: model_type
        data_type: string
        description: >-
          Which data model produced the row -- BM for Benchmark, Internal for
          the in-house PM goal method, Aimline for Amplify's per-student
          aimline. Both PM methods run K-8 in parallel, so any view that counts
          PM rows must filter this column or every eligible student is counted
          once per method.
      - name: expected_start_date
        data_type: date
        description:
          First day of the expected round or administration window, from the
          expectation gate.
      - name: expected_end_date
        data_type: date
        description:
          Last day of the expected round or administration window, from the
          expectation gate.
      - name: expected_test
        data_type: string
        description: The administration or PM season the row is expected in.
      - name: expected_month_round
        data_type: string
        description: Calendar month of the expected window.
      - name: expected_grade_level_int
        data_type: int64
        description: Grade the assessment is expected at, as an integer.
      - name: expected_measure_name_code
        data_type: string
        description: Short code of the measure expected in this round.
      - name: expected_measure_name
        data_type: string
        description: Full name of the measure expected in this round.
      - name: expected_measure_standard
        data_type: string
        description: The measure standard expected in this round.
      - name: admin_goal_season
        data_type: string
        description: The administration the Benchmark goal applies to.
      - name: admin_goal
        data_type: float64
        description:
          The school's Benchmark goal for this grade and administration, from
          the BM goals sheet. Never padded.
      - name: admin_goal_grade_range
        data_type: float64
        description: The grade-range Benchmark goal, from the BM goals sheet.
      - name: n_admin_season_school_gl_all
        data_type: int64
        description: Students at the school in this grade and administration.
      - name: n_admin_season_school_gl_at_above
        data_type: int64
        description:
          Students at the school in this grade and administration scoring At or
          Above Benchmark.
      - name: n_admin_season_school_gl_bl_wb
        data_type: int64
        description:
          Students at the school in this grade and administration scoring Below
          or Well Below Benchmark.
      - name: n_admin_season_school_gl_at_above_expected
        data_type: int64
        description:
          Students the school's goal implies should score At or Above Benchmark.
      - name: n_admin_season_school_gl_at_above_gap
        data_type: float64
        description:
          Distance between the school's At or Above count and its goal.
      - name: n_admin_season_region_gl_all
        data_type: int64
        description: Students in the region in this grade and administration.
      - name: n_admin_season_region_gl_at_above
        data_type: int64
        description:
          Students in the region in this grade and administration scoring At or
          Above Benchmark.
      - name: n_admin_season_region_gl_bl_wb
        data_type: int64
        description:
          Students in the region in this grade and administration scoring Below
          or Well Below Benchmark.
      - name: n_admin_season_region_gl_at_above_expected
        data_type: int64
        description:
          Students the region's goal implies should score At or Above Benchmark.
      - name: n_admin_season_region_gl_at_above_gap
        data_type: float64
        description:
          Distance between the region's At or Above count and its goal.
      - name: grade_level
        data_type: int64
        description:
          Grade the assessment is expected at, as an integer. Duplicated from
          the expectation gate for the workbook's convenience.
      - name: expected_grade_level
        data_type: string
        description: Grade the assessment is expected at, in its written form.
      - name: average_starting_words
        data_type: int64
        description:
          The cohort's starting average for the measure, from the frozen PM
          goals sheet.
      - name: pm_round_days
        data_type: int64
        description: In-session school days in this round's window.
      - name: pm_days
        data_type: int64
        description: Total in-session school days across the season's PM rounds.
      - name: benchmark_goal
        data_type: float64
        description:
          Amplify's published grade-level standard for the season, unpadded.
      - name: benchmark_goal_padded
        data_type: float64
        description:
          The published standard plus academics' 3-word planning buffer. The
          figure every internal calculation reads and the bar its at-grade-level
          verdict compares against.
      - name: required_growth_words
        data_type: int64
        description:
          The gap the cohort owes for the season -- benchmark_goal_padded minus
          starting_words.
      - name: daily_growth_rate
        data_type: float64
        description: Words of growth owed per school day.
      - name: round_growth_words_goal
        data_type: int64
        description:
          This round's share of the season's growth, proportional to its school
          days. The season's first round also carries starting_words.
      - name: goal
        data_type: float64
        description:
          The running growth target the score is compared against for this round
          -- cumulative_growth_words from the frozen PM goals sheet.
        config:
          meta:
            contains_pii: true
      - name: schedule_student_number
        data_type: int64
        description:
          Student number on the matched course-enrollment row. Null where no ELA
          section matched.
      - name: teacherid
        data_type: int64
        description: PowerSchool teacher id on the matched ELA section.
      - name: teacher_name
        data_type: string
        description: Teacher of the matched ELA section.
        config:
          meta:
            contains_pii: true
      - name: course_name
        data_type: string
        description: Name of the matched ELA course.
      - name: course_number
        data_type: string
        description: Course number of the matched ELA section.
      - name: section_number
        data_type: string
        description: Section number of the matched ELA section.
      - name: mclass_student_number
        data_type: int64
        description:
          Student number on the matched Amplify score row. Null where the
          student was not scored.
      - name: assessment_grade
        data_type: string
        description: Grade level of the assessment administered.
      - name: period
        data_type: string
        description:
          For a Benchmark row the administration -- BOY, MOY or EOY. For a PM
          row the PM season, BOY->MOY or MOY->EOY.
      - name: client_date
        data_type: date
        description: Date the probe was administered on the device.
      - name: start_date
        data_type: date
        description: First day of the round or administration window.
      - name: end_date
        data_type: date
        description: Last day of the round or administration window.
      - name: measure_name
        data_type: string
        description: Full measure name, e.g. Oral Reading Fluency.
      - name: measure_name_code
        data_type: string
        description:
          Short measure abbreviation, e.g. ORF from Reading Fluency (ORF). NWF
          and ORF are the only codes holding more than one standard.
      - name: measure_standard
        data_type: string
        description:
          The individual measure evaluated -- Reading Fluency (ORF) and Reading
          Accuracy (ORF-Accu) are separate standards under one code.
      - name: measure_standard_score
        data_type: float64
        description:
          The score recorded for the measure. On a PM row this is the student's
          best score for that measure in that round.
        config:
          meta:
            contains_pii: true
      - name: measure_standard_level
        data_type: string
        description:
          Amplify's benchmark level for the score, e.g. At or Above Benchmark.
          Benchmark rows only.
        config:
          meta:
            contains_pii: true
      - name: measure_standard_level_int
        data_type: int64
        description: measure_standard_level as an ordinal. Benchmark rows only.
      - name: measure_percentile
        data_type: float64
        description: National percentile for the score. Benchmark rows only.
        config:
          meta:
            contains_pii: true
      - name: measure_semester_growth
        data_type: string
        description:
          Amplify's semester growth classification. Benchmark rows only.
      - name: measure_year_growth
        data_type: string
        description: Amplify's year growth classification. Benchmark rows only.
      - name: boy_composite
        data_type: string
        description: The student's BOY composite level.
        config:
          meta:
            contains_pii: true
      - name: moy_composite
        data_type: string
        description: The student's MOY composite level.
        config:
          meta:
            contains_pii: true
      - name: eoy_composite
        data_type: string
        description: The student's EOY composite level.
        config:
          meta:
            contains_pii: true
      - name: aggregated_measure_standard_level
        data_type: string
        description:
          Composite level rolled up across the measures in the administration.
          Benchmark rows only.
      - name: foundation_measure_standard_level
        data_type: string
        description:
          Level used by the Foundations goal tracker. Benchmark rows only.
      - name: expected_row_count
        data_type: int64
        description:
          How many measures the round expected of this student, from the
          expectation gate.
      - name: actual_row_count
        data_type: int64
        description:
          How many of the round's expected measures the student was actually
          scored on, counted per data method.
      - name: completed_test_round
        data_type: boolean
        description:
          Whether the student was tested on every measure the round expected.
      - name: completed_test_round_int
        data_type: int64
        description:
          completed_test_round as 1/0, for aggregation in the BI layer.
      - name: met_measure_standard_goal
        data_type: int64
        description:
          1 when the score reaches the round's cumulative growth target for this
          measure standard, else 0. Internal method.
      - name: met_admin_benchmark_goal
        data_type: int64
        description:
          1 when the score reaches the benchmark goal -- at grade level rather
          than on pace. Recomputed each round and not latched.
      - name: met_measure_name_code_goal
        data_type: int64
        description:
          1 when every measure standard under this measure_name_code met its
          goal, else 0.
      - name: met_pm_round_criteria
        data_type: int64
        description:
          The round-level rollup of met_measure_name_code_goal, combined by
          pm_goal_criteria.
      - name: met_pm_round_overall_criteria
        data_type: int64
        description:
          met_pm_round_criteria gated on participation, so a round counts as met
          only when the student was tested on everything it expected.
      - name: measure_standard_goal_status
        data_type: string
        description:
          met_measure_standard_goal as a label -- Met or Not Met, or Not Tested
          where no evaluation exists.
      - name: admin_benchmark_goal_status
        data_type: string
        description:
          met_admin_benchmark_goal as a label -- Met or Not Met, or Not Tested
          where no evaluation exists.
      - name: pm_round_status
        data_type: string
        description: >-
          The round verdict as words -- Met, Not Met, Round Incomplete, or Not
          Tested. Separates a round that could not be evaluated from one that
          was failed.
      - name: aimline_cohort_level
        data_type: string
        description: >-
          The student's composite level at the benchmark that opened the PM
          season, Below Benchmark or Well Below Benchmark, and the cohort key
          the by-levels expectation gate is split on. Aimline rows only.
      - name: aimline_status
        data_type: string
        description: >-
          Amplify's published verdict on whether the probe sat at or above the
          student's individual aimline. Aimline rows only; null where Amplify
          published none.
        config:
          meta:
            contains_pii: true
      - name: met_aimline_goal
        data_type: int64
        description: >-
          aimline_status as a flag -- 1 At or Above, 0 Below, null where Amplify
          published no verdict. Null is not a miss. Aimline rows only.
        config:
          meta:
            contains_pii: true
      - name: missed_aimline_consecutive
        data_type: int64
        description: >-
          1 when this round and the round the measure was previously expected in
          both fell below the aimline -- T&L's two-in-a-row signal, per measure
          and within one PM season. Aimline rows only.
        config:
          meta:
            contains_pii: true
      - name: aimline_category
        data_type: string
        description: >-
          T&L's reporting category -- Meeting Aimline On-Track, Meeting Aimline
          Off-Track, Below Aimline, Not Tested, or No Aimline Status. Aimline
          rows only.
        config:
          meta:
            contains_pii: true
      - name: expected_round_number
        data_type: string
        description: The expected PM round, as a string for the Tableau filter.
      - name: schedule_student_grade_level
        data_type: string
        description:
          Grade taken from the last character of the matched ELA course name.
      - name: scheduled
        data_type: int64
        description: 1 when the student matched an ELA section, else 0.
      - name: mtss_enrollment
        data_type: string
        description: MTSS programme the student is enrolled in, if any.

        config:
          meta:
            contains_pii: true
