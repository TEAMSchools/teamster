models:
  - name: rpt_tableau__operations_ekg
    description: >-
      Extract of Operations EKG walkthrough form responses, one row per
      (response_id, question_id). The roster join resolves respondent identity
      via sam_account_name OR google_email, so the combination stays unique only
      so long as no roster row matches through one branch while a different row
      matches through the other.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - response_id
              - question_id
    columns:
      - name: location_clean_name
        data_type: string
        description: >-
          The respondent's own canonical location from
          int_people__location_crosswalk, resolved through the roster join on
          respondent_email. This is where the walkthrough's author works, NOT
          the school they walked — use school_clean_name to scope a row to the
          observed school. Retired name aliases collapse onto their canonical
          clean name here.
        data_tests:
          - not_null
      - name: home_business_unit_name
        data_type: string
        description: >-
          The respondent's own legal entity, from the roster join. This does NOT
          drive the Tableau entity gate on this model — use
          school_business_unit_name, the entity of the school that was walked.
          Central-office respondents walk schools in every region, and no
          respondent on this form is based in KIPP Paterson.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TEAM Academy Charter School
                  - KIPP Cooper Norcross Academy
                  - KIPP Miami
                  - KIPP Paterson
                  - KIPP TEAM and Family Schools Inc.
      - name: school_clean_name
        data_type: string
        description: >-
          The walked school resolved to its canonical name via
          int_people__location_crosswalk, so every alias of one school collapses
          to a single value. This is the column a Tableau location gate scopes
          on. Null when the form label is absent from the crosswalk, which is
          also when school_business_unit_name and grade_band are null.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: school_business_unit_name
        data_type: string
        description: >-
          Legal entity that owns the walked school, from
          int_people__location_crosswalk. This is the column a Tableau entity
          gate scopes on, NOT home_business_unit_name — that one is the
          respondent's own entity, and central-office staff walk schools in
          every region. Takes four values, not the five home_business_unit_name
          takes — KIPP TEAM and Family Schools Inc. owns no school, so it never
          appears here. Null when the form label is absent from the crosswalk.
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values:
                  - TEAM Academy Charter School
                  - KIPP Cooper Norcross Academy
                  - KIPP Miami
                  - KIPP Paterson
      - name: respondent
        data_type: string
      - name: google_email
        data_type: string
      - name: campus_name
        data_type: string
      - name: home_department_name
        data_type: string
      - name: job_function
        data_type: string
        description: >-
          Drives the Tableau role predicate. Null where the roster records no
          job function for the person.
      - name: job_title
        data_type: string
      - name: mail
        data_type: string
        description: Post-cutover Tableau identity.
      - name: user_principal_name
        data_type: string
      - name: sam_account_name
        data_type: string
      - name: reports_to_mail
        data_type: string
      - name: reports_to_sam_account_name
        data_type: string
      - name: form_id
        data_type: string
      - name: survey_title
        data_type: string
      - name: item_id
        data_type: string
      - name: section_title
        data_type: string
      - name: question_id
        data_type: string
      - name: question_title
        data_type: string
      - name: item_abbreviation
        data_type: string
      - name: response_id
        data_type: string
      - name: last_submitted_date_local
        data_type: date
      - name: respondent_email
        data_type: string
      - name: text_value
        data_type: string
      - name: text_value_int
        data_type: int64
      - name: walkthrough_round
        data_type: string
      - name: grade_band
        data_type: string
        description: >-
          Grade band of the walked school, from int_people__location_crosswalk.
          Null when the form's school label is absent from the crosswalk.
