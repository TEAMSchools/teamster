models:
  - name: rpt_tableau__fresh_dashboard_qc
    description: >
      Data-quality worklist for SRE, one row per student per data problem. Takes
      the current-timeframe roster from int_tableau__finalsite_student_scaffold,
      reduces it to one row per student, then unpivots the mismatch flags and
      keeps only the rows where a flag is true -- so a student appears once for
      each thing needing a fix, up to four times, and not at all when clean.
      Each row pairs the Finalsite values with the SIS values they were compared
      against so the fix is actionable without a second lookup. See
      docs/models/fresh-dashboard-data-model.md.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - enrollment_academic_year
              - finalsite_id
              - flag_name
          config:
            severity: error
    columns:
      - name: flag_name
        data_type: string
        description: >
          Which problem fired -- is_enroll_status_mismatch,
          is_grade_level_mismatch, is_school_mismatch, or is_missing_sis_record.
          The first three are computed on
          int_tableau__finalsite_student_scaffold; is_missing_sis_record is
          derived here, and fires when Finalsite says a student is Enrolled but
          no SIS enrollment record matched at all -- distinct from
          is_enroll_status_mismatch, which compares a status against a record
          that does exist. The two need different fixes: create or link the
          record, versus correct a status.
      - name: flag_value
        data_type: bool
        description: >
          Always true. The unpivot keeps only fired flags, so this column exists
          to make that filter explicit rather than to carry information.
      - name: enrollment_academic_year
        data_type: int64
        description: >
          The Finalsite recruitment cycle this record belongs to, in start-year
          form (AY2026-2027 = 2026).
      - name: enrollment_academic_year_display
        data_type: string
        description: The same cycle in hyphenated short form, e.g. "2026-27".
      - name: org
        data_type: string
        description: Always "KTAF" (verified constant, network-wide).
      - name: region
        data_type: string
        description: One of "Newark", "Camden", "Miami", "Paterson".
      - name: schoolid
        data_type: int64
        description: >
          PowerSchool-space school id the student is assigned to in Finalsite. 0
          when Finalsite has no school assigned. Compare against sis_schoolid.
      - name: school
        data_type: string
        description: >
          Short school abbreviation for schoolid, or "No School Assigned" when
          Finalsite has none.
      - name: finalsite_id
        data_type: string
        description: >
          Finalsite enrollment id. Together with enrollment_academic_year and
          flag_name this is the grain of the worklist, and it is the id SRE uses
          to find the record in Finalsite.
        config:
          meta:
            contains_pii: true
      - name: powerschool_student_number
        data_type: int64
        description: >
          Student number as reported by Finalsite. Null for applicants with no
          SIS identity yet, which is expected on is_missing_sis_record rows.
        config:
          meta:
            contains_pii: true
      - name: first_name
        data_type: string
        description:
          Student first name, included so SRE can identify the record.
        config:
          meta:
            contains_pii: true
      - name: last_name
        data_type: string
        description: Student last name, included so SRE can identify the record.
        config:
          meta:
            contains_pii: true
      - name: grade_level
        data_type: int64
        description: >
          Grade level as reported by Finalsite (PK = -1, K = 0, 1-12 as
          themselves). Compare against sis_grade_level.
      - name: self_contained
        data_type: string
        description: >
          Finalsite self-contained special-education indicator. Source values
          are mixed ("Yes", "No", and a literal "false"), so treat it as a label
          rather than a clean boolean.
      - name: enrollment_type
        data_type: string
        description: >
          "New" or "Returning" -- whether Finalsite is recruiting this student
          into the network or re-enrolling them.
      - name: latest_status
        data_type: string
        description: >
          The student's most recent Finalsite status for this cycle. This is
          what the expected enrollment status is derived from, so it is usually
          the field to check first when a flag looks wrong.
      - name: sis_enroll_status
        data_type: int64
        description: >
          Enrollment status from the matched SIS record (PowerSchool, or Focus
          for Miami) -- 0 currently enrolled, 2 withdrawn, 3 graduated. Null
          means no SIS record matched, which is what is_missing_sis_record
          flags. Named sis_ here to pair with finalsite_expected_enroll_status;
          the upstream column on int_tableau__finalsite_student_scaffold is
          still enroll_status, because the other two fresh_dashboard views
          expose it under that name.
      - name: sis_grade_level
        data_type: int64
        description: Grade level from the matched SIS enrollment record.
      - name: sis_schoolid
        data_type: int64
        description: School id from the matched SIS enrollment record.
      - name: sis_school
        data_type: string
        description: School name from the matched SIS enrollment record.
      - name: finalsite_expected_enroll_status
        data_type: int64
        description: >
          Enrollment status implied by the Finalsite latest_status (0 =
          Enrolled, 1 = Mid Year Withdrawal/Never Attended/Summer Withdraw), for
          comparison against sis_enroll_status. This is what the SIS ought to
          show if Finalsite is correct -- it is derived entirely from Finalsite
          and reads nothing from the SIS. Null for most of the funnel, where an
          applicant has no business having an SIS record yet and no mismatch can
          fire.
