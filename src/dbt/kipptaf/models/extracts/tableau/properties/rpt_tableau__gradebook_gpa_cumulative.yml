models:
  - name: rpt_tableau__gradebook_gpa_cumulative
    description: >-
      One row per student, at that student's most recent undergraduate
      enrollment (rn_undergrad = 1). Scoped to MS and HS school levels and to
      active or graduated enroll_status (0 or 3); out-of-district placements
      excluded. Cumulative GPA and attendance are a snapshot as of that most
      recent enrollment's year — not necessarily the current academic year for a
      graduated or long-inactive student.
    columns:
      - name: _dbt_source_relation
        data_type: string
        description: Source relation identifier from dbt_utils.union_relations.
      - name: studentid
        data_type: int64
        description:
          The internal number and ID of the associated Students record.
      - name: student_number
        data_type: int64
        description: District student number.
      - name: student_name
        data_type: string
        description: Student full name (last, first).
      - name: enroll_status
        data_type: int64
        description: >-
          PowerSchool enroll_status at the most recent enrollment (0 active or 3
          graduated; row is filtered to these two values).
      - name: cohort
        data_type: int64
        description: Graduation cohort year.
      - name: gender
        data_type: string
        description: Student gender code.
      - name: ethnicity
        data_type: string
        description: Student ethnicity code.
      - name: yearid
        data_type: int64
        description:
          PowerSchool year id of the most recent undergrad enrollment.
      - name: region
        data_type: string
        description: District region.
      - name: school_level
        data_type: string
        description:
          School level at the most recent enrollment (MS or HS; filtered).
      - name: schoolid
        data_type: int64
        description:
          School_Number of the most recent undergrad enrollment school.
      - name: school
        data_type: string
        description: School name.
      - name: most_recent_grade_level
        data_type: int64
        description: Grade level at the most recent undergrad enrollment.
      - name: advisory
        data_type: string
        description: Advisory/homeroom name at the most recent enrollment.
      - name: year_in_school
        data_type: int64
        description:
          Years enrolled at the school as of the most recent enrollment.
      - name: year_in_network
        data_type: int64
        description:
          Years enrolled in the network as of the most recent enrollment.
      - name: rn_undergrad
        data_type: int64
        description: >-
          Row number over undergrad enrollments (1 = most recent); always 1
          here, since the model is filtered to it.
      - name: is_pathways
        data_type: boolean
        description: Self-contained (Pathways) program flag.
      - name: is_out_of_district
        data_type: boolean
        description:
          Out-of-district placement flag (always false here; filtered).
      - name: is_retained_year
        data_type: boolean
        description: Retained in the most recent enrollment's academic year.
      - name: is_retained_ever
        data_type: boolean
        description: Ever retained.
      - name: lunch_status
        data_type: string
        description: Free/reduced lunch status code.
      - name: lep_status
        data_type: boolean
        description: English learner status.
      - name: gifted_and_talented
        data_type: string
        description: Gifted and talented status.
      - name: iep_status
        data_type: string
        description: IEP status label.
      - name: is_504
        data_type: boolean
        description: Section 504 plan flag.
      - name: salesforce_id
        data_type: string
        description: KIPP Forward Salesforce contact id.
      - name: ktc_cohort
        data_type: int64
        description: KIPP Through College cohort year.
      - name: is_counseling_services
        data_type: int64
        description: Counseling services flag.
      - name: is_student_athlete
        data_type: int64
        description: Student athlete flag.
      - name: ada_above_or_at_80
        data_type: boolean
        description: >-
          ADA at or above 80 percent in the most recent enrollment's academic
          year.
      - name: hos
        data_type: string
        description: Head of school name.
      - name: cumulative_y1_gpa
        data_type: float64
        description:
          Cumulative weighted Y1 GPA as of the most recent enrollment.
      - name: cumulative_y1_gpa_unweighted
        data_type: float64
        description:
          Cumulative unweighted Y1 GPA as of the most recent enrollment.
      - name: cumulative_y1_gpa_projected
        data_type: float64
        description: Projected cumulative weighted Y1 GPA.
      - name: cumulative_y1_gpa_projected_s1
        data_type: float64
        description: S1-basis projected cumulative Y1 GPA.
      - name: cumulative_y1_gpa_projected_s1_unweighted
        data_type: float64
        description: S1-basis projected cumulative unweighted Y1 GPA.
      - name: cumulative_y1_gpa_projected_unweighted
        data_type: float64
        description: Projected cumulative unweighted Y1 GPA.
      - name: core_cumulative_y1_gpa
        data_type: float64
        description: Cumulative Y1 GPA over core courses.
      - name: student_slideback
        data_type: boolean
        description: Student slideback flag from enrollment reporting.
      - name: most_recent_ada
        data_type: float64
        description: >-
          Average daily attendance for the most recent enrollment's academic
          year.
