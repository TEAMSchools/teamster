models:
  - name: rpt_tableau__dibels_brightspots
    description: >-
      DIBELS Bright Spots tracker (#4952): school/region-grain attainment
      against KIPP Foundation's unpadded benchmark goals, tiered into Bright
      Spot / On Track / In Range / Off Track. Grain is academic_year, region,
      grade_level, period, population, goal_type -- not student-level. A single
      student can contribute to more than one population row (an IEP student
      counts toward both All and IEP). Reads the same student population as
      rpt_tableau__dibels_dashboard (Reading iready_subject, excludes
      self-contained and out-of-district, active/withdrawn/graduated
      enrollment), scoped to Benchmark Composite only -- this tracker does not
      use PM data. See the dibels-dashboard skill for the goal/tier join rules
      and the gap-rounding rationale. TODO: add an exposure entry here once a
      Tableau workbook is built against this model.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - region
              - grade_level
              - period
              - population
              - goal_type
    columns:
      - name: academic_year
        data_type: int64
        description: Fall-start convention -- 2025 means school year 2025-26.
      - name: region
        data_type: string
      - name: grade_level
        data_type: int64
        description: Individual grade, K = 0.
      - name: period
        data_type: string
        description: MOY or EOY.
      - name: population
        data_type: string
        description: All, IEP or MLL.
      - name: goal_type
        data_type: string
        description: At/Above or Well Below.
      - name: grade_band
        data_type: string
        description: >-
          GK-5 or G6-8, from the matching foundation goals row. Drives which
          tier lookup row applies.
      - name: brightspot_status
        data_type: string
        description: Bright Spot, On Track, In Range or Off Track.
      - name: n_all
        data_type: int64
        description: >-
          Count of students in this academic_year/region/grade_level/period/
          population group.
      - name: n_attained
        data_type: int64
        description: >-
          Count of n_all meeting goal_type -- at/above benchmark when goal_type
          is At/Above, well below benchmark when Well Below.
      - name: attained_rate
        data_type: float64
        description: n_attained / n_all.
      - name: grade_goal
        data_type: float64
        description: >-
          The unpadded Foundation goal rate for this
          region/grade_level/period/population/goal_type, from
          stg_google_sheets__dibels_foundation_goals.
      - name: gap
        data_type: float64
        description: >-
          attained_rate minus grade_goal in percentage points for At/Above,
          sign-flipped (grade_goal minus attained_rate) for Well Below so
          positive always means better-than-goal. Rounded to the nearest whole
          point before the tier lookup, since T&L's tier boundaries are written
          as whole numbers with no stated rule for a continuous value that falls
          between two adjacent boundaries.
      - name: n_above_average_growth
        data_type: int64
        description: >-
          Count of n_all where is_above_average_growth is true on
          int_amplify__all_assessments -- Amplify's own national growth norm
          (Above Average or Well Above Average), not a rate against this
          population's own average growth. The latter is a distinct, unresolved
          ask -- see the dibels-dashboard skill.
      - name: pct_above_average_growth
        data_type: float64
        description: >-
          n_above_average_growth / n_all. Null on BOY rows -- there is no prior
          period to grow from, so the concept does not apply yet.
