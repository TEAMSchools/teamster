models:
  - name: rpt_tableau__pm_outlier_detection
    columns:
      - name: location_clean_name
        data_type: string
        description: >-
          Canonical location from int_people__location_crosswalk. Drives the
          Tableau location gate; retired name aliases collapse onto their
          canonical clean name here. Describes the observed teacher, whose
          access this column gates.
        data_tests:
          - not_null
      - name: home_business_unit_name
        data_type: string
        description: >-
          Legal entity. Drives the Tableau entity gate. Never location_region,
          which is a property of the location rather than the person.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TEAM Academy Charter School
                  - KIPP Cooper Norcross Academy
                  - KIPP Miami
                  - KIPP Paterson
                  - KIPP TEAM and Family Schools Inc.
      - name: observer_employee_number
        data_type: int64
      - name: academic_year
        data_type: int64
      - name: reporting_term
        data_type: string
      - name: pc1_current
        data_type: float64
      - name: pc1_global
        data_type: float64
