models:
  - name: rpt_tableau__operations_pm
    columns:
      - name: location_clean_name
        data_type: string
        description: >-
          Canonical location from int_people__location_crosswalk. Drives the
          Tableau location gate; retired name aliases collapse onto their
          canonical clean name here.
        data_tests:
          - not_null
      - name: home_business_unit_name
        data_type: string
        description: >-
          Legal entity. Drives the Tableau entity gate. Never location_region,
          which is a property of the location rather than the person.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TEAM Academy Charter School
                  - KIPP Cooper Norcross Academy
                  - KIPP Miami
                  - KIPP Paterson
                  - KIPP TEAM and Family Schools Inc.
      - name: academic_year
        data_type: int64
      - name: type
        data_type: string
      - name: code
        data_type: string
      - name: name
        data_type: string
      - name: employee_number
        data_type: int64
      - name: formatted_name
        data_type: string
      - name: job_title
        data_type: string
      - name: home_work_location_abbreviation
        data_type: string
      - name: reports_to_formatted_name
        data_type: string
      - name: form_id
        data_type: string
      - name: survey_title
        data_type: string
      - name: item_id
        data_type: string
      - name: section_title
        data_type: string
      - name: question_id
        data_type: string
      - name: question_title
        data_type: string
      - name: item_abbreviation
        data_type: string
      - name: response_id
        data_type: string
      - name: last_submitted_date_local
        data_type: date
      - name: respondent_email
        data_type: string
      - name: text_value
        data_type: string
      - name: text_value_int
        data_type: int64
      - name: form_employee_number
        data_type: int64
      - name: round_survey
        data_type: string
      - name: abbreviation
        data_type: string
      - name: grade_band
        data_type: string
      - name: campus_name
        data_type: string
      - name: home_department_name
        data_type: string
      - name: job_function
        data_type: string
        description: Drives the AP role predicate; NULL for 63 active staff.
      - name: mail
        data_type: string
        description: Post-cutover Tableau identity.
      - name: user_principal_name
        data_type: string
      - name: sam_account_name
        data_type: string
      - name: reports_to_mail
        data_type: string
      - name: reports_to_sam_account_name
        data_type: string
      - name: respondent_name
        data_type: string
      - name: respondent_job_title
        data_type: string
      - name: completion
        data_type: int64
