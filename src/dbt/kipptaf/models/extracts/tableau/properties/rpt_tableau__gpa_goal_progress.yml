models:
  - name: rpt_tableau__gpa_goal_progress
    description: >-
      The Cumulative GPA Monitor's single data source. Passes through every
      column of rpt_tableau__gpa_cumulative_year unchanged and adds the GPA goal
      that applies to each student, at the network, region, and school rung.
      Exists as a separate model rather than columns on the extract because two
      published dashboards read the extract through a Tableau relationship that
      declares it unique, and it is a view, so a fan-out there would ship
      silently. Fold this model into the extract once that change can be made
      behind its own controls, then disable this one. Every passthrough column
      is listed explicitly because the repo forbids `select *` in a final rpt_
      select — so a column added to rpt_tableau__gpa_cumulative_year does NOT
      appear here automatically and must be added to this model's select list
      and to this contract by hand.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
          config:
            severity: error
    columns:
      - name: _dbt_source_relation
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: _dbt_source_project
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: studentid
        data_type: int64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: academic_year
        data_type: int64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: schoolid
        data_type: int64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: grade_level
        data_type: int64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: is_projected
        data_type: boolean
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: earned_credits_cum
        data_type: float64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: potential_gpa_credits_cum
        data_type: float64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: cumulative_y1_gpa
        data_type: float64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: cumulative_y1_gpa_unweighted
        data_type: float64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: student_number
        data_type: int64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: student_name
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: academic_year_display
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: region
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: school_level
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: school
