      - name: school_leader_tableau_username
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: cumulative_y1_gpa_unweighted_as_of_today
        data_type: float64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: gpa_needed_for_cumulative_3_0
        data_type: float64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: is_cumulative_3_0_attainable
        data_type: boolean
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: potential_gpa_credits_current_year
        data_type: float64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: is_latest_graded_year
        data_type: boolean
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: is_on_cusp_3_0
        data_type: boolean
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: gpa_band_label
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: gpa_band_as_of_today_label
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: gpa_goal_threshold
        data_type: numeric
        description: >-
          Cumulative unweighted GPA the student must reach to count toward their
          grade's goal. Comes from the network-rung goal, so it is NULL only for
          a grade with no goal at all, which today means every grade below 9.
      - name: gpa_goal_proportion_org
        data_type: numeric
        description: >-
          Target share of students network-wide expected to reach the threshold,
          as a proportion. NULL only for a grade with no goal at all. Every
          grade that has a goal has a network-rung target, so this is the column
          to test when you want to know whether a student has a goal.
      - name: gpa_goal_proportion_region
        data_type: numeric
        description: >-
          Target share for the student's region, as a proportion. NULL when no
          region-rung goal is defined for that region and grade. This does NOT
          mean the student has no goal — the network target in
          gpa_goal_proportion_org still applies. Miami has no region-rung goals
          today, so every Miami row is NULL here while carrying a network goal.
          Do not filter on this column to find students with goals; use
          gpa_goal_proportion_org.
      - name: gpa_goal_proportion_school
        data_type: numeric
        description: >-
          Target share for the student's school, as a proportion. NULL when no
          school-rung goal is defined for that school and grade, on the same
          basis as gpa_goal_proportion_region — a NULL here does not mean the
          student has no goal.
