      - name: school_leader
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: school_leader_tableau_username
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: cumulative_y1_gpa_unweighted_as_of_today
        data_type: float64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: gpa_needed_for_cumulative_3_0
        data_type: float64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: is_cumulative_3_0_attainable
        data_type: boolean
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: potential_gpa_credits_current_year
        data_type: float64
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: is_latest_graded_year
        data_type: boolean
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: is_on_cusp_3_0
        data_type: boolean
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: gpa_band_label
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: gpa_band_as_of_today_label
        data_type: string
        description:
          Passthrough from `rpt_tableau__gpa_cumulative_year`, unchanged.
      - name: gpa_goal_threshold
        data_type: numeric
        description: >-
          Cumulative unweighted GPA the student must reach to count toward their
          grade's goal, from the network-rung goal. NULL when no goal applies to
          the row: any grade below 9, and every academic year before 2025, since
          the goals sheet only carries 2025 onward. The dashboard compares with
          `>=`; see gpa_goal_proportion_org.
      - name: gpa_goal_proportion_org
        data_type: numeric
        description: >-
          Target share of students network-wide expected to reach the threshold,
          as a proportion. NULL exactly when gpa_goal_threshold is NULL — a
          grade below 9, or an academic year the goals sheet does not cover
          (anything before 2025). This is the column to test when you want to
          know whether a row has a goal at all. The goal is stated as a share
          reaching the threshold, so the comparison is `>=`; the underlying
          `direction` is not carried on this model, and a change to it upstream
          would not be reflected here.
      - name: gpa_goal_proportion_region
        data_type: numeric
        description: >-
          Target share for the student's region, as a proportion. NULL when the
          region has no region-rung goal for that grade and year, which does NOT
          mean the row has no goal — the network target in
          gpa_goal_proportion_org still applies. Every region this model covers
          has region-rung goals today, so in practice this is non-NULL wherever
          gpa_goal_proportion_org is. Test gpa_goal_proportion_org, not this
          column, to find rows with goals.
      - name: gpa_goal_proportion_school
        data_type: numeric
        description: >-
          Target share for the student's school, as a proportion. NULL when the
          school has no school-rung goal for that grade and year, on the same
          basis as gpa_goal_proportion_region — a NULL here does not mean the
          row has no goal.
