models:
  - name: rpt_tableau__leadership_development
    columns:
      - name: location_clean_name
        data_type: string
        description: >-
          Canonical location from int_people__location_crosswalk. Drives the
          Tableau location gate; retired name aliases collapse onto their
          canonical clean name here.
        data_tests:
          - not_null
      - name: home_business_unit_name
        data_type: string
        description: >-
          Legal entity. Drives the Tableau entity gate. Never location_region,
          which is a property of the location rather than the person.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TEAM Academy Charter School
                  - KIPP Cooper Norcross Academy
                  - KIPP Miami
                  - KIPP Paterson
                  - KIPP TEAM and Family Schools Inc.
      - name: employee_number
        data_type: int64
      - name: academic_year
        data_type: int64
      - name: term
        data_type: string
      - name: assignment_id
        data_type: string
      - name: active_assignment
        data_type: boolean
      - name: column_name
        data_type: string
      - name: column_value
        data_type: string
      - name: metric_id
        data_type: string
      - name: region
        data_type: string
      - name: bucket
        data_type: string
      - name: type
        data_type: string
      - name: fiscal_year
        data_type: int64
      - name: preferred_name_lastfirst
        data_type: string
      - name: campus_name
        data_type: string
      - name: home_department_name
        data_type: string
      - name: job_function
        data_type: string
        description: Drives the AP role predicate; NULL for 63 active staff.
      - name: job_title
        data_type: string
      - name: mail
        data_type: string
        description: Post-cutover Tableau identity.
      - name: user_principal_name
        data_type: string
      - name: sam_account_name
        data_type: string
      - name: manager
        data_type: string
      - name: report_to_sam_account_name
        data_type: string
      - name: reports_to_mail
        data_type: string
      - name: reports_to_sam_account_name
        data_type: string
      - name: assignment_status
        data_type: string
      - name: description
        data_type: string
      - name: active
        data_type: boolean
      - name: round_completion_manager
        data_type: int64
      - name: round_completion_self
        data_type: int64
