models:
  - name: rpt_tableau__student_info_audit
    description: >-
      Network-wide student data quality audit for the current academic year.
      Most checks write one row per student, flagged or not. Under Enrolled
      writes flagged students only, and Enrollment Dupes writes one row per
      duplicate course enrollment. Miami is included except for the FTEID check,
      because Focus has no FTE. Name Spelling flags a double space or any
      character other than a letter in any script (accented included), a digit,
      an underscore, a space, an apostrophe, a hyphen, or a comma.
    columns:
      - name: db_name
        data_type: string
      - name: schoolid
        data_type: int64
      - name: school_name
        data_type: string
      - name: school_abbreviation
        data_type: string
      - name: student_number
        data_type: int64
      - name: region
        data_type: string
      - name: lastfirst
        data_type: string
      - name: grade_level
        data_type: int64
      - name: team
        data_type: string
      - name: element
        data_type: string
      - name: detail
        data_type: string
      - name: flag
        data_type: int64
