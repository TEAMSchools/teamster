models:
  - name: rpt_tableau__student_info_audit
    description: >-
      Network-wide student data quality audit for the current academic year, one
      row per student and check. Miami is included except for the FTEID check,
      because Focus has no FTE. Name Spelling allows letters in any script,
      including accented ones, plus apostrophes, hyphens, and commas.
    columns:
      - name: db_name
        data_type: string
      - name: schoolid
        data_type: int64
      - name: school_name
        data_type: string
      - name: school_abbreviation
        data_type: string
      - name: student_number
        data_type: int64
      - name: region
        data_type: string
      - name: lastfirst
        data_type: string
      - name: grade_level
        data_type: int64
      - name: team
        data_type: string
      - name: element
        data_type: string
      - name: detail
        data_type: string
      - name: flag
        data_type: int64
