models:
  - name: rpt_tableau__college_assessment_dashboard_roster
    description: >-
      **Excludes Miami by design.** Same college-testing population as the
      `rpt_gsheets__college_assessments_*` extracts, which Miami has no cohort
      for yet. Ratified on #4996.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - expected_field_name_score_category
    columns:
      - name: region
        data_type: string
      - name: schoolid
        data_type: int64
      - name: school
        data_type: string
      - name: student_number
        data_type: int64
      - name: salesforce_id
        data_type: string
      - name: student_name
        data_type: string
      - name: student_first_name
        data_type: string
      - name: student_last_name
        data_type: string
      - name: grade_level
        data_type: int64
      - name: student_email
        data_type: string
      - name: enroll_status
        data_type: int64
      - name: ktc_cohort
        data_type: int64
      - name: graduation_year
        data_type: int64
      - name: year_in_network
        data_type: int64
      - name: iep_status
        data_type: string
      - name: grad_iep_exempt_status_overall
        data_type: string
      - name: cumulative_y1_gpa
        data_type: float64
      - name: cumulative_y1_gpa_projected
        data_type: float64
      - name: college_match_gpa
        data_type: numeric
      - name: college_match_gpa_bands
        data_type: string
      - name: expected_test_type
        data_type: string
      - name: expected_scope
        data_type: string
      - name: expected_score_type
        data_type: string
      - name: expected_grouping
        data_type: string
      - name: expected_grade_level
        data_type: int64
      - name: expected_admin_season
        data_type: string
      - name: expected_months_included
        data_type: string
      - name: expected_field_name
        data_type: string
      - name: expected_score_category
        data_type: string
      - name: expected_admin_season_order
        data_type: int64
      - name: score
        data_type: numeric
      - name: sat_total_superscore
        data_type: numeric
      - name: sat_ebrw_highest
        data_type: numeric
      - name: sat_math_highest
        data_type: numeric
      - name: expected_field_name_score_category
        data_type: string
      - name: psat89_count_lifetime
        data_type: int64
      - name: psat10_count_lifetime
        data_type: int64
      - name: psatnmsqt_count_lifetime
        data_type: int64
      - name: sat_count_lifetime
        data_type: int64
      - name: act_count_lifetime
        data_type: int64
      - name: ccr_course
        description: >-
          Name of the course standing in for the student's College and Career
          Readiness (CCR) schedule. Falls back through `ccr_course_source` when
          the student has no active CCR course.
        data_type: string
      - name: ccr_teacher_name
        data_type: string
      - name: ccr_section
        description: >-
          Section identifier for `ccr_course`. Reads the period expression on a
          CCR or Advisory row, and the section number (for example `9M311`) on a
          homeroom row, whose period expression is always `HR(A)` or `HR(R)` and
          carries no information.
        data_type: string
      - name: ccr_course_source
        description: >-
          Which tier supplied `ccr_course`: `CCR` for an active College and
          Career course, `Advisory` for KIPP Newark Lab's `SEM22106G1`,
          `Homeroom` for the universal backstop, `No Data` when the student has
          no active course enrollment at all.
        data_type: string
