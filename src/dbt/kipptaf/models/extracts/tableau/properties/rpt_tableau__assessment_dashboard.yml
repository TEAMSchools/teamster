models:
  - name: rpt_tableau__assessment_dashboard
    description: >-
      Assessment results for the DDI Suite dashboard, for the current and prior
      academic year. Each row is one `int_assessments__response_rollup` row
      (student, canonical assessment, response, and replacement flag) joined to
      the student's year enrollment (`rn_year` 1, grade 99 excluded), so
      scaffold rows with no responses are kept. Course and teacher columns come
      from a LEFT JOIN to the student's top-ranked, non-dropped course
      enrollment for the assessment's subject. Subject-level tier, intervention,
      DIBELS, and prior-year state test columns come from
      `int_extracts__student_enrollments_subjects`, matched on the subject area
      (K-8) or course credit type (grades 9-12), and are null for subjects other
      than ELA and Math.

      The model applies no region filter. Miami rows from SY26-27 on are Focus
      Apex assessments, whose course and teacher columns come from the section
      the assessment scaffold matched. Focus courses carry no credit type, so
      Apex rows in ELA or Math subjects (English 100, Algebra I and Geometry
      Honors included) match the subject columns on the student's ELA or Math
      row, at every grade.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          description: >-
            One row per `int_assessments__response_rollup` row, whose grain this
            repeats. The enrollment, course, and subject joins each match at
            most one row, so a duplicate here means a new join fan-out.
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
              - source
              - assessment_id
              - response_type
              - response_type_id
              - is_replacement
          config:
            severity: error
    columns:
      - name: student_number
        data_type: int64
      - name: lastfirst
        data_type: string
      - name: academic_year
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: region
        data_type: string
      - name: grade_level
        data_type: int64
      - name: team
        data_type: string
      - name: enroll_status
        data_type: int64
      - name: cohort
        data_type: int64
      - name: iep_status
        data_type: string
      - name: lep_status
        data_type: boolean
        description: >-
          English learner status. True or false in the New Jersey regions. In
          Miami, null means the Focus status is tested, pending or unset, so it
          is unknown rather than a negative.
      - name: c_504_status
        data_type: boolean
        description: >-
          Section 504 plan status. True or false in the New Jersey regions. In
          Miami, null means the Focus field is unset, which does not assert that
          the student has no plan.
      - name: gifted_and_talented
        data_type: string
        description: >-
          Gifted and talented status, Y or N, from
          `int_extracts__student_enrollments`. N also covers Miami students
          whose Focus gifted eligibility field is unset.
      - name: is_pathways
        data_type: boolean
      - name: school
        data_type: string
      - name: school_level
        data_type: string
      - name: source
        data_type: string
        description: >-
          System the assessment comes from, `illuminate` or `apex`. Part of the
          grain, because the two systems' assessment ids can collide.
      - name: assessment_id
        data_type: int64
      - name: title
        data_type: string
      - name: scope
        data_type: string
      - name: subject_area
        data_type: string
      - name: term_administered
        data_type: string
      - name: administered_at
        data_type: date
      - name: term_taken
        data_type: string
      - name: date_taken
        data_type: date
      - name: module_type
        data_type: string
      - name: module_number
        data_type: string
      - name: response_type
        data_type: string
      - name: response_type_id
        data_type: int64
        description: >-
          Standard or reporting group id for the response, `-1` for overall.
          Part of the grain, because reporting groups and some standards share a
          `standard_code`.
      - name: standard_code
        data_type: string
      - name: standard_description
        data_type: string
      - name: domain_description
        data_type: string
      - name: percent_correct
        data_type: numeric
      - name: is_mastery
        data_type: boolean
      - name: performance_band_number
        data_type: numeric
      - name: performance_band_label
        data_type: string
      - name: is_replacement
        data_type: boolean
      - name: is_normed_scope
        data_type: boolean
      - name: hr_teachernumber
        data_type: string
      - name: enr_teachernumber
        data_type: string
      - name: teacher_name
        data_type: string
      - name: course_name
        data_type: string
      - name: expression
        data_type: string
      - name: section_number
        data_type: string
      - name: is_foundations
        data_type: boolean
      - name: head_of_school
        data_type: string
      - name: power_standard_goal
        data_type: int64
        description: Always null. Retired field kept for the Tableau workbook.
      - name: is_power_standard
        data_type: int64
        description: Always null. Retired field kept for the Tableau workbook.
      - name: standard_domain
        data_type: int64
        description: Always null. Retired field kept for the Tableau workbook.
      - name: nj_student_tier
        data_type: string
        description: >-
          The student's bucket for the assessment's ELA or Math subject, Bucket
          1 to 4, with Bucket 4 covering students who have no bucket. Null for
          other subjects.
      - name: tutoring_nj
        data_type: boolean
      - name: territory
        data_type: string
      - name: is_sipps
        data_type: boolean
      - name: is_low_25_fl
        data_type: boolean
      - name: dibels_most_recent_composite
        data_type: string
      - name: state_test_proficiency
        data_type: string
        description: >-
          Prior-year state test proficiency for this student and subject — NJSLA
          aggregated proficiency in New Jersey, FAST PM3 administration in
          Florida. Populated only where the subject resolves to ELA or Math, and
          set to the literal No Test when the student has no prior-year result.
