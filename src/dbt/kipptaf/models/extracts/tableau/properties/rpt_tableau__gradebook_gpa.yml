models:
  - name: rpt_tableau__gradebook_gpa
    description: >-
      Network-wide, including Miami. One row per student, term, course, and
      gradebook category for the current academic year, plus Y1-final rows for
      every stored prior year. Carries the gradebook-audit-adjacent columns
      (citizenship, free-text comment) that rpt_tableau__student_course_grades
      deliberately excludes. Miami's GPA columns are null, because
      `int_powerschool__gpa_term` is PowerSchool-only. Miami's course, section,
      and gradebook-category columns are also null for the same reason, so a
      Miami row carries roster and term attributes only.
    # TODO(#3900): residual warn-level violations trace to the known
    # base_powerschool__course_enrollments double-write duplicates.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - _dbt_source_relation
              - student_number
              - academic_year
              - sectionid
              - quarter
              - category_name_code
    columns:
      - name: _dbt_source_relation
        data_type: string
        description: Source relation identifier from dbt_utils.union_relations.
      - name: academic_year
        data_type: int64
        description: Academic year, start-year convention (2025 = SY25-26).
      - name: academic_year_display
        data_type: string
        description: Display form of the academic year (e.g. 2025-26).
      - name: region
        data_type: string
        description: District region.
      - name: school_level
        data_type: string
        description: School level (ES/MS/HS) from the year's enrollment.
      - name: schoolid
        data_type: int64
        description: School_Number of the year's primary enrollment school.
      - name: school
        data_type: string
        description: School name.
      - name: studentid
        data_type: int64
        description:
          The internal number and ID of the associated Students record.
      - name: student_number
        data_type: int64
        description: District student number.
        config:
          meta:
            contains_pii: true
      - name: student_name
        data_type: string
        description: Student full name (last, first).
        config:
          meta:
            contains_pii: true
      - name: grade_level
        data_type: int64
        description: Grade level in the row's academic year.
      - name: salesforce_id
        data_type: string
        description: KIPP Forward Salesforce contact id.
        config:
          meta:
            contains_pii: true
      - name: ktc_cohort
        data_type: int64
        description: KIPP Through College cohort year.
      - name: enroll_status
        data_type: int64
        description:
          Current PowerSchool enroll_status (student-level, not per-year).
        config:
          meta:
            contains_pii: true
      - name: cohort
        data_type: int64
        description: Graduation cohort year.
      - name: graduation_year
        data_type: int64
        description: Expected graduation year.
      - name: gender
        data_type: string
        description: Student gender code.
        config:
          meta:
            contains_pii: true
      - name: ethnicity
        data_type: string
        description: Student ethnicity code.
        config:
          meta:
            contains_pii: true
      - name: advisory
        data_type: string
        description: Advisory/homeroom name for the year.
      - name: hos
        data_type: string
        description: Head of school name.
        config:
          meta:
            contains_pii: true
      - name: school_leader
        data_type: string
        description: School leader name.
        config:
          meta:
            contains_pii: true
      - name: school_leader_tableau_username
        data_type: string
        description: School leader Tableau username (row-level security).
      - name: year_in_school
        data_type: int64
        description: Number of years enrolled at the school.
      - name: year_in_network
        data_type: int64
        description: Number of years enrolled in the network.
      - name: rn_undergrad
        data_type: int64
        description: Row number over undergrad enrollments (1 = most recent).
      - name: is_out_of_district
        data_type: boolean
        description:
          Out-of-district placement flag (always false here; filtered).
        config:
          meta:
            contains_pii: true
      - name: is_pathways
        data_type: boolean
        description: Self-contained (Pathways) program flag.
        config:
          meta:
            contains_pii: true
      - name: is_retained_year
        data_type: boolean
        description: Retained in the row's academic year.
        config:
          meta:
            contains_pii: true
      - name: is_retained_ever
        data_type: boolean
        description: Ever retained.
        config:
          meta:
            contains_pii: true
      - name: lunch_status
        data_type: string
        description: Free/reduced lunch status code.
        config:
          meta:
            contains_pii: true
      - name: gifted_and_talented
        data_type: string
        description: Gifted and talented status.
        config:
          meta:
            contains_pii: true
      - name: iep_status
        data_type: string
        description: IEP status label.
        config:
          meta:
            contains_pii: true
      - name: lep_status
        data_type: boolean
        description: English learner status.
        config:
          meta:
            contains_pii: true
      - name: is_504
        data_type: boolean
        description: Section 504 plan flag.
        config:
          meta:
            contains_pii: true
      - name: is_counseling_services
        data_type: int64
        description: Counseling services flag.
        config:
          meta:
            contains_pii: true
      - name: is_student_athlete
        data_type: int64
        description: Student athlete flag.
        config:
          meta:
            contains_pii: true
      - name: ada
        data_type: float64
        description: Average daily attendance for the year.
        config:
          meta:
            contains_pii: true
      - name: ada_above_or_at_80
        data_type: boolean
        description: ADA at or above 80 percent.
        config:
          meta:
            contains_pii: true
      - name: quarter
        data_type: string
        description: Reporting term (Q1-Q4) or Y1 for the year row.
      - name: semester
        data_type: string
        description: Semester of the term (S1/S2; S# on Y1 rows).
      - name: quarter_start_date
        data_type: date
        description: Term start date.
      - name: quarter_end_date
        data_type: date
        description: Term end date.
      - name: cal_quarter_end_date
        data_type: date
        description: >-
          Term end date; carries the same value as quarter_end_date in this
          model.
      - name: is_current_quarter
        data_type: boolean
        description: Term is the school's current term (false on Y1 rows).
      - name: gpa_for_quarter
        data_type: float64
        description: Term GPA for the row's term (Y1 GPA on Y1 rows).
        config:
          meta:
            contains_pii: true
      - name: gpa_semester
        data_type: float64
        description: Semester GPA for the row's term. NULL on Y1 rows.
        config:
          meta:
            contains_pii: true
      - name: gpa_y1
        data_type: float64
        description: >-
          Y1 GPA as of the row's term. PowerSchool stores only the end-of-year
          value, so prior-year rows carry that value on every term.
        config:
          meta:
            contains_pii: true
      - name: gpa_y1_unweighted
        data_type: float64
        description: Unweighted Y1 GPA as of the row's term.
        config:
          meta:
            contains_pii: true
      - name: gpa_total_credit_hours
        data_type: float64
        description: Total Y1 GPA credit hours for the year.
        config:
          meta:
            contains_pii: true
      - name: gpa_n_failing_y1
        data_type: int64
        description: Count of failing Y1 grades as of the row's term.
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa
        data_type: float64
        description: >-
          Cumulative weighted Y1 GPA for the row's academic year. Student-year
          grain, so it repeats across every quarter and course row.
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa_projected
        data_type: float64
        description: >-
          Projected cumulative weighted Y1 GPA for the row's academic year.
          Student-year grain, so it repeats across every quarter and course row.
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa_projected_s1
        data_type: float64
        description: >-
          S1-basis projected cumulative Y1 GPA for the row's academic year.
          Student-year grain, so it repeats across every quarter and course row.
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa_unweighted
        data_type: float64
        description: >-
          Cumulative unweighted Y1 GPA for the row's academic year. Student-year
          grain, so it repeats across every quarter and course row.
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa_projected_unweighted
        data_type: float64
        description: >-
          Projected cumulative unweighted Y1 GPA for the row's academic year.
          Student-year grain, so it repeats across every quarter and course row.
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa_projected_s1_unweighted
        data_type: float64
        description: >-
          S1-basis projected cumulative unweighted Y1 GPA for the row's academic
          year. Student-year grain, so it repeats across every quarter and
          course row.
        config:
          meta:
            contains_pii: true
      - name: core_cumulative_y1_gpa
        data_type: float64
        description: >-
          Cumulative Y1 GPA over core courses for the row's academic year.
          Student-year grain, so it repeats across every quarter and course row.
        config:
          meta:
            contains_pii: true
      - name: sectionid
        data_type: int64
        description: PowerSchool section id of the course enrollment.
      - name: sections_dcid
        data_type: int64
        description: PowerSchool sections DCID.
      - name: section_number
        data_type: string
        description: Section number.
      - name: external_expression
        data_type: string
        description: Section period expression (HS scheduling).
      - name: date_enrolled
        data_type: date
        description: Course enrollment start date.
      - name: credit_type
        data_type: string
        description: Course credit type (subject area).
      - name: course_number
        data_type: string
        description: Course number.
      - name: course_name
        data_type: string
        description: Course name.
      - name: exclude_from_gpa
        data_type: int64
        description: Course excluded from GPA (1) or included (0).
      - name: teacher_number
        data_type: string
        description: Teacher number of the section's teacher.
      - name: teacher_name
        data_type: string
        description: Teacher name (last, first).
        config:
          meta:
            contains_pii: true
      - name: tutoring_nj
        data_type: boolean
        description:
          NJ tutoring program flag for the subject (NULL outside NJ scope).
        config:
          meta:
            contains_pii: true
      - name: nj_student_tier
        data_type: string
        description: NJ student tier for the subject.
        config:
          meta:
            contains_pii: true
      - name: teacher_tableau_username
        data_type: string
        description: Teacher Tableau username (row-level security).
      - name: y1_course_final_percent_grade_adjusted
        data_type: float64
        description: Final stored Y1 percent grade (Y1 rows only).
        config:
          meta:
            contains_pii: true
      - name: y1_course_final_letter_grade_adjusted
        data_type: string
        description: Final stored Y1 letter grade (Y1 rows only).
        config:
          meta:
            contains_pii: true
      - name: y1_course_final_earned_credits
        data_type: float64
        description: Credits earned for the course (Y1 rows only).
        config:
          meta:
            contains_pii: true
      - name: y1_course_final_potential_credit_hours
        data_type: float64
        description: Potential credit hours for the course (Y1 rows only).
        config:
          meta:
            contains_pii: true
      - name: y1_course_final_grade_points
        data_type: float64
        description: Final stored Y1 grade points (Y1 rows only).
        config:
          meta:
            contains_pii: true
      - name: quarter_course_percent_grade
        data_type: float64
        description: >-
          Course percent grade for the row's term. Current academic year only.
        config:
          meta:
            contains_pii: true
      - name: quarter_course_letter_grade
        data_type: string
        description: >-
          Course letter grade for the row's term. Current academic year only.
        config:
          meta:
            contains_pii: true
      - name: quarter_course_grade_points
        data_type: float64
        description: >-
          Course grade points for the row's term. Current academic year only.
        config:
          meta:
            contains_pii: true
      - name: y1_course_in_progress_percent_grade_adjusted
        data_type: float64
        description: >-
          Year-to-date course percent as of the row's marking period, from the
          live gradebook. Current academic year only.
        config:
          meta:
            contains_pii: true
      - name: y1_course_in_progress_letter_grade_adjusted
        data_type: string
        description: >-
          Year-to-date course letter as of the row's marking period, from the
          live gradebook. Current academic year only.
        config:
          meta:
            contains_pii: true
      - name: y1_course_in_progress_grade_points
        data_type: float64
        description: In-progress Y1 grade points. Current academic year only.
        config:
          meta:
            contains_pii: true
      - name: y1_course_in_progress_grade_points_unweighted
        data_type: float64
        description: >-
          In-progress unweighted Y1 grade points. Current academic year only.
        config:
          meta:
            contains_pii: true
      - name: need_60
        data_type: float64
        description: >-
          Percent needed on remaining work to reach a 60 course grade. Current
          academic year only.
        config:
          meta:
            contains_pii: true
      - name: need_70
        data_type: float64
        description: >-
          Percent needed to reach a 70. Current academic year only.
        config:
          meta:
            contains_pii: true
      - name: need_80
        data_type: float64
        description: >-
          Percent needed to reach an 80. Current academic year only.
        config:
          meta:
            contains_pii: true
      - name: need_90
        data_type: float64
        description: >-
          Percent needed to reach a 90. Current academic year only.
        config:
          meta:
            contains_pii: true
      - name: quarter_citizenship
        data_type: string
        description: >-
          Citizenship grade posted for the row's term. NULL on the Y1 row.
        config:
          meta:
            contains_pii: true
      - name: quarter_comment_value
        data_type: string
        description: >-
          Free-text gradebook comment posted for the row's term. NULL on the Y1
          row.
        config:
          meta:
            contains_pii: true
      - name: category_name_code
        data_type: string
        description: >-
          Gradebook category code (e.g. F/S/W). Excludes the plain quarter
          category.
      - name: category_quarter_code
        data_type: string
        description: Category term code (e.g. Q1).
      - name: category_quarter_percent_grade
        data_type: float64
        description: Category percent grade for the term.
        config:
          meta:
            contains_pii: true
      - name: category_y1_percent_grade_running
        data_type: float64
        description: Running Y1 category percent grade through the term.
        config:
          meta:
            contains_pii: true
      - name: category_y1_percent_grade_current
        data_type: float64
        description: >-
          Y1 running category percent as of the current term.
        config:
          meta:
            contains_pii: true
      - name: category_quarter_average_all_courses
        data_type: float64
        description: >-
          Student's average percent across all courses for the term.
        config:
          meta:
            contains_pii: true
      - name: roster_type
        data_type: string
        description: Constant, always `Local`.
      - name: section_or_period
        data_type: string
        description: >-
          Section number below grade 9, period expression at grade 9 and above.
      - name: is_ada_above_or_at_80_gpa_y1_less_2
        data_type: boolean
        description: >
          True when the student's ADA is at or above 80% and their year-to-date
          course GPA (gpa_y1) is below 2.0. Per-course grain.
        config:
          meta:
            contains_pii: true
