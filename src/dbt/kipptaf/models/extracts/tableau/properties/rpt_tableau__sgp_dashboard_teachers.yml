  - name: test_rpt_tableau__sgp_dashboard_teachers_context_columns
    description: >-
      A lead and a co-teacher sharing 3 students each show 3 shared students and
      1 other teacher. A lead of 10 ELA and 10 math students is lead in both
      subjects; a lead of 10 ELA and 9 math students is not, and neither is a
      lead of ELA alone.
    model: rpt_tableau__sgp_dashboard_teachers
    given:
      - input: ref('int_assessments__state_nj_scores')
        format: sql
        rows: |
          select
              concat(g.uuid_prefix, n) as student_test_uuid,
              n as student_number,
              2025 as academic_year,
              date '2025-09-12' as test_date,
              6 as grade_level_when_assessed,
              g.discipline,
              g.test_code,
              50 as student_growth_percentile,
              true as is_proficient,
              'Hispanic' as aligned_aggregate_ethnicity,
              'No IEP' as aligned_iep_status,
              'Not ML' as aligned_ml_status,
              true as is_economically_disadvantaged
          from
              unnest(
                  [
                      struct(
                          'e' as uuid_prefix,
                          'ELA' as discipline,
                          'ELA06' as test_code,
                          1 as first_student,
                          3 as last_student
                      ),
                      ('e', 'ELA', 'ELA06', 11, 30),
                      ('m', 'Math', 'MAT06', 11, 29)
                  ]
              ) as g
          cross join unnest(generate_array(g.first_student, g.last_student)) as n
      - *enrollments
      - *locations
      - *regions
      - *calendar
      - *dates
      - *course_sections
      - *courses
      - *staff
      - input: ref('dim_student_section_enrollments')
        format: sql
        rows: |
          select
              concat('se', n) as student_enrollment_key,
              g.course_section_key,
              date '2025-08-15' as entry_date,
              date '2026-06-30' as exit_date,
              false as is_homeroom
          from
              unnest(
                  [
                      struct(
                          'sec_a' as course_section_key,
                          1 as first_student,
                          3 as last_student
                      ),
                      ('sec_e', 11, 20),
                      ('sec_m', 11, 20),
                      ('sec_e2', 21, 30),
                      ('sec_m2', 21, 29)
                  ]
              ) as g
          cross join unnest(generate_array(g.first_student, g.last_student)) as n
      - input: ref('bridge_course_section_teachers')
        format: sql
        rows: |
          select
              g.course_section_key,
              g.staff_key,
              g.role,
              date '2025-08-15' as effective_start_date,
              date '2026-06-30' as effective_end_date
          from
              unnest(
                  [
                      struct(
                          'sec_a' as course_section_key,
                          't1' as staff_key,
                          'Lead Teacher' as role
                      ),
                      ('sec_a', 't2', 'Co-teacher'),
                      ('sec_e', 't3', 'Lead Teacher'),
                      ('sec_m', 't3', 'Lead Teacher'),
                      ('sec_e2', 't4', 'Lead Teacher'),
                      ('sec_m2', 't4', 'Lead Teacher')
                  ]
              ) as g
    expect:
      format: csv
      rows: |
        student_test_uuid,staff_key,teacher_role,teacher_shared_student_count,teacher_other_teacher_count,is_lead_in_both_subjects
        e1,t1,Lead Teacher,3,1,false
