models:
  - name: rpt_tableau__survey_completion
    description: >-
      One row per staff survey assignment, at the grain of employee_number,
      survey, academic_year, and survey_round. Each assignment from
      rpt_tableau__survey_links is joined to the latest response for that round,
      so completion is a per-assignment flag rather than a per-question one.
      TNTP Insight and Gallup Q12 are excluded because both are administered
      outside Google Forms and never produce a trackable response here.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - employee_number
              - survey
              - academic_year
              - survey_round
          config:
            severity: error
    columns:
      - name: location_clean_name
        data_type: string
        description: >-
          Canonical location from int_people__location_crosswalk. Drives the
          Tableau location gate; retired name aliases collapse onto their
          canonical clean name here.
        data_tests:
          - not_null
      - name: home_business_unit_name
        data_type: string
        description: >-
          Legal entity. Drives the Tableau entity gate. Never location_region,
          which is a property of the location rather than the person.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TEAM Academy Charter School
                  - KIPP Cooper Norcross Academy
                  - KIPP Miami
                  - KIPP Paterson
                  - KIPP TEAM and Family Schools Inc.
      - name: employee_number
        data_type: int64
      - name: assignment_status
        data_type: string
      - name: preferred_name_lastfirst
        data_type: string
      - name: campus_name
        data_type: string
      - name: home_department_name
        data_type: string
      - name: job_function
        data_type: string
        description: >-
          Drives the Tableau role predicate. Null where the roster records no
          job function for the person.
      - name: job_title
        data_type: string
      - name: mail
        data_type: string
      - name: user_principal_name
        data_type: string
      - name: sam_account_name
        data_type: string
      - name: reports_to_mail
        data_type: string
      - name: reports_to_sam_account_name
        data_type: string
      - name: hire_date
        data_type: date
      - name: survey
        data_type: string
      - name: academic_year
        data_type: int64
      - name: survey_round
        data_type: string
      - name: is_current
        data_type: boolean
      - name: completion
        data_type: int64
      - name: survey_response_id
        data_type: string
