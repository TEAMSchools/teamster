models:
  - name: rpt_tableau__college_assessment_dashboard_benchmark_calcs
    description: >
      Student-level college assessment scores used to calculate the percentage
      of students meeting readiness benchmarks for KIPP Forward use. One row per
      student per (test_type, aligned_scope, subject_area, benchmark_name)
      combination — including students with no qualifying score (null max_score)
      so they count in the denominator. Benchmark definitions and thresholds
      come from the KIPP Forward scaffold sheet for the current academic year.
      Excludes IEP-exempt students and students without a graduation year.
      Scores reflect each student's all-time best across administrations, not
      scoped to the current academic year.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - test_type
              - aligned_scope
              - subject_area
              - benchmark_name
    columns:
      - name: benchmark_goal
        description: >
          Score threshold for the benchmark, from the scaffold sheet's
          hs_grad_ready_min_score and college_ready_min_score columns.
        data_type: int64
        # No not_null test. expected_benchmark_goal reaches this view through a
        # BigQuery UNPIVOT, which excludes nulls by default, so the column
        # cannot be null and such a test cannot fail.
      - name: met_benchmark_goal
        description: >
          Whether the student met the benchmark. Met if max_score >=
          benchmark_goal, Not Met otherwise, No Data if the student has no
          qualifying score.
        data_type: string
        # No accepted_values test. met_benchmark_goal is a CASE with no ELSE
        # that emits only Met, Not Met, or No Data, so such a test cannot fail.
      - name: region
        description: KIPP region the student's school belongs to.
        data_type: string
      - name: school
        description: School name.
        data_type: string
      - name: student_number
        description: Student Number assigned by the school. Indexed.
        data_type: int64
      - name: student_name
        description: Student's full name.
        data_type: string
      - name: iep_status
        description: >
          Database extension field associated to the Students table. Conditional
          on spedlep.
        data_type: string
      - name: is_504
        description: Whether the student has a 504 accommodation plan.
        data_type: boolean
      - name: lep_status
        description: Student Limited English Proficiency status.
        data_type: boolean
      - name: graduation_year
        description: Student graduation year.
        data_type: int64
      - name: year_in_network
        description:
          Number of years the student has been enrolled in the KIPP network.
        data_type: int64
      - name: college_match_gpa
        description: Cumulative GPA used for college match categorization.
        data_type: numeric
      - name: college_match_gpa_bands
        description: GPA band grouping for college match purposes.
        data_type: string
      - name: aligned_scope
        description: >
          Assessment scope used for benchmark comparison. PSAT10 and PSAT NMSQT
          are merged into PSAT10/NMSQT; all other scopes (PSAT 8/9, SAT) are
          unchanged.
        data_type: string
      - name: test_type
        description: >
          Official or Practice, from the scaffold. Practice rows resolve against
          practice scores only, so a practice benchmark is never satisfied by an
          official result.
        data_type: string
      - name: subject_area
        description: >
          Subject area of the score — Combined, EBRW, or Math. Each one carries
          both benchmark names.
        data_type: string
      - name: max_score
        description: >
          Highest scale score for the student on this aligned scope and subject
          area across all assessment administrations. Null for students with no
          qualifying score. Used as the score value for benchmark percent-met
          calculations in Tableau. numeric rather than int64 because it is read
          straight from the hub without a cast. Values are unchanged — every
          scale score is a whole number.
        data_type: numeric
      - name: benchmark_name
        description: >
          Readiness benchmark label, HS Grad-Ready or College-Ready, derived
          from which scaffold threshold column the row came from. Applies to
          every subject area, so a section row now carries a readiness tier
          rather than being named for its subject. EA/ED-Ready is retired.
        data_type: string
