models:
  - name: rpt_tableau__teacher_development
    description: >-
      One row per scored measurement on a teacher development (TDT) observation,
      from SchoolMint Grow and the pre-Grow archive, with the teacher's roster
      attributes at the observation date and their performance management (PM)
      scores for the year. Feeds the teacher development dashboard.
    data_tests:
      # TODO(#6321): archive rows repeat 5 observation-measurement
      # pairs; flip to error once the archive is deduplicated
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - observation_id
              - measurement_name
          config:
            severity: warn
    columns:
      - name: observation_id
        data_type: string
        description: Grow observation id, or the archive's observation id.
        data_tests:
          - not_null
      - name: measurement_name
        data_type: string
        description: Name of the rubric measurement scored.
        data_tests:
          - not_null
      - name: employee_number
        data_type: int64
        description: Employee number of the teacher observed.
        config:
          meta:
            contains_pii: true
      - name: observer_employee_number
        data_type: int64
        description: Employee number of the observer.
        config:
          meta:
            contains_pii: true
      - name: rubric_name
        data_type: string
        description: Grow rubric the observation used.
      - name: observation_score
        data_type: float64
        description: Overall score Grow computed for the observation.
      - name: observed_at
        data_type: date
        description: Date of the observation.
      - name: academic_year
        data_type: int64
        description: Academic year, as its starting calendar year.
      - name: observation_type
        data_type: string
        description: Grow observation type name.
      - name: observation_type_abbreviation
        data_type: string
        description: Grow observation type code (TDT for teacher development).
      - name: observation_subject
        data_type: string
        description: Course or subject observed.
      - name: observation_grade
        data_type: string
        description: Grade level observed. Null for archive rows.
      - name: observation_notes
        data_type: string
        description: Observer's free-text notes on the observation.
        config:
          meta:
            contains_pii: true
      - name: row_score
        data_type: float64
        description: Score on this measurement.
      - name: strand_name
        data_type: string
        description: Rubric strand the measurement belongs to.
      - name: measurement_dropdown_selection
        data_type: string
        description:
          Dropdown choice on the measurement; the text box for archive rows.
      - name: measurement_comments
        data_type: string
        description:
          Observer's free-text comment on the measurement; the text box for
          archive rows.
        config:
          meta:
            contains_pii: true
      - name: glow_area
        data_type: string
        description: Area of strength the observer chose (Glow measurement).
      - name: growth_area
        data_type: string
        description: Area for growth the observer chose (Grow measurement).
      - name: glow_notes
        data_type: string
        description: Observer's free-text comment on the area of strength.
        config:
          meta:
            contains_pii: true
      - name: growth_notes
        data_type: string
        description: Observer's free-text comment on the area for growth.
        config:
          meta:
            contains_pii: true
      - name: teammate
        data_type: string
        description:
          Teacher's name, from their primary roster assignment on the
          observation date.
        config:
          meta:
            contains_pii: true
      - name: entity
        data_type: string
        description: Teacher's home business unit on the observation date.
      - name: location
        data_type: string
        description: Teacher's home work location on the observation date.
      - name: grade_band
        data_type: string
        description: Grade band of the teacher's home work location.
      - name: department
        data_type: string
        description: Teacher's home department on the observation date.
      - name: job_title
        data_type: string
        description: Teacher's job title on the observation date.
      - name: manager
        data_type: string
        description: Name of the teacher's manager on the observation date.
        config:
          meta:
            contains_pii: true
      - name: worker_original_hire_date
        data_type: date
        description: Teacher's original hire date.
      - name: assignment_status
        data_type: string
        description: Teacher's assignment status on the observation date.
      - name: sam_account_name
        data_type: string
        description: Teacher's network account name.
        config:
          meta:
            contains_pii: true
      - name: report_to_sam_account_name
        data_type: string
        description: Network account name of the teacher's manager.
        config:
          meta:
            contains_pii: true
      - name: grade_taught
        data_type: int64
        description: Main grade level the teacher taught that year.
      - name: performance_management_final_score
        data_type: float64
        description: Teacher's final PM score for the year.
      - name: performance_management_final_tier
        data_type: int64
        description: Teacher's final PM tier (1-4) for the year.
      - name: observer_name
        data_type: string
        description: Observer's name.
        config:
          meta:
            contains_pii: true
      - name: pm1
        data_type: float64
        description: Teacher's Grow form score for PM round 1.
      - name: pm2
        data_type: float64
        description: Teacher's Grow form score for PM round 2.
      - name: pm3
        data_type: float64
        description: Teacher's Grow form score for PM round 3.
      - name: smg_etr_pm1
        data_type: float64
        description:
          Teacher's average ETR measurement score on PM round 1 forms. From
          AY2023, ETR measures only; earlier, every measure but S&O.
      - name: smg_etr_pm2
        data_type: float64
        description:
          Teacher's average ETR measurement score on PM round 2 forms. From
          AY2023, ETR measures only; earlier, every measure but S&O.
      - name: smg_etr_pm3
        data_type: float64
        description:
          Teacher's average ETR measurement score on PM round 3 forms. From
          AY2023, ETR measures only; earlier, every measure but S&O.
      - name: tir_etr_pm1
        data_type: float64
        description:
          For teachers in residence, average score on ETR strands 1-3 in PM
          round 1.
      - name: tir_etr_pm2
        data_type: float64
        description:
          For teachers in residence, average score on ETR strands 1-3 in PM
          round 2.
      - name: tir_etr_pm3
        data_type: float64
        description:
          For teachers in residence, average score on ETR strands 1-3 in PM
          round 3.
      - name: tir_so_pm1
        data_type: float64
        description:
          For teachers in residence, average S&O score in PM round 1 (through
          AY2025).
      - name: tir_so_pm2
        data_type: float64
        description:
          For teachers in residence, average S&O score in PM round 2 (through
          AY2025).
      - name: tir_so_pm3
        data_type: float64
        description:
          For teachers in residence, average S&O score in PM round 3 (through
          AY2025).
      - name: tir_values_pm1
        data_type: float64
        description:
          For teachers in residence, average score on the 5 Grow Values measures
          (Excellence, Fun, Kid Focus, Radical Love, TEAM) in PM round 1. From
          AY2026, when Values replaced S&O.
      - name: tir_values_pm2
        data_type: float64
        description:
          For teachers in residence, average score on the 5 Grow Values measures
          in PM round 2. From AY2026.
      - name: tir_values_pm3
        data_type: float64
        description:
          For teachers in residence, average score on the 5 Grow Values measures
          in PM round 3. From AY2026.
      - name: tir_pm1
        data_type: float64
        description:
          For teachers in residence, PM round 1 score as Grow weights it — 80%
          ETR and 20% S&O, or Values from AY2026. From AY2023 the ETR side is
          every ETR measure (smg_etr_pm1); earlier, ETR strands 1-3.
      - name: tir_pm2
        data_type: float64
        description:
          For teachers in residence, PM round 2 score as Grow weights it — 80%
          ETR and 20% S&O, or Values from AY2026. From AY2023 the ETR side is
          every ETR measure (smg_etr_pm2); earlier, ETR strands 1-3.
      - name: tir_pm3
        data_type: float64
        description:
          For teachers in residence, PM round 3 score as Grow weights it — 80%
          ETR and 20% S&O, or Values from AY2026. From AY2023 the ETR side is
          every ETR measure (smg_etr_pm3); earlier, ETR strands 1-3.
      - name: observer_team
        data_type: string
        description:
          TDT when the observer works in the Teacher Development department,
          otherwise NTNC.
      - name: week_start
        data_type: date
        description: Monday of the observation's week.

unit_tests:
  - name: unit_rpt_teacher_development_tir_pm_follows_grow
    description: >-
      Resident PM scores follow Grow's form score. Teacher 101 (AY2025) scores
      ETR 3 and 1 (strand 4) and S&O 3, so the ETR average is 2, the strands 1-3
      average is 3, and tir_pm2 is 2 x 0.8 + 3 x 0.2 = 2.2. Teacher 102 (AY2026)
      scores ETR 2 and 4, Values 4 and 4, Presence 1 and an unscored goal, so
      tir_values_pm2 is 4 and tir_pm2 is 3 x 0.8 + 4 x 0.2 = 3.2; Presence and
      the goal stay out of every average. Scores are chosen so each result is an
      exact float.
    model: rpt_tableau__teacher_development
    given:
      - input: ref("int_performance_management__observations")
        rows:
          - observation_id: tdt_101
            employee_number: 101
            academic_year: 2025
            observed_at: 2025-12-01
            observation_type_abbreviation: TDT
          - observation_id: pms_101
            employee_number: 101
            academic_year: 2025
            observed_at: 2025-12-02
            observation_type_abbreviation: PMS
            term_code: PM2
            observation_score: 2.2
          - observation_id: tdt_102
            employee_number: 102
            academic_year: 2026
            observed_at: 2026-12-01
            observation_type_abbreviation: TDT
          - observation_id: pms_102
            employee_number: 102
            academic_year: 2026
            observed_at: 2026-12-02
            observation_type_abbreviation: PMS
            term_code: PM2
            observation_score: 3.2
      - input: ref("int_performance_management__observation_details")
        rows:
          - observation_id: tdt_101
            observation_type_abbreviation: TDT
            measurement_name: Lesson Focus
            row_score: 3.0
          - observation_id: pms_101
            observation_type_abbreviation: PMS
            term_code: PM2
            measurement_name: "ETR-1A: Plans"
            row_score: 3.0
          - observation_id: pms_101
            observation_type_abbreviation: PMS
            term_code: PM2
            measurement_name: "ETR-4A: Culture"
            row_score: 1.0
          - observation_id: pms_101
            observation_type_abbreviation: PMS
            term_code: PM2
            measurement_name: "S&O-01: Commitments"
            strand_name: "Self & Others: Manager Feedback"
            row_score: 3.0
          - observation_id: tdt_102
            observation_type_abbreviation: TDT
            measurement_name: Lesson Focus
            row_score: 3.0
          - observation_id: pms_102
            observation_type_abbreviation: PMS
            term_code: PM2
            measurement_name: "ETR-1A: Plans"
            strand_name: Practice
            row_score: 2.0
          - observation_id: pms_102
            observation_type_abbreviation: PMS
            term_code: PM2
            measurement_name: "ETR-5A: Rigor"
            strand_name: Practice
            row_score: 4.0
          - observation_id: pms_102
            observation_type_abbreviation: PMS
            term_code: PM2
            measurement_name: Excellence
            strand_name: Values
            row_score: 4.0
          - observation_id: pms_102
            observation_type_abbreviation: PMS
            term_code: PM2
            measurement_name: Fun
            strand_name: Values
            row_score: 4.0
          - observation_id: pms_102
            observation_type_abbreviation: PMS
            term_code: PM2
            measurement_name: Presence
            strand_name: Professionalism and Punctuality
            row_score: 1.0
          - observation_id: pms_102
            observation_type_abbreviation: PMS
            term_code: PM2
            measurement_name: Goal 1
            strand_name: Goal Status
            row_score: null
      - input: ref("int_performance_management__teacher_development")
        rows: []
      - input: ref("int_people__staff_roster_history")
        rows:
          - employee_number: 101
            job_title: Teacher in Residence
            primary_indicator: true
            effective_date_start: 2025-07-01
            effective_date_end: 9999-12-31
          - employee_number: 102
            job_title: Teacher in Residence
            primary_indicator: true
            effective_date_start: 2026-07-01
            effective_date_end: 9999-12-31
      - input: ref("int_students__teacher_grade_levels")
        rows: []
      - input: ref("int_performance_management__overall_scores")
        rows: []
      - input: ref("int_people__staff_roster")
        rows: []
    expect:
      rows:
        - employee_number: 101
          smg_etr_pm2: 2.0
          tir_etr_pm2: 3.0
          tir_so_pm2: 3.0
          tir_values_pm2: null
          tir_pm2: 2.2
        - employee_number: 102
          smg_etr_pm2: 3.0
          tir_etr_pm2: 2.0
          tir_so_pm2: null
          tir_values_pm2: 4.0
          tir_pm2: 3.2
