models:
  - name: rpt_tableau__stipend_and_bonus_app
    columns:
      - name: location_clean_name
        data_type: string
        description: >-
          Canonical location from int_people__location_crosswalk. Drives the
          Tableau location gate; retired name aliases collapse onto their
          canonical clean name here.
        data_tests:
          - not_null
      - name: home_business_unit_name
        data_type: string
        description: >-
          Legal entity. Drives the Tableau entity gate. Never location_region,
          which is a property of the location rather than the person.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TEAM Academy Charter School
                  - KIPP Cooper Norcross Academy
                  - KIPP Miami
                  - KIPP Paterson
                  - KIPP TEAM and Family Schools Inc.
      - name: event_id
        data_type: string
      - name: employee_number
        data_type: int64
      - name: stipend_type
        data_type: string
      - name: pay_code
        data_type: string
      - name: amount
        data_type: float64
      - name: payment_date
        data_type: string
      - name: description
        data_type: string
      - name: first_approval
        data_type: string
      - name: first_approver_employee_number
        data_type: int64
      - name: second_approval
        data_type: string
      - name: second_approver_employee_number
        data_type: int64
      - name: edited_by
        data_type: string
      - name: edited_at
        data_type: timestamp
      - name: submitter
        data_type: string
      - name: teammate
        data_type: string
      - name: job_title
        data_type: string
      - name: position_id
        data_type: string
      - name: company_code
        data_type: string
      - name: entity_short
        data_type: string
      - name: campus_name
        data_type: string
      - name: home_department_name
        data_type: string
      - name: job_function
        data_type: string
        description: Drives the AP role predicate; NULL for 63 active staff.
      - name: mail
        data_type: string
        description: Post-cutover Tableau identity.
      - name: user_principal_name
        data_type: string
      - name: sam_account_name
        data_type: string
      - name: reports_to_mail
        data_type: string
      - name: reports_to_sam_account_name
        data_type: string
