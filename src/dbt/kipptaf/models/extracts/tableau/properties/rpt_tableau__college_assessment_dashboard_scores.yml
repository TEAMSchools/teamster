models:
  - name: rpt_tableau__college_assessment_dashboard_scores
    description: >-
      Score-level detail for the CARAT workbook's average-score views. Reads the
      official assessment hub only, so every row is an official result —
      practice results never appear here. Region, school, and graduation year
      come from the student's current enrollment rather than their enrollment at
      test time, because the join carries no academic-year predicate.
      Deduplicated against byte-identical rows inherited from duplicate kippadb
      standardized test records; see the inline TODO.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - score_type
              - test_date
              - scale_score
          config:
            severity: error
            # Guards the deduplication. These four columns functionally determine
            # every other projected column, so a failure here means new
            # non-identical duplicates appeared upstream.
    columns:
      - name: student_number
        data_type: int64
        description: Student Number assigned by the school. Indexed.
      - name: test_type
        data_type: string
        description: >-
          Always Official in this model, since it reads only the official
          assessment hub.
      - name: scope
        data_type: string
        description: >-
          Assessment family — SAT, ACT, PSAT 8/9, PSAT10, or PSAT NMSQT. Drives
          the column headers on the average-score view.
      - name: score_type
        data_type: string
        description: >-
          Specific score within the assessment, such as sat_total_score or
          sat_ebrw. Six sub-test types are excluded by name, so this is a
          denylist — a new score type upstream is included automatically.
      - name: subject_area
        data_type: string
        description: Section subject as reported by the source.
      - name: aligned_subject_area
        data_type: string
        description: >-
          Subject normalized across assessment families so sections are
          comparable, with Total covering composite and combined scores. Backs
          the workbook's Aligned Subject Area filter.
      - name: test_date
        data_type: date
        description: The date this test was given.
      - name: scale_score
        data_type: numeric
        description: >-
          Scale score for this specific sitting. One of the two measures the
          workbook's Score Category parameter selects between.
      - name: max_scale_score
        data_type: numeric
        description: >-
          The student's highest scale score for this score type across all
          sittings. The other measure the Score Category parameter selects.
      - name: region
        data_type: string
        description: >-
          The student's current region, not the region they tested in — scores
          follow a student who transfers.
      - name: school
        data_type: string
        description: The student's current school, on the same basis as region.
      - name: graduation_year
        data_type: int64
        description: >-
          Expected graduation year, used as the cohort grouping on the
          average-score view. A small number of rows carry no value and drop out
          of grouped views.
      - name: ktc_cohort
        data_type: int64
        description: KIPP Through College cohort year.
