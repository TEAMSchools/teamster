models:
  - name: rpt_tableau__survey_links
    description: >-
      One row per staff survey assignment, at the grain of employee_number,
      survey, academic_year, and survey_round. Carries the personalized form
      link for each assignment and a completion flag derived from the latest
      response for that round, so a person's outstanding surveys can be read
      without joining a second source. Limited to active, primary-assignment
      staff. Most surveys also wait until a person was hired or rehired at least
      three weeks ago, since a brand-new hire has not yet been asked to respond;
      the staff and leader intent to return surveys do not wait, because they
      ask about next year.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - employee_number
              - survey
              - academic_year
              - survey_round
          config:
            severity: error
    columns:
      - name: employee_number
        data_type: int64
        description: Staff identifier from the ADP-derived roster.
        config:
          meta:
            contains_pii: true
        data_tests:
          - not_null
      - name: academic_year
        data_type: int64
        description: Academic year of the survey round.
        data_tests:
          - not_null
      - name: survey_round
        data_type: string
        description: >-
          Reporting term code identifying which administration of the survey
          this assignment belongs to.
        data_tests:
          - not_null
      - name: assignment_status
        data_type: string
        description: >-
          Roster assignment status. Always Active, because only active staff are
          assigned a survey.
      - name: preferred_name_lastfirst
        data_type: string
        description: Staff preferred name, last name first.
        config:
          meta:
            contains_pii: true
      - name: business_unit
        data_type: string
        description: Legal entity the person is employed by.
      - name: location
        data_type: string
        description: Home work location the person is assigned to.
      - name: department
        data_type: string
        description: Home department the person is assigned to.
      - name: job_title
        data_type: string
        description: Job title on the person's primary assignment.
      - name: hire_date
        data_type: date
        description: Original hire date from the roster.
      - name: mail
        data_type: string
        description: Work email address, used to send survey reminders.
        config:
          meta:
            contains_pii: true
      - name: google_email
        data_type: string
        description: Google Workspace address, where that differs from mail.
        config:
          meta:
            contains_pii: true
      - name: report_to_employee_number
        data_type: int64
        description: Employee number of the person's manager.
        config:
          meta:
            contains_pii: true
      - name: report_to_preferred_name_lastfirst
        data_type: string
        description: Manager's preferred name, last name first.
        config:
          meta:
            contains_pii: true
      - name: samaccountname
        data_type: string
        description: Active Directory account name.
        config:
          meta:
            contains_pii: true
      - name: username
        data_type: string
        description: >-
          Login name taken from the part of the user principal name before the
          domain, lowercased with hyphens removed.
        config:
          meta:
            contains_pii: true
      - name: is_current
        data_type: boolean
        description: >-
          True where the survey round is the one currently open, per the
          reporting terms sheet.
      - name: survey
        data_type: string
        description: >-
          Name of the survey the person is assigned. Leaders get the Leader
          Intent to Return Survey instead of the staff Intent to Return Survey
          for any academic year that has a leader round. A leader is anyone
          whose job title, home department, and home business unit are all on
          recruitment's lists, which live in the leader_population CTE.
      - name: assignment
        data_type: string
        description: >-
          Label shown to the person for the assignment. Usually a call to
          action; for the Manager Survey it identifies the manager being
          evaluated.
        config:
          meta:
            contains_pii: true
      - name: link
        data_type: string
        description: >-
          Personalized survey URL. Most surveys prefill the person's name,
          location, and employee number so responses can be attributed. The
          Staff Info and Certification Update form additionally prefills the
          person's current demographic and education answers so they only have
          to correct what changed. Leaders get the leader form's link rather
          than the staff intent to return form. TNTP Insight and Gallup Q12 link
          to a help article instead, because those surveys are reached from an
          emailed link.
        config:
          meta:
            contains_pii: true
      - name: completion
        data_type: int64
        description: >-
          1 where a response to this survey round exists for the person, 0 where
          none does. Null for TNTP Insight and Gallup Q12, which are
          administered outside Google Forms and so never produce a response here
          — a 0 would read as confirmed incomplete rather than unknown.

unit_tests:
  - name: test_survey_links_leader_intent_to_return
    description: >-
      Leaders (title, department, and entity all on recruitment's lists) get the
      leader survey and lose the staff Intent to Return Survey only in a year
      with a leader round. A title match in an unlisted department, a KTAF
      Teacher Development Director, and the Managing Director of Talent
      Acquisition are not leaders. KTAF never gets the staff survey. A recent
      hire gets both intent to return surveys; a non-primary assignment gets
      nothing.
    model: rpt_tableau__survey_links
    given:
      - input: ref('int_surveys__survey_submissions')
        format: sql
        rows: |
          select
              0 as respondent_employee_number,
              2026 as academic_year,
              'ITR' as term_code,
              'r0' as survey_response_id,
              timestamp '2026-12-01 12:00:00' as date_submitted,
              1 as round_rn
      - input: ref('int_people__staff_roster')
        format: sql
        rows: |
          select
              p.employee_number,
              'Active' as assignment_status,
              p.primary_indicator,
              p.worker_original_hire_date,
              cast(null as date) as worker_rehire_date,
              p.job_title,
              p.home_department_name,
              p.home_business_unit_name,
              'Person' as formatted_name,
              'School A' as home_work_location_name,
              'MS' as home_work_location_grade_band,
              cast(null as string) as mail,
              cast(null as string) as google_email,
              cast(null as int64) as reports_to_employee_number,
              cast(null as string) as reports_to_formatted_name,
              cast(null as timestamp) as survey_last_submitted_timestamp,
              cast(null as string) as race_ethnicity,
              cast(null as string) as gender_identity,
              cast(null as string) as community_grew_up,
              cast(null as string) as community_professional_exp,
              cast(null as string) as languages_spoken,
              cast(null as string) as additional_languages,
              cast(null as string) as level_of_education,
              cast(null as string) as undergraduate_school,
              cast(null as int64) as years_exp_outside_kipp,
              cast(null as int64) as years_teaching_in_njfl,
              cast(null as int64) as years_teaching_outside_njfl,
              cast(null as string) as alumni_status,
              cast(null as string) as relay_status,
              cast(null as string) as path_to_education,
              cast(null as string) as sam_account_name,
              cast(null as string) as user_principal_name
          from
              unnest(
                  [
                      struct(
                          101 as employee_number,
                          true as primary_indicator,
                          date '2020-08-01' as worker_original_hire_date,
                          'School Leader' as job_title,
                          'School Leadership' as home_department_name,
                          'TEAM Academy Charter School' as home_business_unit_name
                      ),
                      (
                          102, true, date '2020-08-01', 'School Leader',
                          'Human Resources', 'TEAM Academy Charter School'
                      ),
                      (
                          103, true, date '2020-08-01', 'Director',
                          'Teaching and Learning', 'KIPP TEAM and Family Schools Inc.'
                      ),
                      (
                          104, true, date '2020-08-01', 'Director',
                          'Teacher Development', 'KIPP TEAM and Family Schools Inc.'
                      ),
                      (
                          105, true, date '2020-08-01',
                          'Managing Director of Talent Acquisition',
                          'Talent Acquisition', 'KIPP TEAM and Family Schools Inc.'
                      ),
                      (
                          106, true, date_sub(current_date(), interval 1 week),
                          'School Leader', 'School Leadership', 'KIPP Miami'
                      ),
                      (
                          107, false, date '2020-08-01', 'School Leader',
                          'School Leadership', 'KIPP Miami'
                      )
                  ]
              ) as p
      - input: ref('stg_google_sheets__reporting__terms')
        format: sql
        rows: |
          select
              'Leader Intent to Return Survey' as `name`,
              'SURVEY' as type,
              2026 as academic_year,
              'LITR' as code,
              true as is_current,
              date '2026-11-30' as start_date,
              date '2026-12-11' as end_date
          union all
          select
              'Intent to Return Survey', 'SURVEY', 2026, 'ITR', true,
              date '2026-11-30', date '2027-01-15'
          union all
          select
              'Intent to Return Survey', 'SURVEY', 2025, 'ITR', false,
              date '2025-11-24', date '2026-02-28'
    expect:
      rows:
        - {
            employee_number: 101,
            survey: Leader Intent to Return Survey,
            academic_year: 2026,
          }
        - {
            employee_number: 101,
            survey: Intent to Return Survey,
            academic_year: 2025,
          }
        - {
            employee_number: 102,
            survey: Intent to Return Survey,
            academic_year: 2025,
          }
        - {
            employee_number: 102,
            survey: Intent to Return Survey,
            academic_year: 2026,
          }
        - {
            employee_number: 103,
            survey: Leader Intent to Return Survey,
            academic_year: 2026,
          }
        - {
            employee_number: 106,
            survey: Leader Intent to Return Survey,
            academic_year: 2026,
          }
        - {
            employee_number: 106,
            survey: Intent to Return Survey,
            academic_year: 2025,
          }
