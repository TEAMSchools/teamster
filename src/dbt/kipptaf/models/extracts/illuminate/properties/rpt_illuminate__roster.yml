models:
  - name: rpt_illuminate__roster
    description: >-
      Rosters students and sections into Illuminate. Network-wide, Miami
      included: Miami is an Illuminate region and held 13,981 rows here in prod
      as of 2026-08-27. Ratified on #4996.
    columns:
      - name: "`01 Student ID`"
        data_type: int64
      - name: "`02 SSID`"
        data_type: int64
      - name: "`03 Last Name`"
        data_type: int64
      - name: "`04 First Name`"
        data_type: int64
      - name: "`05 Middle Name`"
        data_type: int64
      - name: "`06 Birth Date`"
        data_type: int64
      - name: "`07 Section ID`"
        data_type: string
      - name: "`08 Site ID`"
        data_type: int64
      - name: "`09 Course ID`"
        data_type: string
      - name: "`10 User ID`"
        data_type: string
      - name: "`11 Entry Date`"
        data_type: date
      - name: "`12 Leave Date`"
        data_type: date
      - name: "`13 Grade Level ID`"
        data_type: int64
      - name: "`14 Academic Year`"
        data_type: string
      - name: "`15 Session Type ID`"
        data_type: int64
