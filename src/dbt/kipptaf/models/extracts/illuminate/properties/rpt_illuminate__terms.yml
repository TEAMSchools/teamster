models:
  - name: rpt_illuminate__terms
    description: >-
      Term feed for Illuminate. Newark, Camden, and Paterson only; Miami left
      Illuminate ahead of AY2026-27 and is excluded by an inclusive region
      filter.
    columns:
      - name: "`01 Site ID`"
        data_type: int64
      - name: "`02 Term Name`"
        data_type: string
      - name: "`03 Term Num`"
        data_type: int64
      - name: "`04 Start Date`"
        data_type: date
      - name: "`05 End Date`"
        data_type: date
      - name: "`06 Term Type`"
        data_type: int64
      - name: "`07 Session Type ID`"
        data_type: int64
      - name: "`08 Academic Year`"
        data_type: string
      - name: "`09 Local Term ID`"
        data_type: int64
