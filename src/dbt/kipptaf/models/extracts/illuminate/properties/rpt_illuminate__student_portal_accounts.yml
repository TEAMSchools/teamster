models:
  - name: rpt_illuminate__student_portal_accounts
    description: >-
      Student portal account feed for Illuminate. Newark, Camden, and Paterson
      only; Miami left Illuminate ahead of AY2026-27 and is excluded by an
      inclusive region filter.
    columns:
      - name: "`01 Student ID`"
        data_type: int64
      - name: "`02 Username`"
        data_type: string
      - name: "`03 Email`"
        data_type: string
      - name: "`04 Enable Portal`"
        data_type: int64
      - name: "`05 Temporary Password`"
        data_type: string
