models:
  - name: rpt_illuminate__roles
    description: >-
      Staff role assignment feed for Illuminate. Newark, Camden, and Paterson
      only; Miami left Illuminate ahead of AY2026-27 and is excluded by an
      inclusive region filter. Network staff get roles at every New Jersey
      school only when their home office is in one of those regions, the same
      rule rpt_illuminate__users applies, so every role has a matching user.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - "`01 Local User ID`"
              - "`02 Site ID`"
              - "`03 Role Name`"
              - "`04 Academic Year`"
              - "`05 Session Type ID`"
          config:
            severity: error
    columns:
      - name: "`01 Local User ID`"
        data_type: string
      - name: "`02 Site ID`"
        data_type: int64
      - name: "`03 Role Name`"
        data_type: string
      - name: "`04 Academic Year`"
        data_type: string
      - name: "`05 Session Type ID`"
        data_type: int64
