models:
  - name: rpt_branchingminds__behavior_incident
    description: >
      One row per disciplinary DeansList incident for Newark, Camden, and
      Paterson, built for the Branching Minds daily SFTP feed. Excludes
      non-disciplinary referral categories (Social Work, Non-Behavioral, and
      Documentation-only entries) so only genuine behavioral incidents are sent.
      Scoped to the current academic year only.
    columns:
      - name: incident_id
        data_type: string
        description: >-
          DeansList's own incident identifier, confirmed unique across the
          network.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: school_id
        data_type: string
        description: DeansList school identifier where the incident occurred.
      - name: type
        quote: true
        data_type: string
        description: >-
          Incident category as logged in DeansList, e.g. Tier 2 - Cutting Class.
      - name: location
        data_type: string
        description: >-
          Free-text location where the incident occurred, as logged by staff.
      - name: date
        quote: true
        data_type: date
        description: Date the incident occurred.
