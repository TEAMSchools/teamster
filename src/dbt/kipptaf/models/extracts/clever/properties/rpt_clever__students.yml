models:
  - name: rpt_clever__students
    description:
      Clever roster feed for students — one row per (student, contact slot,
      phone type). UNPIVOT drops null inputs, so a contact with no phone of a
      given type emits no row for it. contact_1 is the single reportable parent
      (contact_type 'primary'); emergency_1 through emergency_4 are emergency
      contacts. ext__district_sisid and ext__school_sisid carry the region's
      NJDOE codes from dim_regions so Amplify can pass them to NJDOE.
    columns:
      - name: ext__district_sisid
        data_type: string
        description:
          NJDOE district code for the student's region, from
          dim_regions.state_district_id. Written to Clever as
          ext.district_sisid.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: ext__school_sisid
        data_type: string
        description:
          NJDOE school code for the student's region, from
          dim_regions.state_school_id. Written to Clever as ext.school_sisid.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: last_name
        data_type: string
      - name: middle_name
        data_type: string
      - name: first_name
        data_type: string
      - name: gender
        data_type: string
      - name: graduation_year
        data_type: int64
      - name: race
        data_type: string
      - name: student_email
        data_type: string
      - name: username
        data_type: string
      - name: ext__gifted
        data_type: string
      - name: contact_relationship
        data_type: string
      - name: unweighted_gpa
        data_type: float64
      - name: weighted_gpa
        data_type: float64
      - name: hispanic_latino
        data_type: int64
      - name: home_language
        data_type: int64
      - name: frl_status
        data_type: int64
      - name: student_street
        data_type: int64
      - name: student_city
        data_type: int64
      - name: student_state
        data_type: int64
      - name: student_zip
        data_type: int64
      - name: contact_email
        data_type: int64
      - name: contact_sis_id
        data_type: int64
      - name: password
        data_type: int64
      - name: school_id
        data_type: string
      - name: student_id
        data_type: string
      - name: student_number
        data_type: string
      - name: dob
        data_type: string
      - name: contact_name
        data_type: string
      - name: contact_phone
        data_type: string
      - name: ell_status
        data_type: string
      - name: iep_status
        data_type: string
      - name: state_id
        data_type: string
      - name: grade
        data_type: string
      - name: contact_type
        data_type: string
      - name: contact_phone_type
        data_type: string
