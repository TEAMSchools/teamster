models:
  - name: rpt_python__manager_pm_averages
    description: >-
      One row per observer per performance management round: the observer's
      average score on each coach scoring rubric measure and overall, across the
      teachers they scored that round. Rows come from published SchoolMint Grow
      forms with observation type PM (before 2024) or PMS (2024 onward), so a
      renamed rubric is still picked up. Input to the PM outlier detection
      script.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - observer_employee_number
              - academic_year
              - form_term
    columns:
      - name: observer_employee_number
        data_type: int64
        description: Employee number of the observer who scored the forms.
        data_tests:
          - not_null
        config:
          meta:
            contains_pii: true
      - name: academic_year
        data_type: int64
        description: Academic year of the round, as its starting calendar year.
        data_tests:
          - not_null
      - name: form_term
        data_type: string
        description: PM round code from the reporting terms sheet (PM1-PM3).
        data_tests:
          - not_null
      - name: term_num
        data_type: int64
        description: Round number parsed from the last character of form_term.
      - name: etr1a
        data_type: float64
        description: Average row score on rubric measure ETR1A.
      - name: etr1b
        data_type: float64
        description: Average row score on rubric measure ETR1B.
      - name: etr2a
        data_type: float64
        description: Average row score on rubric measure ETR2A.
      - name: etr2b
        data_type: float64
        description: Average row score on rubric measure ETR2B.
      - name: etr2c
        data_type: float64
        description: Average row score on rubric measure ETR2C.
      - name: etr2d
        data_type: float64
        description: Average row score on rubric measure ETR2D.
