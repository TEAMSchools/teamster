models:
  - name: rpt_deanslist__mod_assessment
    description: >
      DeansList SFTP CDO extract for K-4 enrichment grades, covering every
      subject area except Text Study and Mathematics. Each row is one
      student-subject-term average score for the current academic year, drawn
      from Unit Assessments and from assessments whose AppSheet report-card
      regions include the student's region. Only assessments with a reporting
      term are included. The avg_pct_correct is the rounded mean of the overall
      percent correct across those assessments for that student, subject, and
      term. A row whose average falls in no band of its performance band set is
      dropped.
    config:
      meta:
        contains_pii: true
    data_tests:
      # These 4 columns are the group by of assessment_response_avg, so the row
      # grain is already guaranteed. What this test actually catches is the
      # int_illuminate__performance_band_sets join fanning out, which happens
      # when one avg_pct_correct falls inside two bands of the same set.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
              - term_administered
              - subject_area_label
    columns:
      - name: student_number
        data_type: int64
        description: PowerSchool student number.
      - name: academic_year
        data_type: int64
        description:
          Academic year as the starting calendar year (e.g. 2025 for 2025-26).
      - name: term_administered
        data_type: string
        description: >
          RT reporting term (e.g. Q1, Q2) for the student's school whose date
          range contains the assessment's administered date.
      - name: subject_area_label
        data_type: string
        description: >
          Illuminate subject area name used as the display label in DeansList
          (e.g. Science, Social Studies).
      - name: module_num
        data_type: string
        description: >
          Module identifier formatted for DeansList (e.g. QA1, QA2), derived
          from term_administered by replacing the Q prefix with QA.
      - name: avg_pct_correct
        data_type: numeric
        description: >
          Rounded average percent correct across all assessments for this
          student, subject, and term.
      - name: proficiency_label
        data_type: string
        description: >
          Label of the band whose range contains avg_pct_correct, on the
          lowest-id performance band set among the averaged assessments.
      - name: subject_area
        data_type: string
        description: >
          Fixed value 'ENRICHMENT', used by DeansList to route rows to the
          enrichment grade CDO.
      - name: scope
        data_type: string
        description:
          Fixed value 'UA' for the DeansList CDO, set on every row whatever the
          scope of the averaged assessments.
      - name: rn_unit
        data_type: int64
        description: >
          Always null in this model; placeholder for the DeansList CDO schema
          which expects this field.
