models:
  - name: rpt_deanslist__mod_standards
    description: >-
      DeansList SFTP CDO extract of ELA and Math reporting-group averages for
      the current academic year. Each row is one student, subject, term,
      reporting group, and performance band set, averaging the group-level
      percent correct across the student's internal assessments in Text Study,
      Mathematics, and Writing. Writing is reported as Text Study. The band set
      is the assessment's own, not the one Illuminate tags on the reporting
      group, because a group tagged with a different set would split the
      student's average into one row per set. A row whose average falls in no
      band of its performance band set is dropped.
    config:
      meta:
        contains_pii: true
    data_tests:
      # Narrower than the model grain, which includes performance_band_set_id
      # and folds Writing into Text Study. Two assessments in one term on
      # different band sets, or a Writing and Text Study label collision, would
      # send DeansList two rows for one standard; this test catches both.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
              - subject_area
              - term
              - standard_description
    columns:
      - name: student_number
        data_type: int64
        description: PowerSchool student number.
      - name: academic_year
        data_type: int64
        description:
          Academic year as the starting calendar year. Always the current
          academic year.
      - name: subject_area
        data_type: string
        description:
          Illuminate subject area, Text Study or Mathematics, with Writing
          folded into Text Study.
      - name: term
        data_type: string
        description:
          RT reporting term for the student's school whose date range contains
          the assessment's administered date.
      - name: response_type
        data_type: string
        description:
          First letter of the response type, uppercased. Always G (reporting
          group).
      - name: standard_description
        data_type: string
        description: Illuminate reporting group description.
      - name: percent_correct
        data_type: numeric
        description:
          Rounded average group-level percent correct for the student, subject,
          term, and reporting group.
      - name: standard_proficiency
        data_type: string
        description:
          Mastery label from the matched band's label number — 5 Advanced
          Mastery, 4 Mastery, 3 Approaching Mastery, 2 Below Mastery, 1 Far
          Below Mastery. Null for any other label number.

unit_tests:
  - name: test_rpt_deanslist__mod_standards_reporting_group_band_set
    description: >-
      Two assessments in one term share the reporting group MC. Assessment 9002
      tags the group with band set 1 in Illuminate, but both assessments use
      band set 500. The student gets one row, averaged across both (60 and 80
      make 70), labeled on band set 500.
    model: rpt_deanslist__mod_standards
    given:
      - input: ref('int_assessments__response_rollup')
        format: sql
        rows: |
          select
              101 as student_number,
              2026 as academic_year,
              'Q1' as term_administered,
              9001 as assessment_id,
              true as is_internal_assessment,
              'group' as response_type,
              'MC' as response_type_description,
              500 as performance_band_set_id,
              cast(60 as numeric) as percent_correct,
              'Text Study' as subject_area
          union all
          select
              101, 2026, 'Q1', 9002, true, 'group', 'MC', 1,
              cast(80 as numeric), 'Text Study'
      - input: ref('int_assessments__performance_bands')
        format: sql
        rows: |
          select
              9001 as assessment_id,
              'overall' as response_type,
              500 as canonical_performance_band_set_id
          union all
          select 9002, 'overall', 500
      - input: ref('int_illuminate__performance_band_sets')
        format: sql
        rows: |
          select
              500 as performance_band_set_id,
              3 as label_number,
              cast(50 as float64) as minimum_value,
              cast(69.9 as float64) as maximum_value
          union all
          select 500, 4, 70, 84.9
          union all
          select 1, 3, 70, 79.9
          union all
          select 1, 4, 80, 89.9
    expect:
      rows:
        - student_number: 101
          subject_area: Text Study
          term: Q1
          standard_description: MC
          percent_correct: 70
          standard_proficiency: Mastery
