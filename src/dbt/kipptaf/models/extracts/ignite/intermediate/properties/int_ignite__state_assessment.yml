models:
  - name: int_ignite__state_assessment
    description:
      New Jersey state assessment results reshaped into the per-subject column
      families Mathematica's template expects — one row per student per academic
      year, with a math (`_m`) and reading (`_r`) block. New Jersey changed
      assessment vendors between the two years in scope, so scores come from two
      chains — `int_pearson__all_assessments` for SY2024-2025 and
      `int_cambium__all_assessments` for SY2025-2026 — unioned before the
      per-subject pick. Accommodation and exemption flags come from
      `stg_pearson__njsla`, which the Pearson intermediate does not carry
      forward. Two limitations are structural — New Jersey administers no
      separate writing assessment, so Mathematica's optional `_w` family has no
      source and is omitted, and NJGPA carries no accommodation or exemption
      fields at all. A third is current rather than structural. The Cambium file
      does carry accommodation and exemption columns, but `stg_cambium__njsla`
      projects 28 of its 228 columns and does not include them, so no
      SY2025-2026 row can reach them from here yet. All three cases yield null
      rather than zero, because the value recorded is the absence of an answer
      rather than a negative answer. Cambium also redefined the exemption field
      — Pearson used a yes/no flag where Cambium uses `N` plus the codes `B`,
      `E` and `M` — so wiring the column through needs a mapping, not a
      passthrough.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
          config:
            severity: error
    columns:
      - name: student_number
        data_type: int64
        description:
          KIPP student number, taken from Pearson's `localstudentidentifier` or
          from Cambium's `student_number`.

      - name: academic_year
        data_type: int64
        description:
          Start year of the school year. 2024 resolves to the Pearson chain and
          2025 to the Cambium chain, which is the vendor cutover rather than a
          choice made here.

      - name: test_score_m
        data_type: numeric
        description:
          Scale score on the math state assessment. Where a student sat both an
          end-of-course test and NJGPA in one year, NJSLA is preferred as the
          state summative assessment.

      - name: test_grd_m
        data_type: int64
        description: Grade level of the math test taken.

      - name: test_subj_m_eoc
        data_type: string
        description:
          End-of-course math subject — Algebra I, Algebra II or Geometry. Null
          for a general Mathematics or NJGPA administration, which is what
          Mathematica's template expects for a non-end-of-course test.

      - name: test_name_m
        data_type: string
        description: Name of the math test taken, either NJSLA or NJGPA.

      - name: accom_m
        data_type: int64
        description:
          1 where the student had a discretionary testing accommodation on the
          math test, 0 where the file records none, null where no accommodation
          source exists for that test. Derived from the fourteen named
          accommodation columns `stg_pearson__njsla` carries — extended time,
          frequent breaks, small-group testing and the rest. Text-to-speech is
          deliberately excluded — New Jersey grants it universally to any
          student testing on a computer without a conflicting accommodation, so
          it records the delivery mode rather than a decision about a student,
          and counting it would mark most of the cohort accommodated. Null
          covers two populations — students whose only result is NJGPA, which
          carries no accommodation fields at all, and SY2025-2026 rows, whose
          Cambium source is not yet staged.

      - name: exemption_m
        data_type: int64
        description:
          1 where the student was exempt from taking the math test or the test
          was found invalid, which is what Mathematica's codebook defines this
          as. Derived from `voidscorecode` and the exempt-from-taking fields,
          not from `iepexemptfrompassing` — that records exemption from the
          graduation passing requirement, a different thing that would overstate
          this column if used.

      - name: test_score_r
        data_type: numeric
        description:
          Scale score on the reading and English language arts assessment.

      - name: test_grd_r
        data_type: int64
        description: Grade level of the reading test taken.

      - name: test_subj_r_eoc
        data_type: string
        description:
          End-of-course reading subject. Always null — New Jersey administers no
          end-of-course English language arts assessment.

      - name: test_name_r
        data_type: string
        description: Name of the reading test taken, either NJSLA or NJGPA.

      - name: accom_r
        data_type: int64
        description:
          1 where the student had a discretionary testing accommodation on the
          reading test. Same derivation, same text-to-speech exclusion and same
          null handling as `accom_m`.

      - name: exemption_r
        data_type: int64
        description:
          1 where the student was exempt from taking the reading test or the
          test was found invalid. Same derivation as `exemption_m`.
