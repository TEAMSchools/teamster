models:
  - name: rpt_schoolmint_grow__users
    description: >
      One row per Grow user, comparing the desired source-of-truth state (from
      ADP / staff roster) against the current destination state in SchoolMint
      Grow. Drives `grow_user_sync` create / update / archive / restore
      decisions via `surrogate_key_source` vs `surrogate_key_destination`.
      Excludes Paterson staff, who do not use Grow. The Teacher predicate is ADP
      `job_function` of "Teacher" or "Teacher in Residence", falling back to a
      job title containing "Teacher" or "Learning" while `job_function` is null
      on a new work assignment. Users matching both the Coach predicate
      (instructional manager) and the Teacher predicate receive both roles in
      `role_names` / `role_ids`. Admin classifications take precedence over
      Coach / Teacher.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: array_length(role_ids) >= 1
      - dbt_utils.expression_is_true:
          arguments:
            expression: array_length(role_ids) = array_length(role_names)
    columns:
      - name: user_internal_id
        data_type: int64
        description: ADP employee number. Sent as Grow `internalId`.
        data_tests:
          - unique
          - not_null
      - name: user_name
        data_type: string
        description: Display name (`given_name || ' ' || family_name_1`).
      - name: user_email
        data_type: string
        description: ADP Google Workspace email. Sent as Grow `email`.
      - name: inactive
        data_type: int64
        description: >
          1 when ADP `assignment_status` is `Terminated` or `Deceased`, else 0.
          Drives archive vs create/update branching.
      - name: role_names
        data_type: array<string>
        description: >
          Human-readable role labels (`Sub Admin`, `Regional Admin`, `School
          Admin`, `School Assistant Admin`, `Coach`, `Teacher`), ordered
          alphabetically by `role_id` so elements align with `role_ids`.
      - name: school_id
        data_type: string
        description: >
          Grow school ID resolved from ADP home work location via
          `stg_schoolmint_grow__schools`.
      - name: role_ids
        data_type: array<string>
        description: >
          Grow role IDs the user should be assigned, ordered alphabetically by
          role_id. Lines up positionally with `role_names`. Sent verbatim as the
          `roles` array in the Grow API payload.
      - name: user_id
        data_type: string
        description: >
          Grow user `_id` for an existing destination user, NULL when no
          matching Grow user exists yet.
      - name: archived_at
        data_type: string
        description:
          Grow archival timestamp; non-NULL when the Grow user is archived.
      - name: user_email_ws
        data_type: string
        description: Current `email` on the Grow user (destination side).
      - name: user_name_ws
        data_type: string
        description: Current `name` on the Grow user (destination side).
      - name: school_id_ws
        data_type: string
        description: Current `defaultInformation.school` on the Grow user.
      - name: grade_id_ws
        data_type: string
        description: Current `defaultInformation.gradeLevel` on the Grow user.
      - name: course_id_ws
        data_type: string
        description: Current `defaultInformation.course` on the Grow user.
      - name: coach_id_ws
        data_type: string
        description: Current `coach` (Grow user `_id`) on the Grow user.
      - name: coach_id
        data_type: string
        description: >
          Desired coach: Grow user `_id` of the manager identified by ADP
          `reports_to_employee_number`.
      - name: course_id
        data_type: string
        description: >
          Grow course tag `_id` matched from ADP `home_department_name` via
          `stg_schoolmint_grow__generic_tags` (tag_type = 'courses').
      - name: grade_id
        data_type: string
        description: >
          Grow grade tag `_id` matched from ADP `primary_grade_level_taught`
          (K-coded for 0) via `stg_schoolmint_grow__generic_tags` (tag_type =
          'grades').
      - name: role_ids_ws
        data_type: array<string>
        description: >
          Current Grow role IDs on the destination user, ordered alphabetically.
          Empty array when the Grow user has no roles.
      - name: inactive_ws
        data_type: int64
        description: Current Grow `inactive` flag (0/1) on the destination user.
      - name: group_type
        data_type: string
        description: >
          Observation-group membership directive consumed by `grow_user_sync`:
          `observers` for admins, `observees;observers` for users that include
          `Coach` in `role_names`, otherwise `observees`.
      - name: surrogate_key_source
        data_type: string
        description: >
          Hash of the desired-state fields (uses `array_to_string(role_ids,
          ',')` for the role component). Compared against
          `surrogate_key_destination` to decide whether to issue a Grow update.
      - name: surrogate_key_destination
        data_type: string
        description: >
          Hash of the destination-state fields (uses
          `array_to_string(role_ids_ws, ',')` for the role component).

unit_tests:
  - name: unit_grow_users_teacher_predicate_and_coach_precedence
    description:
      Pins the two fixes in Task 1. A teacher is identified by job_function
      alone, so a staff member titled "Teacher" with a null job_function is no
      longer a teacher and no longer makes their manager a Coach. The
      instructional-manager predicate is parenthesised, so a manager whose only
      report is terminated no longer qualifies as Coach -- the signal is now the
      absence of Coach on that manager's row (row 12), not the absence of the
      row itself, since Task 2 makes Coach additive rather than suppressed by an
      admin role.
    model: rpt_schoolmint_grow__users
    given:
      - input: ref('int_people__staff_roster')
        format: sql
        rows: |
          select
              1 as employee_number,
              'teach1@apps.teamschools.org' as google_email,
              10 as reports_to_employee_number,
              'KIPP TEAM Academy' as home_work_location_reporting_name,
              'Elementary' as home_department_name,
              'kippnewark' as home_work_location_dagster_code_location,
              'Ada' as given_name,
              'Real' as family_name_1,
              'Active' as assignment_status,
              'Teacher' as job_function,
              'Teacher' as job_title,
              5 as primary_grade_level_taught,
              'areal@apps.teamschools.org' as user_principal_name,
              cast(null as date) as worker_termination_date
          union all
          select
              2, 'teach2@apps.teamschools.org', 11, 'KIPP TEAM Academy',
              'Elementary', 'kippnewark', 'Nul', 'Function', 'Active',
              cast(null as string), 'Teacher', 5,
              'nfunction@apps.teamschools.org', cast(null as date)
          union all
          select
              3, 'term@apps.teamschools.org', 12, 'KIPP TEAM Academy',
              'Student Support', 'kippnewark', 'Gone', 'Already', 'Terminated',
              'Teacher', 'Teacher', 5, 'galready@apps.teamschools.org',
              date '2024-06-30'
          union all
          select
              10, 'mgr1@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'School Leadership', 'kippnewark',
              'Real', 'Manager', 'Active', 'Assistant School Leaders',
              'Assistant School Leader', cast(null as int64),
              'rmanager@apps.teamschools.org', cast(null as date)
          union all
          select
              11, 'mgr2@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'School Leadership', 'kippnewark',
              'Nulls', 'Only', 'Active', 'Assistant School Leaders',
              'Assistant School Leader', cast(null as int64),
              'nonly@apps.teamschools.org', cast(null as date)
          union all
          select
              12, 'mgr3@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'Student Support', 'kippnewark',
              'Term', 'Reports', 'Active', 'Deans', 'Dean',
              cast(null as int64), 'treports@apps.teamschools.org',
              cast(null as date)
      - input: ref('stg_schoolmint_grow__roles')
        format: sql
        rows: |
          select 'r-coach' as role_id, 'Coach' as name
          union all
          select 'r-teacher', 'Teacher'
          union all
          select 'r-saa', 'School Assistant Admin'
          union all
          select 'r-sa', 'School Admin'
          union all
          select 'r-ra', 'Regional Admin'
      - input: ref('stg_schoolmint_grow__schools')
        format: sql
        rows: |
          select 'sch-team' as school_id, 'KIPP TEAM Academy' as name
      - input: ref('stg_schoolmint_grow__users')
        format: sql
        rows: |
          select
              cast(null as string) as user_id,
              cast(null as int64) as internal_id_int,
              cast(null as string) as archived_at,
              cast(null as string) as email,
              cast(null as string) as name,
              cast(null as string) as coach,
              cast(null as bool) as inactive,
              cast(null as string) as default_information_course,
              cast(null as string) as default_information_grade_level,
              cast(null as string) as default_information_school,
              cast(
                  null as array<struct<`_id` string, name string>>
              ) as roles
          from unnest([1])
          where false
      - input: ref('stg_schoolmint_grow__generic_tags')
        format: sql
        rows: |
          select
              cast(null as string) as tag_id,
              cast(null as string) as name,
              cast(null as string) as abbreviation,
              cast(null as string) as tag_type
          from unnest([1])
          where false
    expect:
      rows:
        - { user_internal_id: 1, role_names: [Teacher] }
        - { user_internal_id: 10, role_names: [Coach, School Assistant Admin] }
        - { user_internal_id: 11, role_names: [School Assistant Admin] }
        - { user_internal_id: 12, role_names: [School Assistant Admin] }

  - name: unit_grow_users_role_matrix
    description:
      Pins the tier-times-gate role matrix. One row per tier that grants a role,
      plus a Director in a department outside the gate proving the gate blocks,
      an Associate Director proving the one title promotion, a null job_function
      proving no fallback exists, and an admin who manages a teacher proving
      Coach is additive rather than replaced.
    model: rpt_schoolmint_grow__users
    given:
      - input: ref('int_people__staff_roster')
        format: sql
        rows: |
          select
              100 as employee_number,
              'chief@apps.teamschools.org' as google_email,
              cast(null as int64) as reports_to_employee_number,
              'KIPP TEAM Academy' as home_work_location_reporting_name,
              'Teaching and Learning' as home_department_name,
              'kippnewark' as home_work_location_dagster_code_location,
              'Chief' as given_name,
              'Academic' as family_name_1,
              'Active' as assignment_status,
              'Chief Level' as job_function,
              'Chief Academic Officer' as job_title,
              cast(null as int64) as primary_grade_level_taught,
              'chief@apps.teamschools.org' as user_principal_name,
              cast(null as date) as worker_termination_date
          union all
          select
              101, 'hos@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'School Support', 'kippnewark',
              'Head', 'Schools', 'Active', 'EDs, HOSs, MDOs',
              'Head of Schools', cast(null as int64),
              'hos@apps.teamschools.org', cast(null as date)
          union all
          select
              102, 'md@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'Special Education', 'kippnewark',
              'Managing', 'Director', 'Active',
              'KTAF or Regional Managing Director', 'Managing Director',
              cast(null as int64), 'md@apps.teamschools.org', cast(null as date)
          union all
          select
              103, 'blocked@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'Finance', 'kippnewark',
              'Gated', 'Out', 'Active', 'KTAF or Regional Director',
              'Director', cast(null as int64),
              'blocked@apps.teamschools.org', cast(null as date)
          union all
          select
              104, 'assoc@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'Special Education', 'kippnewark',
              'Assoc', 'Promoted', 'Active', 'KTAF or Regional Staff',
              'Associate Director', cast(null as int64),
              'assoc@apps.teamschools.org', cast(null as date)
          union all
          select
              105, 'sl@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'School Leadership', 'kippnewark',
              'School', 'Leader', 'Active', 'School Leader', 'School Leader',
              cast(null as int64), 'sl@apps.teamschools.org', cast(null as date)
          union all
          select
              106, 'dean@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'Student Support', 'kippnewark',
              'Assistant', 'Dean', 'Active', 'Deans', 'Assistant Dean',
              cast(null as int64), 'dean@apps.teamschools.org',
              cast(null as date)
          union all
          select
              107, 'nulljf@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'Teaching and Learning', 'kippnewark',
              'Null', 'Tier', 'Active', cast(null as string),
              'Achievement Director', cast(null as int64),
              'nulljf@apps.teamschools.org', cast(null as date)
          union all
          select
              108, 'coachadmin@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'School Leadership', 'kippnewark',
              'Coaching', 'Admin', 'Active', 'Assistant School Leaders',
              'Assistant School Leader', cast(null as int64),
              'coachadmin@apps.teamschools.org', cast(null as date)
          union all
          select
              109, 'report@apps.teamschools.org', 108,
              'KIPP TEAM Academy', 'Elementary', 'kippnewark',
              'Real', 'Teacher', 'Active', 'Teacher', 'Teacher', 5,
              'report@apps.teamschools.org', cast(null as date)
      - input: ref('stg_schoolmint_grow__roles')
        format: sql
        rows: |
          select 'r-coach' as role_id, 'Coach' as name
          union all
          select 'r-teacher', 'Teacher'
          union all
          select 'r-saa', 'School Assistant Admin'
          union all
          select 'r-sa', 'School Admin'
          union all
          select 'r-ra', 'Regional Admin'
      - input: ref('stg_schoolmint_grow__schools')
        format: sql
        rows: |
          select 'sch-team' as school_id, 'KIPP TEAM Academy' as name
      - input: ref('stg_schoolmint_grow__users')
        format: sql
        rows: |
          select
              cast(null as string) as user_id,
              cast(null as int64) as internal_id_int,
              cast(null as string) as archived_at,
              cast(null as string) as email,
              cast(null as string) as name,
              cast(null as string) as coach,
              cast(null as bool) as inactive,
              cast(null as string) as default_information_course,
              cast(null as string) as default_information_grade_level,
              cast(null as string) as default_information_school,
              cast(
                  null as array<struct<`_id` string, name string>>
              ) as roles
          from unnest([1])
          where false
      - input: ref('stg_schoolmint_grow__generic_tags')
        format: sql
        rows: |
          select
              cast(null as string) as tag_id,
              cast(null as string) as name,
              cast(null as string) as abbreviation,
              cast(null as string) as tag_type
          from unnest([1])
          where false
    expect:
      rows:
        - { user_internal_id: 100, role_names: [Regional Admin] }
        - { user_internal_id: 101, role_names: [Regional Admin] }
        - { user_internal_id: 102, role_names: [Regional Admin] }
        - { user_internal_id: 104, role_names: [Regional Admin] }
        - { user_internal_id: 105, role_names: [School Admin] }
        - { user_internal_id: 106, role_names: [School Assistant Admin] }
        - { user_internal_id: 108, role_names: [Coach, School Assistant Admin] }
        - { user_internal_id: 109, role_names: [Teacher] }
