  - name: unit_grow_users_role_matrix
    description:
      Pins the tier-times-gate role matrix. One row per tier that grants a role,
      plus a Director in a department outside the gate proving the gate blocks,
      an Associate Director proving the one title promotion, a null job_function
      proving no fallback exists, and an admin who manages a teacher proving
      Coach is additive rather than replaced. The two no-role rows (103, 107)
      are mocked with existing Grow accounts, since a no-role user with no
      account is no longer emitted.
