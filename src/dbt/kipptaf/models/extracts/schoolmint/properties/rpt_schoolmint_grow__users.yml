models:
  - name: rpt_schoolmint_grow__users
    description: >
      One row per Grow user, comparing the desired source-of-truth state (from
      ADP / staff roster) against the current destination state in SchoolMint
      Grow. Drives `grow_user_sync` create / update / archive / restore
      decisions via `surrogate_key_source` vs `surrogate_key_destination`.
      Excludes Paterson staff, who do not use Grow. Roles are assigned from the
      ADP `job_function` tier, gated by `home_department_name` for Director tier
      and above; `Sub Admin` is never assigned, because region-scoped `Regional
      Admin` replaces it. A null `job_function` yields no role at all and is
      treated as an ADP data defect rather than patched over with a job title.
      The one title exception is `Associate Director`, promoted from staff tier
      to Director tier. Every role predicate is independent, so a user who
      matches both an admin tier and the Coach predicate receives both.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: array_length(role_ids) = array_length(role_names)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "'Sub Admin' not in unnest(role_names)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              'Regional Admin' not in unnest(role_names) or
              array_length(regional_admin_school_ids) > 0
    columns:
      - name: user_internal_id
        data_type: int64
        description: ADP employee number. Sent as Grow `internalId`.
        data_tests:
          - unique
          - not_null
      - name: user_name
        data_type: string
        description: Display name (`given_name || ' ' || family_name_1`).
        config:
          meta:
            contains_pii: true
      - name: user_email
        data_type: string
        description: ADP Google Workspace email. Sent as Grow `email`.
        config:
          meta:
            contains_pii: true
      - name: inactive
        data_type: int64
        description: >
          1 when ADP `assignment_status` is `Terminated` or `Deceased`, else 0.
          Drives archive vs create/update branching.
      - name: role_names
        data_type: array<string>
        description: >
          Human-readable role labels (`Regional Admin`, `School Admin`, `School
          Assistant Admin`, `Coach`, `Teacher`), ordered alphabetically by
          `role_id` so elements align with `role_ids`. `Sub Admin` is never
          emitted.
      - name: school_id
        data_type: string
        description: >
          Grow school ID resolved from ADP home work location via
          `stg_schoolmint_grow__schools`.
      - name: role_ids
        data_type: array<string>
        description: >
          Grow role IDs the user should be assigned, ordered alphabetically by
          role_id. Lines up positionally with `role_names`. Sent verbatim as the
          `roles` array in the Grow API payload.
      - name: regional_admin_school_ids
        data_type: array<string>
        description: >
          Grow school ids this user should be scoped to, sent as
          `regionalAdminSchools`. Every active school for a `Chief Level` user,
          the user's own region for the other `Regional Admin` tiers, empty for
          everyone else. Ordered by school id so the surrogate key is stable.
      - name: readonly
        data_type: int64
        description: >
          1 when the user holds `Regional Admin`, else 0. Sent as the Grow user
          `readonly` flag, which gives visibility without configuration power.
          School Admin and School Assistant Admin are deliberately not readonly.
      - name: user_id
        data_type: string
        description: >
          Grow user `_id` for an existing destination user, NULL when no
          matching Grow user exists yet.
      - name: archived_at
        data_type: string
        description:
          Grow archival timestamp; non-NULL when the Grow user is archived.
      - name: user_email_ws
        data_type: string
        description: Current `email` on the Grow user (destination side).
        config:
          meta:
            contains_pii: true
      - name: user_name_ws
        data_type: string
        description: Current `name` on the Grow user (destination side).
        config:
          meta:
            contains_pii: true
      - name: school_id_ws
        data_type: string
        description: Current `defaultInformation.school` on the Grow user.
      - name: grade_id_ws
        data_type: string
        description: Current `defaultInformation.gradeLevel` on the Grow user.
      - name: course_id_ws
        data_type: string
        description: Current `defaultInformation.course` on the Grow user.
      - name: coach_id_ws
        data_type: string
        description: Current `coach` (Grow user `_id`) on the Grow user.
      - name: coach_id
        data_type: string
        description: >
          Desired coach: Grow user `_id` of the manager identified by ADP
          `reports_to_employee_number`.
      - name: course_id
        data_type: string
        description: >
          Grow course tag `_id` matched from ADP `home_department_name` via
          `stg_schoolmint_grow__generic_tags` (tag_type = 'courses').
      - name: grade_id
        data_type: string
        description: >
          Grow grade tag `_id` matched from ADP `primary_grade_level_taught`
          (K-coded for 0) via `stg_schoolmint_grow__generic_tags` (tag_type =
          'grades').
      - name: role_ids_ws
        data_type: array<string>
        description: >
          Current Grow role IDs on the destination user, ordered alphabetically.
          Empty array when the Grow user has no roles.
      - name: inactive_ws
        data_type: int64
        description: Current Grow `inactive` flag (0/1) on the destination user.
      - name: regional_admin_school_ids_ws
        data_type: array<string>
        description: Current `regionalAdminSchools` ids on the Grow user.
      - name: readonly_ws
        data_type: int64
        description: Current `readonly` flag (0/1) on the Grow user.
      - name: group_type
        data_type: string
        description: >
          Observation-group membership directive consumed by `grow_user_sync`.
          Observee and observer are independent: `observees` covers `Teacher`,
          `School Admin` and `School Assistant Admin`, `observers` covers any
          admin role plus `Coach`, and a user who matches both gets
          `observees;observers`. Empty string when the user matches neither.
      - name: surrogate_key_source
        data_type: string
        description: >
          Hash of the desired-state fields (uses `array_to_string(role_ids,
          ',')` for the role component). Compared against
          `surrogate_key_destination` to decide whether to issue a Grow update.
      - name: surrogate_key_destination
        data_type: string
        description: >
          Hash of the destination-state fields (uses
          `array_to_string(role_ids_ws, ',')` for the role component).

unit_tests:
  - name: unit_grow_users_emits_no_role_users
    description:
      Pins the revoke path. A staff member who matches no role predicate but
      already has a Grow account is emitted with empty role arrays rather than
      dropped, so the sync can strip their Grow roles. Today they vanish at the
      people_roles inner join and the sync never sees them.
    model: rpt_schoolmint_grow__users
    given:
      - input: ref('int_people__staff_roster')
        format: sql
        rows: |
          select
              500 as employee_number,
              'norole@apps.teamschools.org' as google_email,
              cast(null as int64) as reports_to_employee_number,
              'KIPP TEAM Academy' as home_work_location_reporting_name,
              'KIPP TEAM Academy' as home_work_location_name,
              'Finance' as home_department_name,
              'kippnewark' as home_work_location_dagster_code_location,
              'No' as given_name,
              'Role' as family_name_1,
              'Active' as assignment_status,
              'KTAF or Regional Director' as job_function,
              'Director' as job_title,
              cast(null as int64) as primary_grade_level_taught,
              'norole@apps.teamschools.org' as user_principal_name,
              cast(null as date) as worker_termination_date
      - input: ref('int_people__location_crosswalk')
        format: sql
        rows: |
          select
              'KIPP TEAM Academy' as location_name,
              'kippnewark' as location_dagster_code_location
      - input: ref('stg_schoolmint_grow__roles')
        format: sql
        rows: |
          select 'r-coach' as role_id, 'Coach' as name
          union all
          select 'r-teacher', 'Teacher'
          union all
          select 'r-saa', 'School Assistant Admin'
          union all
          select 'r-sa', 'School Admin'
          union all
          select 'r-ra', 'Regional Admin'
      - input: ref('stg_schoolmint_grow__schools')
        format: sql
        rows: |
          select
              'sch-team' as school_id,
              'KIPP TEAM Academy' as name,
              cast(null as string) as archived_at
      - input: ref('stg_schoolmint_grow__users')
        format: sql
        rows: |
          select
              'usr-500' as user_id,
              500 as internal_id_int,
              cast(null as string) as archived_at,
              cast(null as string) as email,
              cast(null as string) as name,
              cast(null as string) as coach,
              false as inactive,
              false as read_only,
              cast(null as string) as default_information_course,
              cast(null as string) as default_information_grade_level,
              cast(null as string) as default_information_school,
              cast(
                  null as array<struct<`_id` string, name string>>
              ) as roles,
              cast(
                  null as array<struct<name string, `_id` string>>
              ) as regional_admin_schools
      - input: ref('stg_schoolmint_grow__generic_tags')
        format: sql
        rows: |
          select
              cast(null as string) as tag_id,
              cast(null as string) as name,
              cast(null as string) as abbreviation,
              cast(null as string) as tag_type
          from unnest([1])
          where false
    expect:
      rows:
        - {
            user_internal_id: 500,
            role_names: [],
            role_ids: [],
            group_type: "",
          }

  - name: unit_grow_users_norole_no_account_not_emitted
    description:
      Pins the create-branch fix. A no-role active staff member with no existing
      Grow account has nothing for the sync to create, update, or archive, so
      the row must not be emitted -- otherwise `grow_user_sync`'s create branch
      opens an empty Grow account for them. A no-role active staff member who
      already has a Grow account is still emitted with empty `role_names`, so
      the sync can strip their roles.
    model: rpt_schoolmint_grow__users
    given:
      - input: ref('int_people__staff_roster')
        format: sql
        rows: |
          select
              600 as employee_number,
              'noaccount@apps.teamschools.org' as google_email,
              cast(null as int64) as reports_to_employee_number,
              'KIPP TEAM Academy' as home_work_location_reporting_name,
              'KIPP TEAM Academy' as home_work_location_name,
              'Finance' as home_department_name,
              'kippnewark' as home_work_location_dagster_code_location,
              'No' as given_name,
              'Account' as family_name_1,
              'Active' as assignment_status,
              'KTAF or Regional Director' as job_function,
              'Director' as job_title,
              cast(null as int64) as primary_grade_level_taught,
              'noaccount@apps.teamschools.org' as user_principal_name,
              cast(null as date) as worker_termination_date
          union all
          select
              601, 'hasaccount@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'KIPP TEAM Academy', 'Finance',
              'kippnewark', 'Has', 'Account', 'Active',
              'KTAF or Regional Director', 'Director', cast(null as int64),
              'hasaccount@apps.teamschools.org', cast(null as date)
      - input: ref('int_people__location_crosswalk')
        format: sql
        rows: |
          select
              'KIPP TEAM Academy' as location_name,
              'kippnewark' as location_dagster_code_location
      - input: ref('stg_schoolmint_grow__roles')
        format: sql
        rows: |
          select 'r-coach' as role_id, 'Coach' as name
          union all
          select 'r-teacher', 'Teacher'
          union all
          select 'r-saa', 'School Assistant Admin'
          union all
          select 'r-sa', 'School Admin'
          union all
          select 'r-ra', 'Regional Admin'
      - input: ref('stg_schoolmint_grow__schools')
        format: sql
        rows: |
          select
              'sch-team' as school_id,
              'KIPP TEAM Academy' as name,
              cast(null as string) as archived_at
      - input: ref('stg_schoolmint_grow__users')
        format: sql
        rows: |
          select
              'usr-601' as user_id,
              601 as internal_id_int,
              cast(null as string) as archived_at,
              cast(null as string) as email,
              cast(null as string) as name,
              cast(null as string) as coach,
              false as inactive,
              false as read_only,
              cast(null as string) as default_information_course,
              cast(null as string) as default_information_grade_level,
              cast(null as string) as default_information_school,
              cast(
                  null as array<struct<`_id` string, name string>>
              ) as roles,
              cast(
                  null as array<struct<name string, `_id` string>>
              ) as regional_admin_schools
      - input: ref('stg_schoolmint_grow__generic_tags')
        format: sql
        rows: |
          select
              cast(null as string) as tag_id,
              cast(null as string) as name,
              cast(null as string) as abbreviation,
              cast(null as string) as tag_type
          from unnest([1])
          where false
    expect:
      rows:
        - {
            user_internal_id: 601,
            role_names: [],
            role_ids: [],
            user_id: usr-601,
          }

  - name: unit_grow_users_teacher_predicate_and_coach_precedence
    description:
      Pins the two fixes in Task 1. A teacher is identified by job_function
      alone, so a staff member titled "Teacher" with a null job_function is no
      longer a teacher and no longer makes their manager a Coach. The
      instructional-manager predicate is parenthesised, so a manager whose only
      report is terminated no longer qualifies as Coach -- the signal is now the
      absence of Coach on that manager's row (row 12), not the absence of the
      row itself. Row 12 appears because the tier logic grants `School Assistant
      Admin` to the `Deans` tier without consulting the department gate. Row 2
      (no role) is mocked with an existing Grow account, since a no-role user
      with no account is no longer emitted.
    model: rpt_schoolmint_grow__users
    given:
      - input: ref('int_people__staff_roster')
        format: sql
        rows: |
          select
              1 as employee_number,
              'teach1@apps.teamschools.org' as google_email,
              10 as reports_to_employee_number,
              'KIPP TEAM Academy' as home_work_location_reporting_name,
              'KIPP TEAM Academy' as home_work_location_name,
              'Elementary' as home_department_name,
              'kippnewark' as home_work_location_dagster_code_location,
              'Ada' as given_name,
              'Real' as family_name_1,
              'Active' as assignment_status,
              'Teacher' as job_function,
              'Teacher' as job_title,
              5 as primary_grade_level_taught,
              'areal@apps.teamschools.org' as user_principal_name,
              cast(null as date) as worker_termination_date
          union all
          select
              2, 'teach2@apps.teamschools.org', 11, 'KIPP TEAM Academy', 'KIPP TEAM Academy',
              'Elementary', 'kippnewark', 'Nul', 'Function', 'Active',
              cast(null as string), 'Teacher', 5,
              'nfunction@apps.teamschools.org', cast(null as date)
          union all
          select
              3, 'term@apps.teamschools.org', 12, 'KIPP TEAM Academy', 'KIPP TEAM Academy',
              'Student Support', 'kippnewark', 'Gone', 'Already', 'Terminated',
              'Teacher', 'Teacher', 5, 'galready@apps.teamschools.org',
              date '2024-06-30'
          union all
          select
              10, 'mgr1@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'KIPP TEAM Academy', 'School Leadership', 'kippnewark',
              'Real', 'Manager', 'Active', 'Assistant School Leaders',
              'Assistant School Leader', cast(null as int64),
              'rmanager@apps.teamschools.org', cast(null as date)
          union all
          select
              11, 'mgr2@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'KIPP TEAM Academy', 'School Leadership', 'kippnewark',
              'Nulls', 'Only', 'Active', 'Assistant School Leaders',
              'Assistant School Leader', cast(null as int64),
              'nonly@apps.teamschools.org', cast(null as date)
          union all
          select
              12, 'mgr3@apps.teamschools.org', cast(null as int64),
              'KIPP TEAM Academy', 'KIPP TEAM Academy', 'Student Support', 'kippnewark',
              'Term', 'Reports', 'Active', 'Deans', 'Dean',
              cast(null as int64), 'treports@apps.teamschools.org',
              cast(null as date)
      - input: ref('int_people__location_crosswalk')
        format: sql
        rows: |
          select
              'KIPP TEAM Academy' as location_name,
              'kippnewark' as location_dagster_code_location
      - input: ref('stg_schoolmint_grow__roles')
        format: sql
        rows: |
          select 'r-coach' as role_id, 'Coach' as name
          union all
          select 'r-teacher', 'Teacher'
          union all
          select 'r-saa', 'School Assistant Admin'
          union all
          select 'r-sa', 'School Admin'
          union all
          select 'r-ra', 'Regional Admin'
      - input: ref('stg_schoolmint_grow__schools')
        format: sql
        rows: |
          select
              'sch-team' as school_id,
              'KIPP TEAM Academy' as name,
              cast(null as string) as archived_at
      - input: ref('stg_schoolmint_grow__users')
        format: sql
        rows: |
          select
              'usr-2' as user_id,
              2 as internal_id_int,
              cast(null as string) as archived_at,
              cast(null as string) as email,
              cast(null as string) as name,
              cast(null as string) as coach,
              false as inactive,
              false as read_only,
              cast(null as string) as default_information_course,
              cast(null as string) as default_information_grade_level,
              cast(null as string) as default_information_school,
              cast(
                  null as array<struct<`_id` string, name string>>
              ) as roles,
              cast(
                  null as array<struct<name string, `_id` string>>
              ) as regional_admin_schools
      - input: ref('stg_schoolmint_grow__generic_tags')
        format: sql
        rows: |
          select
              cast(null as string) as tag_id,
              cast(null as string) as name,
              cast(null as string) as abbreviation,
