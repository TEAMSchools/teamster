models:
  - name: rpt_google_directory__users_import
    description: >
      Google Workspace student accounts to create or update, consumed by the
      google_directory user_create and user_update assets. Rows are the union of
      two enrollment sources — PowerSchool for the NJ regions, and Focus for
      Miami, whose PowerSchool instance is a frozen archive. A row appears only
      when the account is missing (is_create) or when its name, suspension
      state, or org unit has drifted from the source of record (is_update).
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - primaryEmail
    columns:
      - name: student_number
        data_type: int64
        description: >
          Student identifier populating externalIds[type='custom',
          customType='student_number'] on new Google Workspace student accounts
          for cross-system identity lookup. Carries the PowerSchool student
          number for NJ regions and the Focus-prefixed student id for Miami.
        data_tests:
          - not_null:
              config:
                severity: error
                where: is_create
      - name: primaryEmail
        data_type: string
      - name: orgUnitPath
        data_type: string
      - name: suspended
        data_type: boolean
      - name: is_create
        data_type: boolean
      - name: is_update
        data_type: boolean
      - name: hashFunction
        data_type: string
      - name: groupKey
        data_type: string
        description: >
          Address of the region's student group, resolved against
          stg_google_directory__groups. Null when that group does not exist in
          Google Workspace, in which case the account is still created and the
          membership add is skipped.
      - name: name
        data_type: record
      - name: name.givenName
        data_type: string
      - name: name.familyName
        data_type: string
      - name: password
        data_type: string
      - name: changePasswordAtNextLogin
        data_type: boolean
