models:
  - name: rpt_appsheet__kfwd_career_launch_survey
    description:
      One row per KIPP Forward alumnus (HSG or TAF status, cohort up to the
      current year) for the career launch survey AppSheet app, with their
      contact details, current enrollment, and how many survey responses they
      have submitted. A response counts for an alumnus when its respondent email
      matches their primary or secondary Salesforce email, when its respondent
      Salesforce id is their contact id (Alchemer responses carrying an id, and
      every row on the career launch bulk-add sheet), or when the career launch
      reconciliation sheet maps it to their contact. These are the same matches
      the Tableau career launch extract uses. Responses the reconciliation sheet
      marks Exclude never count.
    config:
      contract:
        enforced: true
    columns:
      - name: contact_id
        data_type: string
        description: Salesforce contact id of the alumnus.
        data_tests:
          - unique:
              config:
                severity: error
      - name: first_name
        data_type: string
        description: Alumnus first name from Salesforce.
        config:
          meta:
            contains_pii: true
      - name: last_name
        data_type: string
        description: Alumnus last name from Salesforce.
        config:
          meta:
            contains_pii: true
      - name: ktc_cohort
        data_type: int64
        description: KIPP Through College cohort (high school graduation year).
      - name: primary_email
        data_type: string
        description: Salesforce primary email, lowercased.
        config:
          meta:
            contains_pii: true
      - name: secondary_email
        data_type: string
        description: Salesforce secondary email, lowercased.
        config:
          meta:
            contains_pii: true
      - name: currently_enrolled_school
        data_type: string
        description:
          School the alumnus is currently enrolled in, per Salesforce.
        config:
          meta:
            contains_pii: true
      - name: current_college_cumulative_gpa
        data_type: numeric
        description: Current cumulative college GPA from Salesforce.
        config:
          meta:
            contains_pii: true
      - name: current_college_cumulative_gpa_source
        data_type: string
        description: >-
          Source__c of the Salesforce GPA record behind the current college GPA,
          such as Unofficial Transcript or Student Portal. Null when there is no
          current college GPA.
        config:
          meta:
            contains_pii: true
      - name: gpa_band
        data_type: string
        description: >-
          Career Launch GPA band the current college GPA falls in, from the
          Career Launch Scoring Rubric sheet. Null when there is no current
          college GPA.
        config:
          meta:
            contains_pii: true
      - name: gpa_points
        data_type: int64
        description: >-
          Points the GPA band adds to the Career Launch score; 0 when there is
          no current college GPA. The app adds these to the four indicator
          points.
        config:
          meta:
            contains_pii: true
      - name: ecc
        data_type: numeric
        description: >-
          Adjusted six-year minority graduation rate of the college at the
          alumnus's ECC enrollment. Context next to GPA; not scored.
        config:
          meta:
            contains_pii: true
      - name: pursuing_degree_type
        data_type: string
        description:
          Degree type of the alumnus's most recent postsecondary enrollment.
        config:
          meta:
            contains_pii: true
      - name: major
        data_type: string
        description:
          Major of the alumnus's most recent postsecondary enrollment.
        config:
          meta:
            contains_pii: true
      - name: primary_phone
        data_type: string
        description: Salesforce mobile phone.
        config:
          meta:
            contains_pii: true
      - name: secondary_phone
        data_type: string
        description: Salesforce home phone.
        config:
          meta:
            contains_pii: true
      - name: advising_provider
        data_type: string
        description: Organization advising the alumnus, per Salesforce.
      - name: expected_college_grad_date
        data_type: date
        description: Expected college graduation date from Salesforce.
        config:
          meta:
            contains_pii: true
      - name: survey_response_count
        data_type: int64
        description:
          Number of distinct career launch survey responses matched to the
          alumnus, not counting responses marked Exclude; 0 when none.
      - name: latest_survey_date
        data_type: timestamp
        description:
          Submission time of the alumnus's most recent matched response,
          ignoring responses marked Exclude. Null when none matched, or when the
          only matches are bulk-add rows.
      - name: contact_owner
        data_type: string
        description: Name of the Salesforce contact owner for the alumnus.
      - name: postsec_advisor
        data_type: string
        description:
          Postsecondary advisor assigned to the alumnus on their Salesforce
          contact record.
      - name: advisor
        data_type: string
        description:
          Effective advisor for the alumnus — 'Collab' when the advising
          provider is KIPP NYC, otherwise the Salesforce contact owner.
