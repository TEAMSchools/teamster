models:
  - name: rpt_appsheet__seat_tracker_roster
    description: >
      Seat tracker roster for the AppSheet app — one row per active or pre-start
      staff member, joined to ITR (intent to return) responses and performance
      management tier, plus five fixed sentinel rows (`employee_number`
      999995-999999) for a seat with no active teammate — an open seat, a new
      hire not yet started, a closed position, a scoot sub, or a name only
      captured in notes — so the app still has a row to attach seat-tracking
      actions to when no real employee occupies the seat.
    columns:
      - name: employee_number
        data_type: int64
        description:
          Staff member's employee number, or a sentinel number (999995-999999)
          for a seat with no active teammate.
        data_tests:
          - unique
          - not_null
      - name: assignment_status
        data_type: string
        description:
          Roster assignment status (e.g. Active, Pre-Start); the sentinel rows
          carry a fixed value.
      - name: preferred_name_lastfirst
        data_type: string
        description:
          Staff member's preferred name, last name first, or the sentinel row's
          label.
      - name: home_work_location_name
        data_type: string
        description:
          Home work location on the staff member's primary assignment.
      - name: home_work_location_grade_band
        data_type: string
        description: Grade band of the home work location.
      - name: job_title
        data_type: string
        description: Job title on the primary assignment.
      - name: mail
        data_type: string
        description: Work email address.
      - name: google_email
        data_type: string
        description: Google Workspace email address, used for AppSheet sign-in.
      - name: report_to_mail
        data_type: string
        description: Work email address of the staff member's manager.
      - name: report_to_google_email
        data_type: string
        description:
          Google Workspace email address of the staff member's manager.
      - name: worker_original_hire_date
        data_type: date
        description: Original hire date from the roster.
      - name: business_unit_home_name
        data_type: string
        description: Legal entity the staff member is employed by.
      - name: worker_termination_date
        data_type: date
        description: Termination date, when one is recorded.
      - name: tableau_username
        data_type: string
        description:
          Staff member's sAMAccountName, used as the Tableau username.
      - name: tableau_manager_username
        data_type: string
        description: Manager's sAMAccountName, used as the Tableau username.
      - name: itr_response
        data_type: string
        description:
          Short label for the staff member's Intent to Return answer this
          academic year. Staff Intent to Return Survey answers map to Returning,
          Interested in Transfer, Not Returning, or Not Sure. Leader Intent to
          Return Survey answers map to Not Returning, Returning 1 Year,
          Returning 2 Years, Returning 2+ Years, Interested in Transfer, or Not
          Sure. Null when they have not answered.
      - name: certification_renewal_status
        data_type: int64
        description: Placeholder for a future certification feed; always null.
      - name: last_performance_management_score
        data_type: int64
        description:
          Performance management tier from the staff member's most recent PMS
          evaluation.
      - name: smart_recruiter_id
        data_type: int64
        description: Placeholder for a future SmartRecruiters feed; always null.
      - name: grade_department
        data_type: string
        description:
          Primary grade level taught for teachers, otherwise the home
          department.
      - name: location_entity
        data_type: string
        description:
          Region of the home location, falling back to the legal entity.
      - name: location_shortname
        data_type: string
        description:
          Abbreviation of the home location, falling back to its full name.
      - name: campus
        data_type: string
        description:
          Campus of the home location, falling back to the location name.
      - name: region_state
        data_type: string
        description:
          New Jersey, Miami or CMO, from the legal entity and a few role
          exceptions.
      - name: permission_level
        data_type: int64
        description: >
          App access tier derived from `job_title` and `home_department_name`,
          from broadest to narrowest. 7 sees and edits everything — the Data
          department, or a Talent Acquisition Director. 6 sees and edits
          everything within their own state or region — an Operations Director
          at a room-code location (no lower tiers are assigned within that
          scope). 5 sees everything and edits only teammate and seat-status
          fields — Talent Acquisition recruiters and managers. 4 sees their own
          school and edits teammate fields (name, gutcheck, nonrenewal) — school
          leader and school-operations-director titles. 3 sees everything and
          edits nothing — Chiefs, Special Education directors, or the Leadership
          Development, Human Resources, or Finance and Purchasing departments. 2
          sees their own state or region and edits nothing — Operations or
          School Support managing directors, School Support directors at a
          room-code location, or a Head of Schools title. 1 is the fallback and
          sees nothing.

unit_tests:
  - name: test_seat_tracker_itr_response_leader_mapping
    description: >-
      Leader Intent to Return answers, in the wording recruitment set on the
      setup page, map to Not Returning, one of the 3 Returning lengths,
      Interested in Transfer, or Not Sure; a staff Intent to Return answer keeps
      its existing label. A leader who answered both forms gets one row, labeled
      from the leader form. A leader who changed their answer gets one row, from
      their latest submission. The placeholder seat rows carry no answer.
    model: rpt_appsheet__seat_tracker_roster
    given:
      - input: ref('int_surveys__survey_responses')
        format: sql
        rows: |
          select *, 1 as round_rn from (
          select
              301 as respondent_employee_number,
              'This is my last school year in my current role. The Recruitment TEAM should definitely hire for my position.'
              as answer,
              2026 as academic_year,
              timestamp '2026-12-01 12:00:00' as date_submitted,
              'LITR' as term_code,
              'litr_plans' as question_shortname
          union all
          select
              302,
              'I am committed to my current role through the end of School Year 27-28.  I plan to seek a promotion or leave KIPP NJ | KIPP South Florida, as of June 30, 2028.',
              2026, timestamp '2026-12-01 12:00:00', 'LITR', 'litr_plans'
          union all
          select
              303,
              'I am committed to my current role through the end of School Year 28-29.  I plan to seek a promotion or leave KIPP NJ | KIPP South Florida, as of June 30, 2029.',
              2026, timestamp '2026-12-01 12:00:00', 'LITR', 'litr_plans'
          union all
          select
              304, 'I am committed to my current role for the next 2+ years.', 2026,
              timestamp '2026-12-01 12:00:00', 'LITR', 'litr_plans'
          union all
          select
              307,
              'I am interested in exploring transferring to a different team/school. ',
              2026, timestamp '2026-12-01 12:00:00', 'LITR', 'litr_plans'
          union all
          select
              308,
              'I am not sure if I am returning and want to follow up with my manager.',
              2026, timestamp '2026-12-01 12:00:00', 'LITR', 'litr_plans'
          union all
          select
              305,
              'I am not sure if I am returning and want to follow up with my manager and/or School Leader.',
              2026, timestamp '2026-12-01 12:00:00', 'ITR', 'itr_plans'
          union all
          select
              306,
              'I am committed to my current role through the end of School Year 27-28.  I plan to seek a promotion or leave KIPP NJ | KIPP South Florida, as of June 30, 2028.',
              2026, timestamp '2026-12-02 12:00:00', 'LITR', 'litr_plans'
          union all
          select
              306,
              'I am not sure if I am returning and want to follow up with my manager and/or School Leader.',
              2026, timestamp '2026-12-01 12:00:00', 'ITR', 'itr_plans'
          )
          union all
          select
              304,
              'This is my last school year in my current role. The Recruitment TEAM should definitely hire for my position.',
              2026, timestamp '2026-11-30 12:00:00', 'LITR', 'litr_plans', 2
      - input: ref('int_students__teacher_grade_levels')
        format: sql
        rows: |
          select
              'none' as teachernumber,
              'none' as _dbt_source_project,
              1 as grade_level,
              2026 as academic_year,
              1 as grade_level_rank
      - input: ref('int_people__staff_roster')
        format: sql
        rows: |
          select
              301 as employee_number,
              'Active' as assignment_status,
              'Person A' as formatted_name,
              'School A' as home_work_location_name,
              'MS' as home_work_location_grade_band,
              'School Leader' as job_title,
              'a@example.org' as mail,
              'a@example.org' as google_email,
              'm@example.org' as reports_to_mail,
              'm@example.org' as reports_to_google_email,
              date '2020-08-01' as worker_original_hire_date,
              'KIPP Miami' as home_business_unit_name,
              cast(null as date) as worker_termination_date,
              'persona' as sam_account_name,
              'manager' as reports_to_sam_account_name,
              'School Leadership' as home_department_name,
              cast(null as string) as powerschool_teacher_number,
              'kippmiami' as home_work_location_dagster_code_location
          union all
          select
              302, 'Active', 'Person B', 'School A', 'MS', 'School Leader',
              'b@example.org', 'b@example.org', 'm@example.org', 'm@example.org',
              date '2020-08-01', 'KIPP Miami', null, 'personb', 'manager',
              'School Leadership', null, 'kippmiami'
          union all
          select
              303, 'Active', 'Person C', 'School A', 'MS', 'School Leader',
              'c@example.org', 'c@example.org', 'm@example.org', 'm@example.org',
              date '2020-08-01', 'KIPP Miami', null, 'personc', 'manager',
              'School Leadership', null, 'kippmiami'
          union all
          select
              304, 'Active', 'Person D', 'School A', 'MS', 'School Leader',
              'd@example.org', 'd@example.org', 'm@example.org', 'm@example.org',
              date '2020-08-01', 'KIPP Miami', null, 'persond', 'manager',
              'School Leadership', null, 'kippmiami'
          union all
          select
              305, 'Active', 'Person E', 'School A', 'MS', 'Teacher',
              'e@example.org', 'e@example.org', 'm@example.org', 'm@example.org',
              date '2020-08-01', 'KIPP Miami', null, 'persone', 'manager',
              'Teaching and Learning', null, 'kippmiami'
          union all
          select
              306, 'Active', 'Person F', 'School A', 'MS', 'School Leader',
              'f@example.org', 'f@example.org', 'm@example.org', 'm@example.org',
              date '2020-08-01', 'KIPP Miami', null, 'personf', 'manager',
              'School Leadership', null, 'kippmiami'
          union all
          select
              307, 'Active', 'Person G', 'School A', 'MS', 'School Leader',
              'g@example.org', 'g@example.org', 'm@example.org', 'm@example.org',
              date '2020-08-01', 'KIPP Miami', null, 'persong', 'manager',
              'School Leadership', null, 'kippmiami'
          union all
          select
              308, 'Active', 'Person H', 'School A', 'MS', 'School Leader',
              'h@example.org', 'h@example.org', 'm@example.org', 'm@example.org',
              date '2020-08-01', 'KIPP Miami', null, 'personh', 'manager',
              'School Leadership', null, 'kippmiami'
      - input: ref('int_people__location_crosswalk')
        format: sql
        rows: |
          select
              'School A' as location_name,
              'Miami' as location_region,
              'SA' as location_abbreviation,
              'Campus A' as campus_name
      - input: ref('int_performance_management__observations')
        format: sql
        rows: |
          select
              0 as employee_number,
              cast(null as int64) as overall_tier,
              'PMS' as observation_type_abbreviation,
              1 as rn_employee_type
    expect:
      rows:
        - { employee_number: 301, itr_response: Not Returning }
        - { employee_number: 302, itr_response: Returning 1 Year }
        - { employee_number: 303, itr_response: Returning 2 Years }
        - { employee_number: 304, itr_response: Returning 2+ Years }
        - { employee_number: 305, itr_response: Not Sure }
        - { employee_number: 306, itr_response: Returning 1 Year }
        - { employee_number: 307, itr_response: Interested in Transfer }
        - { employee_number: 308, itr_response: Not Sure }
        - { employee_number: 999999, itr_response: null }
        - { employee_number: 999998, itr_response: null }
        - { employee_number: 999997, itr_response: null }
        - { employee_number: 999996, itr_response: null }
        - { employee_number: 999995, itr_response: null }
