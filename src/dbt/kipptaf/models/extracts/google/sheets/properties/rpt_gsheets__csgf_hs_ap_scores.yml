models:
  - name: rpt_gsheets__csgf_hs_ap_scores
    description:
      Scoped to enroll_status in (0, 3) -- Currently Enrolled or Graduated -- to
      match rpt_gsheets__csgf_hs_enrollment's population; see
      rpt_gsheets__csgf_hs_sat.yml for the full rationale (same fix, applied to
      all four HS-scoped student-level models on 2026-09-11).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - test_year
              - aptest_name
    columns:
      - name: studentid
        data_type: int64
      - name: test_year
        data_type: string
      - name: aptest_name
        data_type: string
        description:
          Sourced from int_assessments__ap_assessments.ap_course_name, a
          different upstream than rpt_gsheets__csgf_hs_ap_offerings' College
          Board crosswalk -- but subject to the same naming-mismatch risk
          against CSGF's official names for a given cycle, remapped here with
          the same case statement. Keep both models' case statements in sync;
          update per the csgf-data-collection skill whenever CSGF's list
          changes.
      - name: grade_level_when_taken
        data_type: int64
      - name: score
        data_type: numeric
