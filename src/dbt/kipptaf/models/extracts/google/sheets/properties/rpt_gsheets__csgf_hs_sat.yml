models:
  - name: rpt_gsheets__csgf_hs_sat
    description:
      Scoped to enroll_status in (0, 3) -- Currently Enrolled or Graduated -- to
      match rpt_gsheets__csgf_hs_enrollment's population, per that task's own
      instruction "ONLY INCLUDE STUDENTS WHO COMPLETED THE 25-26 SCHOOL YEAR."
      CSGF cross-validates every HSDC tab's studentid against the HS Enrollment
      tab and flags "ID not on Enrollment Tab" otherwise; a student who
      transferred out mid-year (enroll_status = 2) would otherwise still appear
      here despite being correctly excluded from Enrollment. Same filter applies
      to csgf_hs_act, csgf_hs_ap_scores, and csgf_hs_ap_offerings. Full
      provenance and verification numbers live in
      docs/models/csgf-data-model.md.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - section
    columns:
      - name: studentid
        data_type: int64
      - name: section
        data_type: string
      - name: score
        data_type: numeric
