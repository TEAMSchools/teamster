models:
  - name: rpt_gsheets__college_assessments_long
    description: >-
      **Excludes Miami by design.** SAT and ACT results for students in testing
      grades. Miami's high school starts at grade 9 and has no college-testing
      cohort yet, so there is nothing for Miami to report. Revisit when Miami
      reaches grade 11. Ratified on #4996. One row per student per sitting, with
      the Composite, EBRW and Math results for that sitting pivoted into columns
      rather than split across three rows. Scoped to students currently enrolled
      in a high school grade this academic year whose graduation year is later
      than this one. A student who transferred out mid-year drops off, along
      with the scores they earned while enrolled.


      The CCR course, teacher and section are grouped rather than aggregated, as
      are the three lifetime SAT highs. Independent `max()` calls over them
      could pair one row's course with another row's teacher.


      Column names are the sheet's headers, spelled for a reader rather than for
      SQL. A consumer selecting from the warehouse relation has to backtick
      them.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - "`Student Number`"
              - "`Test Type`"
              - "`Administration Type`"
              - "`Test Date`"
    columns:
      - name: "`Region`"
        data_type: string
        description: Region the student's school belongs to.
      - name: "`School ID`"
        data_type: int64
        description: PowerSchool identifier for the student's school.
      - name: "`School`"
        data_type: string
        description: Abbreviated name of the student's school.
      - name: "`Student Number`"
        data_type: int64
        description: PowerSchool student number.
        config:
          meta:
            contains_pii: true
      - name: "`Salesforce ID`"
        data_type: string
        description: Salesforce contact identifier for the student.
        config:
          meta:
            contains_pii: true
      - name: "`Student Name`"
        data_type: string
        description: Student's full name, last name first.
        config:
          meta:
            contains_pii: true
      - name: "`Student First Name`"
        data_type: string
        description: Student's first name.
        config:
          meta:
            contains_pii: true
      - name: "`Student Last Name`"
        data_type: string
        description: Student's last name.
        config:
          meta:
            contains_pii: true
      - name: "`Grade Level`"
        data_type: int64
        description: Grade the student is enrolled in this academic year.
      - name: "`Student Email`"
        data_type: string
        description: Student's network email address.
        config:
          meta:
            contains_pii: true
      - name: "`Enroll Status`"
        data_type: string
        description: >-
          Enrollment status of the student, spelled out. Always reads Currently
          Enrolled, because the model filters to that status. Retained so a
          reader of the sheet can see the scope without consulting the model.
      - name: "`KTC Cohort`"
        data_type: int64
        description: KIPP Through College cohort the student belongs to.
      - name: "`Graduation Year`"
        data_type: int64
        description: Year the student is expected to graduate high school.
      - name: "`Year in Network`"
        data_type: int64
        description: Count of years the student has attended a network school.
      - name: "`IEP Status`"
        data_type: string
        description: Whether the student has an IEP.
      - name: "`Grad IEP Exempt Status Overall`"
        data_type: string
        description: >-
          Whether the student is exempt from graduation testing requirements
          because of an IEP.
      - name: "`Cumulative Y1 GPA`"
        data_type: float64
        description: Weighted cumulative year-one GPA earned to date.
      - name: "`Cumulative Y1 GPA Unweighted`"
        data_type: float64
        description: Unweighted cumulative year-one GPA earned to date.
      - name: "`Projected Cumulative Y1 GPA`"
        data_type: float64
        description: >-
          Weighted cumulative year-one GPA projected for the full year.
      - name: "`Projected Cumulative Y1 GPA Unweighted`"
        data_type: float64
        description: >-
          Unweighted cumulative year-one GPA projected for the full year.
      - name: "`Current Y1 GPA Weighted`"
        data_type: float64
        description: >-
          Weighted year-one GPA for the academic year in progress, taken from
          the student's current PowerSchool reporting term. Unlike the
          cumulative columns it covers this year alone, so it moves as grades
          post. Null where the student has no current-term PowerSchool GPA row.
      - name: "`College Match GPA`"
        data_type: numeric
        description: GPA used to match the student to colleges.
      - name: "`College Match GPA Bands`"
        data_type: string
        description: Band the college match GPA falls into.
      - name: "`CCR Course`"
        data_type: string
        description: >-
          Course standing in for the student's College and Career Readiness
          schedule. Falls back to KIPP Newark Lab's Advisory course, then
          homeroom, when the student has no active College and Career section —
          from SY26-27 the regions schedule those for grades 11 and 12 only. `No
          Data` means no active course enrollment at all.
      - name: "`CCR Teacher Name`"
        data_type: string
        description: Teacher of record for the CCR course, last name first.
      - name: "`CCR Section`"
        data_type: string
        description: >-
          Section identifier for the CCR course. Reads the period expression on
          a College and Career or Advisory row, and the section number (for
          example `9M311`) on a homeroom row, whose period expression is always
          `HR(A)` or `HR(R)` and carries no information.
      - name: "`SAT Composite Superscore`"
        data_type: numeric
        description: >-
          Best SAT composite the student has assembled across all sittings.
          Official SAT only, and repeated on every row for the student, so it
          does not describe the sitting the row reports.
      - name: "`SAT Highest EBRW Score`"
        data_type: numeric
        description: >-
          Highest SAT EBRW section score across all sittings. Official SAT only,
          and repeated on every row for the student.
      - name: "`SAT Highest Math Score`"
        data_type: numeric
        description: >-
          Highest SAT Math section score across all sittings. Official SAT only,
          and repeated on every row for the student.
      - name: "`Test Type`"
        data_type: string
        description: >-
          The test itself — SAT, PSAT 8/9, PSAT10, PSAT NMSQT, ACT. Named for
          the test type for historical reasons; the administration type is what
          distinguishes an official sitting from a practice one.
      - name: "`Administration Type`"
        data_type: string
        description: >-
          Official or Practice. Practice rows come from Illuminate and are
          converted onto the same scale as their official counterpart, so scores
          are comparable, but an official attainment decision should filter to
          Official.
      - name: "`Test Date`"
        data_type: date
        description: Date the student sat the test.
      - name: "`Composite Score`"
        data_type: numeric
        description: Composite scale score for this sitting.
      - name: "`Highest Score by Test - Composite`"
        data_type: string
        description: >-
          Whether this sitting is the student's highest composite for this test
          type.
      - name: "`Meeting High School Grad Benchmark - Composite`"
        data_type: string
        description: >-
          Whether the composite score meets the high school graduation
          benchmark. NA means no benchmark is defined for this score type, which
          is distinct from a No that missed one.
      - name: "`Meeting College Ready Benchmark - Composite`"
        data_type: string
        description: >-
          Whether the composite score meets the college-ready benchmark. NA
          means no benchmark is defined for this score type.
      - name: "`EBRW Score`"
        data_type: numeric
        description: >-
          EBRW scale score for this sitting. On the ACT this column carries the
          Reading score, which shares the same aligned subject bucket.
      - name: "`Highest Score by Test - EBRW`"
        data_type: string
        description: >-
          Whether this sitting is the student's highest EBRW or Reading score
          for this test type.
      - name: "`Meeting HS Grad Benchmark - EBRW`"
        data_type: string
        description: >-
          Whether the EBRW score meets the high school graduation benchmark. NA
          means no benchmark is defined for this score type.
      - name: "`Meeting College Ready Benchmark - EBRW`"
        data_type: string
        description: >-
          Whether the EBRW score meets the college-ready benchmark. NA means no
          benchmark is defined for this score type.
      - name: "`Math Score`"
        data_type: numeric
        description: Math scale score for this sitting.
      - name: "`Highest Score by Test - Math`"
        data_type: string
        description: >-
          Whether this sitting is the student's highest Math score for this test
          type.
      - name: "`Meeting High School Grad Benchmark - Math`"
        data_type: string
        description: >-
          Whether the Math score meets the high school graduation benchmark. NA
          means no benchmark is defined for this score type.
      - name: "`Meeting College Ready Benchmark - Math`"
        data_type: string
        description: >-
          Whether the Math score meets the college-ready benchmark. NA means no
          benchmark is defined for this score type.
