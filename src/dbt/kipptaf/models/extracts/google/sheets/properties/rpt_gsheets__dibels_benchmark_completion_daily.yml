models:
  - name: rpt_gsheets__dibels_benchmark_completion_daily
    description: >
      DIBELS benchmark completion rate per Camden advisory for each in-session
      day of a testing window, replacing a hand-maintained spreadsheet. A
      student counts as complete only on and after their season test date, so
      the pace curve rebuilds from assessment history rather than from daily
      snapshots. The spine stops at yesterday because the Amplify feed lands
      overnight for the prior day. Grade subtotals, school averages and
      formatting are deliberately absent — those stay in the Sheet.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - schoolid
              - grade_level
              - advisory
              - admin_season
              - as_of_date
    columns:
      - name: completion_rate
        description: >
          Students completed divided by students expected, rounded to two
          decimal places. Null when no students are expected.
        data_type: float64
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: between 0 and 1
              config:
                where: completion_rate is not null
      - name: academic_year
        description: Academic year of the benchmark window, by start year.
        data_type: int64
      - name: region
        description: KIPP region. Always Camden in this model.
        data_type: string
      - name: school
        description: School abbreviation.
        data_type: string
      - name: schoolid
        description: PowerSchool school number. Part of the grain key.
        data_type: int64
      - name: grade_level
        description: Student grade level as an integer, with kindergarten as 0.
        data_type: int64
      - name: advisory
        description: >
          Advisory name, which at Camden schools is also the ELA section
          identifier. Students with no advisory are grouped as Unassigned rather
          than dropped.
        data_type: string
      - name: admin_season
        description: Benchmark window — BOY, MOY, or EOY.
        data_type: string
      - name: window_start_date
        description: >
          First day of the benchmark window, carried through so the Sheet can
          label a season without a second lookup. A school may not be in session
          on it.
        data_type: date
      - name: window_end_date
        description: Last day of the benchmark window.
        data_type: date
      - name: as_of_date
        description: >
          In-session date through which testing is counted. This is a test date,
          not a reporting date.
        data_type: date
      - name: reported_morning_of
        description: >
          Next in-session day after as_of_date — the morning this row's rate
          would be reported, matching the column headers of the spreadsheet this
          model replaces.
        data_type: date
      - name: students_expected
        description: Students expected to test in this advisory and window.
        data_type: int64
      - name: students_completed
        description: >
          Students whose Amplify status is Complete and whose season test date
          falls on or before as_of_date.
        data_type: int64
      - name: students_in_progress
        description: >
          Students who had tested by as_of_date but did not yet count as
          complete. Because Amplify dates only completed benchmarks, these
          students carry an imputed window-start date and so appear from the
          first day of the window rather than from the day they were tested.
        data_type: int64
      - name: students_not_started
        description: Students with no testing recorded on or before as_of_date.
        data_type: int64
      - name: data_through_date
        description: >
          Latest test date present for this region, year, and window.
          Distinguishes a day on which nobody tested from a day that has not
          loaded yet.
        data_type: date
