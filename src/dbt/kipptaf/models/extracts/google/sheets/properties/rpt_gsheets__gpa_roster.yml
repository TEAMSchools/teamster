models:
  - name: rpt_gsheets__gpa_roster
    columns:
      - name: academic_year
        data_type: string
      - name: region
        data_type: string
      - name: student_name
        data_type: string
      - name: student_number
        data_type: int64
      - name: school
        data_type: string
      - name: grade_level
        data_type: int64
      - name: team
        data_type: string
      - name: iep_status
        data_type: string
      - name: gender
        data_type: string
      - name: lep_status
        data_type: boolean
      - name: gifted_and_talented
        data_type: string
      - name: is_504
        data_type: boolean
      - name: unweighted_ada
        description:
          Unweighted average daily attendance across the full academic year.
        data_type: float64
      - name: weighted_ada
        description:
          Weighted average daily attendance across the full academic year. This
          is the value network reporting uses for high school students from SY26
          onward.
        data_type: float64
      - name: gpa_q1
        data_type: float64
      - name: gpa_q2
        data_type: float64
      - name: gpa_q3
        data_type: float64
      - name: gpa_q4
        data_type: float64
      - name: gpa_y1
        data_type: float64
      - name: cumulative_y1_gpa_unweighted
        description:
          Unweighted cumulative Y1 GPA across all stored grades at the current
          school.
        data_type: float64
      - name: cumulative_y1_gpa_projected_unweighted
        description:
          Unweighted projected cumulative Y1 GPA, incorporating current
          in-progress grades not yet stored.
        data_type: float64
      - name: cumulative_y1_gpa_projected_s1_unweighted
        description:
          Unweighted projected cumulative Y1 GPA based on S1 final grades for
          the current year.
        data_type: float64
      - name: cumulative_y1_gpa
        description:
          Weighted cumulative Y1 GPA across all stored grades at the current
          school.
        data_type: float64
      - name: cumulative_y1_gpa_projected
        description:
          Weighted projected cumulative Y1 GPA, incorporating current
          in-progress grades not yet stored.
        data_type: float64
      - name: pace_status
        data_type: string
        description: >-
          on_pace, not_on_pace, goal_not_attainable, or unknown. High school
          only.
        config:
          meta:
            contains_pii: true
      - name: gpa_needed_unweighted
        data_type: float64
        description: >-
          Unweighted Y1 GPA needed this year to finish at a 3.0 unweighted
          cumulative.
        config:
          meta:
            contains_pii: true
      - name: gpa_needed_weighted
        data_type: float64
        description: >-
          The same target on the weighted scale PowerSchool shows, for
          reconciliation.
        config:
          meta:
            contains_pii: true
      - name: target_letter_grade
        data_type: string
        description: >-
          Lowest letter in every GPA course that reaches the needed GPA, floored
          at B.
        config:
          meta:
            contains_pii: true
      - name: target_cutoff_percent
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: n_courses_below_target
        data_type: int64
        config:
          meta:
            contains_pii: true
      - name: courses_below_target
        data_type: string
        description: >-
          Course name and current Y1 percent for each unlocked course below the
          target, separated by semicolons.
        config:
          meta:
            contains_pii: true
      - name: quickest_win_course
        data_type: string
        description: >-
          The course where the fewest percent points this year buy the biggest
          unweighted grade-point gain.
        config:
          meta:
            contains_pii: true
      - name: quickest_win_pace_percent
        data_type: float64
        description: >-
          Percent needed in each remaining term of that course to reach its next
          letter.
        config:
          meta:
            contains_pii: true
      - name: quickest_win_next_letter
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: salesforce_contact_id
        description:
          Salesforce contact ID for the student, used to join this roster to
          KIPP Forward records in Salesforce.
        data_type: string
      - name: is_hs_honors_program
        description:
          High School Honors Program flag, from
          `int_extracts__student_enrollments`. Null for Miami.
        data_type: boolean
        config:
          meta:
            contains_pii: true
