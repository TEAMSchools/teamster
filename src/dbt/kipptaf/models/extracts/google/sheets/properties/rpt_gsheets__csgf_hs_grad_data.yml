models:
  - name: rpt_gsheets__csgf_hs_grad_data
    description:
      One row per school, scoped to the current cohort only (co.cohort =
      var("current_academic_year") in grad_roster) -- per CSGF's own Salesforce
      Portal task purpose, this calculates the official 4-year graduation rate
      for the cohort that entered 9th grade four years prior and is expected to
      graduate this year, not every cohort ever recorded. A prior version had no
      cohort filter on the live query path (a cohort-filtered "graduated" CTE
      existed but was never referenced, confirmed dead by reading the whole
      file) and produced one row PER COHORT per school -- e.g. 20 rows for a
      single school spanning cohorts 2011-2030. Confirmed against CSGF's task
      instructions ("if the school did not have 12th graders in [year], leave
      all rows blank") that one row per school for the current cohort is
      correct. A student who graduates ahead of their cohort year counts as a
      4-year graduate, because the adjusted cohort rate is defined by the class
      the student entered with, so the graduate predicate reads academic_year +
      1 <= cohort rather than an equality. A student who graduates late still
      does not count.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cohort
              - school
    columns:
      - name: cohort
        data_type: int64
        description: >-
          Graduating class this row reports on. The model reports one class at a
          time, the class named by the current_academic_year variable.
      - name: school
        data_type: string
        description: >-
          School name as CSGF expects it. KIPP Cooper Norcross High is expanded
          to KIPP Cooper Norcross High School to match their list.
      - name: total_9_entry
        data_type: int64
        description: >-
          Students who entered grade 9 at this school, were enrolled on 1
          October, were in their first year at the school, and were not
          repeating the grade.
      - name: total_transfer_in
        data_type: int64
        description: >-
          Students whose first year at this school was grade 10, 11 or 12, plus
          students who entered grade 9 after 1 October.
      - name: total_transfer_out
        data_type: int64
        description: >-
          Students who left with exit code D9, or with an exit code starting
          with T.
      - name: adjusted_cohort
        data_type: int64
        description: >-
          total_9_entry plus total_transfer_in, minus total_transfer_out. The
          denominator of pct_grad.
      - name: total_4yr_grad
        data_type: int64
        description: >-
          Students who left with exit code G1 on or before their cohort's
          expected graduation year. An early graduate counts here. A late
          graduate does not, because this is a 4-year rate.
      - name: pct_grad
        data_type: float64
        description: total_4yr_grad divided by adjusted_cohort.
