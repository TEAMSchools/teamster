models:
  - name: rpt_gsheets__csgf_hs_grad_data
    description:
      One row per school, scoped to the current cohort only (co.cohort =
      var("current_academic_year") in grad_roster) -- per CSGF's own Salesforce
      Portal task purpose, this calculates the official 4-year graduation rate
      for the cohort that entered 9th grade four years prior and is expected to
      graduate this year, not every cohort ever recorded. A prior version had no
      cohort filter on the live query path (a cohort-filtered "graduated" CTE
      existed but was never referenced, confirmed dead by reading the whole
      file) and produced one row PER COHORT per school -- e.g. 20 rows for a
      single school spanning cohorts 2011-2030. Confirmed against CSGF's task
      instructions ("if the school did not have 12th graders in [year], leave
      all rows blank") that one row per school for the current cohort is
      correct.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cohort
              - school
    columns:
      - name: cohort
        data_type: int64
      - name: school
        data_type: string
      - name: total_9_entry
        data_type: int64
      - name: total_transfer_in
        data_type: int64
      - name: total_transfer_out
        data_type: int64
      - name: adjusted_cohort
        data_type: int64
      - name: total_4yr_grad
        data_type: int64
      - name: total_graduates
        data_type: int64
        description:
          CSGF's own field tooltip reads "Include All Students Who Received a
          Diploma." Distinct from total_4yr_grad -- not scoped to co.cohort =
          var("current_academic_year") at all, since a student who received a
          diploma this year can belong to an earlier cohort (5th-year/held-back
          graduate) or a later one (early graduate), and both count here even
          though grad_roster's cohort filter excludes them from every other
          column on this model. Counts distinct students with exitcode = 'G1'
          whose academic_year + 1 equals the current academic year, grouped by
          school only. Added 2026-09-11 when CSGF's Portal task added this
          column; confirmed real students exist in both the earlier- and
          later-cohort direction for all three current HS schools (e.g. KIPP
          Cooper Norcross High School has 87 on-time cohort-2026 grads per
          total_4yr_grad, plus 3 cohort-2025 and 4 cohort-2027 grads this column
          adds, for 94 total).
      - name: pct_grad
        data_type: float64
