            entrydate: 2025-08-11
            exitdate: 2026-01-15
            last_enrolled_date: 2026-01-15
            rn_year: 2
            _dbt_source_project: kippmiami
          - student_number: 2001
            academic_year: 2025
            academic_year_display: 2025-26
            region: Miami
            school: M2
            entrydate: 2026-01-16
            exitdate: 2026-05-29
