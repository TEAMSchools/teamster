            exitdate: 2026-10-01
            last_enrolled_date: 2026-09-30
            rn_year: 2
            _dbt_source_project: kippnewark
          - student_number: 1001
            academic_year: 2026
            academic_year_display: 2026-27
            region: Newark
            school: SB
            entrydate: 2026-10-01
            exitdate: 2027-06-20
            last_enrolled_date: 2027-06-19
            rn_year: 1
            _dbt_source_project: kippnewark
          - student_number: 1002
            academic_year: 2025
