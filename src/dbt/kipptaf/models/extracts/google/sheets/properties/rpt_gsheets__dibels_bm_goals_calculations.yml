models:
  - name: rpt_gsheets__dibels_bm_goals_calculations
    columns:
      - name: academic_year
        data_type: int64
        description:
          Starting calendar year of the school year (e.g. 2025 for 2025-2026).
      - name: region
        data_type: string
        description:
          The city form of the region -- Newark, Camden, Miami, Paterson.
      - name: assessment_grade
        data_type: string
        description: Grade level of the assessment administered.
      - name: assessment_grade_int
        data_type: int64
        description: Assessment grade as an integer, K mapped to 0.
      - name: period
        data_type: string
        description:
          The benchmark administration the goal applies to -- BOY, MOY or EOY.
      - name: benchmark_goal_season
        data_type: string
        description:
          The administration Amplify's published standard is drawn from.
      - name: school
        data_type: string
        description: School name the goal applies to.
      - name: grade_goal
        data_type: float64
        description:
          Share of students at this grade expected to score At or Above
          Benchmark.
      - name: grade_range_goal
        data_type: float64
        description:
          The same goal expressed for the grade range rather than a single
          grade.
      - name: n_admin_season_school_gl_all
        data_type: int64
        description: Students at the school in this grade and administration.
      - name: n_admin_season_school_gl_at_above
        data_type: int64
        description: Students at the school scoring At or Above Benchmark.
      - name: n_admin_season_school_gl_bl_wb
        data_type: int64
        description:
          Students at the school scoring Below or Well Below Benchmark.
      - name: n_admin_season_region_gl_all
        data_type: int64
        description: Students in the region in this grade and administration.
      - name: n_admin_season_region_gl_at_above
        data_type: int64
        description: Students in the region scoring At or Above Benchmark.
      - name: n_admin_season_region_gl_bl_wb
        data_type: int64
        description:
          Students in the region scoring Below or Well Below Benchmark.
      - name: n_admin_season_school_gl_at_above_expected
        data_type: float64
        description:
          Students the school's goal implies should score At or Above Benchmark.
      - name: n_admin_season_region_gl_at_above_expected
        data_type: float64
        description:
          Students the region's goal implies should score At or Above Benchmark.
      - name: n_admin_season_school_gl_at_above_gap
        data_type: float64
        description:
          Distance between the school's At or Above count and its goal.
      - name: n_admin_season_region_gl_at_above_gap
        data_type: float64
        description:
          Distance between the region's At or Above count and its goal.
      - name: grade_goal_iep
        data_type: float64
        description: >
          Foundation At/Above goal rate for students with an IEP. Populations
          overlap -- a student counted here is also counted in the unsuffixed
          All columns.
      - name: grade_range_goal_iep
        data_type: float64
        description: >
          Foundation grade-range goal for students with an IEP. Populations
          overlap -- a student counted here is also counted in the unsuffixed
          All columns.
      - name: n_admin_season_school_gl_all_iep
        data_type: int64
        description: >
          Students at the school in this grade and period who are students with
          an IEP. Populations overlap -- a student counted here is also counted
          in the unsuffixed All columns.
      - name: n_admin_season_school_gl_at_above_iep
        data_type: int64
        description: >
          Of those, how many scored At/Above. Populations overlap -- a student
          counted here is also counted in the unsuffixed All columns.
      - name: n_admin_season_region_gl_all_iep
        data_type: int64
        description: >
          Same denominator at region level. Populations overlap -- a student
          counted here is also counted in the unsuffixed All columns.
      - name: n_admin_season_region_gl_at_above_iep
        data_type: int64
        description: >
          Same At/Above count at region level. Populations overlap -- a student
          counted here is also counted in the unsuffixed All columns.
      - name: n_admin_season_school_gl_at_above_expected_iep
        data_type: float64
        description: >
          Expected At/Above count for students with an IEP, padded per period.
          Populations overlap -- a student counted here is also counted in the
          unsuffixed All columns.
      - name: n_admin_season_region_gl_at_above_expected_iep
        data_type: float64
        description: >
          Same expectation at region level. Populations overlap -- a student
          counted here is also counted in the unsuffixed All columns.
      - name: n_admin_season_school_gl_bl_wb_iep
        data_type: int64
        description: >
          Below/Well Below count for students with an IEP at the school.
          Populations overlap -- a student counted here is also counted in the
          unsuffixed All columns.
      - name: n_admin_season_region_gl_bl_wb_iep
        data_type: int64
        description: >
          Below/Well Below count for students with an IEP at region level.
          Populations overlap -- a student counted here is also counted in the
          unsuffixed All columns.
      - name: n_admin_season_school_gl_at_above_gap_iep
        data_type: float64
        description: >
          Students to move for students with an IEP, 1.5x the raw gap.
          Populations overlap -- a student counted here is also counted in the
          unsuffixed All columns.
      - name: n_admin_season_region_gl_at_above_gap_iep
        data_type: float64
        description: >
          Same gap at region level. Populations overlap -- a student counted
          here is also counted in the unsuffixed All columns.
      - name: grade_goal_mll
        data_type: float64
        description: >
          Foundation At/Above goal rate for multilingual learners. Populations
          overlap -- a student counted here is also counted in the unsuffixed
          All columns.
      - name: grade_range_goal_mll
        data_type: float64
        description: >
          Foundation grade-range goal for multilingual learners. Populations
          overlap -- a student counted here is also counted in the unsuffixed
          All columns.
      - name: n_admin_season_school_gl_all_mll
        data_type: int64
        description: >
          Students at the school in this grade and period who are multilingual
          learners. Populations overlap -- a student counted here is also
          counted in the unsuffixed All columns.
      - name: n_admin_season_school_gl_at_above_mll
        data_type: int64
        description: >
          Of those, how many scored At/Above. Populations overlap -- a student
          counted here is also counted in the unsuffixed All columns.
      - name: n_admin_season_region_gl_all_mll
        data_type: int64
        description: >
          Same denominator at region level. Populations overlap -- a student
          counted here is also counted in the unsuffixed All columns.
      - name: n_admin_season_region_gl_at_above_mll
        data_type: int64
        description: >
          Same At/Above count at region level. Populations overlap -- a student
          counted here is also counted in the unsuffixed All columns.
      - name: n_admin_season_school_gl_at_above_expected_mll
        data_type: float64
        description: >
          Expected At/Above count for multilingual learners, padded per period.
          Populations overlap -- a student counted here is also counted in the
          unsuffixed All columns.
      - name: n_admin_season_region_gl_at_above_expected_mll
        data_type: float64
        description: >
          Same expectation at region level. Populations overlap -- a student
          counted here is also counted in the unsuffixed All columns.
      - name: n_admin_season_school_gl_bl_wb_mll
        data_type: int64
        description: >
          Below/Well Below count for multilingual learners at the school.
          Populations overlap -- a student counted here is also counted in the
          unsuffixed All columns.
      - name: n_admin_season_region_gl_bl_wb_mll
        data_type: int64
        description: >
          Below/Well Below count for multilingual learners at region level.
          Populations overlap -- a student counted here is also counted in the
          unsuffixed All columns.
      - name: n_admin_season_school_gl_at_above_gap_mll
        data_type: float64
        description: >
          Students to move for multilingual learners, 1.5x the raw gap.
          Populations overlap -- a student counted here is also counted in the
          unsuffixed All columns.
      - name: n_admin_season_region_gl_at_above_gap_mll
        data_type: float64
        description: >
          Same gap at region level. Populations overlap -- a student counted
          here is also counted in the unsuffixed All columns.
