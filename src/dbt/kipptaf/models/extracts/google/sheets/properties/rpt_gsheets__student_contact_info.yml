models:
  - name: rpt_gsheets__student_contact_info
    data_tests:
      # Pin the prior-level banding so it stays a standing invariant rather than
      # a point-in-time check. Bands are grades K-4 elementary, 5-8 middle, 9-12
      # high; a student is blank on every band at or below the one they are
      # currently in. Both tests are scoped by grade, so a grade_level outside
      # the K-12 domain is skipped rather than flagged.
      - dbt_utils.expression_is_true:
          arguments:
            expression: es_attended is null
          config:
            where: grade_level in ('K', '1', '2', '3', '4')
      - dbt_utils.expression_is_true:
          arguments:
            expression: ms_attended is null
          config:
            where: grade_level in ('K', '1', '2', '3', '4', '5', '6', '7', '8')
    columns:
      - name: student_number
        data_type: int64
      - name: newark_enrollment_number
        data_type: string
      - name: state_studentnumber
        data_type: string
      - name: lastfirst
        data_type: string
      - name: schoolid
        data_type: int64
      - name: school_name
        data_type: string
      - name: grade_level
        data_type: string
      - name: team
        data_type: string
      - name: advisor_name
        data_type: string
      - name: entrydate
        data_type: date
      - name: boy_status
        data_type: string
      - name: dob
        data_type: date
      - name: gender
        data_type: string
      - name: lunchstatus
        data_type: string
      - name: lunch_app_status
        data_type: string
      - name: lunch_balance
        data_type: numeric
      - name: home_phone
        data_type: string
      - name: mother_cell
        data_type: string
      - name: father_cell
        data_type: string
      - name: mother
        data_type: string
      - name: father
        data_type: string
      - name: release_1
        data_type: string
      - name: release_2
        data_type: string
      - name: release_3
        data_type: string
      - name: release_4
        data_type: string
      - name: release_5
        data_type: int64
      - name: guardianemail
        data_type: string
      - name: address
        data_type: string
      - name: first_name
        data_type: string
      - name: last_name
        data_type: string
      - name: student_web_id
        data_type: string
      - name: student_web_password
        data_type: string
      - name: family_web_id
        data_type: string
      - name: family_web_password
        data_type: string
      - name: media_release
        data_type: string
      - name: region
        data_type: string
      - name: iep_status
        data_type: string
      - name: lep_status
        data_type: boolean
      - name: c_504_status
        data_type: boolean
      - name: is_homeless
        data_type: boolean
      - name: infosnap_opt_in
        data_type: string
      - name: city
        data_type: string
      - name: is_selfcontained
        data_type: boolean
      - name: infosnap_id
        data_type: string
      - name: rides_staff
        data_type: string
      - name: gifted_and_talented
        data_type: string
      - name: salesforce_contact_id
        data_type: string
      - name: home_language
        data_type: string
      - name: es_attended
        data_type: string
        description: >-
          Most recent KIPP school the student attended while in grades K through
          4. Blank while the student is currently in grades K through 4, so the
          column reads as prior history rather than the current placement.
          Banded by the grade the student was enrolled in rather than by the
          school's designated level, so a school serving grades outside its
          designation is attributed to the right band. Distinct from the
          identically named column on int_extracts__student_enrollments, which
          bands by school level and includes the student's current school.
      - name: ms_attended
        data_type: string
        description: >-
          Most recent KIPP school the student attended while in grades 5 through
          8. Blank while the student is currently in grade 8 or below, so the
          column reads as prior history rather than the current placement.
          Banded by the grade the student was enrolled in rather than by the
          school's designated level, so a school serving grades outside its
          designation is attributed to the right band. Distinct from the
          identically named column on int_extracts__student_enrollments, which
          bands by school level and includes the student's current school.
