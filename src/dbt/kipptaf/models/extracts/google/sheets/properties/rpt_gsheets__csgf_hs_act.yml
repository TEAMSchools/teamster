models:
  - name: rpt_gsheets__csgf_hs_act
    description:
      Scoped to students who completed the prior school year at a high school
      (is_enrolled_recent) to match rpt_gsheets__csgf_hs_enrollment's
      population; see rpt_gsheets__csgf_hs_sat.yml for the full rationale (same
      filter on all four HS-scoped student-level models).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - section
    columns:
      - name: studentid
        data_type: int64
        description: >-
          The student's PowerSchool student_number (the school-facing student
          number), not the internal studentid key. CSGF's template names the
          column studentid.
        config:
          meta:
            contains_pii: true
      - name: section
        data_type: string
        description: ACT subject area.
      - name: score
        data_type: numeric
        description: >-
          The student's highest scale score for the subject area, rounded to a
          whole number.
        config:
          meta:
            contains_pii: true
