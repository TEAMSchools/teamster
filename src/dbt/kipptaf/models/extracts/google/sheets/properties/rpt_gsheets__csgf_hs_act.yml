models:
  - name: rpt_gsheets__csgf_hs_act
    description:
      Scoped to students who completed the prior school year at a high school
      (is_enrolled_recent) to match rpt_gsheets__csgf_hs_enrollment's
      population; see rpt_gsheets__csgf_hs_sat.yml for the full rationale (same
      filter on all four HS-scoped student-level models).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - section
    columns:
      - name: studentid
        data_type: int64
      - name: section
        data_type: string
      - name: score
        data_type: numeric
