models:
  - name: rpt_gsheets__deanslist_mod_audit
    description: >
      Row-level QA view exposing the individual assessment scores that feed the
      three DeansList mod CDO extracts: mod_assessment, mod_standards, and
      mod_standards_domains. Each row is one pre-aggregation response from
      int_assessments__response_rollup, filtered and joined like the published
      model it feeds, with these differences. It covers the current and prior
      academic year, where mod_assessment and mod_standards publish the current
      year only and mod_standards_domains publishes every year. It keeps the raw
      subject area, so Writing rows stay Writing where mod_standards reports
      them as Text Study. It does not join performance band sets, so it keeps
      rows the published models drop for falling in no band. Use
      computed_avg_pct_correct to check the published averages against the
      underlying data.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source_model
              - report_type
              - student_number
              - academic_year
              - subject_area
              - term_administered
              - assessment_id
              - response_type
              - response_type_description
    columns:
      - name: source_model
        data_type: string
        description: >
          Internal name of the CDO model this row feeds: mod_assessment,
          mod_standards, or mod_standards_domains.
      - name: report_type
        data_type: string
        description: >
          Report type for mod_standards_domains rows (Progress Report or Report
          Card); null for mod_assessment and mod_standards.
      - name: student_number
        data_type: int64
        description: PowerSchool student number.
      - name: student_name
        data_type: string
        description: Student full name.
      - name: academic_year
        data_type: string
        description: School year formatted for display (e.g. 2024-25).
      - name: school
        data_type: string
        description: Name of the school the student is enrolled in.
      - name: grade_level
        data_type: int64
        description: Student grade level as an integer (0 = Kindergarten).
      - name: region
        data_type: string
        description: Student enrolled region.
      - name: assessment_id
        data_type: int64
        description: >
          Canonical Illuminate assessment ID from
          int_assessments__response_rollup. For internal multipart assessments
          this is the lowest member assessment_id in the canonical group.
      - name: title
        data_type: string
        description: Assessment title.
      - name: scope
        data_type: string
        description:
          Assessment scope as recorded in Illuminate (e.g. Unit Assessment).
      - name: subject_area
        data_type: string
        description:
          Illuminate subject area before any CDO-level renaming or mapping.
      - name: term_administered
        data_type: string
        description: >
          RT reporting term for the student's school whose date range contains
          the assessment's administered date.
      - name: response_type
        data_type: string
        description:
          Response granularity from Illuminate (overall, standard, or group).
      - name: response_type_description
        data_type: string
        description:
          Standard or reporting group label; null for overall response rows.
      - name: standard_domain
        data_type: string
        description: >
          Standard domain from the standard_domains reference table; populated
          only for mod_standards_domains Report Card rows.
      - name: percent_correct
        data_type: numeric
        description: Individual assessment score as a percentage.
      - name: performance_band_label
        data_type: string
        description: Performance band label assigned to the individual score.
      - name: is_internal_assessment
        data_type: boolean
        description:
          True when the assessment has a row in the AppSheet Illuminate
          Assessments Extension.
      - name: illuminate_student_responses
        data_type: string
        description: >
          Direct link to the student responses report for this assessment in
          Illuminate, constructed from the assessment_id.
      - name: is_current_academic_year
        data_type: boolean
        description: True if this row belongs to the current academic year.
      - name: is_current_term
        data_type: boolean
        description: >
          True if term_administered names an RT reporting term whose date range
          contains today at any school.
      - name: grade_level_display
        data_type: string
        description:
          Grade level formatted for display (K for grade 0, otherwise the grade
          number).
      - name: source_model_label
        data_type: string
        description: >
          Human-readable label for the CDO model this row feeds: Enrichment
          Grades, ELA/Math Standards, or Progress Report / Report Card.
      - name: computed_avg_pct_correct
        data_type: numeric
        description: >
          Average of percent_correct over the same grouping used by the
          corresponding published model. For mod_assessment and
          mod_standards_domains Progress Report, this partitions by
          (source_model, report_type, student, year, subject, term). For
          mod_standards, it also partitions by response_type and
          response_type_description (one average per reporting group). For
          mod_standards_domains Report Card, it also partitions by
          standard_domain. Should equal the published model's avg_pct_correct or
          avg_percent_correct for the same student, subject, and term, except
          for mod_standards Writing rows (averaged separately here, merged into
          Text Study there) and mod_standards groups that span more than one
          performance band set (split there, merged here).
