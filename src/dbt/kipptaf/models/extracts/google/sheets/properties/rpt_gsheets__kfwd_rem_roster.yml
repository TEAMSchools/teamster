models:
  - name: rpt_gsheets__kfwd_rem_roster
    description:
      KIPP Forward REM roster for the Google Sheet — one row per KIPP high
      school graduate's Salesforce contact, with current enrollment status, the
      latest REM contact note, credit progress, and advisor fields.
    columns:
      - name: contact_id
        data_type: string
        description: Salesforce contact ID for the alum. One row per contact.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: student_name
        data_type: string
      - name: ktc_cohort
        data_type: int64
      - name: contact_owner_name
        data_type: string
      - name: contact_college_match_display_gpa
        data_type: numeric
      - name: last_outreach_date
        data_type: date
      - name: last_successful_contact_date
        data_type: date
      - name: last_successful_advisor_contact_date
        data_type: date
      - name: latest_fafsa_date
        data_type: date
      - name: status
        data_type: string
      - name: actual_end_date
        data_type: date
      - name: of_credits_required_for_graduation
        data_type: numeric
      - name: college_degree_type
        data_type: string
      - name: cte_degree_type
        data_type: string
      - name: cumulative_credits_earned
        data_type: numeric
      - name: credits_required_for_graduation
        data_type: numeric
      - name: last_modified_date
        data_type: string
      - name: degree_percentage_completed
        data_type: numeric
      - name: rem_status
        data_type: string
      - name: successful_contact_status
        data_type: string
      - name: last_outreach_status
        data_type: string
      - name: rem_contact_days_since_handoff
        data_type: int64
      - name: is_kipp_hs_grad
        data_type: boolean
      - name: expected_college_graduation
        data_type: date
      - name: is_collab
        data_type: boolean
      - name: most_recent_rem_status
        data_type: date
      - name: rem_handoff_date
        data_type: date
      - name: rem_enrollment_status
        data_type: string
      - name: hs_gpa_bands
        data_type: string
      - name: is_graduated
        data_type: string
      - name: first_name
        data_type: string
      - name: last_name
        data_type: string
      - name: contact_home_phone
        data_type: string
      - name: contact_mobile_phone
        data_type: string
      - name: contact_email
        data_type: string
      - name: contact_secondary_email
        data_type: string
      - name: gpa
        data_type: numeric
      - name: fiscal_year
        data_type: int64
      - name: contact_middle_school_attended
        data_type: string
      - name: contact_postsecondary_status
        data_type: string
      - name: iep_status
        data_type: string
      - name: is_enrolled_bool
        data_type: boolean
      - name: most_recent_college_enrollment
        data_type: string
      - name: most_recent_college_enrollment_status
        data_type: string
      - name: currently_enrolled_school
        data_type: string
      - name: postsec_advisor
        data_type: string
      - name: postsec_advisor_name
        data_type: string
      - name: postsecondary_advisor
        data_type: string
        description:
          Advisor shown on the REM roster — 'Collab' when the advising provider
          is KIPP NYC, otherwise the postsecondary advisor's name from the
          Salesforce contact record.
        config:
          meta:
            contains_pii: true
      - name: student_name_id_hash
        data_type: string
      - name: es_graduated
        data_type: string
      - name: contact_kipp_region_name
        data_type: string
      - name: advising_provider
        data_type: string
        description:
          Organization providing postsecondary advising to the alum, from the
          Salesforce contact record.
      - name: high_school_graduated_from
        data_type: string
        description:
          High school the alum graduated from, from the Salesforce contact
          record.

unit_tests:
  - name: test_rpt_gsheets__kfwd_rem_roster_postsecondary_advisor
    model: rpt_gsheets__kfwd_rem_roster
    description:
      KIPP NYC-advised alumni show Collab. Every other alum, including one with
      no advising provider, shows the postsecondary advisor's name.
    given:
      - input: ref("int_kippadb__roster")
        rows:
          - contact_id: a
            contact_has_hs_graduated_enrollment: HS Graduate
            contact_advising_provider: KIPP NYC
            contact_postsec_advisor_name: Advisor A
          - contact_id: b
            contact_has_hs_graduated_enrollment: HS Graduate
            contact_advising_provider: KIPP Forward
            contact_postsec_advisor_name: Advisor B
          - contact_id: c
            contact_has_hs_graduated_enrollment: HS Graduate
            contact_advising_provider: null
            contact_postsec_advisor_name: Advisor C
      - input: ref("int_kippadb__enrollment_pivot")
        rows: []
      - input: ref("stg_kippadb__enrollment")
        rows: []
      - input: ref("stg_kippadb__contact_note")
        rows: []
      - input: ref("stg_kippadb__gpa")
        rows: []
    expect:
      rows:
        - contact_id: a
          postsecondary_advisor: Collab
        - contact_id: b
          postsecondary_advisor: Advisor B
        - contact_id: c
          postsecondary_advisor: Advisor C
