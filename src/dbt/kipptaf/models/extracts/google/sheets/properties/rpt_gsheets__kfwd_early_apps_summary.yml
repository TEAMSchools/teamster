            newark_collegiate: 1,
            newark_lab: 0,
            all_schools: 3,
          }
        - {
            row_sort: 2,
            row_label: Seniors in band,
            cooper_norcross: 2,
            newark_collegiate: 0,
            newark_lab: 0,
            all_schools: 2,
          }
        - {
            row_sort: 3,
            row_label: Seniors in band,
            cooper_norcross: 0,
            newark_collegiate: 0,
            newark_lab: 0,
            all_schools: 0,
          }
        - {
            row_sort: 4,
            row_label: Seniors in band,
            cooper_norcross: 0,
            newark_collegiate: 1,
            newark_lab: 0,
            all_schools: 1,
          }
        - {
            row_sort: 5,
            row_label: Seniors in band,
            cooper_norcross: 0,
            newark_collegiate: 0,
            newark_lab: 0,
            all_schools: 0,
          }
        - {
            row_sort: 6,
            row_label: "1 ED, full need, 80%+ URM: % of N",
            cooper_norcross: 50% (1/2),
            newark_collegiate: 0% (0/1),
            newark_lab: "-",
            all_schools: 33% (1/3),
