models:
  - name: rpt_gsheets__kfwd_early_apps_summary
    description:
      Summary tab of the KIPP Forward early apps tracker. 19 rows — N (current
      seniors at the 3 KIPP high schools whose Overgrad Is ED/EA flag is Yes),
      the count in each GPA band, then 2 rows per goal, "% of N" and "% of
      band". The 7 goals are the 5 in
      int_students__early_application_criteria_scaffold plus "met both" for
      3.75+ and for 3.50-3.74. Display columns read like 3% (1/40); a 0
      denominator shows "-". Numeric met, denominator, and percent columns sit
      beside them for charting.
    columns:
      - name: row_sort
        data_type: int64
        description: Display order, 1 to 19.
        data_tests:
          - unique:
              config:
                severity: error
      - name: gpa_band
        data_type: string
        description: GPA band the row belongs to, or All for the N row.
      - name: row_label
        data_type: string
        description:
          'Readable row name, for example "1 ED, full need, 80%+ URM: % of
          band". Goal rows take their label from the early_application_criteria
          macro.'
      - name: cooper_norcross
        data_type: string
        description: Display value for KIPP Cooper Norcross High School.
      - name: newark_collegiate
        data_type: string
        description: Display value for KIPP Newark Collegiate Academy.
      - name: newark_lab
        data_type: string
        description: Display value for KIPP Newark Lab High School.
      - name: all_schools
        data_type: string
        description: Display value across the 3 high schools.
      - name: cooper_norcross_met
        data_type: int64
        description:
          Seniors counted, or seniors meeting the goal, at Cooper Norcross.
      - name: cooper_norcross_denominator
        data_type: int64
        description: Denominator at Cooper Norcross. Null on count rows.
      - name: cooper_norcross_pct
        data_type: float64
        description:
          Met divided by denominator at Cooper Norcross, 0 to 1. Null when there
          is none.
      - name: newark_collegiate_met
        data_type: int64
        description:
          Seniors counted, or seniors meeting the goal, at Newark Collegiate.
      - name: newark_collegiate_denominator
        data_type: int64
        description: Denominator at Newark Collegiate. Null on count rows.
      - name: newark_collegiate_pct
        data_type: float64
        description:
          Met divided by denominator at Newark Collegiate, 0 to 1. Null when
          there is none.
      - name: newark_lab_met
        data_type: int64
        description:
          Seniors counted, or seniors meeting the goal, at Newark Lab.
      - name: newark_lab_denominator
        data_type: int64
        description: Denominator at Newark Lab. Null on count rows.
      - name: newark_lab_pct
        data_type: float64
        description:
          Met divided by denominator at Newark Lab, 0 to 1. Null when there is
          none.
      - name: all_schools_met
        data_type: int64
        description:
          Seniors counted, or seniors meeting the goal, across the 3 schools.
      - name: all_schools_denominator
        data_type: int64
        description: Denominator across the 3 schools. Null on count rows.
      - name: all_schools_pct
        data_type: float64
        description:
          Met divided by denominator across the 3 schools, 0 to 1. Null when
          there is none.
      - name: data_as_of
        data_type: date
        description:
          Date of the latest Overgrad update among flagged seniors and their
          early applications, in local time. Shows how fresh the tracker's data
          is.

unit_tests:
  - name: test_rpt_gsheets__kfwd_early_apps_summary
    model: rpt_gsheets__kfwd_early_apps_summary
    description:
      Counts flagged seniors only, divides by N or by the band count, shows "-"
      for a 0 denominator, and adds the 3 schools into the All column.
    given:
      - input: ref("int_students__early_applications_rollup")
        format: sql
        rows: |
          select 'kippcamden' as _dbt_source_project, 1 as overgrad_student_id, 'KIPP Cooper Norcross High School' as high_school, '3.75+' as gpa_band, true as is_ed_ea_flagged, timestamp '2026-10-28 13:00:00' as latest_overgrad_updated_at
          union all
          select 'kippcamden', 2, 'KIPP Cooper Norcross High School', '3.75+', true, timestamp '2026-10-27 13:00:00'
          union all
          select 'kippnewark', 3, 'KIPP Newark Collegiate Academy', '3.00-3.49', true, timestamp '2026-10-27 13:00:00'
          union all
          select 'kippnewark', 4, 'KIPP Newark Lab High School', '3.00-3.49', false, timestamp '2026-10-29 13:00:00'
      - input: ref("int_students__early_application_criteria_scaffold")
        format: sql
        rows: |
          select 'kippcamden' as _dbt_source_project, 1 as overgrad_student_id, '3.75+' as gpa_band, 'ed_80_full_need' as criterion_code, true as is_met
          union all
          select 'kippcamden', 1, '3.75+', 'ea_78', true
          union all
          select 'kippcamden', 2, '3.75+', 'ed_80_full_need', false
          union all
          select 'kippcamden', 2, '3.75+', 'ea_78', false
          union all
          select 'kippnewark', 3, '3.00-3.49', 'early_68', false
          union all
          select 'kippnewark', 4, '3.00-3.49', 'early_68', true
