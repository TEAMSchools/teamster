models:
  - name: stg_schoolmint_grow__assignments
    description: >-
      One row per SchoolMint Grow assignment (a goal or action step a coach
      gives a teacher), the latest copy of each.
    columns:
      - name: assignment_id
        data_type: string
        description: Grow assignment id.
        data_tests:
          - unique:
              config:
                severity: error
      - name: name
        data_type: string
        description: >-
          Assignment text as Grow stores it, which can include HTML markup and
          entities.
      - name: name_text
        data_type: string
        description: >-
          The assignment name as plain text, with HTML tags removed and entities
          decoded. For a look-for this is the indicator the coach picked, which
          Grow stores only here and not as a tag.
      - name: microgoal_strand_code
        data_type: string
        description: >-
          Strand code such as 2B, read from a name that starts with a microgoal
          code like 2B.04. Null when the name does not start with one.
      - name: coaching_activity
        data_type: boolean
        description: Whether Grow marks the assignment as a coaching activity.
      - name: exclude_from_bank
        data_type: boolean
        description: Whether the assignment is kept out of the Grow goal bank.
      - name: goal_type
        data_type: string
        description: Grow goal type, from its string value or referenced name.
      - name: locked
        data_type: boolean
        description: Whether the assignment is locked in Grow.
      - name: private
        data_type: boolean
        description: Whether the assignment is private in Grow.
      - name: type
        data_type: string
        description: Grow assignment type, such as goal.
      - name: observation
        data_type: string
        description: Grow observation id the assignment came from, if any.
      - name: user_id
        data_type: string
        description: Grow user id of the teacher the assignment is for.
      - name: user_name
        data_type: string
        description: Name of the teacher the assignment is for.
        config:
          meta:
            contains_pii: true
      - name: user_email
        data_type: string
        description: Email of the teacher the assignment is for.
        config:
          meta:
            contains_pii: true
      - name: creator_id
        data_type: string
        description: Grow user id of the person who made the assignment.
      - name: creator_name
        data_type: string
        description: Name of the person who made the assignment.
        config:
          meta:
            contains_pii: true
      - name: creator_email
        data_type: string
        description: Email of the person who made the assignment.
        config:
          meta:
            contains_pii: true
      - name: parent_id
        data_type: string
        description: Grow id of the parent record, if any.
      - name: parent_name
        data_type: string
        description: Name of the parent record, if any.
      - name: progress_id
        data_type: string
        description: Grow id of the latest progress entry.
      - name: progress_assigner
        data_type: string
        description: Grow user id of who recorded the latest progress.
      - name: progress_justification
        data_type: string
        description: Note on the latest progress entry.
        config:
          meta:
            contains_pii: true
      - name: progress_percent
        data_type: int64
        description: Percent complete on the latest progress entry.
      - name: progress_date
        data_type: string
        description: Date of the latest progress entry, as Grow sends it.
      - name: created
        data_type: timestamp
        description: When the assignment was created.
      - name: last_modified
        data_type: timestamp
        description: When the assignment was last changed.
      - name: archived_at
        data_type: timestamp
        description: When the assignment was archived, if it was.
      - name: created_date_local
        data_type: date
        description: Creation date in the local timezone.
      - name: tags
        data_type: array<struct<name string, _id string, url string>>
        description: Grow tags on the assignment, goal and category tags alike.
