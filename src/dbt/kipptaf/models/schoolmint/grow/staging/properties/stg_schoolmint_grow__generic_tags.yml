models:
  - name: stg_schoolmint_grow__generic_tags
    # Keep the staging folder's table default. A view never rebuilds on new tag
    # loads, so nothing re-stages or refreshes the external tables it reads, and
    # they can go stale and read empty. Refs #5931.
    columns:
      - name: tag_id
        data_type: string
        data_tests:
          - unique:
              config:
                severity: error
          # rpt_schoolmint_grow__users maps course and grade through these tags;
          # an empty set makes the Grow user sync blank both fields.
          - dbt_utils.at_least_one:
              name: stg_schoolmint_grow__generic_tags_has_courses
              config:
                severity: error
                where: tag_type = 'courses'
          - dbt_utils.at_least_one:
              name: stg_schoolmint_grow__generic_tags_has_grades
              config:
                severity: error
                where: tag_type = 'grades'
      - name: __v
        data_type: int64
      - name: abbreviation
        data_type: string
      - name: archived_at
        data_type: string
      - name: color
        data_type: string
      - name: created
        data_type: string
      - name: creator
        data_type: string
      - name: district
        data_type: string
      - name: last_modified
        data_type: string
      - name: name
        data_type: string
      - name: parent
        data_type: string
      - name: show_on_dash
        data_type: boolean
      - name: type
        data_type: string
      - name: url
        data_type: string
      - name: tag_type
        data_type: string
      - name: parents
        data_type: array<string>
      - name: tags
        data_type: array<string>
      # - name: order
      #   data_type: int64
      # - name: rows
      #   data_type: string
