models:
  - name: int_gpa__student_quarter_target
    description: >-
      One row per current-year high school student and school with the
      unweighted letter target they must average across every unlocked GPA
      course to finish at a 3.0 unweighted cumulative, the weighted Y1 GPA that
      target corresponds to on their own schedule, and a pace status. A course
      whose terms have all ended is locked at its live unweighted Y1 points and
      the need is re-solved over the courses still open, so the target is the
      lowest unweighted letter that, held in every open course, reaches the
      cumulative, floored at B. Reads the needed GPA and attainability from
      `int_powerschool__gpa_cumulative`.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - schoolid
              - _dbt_source_project
    columns:
      - name: pace_status
        data_type: string
        description: >-
          `unknown` when the needed GPA or attainability is NULL;
          `goal_not_attainable` when attainability is false or no unweighted
          letter reaches the needed GPA; `on_pace` when the projected unweighted
          cumulative is at or above 3.0, or when every open course is graded and
          none sits below the target cutoff; `not_on_pace` otherwise.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - on_pace
                  - not_on_pace
                  - goal_not_attainable
                  - unknown
      - name: studentid
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: _dbt_source_project
        data_type: string
      - name: student_number
        data_type: int64
        config:
          meta:
            contains_pii: true
      - name: gpa_needed_unweighted
        data_type: float64
        description: >-
          Unweighted Y1 GPA the student must average across the open (not yet
          locked) GPA courses this year to finish at a 3.0 cumulative, with
          locked courses held at their live unweighted Y1 points. Equals the
          Monitor's needed GPA while no course is locked. Rounded to 4 decimals
          before the letter lookup.
        config:
          meta:
            contains_pii: true
      - name: target_cutoff_percent
        data_type: float64
        description: >-
          Lowest unweighted cutoff whose grade points reach
          `gpa_needed_unweighted`, floored at 83. NULL when no letter reaches
          it.
        config:
          meta:
            contains_pii: true
      - name: target_letter_grade
        data_type: string
        description: Letter at `target_cutoff_percent` on the unweighted scale.
        config:
          meta:
            contains_pii: true
      - name: target_grade_points
        data_type: float64
        description: Unweighted grade points at `target_cutoff_percent`.
        config:
          meta:
            contains_pii: true
      - name: schedule_bump
        data_type: float64
        description: >-
          Credit-weighted grade-point bonus of the student's current-year GPA
          courses, one row per course — 1.0 per credit on the KIPP NJ 2019
          weighted scale, 0.5 on the 2024 honors scale, 0 otherwise — divided by
          total GPA credits. Zero for a student with no weighted courses.
        config:
          meta:
            contains_pii: true
      - name: gpa_needed_weighted
        data_type: float64
        description: >-
          `gpa_needed_unweighted` plus `schedule_bump`. Comparable to the
          weighted Y1 GPA PowerSchool shows. Hitting it guarantees the
          unweighted goal, because failing a weighted course only shrinks the
          real bonus.
        config:
          meta:
            contains_pii: true
      - name: n_courses_unlocked
        data_type: int64
        description: Current-year GPA courses with at least one term still open.
        config:
          meta:
            contains_pii: true
      - name: n_courses_below_target
        data_type: int64
        description: >-
          Open courses whose live Y1 percent is below `target_cutoff_percent`.
        config:
          meta:
            contains_pii: true
      - name: is_cumulative_3_0_attainable
        data_type: boolean
        description: Passed through from `int_powerschool__gpa_cumulative`.
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa_projected_unweighted
        data_type: float64
        description: Passed through from `int_powerschool__gpa_cumulative`.
        config:
          meta:
            contains_pii: true

unit_tests:
  - name: unit_gpa_student_quarter_target
    description: >-
      Student 1 needs 3.11 and has one AP course of 5 credits among 20, with the
      AP course carrying two term rows, so the bump is 0.25 (not 0.4 from
      counting rows), the target is B+ (3.33, 87), weighted needed is 3.36, and
      with a projected 2.9 and both courses graded below 87 the status is
      not_on_pace. Student 2 needs 4.5 and is flagged unattainable: no letter
      reaches it, target NULL, status goal_not_attainable. Student 3 needs -0.5
      with a projected 3.6: target floors at B (83, 3.0) and status is on_pace.
      Student 4 has no graded course and needs exactly 3.0: target B, status
      not_on_pace. Student 5 has a NULL attainability flag: status unknown,
      target still B+. Student 6 needs 3.0 over 20 credits but has a locked
      5-credit course at F, and the Monitor counted only the 15 open credits:
      the need re-solves to (3.0 x 15 + 3.0 x 5 - 0) / 15 = 4.0, target A (93),
      not_on_pace. Student 7 needs 3.11 with a projected 2.9, and both open
      courses sit at 90: nothing is below the B+ target, so on_pace. The B+
      scale row appears twice, as the three-district union of the lookup repeats
      every row, and no student may fan out because of it.
    model: int_gpa__student_quarter_target
    overrides:
      vars:
        current_academic_year: 2025
    given:
      - input: ref('int_powerschool__gpa_cumulative')
        rows:
          - {
              studentid: 1,
              schoolid: 101,
              _dbt_source_project: kippnewark,
              gpa_needed_for_cumulative_3_0: 3.11,
              is_cumulative_3_0_attainable: true,
              cumulative_y1_gpa_projected_unweighted: 2.9,
              potential_gpa_credits_current_year: 20.0,
            }
          - {
              studentid: 2,
              schoolid: 101,
              _dbt_source_project: kippnewark,
              gpa_needed_for_cumulative_3_0: 4.5,
              is_cumulative_3_0_attainable: false,
              cumulative_y1_gpa_projected_unweighted: 2.1,
              potential_gpa_credits_current_year: 20.0,
            }
          - {
              studentid: 3,
              schoolid: 101,
              _dbt_source_project: kippnewark,
              gpa_needed_for_cumulative_3_0: -0.5,
              is_cumulative_3_0_attainable: true,
