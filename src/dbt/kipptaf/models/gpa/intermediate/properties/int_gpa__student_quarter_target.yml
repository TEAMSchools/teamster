              academic_year: 2025,
              rn_year: 1,
              school_level: HS,
              student_number: 1003,
              _dbt_source_project: kippnewark,
            }
          - {
              studentid: 4,
              schoolid: 101,
              yearid: 35,
              academic_year: 2025,
              rn_year: 1,
              school_level: HS,
              student_number: 1004,
              _dbt_source_project: kippnewark,
            }
          - {
              studentid: 5,
              schoolid: 101,
              yearid: 35,
              academic_year: 2025,
              rn_year: 1,
              school_level: HS,
              student_number: 1005,
              _dbt_source_project: kippnewark,
            }
    expect:
