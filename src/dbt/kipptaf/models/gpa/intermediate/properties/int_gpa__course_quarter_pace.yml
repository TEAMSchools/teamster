models:
  - name: int_gpa__course_quarter_pace
    description: >-
      One row per current-year GPA course per student with the average percent
      the student needs in each remaining term for the course Y1 to land on
      their target cutoff from `int_gpa__student_quarter_target`. A term counts
      as remaining until its termbin ends, so the in-progress term is in the
      remaining weight and the pace does not swing with each posted assignment.
      Exam terms are remaining terms too. An ended term with no grade counts
      nowhere, matching the Y1 average PowerSchool computes. A course whose
      every term has ended is locked; it has no pace and stays in the GPA.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - course_number
              - _dbt_source_project
    columns:
      - name: pace_percent
        data_type: float64
        description: >-
          (target cutoff × total weight − points banked) / remaining weight, in
          percent. NULL when the course is locked or has no target.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 200
                inclusive: true
              config:
                where: pace_percent is not null
      - name: studentid
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: course_number
        data_type: string
      - name: course_name
        data_type: string
      - name: _dbt_source_project
        data_type: string
      - name: potential_credit_hours
        data_type: float64
        description: GPA credit hours for the course.
      - name: courses_gradescaleid_unweighted
        data_type: int64
        description: Unweighted grade scale the course's points are read on.
      - name: target_cutoff_percent
        data_type: float64
        description:
          The student's target cutoff from `int_gpa__student_quarter_target`.
      - name: y1_percent_current
        data_type: float64
        description: >-
          Live Y1 percent on the current termbin row, else the latest started
          term's.
      - name: y1_grade_points_unweighted_current
        data_type: float64
        description: Unweighted grade points of the live Y1 letter.
      - name: term_percent_current
        data_type: float64
        description:
          Percent in the in-progress term; NULL before any grade posts.
      - name: total_weight
        data_type: float64
        description: >-
          Sum of term weights for the course over terms that are open or were
          graded, 100 for four 25-point quarters, 98 with two 5-point exams.
      - name: points_banked
        data_type: float64
        description: Sum of percent × weight over terms whose termbin has ended.
      - name: remaining_weight
        data_type: float64
        description: Sum of term weights over terms whose termbin has not ended.
      - name: is_below_target
        data_type: boolean
        description:
          True when `y1_percent_current` is below `target_cutoff_percent`.
      - name: is_secured
        data_type: boolean
        description: >-
          Pace at or below 50, the live-gradebook floor, so the target is
          already met.
      - name: is_locked
        data_type: boolean
        description: Every termbin for the course has ended.

unit_tests:
  - name: unit_gpa_course_quarter_pace
    description: >-
      Target cutoff 87 for every student. Student 1 course C1 has four 25-point
      quarters, Q1 ended at 80, Q2 in progress at 85: banked 2000, remaining 75,
      pace (8700 − 2000) / 75 = 89.33, below target (Y1 82). Student 2 course C2
      has four 22-point quarters and two 5-point exams, Q1 ended at 80: banked
      1760, remaining 76, pace (8526 − 1760) / 76 = 89.03, higher than the 87 a
      quarter-only pace would give because the exam weights are remaining too.
      Student 3 course C3 has two terms that both ended: locked, pace NULL.
      Student 4 course C4 has no grade yet and nothing ended: banked 0,
      remaining 100, pace 87, not below target because Y1 is NULL. Student 5
      course C5 has Y1 95 with Q1 at 95 ended: pace (8700 − 2375) / 75 = 84.33
      and not below target. Student 6 course C6 joined the course in Q2: its Q1
      row ended with no grade, so that term counts in neither the total nor the
      banked points, total weight is 75, remaining 75, and the pace is 87, not
      the 116 a 100-point total would give.
    model: int_gpa__course_quarter_pace
    overrides:
      vars:
        current_academic_year: 2025
    given:
      - input: ref('int_gpa__student_quarter_target')
        rows:
          - {
              studentid: 1,
              schoolid: 101,
              _dbt_source_project: kippnewark,
              target_cutoff_percent: 87.0,
            }
