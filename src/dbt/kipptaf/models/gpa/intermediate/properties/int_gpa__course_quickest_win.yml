models:
  - name: int_gpa__course_quickest_win
    description: >-
      Ranks each student's unlocked GPA courses by how cheaply a letter-grade
      step can be bought this year: unweighted grade points gained at the next
      letter times credit hours, divided by the percent-point gap between the
      pace to that letter and the course's live Y1 percent, floored at one
      point. Courses below the student's target rank first; ties break on course
      number. A course has no rank when it is locked, when its next letter needs
      more than 100 percent, or when the student is already at or ahead of the
      pace to the next letter. Derived from full-year term weights, not the
      current-term `need_next`, which over-ranks second-semester courses.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - course_number
              - _dbt_source_project
    columns:
      - name: quickest_win_rank
        data_type: int64
        description:
          1 is the quickest win. NULL when the course does not qualify.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
              config:
                where: quickest_win_rank is not null
      - name: studentid
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: course_number
        data_type: string
      - name: course_name
        data_type: string
      - name: _dbt_source_project
        data_type: string
      - name: next_letter_grade
        data_type: string
        description: >-
          Lowest unweighted letter with strictly more grade points than the
          course's current unweighted Y1 points.
      - name: next_cutoff_percent
        data_type: float64
        description: Cutoff percent of `next_letter_grade`.
      - name: next_grade_points
        data_type: float64
        description: Unweighted grade points of `next_letter_grade`.
      - name: points_gained
        data_type: float64
        description: >-
          `next_grade_points` minus the course's current unweighted Y1 points.
      - name: pace_percent_to_next
        data_type: float64
        description: The pace formula with the next cutoff as target.
      - name: need_gap
        data_type: float64
        description: >-
          `pace_percent_to_next` minus the live Y1 percent, floored at 1. NULL
          when the course does not qualify.
      - name: score
        data_type: float64
        description: >-
          Credit hours times `points_gained` over `need_gap`. NULL when the
          course does not qualify.

unit_tests:
  - name: unit_gpa_course_quickest_win
    description: >-
      Student 1 has five courses. C1 is at Y1 82 / B- (2.67), below target, 100
      total weight, 2000 banked, 75 remaining: next is B at 83, pace (8300 −
      2000) / 75 = 84, gap 84 − 82 = 2, score 5 × 0.33 / 2 = 0.83, rank 1. C4 is
      at Y1 45 / F (0.0): next is B- at 80 (the scale fixture has no D or C
      rows), pace (8000 − 2000) / 75 = 80, gap 35, score 5 × 2.67 / 35 = 0.38,
      below target so rank 2. C2 is at Y1 88 / B+ (3.33), not below target 87:
      next A- at 90, pace (9000 − 2000) / 75 = 93.33, gap 5.33, score 5 × 0.34 /
      5.33 = 0.32, rank 3. C3 is locked: no rank. C6 is at Y1 82 / B- with 7500
      banked over three ended terms and 25 remaining: the pace to B is (8300 −
      7500) / 25 = 32, below the Y1 of 82, so the student is already ahead of
      pace and the course has no rank. The gap is measured against the Y1
      percent, not the term percent, so a single posted assignment does not move
      the rank. The B scale row appears twice, as the three-district union of
      the lookup repeats every row, and no course may fan out.
    model: int_gpa__course_quickest_win
    overrides:
      vars:
        current_academic_year: 2025
    given:
      - input: ref('int_gpa__course_quarter_pace')
        rows:
          - {
              studentid: 1,
              schoolid: 101,
              course_number: C1,
              course_name: English,
              _dbt_source_project: kippnewark,
              potential_credit_hours: 5.0,
              courses_gradescaleid_unweighted: 976,
              target_cutoff_percent: 87.0,
              y1_percent_current: 82.0,
              y1_grade_points_unweighted_current: 2.67,
              term_percent_current: 85.0,
              total_weight: 100.0,
              points_banked: 2000.0,
              remaining_weight: 75.0,
              pace_percent: 89.33,
              is_below_target: true,
              is_secured: false,
              is_locked: false,
            }
          - {
              studentid: 1,
              schoolid: 101,
              course_number: C2,
              course_name: Biology,
              _dbt_source_project: kippnewark,
              potential_credit_hours: 5.0,
              courses_gradescaleid_unweighted: 976,
              target_cutoff_percent: 87.0,
              y1_percent_current: 88.0,
              y1_grade_points_unweighted_current: 3.33,
              term_percent_current: 88.0,
              total_weight: 100.0,
              points_banked: 2000.0,
              remaining_weight: 75.0,
              pace_percent: 89.33,
              is_below_target: false,
              is_secured: false,
              is_locked: false,
            }
          - {
              studentid: 1,
              schoolid: 101,
              course_number: C3,
              course_name: Health,
              _dbt_source_project: kippnewark,
              potential_credit_hours: 2.5,
              courses_gradescaleid_unweighted: 976,
              target_cutoff_percent: 87.0,
              y1_percent_current: 72.0,
              y1_grade_points_unweighted_current: 1.67,
              term_percent_current: null,
              total_weight: 100.0,
              points_banked: 7200.0,
              remaining_weight: 0.0,
              pace_percent: null,
              is_below_target: true,
