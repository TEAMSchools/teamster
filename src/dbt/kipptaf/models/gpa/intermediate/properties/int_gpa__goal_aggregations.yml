models:
  - name: int_gpa__goal_aggregations
    description:
      Rolls the per-student GPA measures spine up to the school, region, and org
      (network-wide) grain and inner-joins each grain's matching goal from the
      GPA goals sheet on academic year and grade band, then evaluates whether
      the resulting rate meets the goal. Goal-driven — a grain surfaces here
      only when it has a matching goal row; students in a grain with no goal
      simply don't aggregate into a row. One row per academic year, metric, and
      goal aggregation key.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - metric
              - aggregation_hash
    columns:
      - name: academic_year
        data_type: int64
        description: The academic year of the underlying student measures.
      - name: metric
        data_type: string
        description:
          GPA metric the goal targets — `y1_gpa_weighted`, `y1_gpa_unweighted`,
          `cumulative_gpa_unweighted`, or `on_pace`.
      - name: aggregation_hash
        data_type: string
        description:
          Join key matching this aggregate to its goal — see
          `int_google_sheets__gpa_goals`.
      - name: org_level
        data_type: string
        description:
          Scope of the aggregate — `org` (network-wide), `region`, or `school`.
      - name: region
        data_type: string
        description:
          Region label when `org_level` is `region` or `school`. Null for
          `org`-level rows.
      - name: schoolid
        data_type: int64
        description:
          PowerSchool school ID when `org_level` is `school`. Null for `org`- or
          `region`-level rows.
      - name: grade_band
        data_type: string
        description: Human-readable grade band from the matched goal.
      - name: goal_proportion
        data_type: float64
        description: Target rate from the matched goal, as a proportion.
      - name: metric_rate
        data_type: float64
        description:
          Share of students in this grain meeting `metric`'s threshold per
          `direction` (or, for `on_pace`, the share of the on-pace denominator
          that is on pace), rounded to 3 decimal places. Null when the `on_pace`
          denominator is empty.
      - name: is_goal_met
        data_type: boolean
        description:
          Whether `metric_rate` meets the goal — `metric_rate >=
          goal_proportion` when the goal's direction favors higher values, else
          `metric_rate <= goal_proportion`. Null when `metric_rate` is null.
      - name: progress_to_goal
        data_type: float64
        description:
          Share that `metric_rate` represents of `goal_proportion` (or its
          inverse when lower is better), capped at 1.0 and rounded to 3 decimal
          places. Null when `metric_rate` is null.

unit_tests:
  - name: unit_gpa_goal_aggregations
    description:
      Verifies the three aggregation grains against one set of four students
      (grades 9-12, all in Newark school 101) matched against three goals
      sharing the same 9-12 grade band. A school-level `y1_gpa_weighted >= 3.0`
      goal (2 of 4 students meet it) proves the threshold/direction rate
      calculation and a below-goal result. An org-level `y1_gpa_unweighted >=
      2.8` goal proves cross-grade aggregation into a single row. A region-level
      `cumulative_gpa_unweighted <= 2.5` goal (higher_is_better false) proves
      the derived direction flips `is_goal_met` relative to a naive `>=`
      comparison.
    model: int_gpa__goal_aggregations
    given:
      - input: ref('int_gpa__goal_student_metrics')
        format: sql
        rows: |
          select
              2026 as academic_year,
              'Newark' as region,
              101 as schoolid,
              9 as grade_level,
              90001 as student_number,
              cast(3.5 as float64) as y1_gpa_weighted,
              cast(3.0 as float64) as y1_gpa_unweighted,
              cast(2.0 as float64) as cumulative_gpa_unweighted,
              cast(null as boolean) as is_on_pace,
              cast(null as boolean) as is_on_pace_denominator
          union all
          select
              2026,
              'Newark',
              101,
              10,
              90002,
              cast(3.1 as float64),
              cast(2.9 as float64),
              cast(2.6 as float64),
              cast(null as boolean),
              cast(null as boolean)
          union all
          select
              2026,
              'Newark',
              101,
              11,
              90003,
              cast(2.9 as float64),
              cast(2.5 as float64),
              cast(2.4 as float64),
              cast(null as boolean),
              cast(null as boolean)
          union all
          select
              2026,
              'Newark',
              101,
              12,
              90004,
              cast(2.0 as float64),
              cast(2.0 as float64),
              cast(3.0 as float64),
              cast(null as boolean),
              cast(null as boolean)
      - input: ref('int_google_sheets__gpa_goals')
        format: sql
        rows: |
          /* school-level: y1_gpa_weighted >= 3.0, goal 58% */
          select
              2026 as academic_year,
              'school' as org_level,
              'Newark' as region,
              101 as schoolid,
              9 as grade_low,
              12 as grade_high,
              'y1_gpa_weighted' as metric,
              cast(3.0 as numeric) as threshold,
              '>=' as direction,
              cast(58 as numeric) as goal,
              '9-12' as grade_band,
              '101_9-12' as aggregation_hash,
              cast(0.58 as float64) as goal_proportion,
              true as higher_is_better
          union all
          /* region-level: cumulative_gpa_unweighted <= 2.5, goal 60% */
          select
              2026,
              'region',
              'Newark',
              cast(null as int64),
              9,
              12,
              'cumulative_gpa_unweighted',
              cast(2.5 as numeric),
              '<=',
              cast(60 as numeric),
              '9-12',
              'Newark_9-12',
              cast(0.6 as float64),
              false
          union all
          /* org-level: y1_gpa_unweighted >= 2.8, goal 50% */
          select
              2026,
              'org',
              cast(null as string),
              cast(null as int64),
              9,
              12,
              'y1_gpa_unweighted',
              cast(2.8 as numeric),
              '>=',
              cast(50 as numeric),
              '9-12',
              'org_9-12',
              cast(0.5 as float64),
              true
    expect:
      rows:
        - {
            academic_year: 2026,
            metric: y1_gpa_weighted,
            aggregation_hash: 101_9-12,
            org_level: school,
            region: Newark,
            schoolid: 101,
            grade_band: 9-12,
            goal_proportion: 0.58,
            metric_rate: 0.5,
            is_goal_met: false,
            progress_to_goal: 0.862,
          }
        - {
            academic_year: 2026,
            metric: cumulative_gpa_unweighted,
            aggregation_hash: Newark_9-12,
            org_level: region,
            region: Newark,
            schoolid: null,
            grade_band: 9-12,
            goal_proportion: 0.6,
            metric_rate: 0.5,
            is_goal_met: true,
            progress_to_goal: 1.0,
          }
        - {
            academic_year: 2026,
            metric: y1_gpa_unweighted,
            aggregation_hash: org_9-12,
            org_level: org,
            region: null,
            schoolid: null,
            grade_band: 9-12,
            goal_proportion: 0.5,
            metric_rate: 0.5,
            is_goal_met: true,
            progress_to_goal: 1.0,
          }
