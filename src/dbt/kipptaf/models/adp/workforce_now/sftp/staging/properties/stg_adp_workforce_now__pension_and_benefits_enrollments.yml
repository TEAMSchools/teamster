models:
  - name: stg_adp_workforce_now__pension_and_benefits_enrollments
    description: >-
      Benefit and pension enrollments from the ADP Workforce Now SFTP export,
      one row per position, plan, and enrollment status. The file holds current
      enrollments only and is replaced on every load, so it keeps no history of
      past plans.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - position_id
              - enrollment_status
              - plan_name
    columns:
      - name: position_id
        data_type: string
        description: >-
          ADP position ID. Joins to the staff roster, which expects at most one
          active NJ pension per position.
        data_tests:
          - unique:
              config:
                severity: error
                where: |
                  enrollment_status = 'Active'
                  and plan_name in (
                      'NJ Pension - DCRP:Eligible Employees(Prudential Financial)',
                      'NJ Pension - PERS:Eligible Employees(NJ Pension)',
                      'NJ Pension - TPAF:Eligible Employees(NJ Pension)'
                  )
      - name: employee_number
        data_type: int64
        description: ADP employee number, cast to integer.
      - name: plan_type
        data_type: string
        description: >-
          ADP benefit category, such as Medical or Dental. NJ pension plans are
          filed under Other.
      - name: plan_name
        data_type: string
        description: >-
          ADP plan name. The NJ pension plans begin with "NJ Pension -" and name
          PERS, TPAF, or DCRP.
      - name: coverage_level
        data_type: string
        description: Coverage level ADP reports for the enrollment.
      - name: effective_date
        data_type: date
        description: Effective date of the enrollment record, parsed from text.
      - name: enrollment_end_date
        data_type: date
        description: >-
          Last date of the enrollment, parsed from text. 9999-12-31 when ADP
          sends no end date.
      - name: enrollment_start_date
        data_type: date
        description: First date of the enrollment, parsed from text.
      - name: enrollment_status
        data_type: string
        description: ADP enrollment status, such as Active.
      - name: source_file_name
        data_type: string
        description: Name of the SFTP file the row was loaded from.
