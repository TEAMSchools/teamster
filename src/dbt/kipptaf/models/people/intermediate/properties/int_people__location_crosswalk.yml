models:
  - name: int_people__location_crosswalk
    description: |
      One row per location alias — multiple raw `name` spellings map to the
      same canonical `location_clean_name`. Use this model when joining on
      alternate school-name spellings (e.g., ADP home_work_location_name,
      SchoolMint Grow observation school_name). For one-row-per-logical-school,
      use stg_google_sheets__people__locations.

      Despite the name, this is not a union model and carries no
      _dbt_source_relation column. To join it across regions, match the other
      side's _dbt_source_project against location_dagster_code_location.
    columns:
      - name: location_name
        data_type: string
        data_tests:
          - unique
      - name: location_key
        data_type: string
        description: |
          Canonical location surrogate key passed through from
          stg_google_sheets__people__locations. NULL when the alias name does not
          match any canonical location.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_google_sheets__people__locations')
                field: location_key
      - name: location_clean_name
        data_type: string
      - name: location_abbreviation
        data_type: string
      - name: location_grade_band
        data_type: string
      - name: location_region
        data_type: string
      - name: location_powerschool_school_id
        data_type: int64
      - name: location_deanslist_school_id
        data_type: int64
      - name: location_reporting_school_id
        data_type: int64
      - name: location_focus_school_id
        data_type: string
        description: |
          Focus SIS school-number code (alphanumeric SCH_ID) passed through from
          stg_google_sheets__people__locations; NULL for locations not yet
          mapped to Focus.
      - name: location_google_student_org_unit_path
        data_type: string
        description: |
          Full Google Workspace org unit path for this school's student
          accounts, passed through from stg_google_sheets__people__locations.
          Resolving it through this model means every consumer reaches the same
          path from whichever school-name spelling its source uses, since each
          row here is one alias. NULL for campuses and any school with no
          student org unit yet.
      - name: location_is_campus
        data_type: boolean
      - name: location_is_pathways
        data_type: boolean
      - name: location_dagster_code_location
        data_type: string
      - name: location_head_of_schools_employee_number
        data_type: int64
      - name: campus_name
        data_type: string
        description: |
          Campus the location belongs to. A school takes its parent campus from
          stg_google_sheets__people__campus_crosswalk. A campus-level location
          (location_is_campus) with no crosswalk row is its own campus, so staff
          based at the campus share a campus_name with staff at its schools. A
          crosswalk row always wins, which lets an office location such as
          Room 11 roll up to a differently named campus. NULL for a school with
          no crosswalk row.

unit_tests:
  - name: test_int_people__location_crosswalk_campus_name
    description:
      Locks how campus_name resolves. A school takes its crosswalk campus. A
      campus-level location with no crosswalk row takes its own clean name. A
      campus-level location with a crosswalk row takes the crosswalk campus. A
      school with no crosswalk row stays null.
    model: int_people__location_crosswalk
    given:
      - input: ref('stg_google_sheets__people__location_crosswalk')
        rows:
          - { Name: School A, Clean_Name: School A }
          - { Name: Campus X Alias, Clean_Name: Campus X }
          - { Name: Office 1, Clean_Name: Office 1 }
          - { Name: School B, Clean_Name: School B }
      - input: ref('stg_google_sheets__people__locations')
        rows:
          - { location_name: School A, is_campus: false }
          - { location_name: Campus X, is_campus: true }
          - { location_name: Office 1, is_campus: true }
          - { location_name: School B, is_campus: false }
      - input: ref('stg_google_sheets__people__campus_crosswalk')
        rows:
          - { Location_Name: School A, Name: Campus X }
          - { Location_Name: Office 1, Name: Campus Y }
    expect:
      rows:
        - { location_name: School A, campus_name: Campus X }
        - { location_name: Campus X Alias, campus_name: Campus X }
        - { location_name: Office 1, campus_name: Campus Y }
        - { location_name: School B, campus_name: null }
