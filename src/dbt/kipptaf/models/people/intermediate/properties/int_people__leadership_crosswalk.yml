models:
  - name: int_people__leadership_crosswalk
    description: |
      One row per logical school (keyed on PowerSchool school ID) with the
      employee numbers and contact attributes of the school leader, head of
      school, director of school operations (DSO), managing director of school
      operations (MDSO), and regional managing director of operations (MDO).
      The school leader, DSO, and MDO are picked from `int_people__staff_roster`
      by job title. Their managers (head of school, MDSO) are resolved through
      `reports_to_employee_number` against every non-terminated employee, with
      no title filter, because those managers hold varied titles (Head of
      Schools, Managing Director, Chief Academic Officer). Grouped on
      `home_work_location_reporting_name` so an ADP rename does not split a
      school into two rows. While a School Leader seat is vacant, the head of
      school falls back to the manager most of the school's Assistant School
      Leaders report to.
    config:
      materialized: table
      meta:
        standard_exempt:
          A5: >-
            The Assistant School Leader manager pick is the vacancy business
            rule (the manager most of a school's Assistant School Leaders report
            to stands in for the head of school), not source-duplicate masking.
    columns:
      - name: home_work_location_powerschool_school_id
        description: |
          PowerSchool `school_id` for the school. Stable surrogate for a
          logical school — the uniqueness grain of this model.
        data_type: int64
        data_tests:
          - unique
      - name: home_work_location_reporting_name
        description: |
          Canonical location name from `int_people__location_crosswalk`.
          Clean reporting name used for display and downstream joins.
        data_type: string
      - name: home_work_location_abbreviation
        description: Short code / abbreviation for the school.
        data_type: string
      - name: home_work_location_campus_name
        description: Campus name the school rolls up to.
        data_type: string
      - name: dso_employee_number
        description: Employee number of the Director of School Operations.
        data_type: int64
      - name: sl_employee_number
        description: Employee number of the School Leader.
        data_type: int64
      - name: school_leader_preferred_name_lastfirst
        description: School Leader's preferred name in `Last, First` format.
        data_type: string
      - name: school_leader_mail
        description: School Leader's primary email address.
        data_type: string
      - name: school_leader_google_email
        description: School Leader's Google Workspace email address.
        data_type: string
      - name: school_leader_job_title
        description: School Leader's ADP job title.
        data_type: string
      - name: school_leader_report_to_employee_number
        description: Employee number the School Leader reports to.
        data_type: int64
      - name: school_leader_sam_account_name
        description: School Leader's Active Directory `sAMAccountName`.
        data_type: string
      - name: head_of_school_employee_number
        description: |
          Employee number of the School Leader's manager, taken from the School
          Leader's `reports_to_employee_number` with no job-title filter. Today
          that is a Head of Schools, Managing Director, or Chief Academic
          Officer; check `head_of_school_job_title` before treating the name as
          a Head of Schools. When the school has no School Leader or School
          Leader in Residence (a vacancy), falls back to the active manager most
          of the school's Assistant School Leaders report to, ties broken by the
          lowest employee number. NULL when that manager is not active, or when
          the school has neither a School Leader nor an Assistant School Leader
          with an active manager.
        data_type: int64
      - name: head_of_school_preferred_name_lastfirst
        description: Head of School's preferred name in `Last, First` format.
        data_type: string
      - name: head_of_school_mail
        description: Head of School's primary email address.
        data_type: string
      - name: head_of_school_google_email
        description: Head of School's Google Workspace email address.
        data_type: string
      - name: head_of_school_job_title
        description: Head of School's ADP job title.
        data_type: string
      - name: head_of_school_sam_account_name
        description: Head of School's Active Directory `sAMAccountName`.
        data_type: string
      - name: dso_preferred_name_lastfirst
        description: DSO's preferred name in `Last, First` format.
        data_type: string
      - name: dso_mail
        description: DSO's primary email address.
        data_type: string
      - name: dso_google_email
        description: DSO's Google Workspace email address.
        data_type: string
      - name: dso_job_title
        description: DSO's ADP job title.
        data_type: string
      - name: dso_report_to_employee_number
        description: Employee number the DSO reports to.
        data_type: int64
      - name: dso_sam_account_name
        description: DSO's Active Directory `sAMAccountName`.
        data_type: string
      - name: mdso_employee_number
        description: |
          Employee number of the DSO's manager, taken from the DSO's
          `reports_to_employee_number` with no job-title filter. Usually the
          Managing Director of School Operations; see `mdso_job_title`. NULL
          when the school has no DSO.
        data_type: int64
      - name: mdso_preferred_name_lastfirst
        description: MDSO's preferred name in `Last, First` format.
        data_type: string
      - name: mdso_mail
        description: MDSO's primary email address.
        data_type: string
      - name: mdso_google_email
        description: MDSO's Google Workspace email address.
        data_type: string
      - name: mdso_job_title
        description: MDSO's ADP job title.
        data_type: string
      - name: mdso_sam_account_name
        description: MDSO's Active Directory `sAMAccountName`.
        data_type: string
      - name: mdo_employee_number
        description: |
          Employee number of the regional Managing Director of Operations, keyed
          on `home_work_location_region`.
        data_type: int64
      - name: mdo_preferred_name_lastfirst
        description: MDO's preferred name in `Last, First` format.
        data_type: string
      - name: mdo_mail
        description: MDO's primary email address.
        data_type: string
      - name: mdo_google_email
        description: MDO's Google Workspace email address.
        data_type: string
      - name: mdo_job_title
        description: MDO's ADP job title.
        data_type: string
      - name: mdo_sam_account_name
        description: MDO's Active Directory `sAMAccountName`.
        data_type: string

unit_tests:
  - name: test_int_people__leadership_crosswalk_head_of_school_vacancy
    description:
      School 1 has a School Leader, so its head of school is that leader's
      manager even though an Assistant School Leader reports elsewhere. School 2
      has no School Leader, so the manager two of its three Assistant School
      Leaders report to stands in. School 3 has no School Leader and most of its
      Assistant School Leaders report to a terminated manager, so the pick skips
      that manager and takes the active one. School 4 has no School Leader and
      one Assistant School Leader under each of two managers, so the tie goes to
      the lower employee number.
    model: int_people__leadership_crosswalk
    given:
      - input: ref('int_people__staff_roster')
        rows:
          - employee_number: 100
            job_title: Head of Schools
            assignment_status: Active
            home_work_location_powerschool_school_id: 0
          - employee_number: 200
            job_title: Deputy Head of Schools
            assignment_status: Active
            home_work_location_powerschool_school_id: 0
          - employee_number: 300
            job_title: Managing Director
            assignment_status: Active
            home_work_location_powerschool_school_id: 0
          - employee_number: 900
            job_title: Head of Schools
            assignment_status: Terminated
            home_work_location_powerschool_school_id: 0
          - employee_number: 10
            job_title: School Leader
            assignment_status: Active
            reports_to_employee_number: 100
            home_work_location_powerschool_school_id: 1
            home_work_location_reporting_name: School One
            home_work_location_region: Newark
            home_work_location_abbreviation: One
            home_work_location_campus_name: Campus One
          - employee_number: 11
            job_title: Assistant School Leader
            assignment_status: Active
            reports_to_employee_number: 200
            home_work_location_powerschool_school_id: 1
            home_work_location_reporting_name: School One
            home_work_location_region: Newark
            home_work_location_abbreviation: One
            home_work_location_campus_name: Campus One
          - employee_number: 20
            job_title: Director School Operations
            assignment_status: Active
            home_work_location_powerschool_school_id: 2
            home_work_location_reporting_name: School Two
            home_work_location_region: Newark
            home_work_location_abbreviation: Two
            home_work_location_campus_name: Campus Two
          - employee_number: 21
            job_title: Assistant School Leader
            assignment_status: Active
            reports_to_employee_number: 200
            home_work_location_powerschool_school_id: 2
          - employee_number: 22
            job_title: Assistant School Leader, SPED
            assignment_status: Active
            reports_to_employee_number: 200
            home_work_location_powerschool_school_id: 2
          - employee_number: 23
            job_title: Assistant School Leader, School Culture
            assignment_status: Active
            reports_to_employee_number: 300
            home_work_location_powerschool_school_id: 2
          - employee_number: 30
            job_title: Director School Operations
            assignment_status: Active
            home_work_location_powerschool_school_id: 3
            home_work_location_reporting_name: School Three
            home_work_location_region: Camden
            home_work_location_abbreviation: Three
            home_work_location_campus_name: Campus Three
          - employee_number: 31
            job_title: Assistant School Leader
            assignment_status: Active
            reports_to_employee_number: 900
            home_work_location_powerschool_school_id: 3
          - employee_number: 32
            job_title: Assistant School Leader
            assignment_status: Active
            reports_to_employee_number: 900
            home_work_location_powerschool_school_id: 3
          - employee_number: 33
            job_title: Assistant School Leader
            assignment_status: Active
            reports_to_employee_number: 300
            home_work_location_powerschool_school_id: 3
          - employee_number: 40
            job_title: Director School Operations
            assignment_status: Active
            home_work_location_powerschool_school_id: 4
            home_work_location_reporting_name: School Four
            home_work_location_region: Paterson
            home_work_location_abbreviation: Four
            home_work_location_campus_name: Campus Four
          - employee_number: 41
            job_title: Assistant School Leader
            assignment_status: Active
            reports_to_employee_number: 300
            home_work_location_powerschool_school_id: 4
          - employee_number: 42
            job_title: Assistant School Leader
            assignment_status: Active
            reports_to_employee_number: 200
            home_work_location_powerschool_school_id: 4
    expect:
      rows:
        - home_work_location_powerschool_school_id: 1
          sl_employee_number: 10
          head_of_school_employee_number: 100
        - home_work_location_powerschool_school_id: 2
          sl_employee_number: null
          head_of_school_employee_number: 200
        - home_work_location_powerschool_school_id: 3
          sl_employee_number: null
          head_of_school_employee_number: 300
        - home_work_location_powerschool_school_id: 4
          sl_employee_number: null
          head_of_school_employee_number: 200
