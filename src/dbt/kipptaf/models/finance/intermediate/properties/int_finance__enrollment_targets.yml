models:
  - name: int_finance__enrollment_targets
    description: >-
      Financial-model enrollment targets by school, grade level, and academic
      year, sourced from the finance enrollment-targets Google Sheet and joined
      to PowerSchool schools to resolve the source district. The join is an
      inner join, so a sheet row whose `schoolid` does not match a PowerSchool
      school is dropped rather than carried through unattributed — the
      `int_finance__enrollment_targets__schoolid_resolves` test reports those
      rows. Five factor columns — `grade_band_ratio`, `at_risk_and_lep_ratio`,
      `at_risk_only_ratio`, `lep_only_ratio`, and `sped_ratio` — pass through
      from the sheet untouched, and their definitions are maintained there.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - schoolid
              - grade_level
    columns:
      - name: _dbt_source_project
        data_type: string
        description: >-
          District code location, passed through from
          `stg_powerschool__schools`. Used to join enrollment targets to
          district-scoped models.
      - name: fiscal_year
        data_type: int64
        description: >-
          Fiscal year the target was budgeted under, as entered on the finance
          sheet. Always one greater than `academic_year`.
      - name: academic_year
        data_type: int64
        description: >-
          Academic year the target applies to, derived upstream as `fiscal_year`
          minus one. Stores the starting year, so the 2026-2027 school year is
          2026.
      - name: region
        data_type: string
        description: >-
          Region label as typed on the finance sheet. Optional, and not
          authoritative — attribute a row to a district with
          `_dbt_source_project` instead.
      - name: schoolid
        data_type: int64
        description: >-
          PowerSchool school number the target applies to. Join key to
          `stg_powerschool__schools`.
      - name: school_name
        data_type: string
        description: >-
          School name as typed on the finance sheet. Not reconciled against the
          matched PowerSchool school record.
      - name: grade_level
        data_type: int64
        description: >-
          Grade level the target applies to, where 0 is kindergarten.
      - name: target_enrollment
        data_type: int64
        description: >-
          Planned enrollment for the school, grade level, and year, as entered
          on the finance sheet.
      - name: adjustment
        data_type: int64
        description: >-
          Optional manual correction the finance team recorded against
          `target_enrollment`. Blank when no correction was recorded.
      - name: attrition_factor
        data_type: float64
        description: >-
          Optional attrition allowance the financial model carries for the row.
          Blank when the finance team did not record one.
      - name: financial_model_enrollment
        data_type: float64
        description: >-
          Enrollment figure the financial model carries for the school, grade
          level, and year. Entered on the sheet rather than computed here, and
          it does not consistently equal `target_enrollment` plus `adjustment`
          net of `attrition_factor` — treat it as its own input, not a derived
          total.
      - name: grade_band_ratio
        data_type: float64
        description: >-
          Grade-band factor from the financial model. Optional sheet input.
      - name: at_risk_and_lep_ratio
        data_type: float64
        description: >-
          Combined at-risk and limited-English-proficient factor from the
          financial model. Optional sheet input.
      - name: at_risk_only_ratio
        data_type: float64
        description: >-
          At-risk-only factor from the financial model. Optional sheet input.
      - name: lep_only_ratio
        data_type: float64
        description: >-
          Limited-English-proficient-only factor from the financial model.
          Optional sheet input.
      - name: sped_ratio
        data_type: float64
        description: >-
          Special-education factor from the financial model. Optional sheet
          input.
