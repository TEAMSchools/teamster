models:
  - name: int_surveys__survey_responses
    description: >-
      Unioned raw response grain across Google Forms and Alchemer sources. One
      row per (survey_id, survey_response_id, survey_question_id,
      question_shortname, answer). Google Forms grid and check-all-that-apply
      questions produce multiple rows per (response, question_id) — one per row
      shortname or selected option — so the natural grain extends to shortname +
      answer. File-upload questions emit one row per uploaded file with the
      filename projected into `answer`. Marts that need per-shortname or
      per-question rollups project to that grain themselves.

      Every per-submission column — survey title, respondent identity, reporting
      term, dates, response link and round_rn — is selected through from
      int_surveys__survey_submissions, which owns that resolution. This model
      adds only the question and answer columns.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - survey_id
              - survey_response_id
              - survey_question_id
              - question_shortname
              - answer
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              survey_title not in (
                  'School Community Diagnostic Staff Survey',
                  'School Community Diagnostic Student Survey',
                  'KIPP NJ & KIPP Miami Family Survey',
                  'KIPP Miami Re-Commitment Form & Family School Community Diagnostic',
                  'Engagement & Support Surveys',
                  'Manager Survey'
              )
              or (academic_year is not null and term_code is not null)
          config:
            severity: warn
    columns:
      - name: survey_id
        data_type: string
      - name: survey_title
        data_type: string
      - name: survey_response_id
        data_type: string
      - name: survey_question_id
        data_type: string
      - name: answer
        data_type: string
      - name: question_title
        data_type: string
      - name: question_shortname
        data_type: string
      - name: round_rn
        data_type: int64
      - name: respondent_email
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: respondent_identifier
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: academic_year
        data_type: int64
      - name: term_code
        data_type: string
      - name: term_name
        data_type: string
      - name: respondent_employee_number
        data_type: int64
        config:
          meta:
            contains_pii: true
      - name: respondent_preferred_name
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: respondent_samaccountname
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: respondent_userprincipalname
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: answer_value
        data_type: numeric
      - name: date_started
        data_type: timestamp
      - name: date_submitted
        data_type: timestamp
      - name: survey_response_link
        data_type: string
      - name: is_open_ended
        data_type: int64
      - name: rated_department_code
        data_type: string
        description: >-
          Code for the department this question rates, joined from
          stg_google_sheets__google_forms__question_department_crosswalk on the
          lowered question shortname. Null when the question rates no department
          or is absent from the crosswalk; the Survey Dashboard treats both the
          same way.
      - name: rated_department_name
        data_type: string
        description: Display label for rated_department_code.
      - name: survey_submission_key
        data_type: string
        description: >-
          Surrogate key of the parent submission, selected through from
          int_surveys__survey_submissions so facts can join
          fct_survey_submissions without re-joining the submissions model.
