models:
  - name: int_surveys__leader_intent_to_return_population
    description: >-
      Staff assigned the Leader Intent to Return Survey, one row per person per
      leader round. A person is in the population when they hold an active
      primary assignment and their job title, home department, and home business
      unit are all on recruitment's lists for the round. Unlike most staff
      surveys, recent hires are included: intent to return asks about next year,
      which a new hire is also planning. This is the only place the leader rule
      lives; rpt_tableau__survey_links reads it both to assign the leader survey
      and to leave leaders out of the staff intent to return survey.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - employee_number
              - academic_year
              - survey_round
          config:
            severity: error
    columns:
      - name: employee_number
        data_type: int64
        description: Staff identifier from the ADP-derived roster.
        config:
          meta:
            contains_pii: true
      - name: academic_year
        data_type: int64
        description: Academic year of the leader survey round.
      - name: survey_round
        data_type: string
        description: Reporting term code of the leader survey round (LITR).
      - name: is_current
        data_type: boolean
        description: >-
          True while the leader survey round is open, per the reporting terms
          sheet.

unit_tests:
  - name: test_leader_population_rule
    description: >-
      Only people whose title, department, and business unit are all on the
      lists, and who meet survey eligibility, are in. A title and business unit
      match in an unlisted department is out; a KTAF Teaching and Learning
      Director is in; a KTAF Teacher Development Director and the Managing
      Director of Talent Acquisition are out; a recent hire is in; a non-primary
      assignment is out. Only the leader terms row produces rows.
    model: int_surveys__leader_intent_to_return_population
    given:
      - input: ref('int_people__staff_roster')
        format: sql
        rows: |
          select
              101 as employee_number,
              'Active' as assignment_status,
              true as primary_indicator,
              date '2020-08-01' as worker_original_hire_date,
              cast(null as date) as worker_rehire_date,
              'School Leader' as job_title,
              'School Leadership' as home_department_name,
              'TEAM Academy Charter School' as home_business_unit_name,
              'Person A' as formatted_name,
              'School A' as home_work_location_name,
              'a@example.org' as mail,
              901 as reports_to_employee_number,
              'Manager A' as reports_to_formatted_name,
              'ma@example.org' as reports_to_mail
          union all
          select
              102, 'Active', true, date '2020-08-01', null, 'School Leader',
              'Human Resources', 'TEAM Academy Charter School', 'Person B',
              'School A', 'b@example.org', 901, 'Manager A', 'ma@example.org'
          union all
          select
              103, 'Active', true, date '2020-08-01', null, 'Director',
              'Teaching and Learning', 'KIPP TEAM and Family Schools Inc.',
              'Person C', 'Network Office', 'c@example.org', 902, 'Manager B',
              'mb@example.org'
          union all
          select
              104, 'Active', true, date '2020-08-01', null, 'Director',
              'Teacher Development', 'KIPP TEAM and Family Schools Inc.',
              'Person D', 'Network Office', 'd@example.org', 902, 'Manager B',
              'mb@example.org'
          union all
          select
              105, 'Active', true, date '2020-08-01', null,
              'Managing Director of Talent Acquisition', 'Talent Acquisition',
              'KIPP TEAM and Family Schools Inc.', 'Person E', 'Network Office',
              'e@example.org', 902, 'Manager B', 'mb@example.org'
          union all
          select
              106, 'Active', true, date_sub(current_date(), interval 1 week),
              null, 'School Leader', 'School Leadership', 'KIPP Miami',
              'Person F', 'School B', 'f@example.org', 903, 'Manager C',
              'mc@example.org'
          union all
          select
              107, 'Active', false, date '2020-08-01', null, 'School Leader',
              'School Leadership', 'KIPP Miami', 'Person G', 'School B',
              'g@example.org', 903, 'Manager C', 'mc@example.org'
      - input: ref('stg_google_sheets__reporting__terms')
        format: sql
        rows: |
          select
              'Leader Intent to Return Survey' as `name`,
              'SURVEY' as type,
              2026 as academic_year,
              'LITR' as code,
              true as is_current
          union all
          select 'Intent to Return Survey', 'SURVEY', 2026, 'ITR', true
    expect:
      rows:
        - employee_number: 101
          academic_year: 2026
          survey_round: LITR
          is_current: true
        - employee_number: 103
          academic_year: 2026
          survey_round: LITR
          is_current: true
        - employee_number: 106
          academic_year: 2026
          survey_round: LITR
          is_current: true
