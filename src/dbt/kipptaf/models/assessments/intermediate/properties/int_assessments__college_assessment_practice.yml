models:
  - name: int_assessments__college_assessment_practice
    description: >-
      Practice SAT, PSAT, and ACT results from Illuminate, converted from raw
      score to scale score through two KIPP Forward sheet tabs.
      practice_scale_score_conversion supplies the raw-to-scale bands and
      scaffold supplies the vocabulary, joined on academic_year, the sheet's
      scope against expected_scope, and score_type against expected_score_type.
      An assessment appears here only if its id is in the conversion sheet and
      its score_type has a matching Practice scaffold row — that inner join is
      the designation mechanism, and it drops unmatched bands silently.
      Illuminate's own scope is never read, because externally created
      assessments carry Benchmark or null rather than the test name.


      Three row types. Group rows carry the per-response-group detail, one per
      response group per student per assessment. Subject rows carry one row per
      student per assessment at the section grain the official hub uses, with
      points and percent_correct nulled. Total rows carry one row per student
      administration, with scale_score gated on actual_total_subjects_tested =
      expected_total_subjects_tested and a null assessment_id.


      assessment_id is canonical_assessment_id, since response_rollup is
      canonical-grain. Every sheet id currently equals its canonical id because
      practice assessments have not been grouped into multi-member canonicals.
      If a multipart practice administration is ever created, the sheet must
      reference the canonical (lowest) id.


      See docs/models/carat-dashboard-data-model.md.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - powerschool_student_number
              - assessment_id
              - response_type_description
          config:
            severity: error
            # Scoped to section rows. Composite rows have a different grain —
            # one per student administration per grade — and null assessment_id.
            where: response_type = 'Group'
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - powerschool_student_number
              - assessment_id
          config:
            severity: error
            # Subject rows are one per student per assessment, inherited from
            # Illuminate's overall grain. Holds only while the conversion sheet
            # keeps one metadata combination per assessment_id — a typo that
            # varies any of them breaks the grain here rather than silently.
            where: response_type = 'Subject'
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - powerschool_student_number
              - scope_round
              - test_type
              - grade_level
          config:
            severity: error
            # Total rows carry a null assessment_id, so the key is the
            # administration itself — the same columns the total branch groups
            # by, minus the derived counts.
            where: response_type = 'Total'
    columns:
      - name: academic_year
        data_type: int64
        description: >-
          Academic year of the administration, from response_rollup. Start-year
          convention, so SY26-27 reads 2026.
      - name: powerschool_student_number
        data_type: int64
        description: Student Number assigned by the school. Indexed.
      - name: scope
        data_type: string
        description: >-
          The test itself — SAT, ACT, PSAT 8/9, or PSAT10 — from the conversion
          sheet, which is authoritative because Illuminate's own scope reads
          Benchmark or null on externally created assessments and is never read
          here. Matches int_assessments__college_assessment, so the two hubs
          union on this column. Every predicate keying on the test uses it,
          including the total row's score_type and the ACT average.
      - name: scope_round
        data_type: string
        description: >-
          The conversion sheet's scope_round — SAT1, SAT2, ACT1, PSAT891,
          PSAT101. Part of the partition building Total scores, so two
          administrations in one year must never share a value.
      - name: test_type
        data_type: string
        description: >-
          Always Practice, from the scaffold's expected_test_type, which the
          conversion join filters to that value. Mirrors
          int_assessments__college_assessment, where test_type is the constant
          Official and scope holds the test, so both hubs use one vocabulary and
          union without translation.
      - name: grade_level
        data_type: int64
        description: >-
          Grade sitting the assessment, from the conversion sheet. Part of the
          partition counting sections tested, because AY2023 ran a three-section
          SAT for grades 9-10 and the two-section digital form for grade 11
          under one administration round.
      - name: assessment_id
        data_type: int64
        description: >-
          Illuminate canonical assessment id, and the key joining to the
          conversion sheet. Null on Total rows, which aggregate across
          assessments.
      - name: assessment_title
        data_type: string
        description: Illuminate assessment title. Reads NA on Total rows.
      - name: administration_round
        data_type: string
        description: >-
          Month and two-digit year derived from Illuminate's administered_at,
          such as Oct 23. Null where administered_at is null, which is every
          externally created assessment — scope_round is the reliable
          administration identifier.
      - name: course_discipline
        data_type: string
        description: >-
          ENG, MATH, or SCI, from the scaffold and matching PowerSchool credit
          types. Stamped NA on Total rows so each administration yields one row.
      - name: test_date
        data_type: date
        description: >-
          The student's response date, from Illuminate. On Total rows this is
          the latest section date, since sections can be sat on different days.
      - name: test_month
        data_type: string
        description: Full month name of test_date.
      - name: response_type
        data_type: string
        description: >-
          Group, Subject, or Total. Group carries Illuminate's response-group
          detail. Subject and Total are both built from Illuminate's overall
          rows, which are never emitted as themselves — Subject one per
          assessment, Total one per administration.
      - name: response_type_description
        data_type: string
        description: >-
          Illuminate response group name on Group rows. Subject rows read
          Subject Score and Total rows read Total Score.
      - name: subject
        data_type: string
        description: >-
          Section subject as the conversion sheet spells it — Mathematics,
          Reading and Writing, Reading, Writing, English, Science. Null on Total
          rows.
      - name: subject_area
        data_type: string
        description: >-
          Section subject as the assessment hubs spell it, from the scaffold.
          Total rows read Composite for ACT and Combined for everything else.
      - name: aligned_subject_area
        data_type: string
        description: >-
          Subject collapsed for cross-test comparison, from the scaffold. Total
          rows read Total.
      - name: score_type
        data_type: string
        description: >-
          Score identifier matching score_type in
          int_assessments__college_assessment, and the key joining the
          conversion sheet to the scaffold. Non-null on every row type — Total
          rows get theirs from a case on scope, since the conversion sheet holds
          no total bands to join.
      - name: points
        data_type: numeric
        description: >-
          Raw score for the response group, meaning questions answered
          correctly. Group rows only — null on Subject rows, and summed across
          sections on Total rows.
      - name: percent_correct
        data_type: numeric
        description: >-
          Share of questions answered correctly, as a 0-1 fraction. Group rows
          only — null on both Subject and Total rows.
      - name: actual_total_subjects_tested
        data_type: int64
        description: >-
          Distinct sections the student sat, counted per academic year, student,
          scope_round, and grade level. Compared against
          expected_total_subjects_tested to decide whether a Total row gets a
          score. The partition uses scope_round rather than administration_round
          deliberately — administration_round derives from Illuminate's
          administered_at, which is null on every externally created assessment.
          Grade level is in the partition because AY2023 ran two SAT forms under
          one round.
      - name: expected_total_subjects_tested
        data_type: int64
        description: >-
          Sections the administration expects, from the conversion sheet — 4 for
          ACT, 3 for the legacy grade 9-10 SAT, 2 otherwise.
      - name: raw_score
        data_type: numeric
        description: >-
          The section's own raw score, taken from its overall row rather than
          the response group. Summed across sections on Total rows.
      - name: scale_score
        data_type: numeric
        description: >-
          Converted scale score, read from the sheet's aligned_scale_score so no
          rescaling happens here. On Total rows it is the average of sections
          for ACT and the sum for everything else, and null when the student did
          not sit every expected section — which is how an incomplete attempt
          stays visible rather than being dropped. Numeric because the
          conversion CTE casts aligned_scale_score once; left as int64 the ACT
          average would return float64 and coerce the whole union up.
      - name: aligned_scope
        data_type: string
        description: >-
          The scaffold's expected_aligned_scope — ACT/SAT, PSAT10/NMSQT, or PSAT
          8/9. Folds ACT and SAT together, so it is for attainment booleans
          only. Never max a score partitioned on it — ACT and SAT are different
          scales, so a 36 would be rated against an SAT threshold. Scores use
          benchmark_aligned_scope, which
          int_assessments__all_college_assessments derives for both hubs.
      - name: grouping
        data_type: string
        quote: true
        description: >-
          The scaffold's expected_grouping — Total, Math, EBRW, Reading,
          Writing, English, Science, or Growth. Reported on for growth over
          time. Total rows carry Total rather than the section value they
          aggregate. Backticked at every site because grouping is a BigQuery
          reserved word.
      - name: is_overall_score
        data_type: int64
        description: >-
          Flags a total score rather than a section. Keyed on response_type
          rather than on subject_area as the official hub does, because that hub
          has no group rows to exclude.
      - name: is_subject_score
        data_type: int64
        description: >-
          Flags a section score rather than a total. Group rows read 0 on this
          and on is_overall_score, being response-group detail rather than
          either.
      - name: strategy_case
        data_type: string
        description: >-
          Which score shapes the administration produced, using the same labels
          the official hub assigns — Case 2 for sections without a total, Case 3
          for both. Derived from whether the student sat every expected section,
          since a total is scored only when they did.


          Case 1, a total with no sections, cannot occur here. The total is
          computed from the sections, so there is no path to one without them. A
          consumer filtering to Case 1 therefore sees official students only,
          which is correct rather than missing data.


          The unit differs from the official hub's by one dimension. There the
          counts partition by student, scope, and test date, so the label
          describes a single sitting. Here actual_total_subjects_tested is
          counted per academic year, student, scope_round, and grade, so the
          label describes an administration, whose sections can be sat on
          different days.
      - name: max_scale_score
        data_type: numeric
        description: >-
          The student's best score for this score type, carried on every attempt
          so an average over attempts can weigh the best rather than each
          sitting. Two practice SAT administrations in one year give a student
          two rows per score type, and rn_highest tags which one earned it. Null
          on group rows.
      - name: running_max_scale_score
        data_type: numeric
        description: >-
          Highest score for this score type as of this test date, so an earlier
          sitting is not retroactively improved by a later one.
      - name: rn_highest
        data_type: int64
        description: >-
          Ranks a student's scores highest-first within scope and score_type,
          matching the official hub's convention so the two union without
          translation. Null on group rows, which are response-group detail and
          are not ranked — only subject and total rows carry a rank.
