models:
  - name: int_assessments__college_assessment_practice
    description: >-
      Practice SAT and ACT results from Illuminate, converted from raw score to
      scale score through the kippfwd act_scale_score_key spreadsheet. An
      assessment appears here only if its assessment id is present in that sheet
      — sheet membership is the designation mechanism, and Illuminate's scope is
      deliberately not filtered because externally created practice assessments
      carry scope Benchmark rather than SAT. The sheet is authoritative for
      subject, grade level, and administration round; Illuminate is
      authoritative for assessment identity and student responses. Section rows
      carry response_type group; composite and combined rows are appended as
      separate union branches carrying response_type NA.


      The sheet is joined twice for different purposes. Designation reads a
      distinct one-row-per-assessment list, because the sheet holds 45-54
      conversion rows per assessment and joining on assessment_id alone fans
      every response row out roughly fiftyfold; a singular test guards the
      constancy that collapse depends on. Conversion is a separate left join on
      the raw-score range, so an uncovered raw score reports a null scale score
      instead of dropping the row.


      assessment_id is canonical_assessment_id, since response_rollup is
      canonical-grain. Every sheet id currently equals its canonical id because
      practice assessments have not been grouped into multi-member canonicals.
      If a multipart practice administration is ever created, the sheet must
      reference the canonical (lowest) id.


      See docs/models/carat-dashboard-data-model.md.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - powerschool_student_number
              - assessment_id
              - response_type_description
          config:
            severity: error
            # Scoped to section rows. The two older composite branches select
            # distinct over columns that vary within their partition, so they
            # emit one row per distinct discipline and cannot satisfy this key
            # until that is fixed.
            where: response_type = 'group'
    columns:
      - name: academic_year
        data_type: int64
        description: >-
          Academic year of the administration, taken from response_rollup. This
          is the start-year convention, so SY26-27 reads 2026. The sheet's own
          Academic_Year column is not read by this model.
      - name: powerschool_student_number
        data_type: int64
        description: Student Number assigned by the school. Indexed.
      - name: scope
        data_type: string
        description: >-
          Illuminate's assessment scope, passed through unchanged. Historical
          practice assessments read SAT or ACT; externally created ones read
          Benchmark. Not used to designate rows.
      - name: scope_round
        data_type: string
        description: >-
          The sheet's Administration_Round value, such as SAT1, SAT2, or ACT1.
          Distinguishes administrations within an academic year and is part of
          the partition that builds composite and combined scores, so two
          administrations must never share a value.
      - name: test_type
        data_type: string
        description: >-
          Always Practice in this model, distinguishing these rows from official
          results sourced from College Board and kippadb.
      - name: assessment_id
        data_type: int64
        description: >-
          Illuminate canonical assessment id, and the key that joins to the
          sheet. Null on composite and combined rows, which aggregate across
          assessments.
      - name: assessment_title
        data_type: string
        description: >-
          Illuminate assessment title. Reads NA on composite and combined rows.
      - name: administration_round
        data_type: string
        description: >-
          Month and two-digit year derived from Illuminate's administered_at,
          such as Oct 23. Externally created assessments leave administered_at
          null, so those rows fall back to the sheet's Administration_Round
          value rather than reporting null.
      - name: course_discipline
        data_type: string
        description: >-
          ENG or MATH, derived from the sheet's Subject. Every math row
          currently reads NA, because the comparison tests for Math while the
          sheet stores Mathematics. Preserved deliberately — correcting it would
          change historical values. Stamped NA on the two-section combined
          branch so that branch yields one row per administration.
      - name: subject_area
        data_type: string
        description: >-
          Section subject from the sheet, with Mathematics renamed to Math. Read
          from the sheet rather than Illuminate because Illuminate reports null
          for every Reading and Writing assessment, which would undercount the
          sections tested. Composite rows read Composite and combined rows read
          Combined.
      - name: test_date
        data_type: date
        description: >-
          The date this test was given. On the two-section combined branch this
          is the later of the two section dates, since the sections can be
          administered on different days.
      - name: test_month
        data_type: string
        description: Full month name of test_date.
      - name: response_type
        data_type: string
        description: >-
          Reads group for section-level rows and NA for composite and combined
          rows. Illuminate's overall rows are consumed to build scale scores and
          composites rather than emitted directly.
      - name: response_type_description
        data_type: string
        description: >-
          Illuminate response group name. Reads NA on composite and combined
          rows.
      - name: points
        data_type: numeric
        description: >-
          Raw score, meaning the number of questions answered correctly. Summed
          across sections on composite and combined rows.
      - name: percent_correct
        data_type: numeric
        description: >-
          Share of questions answered correctly, rescaled to a 0-1 fraction.
          Null on composite and combined rows.
      - name: total_subjects_tested
        data_type: int64
        description: >-
          Distinct sections the student sat in this administration. Gates which
          composite branch applies — 4 for the ACT composite, 3 for the legacy
          three-section SAT, and 2 for the two-section digital SAT.


          The two-section branch additionally requires that the administration
          carry a Reading and Writing section. A partial sitting of the legacy
          three-section form also reports two subjects, so the count alone would
          manufacture a full digital-SAT total out of two of three legacy
          sections — 129 legacy SAT student-rounds and 22 ACT ones are affected.
      - name: raw_score
        data_type: numeric
        description: >-
          Raw score for the section, or the summed raw score on composite and
          combined rows. Null when the sheet holds no conversion row covering
          the student's points value.
      - name: scale_score
        data_type: float64
        description: >-
          Converted scale score. Null when no conversion row covers the
          student's raw score, which surfaces as a visible gap rather than a
          dropped row. The ACT composite averages its four sections and both SAT
          combined branches sum theirs. The two-section branch reports null
          unless both sections converted, so a partial conversion never presents
          as a complete total.


          Legacy grade 9 and 10 SAT Reading and Writing rows are multiplied by
          ten, because the sheet stores those on a 20-80 section scale rather
          than 200-800. The guard is narrow on purpose - scope SAT, subject
          Reading or Writing, grade 9 or 10 - and PSAT rows are the first to
          populate those grades, so widening that predicate would wrongly catch
          them.
