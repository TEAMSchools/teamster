models:
  - name: int_assessments__standard_rollup
    description: >-
      One row per student, assessment, and standard, from the `standard` rows of
      `int_assessments__response_rollup`. A standard is its code and
      description. Illuminate keeps some standards in more than one standards
      set, and an assessment can align items to the same standard through
      records in 2 sets, which splits it across `response_type_id` rows in the
      rollup. This model scores those records as 1 standard, so a standard
      counts once wherever scores are averaged by standard. Disabled; the rollup
      now merges split standards itself, so read its `standard` rows instead.
    config:
      enabled: false
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - source
              - assessment_id
              - response_type_code
              - response_type_description
              - is_replacement
    columns:
      - name: source
        data_type: string
        description: System the assessment comes from (`illuminate` or `apex`).
      - name: student_number
        data_type: int64
        description: PowerSchool student number.
      - name: academic_year
        data_type: int64
        description: Academic year of the assessment (2026 = 2026-27).
      - name: assessment_id
        data_type: int64
        description: Canonical assessment id from the rollup.
      - name: title
        data_type: string
        description: Assessment title.
      - name: scope
        data_type: string
        description: Assessment scope as recorded in Illuminate.
      - name: subject_area
        data_type: string
        description: Illuminate subject area.
      - name: term_administered
        data_type: string
        description:
          RT reporting term whose date range contains the administered date.
      - name: is_internal_assessment
        data_type: boolean
        description:
          True when the assessment has a row in the AppSheet Illuminate
          Assessments Extension.
      - name: is_replacement
        data_type: boolean
        description: From `int_assessments__response_rollup`.
      - name: response_type
        data_type: string
        description: Always `standard`.
      - name: response_type_code
        data_type: string
        description: Standard code. Part of the standard's identity.
      - name: response_type_description
        data_type: string
        description:
          Standard description. Part of the standard's identity, so records that
          share a code but differ in text stay separate.
      - name: percent_correct
        data_type: numeric
        description: >-
          With 1 standard record, the rollup's `percent_correct` unchanged. With
          more than 1, total points over total points possible across the
          records, times 100. Averaging the records' percents would weight a
          small item set as much as a large one.
      - name: performance_band_label
        data_type: string
        description:
          The rollup's band label with 1 standard record; null with more than 1,
          since each record carries its own band.
