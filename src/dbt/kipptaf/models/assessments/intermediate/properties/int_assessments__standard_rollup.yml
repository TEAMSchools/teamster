models:
  - name: int_assessments__standard_rollup
    description: >-
      One row per student, assessment, and standard, from the `standard` rows of
      `int_assessments__response_rollup`. A standard is its code and
      description. Illuminate keeps some standards in more than one standards
      set, and an assessment can align items to the same standard through
      records in 2 sets, which splits it across `response_type_id` rows in the
      rollup. This model scores those records as 1 standard, so a standard
      counts once wherever scores are averaged by standard. Read standard-level
      scores here, not from the rollup.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - source
              - assessment_id
              - response_type_code
              - response_type_description
              - is_replacement
    columns:
      - name: source
        data_type: string
        description: System the assessment comes from (`illuminate` or `apex`).
      - name: student_number
        data_type: int64
        description: PowerSchool student number.
      - name: academic_year
        data_type: int64
        description: Academic year of the assessment (2026 = 2026-27).
      - name: assessment_id
        data_type: int64
        description: Canonical assessment id from the rollup.
      - name: title
        data_type: string
        description: Assessment title.
      - name: scope
        data_type: string
        description: Assessment scope as recorded in Illuminate.
      - name: subject_area
        data_type: string
        description: Illuminate subject area.
      - name: term_administered
        data_type: string
        description:
          RT reporting term whose date range contains the administered date.
      - name: is_internal_assessment
        data_type: boolean
        description:
          True when the assessment has a row in the AppSheet Illuminate
          Assessments Extension.
      - name: is_replacement
        data_type: boolean
        description: From `int_assessments__response_rollup`.
      - name: response_type
        data_type: string
        description: Always `standard`.
      - name: response_type_code
        data_type: string
        description: Standard code. Part of the standard's identity.
      - name: response_type_description
        data_type: string
        description:
          Standard description. Part of the standard's identity, so records that
          share a code but differ in text stay separate.
      - name: percent_correct
        data_type: numeric
        description: >-
          With 1 standard record, the rollup's `percent_correct` unchanged. With
          more than 1, total points over total points possible across the
          records, times 100. Averaging the records' percents would weight a
          small item set as much as a large one.
      - name: performance_band_label
        data_type: string
        description:
          The rollup's band label with 1 standard record; null with more than 1,
          since each record carries its own band.
unit_tests:
  - name: test_int_assessments__standard_rollup_split_standard
    description: >-
      Standard A is aligned to 2 Illuminate standard records on one assessment,
      3 of 4 points on one and 0 of 2 on the other. It scores once, 3 of 6
      points (50), not the average of 75 and 0, and has no band. Standard B has
      1 record and keeps its percent_correct of 80 and its band, rather than a
      recomputed 77.8.
    model: int_assessments__standard_rollup
    given:
      - input: ref('int_assessments__response_rollup')
        format: sql
        rows: |
          select
              'illuminate' as source,
              101 as student_number,
              2026 as academic_year,
              9001 as assessment_id,
              'Unit 1' as title,
              'Unit Assessment' as scope,
              'Mathematics' as subject_area,
              'Q1' as term_administered,
              true as is_internal_assessment,
              false as is_replacement,
              'standard' as response_type,
              'CODE.A' as response_type_code,
              'Standard A' as response_type_description,
              cast(3 as numeric) as points,
              cast(4 as numeric) as points_possible,
              cast(75 as numeric) as percent_correct,
              'Proficient' as performance_band_label
          union all
          select
              'illuminate', 101, 2026, 9001, 'Unit 1', 'Unit Assessment',
              'Mathematics', 'Q1', true, false, 'standard', 'CODE.A',
              'Standard A', cast(0 as numeric), cast(2 as numeric),
              cast(0 as numeric), 'Far Below'
          union all
          select
              'illuminate', 101, 2026, 9001, 'Unit 1', 'Unit Assessment',
              'Mathematics', 'Q1', true, false, 'standard', 'CODE.B',
              'Standard B', cast(7 as numeric), cast(9 as numeric),
              cast(80 as numeric), 'Proficient'
          union all
          select
              'illuminate', 101, 2026, 9001, 'Unit 1', 'Unit Assessment',
              'Mathematics', 'Q1', true, false, 'overall', cast(null as string),
              cast(null as string), cast(10 as numeric), cast(15 as numeric),
              cast(66.7 as numeric), 'Approaching'
    expect:
      rows:
        - {
            response_type_code: CODE.A,
            percent_correct: 50,
            performance_band_label: null,
          }
        - {
            response_type_code: CODE.B,
            percent_correct: 80,
            performance_band_label: Proficient,
          }
