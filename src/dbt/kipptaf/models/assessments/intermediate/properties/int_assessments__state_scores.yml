models:
  - name: int_assessments__state_scores
    description: >-
      Every New Jersey and Florida state assessment score, one row per student
      test record. New Jersey rows come from int_pearson__all_assessments, which
      carries both Pearson NJSLA/NJGPA results and the Cambium results that
      replaced them; Florida rows come from int_fldoe__all_assessments (FAST,
      EOC, and science). Columns are renamed to one shared vocabulary, and
      columns only one state reports are null on the other state's rows. The
      vendor subject crosswalk is joined once here, so consumers read
      illuminate_subject_area instead of repeating the join. Read by every
      kipptaf model that unions state scores.
    config:
      materialized: table
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - _dbt_source_project
              - state_student_id
              - academic_year
              - administration_period
              - raw_subject
    columns:
      - name: score_source
        data_type: string
        description: >-
          State the score belongs to. state_nj for New Jersey (Pearson and
          Cambium) and state_fl for Florida (FLDOE).
      - name: _dbt_source_relation
        data_type: string
        description: Upstream relation the row was unioned from.
      - name: _dbt_source_project
        data_type: string
        description: >-
          Region identifier (kippnewark, kippcamden, kipppaterson, kippmiami) of
          the score.
      - name: student_number
        data_type: int64
        description: >-
          PowerSchool or Focus student number. From localstudentidentifier for
          New Jersey and student_number for Florida. Can be null when the state
          file carries no local id.
      - name: state_student_id
        data_type: string
        description: >-
          State-assigned student id. From statestudentidentifier for New Jersey
          and student_id (FLEID) for Florida.
      - name: academic_year
        data_type: int64
        description: Academic year of the administration.
      - name: administration_period
        data_type: string
        description: >-
          Administration window. The normalized administration_period for New
          Jersey and administration_window (PM1, PM2, PM3) for Florida.
      - name: administration_round
        data_type: string
        description: >-
          Raw administration label. admin for New Jersey and
          administration_window for Florida.
      - name: season
        data_type: string
        description: Season of the administration. admin for New Jersey.
      - name: test_date
        data_type: date
        description: Date the test was taken.
      - name: assessment_name
        data_type: string
        description: Assessment family, such as NJSLA, NJGPA, or FAST.
      - name: assessment_type
        data_type: string
        description: Assessment type label from the source model.
      - name: results_type
        data_type: string
        description: Results type label from the source model.
      - name: district_state
        data_type: string
        description: State the district reports to.
      - name: raw_subject
        data_type: string
        description: >-
          Subject exactly as the source reports it. subject for New Jersey and
          assessment_subject for Florida. The crosswalk join key.
      - name: subject_area
        data_type: string
        description: >-
          Source subject area. subject_area for New Jersey and
          assessment_subject for Florida.
      - name: aligned_subject
        data_type: string
        description: >-
          Cross-state aligned subject. aligned_subject for New Jersey and
          assessment_subject for Florida.
      - name: illuminate_subject_area
        data_type: string
        description: >-
          Subject area aligned to Illuminate subject names, from
          stg_google_sheets__assessments__vendor_subject_crosswalk on the source
          system and raw_subject. Falls back to raw_subject when the crosswalk
          has no row.
      - name: discipline
        data_type: string
        description: Discipline (ELA, Math, Science) of the test.
      - name: module_code
        data_type: string
        description: >-
          Test code. module_code for New Jersey and test_code for Florida.
      - name: aligned_test_code
        data_type: string
        description: >-
          Cross-state aligned test code. aligned_test_code for New Jersey and
          test_code for Florida.
      - name: test_grade
        data_type: int64
        description: >-
          Grade level of the test. test_grade for New Jersey and
          assessment_grade cast to an integer for Florida.
      - name: grade_level_when_assessed
        data_type: int64
        description: >-
          Student grade level at the time of the test. New Jersey only; null on
          Florida rows.
      - name: scale_score
        data_type: numeric
        description: >-
          Scale score. testscalescore for New Jersey and scale_score for
          Florida.
      - name: performance_level
        data_type: int64
        description: >-
          Numeric performance level. testperformancelevel for New Jersey and
          performance_level for Florida.
      - name: performance_level_label
        data_type: string
        description: >-
          Performance level label. testperformancelevel_text for New Jersey and
          achievement_level for Florida.
      - name: is_proficient
        data_type: boolean
        description: Whether the score meets the state's proficiency cut.
      - name: is_proficient_int
        data_type: int64
        description: is_proficient as 1 or 0.
      - name: is_approaching_int
        data_type: int64
        description: 1 when the score is in the approaching band, else 0.
      - name: is_below_int
        data_type: int64
        description: 1 when the score is in the below band, else 0.
      - name: aggregated_proficiency
        data_type: string
        description: >-
          Proficiency bucket. njsla_aggregated_proficiency for New Jersey and
          fast_aggregated_proficiency for Florida.
      - name: performance_band_group_label
        data_type: string
        description: >-
          Performance band group label. njsla_performance_band_group_label for
          New Jersey and fast_performance_band_group_label for Florida.
      - name: aligned_performance_band_group
        data_type: string
        description: Cross-state aligned performance band group.
      - name: lep_status
        data_type: boolean
        description: >-
          Limited English proficiency flag from the state file. New Jersey only.
      - name: is_504
        data_type: boolean
        description: Section 504 flag from the state file. New Jersey only.
      - name: iep_status
        data_type: string
        description: IEP status from the state file. New Jersey only.
      - name: race_ethnicity
        data_type: string
        description: Race and ethnicity from the state file. New Jersey only.
      - name: aligned_ml_status
        data_type: string
        description: >-
          Cross-state aligned multilingual learner status. New Jersey only.
      - name: aligned_aggregate_ethnicity
        data_type: string
        description: Cross-state aligned ethnicity group. New Jersey only.
      - name: aligned_iep_status
        data_type: string
        description: Cross-state aligned IEP status. New Jersey only.
      - name: source_system
        data_type: string
        description: >-
          Vendor source system of the score, pearson for New Jersey and fldoe
          for Florida. The source_system value the vendor subject crosswalk
          uses.
