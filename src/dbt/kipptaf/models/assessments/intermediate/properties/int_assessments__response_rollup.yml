models:
  - name: int_assessments__response_rollup
    description: >-
      Per-student × per-canonical-assessment × per-response-type rollup of
      Illuminate response data. Starts from `int_assessments__scaffold` and LEFT
      JOINs student responses, the canonical performance band set, and the
      canonical assessment, so scaffold rows with no responses are kept with
      null response columns. `date_taken` is nulled when it falls more than 365
      days from the canonical administered date, or, when there is no
      administered date, outside `academic_year` plus or minus one year. For
      internal assessments, multipart member assessments (sharing a
      `canonical_assessment_id` per `int_assessments__assessments_members`) are
      aggregated to one row per student, `is_replacement`, and response with
      summed points, the earliest `date_taken`, and a deterministic single
      school/region selection. External assessments pass through one row per
      scaffold row and response. `assessment_id` here is the canonical id, not
      the per-row member id; `assessment_ids` (array) preserves the underlying
      member ids for drilldown. Performance band labels and the reporting terms
      of the administered and taken dates are joined last.
    config:
      materialized: table
      meta:
        contains_pii: true
        dagster:
          # cron instead of eager. Ticks sit at :30, not :00: the Illuminate
          # dlt sync (dlt/illuminate/schedules.py) fires on the hour and the
          # stg_illuminate__* tables rebuild in their own runs minutes later,
          # so a :00 tick reads the previous sync. Each tick must still finish
          # before the DDI Suite refreshes (ddi_suite in
          # exposures/tableau.yml). Every assessment-chain cron model and its
          # cron consumers share this minute so one run builds them in dbt
          # order. Refs #4559, #5734
          # ponytail: fixed offset, not a dependency gate.
          # ~any_deps_in_progress can't see the stg tables through the
          # int_illuminate__agg_student_responses view. If syncs run past :30,
          # gate on the stg parents' newly_updated.
          automation_condition:
            cron_schedule: 30 0,10,13,15,17 * * *
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - illuminate_student_id
              - assessment_id
              - response_type
              - response_type_id
              - is_replacement
      # Asserts the relative invariant the model now enforces: a sitting date is
      # judged against its own administration, not an absolute calendar floor.
      # Kept at warn so a source regression surfaces without blocking CI.
      - dbt_utils.expression_is_true:
          arguments:
            expression: |-
              date_taken is null
              or (
                administered_at is not null
                and abs(date_diff(date_taken, administered_at, day)) <= 365
              )
              or (
                administered_at is null
                and extract(year from date_taken)
                  between academic_year - 1 and academic_year + 1
              )
          config:
            severity: warn
    columns:
      - name: illuminate_student_id
        data_type: int64
        description: Illuminate student id, from `int_assessments__scaffold`.
      - name: powerschool_student_number
        data_type: int64
        description: Student number, from `int_assessments__scaffold`.
      - name: academic_year
        data_type: int64
        description: >-
          `academic_year_clean` from `int_assessments__assessments_members`
          propagated via scaffold (not the raw Illuminate `academic_year`).
          Consumers computing surrogate hashes must use this same derivation.
      - name: scope
        data_type: string
        description: From `int_assessments__scaffold`.
      - name: subject_area
        data_type: string
        description: From `int_assessments__scaffold`.
      - name: discipline
        data_type: string
        description: >-
          Course discipline from the matched PowerSchool course enrollment.
          Populated only for the internal-assessment branch
          (`is_internal_assessment=true` and `is_replacement=false`); null for
          K-8 replacement curriculum and external-assessment rows.
      - name: module_type
        data_type: string
        description: From `int_assessments__scaffold`.
      - name: module_code
        data_type: string
        description: From `int_assessments__scaffold`.
      - name: region
        data_type: string
        description: >-
          The student's region for this administration. For internal rows,
          selected together with `powerschool_school_id` and
          `_dbt_source_project` from a single source row via `first_value(...)`
          over (student, canonical assessment, `is_replacement`), ordered by
          earliest sanitized `date_taken`, then `student_assessment_id`, then
          school id, and read via `any_value()` in the rollup. Not a canonical
          attribute — it is per-response location data that can vary across rows
          in the same partition because of upstream Illuminate academic-year
          tagging defects; `first_value` is a deterministic tiebreak, not a
          canonicalization. External rows carry the scaffold row's own value.
      - name: powerschool_school_id
        data_type: int64
        description: >-
          The student's school for this administration. For internal rows,
          selected together with `region` and `_dbt_source_project` from a
          single source row; see `region` for the tiebreak. External rows carry
          the scaffold row's own value. Also the school key for the
          reporting-terms joins.
      - name: _dbt_source_project
        data_type: string
        description: >-
          Dagster code-location prefix (e.g. kippnewark, kippcamden, kippmiami,
          kipppaterson), derived from region in `int_assessments__scaffold` and
          selected with `region` here. Carried into downstream hashes so
          consumers join/hash on a stable column rather than re-deriving it at
          each call.
      - name: is_internal_assessment
        data_type: boolean
        description: From `int_assessments__scaffold`.
      - name: is_replacement
        data_type: boolean
        description: >-
          From `int_assessments__scaffold`. Part of the grain, so a student's
          replacement and non-replacement rows for one canonical assessment stay
          separate.
      - name: response_type
        data_type: string
        description: >-
          `overall`, `standard`, or `group`, from
          `int_illuminate__agg_student_responses`. Null when the scaffold row
          has no responses.
      - name: response_type_id
        data_type: int64
        description: >-
          Standard or reporting group id for the response (`-1` for overall),
          from `int_illuminate__agg_student_responses`.
      - name: response_type_code
        data_type: string
        description: From `int_illuminate__agg_student_responses`.
      - name: response_type_description
        data_type: string
        description: From `int_illuminate__agg_student_responses`.
      - name: response_type_root_description
        data_type: string
        description: From `int_illuminate__agg_student_responses`.
      - name: date_taken
        data_type: date
        description: >-
          Illuminate date taken after sanitizing — null when it is more than 365
          days from the canonical administered date, or, with no administered
          date, outside `academic_year` plus or minus one year. For internal
          rows, the earliest sanitized date across the rolled-up members.
      - name: points
        data_type: numeric
        description: >-
          For internal multipart canonical groups, the sum of points across all
          member assessments the student took within the canonical group. For
          non-internal and single-member canonical groups, equals the per-row
          points from `int_illuminate__agg_student_responses`.
        config:
          meta:
            source_column: int_illuminate__agg_student_responses.points
      - name: percent_correct
        data_type: numeric
        description: >-
          For internal rows, `sum(points) / sum(points_possible) * 100` across
          the rolled-up members, rounded to one decimal. For external rows, the
          per-row `percent_correct` from
          `int_illuminate__agg_student_responses`.
      - name: title
        data_type: string
        description: >-
          `title` from `int_assessments__assessments_canonical` for the
          canonical group. For non-internal assessments, takes the member's own
          title via `if(is_internal_assessment, ...)`.
        config:
          meta:
            source_column: int_assessments__assessments_canonical.title
      - name: assessment_id
        data_type: int64
        description: >-
          `canonical_assessment_id` from `int_assessments__assessments_members`
          — the lowest member id within the canonical partition for internal
          assessments, the assessment's own id for external ones. Use
          `assessment_ids` for the underlying member ids.
      - name: administered_at
        data_type: date
        description: >-
          `administered_date` from `int_assessments__assessments_canonical`. For
          non-internal assessments, takes the member's own `administered_at` via
          `if(is_internal_assessment, ...)`.
      - name: grade_level_id
        data_type: int64
        description: >-
          `grade_level_id` from `int_assessments__assessments_canonical` for
          internal assessments; the scaffold's `grade_level_id` (null) for
          external ones.
      - name: performance_band_set_id
        data_type: int64
        description: >-
          `canonical_performance_band_set_id` from
          `int_assessments__performance_bands` for the row's response. Null when
          the scaffold row has no responses.
      - name: performance_band_label
        data_type: string
        description: >-
          Label of the band in `int_illuminate__performance_band_sets` whose
          range contains `percent_correct` for `performance_band_set_id`.
      - name: performance_band_label_number
        data_type: numeric
        description: Ordinal number of the matched performance band.
      - name: is_mastery
        data_type: boolean
        description: Mastery flag of the matched performance band.
      - name: term_administered
        data_type: string
        description: >-
          Name of the `RT` reporting term in
          `stg_google_sheets__reporting__terms` for `powerschool_school_id`
          whose date range contains `administered_at`.
      - name: term_taken
        data_type: string
        description: >-
          Name of the `RT` reporting term for `powerschool_school_id` whose date
          range contains `date_taken`.
      - name: n_assessments
        data_type: int64
        description: >-
          Count of distinct member `assessment_id`s from the scaffold that
          rolled up into this canonical row. `1` for external rows; `>1` for
          internal multipart canonical groups (e.g., FTELA U2 CRA + CRA-Essay).
      - name: is_multipart_assessment
        data_type: boolean
        description: >-
          `true` when `n_assessments > 1` — more than one member assessment
          sharing a `canonical_assessment_id` rolled up here. Always false for
          external rows.
      - name: assessment_ids
        data_type: array<int64>
        description: >-
          Array of distinct member `assessment_id`s rolled up into this
          canonical row. Use to drill from the canonical to per-member rows.
