models:
  - name: int_assessments__course_enrollments
    description: >-
      Enrollment scaffold that internal Illuminate assessments are joined
      against, network-wide (Miami included). Unions two branches. The K-12
      branch takes non-dropped course enrollments from
      `base_powerschool__course_enrollments` and INNER JOINs the student's
      year-primary enrollment (`rn_year = 1`) on `student_number`, academic
      year, and `_dbt_source_project` for region and grade level; the join is
      not keyed on school, so a course at a school other than the enrollment
      school is kept. The ES Writing branch synthesizes a `RHET` / `Writing`
      enrollment for every Newark and Camden student enrollment stint at grade 4
      and below. The union is deduplicated to one row per
      (`_dbt_source_project`, student, Illuminate academic year, subject area,
      date enrolled), keeping the latest `cc_dateleft`.
    config:
      materialized: table
      meta:
        dagster:
          # Cron instead of the default eager table condition, which
          # re-fires on ANY upstream data change, recursing through view
          # chains up to 10 levels.
          # ~98 executions/day on the eager table condition. Every downstream
          # consumer is either the assessment star (dim_assessments,
          # fct_assessment_scores_*, the expectation bridges) already on
          # `0 0,10,13,15,17 * * *`, or a topline weekly on `0 0 * * *` — which
          # the 00:00 tick covers. The deanslist mod extracts run `25 1 * * *`,
          # after the 00:00 tick.
          #
          # Refs #4821
          automation_condition:
            cron_schedule: 0 0,10,13,15,17 * * *
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - _dbt_source_project
              - powerschool_student_number
              - illuminate_academic_year
              - illuminate_subject_area
              - cc_dateenrolled
    columns:
      - name: powerschool_student_number
        data_type: int64
        description: >-
          Student number (`students_student_number` on the K-12 branch,
          `student_number` on the ES Writing branch). Carries Focus students for
          Miami despite the name.
      - name: courses_credittype
        data_type: string
        description: >-
          Course credit type. Constant `RHET` on the ES Writing branch.
      - name: powerschool_school_id
        data_type: int64
        description: >-
          Course section school (`cc_schoolid`) on the K-12 branch; the
          enrollment stint's `schoolid` on the ES Writing branch.
      - name: cc_dateenrolled
        data_type: date
        description: >-
          Course enrollment start date. The enrollment stint's `entrydate` on
          the ES Writing branch.
      - name: cc_dateleft
        data_type: date
        description: >-
          Course enrollment end date. The enrollment stint's `exitdate` on the
          ES Writing branch. The latest value wins the dedup.
      - name: illuminate_subject_area
        data_type: string
        description: >-
          Illuminate subject area mapped to the course. Constant `Writing` on
          the ES Writing branch.
      - name: discipline
        data_type: string
        description: >-
          Course discipline. Constant `ELA` on the ES Writing branch.
      - name: is_foundations
        data_type: boolean
        description: >-
          Foundations-course flag from the course enrollment. Always false on
          the ES Writing branch.
      - name: cc_dcid
        data_type: int64
        description: >-
          PowerSchool course enrollment row identifier. Null on the ES Writing
          branch. Used as an upstream component of
          dim_student_section_enrollments.student_section_enrollment_key.
        config:
          meta:
            source_column: base_powerschool__course_enrollments.cc_dcid
      - name: _dbt_source_project
        data_type: string
        description: >-
          Region prefix (e.g. kippnewark, kippcamden, kippmiami, kipppaterson)
          plumbed through from the upstream PowerSchool union models. Carried on
          both K-12 and ES Writing branches and used as the region discriminator
          in the trailing dedup partition and downstream surrogate keys
          (student_section_enrollment_key).
        config:
          meta:
            source_column: base_powerschool__course_enrollments._dbt_source_project
      - name: region
        data_type: string
        description: >-
          Region name from the student's enrollment in
          `base_powerschool__student_enrollments`.
      - name: illuminate_academic_year
        data_type: int64
        description: >-
          Academic year plus one, matching Illuminate's spring-year convention.
      - name: illuminate_grade_level_id
        data_type: int64
        description: >-
          Enrollment grade level plus one, matching Illuminate's 1-indexed grade
          level ids.
      - name: is_advanced_math_student
        data_type: boolean
        description: >-
          True when the student has any non-dropped advanced math course
          enrollment in the same region, academic year, and credit type. Always
          false on the ES Writing branch.
