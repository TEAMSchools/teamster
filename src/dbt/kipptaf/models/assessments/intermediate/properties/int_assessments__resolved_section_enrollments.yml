models:
  - name: int_assessments__resolved_section_enrollments
    description: >-
      Resolves one course-section enrollment per score grain (one row per
      `score_grain_key` of int_assessments__score_anchors) for all assessment
      types — internal (Illuminate-sourced), NJ state (Pearson), FL state
      (FLDOE), and vendor assessments (iReady, STAR, DIBELS). Joins the
      course-enrollment inventory from int_assessments__course_enrollments
      directly, on student number and `_dbt_source_project`, and only to rows
      with a non-null `cc_dcid`, so synthesized ES Writing rows never resolve.
      Does not carry cc_dcid or score_grain_key as output columns. Resolution is
      tiered: tier 1 matches a subject section whose half-open enrollment window
      contains the score's anchor date (earliest date_taken across the
      canonical's members, falling back to the canonical administered_date for
      internal; test_date for state rows; the vendor completion/screening/
      client date for iReady, STAR, and DIBELS); tier 2, for NJ and FL state
      scores only, matches a section in the score's discipline (ELA, Math,
      Science, or Social Studies for Civics) active on the anchor date, which
      catches high school sections whose course-level subject area (English 100,
      Algebra II, Biology) never equals the state score's subject; tier 3 falls
      back to the homeroom section active on the same anchor date. When several
      candidates match — including across a grain's multiple anchor dates — the
      lowest tier wins, then the latest `cc_dateleft`, then the highest
      `cc_dcid`. Scores with no matching section in any tier are dropped. The
      resolution_type column identifies whether a subject section or the
      homeroom resolved the row. Also carries the resolved section's school and
      region so consumers can resolve a score's reporting quarter by date. The
      score rows themselves come from int_assessments__score_anchors, which
      carries each score's anchor date and score_grain_key.
    config:
      materialized: table
      meta:
        contains_pii: true
        dagster:
          # Cron instead of the default eager table condition, which
          # re-fires on ANY upstream data change, recursing through view
          # chains up to 10 levels. Its ONLY consumer is
          # fct_assessment_scores_enrollment_scoped. Sharing its tick lets the
          # deps-in-progress guard serialize the pass instead of rebuilding per
          # upstream change.
          #
          # Refs #4821
          automation_condition:
            cron_schedule: 30 0,10,13,15,17 * * *
    columns:
      - name: source_type
        data_type: string
        description: >-
          Assessment source branch that produced the score row. One of internal
          (Illuminate-sourced), state_nj (Pearson NJ), state_fl (FLDOE FL),
          iready (i-Ready diagnostics), star (Renaissance STAR), or dibels
          (Amplify DIBELS benchmark composites).
      - name: resolution_type
        data_type: string
        description: >-
          Kind of section that resolved the row. subject_section means tier 1 or
          tier 2 resolved it (a section for the score's subject, matched on
          subject area or, for state scores, on discipline, whose enrollment
          window contained the anchor date); homeroom means tier 3 resolved it
          (no subject section matched; the homeroom section active on the anchor
          date was used instead).
      - name: powerschool_student_number
        data_type: int64
        description: >-
          Student number, carried from int_assessments__score_anchors.
        config:
          meta:
            source_column: int_assessments__scaffold.powerschool_student_number
      - name: canonical_assessment_id
        data_type: int64
        description: >-
          Canonical assessment identifier grouping member assessments into one
          logical assessment. Populated only for internal scores; NULL for state
          and vendor rows.
        config:
          meta:
            source_column: int_assessments__scaffold.canonical_assessment_id
      - name: academic_year
        data_type: int64
        description: >-
          Academic year of the assessment sitting. Populated for state and
          vendor rows; NULL for internal rows, which derive their year from the
          enrollment window.
        config:
          meta:
            source_column: int_assessments__state_nj_scores.academic_year
      - name: administration_period
        data_type: string
        description: >-
          Administration window label within the academic year. Populated for
          state, iReady, STAR, and DIBELS score rows; NULL for internal score
          rows. For iReady rows this is the reporting-terms window (BOY / MOY /
          EOY / Outside Round) from `test_round`.
        config:
          meta:
            source_column: int_assessments__state_nj_scores.administration_period
      - name: subject_area
        data_type: string
        description: >-
          Subject area of the assessment, aligned to illuminate_subject_area
          values in int_assessments__course_enrollments, and the tier 1 join
          key. Carried through from int_assessments__score_anchors; see that
          model for how state and vendor subjects are resolved.
        config:
          meta:
            source_column: int_assessments__scaffold.subject_area
      - name: _dbt_source_project
        data_type: string
        description: >-
          Region identifier (kippnewark, kippcamden, kippmiami, kipppaterson) of
          the score. Used as a discriminator alongside
          powerschool_student_number when joining the course-enrollment
          inventory and when deriving student_section_enrollment_key.
        config:
          meta:
            source_column: int_assessments__scaffold._dbt_source_project
      - name: cc_source_project
        data_type: string
        description: >-
          Region identifier of the matched course enrollment row. Combined with
          cc_dcid in generate_surrogate_key to produce
          student_section_enrollment_key.
        config:
          meta:
            source_column: int_assessments__course_enrollments._dbt_source_project
      - name: student_section_enrollment_key
        data_type: string
        description: >-
          Surrogate key derived from (cc_dcid, cc_source_project) of the
          resolved course enrollment, matching
          dim_student_section_enrollments.student_section_enrollment_key.
      - name: powerschool_school_id
        data_type: int64
        description: >-
          School of the resolved section enrollment. Carried so consumers can
          resolve a score's reporting quarter for the right school; this model
          is one row per score grain, so it cannot resolve the quarter itself —
          scores sharing a grain can carry different dates.
        config:
          meta:
            source_column: int_assessments__course_enrollments.powerschool_school_id
      - name: region
        data_type: string
        description: >-
          Short region name (Newark, Camden, Miami, Paterson) of the resolved
          section enrollment. Pairs with powerschool_school_id when matching the
          reporting-terms sheet, which keys quarters by school and region.
        config:
          meta:
            source_column: int_assessments__course_enrollments.region

unit_tests:
  - name: test_subject_section_in_window_wins
    description: >-
      Subject section whose enrollment window contains the anchor date resolves
      at tier 1 (resolution_type=subject_section). The second section for the
      same student starts after the anchor date and is filtered out by the
      half-open window join.
    model: int_assessments__resolved_section_enrollments
    given:
      - input: ref('int_assessments__score_anchors')
        format: sql
        rows: |
          select
              1 as powerschool_student_number,
              100 as canonical_assessment_id,
              cast(null as int64) as academic_year,
              cast(null as string) as administration_period,
              'Mathematics' as subject_area,
              'kippnewark' as _dbt_source_project,
              date('2024-03-04') as anchor_date,
              'internal' as source_type,
              'k1' as score_grain_key
      - input: ref('int_assessments__course_enrollments')
        rows:
          - {
              powerschool_student_number: 1,
              _dbt_source_project: kippnewark,
              illuminate_subject_area: Mathematics,
              courses_credittype: MATH,
              cc_dateenrolled: 2024-01-01,
              cc_dateleft: 2025-06-15,
              cc_dcid: 111,
              powerschool_school_id: 73252,
              region: Newark,
            }
          - {
              powerschool_student_number: 1,
              _dbt_source_project: kippnewark,
              illuminate_subject_area: Mathematics,
              courses_credittype: MATH,
              cc_dateenrolled: 2025-09-01,
              cc_dateleft: 2026-06-15,
              cc_dcid: 222,
              powerschool_school_id: 73252,
              region: Newark,
            }
    expect:
      rows:
        - {
            powerschool_student_number: 1,
            canonical_assessment_id: 100,
            resolution_type: subject_section,
            cc_source_project: kippnewark,
          }

  - name: test_homeroom_fallback_when_no_subject_section
    description: >-
      When no subject section's enrollment window contains the anchor date the
      homeroom section active on that date is used and resolution_type is
      homeroom.
    model: int_assessments__resolved_section_enrollments
    given:
      - input: ref('int_assessments__score_anchors')
        format: sql
        rows: |
          select
              2 as powerschool_student_number,
              200 as canonical_assessment_id,
              cast(null as int64) as academic_year,
              cast(null as string) as administration_period,
              'ELA' as subject_area,
              'kippcamden' as _dbt_source_project,
              date('2024-11-01') as anchor_date,
              'internal' as source_type,
              'k2' as score_grain_key
      - input: ref('int_assessments__course_enrollments')
        rows:
          - {
              powerschool_student_number: 2,
              _dbt_source_project: kippcamden,
              illuminate_subject_area: HR,
              courses_credittype: HR,
              cc_dateenrolled: 2024-09-01,
              cc_dateleft: 2025-06-15,
              cc_dcid: 333,
              powerschool_school_id: 179902,
              region: Camden,
            }
    expect:
      rows:
        - {
            powerschool_student_number: 2,
            canonical_assessment_id: 200,
            resolution_type: homeroom,
          }

  - name: test_no_matching_section_drops_row
    description: >-
      A score with no matching subject section and no matching homeroom section
      produces no output row.
    model: int_assessments__resolved_section_enrollments
    given:
      - input: ref('int_assessments__score_anchors')
        format: sql
        rows: |
          select
              3 as powerschool_student_number,
              300 as canonical_assessment_id,
              cast(null as int64) as academic_year,
              cast(null as string) as administration_period,
              'Science' as subject_area,
              'kippmiami' as _dbt_source_project,
              date('2024-10-01') as anchor_date,
              'internal' as source_type,
              'k3' as score_grain_key
      - input: ref('int_assessments__course_enrollments')
        rows: []
    expect:
      rows: []

  - name: test_state_nj_resolves_subject_section
    description: >-
      A NJ state score resolves to a subject section active on its test_date and
      source_type is state_nj.
    model: int_assessments__resolved_section_enrollments
    given:
      - input: ref('int_assessments__score_anchors')
        format: sql
        rows: |
          select
              4 as powerschool_student_number,
              cast(null as int64) as canonical_assessment_id,
              2024 as academic_year,
              'Spring' as administration_period,
              'Mathematics' as subject_area,
              'kippnewark' as _dbt_source_project,
              date('2025-04-10') as anchor_date,
              'state_nj' as source_type,
              'k4' as score_grain_key
      - input: ref('int_assessments__course_enrollments')
        rows:
          - {
              powerschool_student_number: 4,
              _dbt_source_project: kippnewark,
              illuminate_subject_area: Mathematics,
              courses_credittype: MATH,
              cc_dateenrolled: 2024-09-01,
              cc_dateleft: 2025-06-15,
              cc_dcid: 444,
              powerschool_school_id: 73252,
              region: Newark,
            }
    expect:
      rows:
        - {
            powerschool_student_number: 4,
            academic_year: 2024,
            administration_period: Spring,
            subject_area: Mathematics,
            source_type: state_nj,
            resolution_type: subject_section,
          }

  - name: test_iready_dibels_source_type_prevents_grain_collision
    description: >-
      An iReady Reading score and a DIBELS Composite score for the same
      student/project/academic year/administration_period/subject_area (Text
      Study) carry distinct score_grain_key values because source_type is a key
      input. Both must resolve to the subject section and survive as distinct
      output rows -- the resolved-tier dedupe partitions on score_grain_key, so
      a shared key would silently collapse them into one.
    model: int_assessments__resolved_section_enrollments
    given:
      - input: ref('int_assessments__score_anchors')
        format: sql
        rows: |
          select
              5 as powerschool_student_number,
              cast(null as int64) as canonical_assessment_id,
              2024 as academic_year,
              'BOY' as administration_period,
              'Text Study' as subject_area,
              'kippnewark' as _dbt_source_project,
              date('2024-09-15') as anchor_date,
              'iready' as source_type,
              'k5-iready' as score_grain_key
          union all
          select
              5 as powerschool_student_number,
              cast(null as int64) as canonical_assessment_id,
              2024 as academic_year,
              'BOY' as administration_period,
              'Text Study' as subject_area,
              'kippnewark' as _dbt_source_project,
              date('2024-09-20') as anchor_date,
              'dibels' as source_type,
              'k5-dibels' as score_grain_key
      - input: ref('int_assessments__course_enrollments')
        rows:
          - {
              powerschool_student_number: 5,
              _dbt_source_project: kippnewark,
              illuminate_subject_area: Text Study,
              courses_credittype: ELA,
              cc_dateenrolled: 2024-09-01,
              cc_dateleft: 2025-06-15,
              cc_dcid: 555,
              powerschool_school_id: 73252,
              region: Newark,
            }
    expect:
      rows:
        - {
            powerschool_student_number: 5,
            source_type: iready,
            student_section_enrollment_key: 862d5edd93004a2ab12782487a3292a7,
          }
        - {
            powerschool_student_number: 5,
            source_type: dibels,
            student_section_enrollment_key: 862d5edd93004a2ab12782487a3292a7,
          }

  - name: test_state_score_resolves_course_level_section_by_discipline
    description: >-
      A state score whose subject_area matches no section's
      illuminate_subject_area resolves to the section in the same discipline.
      Covers a NJ high school ELA score against an English 100 section and a FL
      Civics score against a US History section. Both resolve as
      subject_section.
    model: int_assessments__resolved_section_enrollments
    given:
      - input: ref('int_assessments__score_anchors')
        format: sql
        rows: |
          select
              7 as powerschool_student_number,
              cast(null as int64) as canonical_assessment_id,
              2025 as academic_year,
              'Spring' as administration_period,
              'Text Study' as subject_area,
              'kippnewark' as _dbt_source_project,
              date('2026-04-14') as anchor_date,
              'state_nj' as source_type,
              'k7' as score_grain_key
          union all
          select
              9 as powerschool_student_number,
              cast(null as int64) as canonical_assessment_id,
              2025 as academic_year,
              'Spring' as administration_period,
              'Civics' as subject_area,
              'kippmiami' as _dbt_source_project,
              date('2026-05-04') as anchor_date,
              'state_fl' as source_type,
              'k9' as score_grain_key
      - input: ref('int_assessments__course_enrollments')
        rows:
          - {
              powerschool_student_number: 7,
              _dbt_source_project: kippnewark,
              illuminate_subject_area: English 100,
              discipline: ELA,
              courses_credittype: ENG,
              cc_dateenrolled: 2025-09-02,
              cc_dateleft: 2026-06-19,
              cc_dcid: 701,
              powerschool_school_id: 73253,
              region: Newark,
            }
          - {
              powerschool_student_number: 9,
              _dbt_source_project: kippmiami,
              illuminate_subject_area: US History,
              discipline: Social Studies,
              courses_credittype: SOC,
              cc_dateenrolled: 2025-08-11,
              cc_dateleft: 2026-06-04,
              cc_dcid: 901,
              powerschool_school_id: 30200804,
              region: Miami,
            }
    expect:
      rows:
        - {
            powerschool_student_number: 7,
            source_type: state_nj,
            resolution_type: subject_section,
            student_section_enrollment_key: e79e1c231c32598d915358218e146d27,
          }
        - {
            powerschool_student_number: 9,
            source_type: state_fl,
            resolution_type: subject_section,
            student_section_enrollment_key: a88dfa2c0671a2db1e3bc471f46aef56,
          }

  - name: test_state_score_prefers_discipline_section_over_homeroom
    description: >-
      A state score with both a same-discipline section and a homeroom section
      active on its anchor date resolves to the discipline section, not the
      homeroom.
    model: int_assessments__resolved_section_enrollments
    given:
      - input: ref('int_assessments__score_anchors')
        format: sql
        rows: |
          select
              8 as powerschool_student_number,
              cast(null as int64) as canonical_assessment_id,
              2025 as academic_year,
              'Spring' as administration_period,
              'Mathematics' as subject_area,
              'kippnewark' as _dbt_source_project,
              date('2026-04-15') as anchor_date,
              'state_nj' as source_type,
              'k8' as score_grain_key
      - input: ref('int_assessments__course_enrollments')
        rows:
          - {
              powerschool_student_number: 8,
              _dbt_source_project: kippnewark,
              illuminate_subject_area: Algebra I,
              discipline: Math,
              courses_credittype: MATH,
              cc_dateenrolled: 2025-09-02,
              cc_dateleft: 2026-06-19,
              cc_dcid: 701,
              powerschool_school_id: 73253,
              region: Newark,
            }
          - {
              powerschool_student_number: 8,
              _dbt_source_project: kippnewark,
              illuminate_subject_area: null,
              discipline: null,
              courses_credittype: HR,
              cc_dateenrolled: 2025-09-02,
              cc_dateleft: 2026-06-19,
              cc_dcid: 702,
              powerschool_school_id: 73253,
              region: Newark,
            }
    expect:
      rows:
        - {
            powerschool_student_number: 8,
            resolution_type: subject_section,
            student_section_enrollment_key: e79e1c231c32598d915358218e146d27,
          }

  - name: test_state_score_with_unmapped_subject_falls_back_to_homeroom
    description: >-
      A state score whose subject_area has no discipline mapping gets a null
      discipline, so it skips the discipline tier and resolves to the homeroom
      even when a section in some discipline is active on its anchor date.
    model: int_assessments__resolved_section_enrollments
    given:
      - input: ref('int_assessments__score_anchors')
        format: sql
        rows: |
          select
              8 as powerschool_student_number,
              cast(null as int64) as canonical_assessment_id,
              2025 as academic_year,
              'Spring' as administration_period,
              'Health' as subject_area,
              'kippnewark' as _dbt_source_project,
              date('2026-04-15') as anchor_date,
              'state_nj' as source_type,
              'k8-unmapped' as score_grain_key
      - input: ref('int_assessments__course_enrollments')
        rows:
          - {
              powerschool_student_number: 8,
              _dbt_source_project: kippnewark,
              illuminate_subject_area: Algebra I,
              discipline: Math,
              courses_credittype: MATH,
              cc_dateenrolled: 2025-09-02,
              cc_dateleft: 2026-06-19,
              cc_dcid: 701,
              powerschool_school_id: 73253,
              region: Newark,
            }
          - {
              powerschool_student_number: 8,
              _dbt_source_project: kippnewark,
              illuminate_subject_area: null,
              discipline: null,
              courses_credittype: HR,
              cc_dateenrolled: 2025-09-02,
              cc_dateleft: 2026-06-19,
              cc_dcid: 702,
              powerschool_school_id: 73253,
              region: Newark,
            }
    expect:
      rows:
        - {
            powerschool_student_number: 8,
            resolution_type: homeroom,
            student_section_enrollment_key: 4273d009759f72c159d95d262f431287,
          }

  - name: test_vendor_score_skips_discipline_match
    description: >-
      The discipline match applies to state scores only. A vendor score with a
      same-discipline section and a homeroom section still falls back to the
      homeroom.
    model: int_assessments__resolved_section_enrollments
    given:
      - input: ref('int_assessments__score_anchors')
        format: sql
        rows: |
          select
              8 as powerschool_student_number,
              cast(null as int64) as canonical_assessment_id,
              2025 as academic_year,
              'MOY' as administration_period,
              'Mathematics' as subject_area,
              'kippnewark' as _dbt_source_project,
              date('2026-01-20') as anchor_date,
              'iready' as source_type,
              'k8-iready' as score_grain_key
      - input: ref('int_assessments__course_enrollments')
        rows:
          - {
              powerschool_student_number: 8,
              _dbt_source_project: kippnewark,
              illuminate_subject_area: Algebra I,
              discipline: Math,
              courses_credittype: MATH,
              cc_dateenrolled: 2025-09-02,
              cc_dateleft: 2026-06-19,
              cc_dcid: 701,
              powerschool_school_id: 73253,
              region: Newark,
            }
          - {
              powerschool_student_number: 8,
              _dbt_source_project: kippnewark,
              illuminate_subject_area: null,
              discipline: null,
              courses_credittype: HR,
              cc_dateenrolled: 2025-09-02,
              cc_dateleft: 2026-06-19,
              cc_dcid: 702,
              powerschool_school_id: 73253,
              region: Newark,
            }
    expect:
      rows:
        - {
            powerschool_student_number: 8,
            resolution_type: homeroom,
            student_section_enrollment_key: 4273d009759f72c159d95d262f431287,
          }
