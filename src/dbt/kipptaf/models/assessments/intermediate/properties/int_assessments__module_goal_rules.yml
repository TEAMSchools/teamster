models:
  - name: int_assessments__module_goal_rules
    description: >-
      DDI goal rules from the Module Goal Rules sheet, expanded to the
      Illuminate subject areas of each rule's discipline. A rule with a
      discipline gets 1 row per subject area that the course subject crosswalk
      maps to that discipline; a rule with a blank discipline keeps 1 row with a
      null subject area, meaning it applies to every subject.
      `rpt_tableau__ddi_dashboard` joins it on region, module type, subject area
      (or the null-subject row) and grade range. Malformed rules are dropped on
      purpose, so the DDI rows they would match keep the raw goal: a rule with
      both or neither of a goal and an offset, a goal outside 0 to 1 or an
      offset of 1 or more, a Grade Min above its Grade Max, a rule that overlaps
      another well-formed rule (both are dropped), and a rule whose discipline
      the crosswalk does not list. A subject the crosswalk maps to more than one
      discipline matches no rule. The staging model's warn tests list the bad
      rule rows for the sheet owner to fix.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - region
              - module_type
              - illuminate_subject_area
              - grade_min
          config:
            severity: error
    columns:
      - name: region
        data_type: string
        description: Region the rule applies to, from the rules sheet.
      - name: module_type
        data_type: string
        description: Assessment module type the rule applies to.
      - name: illuminate_subject_area
        data_type: string
        description: >-
          Illuminate subject area the rule applies to, from the course subject
          crosswalk subjects in the rule's discipline. Null when the rule has no
          discipline and applies to every subject.
      - name: grade_min
        data_type: int64
        description: Lowest grade level the rule applies to (0 is kindergarten).
      - name: grade_max
        data_type: int64
        description: Highest grade level the rule applies to, inclusive.
      - name: goal
        data_type: float64
        description: >-
          Fixed goal that replaces the lookup goal; null when the rule is an
          offset.
      - name: goal_offset
        data_type: float64
        description: >-
          Amount added to the lookup goal; null when the rule sets a fixed goal.

unit_tests:
  - name: unit_int_assessments__module_goal_rules_expands_by_discipline
    description: >-
      A rule with a discipline expands to each crosswalk subject area in that
      discipline, once even when several courses share the subject. A rule with
      no discipline keeps a single null-subject row. Subjects with no
      discipline, crosswalk rows with no subject, and disciplines with no rule
      produce nothing.
    model: int_assessments__module_goal_rules
    given:
      - input: ref("stg_google_sheets__assessments__module_goal_rules")
        format: sql
        rows: |
          select
              'Newark' as region,
              'ET' as module_type,
              'ELA' as discipline,
              0 as grade_min,
              8 as grade_max,
              0.8 as goal,
              cast(null as float64) as goal_offset
          union all
          select 'Newark', 'ET', cast(null as string), 10, 12, 0.8, cast(null as float64)
          union all
          select 'Newark', 'TP', 'Math', 3, 12, cast(null as float64), 0.1
      - input: ref("stg_google_sheets__assessments__course_subject_crosswalk")
        format: sql
        rows: |
          select 'Text Study' as Illuminate_Subject_Area, 'ELA' as Discipline
          union all
          select 'English 100', 'ELA'
          union all
          select 'English 100', 'ELA'
          union all
          select 'Mathematics', 'Math'
          union all
          select 'Algebra I', 'Math'
          union all
          select 'Dance', cast(null as string)
          union all
          select cast(null as string), 'ELA'
    expect:
      rows:
        - region: Newark
          module_type: ET
          illuminate_subject_area: Text Study
          grade_min: 0
          grade_max: 8
          goal: 0.8
          goal_offset: null
        - region: Newark
          module_type: ET
          illuminate_subject_area: English 100
          grade_min: 0
          grade_max: 8
          goal: 0.8
          goal_offset: null
        - region: Newark
          module_type: ET
          illuminate_subject_area: null
          grade_min: 10
          grade_max: 12
          goal: 0.8
          goal_offset: null
        - region: Newark
          module_type: TP
          illuminate_subject_area: Mathematics
          grade_min: 3
          grade_max: 12
          goal: null
          goal_offset: 0.1
        - region: Newark
          module_type: TP
          illuminate_subject_area: Algebra I
          grade_min: 3
          grade_max: 12
          goal: null
          goal_offset: 0.1

  - name: unit_int_assessments__module_goal_rules_drops_bad_rules
    description: >-
      Rules with both or neither of a goal and an offset, a goal outside 0 to 1,
      an offset of 1 or more, an inverted grade range, an overlap with another
      well-formed rule, or an exact duplicate are dropped. A malformed rule does
      not knock out a well-formed rule it overlaps. A subject the crosswalk maps
      to 2 disciplines matches no rule.
    model: int_assessments__module_goal_rules
    given:
      - input: ref("stg_google_sheets__assessments__module_goal_rules")
        format: sql
        rows: |
          select
              'Newark' as region,
              'ET' as module_type,
              'ELA' as discipline,
              0 as grade_min,
              8 as grade_max,
              0.8 as goal,
              cast(null as float64) as goal_offset
          union all
          select 'Newark', 'TP', 'Math', 3, 12, 0.8, 0.1
          union all
          select 'Newark', 'TP', 'Science', 3, 12, cast(null as float64), cast(null as float64)
          union all
          select 'Camden', 'TP', 'ELA', 12, 3, cast(null as float64), 0.1
          union all
          select 'Camden', 'CRQ', 'Math', 1, 8, cast(null as float64), 0.1
          union all
          select 'Camden', 'CRQ', cast(null as string), 5, 9, cast(null as float64), 0.1
          union all
          select 'Paterson', 'ET', 'ELA', 0, 8, 0.8, cast(null as float64)
          union all
          select 'Paterson', 'ET', 'ELA', 0, 8, 0.8, cast(null as float64)
          union all
          select 'Paterson', 'TP', 'Math', 3, 12, cast(null as float64), 0.1
          union all
          select 'Paterson', 'TP', 'Math', 5, 6, 0.8, 0.1
          union all
          select 'Newark', 'MQQ', 'ELA', 0, 8, 80.0, cast(null as float64)
          union all
          select 'Newark', 'UA', 'Math', 0, 8, cast(null as float64), 1.5
      - input: ref("stg_google_sheets__assessments__course_subject_crosswalk")
        format: sql
        rows: |
          select 'Text Study' as Illuminate_Subject_Area, 'ELA' as Discipline
          union all
          select 'Mathematics', 'Math'
          union all
          select 'Biology', 'Science'
          union all
          select 'Integrated Studies', 'ELA'
          union all
          select 'Integrated Studies', 'Math'
    expect:
      rows:
        - region: Newark
          module_type: ET
          illuminate_subject_area: Text Study
          grade_min: 0
          grade_max: 8
          goal: 0.8
          goal_offset: null
        - region: Paterson
          module_type: TP
          illuminate_subject_area: Mathematics
          grade_min: 3
          grade_max: 12
          goal: null
          goal_offset: 0.1
