models:
  - name: int_assessments__performance_band_union
    description: >-
      Every band of every Illuminate and Focus Assessments band set that scores
      an internal assessment, one row per band, with the set's cut points and
      mastery band, and each band's level relative to that mastery band.
      Illuminate and Focus number their band sets separately, so a set is
      identified by source and band set id together. Band sets that score no
      internal assessment are left out.
    config:
      materialized: table
      meta:
        dagster:
          # The assessment star's tick; dim_performance_bands and the scores
          # fact read this model. Refs #4559, #4821
          automation_condition:
            cron_schedule: 30 0,10,13,15,17 * * *
    columns:
      - name: performance_band_key
        data_type: string
        description: >-
          Surrogate key of the band, hashed from source, band set id and band
          number. Primary key; the scores fact hashes the same 3 values.
        data_tests:
          - unique:
              config:
                severity: error

      # The level rule's guard. Severity warn by design: an error here would
      # skip the scores fact and stop every assessment dashboard refreshing.
      - name: is_level_rule_valid
        data_type: boolean
        description: >-
          True when the band set meets the 3 assumptions the level rule needs:
          every band from the set's mastery band up is a mastery band and no
          band below it is; band numbers run 1 to N in cut-point order; and
          mastery starts at band 3 or later, so Approaching and Far Below never
          fall on 1 band. False flags a band set to fix in Illuminate or Focus
          band-set setup, or a rule to decide; until then its scores load with
          no level.
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: [true]
                quote: false
              config:
                severity: warn

      - name: source
        data_type: string
        description: Source system of the band set, illuminate or apex.
      - name: performance_band_set_id
        data_type: int64
        description: >-
          The source system's own band set id; unique only together with source.
      - name: performance_band_set
        data_type: string
        description: Name of the band set the band belongs to.
      - name: band_label
        data_type: string
        description: >-
          The band's label as the source spells it. A set can repeat a label, so
          band_number, not the label, identifies a band.
      - name: band_number
        data_type: int64
        description: Position of the band in its set, 1 = lowest.
      - name: band_count
        data_type: int64
        description: Number of bands in the set.
      - name: minimum_score
        data_type: numeric
        description: Lowest percent correct in the band.
      - name: maximum_score
        data_type: numeric
        description: >-
          The next band's minimum percent correct, which this band runs up to
          but does not include. Null for the top band.
      - name: is_mastery
        data_type: boolean
        description: The source's mastery flag for this band.
      - name: mastery_band_number
        data_type: int64
        description: The set's lowest mastery band.
      - name: mastery_minimum_score
        data_type: numeric
        description: >-
          The set's mastery cut: the lowest percent correct that counts as
          mastery.
      - name: mastery_level
        data_type: string
        description: >-
          The band's level relative to its set's mastery band. At/Above is the
          mastery band and every band above it; Approaching is the band directly
          below the mastery band; Below is every band under that. Null when the
          set fails the level rule's assumptions (is_level_rule_valid).
      - name: is_far_below
        data_type: boolean
        description: >-
          True for band 1 when band 1 is not a mastery band. Null when the set
          fails the level rule's assumptions (is_level_rule_valid).

unit_tests:
  - name: test_performance_band_union_levels
    description: >-
      Illuminate set 1 starts mastery at band 4 and set 2 at band 3; Focus set 1
      (same id as Illuminate set 1) has 8 bands, Level 3 at band 6, and repeats
      the label Low Level 1 on bands 1 and 4. Illuminate set 4 scores only a
      non-internal row, so it is left out. Illuminate set 5 starts mastery at
      band 2, fails the level rule, and gets no level.
    model: int_assessments__performance_band_union
    given:
      # sql format: the model reads only these 3 columns
      - input: ref('int_assessments__response_rollup')
        format: sql
        rows: |
          select 'illuminate' as source, 1 as performance_band_set_id, true as is_internal_assessment
          union all select 'illuminate', 2, true
          union all select 'apex', 1, true
          union all select 'illuminate', 4, false
          union all select 'illuminate', 5, true
          union all select 'illuminate', null, true
      - input: ref('int_illuminate__performance_band_sets')
        rows:
          - {
              performance_band_set_id: 1,
              description: Set A,
              label: A1,
              label_number: 1,
              minimum_value: 0,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 1,
              description: Set A,
              label: A2,
              label_number: 2,
              minimum_value: 21,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 1,
              description: Set A,
              label: A3,
              label_number: 3,
              minimum_value: 41,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 1,
              description: Set A,
              label: A4,
              label_number: 4,
              minimum_value: 61,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 1,
              description: Set A,
              label: A5,
              label_number: 5,
              minimum_value: 81,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 2,
              description: Set B,
              label: B1,
              label_number: 1,
              minimum_value: 0,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 2,
              description: Set B,
              label: B2,
              label_number: 2,
              minimum_value: 40,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 2,
              description: Set B,
              label: B3,
              label_number: 3,
              minimum_value: 60,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 2,
              description: Set B,
              label: B4,
              label_number: 4,
              minimum_value: 75,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 2,
              description: Set B,
              label: B5,
              label_number: 5,
              minimum_value: 88,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 4,
              description: Set D,
              label: D1,
              label_number: 1,
              minimum_value: 0,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 5,
              description: Set E,
              label: E1,
              label_number: 1,
              minimum_value: 0,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 5,
              description: Set E,
              label: E2,
              label_number: 2,
              minimum_value: 50,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 5,
              description: Set E,
              label: E3,
              label_number: 3,
              minimum_value: 65,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 5,
              description: Set E,
              label: E4,
              label_number: 4,
              minimum_value: 80,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 5,
              description: Set E,
              label: E5,
              label_number: 5,
              minimum_value: 90,
              is_mastery: true,
            }
      - input: ref('int_focus__apex_band_levels')
        format: sql
        rows: |
          select 1 as band_set_id, 'Low Level 1' as label, cast(0 as numeric) as min_score, 'Set C' as band_set_name, cast(20 as numeric) as upper_bound, 1 as label_number, false as is_mastery, 'x' as _dbt_source_relation, 'kippmiami' as _dbt_source_project
          union all select 1, 'Mid Level 1', 20, 'Set C', 30, 2, false, 'x', 'kippmiami'
          union all select 1, 'High Level 1', 30, 'Set C', 40, 3, false, 'x', 'kippmiami'
          union all select 1, 'Low Level 1', 40, 'Set C', 50, 4, false, 'x', 'kippmiami'
          union all select 1, 'High Level 2', 50, 'Set C', 60, 5, false, 'x', 'kippmiami'
          union all select 1, 'Level 3', 60, 'Set C', 70, 6, true, 'x', 'kippmiami'
          union all select 1, 'Level 4', 70, 'Set C', 80, 7, true, 'x', 'kippmiami'
          union all select 1, 'Level 5', 80, 'Set C', 1000000, 8, true, 'x', 'kippmiami'
    expect:
      rows:
        - {
            source: illuminate,
            performance_band_set_id: 1,
            band_number: 1,
            band_count: 5,
            mastery_band_number: 4,
            maximum_score: 21,
            mastery_level: Below,
            is_far_below: true,
            is_level_rule_valid: true,
