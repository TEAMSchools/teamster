        - {
            source: illuminate,
            performance_band_set_id: 1,
            band_number: 2,
            band_count: 5,
            mastery_band_number: 4,
            maximum_score: 41,
            mastery_level: Below,
            is_far_below: false,
            is_level_rule_valid: true,
