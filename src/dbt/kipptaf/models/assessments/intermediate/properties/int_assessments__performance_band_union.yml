              label: E4,
              label_number: 4,
              minimum_value: 80,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 5,
              description: Set E,
              label: E5,
              label_number: 5,
              minimum_value: 90,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 6,
              description: Set F,
              label: F1,
              label_number: 1,
              minimum_value: 0,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 6,
              description: Set F,
              label: F2,
              label_number: 2,
              minimum_value: 20,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 6,
              description: Set F,
              label: F3,
              label_number: 3,
              minimum_value: 40,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 6,
              description: Set F,
              label: F4,
              label_number: 4,
              minimum_value: 60,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 6,
              description: Set F,
              label: F5,
              label_number: 5,
              minimum_value: 80,
              is_mastery: true,
            }
      - input: ref('int_focus__apex_band_levels')
        format: sql
        rows: |
          select 1 as band_set_id, 'Low Level 1' as label, cast(0 as numeric) as min_score, 'Set C' as band_set_name, cast(20 as numeric) as upper_bound, 1 as label_number, false as is_mastery, 'x' as _dbt_source_relation, 'kippmiami' as _dbt_source_project
          union all select 1, 'Mid Level 1', 20, 'Set C', 30, 2, false, 'x', 'kippmiami'
          union all select 1, 'High Level 1', 30, 'Set C', 40, 3, false, 'x', 'kippmiami'
          union all select 1, 'Low Level 1', 40, 'Set C', 50, 4, false, 'x', 'kippmiami'
          union all select 1, 'High Level 2', 50, 'Set C', 60, 5, false, 'x', 'kippmiami'
          union all select 1, 'Level 3', 60, 'Set C', 70, 6, true, 'x', 'kippmiami'
          union all select 1, 'Level 4', 70, 'Set C', 80, 7, true, 'x', 'kippmiami'
          union all select 1, 'Level 5', 80, 'Set C', 1000000, 8, true, 'x', 'kippmiami'
    expect:
