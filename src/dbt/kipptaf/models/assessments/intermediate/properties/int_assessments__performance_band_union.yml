              label_number: 1,
              minimum_value: 0,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 2,
              description: Set B,
              label: B2,
              label_number: 2,
              minimum_value: 40,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 2,
              description: Set B,
              label: B3,
              label_number: 3,
              minimum_value: 60,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 2,
              description: Set B,
              label: B4,
              label_number: 4,
              minimum_value: 75,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 2,
              description: Set B,
              label: B5,
              label_number: 5,
              minimum_value: 88,
              is_mastery: true,
            }
          - {
              performance_band_set_id: 4,
              description: Set D,
              label: D1,
              label_number: 1,
              minimum_value: 0,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 5,
              description: Set E,
              label: E1,
              label_number: 1,
              minimum_value: 0,
              is_mastery: false,
            }
          - {
              performance_band_set_id: 5,
              description: Set E,
              label: E2,
              label_number: 2,
              minimum_value: 50,
              is_mastery: true,
            }
          - {
