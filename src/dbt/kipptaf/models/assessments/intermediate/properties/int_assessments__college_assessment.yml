models:
  - name: int_assessments__college_assessment
    description: >-
      Official college-entrance scores, one row per student, score type, and
      sitting. SAT and ACT come from kippadb
      (int_kippadb__standardized_test_unpivot, dated rows only); PSAT comes from
      College Board files (int_collegeboard__psat_unpivot). Adds score-shape
      counts, strategy_case, best-score and superscore fields, and the change in
      total score from the previous sitting. test_type is the constant Official
      and scope holds the test.


      See docs/models/carat-dashboard-data-model.md.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - score_type
              - test_date
              - rn_highest
    columns:
      - name: student_number
        data_type: int64
      - name: administration_round
        data_type: string
      - name: academic_year
        data_type: int64
      - name: test_date
        data_type: date
      - name: scope
        data_type: string
      - name: subject_area
        data_type: string
      - name: course_discipline
        data_type: string
      - name: score_type
        data_type: string
      - name: scale_score
        data_type: numeric
      - name: rn_highest
        data_type: int64
      - name: salesforce_id
        data_type: string
      - name: is_overall_score
        data_type: int64
        description: 1 on a total row (Composite or Combined), else 0.
      - name: is_subject_score
        data_type: int64
        description: 1 on a section row, else 0.
      - name: n_overall_scores
        data_type: int64
        description: >-
          Number of total rows the student has for this test on this test date.
      - name: n_subject_scores
        data_type: int64
        description: >-
          Number of section rows the student has for this test on this test
          date.
      - name: aligned_subject_area
        data_type: string
        description: subject_area with Composite and Combined folded to Total.
      - name: strategy_case
        data_type: string
      - name: running_max_scale_score
        data_type: numeric
      - name: surrogate_key
        data_type: string
      - name: max_scale_score
        data_type: numeric
      - name: previous_total_score_change
        data_type: numeric
      - name: superscore
        data_type: numeric
      - name: avg_running_max_superscore
        data_type: numeric
      - name: sum_running_max_superscore
        data_type: numeric
      - name: test_type
        data_type: string
        description: Always Official.
      - name: aligned_subject
        data_type: string
        description: >-
          subject_area with the ACT Reading and SAT/PSAT EBRW score types folded
          to EBRW/Reading and Composite/Combined folded to Total.
      - name: test_month
        data_type: string
        description: Full month name of test_date.
      - name: runnning_superscore
        data_type: numeric
        description: >-
          Superscore as of this test date — the averaged section running maxes
          for ACT, the summed ones for SAT, null for PSAT.
