models:
  - name: int_assessments__ap_assessments
    description: >-
      AP exam scores, one row per student, academic year, and exam. Before 2018
      the scores come from kippadb (int_kippadb__standardized_test_unpivot);
      from 2018 on they come from College Board files
      (int_collegeboard__ap_unpivot). Rows with no PowerSchool student number
      are dropped, so a College Board score whose AP ID does not resolve in the
      crosswalk never reaches this model.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - powerschool_student_number
              - academic_year
              - test_subject
          config:
            severity: error
    columns:
      - name: academic_year
        data_type: int64
        description: Academic year of the exam, named by its starting year.
        config:
          meta:
            contains_pii: true
      - name: powerschool_student_number
        data_type: int64
        description:
          PowerSchool student number of the student who took the exam.
        config:
          meta:
            contains_pii: true
      - name: test_subject
        data_type: string
        description:
          Exam subject. kippadb subject for kippadb rows; College Board exam
          code description for College Board rows.
        config:
          meta:
            contains_pii: true
      - name: exam_score
        data_type: numeric
        description: AP exam score.
        config:
          meta:
            contains_pii: true
      - name: test_name
        data_type: string
        description:
          Exam name as the source names it, used to match the AP course
          crosswalk.
        config:
          meta:
            contains_pii: true
      - name: ps_ap_course_subject_code
        data_type: string
        description:
          PowerSchool AP course subject code from the AP course crosswalk.
      - name: ap_course_name
        data_type: string
        description: AP course name from the AP course crosswalk.
      - name: data_source
        data_type: string
        description:
          Where the score came from. ADB for kippadb, CB File for College Board.
      - name: irregularity_code_1
        data_type: string
        description:
          First College Board score irregularity code. Null for kippadb rows.
        config:
          meta:
            contains_pii: true
      - name: irregularity_code_2
        data_type: string
        description:
          Second College Board score irregularity code. Null for kippadb rows.
        config:
          meta:
            contains_pii: true
      - name: title
        data_type: string
        description: Display title, AP followed by test_subject.
        config:
          meta:
            contains_pii: true
      - name: rn_highest
        data_type: int64
        description:
          Rank of the student's scores for an AP course, highest score first; 1
          is the best score. Ties go to the later year. Exams with no AP course
          crosswalk match share a null ap_course_name and are ranked together.
        config:
          meta:
            contains_pii: true
