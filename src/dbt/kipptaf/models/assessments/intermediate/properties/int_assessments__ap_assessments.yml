models:
  - name: int_assessments__ap_assessments
    description: >-
      AP exam scores, one row per student, academic year, and exam. Before 2018
      the scores come from kippadb (int_kippadb__standardized_test_unpivot);
      from 2018 on they come from College Board files
      (int_collegeboard__ap_unpivot). Rows with no PowerSchool student number
      are dropped, so a College Board score whose AP ID does not resolve in the
      crosswalk never reaches this model.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - powerschool_student_number
              - academic_year
              - test_subject
          config:
            severity: error
    columns:
      - name: academic_year
        data_type: int64
        description: Academic year of the exam, named by its starting year.
        config:
          meta:
            contains_pii: true
      - name: powerschool_student_number
        data_type: int64
        description:
          PowerSchool student number of the student who took the exam.
        config:
          meta:
            contains_pii: true
      - name: test_subject
        data_type: string
        description:
          Exam subject. kippadb subject for kippadb rows; College Board exam
          code description for College Board rows.
        config:
          meta:
            contains_pii: true
      - name: exam_score
        data_type: numeric
        description: AP exam score.
        config:
          meta:
            contains_pii: true
      - name: test_name
        data_type: string
        description:
          Exam name as the source names it, used to match the AP course
          crosswalk.
        config:
          meta:
            contains_pii: true
      - name: ps_ap_course_subject_code
        data_type: string
        description:
          PowerSchool AP course subject code from the AP course crosswalk.
      - name: ap_course_name
        data_type: string
        description: AP course name from the AP course crosswalk.
      - name: data_source
        data_type: string
        description:
          Where the score came from. ADB for kippadb, CB File for College Board.
      - name: irregularity_code_1
        data_type: string
        description:
          First College Board score irregularity code. Null for kippadb rows.
        config:
          meta:
            contains_pii: true
      - name: irregularity_code_2
        data_type: string
        description:
          Second College Board score irregularity code. Null for kippadb rows.
        config:
          meta:
            contains_pii: true
      - name: title
        data_type: string
        description: Display title, AP followed by test_subject.
        config:
          meta:
            contains_pii: true
      - name: rn_highest
        data_type: int64
        description:
          Rank of the student's scores for an AP course, highest score first; 1
          is the best score. Ties go to the later year. Exams with no AP course
          crosswalk match share a null ap_course_name and are ranked together.
        config:
          meta:
            contains_pii: true

unit_tests:
  - name: int_assessments__ap_assessments_drops_unmatched_students
    description:
      An AP score with no PowerSchool student number, from either source, does
      not reach the model. A matched score from each source does.
    model: int_assessments__ap_assessments
    given:
      - input: ref("int_kippadb__standardized_test_unpivot")
        rows:
          - school_specific_id: 100001
            academic_year: 2016
            score_type: ap
            test_subject: Biology
            score: 4
          - school_specific_id: null
            academic_year: 2016
            score_type: ap
            test_subject: Chemistry
            score: 3
      - input: ref("int_collegeboard__ap_unpivot")
        rows:
          - powerschool_student_number: 100002
            academic_year: 2022
            exam_code_description: Calculus AB
            exam_grade: 5
          - powerschool_student_number: null
            academic_year: 2022
            exam_code_description: Calculus BC
            exam_grade: 2
    expect:
      rows:
        - powerschool_student_number: 100001
          academic_year: 2016
          test_subject: Biology
          data_source: ADB
        - powerschool_student_number: 100002
          academic_year: 2022
          test_subject: Calculus AB
          data_source: CB File
