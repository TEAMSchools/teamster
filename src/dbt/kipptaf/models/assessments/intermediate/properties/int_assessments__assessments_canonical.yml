models:
  - name: int_assessments__assessments_canonical
    description: >-
      One row per `source` and `canonical_assessment_id`, the regional group
      from `int_assessments__assessments_members.region_groups`. A group is the
      copies of one assessment that a region gives, which Illuminate limits can
      force to be several copies (the parts of a multi-part assessment). Group
      attributes (`title`, `administered_date`, grade, and the tag columns) come
      from the member whose `assessment_id` is the group id, the lowest id in
      the group. Internal assessments with a region tag only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source
              - canonical_assessment_id
    columns:
      - name: canonical_assessment_id
        data_tests:
          - not_null
        data_type: int64
        description: >-
          Key, together with `source`. The lowest `assessment_id` among the
          internal copies in the group; see `region_groups` on
          `int_assessments__assessments_members`.
      - name: source
        data_type: string
        description: >-
          System the assessment comes from (`illuminate` or `apex`). Part of the
          key.
      - name: regions_array
        data_type: array<string>
        description: >-
          Regions whose group this is, sorted. A group usually serves 1 region;
          it serves more when its copies are tagged for each of them. Consumers
          `cross join unnest(regions_array) as region` to fan out to one row per
          (group, region).
      - name: title
        data_type: string
        description: >-
          `title` from the canonical member (lowest `assessment_id` in the
          group).
      - name: administered_date
        data_type: date
        description: >-
          `administered_at` from the canonical member, renamed. Already DATE
          precision upstream — no cast applied.
      - name: grade_level_id
        data_type: int64
        description: >-
          `grade_level_id` from the canonical member.
      - name: grade_level
        data_type: int64
        description: >-
          `grade_level_id - 1` (upstream uses 1-indexed grade IDs).
      - name: subject_area
        data_type: string
        description: >-
          Constant within the canonical partition. Picked from the canonical
          member.
      - name: scope
        data_type: string
        description: >-
          Constant within the canonical partition. Picked from the canonical
          member.
      - name: module_code
        data_type: string
        description: >-
          Constant within the canonical partition. Picked from the canonical
          member.
      - name: academic_year
        data_type: int64
        description: >-
          Constant within the canonical partition. Picked from the canonical
          member.
      - name: academic_year_clean
        data_type: int64
        description: >-
          Constant within the canonical partition. Picked from the canonical
          member.
