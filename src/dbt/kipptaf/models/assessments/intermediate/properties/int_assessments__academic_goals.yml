models:
  - name: int_assessments__academic_goals
    description: >-
      Assessment goal targets from the academic goals Google Sheet, one row per
      sheet row. INNER JOINs `int_students__schools` on `school_id =
      school_number` to add the school level and region, so sheet rows whose
      `school_id` matches no school are dropped.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - school_id
              - grade_level
              - state_assessment_code
              - illuminate_subject_area
    columns:
      - name: academic_year
        data_type: int64
        description: Academic year of the goal, from the goals sheet.
      - name: school_id
        data_type: int64
        description: >-
          School number the goal applies to, from the goals sheet. Joins to
          `int_students__schools.school_number`.
      - name: grade_level
        data_type: int64
        description: >-
          Grade level the goal applies to, from the goals sheet (0 is
          kindergarten).
        config:
          meta:
            source_system: Google Sheets
            source_model: stg_google_sheets__assessments__academic_goals
            source_column: grade_level
      - name: state_assessment_code
        data_type: string
        description: State assessment code the goal applies to, from the sheet.
      - name: illuminate_subject_area
        data_type: string
        description:
          Illuminate subject area the goal applies to, from the sheet.
      - name: grade_goal
        data_type: float64
        description: Grade-level goal, from the sheet.
      - name: school_goal
        data_type: float64
        description: School-level goal, from the sheet.
      - name: region_goal
        data_type: float64
        description: Region-level goal, from the sheet.
      - name: organization_goal
        data_type: float64
        description: Network-level goal, from the sheet.
      - name: grade_band_goal
        data_type: float64
        description: Grade-band goal, from the sheet.
      - name: assessment_band_goal
        data_type: float64
        description: Assessment-band goal, from the sheet.
      - name: school_level
        data_type: string
        description: School level (ES, MS, HS), from `int_students__schools`.
      - name: region
        data_type: string
        description: >-
          Region name, title-cased from the `kipp<region>_` prefix of
          `int_students__schools._dbt_source_relation` (e.g. `Newark`).
