models:
  - name: int_assessments__group_performance_bands
    description: >-
      The Illuminate performance band set that labels a group's score for each
      response, one row per `canonical_assessment_id`, `response_type`, and
      `response_type_id`. A group is the set of copies that
      `int_assessments__response_rollup` sums under one
      `canonical_assessment_id`. For an internal regional group (a row of
      `int_assessments__assessments_canonical` with regions) the copies are its
      copies in `int_assessments__assessment_region_groups`. For a tag group id
      that leads no region's group (an empty `regions_array`), they are every
      copy in the tag group. A replacement (out-of-grade) row whose region has
      no group falls back to the tag group id, so it is labeled from every copy
      in the tag group when that id leads no region, and from that region's
      copies when the id is also a region's group. An external assessment is its
      own group. A response's records are the rows of
      `int_assessments__performance_bands` for the group's copies that share its
      `canonical_response_type_id`. The band set is the one on the first record
      by `assessment_id`, then `response_type_id`, so `overall` takes the
      group's lowest copy's set and a standard or reporting group takes the set
      of the first copy that carries it. When the records hold one standard
      under several `response_type_id`s and their band sets differ or any is
      null, no single set fits the merged score and the band set is null. A
      response no copy in the group carries has no row. Apex scores carry their
      own bands and are not here.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - canonical_assessment_id
              - response_type
              - response_type_id
          config:
            severity: error
    columns:
      - name: canonical_assessment_id
        data_type: int64
        description: >-
          The group id, matching
          `int_assessments__scaffold.canonical_assessment_id` — a regional group
          id or a tag group id from `int_assessments__assessments_canonical` for
          internal assessments, the assessment's own id for external ones. Part
          of the key.
      - name: response_type
        data_type: string
        description: One of `overall`, `standard`, or `group`. Part of the key.
      - name: response_type_id
        data_type: int64
        description: >-
          The `canonical_response_type_id` from
          `int_assessments__performance_bands`, which spans the whole tag group,
          so a standard keeps one id across regions. `-1` for `overall`. Part of
          the key.
      - name: performance_band_set_id
        data_type: int64
        description: >-
          Band set that labels the group's score for the response — the set on
          the record with the lowest `assessment_id`, then `response_type_id`,
          among the group's records for it. Null when those records split one
          standard across several `response_type_id`s whose band sets differ or
          include a null, and null when the first record has no band set.

unit_tests:
  - name: test_group_bands_follow_regional_first_copy
    description: >-
      Tag group 1 holds copy 1 (Camden) and copy 2 (Camden and Newark), so
      Camden's group 1 holds both copies and Newark's group 2 holds copy 2.
      Group 1 labels overall from its first copy (10, not copy 2's 20) and
      standard 500 from copy 2, the only copy that carries it. Group 2 labels
      both from copy 2. Group 3 scores standard 600 through records 600 and 601
      on different band sets, so it has no band. External assessment 9 keeps its
      own set.
    model: int_assessments__group_performance_bands
    given:
      - input: ref('int_assessments__assessment_region_groups')
        format: sql
        rows: |
          select
              'illuminate' as source,
              1 as assessment_id,
              'Camden' as region,
              1 as tag_group_assessment_id,
              1 as canonical_assessment_id
          union all
          select 'illuminate', 2, 'Camden', 1, 1
          union all
          select 'illuminate', 2, 'Newark', 1, 2
          union all
          select 'illuminate', 3, 'Camden', 3, 3
      - input: ref('int_assessments__assessments_members')
        format: sql
        rows: |
          select
              'illuminate' as source,
              1 as assessment_id,
              1 as tag_group_assessment_id,
              true as is_internal_assessment
          union all
          select 'illuminate', 2, 1, true
          union all
          select 'illuminate', 3, 3, true
          union all
          select 'illuminate', 9, 9, false
      - input: ref('int_assessments__assessments_canonical')
        format: sql
        rows: |
          select
              'illuminate' as source,
              1 as canonical_assessment_id,
              1 as tag_group_assessment_id,
              ['Camden'] as regions_array
          union all
          select 'illuminate', 2, 1, ['Newark']
          union all
          select 'illuminate', 3, 3, ['Camden']
      - input: ref('int_assessments__performance_bands')
        format: sql
        rows: |
          select
              1 as assessment_id,
              'overall' as response_type,
              -1 as response_type_id,
              10 as performance_band_set_id,
              -1 as canonical_response_type_id
          union all
          select 2, 'overall', -1, 20, -1
          union all
          select 2, 'standard', 500, 20, 500
          union all
          select 3, 'overall', -1, 40, -1
          union all
          select 3, 'standard', 600, 40, 600
          union all
          select 3, 'standard', 601, 41, 600
          union all
          select 9, 'overall', -1, 30, -1
    expect:
      rows:
        - {
            canonical_assessment_id: 1,
            response_type: overall,
            response_type_id: -1,
            performance_band_set_id: 10,
          }
        - {
            canonical_assessment_id: 1,
            response_type: standard,
            response_type_id: 500,
            performance_band_set_id: 20,
          }
        - {
            canonical_assessment_id: 2,
            response_type: overall,
            response_type_id: -1,
            performance_band_set_id: 20,
          }
        - {
            canonical_assessment_id: 2,
            response_type: standard,
            response_type_id: 500,
            performance_band_set_id: 20,
          }
        - {
            canonical_assessment_id: 3,
            response_type: overall,
            response_type_id: -1,
            performance_band_set_id: 40,
          }
        - {
            canonical_assessment_id: 3,
            response_type: standard,
            response_type_id: 600,
            performance_band_set_id: null,
          }
        - {
            canonical_assessment_id: 9,
            response_type: overall,
            response_type_id: -1,
            performance_band_set_id: 30,
          }
  - name: test_group_bands_tag_group_fallback
    description: >-
      Tag group 4 leads with untagged copy 4 and holds Camden copies 5 and 6, so
      Camden's group is 5 and tag group id 4 leads no region. Group 4 takes
      every copy in the tag group, labeling overall from copy 4 and standard 700
      from copy 6. Group 5 takes copies 5 and 6. An Apex assessment 6, whose id
      collides with Illuminate copy 6, gets no row.
    model: int_assessments__group_performance_bands
    given:
      - input: ref('int_assessments__assessment_region_groups')
        format: sql
        rows: |
          select
              'illuminate' as source,
              5 as assessment_id,
              'Camden' as region,
              4 as tag_group_assessment_id,
              5 as canonical_assessment_id
          union all
          select 'illuminate', 6, 'Camden', 4, 5
          union all
          select 'apex', 6, 'Miami', 6, 6
      - input: ref('int_assessments__assessments_members')
        format: sql
        rows: |
          select
              'illuminate' as source,
              4 as assessment_id,
              4 as tag_group_assessment_id,
              true as is_internal_assessment
          union all
          select 'illuminate', 5, 4, true
          union all
          select 'illuminate', 6, 4, true
          union all
          select 'apex', 6, 6, true
      - input: ref('int_assessments__assessments_canonical')
        format: sql
        rows: |
          select
              'illuminate' as source,
              4 as canonical_assessment_id,
              4 as tag_group_assessment_id,
              cast([] as array<string>) as regions_array
          union all
          select 'illuminate', 5, 4, ['Camden']
          union all
          select 'apex', 6, 6, ['Miami']
      - input: ref('int_assessments__performance_bands')
        format: sql
        rows: |
          select
              4 as assessment_id,
              'overall' as response_type,
              -1 as response_type_id,
              50 as performance_band_set_id,
              -1 as canonical_response_type_id
          union all
          select 5, 'overall', -1, 60, -1
          union all
          select 6, 'overall', -1, 70, -1
          union all
          select 6, 'standard', 700, 70, 700
    expect:
      rows:
        - {
            canonical_assessment_id: 4,
            response_type: overall,
            response_type_id: -1,
            performance_band_set_id: 50,
          }
        - {
            canonical_assessment_id: 4,
            response_type: standard,
            response_type_id: 700,
            performance_band_set_id: 70,
          }
        - {
            canonical_assessment_id: 5,
            response_type: overall,
            response_type_id: -1,
            performance_band_set_id: 60,
          }
        - {
            canonical_assessment_id: 5,
            response_type: standard,
            response_type_id: 700,
            performance_band_set_id: 70,
          }
