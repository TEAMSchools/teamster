            illuminate_subject_area: Mathematics
            score_source: state_fl
            assessment_name: FAST
            administration_period: PM1
            benchmark_academic_year: 2026
            test_grade: 3
            grade_level_when_assessed: 3
            raw_subject: null
            _dbt_source_project: kippmiami
      - input: ref("int_assessments__iready_diagnostic_results")
        rows: []
      - input: ref("stg_renlearn__star")
        rows:
          - student_display_id: 84001111
            academic_year: 2025
            star_discipline: Math
            district_benchmark_category_level: null
            state_benchmark_category_level: 3
            unified_score: 900
            rn_subject_round: 1
            screening_period_window_name: Spring
            grade_level: 2
            _dbt_source_project: kippmiami
