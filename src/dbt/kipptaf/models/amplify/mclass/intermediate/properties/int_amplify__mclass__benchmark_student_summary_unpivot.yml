models:
  - name: int_amplify__mclass__benchmark_student_summary_unpivot
    description: >-
      int_amplify__mclass__benchmark_student_summary unpivoted to one row per
      student, school year, benchmark period, assessed grade and measure. Each
      of the eight DIBELS measures and the Composite becomes its own row, with
      that measure's score, level, national percentile and growth
      classifications. BigQuery UNPIVOT drops a measure whose five unpivoted
      columns are all null, so a measure the student never sat has no row.
    config:
      materialized: table
    columns:
      - name: student_primary_id
        data_type: int64
        description: >-
          Network student number, carried from the benchmark summary. Part of
          the natural key identifying the row this measure was unpivoted from.
        config:
          meta:
            source_system: Amplify
            source_model: stg_amplify__mclass__sftp__benchmark_student_summary
            source_column: student_primary_id
            column_role: primary_key
      - name: school_year
        data_type: string
        description: >-
          School year range (e.g., '2025-2026'). Part of the natural key
          identifying the row this measure was unpivoted from.
        config:
          meta:
            source_system: Amplify
            source_model: stg_amplify__mclass__sftp__benchmark_student_summary
            source_column: school_year
            column_role: primary_key
      - name: benchmark_period
        data_type: string
        description: >-
          Benchmark administration window. Part of the natural key identifying
          the row this measure was unpivoted from.
        config:
          meta:
            source_system: Amplify
            source_model: stg_amplify__mclass__sftp__benchmark_student_summary
            source_column: benchmark_period
            column_role: primary_key
      - name: assessment_grade
        data_type: string
        description: >-
          Grade level of the assessment administered. Part of the natural key
          identifying the row this measure was unpivoted from.
        config:
          meta:
            source_system: Amplify
            source_model: stg_amplify__mclass__sftp__benchmark_student_summary
            source_column: assessment_grade
            column_role: primary_key
      - name: mclass_measure_standard
        data_type: string
        description: >-
          Measure the row was unpivoted from, e.g. 'Reading Fluency (ORF)' or
          'Composite'.
      - name: mclass_measure_standard_score
        data_type: numeric
        description: >-
          Score on this measure.
      - name: mclass_measure_standard_level
        data_type: string
        description: >-
          Benchmark level for this measure -- Above, At, Below or Well Below
          Benchmark.
      - name: mclass_measure_percentile
        data_type: numeric
        description: >-
          National norm percentile for this measure.
      - name: mclass_measure_semester_growth
        data_type: string
        description: >-
          Amplify's growth classification against the prior benchmark period.
      - name: mclass_measure_year_growth
        data_type: string
        description: >-
          Amplify's growth classification across the full year.
      - name: mclass_measure_name_code
        data_type: string
        description: >-
          Short measure code taken from the parenthetical in the measure name
          (e.g., 'ORF', 'NWF'). Composite stays 'Composite' and Maze maps to
          'Comprehension'.
      - name: mclass_measure_standard_level_int
        data_type: int64
        description: >-
          The level as 1 to 4 -- Well Below Benchmark 1 through Above Benchmark
          4. Null for any other level value.
      - name: mclass_measure_name
        data_type: string
        description: >-
          Full measure name mapped from the measure code (e.g., 'Oral Reading
          Fluency'). Codes without a mapping pass through unchanged.
