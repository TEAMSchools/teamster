models:
  - name: stg_iready__personalized_instruction_summary
    description: >-
      One row per student per date range per subject, unioning the
      Newark/Camden/Paterson (NJ) and Miami i-Ready Personalized Instruction
      Summary staging models. Same columns as the district models, with
      student_id adjusted so Miami values from academic years through 2025 that
      lack the Focus prefix are shifted onto the network student number.
    config:
      # Not a view: a test on a view runs only when its code changes, and the
      # school relationships test below must catch a new i-Ready school that is
      # missing from the crosswalk sheet on every build. No package can hold it,
      # because the crosswalk is a kipptaf model.
      materialized: table
    columns:
      - name: school
        data_type: string
        description: >-
          The school the student is rostered to in i-Ready, as reported in the
          vendor export.
        data_tests:
          - relationships:
              arguments:
                to: ref("int_people__location_crosswalk")
                field: location_name
              config:
                severity: error
