models:
  - name: int_iready__diagnostic_results
    description: >-
      Both district staging tables unioned, with Miami student numbers moved
      onto Focus numbers, location and region added, a reporting round
      (test_round) assigned, most-recent-diagnostic values rolled up, and
      projected state-test levels looked up from the i-Ready crosswalk sheet.
    config:
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - _dbt_source_relation
              - student_id
              - subject
              - completion_date
              - rn_subj_day
    columns:
      - name: school
        data_type: string
        description: The name of the school i-Ready has the student enrolled at.
        data_tests:
          - relationships:
              arguments:
                to: ref("stg_google_sheets__people__location_crosswalk")
                field: name
      - name: student_id
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Network student number. Miami rows through SY2025 carry the bare
          pre-Focus number in the source; they are brought onto the
          8400-prefixed Focus student number here.
      - name: _dbt_source_relation
        data_type: string
        description: >-
          The unioned source relation, rewritten to use the student's home
          region's Dagster code location as its schema prefix instead of the
          district project the row was staged under.
      - name: academic_year
        data_type: string
        description: >-
          The academic year label i-Ready assigns to the row, as reported in the
          vendor's export.
      - name: class_es
        data_type: string
        description: >-
          Name(s) of the class(es) the student is enrolled in within i-Ready.
      - name: class_teacher_s
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Name(s) of the teacher(s) of record for the student's i-Ready
          class(es).
      - name: economically_disadvantaged
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student is economically disadvantaged, per
          the district roster i-Ready received.
      - name: english_language_learner
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student is an English Language Learner, per
          the district roster i-Ready received.
      - name: enrolled
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student is currently enrolled in an i-Ready
          class, independent of whether they completed this Diagnostic.
      - name: first_name
        data_type: string
        config:
          meta:
            contains_pii: true
        description: The student's first name, as loaded from the vendor roster.
      - name: hispanic_or_latino
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student is identified as Hispanic or Latino,
          per the district roster i-Ready received.
      - name: last_name
        data_type: string
        config:
          meta:
            contains_pii: true
        description: The student's last name, as loaded from the vendor roster.
      - name: migrant
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student is identified as a migrant student,
          per the district roster i-Ready received.
      - name: race
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's race, per the district roster i-Ready received.
      - name: report_group_s
        data_type: string
        description: >-
          Name(s) of the Report Group(s) the student is enrolled in within
          i-Ready.
      - name: sex
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's sex, per the district roster i-Ready received.
      - name: special_education
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student receives special education services,
          per the district roster i-Ready received.
      - name: user_name
        data_type: string
        config:
          meta:
            contains_pii: true
        description: The student's i-Ready login username.
      - name: algebra_and_algebraic_thinking_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Algebra and Algebraic Thinking domain,
          based on their domain scale score -- an on-grade-level Early, Mid, or
          Late level, or an off-grade-level category such as Not Assessed,
          Surpassed Level, or Domain Exempted.
      - name: algebra_and_algebraic_thinking_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Algebra and Algebraic Thinking domain
          on the 5-level scale, from Three or More Grade Levels Below to Mid or
          Above Grade Level, or Not Assessed or Domain Exempted.
      - name: algebra_and_algebraic_thinking_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Algebra and Algebraic
          Thinking portion of the Diagnostic.
      - name: baseline_diagnostic_y_n
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether this row is the student's baseline Diagnostic for
          the academic year, used to set Typical and Stretch Growth goals for
          grades K-8. Coalesces the vendor's baseline-diagnostic and
          baseline-assessment field names, which vary across export vintages.
      - name: comprehension_informational_text_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Comprehension, Informational Text
          domain, based on their domain scale score -- an on-grade-level Early,
          Mid, or Late level, or an off-grade-level category such as Not
          Assessed, Surpassed Level, or Domain Exempted.
      - name: comprehension_informational_text_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Comprehension, Informational Text
          domain on the 5-level scale, from Three or More Grade Levels Below to
          Mid or Above Grade Level, or Not Assessed or Domain Exempted.
      - name: comprehension_informational_text_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Comprehension,
          Informational Text portion of the Diagnostic.
      - name: comprehension_literature_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Comprehension, Literature domain, based
          on their domain scale score -- an on-grade-level Early, Mid, or Late
          level, or an off-grade-level category such as Not Assessed, Surpassed
          Level, or Domain Exempted.
      - name: comprehension_literature_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Comprehension, Literature domain on the
          5-level scale, from Three or More Grade Levels Below to Mid or Above
          Grade Level, or Not Assessed or Domain Exempted.
      - name: comprehension_literature_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Comprehension, Literature
          portion of the Diagnostic.
      - name: comprehension_overall_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Comprehension, Overall domain, based on
          their domain scale score -- an on-grade-level Early, Mid, or Late
          level, or an off-grade-level category such as Not Assessed, Surpassed
          Level, or Domain Exempted.
      - name: comprehension_overall_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Comprehension, Overall domain on the
          5-level scale, from Three or More Grade Levels Below to Mid or Above
          Grade Level, or Not Assessed or Domain Exempted.
      - name: comprehension_overall_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Comprehension, Overall
          portion of the Diagnostic.
      - name: diagnostic_gain
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score point gain from the student's baseline Diagnostic to
          this Diagnostic, blank before the baseline row and zero at or below
          baseline performance. Coalesces the vendor's diagnostic-gain and
          assessment-gain field names, which vary across export vintages.
      - name: diagnostic_language
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The language the student completed the Diagnostic in (English or
          Spanish), where offered.
      - name: duration_min
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The number of minutes the student spent on the Diagnostic, counting
          time on questions but not on games or introductory videos.
      - name: geometry_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Geometry domain, based on their domain
          scale score -- an on-grade-level Early, Mid, or Late level, or an
          off-grade-level category such as Not Assessed, Surpassed Level, or
          Domain Exempted.
      - name: geometry_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Geometry domain on the 5-level scale,
          from Three or More Grade Levels Below to Mid or Above Grade Level, or
          Not Assessed or Domain Exempted.
      - name: geometry_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Geometry portion of the
          Diagnostic.
      - name: high_frequency_words_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the High-Frequency Words domain, based on
          their domain scale score -- an on-grade-level Early, Mid, or Late
          level, or an off-grade-level category such as Not Assessed, Surpassed
          Level, or Domain Exempted.
      - name: high_frequency_words_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the High-Frequency Words domain on the
          5-level scale, from Three or More Grade Levels Below to Mid or Above
          Grade Level, or Not Assessed or Domain Exempted.
      - name: high_frequency_words_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the High-Frequency Words
          portion of the Diagnostic.
      - name: lexile_measure
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's Lexile reading-ability score, based on their Diagnostic
          performance. Reading Diagnostic only.
      - name: lexile_range
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The range of text difficulty levels recommended for the student, based
          on their Lexile Measure. Reading Diagnostic only.
      - name: measurement_and_data_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Measurement and Data domain, based on
          their domain scale score -- an on-grade-level Early, Mid, or Late
          level, or an off-grade-level category such as Not Assessed, Surpassed
          Level, or Domain Exempted.
      - name: measurement_and_data_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Measurement and Data domain on the
          5-level scale, from Three or More Grade Levels Below to Mid or Above
          Grade Level, or Not Assessed or Domain Exempted.
      - name: number_and_operations_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Number and Operations domain, based on
          their domain scale score -- an on-grade-level Early, Mid, or Late
          level, or an off-grade-level category such as Not Assessed, Surpassed
          Level, or Domain Exempted.
      - name: number_and_operations_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Number and Operations domain on the
          5-level scale, from Three or More Grade Levels Below to Mid or Above
          Grade Level, or Not Assessed or Domain Exempted.
      - name: overall_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's overall grade-level placement based on their overall
          scale score -- the actual grade level associated with the score, with
          Early, Mid, or Late on-grade-level detail.
      - name: overall_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's overall placement on the 5-level scale, from Three or
          More Grade Levels Below to Mid or Above Grade Level.
      - name: overall_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The student's overall scale score achieved on the Diagnostic.
      - name: percent_progress_to_annual_stretch_growth_percent
        data_type: numeric
        config:
          meta:
            contains_pii: true
        description: >-
          Percent progress the student has made toward their Annual Stretch
          Growth Measure, from the baseline Diagnostic to this Diagnostic. Blank
          for grades 9-12.
      - name: percent_progress_to_annual_typical_growth_percent
        data_type: numeric
        config:
          meta:
            contains_pii: true
        description: >-
          Percent progress the student has made toward their Annual Typical
          Growth Measure, from the baseline Diagnostic to this Diagnostic. Blank
          for grades 9-12.
      - name: phonics_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Phonics domain, based on their domain
          scale score -- an on-grade-level Early, Mid, or Late level, or an
          off-grade-level category such as Not Assessed, Surpassed Level, or
          Domain Exempted.
      - name: phonics_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Phonics domain on the 5-level scale,
          from Three or More Grade Levels Below to Mid or Above Grade Level, or
          Not Assessed or Domain Exempted.
      - name: phonics_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Phonics portion of the
          Diagnostic.
      - name: phonological_awareness_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Phonological Awareness domain, based on
          their domain scale score -- an on-grade-level Early, Mid, or Late
          level, or an off-grade-level category such as Not Assessed, Surpassed
          Level, or Domain Exempted.
      - name: phonological_awareness_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Phonological Awareness domain on the
          5-level scale, from Three or More Grade Levels Below to Mid or Above
          Grade Level, or Not Assessed or Domain Exempted.
      - name: phonological_awareness_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Phonological Awareness
          portion of the Diagnostic.
      - name: quantile_measure
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's Quantile mathematical-ability score, based on their
          Diagnostic performance. Math Diagnostic only.
      - name: quantile_range
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The range of mathematical difficulty levels recommended for the
          student, based on their Quantile Measure. Math Diagnostic only.
      - name: read_aloud
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The read-aloud support the student had turned on during the
          Diagnostic, from full passage, question, and answer support down to
          none.
      - name: reading_comprehension_informational_text_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Reading Comprehension, Informational
          Text domain, based on their domain scale score -- an on-grade-level
          Early, Mid, or Late level, or an off-grade-level category such as Not
          Assessed, Surpassed Level, or Domain Exempted.
      - name: reading_comprehension_informational_text_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Reading Comprehension, Informational
          Text domain on the 5-level scale, from Three or More Grade Levels
          Below to Mid or Above Grade Level, or Not Assessed or Domain Exempted.
      - name: reading_comprehension_informational_text_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Reading Comprehension,
          Informational Text portion of the Diagnostic.
      - name: reading_comprehension_literature_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Reading Comprehension, Literature
          domain, based on their domain scale score -- an on-grade-level Early,
          Mid, or Late level, or an off-grade-level category such as Not
          Assessed, Surpassed Level, or Domain Exempted.
      - name: reading_comprehension_literature_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Reading Comprehension, Literature
          domain on the 5-level scale, from Three or More Grade Levels Below to
          Mid or Above Grade Level, or Not Assessed or Domain Exempted.
      - name: reading_comprehension_literature_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Reading Comprehension,
          Literature portion of the Diagnostic.
      - name: reading_comprehension_overall_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Reading Comprehension, Overall domain,
          based on their domain scale score -- an on-grade-level Early, Mid, or
          Late level, or an off-grade-level category such as Not Assessed,
          Surpassed Level, or Domain Exempted.
      - name: reading_comprehension_overall_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Reading Comprehension, Overall domain
          on the 5-level scale, from Three or More Grade Levels Below to Mid or
          Above Grade Level, or Not Assessed or Domain Exempted.
      - name: reading_comprehension_overall_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Reading Comprehension,
          Overall portion of the Diagnostic.
      - name: reading_difficulty_indicator_y_n
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's score relative to the Reading Difficulty Indicator -- Y
          means below the indicator score, N means at or above it, and Not
          Provided means the student is above Grade 3 and not eligible.
      - name: rush_flag
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Whether the student rushed through the Diagnostic -- Yellow means they
          may have rushed and the score may understate their skill, Red means
          they rushed and the score is unlikely to reflect their true skill.
      - name: vocabulary_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Vocabulary domain, based on their
          domain scale score -- an on-grade-level Early, Mid, or Late level, or
          an off-grade-level category such as Not Assessed, Surpassed Level, or
          Domain Exempted.
      - name: vocabulary_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's placement in the Vocabulary domain on the 5-level scale,
          from Three or More Grade Levels Below to Mid or Above Grade Level, or
          Not Assessed or Domain Exempted.
      - name: vocabulary_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Vocabulary portion of the
          Diagnostic.
      - name: _dagster_partition_academic_year
        data_type: int64
        description: >-
          The Dagster partition academic year for the export folder Dagster
          loaded this row from.
      - name: _dagster_partition_subject
        data_type: string
        description: >-
          The Dagster partition subject (ela or math) for the export folder
          Dagster loaded this row from. Stays ela because the GCS object path is
          derived from it, even though the warehouse reports the vendor's
          current subject name in the subject column.
      - name: academic_year_int
        data_type: int64
        description: >-
          The Dagster partition academic year cast to an integer -- the export
          folder the row was loaded from, not necessarily the school year the
          Diagnostic itself belongs to.
      - name: start_date
        data_type: date
        description: The date the student began the Diagnostic.
      - name: completion_date
        data_type: date
        description: The date the student completed the Diagnostic.
      - name: most_recent_diagnostic_ytd_y_n
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether this row is the student's most recently completed
          Diagnostic, academic year to date. Coalesces several of the vendor's
          most-recent-diagnostic field names, which vary across export vintages.
      - name: student_grade
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's grade level as reported by the vendor, with Kindergarten
          reported as K.
      - name: annual_stretch_growth_measure
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The student's Stretch Growth goal -- the ambitious but attainable
          scale score point gain that puts a below-grade-level student on a path
          to proficiency and an on-grade-level student on a path to advanced
          proficiency. For grades 9-12, replaced with a fixed target by subject
          and starting placement, since the vendor's export leaves this blank at
          that grade band.
      - name: annual_typical_growth_measure
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The student's Typical Growth goal -- the average scale score point
          gain for students at the same grade level with the same baseline
          Diagnostic placement. For grades 9-12, replaced with a fixed target by
          subject and starting placement, since the vendor's export leaves this
          blank at that grade band.
      - name: _grouping
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: The student's Instructional Grouping, cast to an integer.
      - name: measurement_and_data_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Measurement and Data
          portion of the Diagnostic.
      - name: mid_on_grade_level_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score associated with Mid On Grade Level for the student's
          chronological grade level.
      - name: number_and_operations_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score the student achieved on the Number and Operations
          portion of the Diagnostic.
      - name: percentile
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The student's percentile rank against a nationally representative
          group of students in the same grade who completed the Diagnostic in
          the same norming window.
      - name: subject
        data_type: string
        description: >-
          The discipline label for the Diagnostic (Reading or Math), derived
          from the Dagster partition subject.
      - name: overall_relative_placement_int
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          overall_relative_placement recoded to an ordinal scale from 1 (Three
          or More Grade Levels Below) to 5 (Mid or Above Grade Level).
      - name: placement_3_level
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          overall_relative_placement collapsed to three bands -- On or Above
          Grade Level, 1 Grade Level Below, or Two or More Grade Levels Below.
      - name: typical_growth
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score points remaining to reach the Typical Growth goal from
          this Diagnostic's gain, floored at zero.
      - name: stretch_growth
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The scale score points remaining to reach the Stretch Growth goal from
          this Diagnostic's gain, floored at zero.
      - name: overall_scale_score_plus_typical_growth
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          overall_scale_score plus typical_growth -- the scale score the student
          would reach by meeting their Typical Growth goal.
      - name: overall_scale_score_plus_stretch_growth
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          overall_scale_score plus stretch_growth -- the scale score the student
          would reach by meeting their Stretch Growth goal.
      - name: discipline
        data_type: string
        description: ELA or Math, derived from the Dagster partition subject.
      - name: is_met_stretch
        data_type: boolean
        config:
          meta:
            contains_pii: true
        description: >-
          Whether the student has reached 100% or more progress toward their
          Annual Stretch Growth Measure.
      - name: is_met_typical
        data_type: boolean
        config:
          meta:
            contains_pii: true
        description: >-
          Whether the student has reached 100% or more progress toward their
          Annual Typical Growth Measure.
      - name: is_proficient
        data_type: boolean
        config:
          meta:
            contains_pii: true
        description: >-
          Whether the student's overall relative placement is Early On Grade
          Level or above.
      - name: most_recent_completion_date
        data_type: date
        description: >-
          completion_date from the student's most recent Diagnostic in the
          subject and academic year, broadcast to every row in that partition
          via a window max over the unioned staging tables.
      - name: most_recent_diagnostic_gain
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          diagnostic_gain from the student's most recent Diagnostic in the
          subject and academic year, broadcast to every row in that partition
          via a window max over the unioned staging tables.
      - name: most_recent_lexile_measure
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          lexile_measure from the student's most recent Diagnostic in the
          subject and academic year, broadcast to every row in that partition
          via a window max over the unioned staging tables.
      - name: most_recent_lexile_range
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          lexile_range from the student's most recent Diagnostic in the subject
          and academic year, broadcast to every row in that partition via a
          window max over the unioned staging tables.
      - name: most_recent_overall_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          overall_placement from the student's most recent Diagnostic in the
          subject and academic year, broadcast to every row in that partition
          via a window max over the unioned staging tables.
      - name: most_recent_overall_relative_placement
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          overall_relative_placement from the student's most recent Diagnostic
          in the subject and academic year, broadcast to every row in that
          partition via a window max over the unioned staging tables.
      - name: most_recent_overall_scale_score
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          overall_scale_score from the student's most recent Diagnostic in the
          subject and academic year, broadcast to every row in that partition
          via a window max over the unioned staging tables.
      - name: most_recent_rush_flag
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          rush_flag from the student's most recent Diagnostic in the subject and
          academic year, broadcast to every row in that partition via a window
          max over the unioned staging tables.
      - name: student_grade_int
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          student_grade cast to an integer, with Kindergarten normalized to 0.
      - name: region
        data_type: string
        description: >-
          The student's home region (Dagster code location), resolved from
          school via the location crosswalk.
      - name: rn_subj_day
        data_type: int64
        description: >-
          Rank of this sitting among the student's diagnostics in the same
          subject completed on the same day, where 1 is the sitting downstream
          models keep. Ranks the earliest academic-year partition first, so a
          prior-year test the vendor re-sends into a later year's export never
          wins, then the latest start date, the higher overall scale score, and
          the longer duration.
      - name: rn_subj_year
        data_type: int64
        description: >-
          Rank of the student's diagnostics in a subject within a school year
          (academic_year string), latest completion date first, ties broken by
          rn_subj_day.
      - name: school_abbreviation
        data_type: string
        description: >-
          The abbreviated name of the student's school, resolved from school via
          the location crosswalk.
      - name: schoolid
        data_type: int64
        description: >-
          The PowerSchool school ID for the student's school, resolved from
          school via the location crosswalk.
      - name: state_assessment_type
        data_type: string
        description: >-
          The state summative assessment type for the student's region -- NJSLA
          for the three New Jersey regions, FL for Miami.
      - name: is_proficient_with_typical
        data_type: boolean
        config:
          meta:
            contains_pii: true
        description: >-
          Whether sublevel_with_typical meets the i-Ready crosswalk's proficient
          threshold.
      - name: level_number_with_typical
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Numeric i-Ready performance level projected if the student reaches
          their Typical Growth goal, from the i-Ready crosswalk sheet.
      - name: proficent_scale_score
        data_type: int64
        description: >-
          The minimum overall scale score corresponding to the state
          assessment's proficient (Level 3) cut, for the student's subject,
          grade, and state assessment type, from the i-Ready crosswalk sheet.
      - name: progress_to_stretch
        data_type: float64
        config:
          meta:
            contains_pii: true
        description:
          Derived from annual_stretch_growth_measure,
          most_recent_diagnostic_gain.
      - name: progress_to_typical
        data_type: float64
        config:
          meta:
            contains_pii: true
        description:
          Derived from annual_typical_growth_measure,
          most_recent_diagnostic_gain.
      - name: projected_is_proficient
        data_type: boolean
        config:
          meta:
            contains_pii: true
        description: >-
          Whether projected_sublevel meets the state assessment's proficient
          threshold.
      - name: projected_is_proficient_recent
        data_type: boolean
        config:
          meta:
            contains_pii: true
        description: >-
          Whether projected_sublevel_recent meets the state assessment's
          proficient threshold.
      - name: projected_is_proficient_stretch
        data_type: boolean
        config:
          meta:
            contains_pii: true
        description: >-
          Whether projected_sublevel_stretch meets the state assessment's
          proficient threshold.
      - name: projected_is_proficient_typical
        data_type: boolean
        config:
          meta:
            contains_pii: true
        description: >-
          Whether projected_sublevel_typical meets the state assessment's
          proficient threshold.
      - name: projected_level_number
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Numeric state assessment performance level projected from the row's
          own overall_scale_score if the student shows no additional growth
          before the state test, from the i-Ready crosswalk sheet.
      - name: projected_level_number_recent
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Numeric state assessment performance level projected from the
          student's most recent overall scale score if they show no additional
          growth before the state test, from the i-Ready crosswalk sheet.
      - name: projected_level_number_stretch
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Numeric state assessment performance level projected if the student
          reaches their Stretch Growth goal, from the i-Ready crosswalk sheet.
      - name: projected_level_number_typical
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Numeric state assessment performance level projected if the student
          reaches their Typical Growth goal, from the i-Ready crosswalk sheet.
      - name: projected_sublevel
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The state assessment performance sublevel projected from the row's own
          overall_scale_score if the student shows no additional growth before
          the state test, from the i-Ready crosswalk sheet.
      - name: projected_sublevel_number
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: Numeric code for projected_sublevel.
      - name: projected_sublevel_number_recent
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: Numeric code for projected_sublevel_recent.
      - name: projected_sublevel_number_stretch
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: Numeric code for projected_sublevel_stretch.
      - name: projected_sublevel_number_typical
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: Numeric code for projected_sublevel_typical.
      - name: projected_sublevel_recent
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The state assessment performance sublevel projected from the student's
          most recent overall scale score if they show no additional growth
          before the state test, from the i-Ready crosswalk sheet.
      - name: projected_sublevel_stretch
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The state assessment performance sublevel projected if the student
          reaches their Stretch Growth goal, from the i-Ready crosswalk sheet.
      - name: projected_sublevel_typical
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The state assessment performance sublevel projected if the student
          reaches their Typical Growth goal, from the i-Ready crosswalk sheet.
      - name: rn_subj_round
        data_type: int64
        description: >-
          Rank of the student's diagnostics within a school year and reporting
          round (test_round window), latest completion date first, ties broken
          by rn_subj_day, so 1 is the round's latest kept sitting.
      - name: round_number
        data_type: string
        description: Derived from code.
      - name: iready_proficiency
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >
          Proficiency band derived from overall_relative_placement_int: values
          1-2 = 'Below/Far Below', 3 = 'Approaching', 4+ = 'At/Above'.
      - name: scale_points_to_proficiency
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: Conditional on most_recent_overall_scale_score, scale_low.
      - name: sublevel_number_with_typical
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: Numeric code for sublevel_with_typical.
      - name: sublevel_with_typical
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The i-Ready (not state assessment) performance sublevel projected if
          the student reaches their Typical Growth goal, from the i-Ready
          crosswalk sheet.
      - name: test_round
        data_type: string
        description: First non-null of name.
      - name: _dbt_source_project
        data_type: string
        description: >-
          Dagster code location (kippnewark, kippcamden, kippmiami, ...)
          extracted from the crosswalk-rewritten _dbt_source_relation. Promoted
          here per the marts _dbt_source_project pattern so consumers join and
          hash a materialized column.
