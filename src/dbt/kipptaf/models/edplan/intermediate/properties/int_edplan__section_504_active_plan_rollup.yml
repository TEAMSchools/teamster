models:
  - name: int_edplan__section_504_active_plan_rollup
    description:
      One row per student, per region, with at least one active EdPlan Section
      504 plan. An active plan is a "Currently Valid - Section 504 Plan" event
      whose end date is today or later, or blank. EdPlan keeps some plans
      labeled Currently Valid after they end, so the end date decides. This
      model must stay a view, because the rule reads the current date when it is
      queried.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - _dbt_source_project
          config:
            severity: error
    columns:
      - name: student_number
        data_type: int64
        description: PowerSchool student number (EdPlan's Student ID).
        config:
          meta:
            contains_pii: true
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from _dbt_source_relation.
      - name: n_active_504_plans
        data_type: int64
        description:
          Number of active 504 plan events EdPlan holds for the student.
        config:
          meta:
            contains_pii: true

unit_tests:
  - name: test_active_plan_rollup
    description:
      Keeps students with a Currently Valid 504 plan that ends today, later, or
      never, once each. Drops lapsed plans, previous plans, and eligibility
      determinations.
    model: int_edplan__section_504_active_plan_rollup
    given:
      - input: ref('stg_edplan__section_504_student_report')
        format: sql
        rows: |
          select
            1001 as student_number,
            'kippnewark' as _dbt_source_project,
            'Currently Valid: Section 504 Plan' as event_selector,
            cast('2099-12-31' as date) as end_date
          union all
          select 1002, 'kippnewark', 'Currently Valid: Section 504 Plan',
            cast(null as date)
          union all
          select 1003, 'kippnewark', 'Currently Valid: Section 504 Plan',
            cast('2000-01-01' as date)
          union all
          select 1004, 'kippnewark', 'Previous: Section 504 Plan',
            cast('2099-12-31' as date)
          union all
          select 1005, 'kippnewark',
            'Currently Valid: Section 504 Eligibility Determination',
            cast(null as date)
          union all
          select 1006, 'kippnewark', 'Currently Valid: Section 504 Plan',
            cast('2099-12-31' as date)
          union all
          select 1006, 'kippnewark', 'Currently Valid: Section 504 Plan',
            cast('2098-06-30' as date)
          union all
          select 1007, 'kippnewark', 'Currently Valid: Section 504 Plan',
            current_date('America/New_York')
    expect:
      rows:
        - { student_number: 1001, _dbt_source_project: kippnewark }
        - { student_number: 1002, _dbt_source_project: kippnewark }
        - { student_number: 1006, _dbt_source_project: kippnewark }
        - { student_number: 1007, _dbt_source_project: kippnewark }
