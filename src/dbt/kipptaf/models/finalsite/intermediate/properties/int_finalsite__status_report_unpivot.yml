models:
  - name: int_finalsite__status_report_unpivot
    description: >
      Turns the 24 status-date columns of stg_finalsite__status_report
      (inquiry_date through summer_withdraw_date) into one row per enrollment,
      status, and load partition. BigQuery UNPIVOT drops null dates, so a row
      exists only for a status the enrollment actually reached. Joins
      int_people__location_crosswalk on assigned_school to get the PowerSchool
      school number and abbreviation.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - finalsite_enrollment_id
              - fs_status_field
              - _dagster_partition_key
          config:
            severity: error
    columns:
      - name: _dagster_partition_key
        data_type: string
        description: >
          Finalsite SFTP load partition. Part of the grain, since the same
          enrollment can appear in more than one partition.
      - name: region
        data_type: string
        description: >
          Region the record was loaded from -- "Newark", "Camden", "Miami", or
          "Paterson".
      - name: assigned_school
        data_type: string
        description: >
          School name as entered in Finalsite; the join key to
          int_people__location_crosswalk.
      - name: finalsite_enrollment_id
        data_type: string
        description: Finalsite contact/enrollment UUID.
        config:
          meta:
            contains_pii: true
      - name: powerschool_student_number
        data_type: int64
        description: >
          PowerSchool student number. Null for applicants not yet matched to a
          PowerSchool record.
        config:
          meta:
            contains_pii: true
      - name: first_name
        data_type: string
        description: Student's first name, title-cased.
        config:
          meta:
            contains_pii: true
      - name: last_name
        data_type: string
        description: Student's last name.
        config:
          meta:
            contains_pii: true
      - name: grade_level
        data_type: int64
        description: >
          Grade applied for, as a number (K = 0).
        config:
          meta:
            contains_pii: true
      - name: enrollment_type
        data_type: string
        description: >
          Finalsite enrollment type (new or returning), title-cased; blank
          values become "New" in staging.
        config:
          meta:
            contains_pii: true
      - name: self_contained
        data_type: string
        description: Finalsite self-contained classroom flag, as entered.
        config:
          meta:
            contains_pii: true
      - name: gender
        data_type: string
        description: Student's gender.
        config:
          meta:
            contains_pii: true
      - name: birthdate
        data_type: date
        description: Student's date of birth.
        config:
          meta:
            contains_pii: true
      - name: enrollment_academic_year
        data_type: int64
        description: >
          Academic year the enrollment record is active under in Finalsite
          (active_school_year, as the starting year). Not necessarily the
          current recruitment cycle.
      - name: enrollment_academic_year_display
        data_type: string
        description: >
          Display form of enrollment_academic_year (e.g. "2025-26").
      - name: fs_status_field
        data_type: string
        description: >
          Finalsite date column this row came from (e.g. 'inquiry_date').
        config:
          meta:
            contains_pii: true
      - name: status_start_date
        data_type: date
        description: Date the enrollment reached this status.
        config:
          meta:
            contains_pii: true
      - name: file_year
        data_type: int64
        description: >
          Load year, the first four characters of _dagster_partition_key.
      - name: detailed_status
        data_type: string
        description: >
          fs_status_field made readable -- underscores become spaces, the
          trailing "date" is dropped, and words are capitalized (inquiry_date
          becomes "Inquiry"). Joins to the status crosswalk sheet.
        config:
          meta:
            contains_pii: true
      - name: org
        data_type: string
        description: Always "KTAF".
      - name: schoolid
        data_type: int64
        description: >
          PowerSchool school number for assigned_school, or 0 when no school is
          assigned or the name does not match the location crosswalk.
      - name: school
        data_type: string
        description: >
          Short school abbreviation (e.g. "KURA"), or "No School Assigned" when
          assigned_school does not match the location crosswalk.
      - name: status_order
        data_type: int64
        description: >
          Funnel order of fs_status_field, 1 (inquiry) through 24 (summer
          withdraw). Breaks ties when several statuses share a date. Must match
          detailed_status_ranking in the status crosswalk sheet; a singular test
          checks the two agree.
        config:
          meta:
            contains_pii: true
