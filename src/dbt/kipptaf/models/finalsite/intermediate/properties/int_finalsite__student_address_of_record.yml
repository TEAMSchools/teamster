models:
  - name: int_finalsite__student_address_of_record
    description:
      Network-wide union of the per-region Finalsite
      `int_finalsite__student_address_of_record` models — one row per Finalsite
      student record with its resolved address of record, or an `unresolved`
      flag when neither the student's Parent 1 nor the student's own household
      linkage carries a street-bearing address at all. Parent 1's household is
      tried first; the student's own household is the fallback. Either side with
      several candidate addresses gets the most complete one — there is no
      requirement that only one distinct address exists. Includes all four
      regions; Focus is the Miami consumer and the NJ regions carry no Focus
      student id, so the `rpt_focus__*` filter on `focus_student_id_prefixed`
      keeps their rows out of the Focus feeds. Column documentation lives on the
      package model. Carries `_dbt_source_relation` and the derived
      `_dbt_source_project`.
    config:
      meta:
        contains_pii: true
    columns:
      - name: finalsite_enrollment_id
        data_type: string
        description: Finalsite contact UUID of the student; the grain.
        data_tests:
          - unique
          - not_null
