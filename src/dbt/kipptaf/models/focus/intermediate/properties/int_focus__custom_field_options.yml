models:
  - name: int_focus__custom_field_options
    description: >-
      Kipptaf-level union_relations passthrough of kippmiami's
      int_focus__custom_field_options — the option crosswalk for Focus
      select/multiple custom fields, one row per option keyed by option_id.
      Focus is Miami-only today; this shape lets a future region's Focus
      ingestion union in without a rewrite. Column docs/tests live on the
      kippmiami source model. Read by int_students__student_enrollments to
      decode custom_863, the IDEA educational environment, into the
      out-of-district placement columns.
    columns:
      - name: _dbt_source_project
        description: District code location derived from _dbt_source_relation.
