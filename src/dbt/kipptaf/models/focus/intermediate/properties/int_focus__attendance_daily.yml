models:
  - name: int_focus__attendance_daily
    description: >-
      Kipptaf-level union_relations passthrough of kippmiami's
      int_focus__attendance_daily — Focus daily attendance membership, one row
      per enrolled student per in-session calendar day. Focus is Miami-only
      today; this shape lets a future region's Focus ingestion union in without
      a rewrite. Column docs/tests live on the kippmiami source model.
    config:
      meta:
        contains_pii: true
    columns:
      - name: _dbt_source_project
        description: District code location derived from _dbt_source_relation.
