models:
  - name: int_focus__schedule
    description: >-
      Kipptaf-level union_relations passthrough of kippmiami's
      int_focus__schedule — one row per student per scheduled course period,
      with section, course, and marking-period context resolved. Focus is
      Miami-only today; this shape lets a future region's Focus ingestion union
      in without a rewrite. Column docs/tests live on the kippmiami source
      model.
    columns:
      - name: student_schedule_id
        description: >-
          Primary key — Focus schedule id; one row per student per scheduled
          course period.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: _dbt_source_project
        description: District code location derived from _dbt_source_relation.
