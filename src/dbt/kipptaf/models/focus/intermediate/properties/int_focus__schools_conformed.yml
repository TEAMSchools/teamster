models:
  - name: int_focus__schools_conformed
    description: >-
      Miami school identity from Focus, conformed to the PowerSchool school
      spine's vocabulary and keyed on the PowerSchool numeric school id instead
      of Focus's own school code, so it can union into the network school spine.
      Limited to schools with a match on the people locations sheet; Focus's
      non-physical administrative entries (ZZ Course History, Virtual Franchise)
      have no such match and are excluded.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - school_number
              - _dbt_source_project
    columns:
      - name: school_number
        description: >-
          Canonical network school number, resolved from Focus's own school code
          via the people locations sheet's PowerSchool school id.
      - name: name
        quote: true
        description: School name as recorded in Focus.
      - name: location_key
        description: >-
          Canonical location_key resolved via the people locations sheet on
          Focus's school code.
      - name: abbreviation
        description: Short school name from the people locations sheet.
      - name: school_level
        description: >-
          Single school-level code (ES, MS, HS) matching the PowerSchool
          archive's domain, derived from Focus's school-level label. Null for
          closed schools, which carry no school-level label in Focus.
      - name: _dbt_source_relation
        description: Source relation, passed through from the Focus wrapper.
      - name: _dbt_source_project
        description:
          District code location, passed through from the Focus wrapper.
