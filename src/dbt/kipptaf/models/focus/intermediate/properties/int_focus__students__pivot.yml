models:
  - name: int_focus__students__pivot
    description: >-
      Kipptaf-level union_relations passthrough of kippmiami's
      int_focus__students__pivot — decoded labels for the SISStudent select
      custom fields, one row per Focus student id. Focus is Miami-only today;
      this shape lets a future region's Focus ingestion union in without a
      rewrite. Column docs/tests live on the kippmiami source model.
    columns:
      - name: _dbt_source_project
        description: District code location derived from _dbt_source_relation.
