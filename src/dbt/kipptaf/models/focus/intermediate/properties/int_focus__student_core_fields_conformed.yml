models:
  - name: int_focus__student_core_fields_conformed
    description: >-
      Miami IEP and English learner status, conformed to the network spine and
      keyed on student_number instead of the PowerSchool-internal dcid the
      archive's student core fields table used. Both statuses carry forward from
      the frozen PowerSchool archive for returning students, because neither has
      a usable Focus source.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - _dbt_source_project
    columns:
      - name: spedlep
        description: >-
          IEP classification carried forward from the frozen PowerSchool
          archive. Null for students new since the freeze, because Focus ESE
          fields are not yet populated.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: lep_status
        description: >-
          English learner status carried forward from the frozen PowerSchool
          archive. Null for students new since the freeze, because the Focus ELL
          field is effectively unpopulated.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: student_number
        description: Canonical network student number.
      - name: _dbt_source_relation
        description: >-
          Source relation, passed through from the Focus student identity
          conform model.
      - name: _dbt_source_project
        description: >-
          District code location, passed through from the Focus student identity
          conform model.
