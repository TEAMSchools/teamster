models:
  - name: stg_focus__students_join_users
    description: >-
      Kipptaf-level union_relations passthrough of kippmiami's
      stg_focus__students_join_users, exposing Miami's student-to-staff links at
      network level — one row per association between a student and a Focus user
      account, the table behind a staff member's student caseload or advisory
      list. Column docs/tests live on the kippmiami source model.
    config:
      meta:
        contains_pii: true
    columns:
      - name: _dbt_source_project
        description: District code location derived from _dbt_source_relation.
