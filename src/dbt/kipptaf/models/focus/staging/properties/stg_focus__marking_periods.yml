models:
  - name: stg_focus__marking_periods
    description: >-
      Kipptaf-level union_relations passthrough of kippmiami's
      stg_focus__marking_periods, exposing Miami's school-year, semester,
      quarter, and progress-period definitions at network level. One row per
      marking period.
    columns:
      - name: marking_period_id
        description: Focus internal id of the marking period. Primary key.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: school_id
        description: >-
          Focus internal school id the marking period belongs to. Not the
          network school number.
      - name: syear
        description: Focus school year start year (e.g. 2026 = 2026-27).
      - name: type
        description: >-
          Marking period grain — year, semester, quarter, or progress_period.
      - name: title
        description: Full display name of the marking period (e.g. Quarter 1).
      - name: short_name
        description: Short code for the marking period (e.g. Q1, S1, FY).
      - name: start_date
        description: First calendar date of the marking period.
      - name: end_date
        description: Last calendar date of the marking period.
      - name: parent_id
        description: >-
          marking_period_id of the enclosing marking period (a quarter's
          semester, a semester's full year).
      - name: quarter_id
        description: Focus internal id of the associated quarter record, if any.
      - name: semester_id
        description:
          Focus internal id of the associated semester record, if any.
      - name: year_id
        description: Focus internal id of the associated full-year record.
      - name: rollover_id
        description:
          Focus internal id linking this record across school-year rollovers.
      - name: progress_period_id
        description:
          Focus internal id of the associated progress-period record, if any.
      - name: sort_order
        description: Display ordering of the marking period within its parent.
      - name: exclude_from_api
        description:
          Whether the marking period is excluded from the Focus API feed.
      - name: exclude_from_schedule
        description: Whether the marking period is excluded from scheduling.
      - name: registration_start_date
        description:
          First date students may register for courses in this period.
      - name: registration_end_date
        description: Last date students may register for courses in this period.
      - name: post_start_date
        description: First date grades may be posted for this period.
      - name: post_end_date
        description: Last date grades may be posted for this period.
      - name: stand_post_start_date
        description: >-
          First date standards-based grades may be posted for this period.
      - name: stand_post_end_date
        description:
          Last date standards-based grades may be posted for this period.
      - name: grade12_post_start_date
        description: >-
          First date grades may be posted for this period for 12th-grade
          students.
      - name: grade12_post_end_date
        description: >-
          Last date grades may be posted for this period for 12th-grade
          students.
      - name: tuition_hours
        description: Tuition hours attributed to this marking period.
      - name: year_fraction
        description: Fraction of the school year this marking period represents.
      - name: uuid
        description: Focus universally unique identifier for the record.
      - name: created_at
        description: Timestamp the record was created in Focus.
      - name: updated_at
        description: Timestamp the record was last updated in Focus.
      - name: _dbt_source_relation
        description: Source relation this row was unioned from.
      - name: _dbt_source_project
        description: District code location derived from _dbt_source_relation.
