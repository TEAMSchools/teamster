sources:
  - name: kippmiami_dlt_focus
    description: >-
      Focus SIS tables landed directly to BigQuery by the kippmiami Focus dlt
      pull (dagster_kippmiami_dlt_focus). Read here pre-staging for the school
      calendar lookup and the enrollment delta filter; the dlt dataset is a
      stable production location with no branch-deployment redirect.
    schema: dagster_kippmiami_dlt_focus
    tables:
      - name: attendance_calendar
        description: Per-day school calendar dates, one row per calendar day.
        config:
          meta:
            dagster:
              asset_key:
                - kippmiami
                - dlt
                - focus
                - attendance_calendar
      - name: attendance_calendars
        description: Attendance calendar headers, one row per calendar.
        config:
          meta:
            dagster:
              asset_key:
                - kippmiami
                - dlt
                - focus
                - attendance_calendars
      - name: student_enrollment
        description:
          Focus enrollment records, one row per enrollment. Read by
          rpt_focus__student_enrollment to suppress extract rows that already
          exist in Focus (matched on student_id, syear, start_date).
        config:
          meta:
            dagster:
              asset_key:
                - kippmiami
                - dlt
                - focus
                - student_enrollment
      - name: students
        description: >-
          Focus student records, one row per student. Wide custom_NNN columns
          carry the identity and demographic fields the KIPP Forward Miami
          roster reads.
        config:
          meta:
            dagster:
              asset_key:
                - kippmiami
                - dlt
                - focus
                - students
      - name: school_gradelevels
        description: >-
          Focus grade-level definitions, one row per grade level per school.
          short_name is the zero-padded grade code, for example 07.
        config:
          meta:
            dagster:
              asset_key:
                - kippmiami
                - dlt
                - focus
                - school_gradelevels
      - name: student_enrollment_codes
        description: >-
          Focus enrollment and withdrawal code definitions. type separates Add
          from Drop; short_name is the Florida DOE code such as E01 or W06.
        config:
          meta:
            dagster:
              asset_key:
                - kippmiami
                - dlt
                - focus
                - student_enrollment_codes
      - name: custom_fields
        description: >-
          Focus custom-field definition catalog. Joined to
          custom_field_select_options to decode stored select values to labels
          and codes.
        config:
          meta:
            dagster:
              asset_key:
                - kippmiami
                - dlt
                - focus
                - custom_fields
      - name: custom_field_select_options
        description: >-
          Allowed values for Focus select-type custom fields. code is the value
          Focus expects; label is the human-readable name.
        config:
          meta:
            dagster:
              asset_key:
                - kippmiami
                - dlt
                - focus
                - custom_field_select_options
