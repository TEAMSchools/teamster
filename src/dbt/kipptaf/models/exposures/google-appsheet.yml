exposures:
  - name: seat_tracker_app
    label: Seat Tracker
    type: application
    owner:
      name: Data Team
    depends_on:
      - ref("rpt_appsheet__seat_tracker_roster")
      - ref("rpt_gsheets__people__campus_crosswalk")
      - ref("rpt_gsheets__people__location_crosswalk")
    config:
      meta:
        dagster:
          kinds:
            - google
  - name: stipend_app
    label: Stipend and Bonus App
    type: application
    owner:
      name: Data Team
    depends_on:
      - ref("rpt_appsheet__stipend_app_roster")
    config:
      meta:
        dagster:
          kinds:
            - google
  # Archive only. Leadership Development moved to Lattice on 2026-07-30 and the
  # upstream dbt models are disabled. The AppSheet app is the writer into
  # BigQuery, so it also has to be turned off in the AppSheet console --
  # disabling dbt models only stops the reads. The frozen relations are
  # registered under the google_appsheet_archive source. Refs #4627
  - name: leadership_development_app
    label: Leadership Development
    type: application
    owner:
      name: Data Team
    depends_on:
      - ref("rpt_appsheet__leadership_development_assignments")
      - ref("rpt_appsheet__leadership_development_roster")
      - ref("stg_google_sheets__performance_management__leadership_development_metrics")
    config:
      enabled: false
      meta:
        dagster:
          kinds:
            - google
  - name: assessment
    label: Assessment
    type: application
    owner:
      name: Data Team
    depends_on:
      - ref("rpt_appsheet__assessments")
    config:
      meta:
        dagster:
          kinds:
            - google
  - name: kfwd_career_launch_app
    label: KIPP Forward Career Launch App
    type: application
    owner:
      name: Data Team
    depends_on:
      - ref("rpt_appsheet__kfwd_career_launch_survey")
    config:
      meta:
        dagster:
          kinds:
            - google
