models:
  - name: dim_performance_bands
    description: >-
      Performance band dimension. One row per band of every Illuminate and Focus
      Assessments band set that scores an internal assessment, with the set's
      cut points and mastery bar and the band's level relative to that bar. Each
      score is banded on its own response type's set, so a standard can sit on a
      different set from its assessment's overall score.
    config:
      materialized: table
      meta:
        dagster:
          # The assessment star's tick, shared with the scores fact that
          # carries this dimension's key. Refs #4559, #4821
          automation_condition:
            cron_schedule: 30 0,10,13,15,17 * * *
    columns:
      - name: performance_band_key
        data_type: string
        description: >-
          Surrogate key of the band, hashed from the source system, the band set
          and the band number. Primary key.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique

      - name: performance_band_set
        data_type: string
        description: Name of the band set the band belongs to.

      - name: band_label
        data_type: string
        description: >-
          The band's label, as the source spells it. A set can repeat a label,
          so band_number, not the label, identifies a band.

      - name: band_number
        data_type: int64
        description: >-
          Position of the band in its set, 1 = lowest. Means something only
          inside its set; use mastery_level to compare across sets.

      - name: band_count
        data_type: int64
        description: Number of bands in the band's set.

      - name: minimum_score
        data_type: numeric
        description: Lowest percent correct in the band.

      - name: maximum_score
        data_type: numeric
        description: >-
          The next band's minimum percent correct. Null for the top band.
          Illuminate places a score in a band only up to 0.1 below this value,
          so a score in that gap gets no band.

      - name: is_mastery
        data_type: boolean
        description: True when the band counts as mastery on its set.

      - name: mastery_band_number
        data_type: int64
        description: The lowest band that counts as mastery on the band's set.

      - name: mastery_minimum_score
        data_type: numeric
        description: >-
          The band set's mastery cut: the lowest percent correct that counts as
          mastery.

      - name: mastery_level
        data_type: string
        description: >-
          The band's level relative to its set's mastery band, the same on every
          set. At/Above is the mastery band and every band above it; Approaching
          is the band directly below the mastery band; Below is every band under
          that. Null when the band set's setup breaks the rule's assumptions.

      - name: is_far_below
        data_type: boolean
        description: >-
          True for the lowest band of a set when it is not a mastery band. Null
          when the band set's setup breaks the level rule's assumptions.
