models:
  - name: dim_student_enrollment_status
    description: >-
      Enrollment-grain status rollup. One row per student_enrollment_key.
      Derives a single ELL, IEP, meal eligibility, ELA bucket and math bucket
      value per enrollment stint from the SCD2 status dims, following the
      enrollment-grain aggregation rules: ELL via LEFT JOIN (one span per
      stint); IEP via latest span; meal via NJ Oct-15 span or earliest fallback,
      Miami via latest span; each bucket via latest span, Bucket 4 when the
      stint has none. 504 has no source dates, so it comes from the enrollment
      stint's own flag. Absence of a status row is normalized to false/null —
      not missing data. SIPPS, tutoring, self-contained and homeroom come from
      the enrollment extract the assessment dashboards read, unchanged, so they
      match those dashboards. The ELA and math Low 25, prior-year state test and
      DIBELS columns come the same way from the enrollment-by-subject extract,
      which rebuilds on its own schedule, so a stint newer than that extract's
      last build reads null until it rebuilds. Consumed by the Cube semantic
      layer as a snowflake sub-dim joined one-to-one to dim_student_enrollments.
    columns:
      - name: student_enrollment_key
        data_type: string
        description: >-
          PK. Surrogate key matching
          dim_student_enrollments.student_enrollment_key. Derived from
          student_number, _dbt_source_project, academic_year, entrydate.
        constraints:
          - type: primary_key
            warn_unsupported: false
        data_tests:
          - unique

      - name: iep_classification
        data_type: string
        description: >-
          IEP placement classification for this enrollment stint, from the
          latest IEP span. Examples: Resource Center, In-Class Resource,
          Self-Contained. NULL when no IEP span exists for the stint.

      - name: special_education_code
        data_type: string
        description: >-
          NJ state special education code (NJ regions only; NULL for Miami).
          From the latest IEP span.

      - name: special_education_name
        data_type: string
        description: >-
          Human-readable label for the NJ special education code (NJ regions
          only; NULL for Miami). From the latest IEP span.

      - name: special_education_placement
        data_type: string
        description: >-
          NJ special education placement category (NJ regions only; NULL for
          Miami). From the latest IEP span.

      - name: meal_eligibility
        data_type: string
        description: >-
          Meal eligibility category for this enrollment stint. Values: F (Free),
          R (Reduced), FDC (Free Direct Certification), P (Paid), Unknown. NULL
          when no meal span exists for the stint.

      - name: is_ell
        data_type: boolean
        description: >-
          TRUE if the student was classified as an English Language Learner
          during this enrollment stint. FALSE when no ELL span exists for the
          stint (absence of a row = not ELL). Derived from
          dim_student_ell_status via LEFT JOIN; coalesced from NULL to false.

      - name: is_504
        data_type: boolean
        description: >-
          TRUE if the student had a Section 504 plan during this enrollment
          stint. FALSE otherwise, including when the source system leaves the
          flag unset. This is the enrollment 504 status the assessment
          dashboards show; state test files carry their own 504 flag, which can
          differ.
        config:
          meta:
            contains_pii: true
            source_column: int_students__student_enrollments.is_504

      - name: is_iep
        data_type: boolean
        description: >-
          TRUE if the student had an active Individualized Education Program
          during this enrollment stint. Derived from the latest IEP span by
          effective_date_start_key; coalesced from NULL to false.

      - name: is_meal_eligible
        data_type: boolean
        description: >-
          TRUE if the student was eligible for free, reduced-price, or direct
          certification meals during this enrollment stint. NJ: derived from the
          meal span covering Oct 15 of the academic year, or the earliest span
          if none covers Oct 15. Miami: derived from the latest span. Coalesced
          from NULL to false.

      - name: ela_bucket
        data_type: string
        description: >-
          The student's ELA bucket for this enrollment stint — the bucket of the
          latest span in the stint, or Bucket 4 when the stint has none. Null
          before 2025-26 and on grade 99 rows. Use it when the subject being
          analyzed is ELA or reading; for assessments, pick ela_bucket or
          math_bucket by the assessment's bucket_subject.
        config:
          meta:
            contains_pii: true

      - name: math_bucket
        data_type: string
        description: >-
          The student's math bucket for this enrollment stint — the bucket of
          the latest span in the stint, or Bucket 4 when the stint has none.
          Null before 2025-26 and on grade 99 rows. Use it when the subject
          being analyzed is math; for assessments, pick ela_bucket or
          math_bucket by the assessment's bucket_subject.
        config:
          meta:
            contains_pii: true

      - name: is_sipps
        data_type: boolean
        description: >-
          TRUE if the student is enrolled in the SIPPS foundational reading
          intervention course this school year and has not dropped it. One value
          for the school year, as the assessment dashboards show it.
        config:
          meta:
            contains_pii: true
            source_column: int_extracts__student_enrollments.is_sipps

      - name: is_tutoring
        data_type: boolean
        description: >-
          TRUE if the date of the enrollment extract's last build falls inside
          the student's Tutoring program enrollment for this school year; FALSE
          otherwise, so every past school year reads FALSE. NJ regions only;
          Miami is always FALSE. This is the NJ Tutoring status the assessment
          dashboards show.
        config:
          meta:
            contains_pii: true
            source_column: int_extracts__student_enrollments.is_tutoring

      - name: is_self_contained
        data_type: boolean
        description: >-
          TRUE if the student has a self-contained special education program
          this school year. NJ regions only; null for Miami, which has no source
          for it.
        config:
          meta:
            contains_pii: true
            source_column: int_extracts__student_enrollments.is_self_contained

      - name: homeroom_name
        data_type: string
        description: >-
          The display name of the student's homeroom for this school year and
          school. In NJ, the letters in the homeroom section number, or the
          homeroom teacher's name when the section number has no letters; in
          Miami, the homeroom course period's short name, or the teacher's name.
          Null where no homeroom course exists, including Miami grades above
          elementary.
        config:
          meta:
            contains_pii: true
            source_column: int_extracts__student_enrollments.advisory_name

      - name: homeroom_section_number
        data_type: string
        description: >-
          The section number of the student's homeroom for this school year and
          school. Null where no homeroom course exists, including Miami grades
          above elementary.
        config:
          meta:
            contains_pii: true
            source_column: int_extracts__student_enrollments.team

      - name: is_ela_low_25
        data_type: boolean
        description: >-
          TRUE if the student's ELA score on last spring's Florida FAST (PM3)
          ranks below the 25.5th percentile. Miami only; FALSE in NJ regions.
          Null when the stint has no ELA subject record.
        config:
          meta:
            contains_pii: true
            source_column: int_extracts__student_enrollments_subjects.is_low_25_fl

      - name: is_math_low_25
        data_type: boolean
        description: >-
          TRUE if the student's math score on last spring's Florida FAST (PM3)
          ranks below the 25.5th percentile. Miami only; FALSE in NJ regions.
          Null when the stint has no math subject record.
        config:
          meta:
            contains_pii: true
            source_column: int_extracts__student_enrollments_subjects.is_low_25_fl

      - name: ela_state_test_proficiency
        data_type: string
        description: >-
          The student's proficiency level on last school year's annual ELA state
          test, or No Test when there is none. Null when the stint has no ELA
          subject record.
        config:
          meta:
            contains_pii: true
            source_column: int_extracts__student_enrollments_subjects.state_test_proficiency

      - name: math_state_test_proficiency
        data_type: string
        description: >-
          The student's proficiency level on last school year's annual math
          state test, or No Test when there is none. Null when the stint has no
          math subject record.
        config:
          meta:
            contains_pii: true
            source_column: int_extracts__student_enrollments_subjects.state_test_proficiency

      - name: dibels_most_recent_composite
        data_type: string
        description: >-
          The student's most recent DIBELS composite benchmark level this school
          year, or No Composite Score Available when there is none. Null when
          the stint has no ELA subject record. DIBELS is a reading assessment,
          so there is no math counterpart.
        config:
          meta:
            contains_pii: true
            source_column: int_extracts__student_enrollments_subjects.dibels_most_recent_composite

unit_tests:
  - name: unit_dim_student_enrollment_status_buckets
    description: >-
      Gives each stint from 2025-26 on the bucket of its is_latest_in_enrollment
      span per subject, and Bucket 4 when the stint has no span; leaves both
      buckets null before 2025-26 and on grade 99 rows.
    model: dim_student_enrollment_status
    given:
      - input: ref("dim_student_enrollments")
        rows:
          - student_enrollment_key: k1
            academic_year: 2025
            grade_level: 5
          - student_enrollment_key: k2
            academic_year: 2024
            grade_level: 5
          - student_enrollment_key: k3
            academic_year: 2026
            grade_level: 99
          - student_enrollment_key: k4
            academic_year: 2026
            grade_level: 6
      - input: ref("dim_student_ell_status")
        rows: []
      - input: ref("int_students__student_enrollments")
        rows: []
      - input: ref("dim_student_iep_status")
        rows: []
      - input: ref("dim_student_meal_eligibility_status")
        rows: []
      - input: ref("int_extracts__student_enrollments")
        rows: []
      - input: ref("int_extracts__student_enrollments_subjects")
        rows: []
      - input: ref("dim_student_bucket_status")
        format: sql
        rows: |
          select
              'k1' as student_enrollment_key,
              'Reading' as `subject`,
              'Bucket 2' as bucket,
              true as is_latest_in_enrollment
          union all
          select 'k2', 'Reading', 'Bucket 1', true
          union all
          select 'k3', 'Math', 'Bucket 1', true
          union all
          select 'k4', 'Math', 'Bucket 1', false
          union all
          select 'k4', 'Math', 'Bucket 3', true
    expect:
      rows:
        - student_enrollment_key: k1
          ela_bucket: Bucket 2
          math_bucket: Bucket 4
        - student_enrollment_key: k2
          ela_bucket: null
          math_bucket: null
        - student_enrollment_key: k3
          ela_bucket: null
          math_bucket: null
        - student_enrollment_key: k4
          ela_bucket: Bucket 4
          math_bucket: Bucket 3

  - name: unit_dim_student_enrollment_status_student_flags
    description: >-
      Copies each stint's SIPPS, tutoring, self-contained and homeroom values
      from its own extract row, matched by region, student, year and entry date.
      A student number reused in another region keeps that region's values, 2
      stints in 1 year keep their own values, Miami's null self-contained stays
      null, and a stint with no extract row gets nulls.
    model: dim_student_enrollment_status
    given:
      - input: ref("dim_student_enrollments")
        format: sql
        rows: |
          select
              to_hex(md5('1001-kippnewark-2026-2026-09-02')) as student_enrollment_key,
              2026 as academic_year,
              5 as grade_level
          union all
          select to_hex(md5('1001-kippmiami-2026-2026-09-02')), 2026, 5
          union all
          select to_hex(md5('1002-kippnewark-2026-2026-09-02')), 2026, 6
          union all
          select to_hex(md5('1002-kippnewark-2026-2027-01-10')), 2026, 6
          union all
          select to_hex(md5('1003-kippcamden-2026-2026-09-02')), 2026, 7
      - input: ref("dim_student_ell_status")
        rows: []
      - input: ref("int_students__student_enrollments")
        rows: []
      - input: ref("dim_student_iep_status")
        rows: []
      - input: ref("dim_student_meal_eligibility_status")
        rows: []
      - input: ref("dim_student_bucket_status")
        format: sql
        rows: |
          select
              cast(null as string) as student_enrollment_key,
              cast(null as string) as `subject`,
              cast(null as string) as bucket,
              cast(null as bool) as is_latest_in_enrollment
          from unnest([1])
          where false
      - input: ref("int_extracts__student_enrollments")
        rows:
          - _dbt_source_project: kippnewark
            student_number: 1001
            academic_year: 2026
            entrydate: 2026-09-02
            is_sipps: true
            is_tutoring: true
            is_self_contained: true
            advisory_name: Harvard
            team: 5HAR
          - _dbt_source_project: kippmiami
            student_number: 1001
            academic_year: 2026
            entrydate: 2026-09-02
            is_sipps: false
            is_tutoring: false
            is_self_contained: null
            advisory_name: Rm 12
            team: HR12
          - _dbt_source_project: kippnewark
            student_number: 1002
            academic_year: 2026
            entrydate: 2026-09-02
            is_sipps: false
            is_tutoring: false
            is_self_contained: false
            advisory_name: Yale
            team: 6YAL
          - _dbt_source_project: kippnewark
            student_number: 1002
            academic_year: 2026
            entrydate: 2027-01-10
            is_sipps: false
            is_tutoring: false
            is_self_contained: false
            advisory_name: Penn
            team: 6PEN
      - input: ref("int_extracts__student_enrollments_subjects")
        rows: []
    expect:
      rows:
        # trunk-ignore(gitleaks/generic-api-key): md5 fixture key, not a secret
        - student_enrollment_key: d6b8dcf4392bb7c62ec321c120f8c853
          is_sipps: true
          is_tutoring: true
          is_self_contained: true
          homeroom_name: Harvard
          homeroom_section_number: 5HAR
        # trunk-ignore(gitleaks/generic-api-key): md5 fixture key, not a secret
        - student_enrollment_key: c9b0cfb2aef5d75d43b5d1b8c4f7ffe1
          is_sipps: false
          is_tutoring: false
          is_self_contained: null
          homeroom_name: Rm 12
          homeroom_section_number: HR12
        # trunk-ignore(gitleaks/generic-api-key): md5 fixture key, not a secret
        - student_enrollment_key: cc1b5049c911f3eb4b757d8f9dc4ddd9
          is_sipps: false
          is_tutoring: false
          is_self_contained: false
          homeroom_name: Yale
          homeroom_section_number: 6YAL
        # trunk-ignore(gitleaks/generic-api-key): md5 fixture key, not a secret
        - student_enrollment_key: 0fb3ae54198089e62f7e308bd1b5522e
          is_sipps: false
          is_tutoring: false
          is_self_contained: false
          homeroom_name: Penn
          homeroom_section_number: 6PEN
        # trunk-ignore(gitleaks/generic-api-key): md5 fixture key, not a secret
        - student_enrollment_key: 5d9c9cd87a0185072c5a6e20532c333b
          is_sipps: null
          is_tutoring: null
          is_self_contained: null
          homeroom_name: null
          homeroom_section_number: null

  - name: unit_dim_student_enrollment_status_subject_flags
    description: >-
      Spreads each stint's ELA and Math extract rows into ELA and math columns
      for Low 25 and prior-year state test proficiency, takes the DIBELS
      composite from the ELA row only, and leaves all 5 null on a stint with no
      subject rows.
    model: dim_student_enrollment_status
    given:
      - input: ref("dim_student_enrollments")
        format: sql
        rows: |
          select
              to_hex(md5('2001-kippnewark-2026-2026-09-02')) as student_enrollment_key,
              2026 as academic_year,
              4 as grade_level
          union all
          select to_hex(md5('2002-kippmiami-2026-2026-08-11')), 2026, 4
          union all
          select to_hex(md5('2003-kippcamden-2026-2026-09-02')), 2026, 4
      - input: ref("dim_student_ell_status")
        rows: []
      - input: ref("int_students__student_enrollments")
        rows: []
      - input: ref("dim_student_iep_status")
        rows: []
      - input: ref("dim_student_meal_eligibility_status")
        rows: []
      - input: ref("dim_student_bucket_status")
        format: sql
        rows: |
          select
              cast(null as string) as student_enrollment_key,
              cast(null as string) as `subject`,
              cast(null as string) as bucket,
              cast(null as bool) as is_latest_in_enrollment
          from unnest([1])
          where false
      - input: ref("int_extracts__student_enrollments")
        rows: []
      - input: ref("int_extracts__student_enrollments_subjects")
        rows:
          - _dbt_source_project: kippnewark
            student_number: 2001
            academic_year: 2026
            entrydate: 2026-09-02
            discipline: ELA
            is_low_25_fl: false
            state_test_proficiency: Met Expectations
            dibels_most_recent_composite: At Benchmark
          - _dbt_source_project: kippnewark
            student_number: 2001
            academic_year: 2026
            entrydate: 2026-09-02
            discipline: Math
            is_low_25_fl: false
            state_test_proficiency: Partially Met
            dibels_most_recent_composite: No Composite Score Available
          - _dbt_source_project: kippmiami
            student_number: 2002
            academic_year: 2026
            entrydate: 2026-08-11
            discipline: ELA
            is_low_25_fl: true
            state_test_proficiency: Level 1
            dibels_most_recent_composite: Well Below Benchmark
          - _dbt_source_project: kippmiami
            student_number: 2002
            academic_year: 2026
            entrydate: 2026-08-11
            discipline: Math
            is_low_25_fl: false
            state_test_proficiency: Level 3
            dibels_most_recent_composite: No Composite Score Available
    expect:
      rows:
        # trunk-ignore(gitleaks/generic-api-key): md5 fixture key, not a secret
        - student_enrollment_key: 8985ad974dcf8f057ef4cc4caa3d9175
          is_ela_low_25: false
          is_math_low_25: false
          ela_state_test_proficiency: Met Expectations
          math_state_test_proficiency: Partially Met
          dibels_most_recent_composite: At Benchmark
        # trunk-ignore(gitleaks/generic-api-key): md5 fixture key, not a secret
        - student_enrollment_key: d848038ee262b8ac4f174f7792fe45e2
          is_ela_low_25: true
          is_math_low_25: false
          ela_state_test_proficiency: Level 1
          math_state_test_proficiency: Level 3
          dibels_most_recent_composite: Well Below Benchmark
        # trunk-ignore(gitleaks/generic-api-key): md5 fixture key, not a secret
        - student_enrollment_key: 16a85d541ab52c4379360fd973f964c6
