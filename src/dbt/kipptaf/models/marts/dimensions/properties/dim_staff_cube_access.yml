models:
  - name: dim_staff_cube_access
    description: >-
      Cube access-control resolution, one row per active primary staff member
      keyed on staff_key. Resolves each person's current role to the student
      location scope, the staff sensitive-field remit (location + department),
      and the per-field sensitive scopes, derived from the current primary work
      assignment and the Google Sheets access crosswalks (department
      special-access override taking precedence over the role mapping). Read by
      cube.js's resolveAccess, matched on google_email, to build the
      securityContext groups and location/department allow-lists that each
      view's access_policy reads; not exposed as a Cube. The staff directory and
      aggregate summary are open — these scopes only constrain sensitive fields.
      Unresolved roles emit 'none' (deny), never NULL.
    data_tests:
      # A remit-scoped PII scope (all_in_scope / teaching_staff) with a none
      # location or department axis is a resolution bug: the remit resolves empty,
      # and Cube (Tesseract) throws "Values required for filter" on the empty
      # `equals []` row_level filter rather than returning zero rows (verified
      # #4269). access.buildGroups now suppresses the group in that state so the
      # viewer default-denies cleanly, but the state is still a misconfiguration —
      # error (not warn) so it can't ship. reporting_chain scopes key on the
      # staff_key chain, not this remit, so they are not covered here.
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              staff_pii_scope not in ('all_in_scope', 'teaching_staff')
              or (
                staff_location_scope != 'none'
                and staff_department_scope != 'none'
              )
          config:
            severity: error
      # An employing business unit whose code does not match
      # dim_regions.business_unit_code must deny, not fall through to a grant:
      # 'unknown' matches only the entity-agnostic 'any' role rows, never the
      # KTAF/Region-specific grants. Asserts every staff member's employing
      # entity resolves. Zero rows today across 1,573 staff, so a hit means ADP
      # added an org unit and dim_regions has not caught up.
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              entity != 'unknown'
          config:
            severity: error
      # Guards the CASE in the `resolved` CTE against a future edit, NOT the
      # data: the CASE already forces this outcome for every KTAF row, so this
      # cannot fail against any input. It fails if someone later adds a KTAF
      # branch returning region or school — which is the mistake worth
      # catching, because KTAF's own legal entity enrolls no students and such
      # a scope resolves to an empty allow-list and denies outright (measured
      # before the fix as 5 KTAF viewers at zero rows and 3 capped to one
      # city). 'none' must stay reachable for KTAF: it is a decision about the
      # role, not the desk.
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              entity != 'KTAF' or student_location_scope in ('network', 'none')
          config:
            severity: error
      # A school student scope whose location does not resolve grants nothing:
      # the policy filters on a NULL abbreviation and the viewer is denied every
      # row, which looks exactly like a correct deny at the Cube surface. Warn,
      # not error — the rows are a real upstream gap in the work-assignment
      # location (9 Miami-employed viewers as of 2026-09-23), so this surfaces
      # them for Ops rather than blocking a deploy.
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              student_location_scope != 'school'
              or location_abbreviation is not null
          config:
            severity: warn
      # legal_entity_region_key is employer-derived for a FERPA reason that
      # covers student records only. It also bounds the staff-PII remit, via
      # computeAllowedAbbreviations, whenever staff_location_scope is region or
      # school — and staff records are not education records, so that half has
      # no FERPA argument behind it. It is inert only while no viewer holds both
      # a location-bounded remit and a non-none PII scope; zero do today,
      # network-wide. This is the tripwire for that: a hit means someone's staff
      # PII remit is now bounded by their employer rather than their desk, which
      # is a decision to make deliberately, not to discover. Warn, not error —
      # it constrains a future grant, not current correctness.
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              staff_pii_scope = 'none'
              or staff_location_scope not in ('region', 'school')
          config:
            severity: warn
    columns:
      - name: staff_key
        data_type: string
        description: >-
          Primary key — generate_surrogate_key([employee_number]), matching
          dim_staff.
        constraints:
          - type: primary_key
            warn_unsupported: false
        data_tests:
          - unique

      - name: google_email
        data_type: string
        description: >-
          Resolve-only lookup for the Cube JWT boundary; the active+primary
          Google email so a recycled address cannot resolve to a stale identity.
        data_tests:
          - not_null:
              config:
                severity: warn
          - unique:
              config:
                severity: warn

      - name: legal_entity_region_key
        data_type: string
        description: >-
          Region key of the legal entity EMPLOYING this viewer, resolved by
          joining business_unit_code to dim_regions.business_unit_code — not the
          region of the desk they sit at. This is the student row-level security
          boundary: FERPA binds student-record access to the employing LEA, and
          region maps 1:1 to legal entity, so the value is still joinable to
          dim_locations.region_key. It also bounds the staff-PII remit when
          staff_location_scope is region or school, which FERPA does not argue
          for; a model-level warn test flags any viewer who reaches that state.
          NULL when the employing business unit does not resolve, which denies.
        config:
          meta:
            foreign_key:
              to: ref('dim_regions')
              to_columns: [region_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_regions')
                field: region_key

      - name: location_abbreviation
        data_type: string
        description: >-
          Viewer's school abbreviation (from dim_locations). cube.js filters on
          this for a school location scope. NULL when location does not resolve.

      - name: department_group
        data_type: string
        description: >-
          Viewer's functional department grouping from the rollup crosswalk;
          cube.js filters on this for an own_group department scope.

      - name: entity
        data_type: string
        description: >-
          KTAF, Region, or unknown, derived from the dim_regions join that
          produces legal_entity_region_key: KTAF when the matched region's
          business_unit_code is KIPP_TAF, Region for every other matched
          business unit. A business unit dim_regions does not know resolves to
          unknown — a deny sentinel that matches only entity-agnostic 'any' role
          rows, never the KTAF/Region-specific grants.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [KTAF, Region, unknown]

      - name: job_function_code
        data_type: string
        description: Current ADP job function code (CHIEF, SL, TEACH, ...).

      - name: job_function_level
        data_type: int64
        description: >-
          Org rank from the role crosswalk (1 = Chief, 6 = Teacher); drives the
          below-rank branch of reporting_chain_or_below_rank. NULL when the role
          does not resolve.

      - name: student_location_scope
        data_type: string
        description: >-
          Student data location breadth — network, region, school, or none. The
          only gating on student data: a viewer with a non-none scope sees every
          student view and all fields, including PII. Region and school scopes
          are bounded by legal_entity_region_key and location_abbreviation
          respectively. A KTAF viewer granted any scope resolves to network,
          because KTAF's own legal entity enrolls no students; a KTAF viewer
          mapped to none stays none.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [network, region, school, none]

      - name: staff_location_scope
        data_type: string
        description: >-
          Location remit bounding the staff sensitive fields — network, region,
          school, or none. Constrains rows only when a sensitive field is
          queried.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [network, region, school, none]

      - name: staff_department_scope
        data_type: string
        description: >-
          Department remit bounding the staff sensitive fields — all, own_group,
          or none.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [all, own_group, none]

      - name: staff_pii_scope
        data_type: string
        description: >-
          Staff PII field visibility — per-field sensitive scope enum (none,
          all_in_scope, reporting_chain_or_below_rank, reporting_chain,
          teaching_staff).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - none
                  - all_in_scope
                  - reporting_chain_or_below_rank
                  - reporting_chain
                  - teaching_staff

      - name: staff_compensation_scope
        data_type: string
        description: Staff compensation field visibility (same vocabulary).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - none
                  - all_in_scope
                  - reporting_chain_or_below_rank
                  - reporting_chain
                  - teaching_staff

      - name: staff_observations_scope
        data_type: string
        description: Staff observation field visibility (same vocabulary).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - none
                  - all_in_scope
                  - reporting_chain_or_below_rank
                  - reporting_chain
                  - teaching_staff

      - name: staff_benefits_scope
        data_type: string
        description: Staff benefits field visibility (same vocabulary).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - none
                  - all_in_scope
                  - reporting_chain_or_below_rank
                  - reporting_chain
                  - teaching_staff
