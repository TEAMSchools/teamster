models:
  - name: dim_student_504_status
    description: >-
      SCD2 dimension capturing Section 504 plan status spans per student per
      district enrollment context. One span per enrollment stint whose 504 flag
      is set. No source carries 504 begin or end dates, so each span covers the
      whole stint, clipped to its entry and exit dates. New Jersey past stints
      carry the value recorded for that stint; the current stint in Newark and
      Camden and every Miami stint carry the student's current value. Paterson
      records no current value, so its current stints never have a row. The dim
      is inclusion-based — consumers default to `false` when no row covers the
      target date.
    config:
      meta:
        dagster:
          group: marts
          asset_key:
            - kipptaf
            - marts
            - dim_student_504_status
    columns:
      - name: student_504_status_key
        data_type: string
        description: Surrogate primary key.
        constraints:
          - type: primary_key
            warn_unsupported: false
        data_tests:
          - unique
      - name: _dbt_source_project
        data_type: string
        description: >-
          District context for this status span (`kippnewark`, `kippcamden`,
          `kippmiami`, `kipppaterson`). Part of the dim's grain — a student
          enrolled in two districts has independent 504 timelines under each.
          Consumers joining at student grain must include this column in the
          join key to avoid fan-out for cross-enrolled students.
        data_tests:
          - not_null
      - name: effective_date_start_key
        data_type: date
        description: First date this span is valid — the stint's entry date.
        config:
          meta:
            foreign_key:
              to: ref('dim_dates')
              to_columns: [date_key]
      - name: effective_date_end_key
        data_type: date
        description: >-
          Last date this span is valid (inclusive) — the day before the stint's
          exit date. The current stint carries its scheduled exit date, so
          `'9999-12-31'` appears only when a source leaves the exit date empty.
        config:
          meta:
            foreign_key:
              to: ref('dim_dates')
              to_columns: [date_key]
      - name: is_current
        data_type: boolean
        description: >-
          True when `effective_date_end_key = '9999-12-31'`. Every stint carries
          an exit date, so this is false on every row today; filter on the
          enrollment's academic year to find a current stint.
      - name: is_504
        data_type: boolean
        description: >-
          True for every emitted row. The dim is inclusion-based — rows exist
          only for `(student × district × stint)` combinations where the student
          has a Section 504 plan. Consumers default to `false` when no row
          covers the target date.
        config:
          meta:
            contains_pii: true
            source_column: int_students__student_enrollments.is_504
      - name: student_key
        data_type: string
        description: Foreign key to `dim_students.student_key`.
        config:
          meta:
            foreign_key:
              to: ref('dim_students')
              to_columns: [student_key]
      - name: student_enrollment_key
        data_type: string
        description: >-
          Foreign key to `dim_student_enrollments.student_enrollment_key`. Each
          status row is bound to exactly one enrollment stint, so this key is
          unique here. Consumers join here directly rather than re-deriving the
          stint via date-range overlap.
        config:
          meta:
            foreign_key:
              to: ref('dim_student_enrollments')
              to_columns: [student_enrollment_key]
