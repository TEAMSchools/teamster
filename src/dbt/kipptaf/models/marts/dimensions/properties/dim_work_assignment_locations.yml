models:
  - name: dim_work_assignment_locations
    description: >-
      Work assignment location dimension with derived Type 2 SCD tracking. One
      row per assignment x location change point. Detects changes to the
      canonical location_key only — address mutations on the same canonical
      location no longer cut redundant SCD2 boundaries. FK to
      dim_staff_work_assignments via work_assignment_key; FK to dim_locations
      via location_key.
    columns:
      - name: work_assignment_location_key
        data_type: string
        description: >-
          Surrogate primary key derived from item_id and effective_date_start.
          Generated with generate_surrogate_key(["item_id",
          "effective_date_start"]).
        constraints:
          - type: primary_key
            warn_unsupported: false
        data_tests:
          - unique

      - name: work_assignment_key
        data_type: string
        description: >-
          Foreign key to dim_staff_work_assignments. Surrogate key derived from
          item_id. Generated with generate_surrogate_key(["item_id"]).
        config:
          meta:
            foreign_key:
              to: ref('dim_staff_work_assignments')
              to_columns: [work_assignment_key]

      - name: location_key
        data_type: string
        description: >-
          Canonical location FK. Resolved upstream in
          int_adp_workforce_now__workers__work_assignments via the canonical
          master on adp_location_code. NULL when the ADP location has no
          canonical mapping.
        config:
          meta:
            foreign_key:
              to: ref('dim_locations')
              to_columns: [location_key]

      - name: effective_start_date
        data_type: date
        description: >-
          Date this location version was first observed, derived from the daily
          partition date where the location_key changed.

      - name: effective_end_date
        data_type: date
        description: >-
          Last date this location version was effective. Computed as one day
          before the next version's effective_start_date, or 9999-12-31 for the
          current version.

      - name: is_current
        data_type: boolean
        description: >-
          TRUE if this is the most recent location version for the work
          assignment (effective_end_date = 9999-12-31).

unit_tests:
  - name: test_dim_work_assignment_locations_null_first_record
    description:
      Locks change detection at an assignment's first record. Assignment A has
      no location on its only record, B starts with no location and gains one,
      and C keeps one location across two records. A keeps 1 null row, B keeps
      its leading null row and the change, and C collapses to 1 row.
    model: dim_work_assignment_locations
    given:
      - input: ref('int_adp_workforce_now__workers__work_assignments')
        format: sql
        rows: |
          select 'A' as item_id, date '2026-07-01' as effective_date_start, cast(null as string) as location_key
          union all select 'B', date '2026-07-02', null
          union all select 'B', date '2026-08-02', 'L1'
          union all select 'C', date '2026-07-03', 'L1'
          union all select 'C', date '2026-08-03', 'L1'
    expect:
      rows:
        - location_key: null
          effective_start_date: 2026-07-01
          effective_end_date: 9999-12-31
          is_current: true
        - location_key: null
          effective_start_date: 2026-07-02
          effective_end_date: 2026-08-01
          is_current: false
        - location_key: L1
          effective_start_date: 2026-08-02
          effective_end_date: 9999-12-31
          is_current: true
        - location_key: L1
          effective_start_date: 2026-07-03
          effective_end_date: 9999-12-31
          is_current: true
