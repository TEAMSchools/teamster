models:
  - name: dim_locations
    description: >-
      School and office location dimension. One row per school or office.
      Conformed dimension. Region context is reached via the region_key FK to
      dim_regions.

      Mixed-grain: this dim contains BOTH school-level rows and campus-level
      rows (a campus is a physical site where multiple schools share a
      building). The `is_campus` flag distinguishes them — set TRUE for
      campus-level rows, FALSE for individual schools. The `campus` column on a
      school row names its parent campus (may be null for standalone schools).
      When joining to a fact, decide deliberately whether you want campus-grain
      or school-grain aggregation; default is school-grain (filter `WHERE NOT
      is_campus`).
    columns:
      - name: location_key
        data_type: string
        description: >-
          Surrogate key derived from location name.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique

      - name: abbreviation
        data_type: string
        description: >-
          Short display name for the location, and the value Cube's row-level
          access filters student and staff rows on. resolveAccess turns a
          viewer's location scope into a set of these and every student view
          filters on membership in it, so a duplicate across two regions would
          silently widen one viewer's access to the other's school.
        data_tests:
          - unique

      - name: region_key
        data_type: string
        description: >-
          Foreign key to dim_regions. Surrogate key derived from
          `business_unit_code` so this column hashes exactly the keys produced
          by `dim_regions.region_key`. Network-level locations (e.g., KIPP NJ)
          map to KIPP_TAF.
        config:
          meta:
            foreign_key:
              to: ref('dim_regions')
              to_columns: [region_key]

      - name: name
        quote: true
        data_type: string
        description: >-
          Canonical location name.

      - name: grade_band
        data_type: string
        description: >-
          Grade band the school serves (ES, MS, HS): a school attribute, not a
          student's grade.

      - name: campus
        data_type: string
        description: >-
          Physical campus name. Multiple schools may share a campus. A school
          row names its parent campus, or null for a standalone school. A
          campus-level row names itself, unless the campus crosswalk maps it to
          a differently named campus.

      - name: is_campus
        data_type: boolean
        description: >-
          TRUE if this location record represents a campus-level entity.

      - name: address
        data_type: string
        description: Physical street address (single line). Nullable.

      - name: city
        data_type: string
        description: |
          City. Nullable for non-physical rows (e.g., campus rollups).

      - name: postal_code
        data_type: string
        description: Postal code. Nullable for non-physical rows.

unit_tests:
  - name: test_dim_locations_campus
    description:
      Locks how campus resolves. A school takes its crosswalk campus. A
      campus-level location with no crosswalk row takes its own name. A
      campus-level location with a crosswalk row takes the crosswalk campus. A
      school with no crosswalk row stays null.
    model: dim_locations
    given:
      - input: ref('stg_google_sheets__people__locations')
        rows:
          - { location_name: School A, is_campus: false, is_pathways: false }
          - { location_name: Campus X, is_campus: true, is_pathways: false }
          - { location_name: Office 1, is_campus: true, is_pathways: false }
          - { location_name: School B, is_campus: false, is_pathways: false }
      - input: ref('stg_google_sheets__people__campus_crosswalk')
        rows:
          - { Location_Name: School A, Name: Campus X }
          - { Location_Name: Office 1, Name: Campus Y }
    expect:
      rows:
        - { name: School A, campus: Campus X }
        - { name: Campus X, campus: Campus X }
        - { name: Office 1, campus: Campus Y }
        - { name: School B, campus: null }
