models:
  - name: dim_locations
    description: >-
      School and office location dimension. One row per school or office.
      Conformed dimension. Region context is reached via the region_key FK to
      dim_regions.

      Mixed-grain: this dim contains BOTH school-level rows and campus-level
      rows (a campus is a physical site where multiple schools share a
      building). The `is_campus` flag distinguishes them — set TRUE for
      campus-level rows, FALSE for individual schools. The `campus` column on a
      school row names its parent campus (may be null for standalone schools).
      When joining to a fact, decide deliberately whether you want campus-grain
      or school-grain aggregation; default is school-grain (filter `WHERE NOT
      is_campus`).
    columns:
      - name: location_key
        data_type: string
        description: >-
          Surrogate key derived from location name.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique

      - name: abbreviation
        data_type: string
        description: >-
          Short display name for the location, and the value Cube's row-level
          access filters student and staff rows on. resolveAccess turns a
          viewer's location scope into a set of these and every student view
          filters on membership in it, so a duplicate across two regions would
          silently widen one viewer's access to the other's school.
        data_tests:
          - not_null
          - unique

      - name: school_id
        data_type: int64
        description: >-
          School ID that student enrollment, attendance and section records
          carry for this school. Miami schools keep the IDs they had before
          their student information system changed. Null for campus rows, and
          for any school whose ID the locations sheet repeats on another school
          row.
        config:
          meta:
            source_column: powerschool_school_id

      - name: region_key
        data_type: string
        description: >-
          Foreign key to dim_regions. Surrogate key derived from
          `business_unit_code` so this column hashes exactly the keys produced
          by `dim_regions.region_key`. Network-level locations (e.g., KIPP NJ)
          map to KIPP_TAF.
        config:
          meta:
            foreign_key:
              to: ref('dim_regions')
              to_columns: [region_key]

      - name: head_of_school_staff_key
        data_type: string
        description: >-
          Staff key of the school's head of school — the manager of the school's
          School Leader (or School Leader in Residence), as the staff roster
          reports today. Usually a Head of Schools; sometimes a Managing
          Director or Chief Academic Officer. When the roster names no manager
          for the school's leader, the head of schools the locations sheet lists
          for the school. FK to dim_staff. Current state only, so a past year
          shows today's head of school. Null for campus rows, for schools with
          no school leadership on the roster, and when that manager is not
          active.
        config:
          meta:
            foreign_key:
              to: ref('dim_staff')
              to_columns: [staff_key]

      - name: school_leader_staff_key
        data_type: string
        description: >-
          Staff key of the school's School Leader, or its School Leader in
          Residence when it has no School Leader, as the staff roster reports
          today. FK to dim_staff. Current state only, so a past year shows
          today's leader. Null for campus rows and while the seat is vacant.
        config:
          meta:
            foreign_key:
              to: ref('dim_staff')
              to_columns: [staff_key]

      - name: operations_director_staff_key
        data_type: string
        description: >-
          Staff key of the school's director of operations — its Director School
          Operations, or its Director Campus Operations when it has none — as
          the staff roster reports today. FK to dim_staff. Current state only,
          so a past year shows today's director. Null for campus rows and while
          the seat is vacant.
        config:
          meta:
            foreign_key:
              to: ref('dim_staff')
              to_columns: [staff_key]

      - name: name
        quote: true
        data_type: string
        description: >-
          Canonical location name.

      - name: grade_band
        data_type: string
        description: >-
          Grade band the school serves (ES, MS, HS): a school attribute, not a
          student's grade.

      - name: campus
        data_type: string
        description: >-
          Physical campus name. Multiple schools may share a campus.

      - name: is_campus
        data_type: boolean
        description: >-
          TRUE if this location record represents a campus-level entity.

      - name: address
        data_type: string
        description: Physical street address (single line). Nullable.

      - name: city
        data_type: string
        description: |
          City. Nullable for non-physical rows (e.g., campus rollups).

      - name: postal_code
        data_type: string
        description: Postal code. Nullable for non-physical rows.

unit_tests:
  - name: test_dim_locations_repeated_school_id
    description:
      School A has its own school id, so it keeps it. Schools B and C share one,
      so both get a null school_id. A Pathways row reusing school A's id is out
      of scope and does not count as a repeat, and a campus row's placeholder id
      is never exposed.
    model: dim_locations
    given:
      - input: ref('stg_google_sheets__people__locations')
        rows:
          - location_key: a
            location_name: School A
            powerschool_school_id: 1
            is_campus: false
            is_pathways: false
          - location_key: b
            location_name: School B
            powerschool_school_id: 2
            is_campus: false
            is_pathways: false
          - location_key: c
            location_name: School C
            powerschool_school_id: 2
            is_campus: false
            is_pathways: false
          - location_key: p
            location_name: Pathways A
            powerschool_school_id: 1
            is_campus: false
            is_pathways: true
          - location_key: d
            location_name: Campus D
            powerschool_school_id: 0
            is_campus: true
            is_pathways: false
      - input: ref('stg_google_sheets__people__campus_crosswalk')
        rows:
          - location_name: none
      - input: ref('int_people__leadership_crosswalk')
        rows:
          - home_work_location_powerschool_school_id: 999
    expect:
      rows:
        - location_key: a
          school_id: 1
        - location_key: b
          school_id: null
        - location_key: c
          school_id: null
        - location_key: d
          school_id: null
