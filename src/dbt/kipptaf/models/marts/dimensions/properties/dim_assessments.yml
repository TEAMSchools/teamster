models:
  - name: dim_assessments
    description: >-
      Assessment definition dimension. One row per unique assessment definition.
      Covers internal Illuminate assessments, NJ and FL state assessments, and
      college-entrance assessments (SAT, ACT, AP). scope indicates whether
      scores are linked at the enrollment level or student level.

      Two subject-normalization columns coexist for college-entrance comparisons
      (both NULL for other assessment types):

      - `aligned_academic_subject` — **within-test-family** normalization.
        SAT EBRW and PSAT EBRW both align to EBRW. Use this when comparing
        scores across administrations of the same test family (e.g.,
        SAT-to-PSAT growth).
      - `combined_academic_subject` — **cross-test-family** normalization.
        Further collapses across test families so SAT and ACT scores can
        land in the same bucket (e.g., SAT EBRW and ACT Reading combine to
        EBRW/Reading). Use this for apples-to-oranges comparisons across
        test families.
    config:
      materialized: table
      meta:
        dagster:
          # 5x/day, raised from nightly (#4559) so the whole assessment star
          # shares one tick — dim_assessment_administrations has an FK test to
          # this model, and a nightly dim under 5x/day administrations leaves a
          # window where a new Illuminate assessment is in administrations but
          # not yet here. Rationale in fct_assessment_scores_enrollment_scoped.
          # Refs #4821
          automation_condition:
            cron_schedule: 0 0,10,13,15,17 * * *
    columns:
      - name: assessment_key
        data_type: string
        description: >-
          Surrogate key derived from type, module_code, source_assessment_id,
          and test_type. Primary key. For Illuminate, member-grained — one row
          per actual `assessment_id`. For state/college/AP, canonical
          (`source_assessment_id` is null). Drilldown from
          `dim_assessment_administrations` (canonical-grain) to this dim goes
          through `bridge_assessment_administration_members`.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique

      # NJ and FL state types stay separate so historical state assessments do
      # not collide on shared module_codes (for example ELA05).
      - name: type
        data_type: string
        description: >-
          Source-system category — illuminate (KIPP-authored internal interims);
          iready, dibels and star (vendor diagnostics); college (SAT, ACT and
          PSAT, Official and Practice); ap; the NJ state tests state_nj_njsla,
          state_nj_njsla_science, state_nj_njgpa and state_nj_parcc; the FL
          state tests state_fl_fast, state_fl_science, state_fl_eoc and
          state_fl_fsa; and the _unknown fallbacks. An open list. From spring
          2026, NJSLA and NJGPA are computer-adaptive, and no field separates
          adaptive from fixed-form scores. NJSLA Science did not change.

      - name: title
        data_type: string
        description: >-
          Display name of the assessment (Ed-Fi
          edFi_assessment.assessmentTitle).

      # Ed-Fi academic_subject_descriptor.
      - name: academic_subject
        data_type: string
        description: >-
          Subject tested; the vocabulary is per source. State tests: English
          Language Arts, Mathematics, Science, and course names for
          end-of-course tests (Algebra I, Geometry, Civics). i-Ready and STAR:
          Math and Reading, plus Early Literacy for STAR. DIBELS: Reading.
          Illuminate: course-level names, with no English Language Arts value;
          its ELA equivalent is Text Study, alongside Writing, English 100–400,
          CCR and AP courses, and math appears as Mathematics and course names
          such as Algebra I and Geometry. Distinct from the course's discipline.

      - name: category
        data_type: string
        description: >-
          Assessment category based on format and content (Ed-Fi
          assessment_category_descriptor). Examples: CMA, CGI for internal;
          NJSLA, FAST for state; SAT, ACT for college.

      - name: module_code
        data_type: string
        description: >-
          Code identifying the assessment within its source. Illuminate: the
          checkpoint code within a module type (for example QA1, MQQ2); one code
          spans every subject assessed in that round, and a small share of
          Illuminate assessments have none. State tests: subject and grade (for
          example ELA05, MAT08, ALG01; ELAGP and MATGP for NJGPA). i-Ready and
          STAR: the subject. DIBELS: Composite.

      - name: module_type
        data_type: string
        description: >-
          Illuminate module type. An open list: QA (Quick Assessments), MQQ
          (Multiple-Choice Quick Questions), CRQ (Constructed Response
          Questions), UA (Unit Assessment), TP, ET, WPP, and older types. What
          TP, ET and WPP stand for is not documented. Illuminate only; null for
          every other source.

      - name: grade_level_tested
        data_type: int64
        description: >-
          Grade the assessment targets; 0 is kindergarten. Illuminate and state
          tests only; null for every other source, for the NJSLA end-of-course
          tests (Algebra I, Geometry, Algebra II), and for a small share of
          Illuminate assessments.

      - name: is_internal_assessment
        data_type: boolean
        description: >-
          TRUE for Illuminate (KIPP-authored interims) only; FALSE for every
          other source, including the i-Ready, DIBELS and STAR diagnostics KIPP
          administers itself.

      - name: scope
        data_type: string
        description: >-
          Determines how scores link to students: enrollment (scores are tied to
          a section enrollment) or student (scores follow the student with no
          enrollment context, e.g., SAT, ACT, AP).

      - name: combined_academic_subject
        data_type: string
        description: >-
          Cross-test-family normalized bucket for comparing scores across SAT
          and ACT (e.g., EBRW and Reading combine into EBRW/Reading). Populated
          for college-entrance assessments; null for AP, state, and internal
          Illuminate rows.

      - name: aligned_academic_subject
        data_type: string
        description: >-
          Within-test-family normalized academic subject used for cross-test
          comparison (e.g., SAT EBRW and PSAT EBRW both align to EBRW). Ed-Fi
          academic_subject_descriptor alignment. Populated for college-entrance
          assessments; null for AP, state, and internal Illuminate rows.

      - name: credit_category
        data_type: string
        description: >-
          Ed-Fi credit_category_descriptor capturing graduation-requirement
          categorization (e.g., ENG, MATH, SCI). Populated for college-entrance
          assessments; null for AP, state, and internal Illuminate rows.

      - name: source_assessment_id
        data_type: int64
        description: >-
          Illuminate `assessment_id` for internal Illuminate assessments; null
          for state, college (Official + Practice), and AP rows. Used as a
          discriminator in `assessment_key` so distinct Illuminate assessments
          hash to different keys even when their other natural-key columns
          coincide.

      - name: test_type
        data_type: string
        description: >-
          `'Official'` for college-entrance assessments delivered by the test
          vendor (SAT, ACT, PSAT). `'Practice'` for mock administrations of the
          same assessments delivered through Illuminate. Null for Illuminate,
          state, and AP rows. Discriminator in `assessment_key` so Official and
          Practice sittings of the same test family don't collide.
