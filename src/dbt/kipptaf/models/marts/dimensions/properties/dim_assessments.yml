models:
  - name: dim_assessments
    description: >-
      Assessment definition dimension. One row per unique assessment definition.
      Covers internal assessments (Illuminate and Focus Assessments), vendor
      diagnostics (i-Ready, DIBELS, STAR), NJ and FL state assessments, and
      college-entrance assessments (SAT, ACT, AP). scope indicates whether
      scores are linked at the enrollment level or student level.

      Two subject-normalization columns coexist for college-entrance comparisons
      (both NULL for other assessment types):

      - `aligned_academic_subject` — **within-test-family** normalization.
        SAT EBRW and PSAT EBRW both align to EBRW. Use this when comparing
        scores across administrations of the same test family (e.g.,
        SAT-to-PSAT growth).
      - `combined_academic_subject` — **cross-test-family** normalization.
        Further collapses across test families so SAT and ACT scores can
        land in the same bucket (e.g., SAT EBRW and ACT Reading combine to
        EBRW/Reading). Use this for apples-to-oranges comparisons across
        test families.
    config:
      materialized: table
      meta:
        dagster:
          # Shares the whole assessment star's tick, not a slower one:
          # dim_assessment_administrations has an FK test to this model, and a
          # slower dim leaves a window where a new Illuminate assessment is in
          # administrations but not yet here. Rationale in
          # fct_assessment_scores_enrollment_scoped. Refs #4559, #4821
          automation_condition:
            cron_schedule: 30 0,10,13,15,17 * * *
    columns:
      - name: assessment_key
        data_type: string
        description: >-
          Surrogate key derived from type, module_code, source_assessment_id,
          and test_type. Primary key. For Illuminate and Focus Assessments,
          member-grained — one row per actual `assessment_id`. For
          state/college/AP, canonical (`source_assessment_id` is null).
          Drilldown from `dim_assessment_administrations` (canonical-grain) to
          this dim goes through `bridge_assessment_administration_members`.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique

      # Set as a literal in each union branch, so a new source branch must
      # name its family.
      - name: assessment_family
        data_type: string
        description: >-
          Kind of assessment, grouping the source system into 5 values —
          internal (illuminate and apex, the KIPP-authored interims from
          Illuminate and Focus Assessments); vendor_diagnostic (iready, dibels
          and star); state (every NJ and FL state test type); college (SAT, ACT
          and PSAT, Official and Practice); and ap.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [internal, vendor_diagnostic, state, college, ap]

      # NJ and FL state types stay separate so historical state assessments do
      # not collide on shared module_codes (for example ELA05).
      - name: type
        data_type: string
        description: >-
          Source-system category — illuminate and apex (KIPP-authored internal
          interims, from Illuminate and from Focus Assessments, Focus's Apex
          module); iready, dibels and star (vendor diagnostics); college (SAT,
          ACT and PSAT, Official and Practice); ap; the NJ state tests
          state_nj_njsla, state_nj_njsla_science, state_nj_njgpa and
          state_nj_parcc; the FL state tests state_fl_fast, state_fl_science,
          state_fl_eoc and state_fl_fsa; and the _unknown fallbacks. An open
          list. From spring 2026, NJSLA and NJGPA are computer-adaptive, and no
          field separates adaptive from fixed-form scores. NJSLA Science did not
          change.

      - name: title
        data_type: string
        description: >-
          Display name of the assessment (Ed-Fi
          edFi_assessment.assessmentTitle). For state tests, the test name, such
          as NJSLA, NJSLA Science, NJGPA, FAST or EOC.

      # Ed-Fi academic_subject_descriptor.
      - name: academic_subject
        data_type: string
        description: >-
          Subject tested; the vocabulary is per source. State tests: English
          Language Arts, Mathematics, Science, and course names for
          end-of-course tests (Algebra I, Algebra II, Geometry, Civics). i-Ready
          and STAR: Math and Reading, plus Early Literacy for STAR. DIBELS:
          Reading. Illuminate: course-level names, with no English Language Arts
          value; its ELA equivalent is Text Study, alongside Writing, English
          100–400, CCR and AP courses, and math appears as Mathematics and
          course names such as Algebra I and Geometry. Focus Assessments: Text
          Study, Mathematics, Science and Social Studies. College: Math, EBRW,
          Reading, English, Science, and score names such as Combined and
          Composite. AP: the course name (for example Biology, Calculus BC).
          Distinct from the course's discipline.

      - name: category
        data_type: string
        description: >-
          Assessment category based on format and content (Ed-Fi
          assessment_category_descriptor). Examples: CMA, CGI for internal;
          NJSLA, FAST for state; SAT, ACT for college.

      - name: module_code
        data_type: string
        description: >-
          Code identifying the assessment within its source. Illuminate and
          Focus Assessments: the checkpoint code within a module type (for
          example QA1, MQQ2), from tags set in the assessment app; one code
          spans every subject assessed in that round, and an untagged assessment
          has none. State tests: subject and grade (for example ELA05, MAT08,
          ALG01; ELAGP and MATGP for NJGPA). i-Ready and STAR: the subject.
          DIBELS: Composite. College: the test and score (for example sat_math,
          act_composite, psat10_ebrw). AP: the College Board exam number.

      - name: module_type
        data_type: string
        description: >-
          Module type of an internal assessment, from tags set in the assessment
          app. An open list: QA (Quick Assessments), MQQ (Multiple-Choice Quick
          Questions), CRQ (Constructed Response Questions), UA (Unit
          Assessment), TP (Test Prep Quiz), ET (Exit Ticket), WPP (Writing
          Process Piece), BL, and older types. Illuminate and Focus Assessments
          share the codes. Null for an untagged assessment and for every other
          source.

      - name: grade_level_tested
        data_type: int64
        description: >-
          Grade the assessment targets; 0 is kindergarten. Illuminate, Focus
          Assessments and state tests only; null for every other source, for the
          NJSLA end-of-course tests (Algebra I, Geometry, Algebra II), and for a
          small share of Illuminate and Focus Assessments tests.

      - name: is_internal_assessment
        data_type: boolean
        description: >-
          TRUE for the KIPP-authored interims, Illuminate and Focus Assessments;
          FALSE for every other source, including the i-Ready, DIBELS and STAR
          diagnostics KIPP administers itself.

      - name: scope
        data_type: string
        description: >-
          Determines how scores link to students: enrollment (scores are tied to
          a section enrollment) or student (scores follow the student with no
          enrollment context, e.g., SAT, ACT, AP).

      - name: combined_academic_subject
        data_type: string
        description: >-
          Cross-test-family normalized bucket for comparing scores across SAT
          and ACT (e.g., EBRW and Reading combine into EBRW/Reading). Populated
          for college-entrance assessments; null for every other source.

      - name: aligned_academic_subject
        data_type: string
        description: >-
          Within-test-family normalized academic subject used for cross-test
          comparison (e.g., SAT EBRW and PSAT EBRW both align to EBRW). Ed-Fi
          academic_subject_descriptor alignment. Populated for college-entrance
          assessments; null for every other source.

      - name: credit_category
        data_type: string
        description: >-
          Ed-Fi credit_category_descriptor capturing graduation-requirement
          categorization (e.g., ENG, MATH, SCI). Populated for college-entrance
          assessments; null for every other source.

      - name: source_assessment_id
        data_type: int64
        description: >-
          The source system's own assessment id for internal assessments
          (Illuminate and Focus Assessments); null for every other source. Each
          source numbers its assessments separately, so an id is unique only
          together with type. Used as a discriminator in `assessment_key` so
          distinct internal assessments hash to different keys even when their
          other natural-key columns coincide.

      - name: test_type
        data_type: string
        description: >-
          `'Official'` for college-entrance assessments delivered by the test
          vendor (SAT, ACT, PSAT). `'Practice'` for mock administrations of the
          same assessments delivered through Illuminate. Null for Illuminate,
          Focus Assessments, state, and AP rows. Discriminator in
          `assessment_key` so Official and Practice sittings of the same test
          family don't collide.

      - name: bucket_subject
        data_type: string
        description: >-
          Which of a student's buckets applies to scores on this assessment —
          Reading pairs with `dim_student_enrollments.ela_bucket`, Math with
          `math_bucket`, and null means no bucket applies (science, social
          studies, AP exam scores, combined and composite college scores, and
          internal subjects with no course subject crosswalk row). Internal
          assessments take it from the course subject crosswalk's discipline for
          their subject; state tests from their ELA or Math discipline; i-Ready
          from its subject; STAR is Math or else Reading; DIBELS is Reading;
          Official college scores from their credit category (ENG or MATH);
          Practice college scores from their subject (EBRW, English and Reading,
          or Math).

unit_tests:
  - name: test_bucket_subject_by_family
    description: >-
      Each family names the bucket that applies to its scores — internal
      assessments read the members model's crosswalk mapping, i-Ready reads its
      subject, Official college scores read the credit category, and Practice
      college scores read the subject area — and a score with no ELA or math
      bucket (science, combined) gets none.
    model: dim_assessments
    given:
      - input: ref("int_assessments__assessments_members")
        format: sql
        rows: |
          select
              9101 as assessment_id,
              'Text Study Quiz' as title,
              'Text Study' as subject_area,
              cast(null as string) as scope,
              'QA1' as module_code,
              'QA' as module_type,
              true as is_internal_assessment,
              'illuminate' as `source`,
              9101 as canonical_assessment_id,
              'Reading' as bucket_subject
          union all
          select
              9103, 'Science Quiz', 'Science', null, 'QA1', 'QA', true,
              'illuminate', 9103, null
      - input: ref("int_assessments__assessments_canonical")
        format: sql
        rows: |
          select
              'illuminate' as `source`,
              9101 as canonical_assessment_id,
              5 as grade_level
          union all
          select 'illuminate', 9103, 5
      - input: ref("int_assessments__state_nj_scores")
        rows: []
      - input: ref("int_fldoe__all_assessments")
        rows: []
      - input: ref("int_iready__diagnostic_results")
        rows:
          - subject: Math
            overall_scale_score: 450
          - subject: Reading
            overall_scale_score: 520
      - input: ref("stg_renlearn__star")
        rows: []
      - input: ref("int_amplify__all_assessments")
        rows: []
      - input: ref("int_assessments__college_assessment")
        rows:
          - scope: SAT
            subject_area: EBRW
            score_type: sat_ebrw
            aligned_subject: EBRW/Reading
            aligned_subject_area: EBRW
            course_discipline: ENG
      - input: ref("int_assessments__college_assessment_practice")
        rows:
          - scope: SAT
            subject_area: EBRW
            module_code: sat_ebrw
          - scope: SAT
            subject_area: Combined
            module_code: sat_combined
      - input: ref("int_assessments__ap_assessments")
        rows: []
    expect:
      rows:
        - type: illuminate
          test_type: null
          academic_subject: Text Study
          bucket_subject: Reading
        - type: illuminate
          test_type: null
          academic_subject: Science
          bucket_subject: null
        - type: iready
          test_type: null
          academic_subject: Math
          bucket_subject: Math
        - type: iready
          test_type: null
          academic_subject: Reading
          bucket_subject: Reading
        - type: college
          test_type: Official
          academic_subject: EBRW
          bucket_subject: Reading
        - type: college
          test_type: Practice
          academic_subject: EBRW
          bucket_subject: Reading
        - type: college
          test_type: Practice
          academic_subject: Combined
          bucket_subject: null
