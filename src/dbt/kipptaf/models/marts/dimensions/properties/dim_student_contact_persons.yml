models:
  - name: dim_student_contact_persons
    description: >-
      Contact person dimension. One row per unique student contact person. A
      parent (contact_1 or contact_2) shared across siblings appears once here
      (keyed by their real contact identity) and has one bridge_student_contacts
      row per student. Emergency contacts have no stable person record under the
      Finalsite 2+4 contact shape, so each is its own person keyed by student
      and contact slot. Person attributes (name, email, typed phones, home
      address) live on this dimension; the relationship and the emergency flags
      that vary per student-contact pair live on bridge_student_contacts.

    columns:
      - name: student_contact_person_key
        data_type: string
        description: >-
          Surrogate key for the contact person. Primary key for this dimension.
          For parents (contact_1 and contact_2) it is hashed from the district
          and the contact's real identity; for emergency contacts it is hashed
          from the district, student, and contact slot.
        constraints:
          - type: primary_key
            warn_unsupported: false
        data_tests:
          - unique
          - not_null

        config:
          meta:
            source_model: int_students__contacts
            column_role: primary_key

      - name: full_name
        data_type: string
        description: >-
          Full name of the contact person. Matches dim_students.full_name and
          dim_staff.full_name naming.

        config:
          meta:
            source_column: contact_name
            contains_pii: true

      - name: email
        data_type: string
        description: Current email address for the contact person. Null if none.

        config:
          meta:
            source_column: email_current
            contains_pii: true

      - name: phone_mobile
        data_type: string
        description: The contact's phone number typed as mobile or cell, if any.

        config:
          meta:
            contains_pii: true

      - name: phone_home
        data_type: string
        description: The contact's phone number typed as home, if any.

        config:
          meta:
            contains_pii: true

      - name: phone_daytime
        data_type: string
        description: >-
          The contact's phone number typed as daytime, if any. Always null for
          Finalsite-sourced regions, which have no daytime phone type.

        config:
          meta:
            contains_pii: true

      - name: phone_work
        data_type: string
        description: The contact's phone number typed as work, if any.

        config:
          meta:
            contains_pii: true

      - name: phone_primary
        data_type: string
        description: >-
          The contact's first or best phone number regardless of type — a
          fallback for phones the typed columns miss.

        config:
          meta:
            contains_pii: true

      - name: home_address
        data_type: string
        description: >-
          The contact's home address as a single string. Always null for
          emergency contacts, which carry no address.

        config:
          meta:
            source_column: address_home
            contains_pii: true

unit_tests:
  - name: test_dim_student_contact_persons_excludes_third_parent_slot
    description:
      Locks the exclusion of parent slots past contact_2. Before the slot filter
      was added, a contact_3 row fell into the emergency branch and was treated
      as an emergency contact rather than a parent. Feeds one contact_1, one
      contact_2, one contact_3, and one emergency_1 row for the same student;
      asserts contact_3 produces no person row while contact_1, contact_2, and
      emergency_1 all still appear -- the emergency row keyed by student and
      slot rather than dropped by the new filter.
    model: dim_student_contact_persons
    given:
      - input: ref('int_students__contacts')
        format: sql
        rows: |
          select
            500001 as student_number,
            'kippnewark' as _dbt_source_project,
            'contact_1' as contact_slot,
            'con1' as finalsite_contact_id,
            cast(null as string) as personid,
            'Jane Doe1' as contact_name,
            'jane1@example.com' as email_current,
            cast(null as string) as phone_mobile,
            cast(null as string) as phone_home,
            cast(null as string) as phone_daytime,
            cast(null as string) as phone_work,
            '+19170000001' as phone_primary,
            '1 Main St' as address_home
          union all
          select
            500001, 'kippnewark', 'contact_2', 'con2', cast(null as string),
            'Jane Doe2', 'jane2@example.com', cast(null as string),
            cast(null as string), cast(null as string), cast(null as string),
            '+19170000002', '1 Main St'
          union all
          select
            500001, 'kippnewark', 'contact_3', 'con3', cast(null as string),
            'Jane Doe3', 'jane3@example.com', cast(null as string),
            cast(null as string), cast(null as string), cast(null as string),
            '+19170000003', '1 Main St'
          union all
          select
            500001, 'kippnewark', 'emergency_1', cast(null as string),
            cast(null as string), 'Jane Doe4', cast(null as string),
            cast(null as string), cast(null as string), cast(null as string),
            cast(null as string), '+19170000004', cast(null as string)
    expect:
      rows:
        - { full_name: Jane Doe1, email: jane1@example.com }
        - { full_name: Jane Doe2, email: jane2@example.com }
        - { full_name: Jane Doe4, email: null }
