models:
  - name: dim_student_enrollments
    description: >-
      Student enrollment dimension. One row per student x school x academic year
      enrollment record. Each re-enrollment within a year is a distinct record
      identified by entrydate. Entry and exit dates bound each enrollment
      period. FK to dim_students, dim_locations, and dim_dates (role-playing via
      entry_date_key and exit_date_key).
    columns:
      - name: student_enrollment_key
        data_type: string
        description: >-
          Surrogate key derived from student_number, _dbt_source_project,
          academic_year, and entrydate. Primary key for this dimension — matches
          the uniqueness grain on int_students__student_enrollment_union.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique

      - name: student_key
        data_type: string
        description: >-
          Surrogate key derived from student_number. FK to dim_students.
        config:
          meta:
            foreign_key:
              to: ref('dim_students')
              to_columns: [student_key]
      - name: location_key
        data_type: string
        description: >-
          Surrogate key derived from location_clean_name. FK to dim_locations.
          Null when schoolid does not match any location in the crosswalk (e.g.,
          grade_level 99 placeholder schools).

        config:
          meta:
            foreign_key:
              to: ref('dim_locations')
              to_columns: [location_key]
      - name: entry_date_key
        data_type: date
        description: >-
          The date the student enrolled in school for the current enrollment.
          Indexed.

        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: entrydate
            foreign_key:
              to: ref('dim_dates')
              to_columns: [date_key]
      - name: exit_date_key
        data_type: date
        description: >-
          The date the student exited for the current/last enrollment. This is
          the day after a student-attended class. For example, if the last day
          the student is in school is a Wednesday, Thursdayis the exit day.
          Indexed.

        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: exitdate
            foreign_key:
              to: ref('dim_dates')
              to_columns: [date_key]
      - name: academic_year
        data_type: int64
        description: >-
          KIPP academic year (July start) in which this enrollment falls. The
          calendar year in which the academic year begins (e.g., 2025 for the
          2025-26 school year).

      - name: grade_level
        data_type: int64
        description: >-
          The grade the student is in. Since this is an integer: 0=Kindergarten
          1, -2=Preschool. Indexed.

        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: grade_level
      - name: graduation_year
        data_type: int64
        description: >-
          Student graduation year.

        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__studentcorefields
            source_column: graduation_year
      - name: is_retained_year
        data_type: boolean
        description: >-
          TRUE if the student repeated this grade level in the same school
          compared to the prior academic year.

      - name: year_in_network
        data_type: int64
        description: >-
          Count of years the student has been enrolled in the network. Populated
          on the student's primary enrollment stint per academic year; null on
          additional same-year stints (multi-stint students).

      - name: ela_bucket
        data_type: string
        description: >-
          The student's ELA bucket for the academic year — the latest stored
          assignment, or Bucket 4 when none is stored. Null before 2025-26 and
          on grade 99 rows. The same on every enrollment row of the year in a
          region. Use it when the subject being analyzed is ELA or reading; for
          assessments, pick ela_bucket or math_bucket by the assessment's
          bucket_subject.
        config:
          meta:
            contains_pii: true

      - name: math_bucket
        data_type: string
        description: >-
          The student's math bucket for the academic year — the latest stored
          assignment, or Bucket 4 when none is stored. Null before 2025-26 and
          on grade 99 rows. The same on every enrollment row of the year in a
          region. Use it when the subject being analyzed is math; for
          assessments, pick ela_bucket or math_bucket by the assessment's
          bucket_subject.
        config:
          meta:
            contains_pii: true

unit_tests:
  - name: unit_dim_student_enrollments_buckets
    description: >-
      Gives every enrollment row of a year the student's stored ELA and math
      bucket for that year and region, or Bucket 4 when none is stored; keeps
      same-number students in different regions apart; and leaves both buckets
      null before 2025-26 and on grade 99 rows.
    model: dim_student_enrollments
    given:
      - input: ref("int_students__student_enrollment_union")
        rows:
          - student_number: 5001
            _dbt_source_project: kippnewark
            academic_year: 2025
            entrydate: 2025-09-03
            exitdate: 2026-01-12
            schoolid: 101
            grade_level: 5
          - student_number: 5001
            _dbt_source_project: kippnewark
            academic_year: 2025
            entrydate: 2026-01-12
            exitdate: 2026-06-30
            schoolid: 101
            grade_level: 5
          - student_number: 5001
            _dbt_source_project: kippcamden
            academic_year: 2025
            entrydate: 2025-09-04
            exitdate: 2026-06-30
            schoolid: 201
            grade_level: 6
          - student_number: 5002
            _dbt_source_project: kippnewark
            academic_year: 2024
            entrydate: 2024-09-03
            exitdate: 2025-06-30
            schoolid: 101
            grade_level: 4
          - student_number: 5003
            _dbt_source_project: kippnewark
            academic_year: 2026
            entrydate: 2026-06-30
            exitdate: 2026-07-01
            schoolid: 999999
            grade_level: 99
          - student_number: 5004
            _dbt_source_project: kippnewark
            academic_year: 2026
            entrydate: 2026-09-02
            exitdate: 2027-06-30
            schoolid: 101
            grade_level: 12
      - input: ref("int_students__schools")
        rows: []
      - input: ref("int_students__bucket_assignments")
        rows:
          - academic_year: 2025
            _dbt_source_project: kippnewark
            student_number: 5001
            subject: Reading
            bucket: Bucket 2
          - academic_year: 2025
            _dbt_source_project: kippcamden
            student_number: 5001
            subject: Math
            bucket: Bucket 1
          - academic_year: 2024
            _dbt_source_project: kippnewark
            student_number: 5002
            subject: Reading
            bucket: Bucket 2
    expect:
      rows:
        - academic_year: 2025
          entry_date_key: 2025-09-03
          grade_level: 5
          ela_bucket: Bucket 2
          math_bucket: Bucket 4
        - academic_year: 2025
          entry_date_key: 2026-01-12
          grade_level: 5
          ela_bucket: Bucket 2
          math_bucket: Bucket 4
        - academic_year: 2025
          entry_date_key: 2025-09-04
          grade_level: 6
          ela_bucket: Bucket 4
          math_bucket: Bucket 1
        - academic_year: 2024
          entry_date_key: 2024-09-03
          grade_level: 4
          ela_bucket: null
          math_bucket: null
        - academic_year: 2026
          entry_date_key: 2026-06-30
          grade_level: 99
          ela_bucket: null
          math_bucket: null
        - academic_year: 2026
          entry_date_key: 2026-09-02
          grade_level: 12
          ela_bucket: Bucket 4
          math_bucket: Bucket 4
