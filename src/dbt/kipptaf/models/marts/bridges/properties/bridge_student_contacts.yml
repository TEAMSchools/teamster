models:
  - name: bridge_student_contacts
    description: >-
      Bridge resolving the many-to-many between students and their contact
      persons under the Finalsite 2+4 contact shape. One row per (student,
      contact person, contact slot). The relationship and the emergency flags
      that vary per student-contact pair live here; stable person attributes
      (name, email, phones, address) live on dim_student_contact_persons.
      Foreign keys to dim_students via student_key and to
      dim_student_contact_persons via student_contact_person_key.

    constraints:
      - type: primary_key
        columns: [student_key, student_contact_person_key, contact_slot]
        warn_unsupported: false

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_key
              - student_contact_person_key
              - contact_slot

    columns:
      - name: student_key
        data_type: string
        description: >-
          Surrogate key for the student. Foreign key to dim_students. Derived
          from the student number.
        config:
          meta:
            foreign_key:
              to: ref('dim_students')
              to_columns: [student_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_students')
                field: student_key

      - name: student_contact_person_key
        data_type: string
        description: >-
          Surrogate key for the contact person. Foreign key to
          dim_student_contact_persons.
        config:
          meta:
            foreign_key:
              to: ref('dim_student_contact_persons')
              to_columns: [student_contact_person_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_student_contact_persons')
                field: student_contact_person_key

      - name: relationship
        data_type: string
        description: The contact's relationship to the student.

      - name: contact_slot
        data_type: string
        description: >-
          Which contact this pairing represents — contact_1, contact_2, or
          emergency_1 through emergency_4.

      - name: is_emergency
        data_type: boolean
        description:
          True for every emergency slot. For contact_1/contact_2, false on the
          Finalsite branch by construction; a Miami PowerSchool priority-1
          contact keeps its own PowerSchool emergency flag and can be true.

      - name: is_pickup
        data_type: boolean
        description: >-
          Whether the contact is authorized to pick the student up. Null for
          Finalsite contact_1 and contact_2 rows.

      - name: is_custodial
        data_type: boolean
        description: >-
          Whether the contact has custody of the student. Null for Finalsite
          contact_1 and contact_2 rows.

      - name: is_household_member
        data_type: boolean
        description: >-
          Whether the student lives with the contact. Null for Finalsite
          contact_1 and contact_2 rows.

unit_tests:
  - name: test_bridge_student_contacts_excludes_third_parent_slot
    description:
      Locks the exclusion of parent slots past contact_2. Before the slot filter
      was added, a contact_3 row fell into the emergency branch and was exported
      with is_emergency true instead of being a parent. Feeds one contact_1, one
      contact_2, one contact_3, and one emergency_1 row for the same student;
      asserts contact_3 produces no bridge row while contact_1, contact_2, and
      emergency_1 all still appear -- emergency_1 still carrying is_emergency
      true rather than being dropped by the new filter.
    model: bridge_student_contacts
    given:
      - input: ref('int_students__contacts')
        format: sql
        rows: |
          select
            500001 as student_number,
            'kippnewark' as _dbt_source_project,
            'contact_1' as contact_slot,
            'con1' as finalsite_contact_id,
            cast(null as string) as personid,
            'parent' as relationship,
            false as is_emergency,
            cast(null as bool) as is_pickup,
            cast(null as bool) as is_custodial,
            cast(null as bool) as is_household_member
          union all
          select
            500001, 'kippnewark', 'contact_2', 'con2', cast(null as string),
            'parent', false, cast(null as bool), cast(null as bool),
            cast(null as bool)
          union all
          select
            500001, 'kippnewark', 'contact_3', 'con3', cast(null as string),
            'parent', false, cast(null as bool), cast(null as bool),
            cast(null as bool)
          union all
          select
            500001, 'kippnewark', 'emergency_1', cast(null as string),
            cast(null as string), 'neighbor', true, true, false, false
    expect:
      rows:
        - { contact_slot: contact_1, relationship: parent, is_emergency: false }
        - { contact_slot: contact_2, relationship: parent, is_emergency: false }
        - {
            contact_slot: emergency_1,
            relationship: neighbor,
            is_emergency: true,
          }
