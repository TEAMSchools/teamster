models:
  - name: bridge_assessment_expectations_student_scoped
    description: |
      Bridges internal assessment expectations that cannot be attributed to
      a student section enrollment to their student and assessment
      administration. Covers three classes: replacement assessments (which
      have no enrollment by definition), ES Writing in grades K-4
      Newark/Camden (where no PowerSchool course-enrollment row exists for
      the writing program), and Apex results whose student did not match
      exactly 1 section. Apex rows cover only students who tested, so every
      Apex expectation is met. Rows whose expectations can be attributed to a
      section enrollment live in `bridge_assessment_expectations_enrollment_scoped`.
    config:
      materialized: table
      meta:
        dagster:
          # Cron table instead of an eager view — rationale and tick choice
          # in fct_assessment_scores_enrollment_scoped. Refs #4821
          automation_condition:
            cron_schedule: 30 0,10,13,15,17 * * *
    columns:
      - name: assessment_expectation_key
        data_type: string
        description: Surrogate key. Primary key.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique

      - name: term_key
        data_type: string
        description: >-
          FK to dim_terms. Resolves via (region x administered_date x school)
          against the reporting terms sheet.
        config:
          meta:
            foreign_key:
              to: ref('dim_terms')
              to_columns: [term_key]

      - name: student_key
        data_type: string
        description: FK to dim_students.
        config:
          meta:
            foreign_key:
              to: ref('dim_students')
              to_columns: [student_key]

      - name: assessment_administration_key
        data_type: string
        description: FK to dim_assessment_administrations.
        config:
          meta:
            foreign_key:
              to: ref('dim_assessment_administrations')
              to_columns: [assessment_administration_key]

unit_tests:
  - name: test_bridge_assessment_expectations_student_scoped_drops_untagged_replacement
    description:
      A replacement row whose region is not tagged on the assessment has no
      administration in dim_assessment_administrations, so the bridge leaves it
      out. Feeds a tagged replacement row, an untagged replacement row, and a
      non-replacement row, whose is_region_tagged is null; asserts the untagged
      replacement row is dropped and the other two are kept. The scaffold's own
      unit test covers how is_region_tagged is computed.
    model: bridge_assessment_expectations_student_scoped
    given:
      - input: ref('int_assessments__scaffold')
        rows:
          - student_number: 1001
            source: illuminate
            assessment_id: 1
            administered_at: 2025-10-08
            region: Newark
            _dbt_source_project: kippnewark
            is_internal_assessment: true
            is_replacement: true
            is_region_tagged: true
            cc_dcid: null
            canonical_assessment_id: 1
          - student_number: 1002
            source: illuminate
            assessment_id: 1
            administered_at: 2025-10-08
            region: Paterson
            _dbt_source_project: kipppaterson
            is_internal_assessment: true
            is_replacement: true
            is_region_tagged: false
            cc_dcid: null
            canonical_assessment_id: 1
          - student_number: 1003
            source: illuminate
            assessment_id: 1
            administered_at: 2025-10-08
            region: Paterson
            _dbt_source_project: kipppaterson
            is_internal_assessment: true
            is_replacement: false
            is_region_tagged: null
            cc_dcid: null
            canonical_assessment_id: 1
      - input: ref('int_assessments__assessments_members')
        format: sql
        rows: |
          select
            'illuminate' as source,
            1 as assessment_id,
            'QA1' as module_code,
            2026 as academic_year
      - input: ref('int_assessments__assessments_canonical')
        format: sql
        rows: |
          select
            'illuminate' as source,
            1 as canonical_assessment_id,
            date '2025-10-08' as administered_date
      - input: ref('stg_google_sheets__reporting__terms')
        rows: []
    expect:
      rows:
        # trunk-ignore(gitleaks/generic-api-key): surrogate key fixture, not a secret
        - assessment_expectation_key: 26e913105f4ab32f98c5a17a5a538725
        # trunk-ignore(gitleaks/generic-api-key): surrogate key fixture, not a secret
        - assessment_expectation_key: 5e6753698640e0de72f3cf353f2d238e
  - name: test_bridge_assessment_expectations_student_scoped_keys_regional_group
    description:
      A sitting of copy 2 whose region's group is 1 hashes its administration
      key from group 1 and group 1's date, not from copy 2's own id and date.
      Copy 2 also leads a group of its own with a later date, so a key built
      from the copy would differ.
    model: bridge_assessment_expectations_student_scoped
    given:
      - input: ref('int_assessments__scaffold')
        rows:
          - student_number: 1001
            source: illuminate
            assessment_id: 2
            administered_at: 2026-01-28
            region: Newark
            _dbt_source_project: kippnewark
            is_internal_assessment: true
            is_replacement: true
            is_region_tagged: true
            cc_dcid: null
            canonical_assessment_id: 1
      - input: ref('int_assessments__assessments_members')
        format: sql
        rows: |
          select
            'illuminate' as source,
            2 as assessment_id,
            'QA1' as module_code,
            2026 as academic_year
      - input: ref('int_assessments__assessments_canonical')
        format: sql
        rows: |
          select
            'illuminate' as source,
            1 as canonical_assessment_id,
            date '2025-10-08' as administered_date
          union all
          select 'illuminate', 2, date '2026-01-28'
      - input: ref('stg_google_sheets__reporting__terms')
        rows: []
    expect:
      rows:
        # trunk-ignore(gitleaks/generic-api-key): surrogate key fixture, not a secret
        - assessment_administration_key: 8a0261c22795b67819aa3b1e8d559d22
