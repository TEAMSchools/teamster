      day, ending Tier 4, followed by a sixth day with zero membership carrying
      Tier 1. Every period row must report the fifth day's values -- Tier 4,
      chronically absent, truant -- proving two things at once --
      period_end_date_key is the last MEMBERSHIP day rather than the last day
      present, and the cumulative columns are read from exactly that row rather
      than from the period start, an aggregate, or the latest row in the bucket.

