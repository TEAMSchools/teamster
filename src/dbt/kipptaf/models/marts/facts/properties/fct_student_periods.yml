  - name: test_periods_gap_in_enrollment_does_not_carry_values_forward
    description: Ten membership days in September, a full calendar month with no
      rows at all in October, then five more in November. October must emit no
      row -- not a repeat of September's totals -- because a bucket with no
      membership day is dropped rather than carried. November reports fifteen
      cumulative days, so the gap neither resets the count to five nor freezes
      it at ten.

      Distinct from the carry-forward across break days on fct_student_days -- a
      break day is a row with zero membership, which leaves the running total
      unchanged, while a gap in enrollment is the absence of any row.
    model: fct_student_periods
    given:
      - input: ref('int_students__enrollment_days')
        format: sql
        rows: |
          select
            student_number,
            _dbt_source_project,
            calendardate,
          from unnest([
            struct<
              student_number int64, _dbt_source_project string,
              calendardate date
            >
            (1, 'kippnewark', date '2025-09-01'),
            (1, 'kippnewark', date '2025-09-02'),
            (1, 'kippnewark', date '2025-09-03'),
            (1, 'kippnewark', date '2025-09-04'),
            (1, 'kippnewark', date '2025-09-05'),
            (1, 'kippnewark', date '2025-09-06'),
            (1, 'kippnewark', date '2025-09-07'),
            (1, 'kippnewark', date '2025-09-08'),
            (1, 'kippnewark', date '2025-09-09'),
            (1, 'kippnewark', date '2025-09-10'),
            (1, 'kippnewark', date '2025-11-01'),
            (1, 'kippnewark', date '2025-11-02'),
            (1, 'kippnewark', date '2025-11-03'),
            (1, 'kippnewark', date '2025-11-04'),
            (1, 'kippnewark', date '2025-11-05')
          ])

      - input: ref('fct_student_days')
        format: sql
        rows: |
          select
            student_day_key,
            date_key,
