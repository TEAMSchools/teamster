          ])

    expect:
      format: sql
      rows: |
        select
          student_period_key,
          student_enrollment_key,
          term_key,
          academic_year,
          period_type,
          period_start_date_key,
          period_start_membership_date_key,
          period_end_date_key,
          n_membership_days_ytd,
          n_present_days_ytd,
          is_truant,
          ada_tier,
          is_chronically_absent,
        from unnest([
          struct<
            student_period_key string, student_enrollment_key string,
            term_key string,
            academic_year int64, period_type string, period_start_date_key date,
            period_start_membership_date_key date,
            period_end_date_key date, n_membership_days_ytd float64,
            n_present_days_ytd float64, is_truant bool,
            ada_tier string, is_chronically_absent bool
          >
          ('4c63e1617a32c43b1a19311bc66f3c12', '53b6a73797c6a5dadb03eb37053e45f4', null, 2025, 'year', date '2025-07-01', date '2025-09-01', date '2025-09-06', 6.0, 6.0, false, 'Tier 1', false),
          ('27c6f1c36f4368eb481fcf495685c2a0', '53b6a73797c6a5dadb03eb37053e45f4', null, 2025, 'month', date '2025-09-01', date '2025-09-01', date '2025-09-06', 6.0, 6.0, false, 'Tier 1', false),
          ('da4753748381ee38275c6a5649f378dc', '53b6a73797c6a5dadb03eb37053e45f4', null, 2025, 'week', date '2025-09-01', date '2025-09-01', date '2025-09-06', 6.0, 6.0, false, 'Tier 1', false),
          ('eb89d84900014832a74d4cbea609f9fc', '53b6a73797c6a5dadb03eb37053e45f4', null, 2025, 'year', date '2025-07-01', date '2025-09-08', date '2025-09-13', 12.0, 12.0, false, 'Tier 1', false),
          ('433a57fcce7a35d720d8581d54da5269', '53b6a73797c6a5dadb03eb37053e45f4', null, 2025, 'month', date '2025-09-01', date '2025-09-08', date '2025-09-13', 12.0, 12.0, false, 'Tier 1', false),
          ('c056370b02a9b117ef343dd8cc74d729', '53b6a73797c6a5dadb03eb37053e45f4', null, 2025, 'week', date '2025-09-08', date '2025-09-08', date '2025-09-13', 12.0, 12.0, false, 'Tier 1', false)
        ])

  - name: test_periods_mid_year_leaver_keeps_own_period_end
    description:
      Two students at one school in one month. One has five membership days, the
      other leaves after three. period_end_date_key is each student's own last
      membership day, not a shared calendar month end, so the two rows carry
      different end dates and different cumulative counts inside the same
      bucket.
    model: fct_student_periods
    given:
      - input: ref('int_students__enrollment_days')
        format: sql
        rows: |
          select
            student_number,
            _dbt_source_project,
            calendardate,
          from unnest([
