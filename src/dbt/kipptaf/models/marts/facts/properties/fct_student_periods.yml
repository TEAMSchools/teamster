  - name: test_periods_gap_in_enrollment_does_not_carry_values_forward
    description: Ten membership days in September, a full calendar month with no
      rows at all in October, then five more in November. October must emit no
      row -- not a repeat of September's totals -- because a bucket with no
      membership day is dropped rather than carried. November reports fifteen
      cumulative days, so the gap neither resets the count to five nor freezes
      it at ten.

      Distinct from the carry-forward across break days on fct_student_days -- a
