models:
  - name: fct_grades_gpa
    description: >-
      GPA periodic-snapshot fact table. One row per student enrollment x term.
      Contains term GPA, year-to-date GPA (weighted and unweighted), semester
      GPA, cumulative GPA, credit hours earned and attempted, and failing course
      count. Preserves history across terms with is_current flag to collapse to
      the most recent row per student x school. FK to dim_student_enrollments
      and dim_terms.
    columns:
      - name: grades_gpa_key
        data_type: string
        description: >-
          Surrogate key derived from student_number, _dbt_source_project,
          academic_year, entrydate, and term_name. Grain: one row per
          student_enrollment x term, per spec.
        constraints:
          - type: primary_key
            warn_unsupported: false
        data_tests:
          - unique

      - name: student_enrollment_key
        data_type: string
        description: >-
          FK to dim_student_enrollments. Surrogate key derived from
          student_number, _dbt_source_project, academic_year, and entrydate.
        config:
          meta:
            foreign_key:
              to: ref('dim_student_enrollments')
              to_columns: [student_enrollment_key]
      - name: term_key
        data_type: string
        description: >-
          FK to dim_terms. Surrogate key derived from type, code, name,
          start_date, region, and school_id of the matching reporting term. Null
          when the PowerSchool term / year / school does not map to a
          reporting-term record.
        config:
          meta:
            foreign_key:
              to: ref('dim_terms')
              to_columns: [term_key]

      - name: academic_year
        data_type: int64
        description: >-
          KIPP academic year (July start) in which this GPA snapshot falls.

      - name: semester
        data_type: string
        description: >-
          Semester code (S1 for Q1/Q2, S2 for Q3/Q4).

      - name: gpa_term
        data_type: float64
        description: >-
          Weighted GPA for this term only, calculated as weighted grade points
          divided by credit hours for the term.

      - name: gpa_ytd
        data_type: float64
        description: >-
          Year-to-date weighted GPA across all terms in the academic year.

      - name: gpa_ytd_unweighted
        data_type: float64
        description: >-
          Year-to-date unweighted GPA using the unweighted grade scale.

      - name: gpa_semester
        data_type: float64
        description: >-
          Semester-level weighted GPA across the two terms in the semester.

      - name: grade_avg_term
        data_type: float64
        description: >-
          Average percent grade across all courses for this term.

      - name: grade_avg_ytd
        data_type: float64
        description: >-
          Year-to-date average percent grade across all courses.

      - name: cumulative_gpa
        data_type: float64
        description: >-
          Cumulative weighted GPA across all stored end-of-year grades plus
          current year projected grades.

      - name: cumulative_gpa_unweighted
        data_type: float64
        description: >-
          Cumulative unweighted GPA across all stored and projected grades.

      - name: cumulative_gpa_projected
        data_type: float64
        description: >-
          Projected cumulative GPA including current year in-progress grades.

      - name: credit_hours_term
        data_type: float64
        description: >-
          Total credit hours for courses with grades in this term.

      - name: credit_hours_ytd
        data_type: float64
        description: >-
          Total credit hours for courses with Y1 grades in the academic year.

      - name: credit_hours_earned_cumulative
        data_type: float64
        description: >-
          Cumulative credit hours earned (passing grades) across all academic
          years.

      - name: credit_hours_attempted_cumulative
        data_type: float64
        description: >-
          Cumulative credit hours attempted (all enrolled courses) across all
          academic years.

      - name: n_failing_ytd
        data_type: int64
        description: >-
          Count of courses with a failing Y1 letter grade (F or F*) in the
          current academic year.

      - name: is_current
        data_type: boolean
        description: >-
          TRUE for the most recent row per student x school, ordered by yearid
          desc then term desc. Use this flag to collapse to the latest GPA state
          per student-school. For "active term today" filters, traverse term_key
          to dim_terms.is_current instead.

unit_tests:
  - name: fct_grades_gpa__one_row_per_term_for_two_stints
    description:
      A student with two enrollments at one school in one year gets one row per
      term, keyed to the later enrollment.
    model: fct_grades_gpa
    given:
      - input: ref('int_students__student_enrollment_union')
        format: sql
        rows: |
          select
            'kippnewark' as _dbt_source_project, 200 as schoolid,
            8400001 as student_number, date '2024-09-01' as entrydate,
            date '2025-01-10' as exitdate, 2025 as academic_year, 2 as rn_year
          union all
          select
            'kippnewark', 200, 8400001, date '2025-01-15', date '2025-06-30',
            2025, 1
      - input: ref('stg_google_sheets__reporting__terms')
        format: sql
        rows: |
          select
            'RT' as `type`, 'RT1' as code, 'Q1' as `name`,
            date '2024-09-01' as `start_date`, date '2024-11-01' as end_date,
            'Newark' as region, 999 as school_id, 'HS' as grade_band,
            35 as powerschool_year_id
      - input: ref('int_students__gpa_term')
        format: sql
        rows: |
          select
            'kippnewark' as _dbt_source_project, 200 as schoolid,
            2025 as academic_year, 8400001 as student_number, 35 as yearid,
            'Q1' as term_name, 'S1' as semester,
            cast(3.5 as float64) as gpa_term, cast(3.4 as float64) as gpa_y1,
            cast(3.3 as float64) as gpa_y1_unweighted,
            cast(3.45 as float64) as gpa_semester, 0 as n_failing_y1,
            cast(5.0 as float64) as total_credit_hours_term,
            cast(5.0 as float64) as total_credit_hours_y1,
            cast(90.0 as float64) as grade_avg_term,
            cast(89.0 as float64) as grade_avg_y1
      - input: ref('int_students__gpa_cumulative')
        format: sql
        rows: |
          select
            'kippnewark' as _dbt_source_project, 200 as schoolid,
            2025 as calculated_academic_year, 8400001 as student_number,
            1 as studentid,
            cast(3.2 as float64) as cumulative_y1_gpa,
            cast(3.1 as float64) as cumulative_y1_gpa_unweighted,
            cast(3.3 as float64) as cumulative_y1_gpa_projected,
            cast(20.0 as float64) as earned_credits_cum,
            cast(22.0 as float64) as potential_credits_cum
    expect:
      rows:
        # the later stint's key, md5 of 8400001-kippnewark-2025-2025-01-15
        # trunk-ignore(gitleaks/generic-api-key): surrogate key hash, not a secret
        - student_enrollment_key: 927163bea5309716a10a6a0ffd4b2a9e
          academic_year: 2025
          gpa_term: 3.5
          is_current: true
