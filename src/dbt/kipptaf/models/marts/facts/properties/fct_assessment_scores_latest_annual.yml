models:
  - name: fct_assessment_scores_latest_annual
    description: >-
      A student's latest overall score on a vendor benchmark assessment in an
      academic year. One row per student, academic year and assessment. Covers
      DIBELS composite today; other assessments join once their source sets
      is_latest_in_year in int_assessments__benchmark_scores. The row stores the
      latest result itself, so a consumer reads it without joining the
      score-level facts.
    config:
      materialized: table
      meta:
        dagster:
          # Same tick as the other assessment marts; rationale in
          # fct_assessment_scores_enrollment_scoped.
          automation_condition:
            cron_schedule: 30 0,10,13,15,17 * * *
    columns:
      - name: assessment_score_latest_annual_key
        data_type: string
        description: >-
          Surrogate key over student, academic year and assessment. Primary key.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique:
              config:
                severity: error
      - name: student_key
        data_type: string
        description: FK to dim_students.
        config:
          meta:
            foreign_key:
              to: ref('dim_students')
              to_columns: [student_key]
      - name: assessment_key
        data_type: string
        description: FK to dim_assessments.
        config:
          meta:
            foreign_key:
              to: ref('dim_assessments')
              to_columns: [assessment_key]
      - name: academic_year
        data_type: int64
        description: >-
          Starting calendar year of the school year the score falls in. Part of
          the grain.
      - name: test_date_key
        data_type: date
        description: >-
          FK to dim_dates. The date of the latest sitting in the year.
        config:
          meta:
            foreign_key:
              to: ref('dim_dates')
              to_columns: [date_key]
      - name: scale_score
        data_type: numeric
        description: Scale score of the latest sitting.
        config:
          meta:
            contains_pii: true
      - name: proficiency_level
        data_type: string
        description: >-
          Performance level of the latest sitting, as the vendor labels it.
        config:
          meta:
            contains_pii: true
      - name: proficiency_level_int
        data_type: int64
        description: >-
          Ordinal of proficiency_level, higher is stronger.
        config:
          meta:
            contains_pii: true
      - name: is_mastery
        data_type: boolean
        description: True when the latest sitting is at or above benchmark.
        config:
          meta:
            contains_pii: true
      - name: is_proficient
        data_type: boolean
        description: >-
          True when the latest sitting's level falls in the At/Above group.
        config:
          meta:
            contains_pii: true

unit_tests:
  - name: test_latest_overall_row_per_student_year
    description: >-
      Only the overall row flagged latest in its year is kept. An earlier
      sitting, a sub-measure row, and a row from a source that sets no flag are
      dropped.
    model: fct_assessment_scores_latest_annual
    given:
      - input: ref('int_assessments__benchmark_scores')
        format: sql
        rows: |
          select
              7 as student_number,
              2025 as academic_year,
              'dibels' as score_source,
              'Composite' as module_code,
              'overall' as response_type,
              date('2026-01-20') as test_date,
              cast(410 as numeric) as scale_score,
              'At Benchmark' as proficiency_level,
              3 as proficiency_level_int,
              true as is_mastery,
              true as is_proficient,
              true as is_latest_in_year
          union all
          select
              7, 2025, 'dibels', 'Composite', 'overall', date('2025-09-20'),
              cast(380 as numeric), 'Below Benchmark', 2, false, false, false
          union all
          select
              7, 2025, 'dibels', 'Composite', 'group', date('2026-01-20'),
              cast(40 as numeric), 'Below Benchmark', 2, false, false, true
          union all
          select
              7, 2025, 'iready', 'Reading', 'overall', date('2026-01-10'),
              cast(500 as numeric), 'Early On Grade', 4, true, true, null
    expect:
      rows:
        - {
            academic_year: 2025,
            test_date_key: 2026-01-20,
            proficiency_level: At Benchmark,
          }
