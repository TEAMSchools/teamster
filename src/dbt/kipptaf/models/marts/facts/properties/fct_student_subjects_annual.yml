models:
  - name: fct_student_subjects_annual
    description: >-
      A student's school-year status in ELA and math, as the DDI Suite filters
      read it. One row per student, academic year and discipline (ELA, Math),
      for every student enrolled that year. Holds the latest DIBELS composite
      level (ELA only), last school year's state test proficiency and the
      Florida FAST Low 25 flag.
    config:
      materialized: table
      meta:
        dagster:
          # Same tick as the other assessment marts; rationale in
          # fct_assessment_scores_enrollment_scoped.
          automation_condition:
            cron_schedule: 30 0,10,13,15,17 * * *
    columns:
      - name: student_subject_annual_key
        data_type: string
        description: >-
          Surrogate key over student, academic year and discipline. Primary key.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique:
              config:
                severity: error
      - name: student_key
        data_type: string
        description: FK to dim_students.
        config:
          meta:
            foreign_key:
              to: ref('dim_students')
              to_columns: [student_key]
      - name: academic_year
        data_type: int64
        description: >-
          Starting calendar year of the school year. Part of the grain.
      - name: discipline
        data_type: string
        description: The subject of the row, ELA or Math. Part of the grain.
      - name: latest_dibels_composite_level
        data_type: string
        description: >-
          The benchmark level of the student's latest DIBELS composite in the
          school year, as Amplify labels it. Null on Math rows and when the
          student has no composite that year.
        config:
          meta:
            contains_pii: true
            source_column: int_assessments__benchmark_scores.proficiency_level
      - name: prior_year_state_test_proficiency
        data_type: string
        description: >-
          The student's proficiency level on last school year's annual state
          test in this discipline, or No Test when there is none.
        config:
          meta:
            contains_pii: true
            source_column: int_assessments__state_scores.aggregated_proficiency
      - name: is_prior_year_low_25
        data_type: boolean
        description: >-
          TRUE if the student's score in this discipline on last spring's
          Florida FAST (PM3) ranks below the 25.5th percentile. Miami only;
          FALSE in NJ regions.
        config:
          meta:
            contains_pii: true
            source_column: int_assessments__fast_previous_year.fldoe_dynamic_percentile_rank

unit_tests:
  - name: test_fct_student_subjects_annual_by_discipline
    description: >-
      Gives each student 1 ELA and 1 Math row from the primary stint. A Miami
      student's state score matches on the Florida Education Identifier. DIBELS
      reaches only the ELA row, a missing state score reads No Test, the Low 25
      flag turns on below the 25.5th percentile, and a second stint adds no
      rows.
    model: fct_student_subjects_annual
    given:
      - input: ref("int_students__student_enrollments")
        format: sql
        rows: |
          select
              7 as student_number,
              2025 as academic_year,
              'kippmiami' as _dbt_source_project,
              'NJ7' as state_studentnumber,
              'S7' as fleid,
              1 as rn_year
          union all
          select 7, 2025, 'kippmiami', 'NJ7', 'S7', 2
      - input: ref("int_assessments__state_scores")
        format: sql
        rows: |
          select
              'S7' as state_student_id,
              2025 as benchmark_academic_year,
              'kippmiami' as _dbt_source_project,
              'Text Study' as illuminate_subject_area,
              true as is_annual_state_test,
              'Level 3' as aggregated_proficiency
      - input: ref("int_assessments__fast_previous_year")
        format: sql
        rows: |
          select
              7 as student_number,
              2025 as academic_year,
              'kippmiami' as _dbt_source_project,
              'Math' as discipline,
              0.2 as fldoe_dynamic_percentile_rank
          union all
          select 7, 2025, 'kippmiami', 'ELA', 0.6
      - input: ref("int_assessments__benchmark_scores")
        format: sql
        rows: |
          select
              7 as student_number,
              2025 as academic_year,
              'Composite' as module_code,
              'overall' as response_type,
              true as is_latest_in_year,
              'At Benchmark' as proficiency_level
          union all
          select 7, 2025, 'Composite', 'overall', false, 'Below Benchmark'
    expect:
      rows:
        - discipline: ELA
          latest_dibels_composite_level: At Benchmark
          prior_year_state_test_proficiency: Level 3
          is_prior_year_low_25: false
        - discipline: Math
          latest_dibels_composite_level: null
          prior_year_state_test_proficiency: No Test
          is_prior_year_low_25: true
