models:
  - name: fct_student_days
    description: >-
      One row per student per calendar day they were enrolled, network-wide.
      Enrollment decides which rows exist and attendance is joined onto them, so
      a day with no recorded attendance is still a row -- this is an enrollment
      surface and an attendance surface at once, which is why it is named for
      its grain rather than for either concept.

      Rows come from int_students__enrollment_days, whose day window is clamped
      to each school's own academic year. Break days are present and carry
      is_in_session_day = false with membership_value = 0 and no attendance, so
      a point-in-time question lands on any calendar date, weekend and holiday
      included, without a per-school anchor flag. Nothing on this fact is
      anchored -- pin a date instead.

      Miami is present for every year, unlike the model this replaced. The
      enrollment spine retains it and so does the school calendar, so Miami
      enrollment reconciles to Topline across history. Miami attendance before
      AY2026 is still absent, because #4803 dropped the frozen PowerSchool
      archive and Focus does not carry those years -- every Tableau attendance
      surface has the same gap. Those rows carry null attendance rather than a
      fabricated zero, and every rate on them already excludes null attendance
      from both numerator and denominator (#4744), so the gap cannot move a
      network rate. When Focus historical attendance is eventually modelled it
      fills in here with no change to this model.

      Location, school calendar, and academic year are reached via
      dim_student_enrollments and dim_terms, not stored on the fact. FK to
      dim_student_enrollments, dim_dates, and dim_terms.

      Three numeric measures coexist -- use the right one for the question:

      - `attendance_value` (0.0 to 1.0) is the raw fractional attendance
        contribution from the source SIS's attendance mode. Null when no
        attendance was recorded, including on every break day.
      - `membership_value` (0.0 to 1.0) is the fractional enrollment claim on
        the day -- a half-day membership counts 0.5. Zero on every break day.
        One row per student per day: no student has ever held two overlapping
        enrollment stints in one source project (0 overlapping pairs across
        112,825 stints), which is why `student_day_key` can hash student,
        project and date alone.
      - `present_weight` is like `attendance_value` but tardies weight 0.67.
        Use it when a tardy should count as partial presence, not full.

      For ADA, divide the sum of `attendance_value` by the sum of
      `membership_value` over days where `attendance_value` is not null. Use the
      `is_*` flags for categorical breakdowns, or `attendance_category` for a
      single GROUP BY axis.
    config:
      materialized: table
      # Monthly, not daily: 7,058 distinct dates are already in the fact and it
      # gains ~180 a year, so daily partitioning would pass BigQuery's 4,000
      # limit inside a decade. Monthly is 246 partitions today.
      #
      # This only pays off for a filter on the fact's OWN date_key, which is
      # what student_days.attendance_date compiles to. A filter on
      # dates.date_day lands on dim_dates instead and cannot prune this table,
      # so the view's description routes point-in-time questions to
      # attendance_date. Measured on the dev build, single-date network
      # headcount through student_days_view, identical results both ways:
      #
      #   dates_date_day    1,257 MiB   23.7-82.1 slot-seconds
      #   attendance_date      63 MiB    0.66-0.95 slot-seconds
      #
      # A CAST around the partitioning column does NOT block pruning --
      # verified against a partitioned table, bare and CAST-wrapped predicates
      # both read 34,224 bytes against 38,659,756 unfiltered -- which is why
      # attendance_date's CAST(date_key AS TIMESTAMP) is still prunable.
      #
      # The 63 MiB that survives is almost entirely dim_dates: reading its
      # date_key, date_timestamp and academic_year costs 67 MiB on its own,
      # because the spine runs to 9999 (#5094). Bounding it there takes this
      # query the rest of the way down; nothing else here will.
      partition_by:
        field: date_key
        data_type: date
        granularity: month
      meta:
        dagster:
          # Cube is the only exposure on this mart, and it is the deepest view
          # chain the attendance cubes read. Safe to materialize since
          # bae9382fb moved every mart FK to config.meta, which retired the
          # #4587 CTAS-DDL failure class. Scope is this model alone: cd858d891
          # set the precedent of materializing domain-specific marts and
          # leaving conformed dims as views.
          #
          # 06:00 and 15:00 are the attendance dashboard's observed
          # materialization times across 12 consecutive runs, so they are when
          # attendance data actually lands. LOCAL hours, not UTC — the dbt
          # translator passes the code location's LOCAL_TIMEZONE
          # (America/New_York).
          automation_condition:
            cron_schedule: 0 6,15 * * *
    columns:
      - name: student_day_key
        data_type: string
        description: >-
          Surrogate key derived from student_number, _dbt_source_project, and
          calendardate. Primary key for this fact.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique

      - name: student_enrollment_key
        data_type: string
        description: >-
          FK to dim_student_enrollments. Surrogate key derived from
          student_number, _dbt_source_project, academic_year, and entrydate.
        config:
          meta:
            foreign_key:
              to: ref('dim_student_enrollments')
              to_columns: [student_enrollment_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_student_enrollments')
                field: student_enrollment_key
              config:
                # Baseline, not a target. 2,286 rows across 15 enrollment keys
                # predate the Focus cutover and are unrelated to it: 10 Newark
                # stints (AY2016-2024), 4 Camden (AY2020, AY2023), 1 Paterson
                # (AY2025). #4803 took this from 155,863 down to the residue by
                # dropping the frozen Miami PowerSchool archive, whose 153,577
                # AY2025 rows keyed to enrollment records Focus re-dated. Warn
                # above the residue so a NEW orphan source stays visible; do
                # not raise the threshold to silence one.
                warn_if: ">2286"
      - name: date_key
        data_type: date
        description: >-
          Calendar date of the attendance record. FK to dim_dates.
        config:
          meta:
            foreign_key:
              to: ref('dim_dates')
              to_columns: [date_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key
      - name: term_key
        data_type: string
        description: >-
          FK to dim_terms. Surrogate key derived from (term_type, term_code,
          term_name, term_start_date, region, school_id) via left join to
          stg_google_sheets__reporting__terms on (schoolid, term,
          academic_year). Null when the attendance row's term does not appear in
          the terms sheet for that school-year.
        config:
          meta:
            foreign_key:
              to: ref('dim_terms')
              to_columns: [term_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_terms')
                field: term_key

      - name: attendance_code
        data_type: string
        description: >-
          Attendance identifier set by school. Examples Tardy, Absent, etc.

        config:
          meta:
            source_system: PowerSchool + Focus
            source_model: int_students__attendance_daily
            source_column: att_code
      - name: attendance_value
        data_type: float64
        description: >-
          Daily attendance value — a real number, typically a fraction of 1
          where 1 is a full attendance day. Used with membership_value to
          compute ADA. Precision depends on the source SIS's attendance mode
          (full-day vs period-level vs day-part); see source_model for
          provenance.

        config:
          meta:
            source_system: PowerSchool + Focus
            source_model: int_students__attendance_daily
            source_column: attendancevalue
      - name: membership_value
        data_type: float64
        description: >-
          The amount of a student's membership this school claims. If a student
          attends more than one school each one will only be able to claim a
          certain portion of the membership. The largest number for this will
          usually be 1 and fractions expressed as decimals. Like .5 or .25.

        config:
          meta:
            source_system: PowerSchool + Focus
            source_model: int_students__attendance_daily
            source_column: membershipvalue
      - name: present_weight
        data_type: float64
        description: >-
          Weighted presence value. 0.67 for tardy (T-prefix codes), otherwise
          equals attendance_value. Fractional by design — not a 0/1 flag.

      - name: is_truant
        data_type: boolean
        description: >-
          TRUE if the student meets regional truancy criteria. Miami: 15+
          absences in 90-day rolling window. NJ regions: projected absences
          reach 50+ for the year.

          Carried forward across days with no recorded attendance, so a break
          day answers with the value from the last day that recorded any. This
          is a status rather than an event, so the carry matches how
          n_membership_days_ytd and ada_tier behave on the same row; without it
          a pinned Saturday would return a chronic-absence tier beside a null
          truancy flag. Consequence: on a session day whose register was never
          taken this reports the prior value rather than null.

      - name: is_absent
        data_type: int64
        description: >-
          1 if the student was absent, 0 if present. Sum-friendly flag.

      - name: is_tardy
        data_type: int64
        description: >-
          1 if the student was tardy (T-prefix attendance code), 0 otherwise.
          Null for Focus-sourced Miami rows — Focus records tardies only at
          period grain. See #4927.

      - name: is_ontime
        data_type: int64
        description: >-
          1 if the student arrived on time (non-tardy), 0 if tardy. Null for
          Focus-sourced Miami rows. See #4927.

      - name: is_oss
        data_type: int64
        description: >-
          1 if the student received out-of-school suspension on this date (OS,
          OSS, OSSP, SHI codes), 0 otherwise. Null for Focus-sourced Miami rows
          — Focus carries no suspension codes. See #4927.

      - name: is_iss
        data_type: int64
        description: >-
          1 if the student received in-school suspension on this date (S, ISS
          codes), 0 otherwise. Null for Focus-sourced Miami rows. See #4927.

      - name: is_suspended
        data_type: int64
        description: >-
          1 if the student was suspended (any type) on this date. Union of
          is_oss and is_iss codes. Null for Focus-sourced Miami rows. See #4927.

      - name: attendance_category
        data_type: string
        description: >-
          Coarse attendance category derived from the is_* flags with priority
          ordering (suspension > absent > tardy > present). Values:
          Out-of-School Suspension, In-School Suspension, Absent, Tardy,
          Present. Use this column for GROUP BY in BI tools; use the raw
          attendance_code for specific-code drill-down. Null when no attendance
          row joined -- a break day, or a session day whose register was never
          taken. Null means unknown, never Present.

      - name: is_in_session_day
        data_type: boolean
        description: >-
          Whether school was in session for this student's school on this day.
          False on every carried break day. A false row carries enrollment but
          no attendance and a membership_value of zero, so it can never reach a
          rate denominator.

      - name: location_key
        data_type: string
        description: >-
          FK to dim_locations, the school this row's enrollment stint belongs
          to. Every cumulative column below accumulates per location_key,
          because a rate reported at any other grain is a different number and a
          student who transfers mid-year starts a fresh count at the new school.
        config:
          meta:
            foreign_key:
              - dim_locations.location_key

      - name: academic_year
        data_type: int64
        description: >-
          Academic year of this row's enrollment stint, expressed as the
          calendar year in which the year ends. Sourced from the enrollment
          spine rather than from dim_dates, whose academic_year is a pure July 1
          calendar cutover and can disagree at a June 30 / July 1 boundary.
          Partitions every cumulative column below.

      - name: week_start_monday
        data_type: date
        description: >-
          Monday of the school week containing this date, from
          int_students__calendar_week and therefore school-specific. Carried on
          this fact because a school week's Monday has no formula -- unlike the
          academic year (July 1) or the month (date_trunc) -- so week-grain
          bucketing downstream cannot be derived from date_key alone.

      - name: n_membership_days_ytd
        data_type: float64
        description: >-
          Membership days accumulated from the start of the academic year at
          this school, through and including this date. Counts only days with
          membership_value = 1 AND a recorded attendance_value, so a day with an
          untaken register raises neither this nor n_present_days_ytd.

          Unchanged across break days: a break day contributes zero, so the
          running total carries. That is what lets a chronic-absence question
          resolve on any calendar date without an anchor flag.

          float64 rather than an integer type because it accumulates
          membership_value, which is fractional. The arithmetic is exact for the
          values in play -- membership_value is 1 or 0.5, so products are dyadic
          and well inside 2^53 -- so the tier boundaries below are
          deterministic.

      - name: n_present_days_ytd
        data_type: float64
        description: >-
          Attendance value accumulated from the start of the academic year at
          this school, through and including this date, over the same days
          n_membership_days_ytd counts. Divide by n_membership_days_ytd for
          cumulative ADA as of this date; that is a different number from the
          day-weighted ADA over a date range, which sums both sides over the
          slice instead.

      - name: is_ca_eligible
        data_type: boolean
        description: >-
          Whether n_membership_days_ytd has reached 10, the KIPP Foundation
          chronic-absence eligibility floor. All three reconciliation
          authorities define eligibility cumulatively from the start of the
          academic year rather than per period, which is why this reads the ytd
          column and not a per-day one. Early in an academic year most rows are
          false, and any rate built on this fact must show the eligible count
          beside it.

      - name: ada_tier
        data_type: string
        description: >-
          Cumulative ADA band as of this date, on accumulated integer counts
          cross-multiplied against each other -- never on an averaged float,
          which would put boundary students on the wrong side of the line. Tier
          1 at 95% and above, Tier 2 strictly above 90.0%, Tier 3 from 80%
          through 90.0% inclusive, Tier 4 below 80%. Null when
          n_membership_days_ytd is zero.

          Exactly 90.0% is Tier 3, and therefore chronically absent. KIPP
          Foundation criteria contradict themselves here -- item 1 calls Tier 2
          on track at 90% and above, item 8 defines chronic absence as at or
          below 90.0% -- and this follows item 8 and the state criteria. See the
          model description.

          This is the only place in the project where the tier ladder is
          expressed. fct_student_periods reads this column at period end rather
          than recomputing it, so the two facts cannot disagree.

      - name: is_chronically_absent
        data_type: boolean
        description: >-
          Whether ada_tier is Tier 3 or Tier 4 as of this date. Derived solely
          from ada_tier, never recomputed from a ratio, so the flag and the tier
          cannot drift apart. Null when ada_tier is null.

          Read this with is_ca_eligible: a student below the 10-membership-day
          floor still carries a tier and this flag, and every published rate
          filters on eligibility. This column alone is not a chronic-absence
          rate numerator.
