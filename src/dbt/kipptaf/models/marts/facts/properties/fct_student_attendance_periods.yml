  - name: test_periods_gap_in_enrollment_does_not_carry_values_forward
    description:
      Ten membership days in September, a full calendar month with zero
      membership days in October, then five more in November. The spec forbids
      carrying a value forward across a gap, so October must emit no row at all
      -- not a repeat of September's totals -- and November's cumulative counts
      must add its own five days onto September's ten (15), neither resetting to
      five nor freezing at ten. week_start_monday is held constant per
      membership block so each block collapses to one week row.
