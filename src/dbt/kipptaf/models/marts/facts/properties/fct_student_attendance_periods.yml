        union all
        select
          'c68f8476a3d8502bba9c5c6bd4e6ac04', 'eccbc87e4b5ce2fe28308fd9f2a7baf3',
          'loc-abc', 2025, 'month', date '2025-09-01', date '2025-09-09',
          9.0, 9.0, false, false, 'Tier 1', false
        union all
        select
          'bd64db5718f8ce814d11702539c835c3', 'eccbc87e4b5ce2fe28308fd9f2a7baf3',
          'loc-abc', 2025, 'week', date '2025-09-01', date '2025-09-09',
          9.0, 9.0, false, false, 'Tier 1', false
        union all
        select
          '5ca59b51559577d9280fcf75dd346e83', 'eccbc87e4b5ce2fe28308fd9f2a7baf3',
          'loc-abc', 2025, 'year', date '2025-07-01', date '2025-09-09',
          9.0, 9.0, false, false, 'Tier 1', false

  - name: test_periods_ninety_point_zero_one_is_not_chronically_absent
    description:
      The threshold is at or below 90.0 percent, so just above it is not
      chronically absent. 91 of 101 present is 90.099 percent. Fixed at
      week_start_monday = 2025-09-01 for the entire span, so the whole 101 days
      collapse into one week row; month rows still split by real calendar month
      (September through December).
    model: fct_student_attendance_periods
    given:
      - input: ref('int_students__attendance_daily')
        format: sql
        rows: |
          select
            1 as student_number,
            'kippnewark' as _dbt_source_project,
            100 as schoolid,
            2025 as academic_year,
            d as calendardate,
            date '2025-09-01' as week_start_monday,
            1.0 as membershipvalue,
            if(
              d <= date_add(date '2025-09-01', interval 9 day), 0.0, 1.0
            ) as attendancevalue,
            false as is_truant
          from unnest(generate_date_array(
            date '2025-09-01', date '2025-12-10'
          )) as d
      - input: ref('int_students__schools')
        format: sql
        rows: |
          select
            100 as school_number,
            'kippnewark' as _dbt_source_project,
            'loc-abc' as location_key
    expect:
      format: sql
      rows: |
        select
          '7aebaabbe95966aa7ecf44dfaadfc907' as student_attendance_period_key,
          'c4ca4238a0b923820dcc509a6f75849b' as student_key,
          'loc-abc' as location_key,
          2025 as academic_year,
          'month' as period_type,
          date '2025-09-01' as period_start_date_key,
          date '2025-09-30' as period_end_date_key,
          30.0 as n_membership_days_ytd,
          20.0 as n_present_days_ytd,
          false as is_truant,
          true as is_ca_eligible,
          'Tier 4' as ada_tier,
          true as is_chronically_absent
        union all
        select
          '4cdf075f9ff7549905c68d4a795be9c0', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'month', date '2025-10-01', date '2025-10-31',
          61.0, 51.0, false, true, 'Tier 3', true
        union all
        select
          '6a79e9dc11b65d95ddbd99dbc282a088', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'month', date '2025-11-01', date '2025-11-30',
          91.0, 81.0, false, true, 'Tier 3', true
        union all
        select
          '6a03abbc4acbc01bf6a8760b084a2479', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'month', date '2025-12-01', date '2025-12-10',
          101.0, 91.0, false, true, 'Tier 2', false
        union all
        select
          'aad1f8789d1fc2caf330aa3b9cb39a95', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'week', date '2025-09-01', date '2025-12-10',
          101.0, 91.0, false, true, 'Tier 2', false
        union all
        select
          'c9c03fc4e2407c5b2413176ea5f75ac4', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'year', date '2025-07-01', date '2025-12-10',
