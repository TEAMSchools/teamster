models:
  - name: fct_student_attendance_periods
    description: >-
      Student attendance period-snapshot fact. One row per student x location x
      period type x period start date, accumulating membership and presence over
      the period to date. Sourced from int_students__attendance_daily joined to
      int_students__schools for location_key — never joined through
      dim_student_enrollments, which drops 8.5% of rows. A period with no
      membership day produces no row; period_end_date_key is the last membership
      day observed, which can fall short of the period's calendar end for an
      in-progress period. Populated for year, month, and week period types.

      Eligibility (is_ca_eligible) is cumulative from the start of the academic
      year, so early periods carry a much smaller eligible count than later ones
      — this is expected, not broken data. Example: by August 31 of AY2025, the
      maximum membership days any student had reached was 8, so zero students
      were CA-eligible that month — August has no chronic-absence rate at all,
      not a small one — while 9,174 student-school pairs already had at least
      one attendance day. Cumulative through September 30, eligible reached
      9,236 against 9,381 student-school pairs with any attendance day (17.8%);
      through October 31, eligible reached 9,328 (18.3%). All three
      reconciliation authorities define eligibility this way, and KIPP
      Foundation chronic-absence criteria item 1 already requires the
      eligible-student count to be shown beside the rate — display it alongside
      any rate derived from this fact, especially for the first weeks or first
      month of an academic year.

      AY2025 and earlier cover Camden, Newark, and Paterson only — Miami is
      present starting AY2026. Miami migrated from PowerSchool to Focus, and
      Focus re-dated 959 of Miami's AY2025 enrollment stints, leaving 153,577
      fact rows pointed at enrollment records dim_student_enrollments no longer
      holds; re-keying from Focus dates was measured and rejected, so the frozen
      PowerSchool attendance archive was dropped rather than kept misaligned
      (#4803). This is the accepted outcome of the Focus cutover, not missing
      data.

      Paterson's attendance_value depends on PowerSchool attendance-conversion
      items that #4193 reports as incomplete, so every value this fact derives
      from presence (n_present_days_ytd, ada_tier, is_chronically_absent, and
      truancy) carries a known upstream uncertainty for Paterson. #4193
      describes the effect as Paterson ADA reading artificially low, but the
      AY2025 aggregates show no obvious distortion — Paterson ADA is 92.7 to
      93.4 percent by school, in line with Newark at 92.5 — so treat the size
      and direction as unestablished rather than measured. membership_value is
      clean, so n_membership_days_ytd and is_ca_eligible are unaffected.

      Mid-year leavers are included by design — a student who withdraws mid-year
      still accumulates through their last membership day and counts in the year
      row. The legacy fct_student_attendance_daily year-end anchor excluded a
      student whose enrollment_status was Transferred Out, but only within the
      CURRENT academic year (its predicate was enrollment_status != 'Transferred
      Out' OR NOT is_current_academic_year, so the exclusion never applied to a
      prior year). That half of the predicate never fired during the AY2025
      reconciliation, because AY2025 was not the current academic year while the
      reconciliation ran — so the reconciliation could not size this difference,
      and a live comparison against the legacy path for the CURRENT academic
      year (what an AY2026 dashboard will actually show) will differ by an
      amount no bridge has sized.
    config:
      materialized: table
      meta:
        dagster:
          # Table, not the marts-default view. Every attendance-star model in
          # prod is a view today, so a Cube query re-expands the whole chain —
          # the #4333 defect that #4468 fixed for the assessment star. Cron
          # rather than eager: the upstreams are eager and would drive
          # repeated rebuilds of a 3.6M row model for no freshness anyone
          # consumes. Ticks match fct_student_attendance_daily exactly
          # (0 6,15 * * *), not the midnight tick this comment used to name —
          # both facts derive from int_students__attendance_daily, and this
          # model is now Cube's only chronic-absence/tier/truancy source, so a
          # split cron would let the two facts disagree on the same attendance
          # values for up to ~15 hours a day. Aligning them keeps that "both
          # derive from the same upstream, so they agree" property true after
          # Task 4b materialized the daily fact as a table. The KIPP
          # Foundation criteria only require a nightly refresh floor; this
          # tick clears that floor same as before.
          automation_condition:
            cron_schedule: 0 6,15 * * *
    columns:
      - name: student_attendance_period_key
        data_type: string
        description: >-
          Surrogate key derived from student_number, _dbt_source_project,
          location_key, academic_year, period_type, and period_start_date_key.
          academic_year is required: week's period_start_date_key
          (week_start_monday) can carry two different academic years across a
          June 30 / July 1 school-week boundary, so omitting it lets one
          calendar week collide into a single row across two academic years.
          Primary key for this fact.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique

      - name: student_key
        data_type: string
        description: >-
          FK to dim_students. Derived from student_number.
        config:
          meta:
            foreign_key:
              to: ref('dim_students')
              to_columns: [student_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_students')
                field: student_key

      - name: location_key
        data_type: string
        description: >-
          FK to dim_locations. Resolved from int_students__schools joined on
          schoolid = school_number and _dbt_source_project — never through
          dim_student_enrollments.
        config:
          meta:
            foreign_key:
              to: ref('dim_locations')
              to_columns: [location_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: location_key

      - name: period_start_date_key
        data_type: date
        description: >-
          FK to dim_dates. First calendar date of the period. For period_type =
          'year', the academic year's July 1 start date, regardless of the
          student's actual entry date. For 'month', the first day of the
          calendar month. For 'week', the PowerSchool school week's Monday
          (week_start_monday), not a derived ISO week.
        config:
          meta:
            foreign_key:
              to: ref('dim_dates')
              to_columns: [date_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key

      - name: period_end_date_key
        data_type: date
        description: >-
          FK to dim_dates. Last membership day (membershipvalue = 1) observed
          within the period, not the period's calendar end date. For an
          in-progress period this is capped by the membership days that have
          occurred so far, not a future scheduled end.
        config:
          meta:
            foreign_key:
              to: ref('dim_dates')
              to_columns: [date_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key

      - name: academic_year
        data_type: int64
        description: >-
          Academic year the period belongs to, from
          int_students__attendance_daily.academic_year.

      - name: period_type
        data_type: string
        description: >-
          Period grain for this row: 'year', 'month', or 'week'.

      - name: n_membership_days_ytd
        data_type: float64
        description: >-
          Count of full membership days (membershipvalue = 1) with a recorded
          attendance value, accumulated from the start of the academic year
          through period_end_date_key — not within the period.

      - name: n_present_days_ytd
        data_type: float64
        description: >-
          Sum of attendancevalue on full membership days (membershipvalue = 1)
          with a recorded attendance value, accumulated from the start of the
          academic year through period_end_date_key — not within the period.

      - name: is_truant
        data_type: boolean
        description: >-
          Truancy status as of period_end_date_key, read from
          int_students__attendance_daily on that same date. Regional truancy
          criteria (Miami: 15 or more absences in a 90-day window; the NJ
          regions: a projected 50 or more for the year) are computed upstream
          and carried through unchanged here. Cube's truancy measures built on
          this column additionally filter to is_ca_eligible — the
          chronic-absence membership-day floor — which neither regional truancy
          rule requires on its own.

      - name: is_ca_eligible
        data_type: boolean
        description: >-
          TRUE when n_membership_days_ytd is 10 or more — the KIPP Foundation
          chronic-absence eligibility floor, evaluated cumulatively at the
          individual school (location_key), not within a single period.

      - name: ada_tier
        data_type: string
        description: >-
          Attendance tier from cumulative n_present_days_ytd over
          n_membership_days_ytd, compared as integer day counts rather than a
          rounded percentage so the boundary at exactly 90.0 percent sorts
          deterministically: Tier 1 is 95 percent and above; Tier 2 is strictly
          above 90.0 percent and below 95 percent; Tier 3 is 80 percent through
          90.0 percent inclusive; Tier 4 is below 80 percent. Null when
          n_membership_days_ytd is 0.

      - name: is_chronically_absent
        data_type: boolean
        description: >-
          Derived from ada_tier (Tier 3 or Tier 4), never computed as an
          independent comparison against the 90.0 percent threshold — the two
          are the same fact stated once, so they cannot disagree at exactly 90.0
          percent the way two separately-evaluated expressions did.

unit_tests:
  - name: test_periods_year_accumulates_all_membership_days
    description:
      One student, one school, three membership days in AY2025. The year row
      must accumulate every day and end on the last membership day, not the last
      calendar day. The same three days fall in a single month and a single
      school week, so the month and week rows accumulate identically to the year
      row here — the distinguishing month/year-to-date behavior is covered by
      test_periods_month_accumulates_year_to_date below.
    model: fct_student_attendance_periods
    given:
      - input: ref('int_students__attendance_daily')
        format: sql
        rows: |
          select
            123456 as student_number,
            'kippnewark' as _dbt_source_project,
            100 as schoolid,
            2025 as academic_year,
            date '2025-09-02' as calendardate,
            date '2025-09-01' as week_start_monday,
            1.0 as membershipvalue,
            1.0 as attendancevalue,
            false as is_truant
          union all
          select
            123456, 'kippnewark', 100, 2025, date '2025-09-03',
            date '2025-09-01', 1.0, 0.0, false
          union all
          select
            123456, 'kippnewark', 100, 2025, date '2025-09-04',
            date '2025-09-01', 1.0, 1.0, false
      - input: ref('int_students__schools')
        format: sql
        rows: |
          select
            100 as school_number,
            'kippnewark' as _dbt_source_project,
            'loc-abc' as location_key
    expect:
      format: sql
      rows: |
        select
          'd0b048a83abb7e845f5c0e0e9a872270' as student_attendance_period_key,
          'e10adc3949ba59abbe56e057f20f883e' as student_key,
          'loc-abc' as location_key,
          2025 as academic_year,
          'year' as period_type,
          date '2025-07-01' as period_start_date_key,
          date '2025-09-04' as period_end_date_key,
          3.0 as n_membership_days_ytd,
          2.0 as n_present_days_ytd,
          false as is_truant,
          false as is_ca_eligible,
          'Tier 4' as ada_tier,
          true as is_chronically_absent
        union all
        select
          '855469c59ab2c4a17ba744b9d46dbbe1', 'e10adc3949ba59abbe56e057f20f883e',
          'loc-abc', 2025, 'month', date '2025-09-01', date '2025-09-04',
          3.0, 2.0, false, false, 'Tier 4', true
        union all
        select
          '3828ea8318c10a073a8bda16efad73b3', 'e10adc3949ba59abbe56e057f20f883e',
          'loc-abc', 2025, 'week', date '2025-09-01', date '2025-09-04',
          3.0, 2.0, false, false, 'Tier 4', true

  - name: test_periods_month_accumulates_year_to_date
    description:
      One student with two membership days in September and one in October. The
      October month row must carry all three days, because chronic absence is a
      year-to-date measure, not a per-month one. The same fixture also emits a
      single year row and two week rows (school weeks starting 2025-09-01 and
      2025-10-06), which this expect block enumerates in full alongside the
      month rows.
    model: fct_student_attendance_periods
    given:
      - input: ref('int_students__attendance_daily')
        format: sql
        rows: |
          select
            123456 as student_number,
            'kippnewark' as _dbt_source_project,
            100 as schoolid,
            2025 as academic_year,
            date '2025-09-02' as calendardate,
            date '2025-09-01' as week_start_monday,
            1.0 as membershipvalue,
            1.0 as attendancevalue,
            false as is_truant
          union all
          select
            123456, 'kippnewark', 100, 2025, date '2025-09-03',
            date '2025-09-01', 1.0, 1.0, false
          union all
          select
            123456, 'kippnewark', 100, 2025, date '2025-10-06',
            date '2025-10-06', 1.0, 0.0, false
      - input: ref('int_students__schools')
        format: sql
        rows: |
          select
            100 as school_number,
            'kippnewark' as _dbt_source_project,
            'loc-abc' as location_key
    expect:
      format: sql
      rows: |
        select
          'd0b048a83abb7e845f5c0e0e9a872270' as student_attendance_period_key,
          'e10adc3949ba59abbe56e057f20f883e' as student_key,
          'loc-abc' as location_key,
          2025 as academic_year,
          'year' as period_type,
          date '2025-07-01' as period_start_date_key,
          date '2025-10-06' as period_end_date_key,
          3.0 as n_membership_days_ytd,
          2.0 as n_present_days_ytd,
          false as is_truant,
          false as is_ca_eligible,
          'Tier 4' as ada_tier,
          true as is_chronically_absent
        union all
        select
          '855469c59ab2c4a17ba744b9d46dbbe1', 'e10adc3949ba59abbe56e057f20f883e',
          'loc-abc', 2025, 'month', date '2025-09-01', date '2025-09-03',
          2.0, 2.0, false, false, 'Tier 1', false
        union all
        select
          '5db60d910a0868b738f5f8fb454e0e36', 'e10adc3949ba59abbe56e057f20f883e',
          'loc-abc', 2025, 'month', date '2025-10-01', date '2025-10-06',
          3.0, 2.0, false, false, 'Tier 4', true
        union all
        select
          '3828ea8318c10a073a8bda16efad73b3', 'e10adc3949ba59abbe56e057f20f883e',
          'loc-abc', 2025, 'week', date '2025-09-01', date '2025-09-03',
          2.0, 2.0, false, false, 'Tier 1', false
        union all
        select
          '54d0c067cb13b32ef9deb87e17ab4418', 'e10adc3949ba59abbe56e057f20f883e',
          'loc-abc', 2025, 'week', date '2025-10-06', date '2025-10-06',
          3.0, 2.0, false, false, 'Tier 4', true

  - name: test_periods_boundaries
    description:
      Four students on the exact boundaries. 9 of 10 present is exactly 90.0
      percent and must be chronically absent and Tier 3, never Tier 2. 19 of 20
      is 95 percent and must be Tier 1. A student with 9 membership days is not
      eligible; 10 is. Truancy is read from the last membership day. Each
      student's fixture holds week_start_monday constant across every date so
      the whole span collapses into one week bucket, keeping this expect block
      to one row per student per period type.
    model: fct_student_attendance_periods
    given:
      - input: ref('int_students__attendance_daily')
        format: sql
        rows: |
          select
            1 as student_number,
            'kippnewark' as _dbt_source_project,
            100 as schoolid,
            2025 as academic_year,
            d as calendardate,
            date '2025-09-01' as week_start_monday,
            1.0 as membershipvalue,
            if(d = date '2025-09-10', 0.0, 1.0) as attendancevalue,
            false as is_truant
          from unnest(generate_date_array(
            date '2025-09-01', date '2025-09-10'
          )) as d
          union all
          select
            2, 'kippnewark', 100, 2025, d, date '2025-09-01', 1.0,
            if(d = date '2025-09-20', 0.0, 1.0), true
          from unnest(generate_date_array(
            date '2025-09-01', date '2025-09-20'
          )) as d
          union all
          select
            3, 'kippnewark', 100, 2025, d, date '2025-09-01', 1.0, 1.0, false
          from unnest(generate_date_array(
            date '2025-09-01', date '2025-09-09'
          )) as d
      - input: ref('int_students__schools')
        format: sql
        rows: |
          select
            100 as school_number,
            'kippnewark' as _dbt_source_project,
            'loc-abc' as location_key
    expect:
      format: sql
      rows: |
        select
          '734db45f569c13619c7e7bd8a17ab6d5' as student_attendance_period_key,
          'c4ca4238a0b923820dcc509a6f75849b' as student_key,
          'loc-abc' as location_key,
          2025 as academic_year,
          'month' as period_type,
          date '2025-09-01' as period_start_date_key,
          date '2025-09-10' as period_end_date_key,
          10.0 as n_membership_days_ytd,
          9.0 as n_present_days_ytd,
          false as is_truant,
          true as is_ca_eligible,
          'Tier 3' as ada_tier,
          true as is_chronically_absent
        union all
        select
          '8487a09832a756f6e4237fe5c145b5fd', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'week', date '2025-09-01', date '2025-09-10',
          10.0, 9.0, false, true, 'Tier 3', true
        union all
        select
          '798d919108a1cd4d5eea1dbe405f97b6', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'year', date '2025-07-01', date '2025-09-10',
          10.0, 9.0, false, true, 'Tier 3', true
        union all
        select
          '4a22aed5d8416d653ef0f4d6b36dac12', 'c81e728d9d4c2f636f067f89cc14862c',
          'loc-abc', 2025, 'month', date '2025-09-01', date '2025-09-20',
          20.0, 19.0, true, true, 'Tier 1', false
        union all
        select
          '4fbeaabf2a6f1d1857adf778fec9fdec', 'c81e728d9d4c2f636f067f89cc14862c',
          'loc-abc', 2025, 'week', date '2025-09-01', date '2025-09-20',
          20.0, 19.0, true, true, 'Tier 1', false
        union all
        select
          '5caa82b67161ca974f214bbb38455edf', 'c81e728d9d4c2f636f067f89cc14862c',
          'loc-abc', 2025, 'year', date '2025-07-01', date '2025-09-20',
          20.0, 19.0, true, true, 'Tier 1', false
        union all
        select
          '257f2dd1764d2a284b96a22fa66c6a9b', 'eccbc87e4b5ce2fe28308fd9f2a7baf3',
          'loc-abc', 2025, 'month', date '2025-09-01', date '2025-09-09',
          9.0, 9.0, false, false, 'Tier 1', false
        union all
        select
          '0a80dbf0f92c795c2219156c10683f2d', 'eccbc87e4b5ce2fe28308fd9f2a7baf3',
          'loc-abc', 2025, 'week', date '2025-09-01', date '2025-09-09',
          9.0, 9.0, false, false, 'Tier 1', false
        union all
        select
          'badc57be8d4091670ddd4bbbca0bde0c', 'eccbc87e4b5ce2fe28308fd9f2a7baf3',
          'loc-abc', 2025, 'year', date '2025-07-01', date '2025-09-09',
          9.0, 9.0, false, false, 'Tier 1', false

  - name: test_periods_ninety_point_zero_one_is_not_chronically_absent
    description:
      The threshold is at or below 90.0 percent, so just above it is not
      chronically absent. 91 of 101 present is 90.099 percent. Fixed at
      week_start_monday = 2025-09-01 for the entire span, so the whole 101 days
      collapse into one week row; month rows still split by real calendar month
      (September through December).
    model: fct_student_attendance_periods
    given:
      - input: ref('int_students__attendance_daily')
        format: sql
        rows: |
          select
            1 as student_number,
            'kippnewark' as _dbt_source_project,
            100 as schoolid,
            2025 as academic_year,
            d as calendardate,
            date '2025-09-01' as week_start_monday,
            1.0 as membershipvalue,
            if(
              d <= date_add(date '2025-09-01', interval 9 day), 0.0, 1.0
            ) as attendancevalue,
            false as is_truant
          from unnest(generate_date_array(
            date '2025-09-01', date '2025-12-10'
          )) as d
      - input: ref('int_students__schools')
        format: sql
        rows: |
          select
            100 as school_number,
            'kippnewark' as _dbt_source_project,
            'loc-abc' as location_key
    expect:
      format: sql
      rows: |
        select
          '734db45f569c13619c7e7bd8a17ab6d5' as student_attendance_period_key,
          'c4ca4238a0b923820dcc509a6f75849b' as student_key,
          'loc-abc' as location_key,
          2025 as academic_year,
          'month' as period_type,
          date '2025-09-01' as period_start_date_key,
          date '2025-09-30' as period_end_date_key,
          30.0 as n_membership_days_ytd,
          20.0 as n_present_days_ytd,
          false as is_truant,
          true as is_ca_eligible,
          'Tier 4' as ada_tier,
          true as is_chronically_absent
        union all
        select
          'c01de65607e04c5974ae1636f2c87ea0', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'month', date '2025-10-01', date '2025-10-31',
          61.0, 51.0, false, true, 'Tier 3', true
        union all
        select
          'fc9d4095f3b039fa9a713c9d3bdbc163', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'month', date '2025-11-01', date '2025-11-30',
          91.0, 81.0, false, true, 'Tier 3', true
        union all
        select
          'b29a36320a9dc6d5fb5a8efa02bdfeff', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'month', date '2025-12-01', date '2025-12-10',
          101.0, 91.0, false, true, 'Tier 2', false
        union all
        select
          '8487a09832a756f6e4237fe5c145b5fd', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'week', date '2025-09-01', date '2025-12-10',
          101.0, 91.0, false, true, 'Tier 2', false
        union all
        select
          '798d919108a1cd4d5eea1dbe405f97b6', 'c4ca4238a0b923820dcc509a6f75849b',
          'loc-abc', 2025, 'year', date '2025-07-01', date '2025-12-10',
          101.0, 91.0, false, true, 'Tier 2', false

  - name: test_periods_threshold_is_per_school_not_combined
    description:
      Six membership days at each of two schools. Twelve days combined, but the
      threshold applies per school, so the student is eligible at neither.
    model: fct_student_attendance_periods
    given:
      - input: ref('int_students__attendance_daily')
        format: sql
        rows: |
          select
            1 as student_number,
            'kippnewark' as _dbt_source_project,
            100 as schoolid,
