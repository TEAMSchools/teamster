models:
  - name: fct_assessment_scores_enrollment_scoped
    description: >-
      Enrollment-scoped assessment score fact table. One row per student x
      assessment x administration x response type. Covers internal Illuminate
      assessments, state assessments (NJSLA, NJGPA, FAST), and vendor benchmark
      assessments (i-Ready Diagnostic, STAR, DIBELS — Composite plus subtests).
      Each row is linked to an assessment administration (via
      assessment_administration_key) and to the student's resolved section
      enrollment (via student_section_enrollment_key and enrollment_resolution).

      Vendor breakdown rows sit alongside the summary row, not in place of it.
      DIBELS contributes one row per subtest next to the Composite. i-Ready
      contributes one row per domain next to the subject-level row, with two
      exclusions: domains i-Ready marks 'Not Assessed', and
      comprehension_overall. That last one is the rollup parent of
      comprehension_literature and comprehension_informational_text, and the
      proficiency measures built on this table are additive, so keeping it would
      count the comprehension construct three times. A domain with a grade-level
      placement but no scale score is kept — the placement is the primary domain
      signal, so filtering on a non-null scale_score drops real rows.
    config:
      materialized: table
      meta:
        dagster:
          # 5x/day table instead of an eager view. Every reader of this model
          # recomputed its 27-base-table view chain: each of its 10 dbt tests
          # per CI build, every Cube query missing the proficiency_rollup_v2,
          # and every pre-agg partition build. That was 85% of CI's BigQuery spend
          # (0.486 GiB per test run against a deep view chain vs 0.016 GiB
          # against a table).
          #
          # Tick matches int_assessments__response_rollup, the heaviest
          # upstream, so ~any_deps_in_progress serializes the pass and
          # response_rollup builds first. Eager is not an option: the other
          # upstreams are eager and would drive 125+ rebuilds/day (#4559).
          # Accepted trade-off: Cube queries that miss the rollup read live
          # today and become 5x/day fresh. Cube's rollup refresh_key is
          # already 1 day, so the view bought no freshness Cube consumed.
          # Refs #4821
          automation_condition:
            cron_schedule: 0 0,10,13,15,17 * * *
    columns:
      - name: assessment_score_key
        data_type: string
        description: >-
          Surrogate key. Primary key for this fact table.
        constraints:
          - type: primary_key
            warn_unsupported: false
            warn_unenforced: false
        data_tests:
          - unique

      - name: assessment_administration_key
        data_type: string
        description: >-
          FK to dim_assessment_administrations. Identifies the scheduled
          administration (assessment definition + occurrence context: academic
          year, region, season/window) that this score belongs to.
        config:
          meta:
            foreign_key:
              to: ref('dim_assessment_administrations')
              to_columns: [assessment_administration_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_assessment_administrations')
                field: assessment_administration_key

      - name: student_section_enrollment_key
        data_type: string
        description: >-
          FK to dim_student_section_enrollments. The student's section
          enrollment resolved by int_assessments__resolved_section_enrollments —
          subject section active on the test date, falling back to homeroom when
          no subject section resolves (see enrollment_resolution). Populated for
          every row; homeroom-resolved rows are coarser-grained than
          subject_section rows.
        config:
          meta:
            foreign_key:
              to: ref('dim_student_section_enrollments')
              to_columns: [student_section_enrollment_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_student_section_enrollments')
                field: student_section_enrollment_key

      - name: term_key
        data_type: string
        description: >-
          FK to dim_terms. The reporting quarter containing the date this score
          was administered or taken, at the school of the section enrollment
          int_assessments__resolved_section_enrollments resolved. Matched by
          date rather than through the section enrollment itself, whose term id
          is not quarter-specific. Null when no reporting quarter is defined for
          that school and date.
        config:
          meta:
            foreign_key:
              to: ref('dim_terms')
              to_columns: [term_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_terms')
                field: term_key

      - name: test_date_key
        data_type: date
        description: >-
          FK to dim_dates. The date the assessment was taken. Populated for
          state and vendor assessments (threaded from source); nullable for
          internal rows that lack a recorded sitting date upstream. Equal to
          assessment_date_key for every state and vendor row (those have no
          administration date); the two differ only for internal and college
          rows, where assessment_date_key uses the administration date.
        config:
          meta:
            foreign_key:
              to: ref('dim_dates')
              to_columns: [date_key]
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key

      - name: assessment_date_key
        data_type: date
        description: >-
          FK to dim_dates for academic-year and calendar rollups. The
          administration date where the administration records one (internal
          Illuminate and college), otherwise the student's test date (state and
          vendor administrations span a window and carry no single date).
          Populated for every row, so academic year resolves for all sources —
          unlike the administration date alone, which is null for state and
          vendor rows.
        config:
          meta:
            foreign_key:
              to: ref('dim_dates')
              to_columns: [date_key]
        data_tests:
          # not_null guards the invariant the #4546 fix rests on: the FK
          # relationships test skips nulls and the constraint is not enforced,
          # so neither catches a row where both administration and test date are
          # null (academic_year would silently go null again). Project-default
          # severity (warn) surfaces any regression in CI.
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key

      - name: response_type
        data_type: string
        description: >-
          Response-type breakdown. Never null; 4 values: overall (a subject,
          course-level or composite score; every source), group (a strand or
          domain rollup within a subject; Illuminate, i-Ready and DIBELS),
          standard (one Illuminate standard; Illuminate only) and not_taken (an
          Illuminate assessment a student was assigned and never sat, with no
          recorded response). Not additive across values.
        data_tests:
          - accepted_values:
              arguments:
                values: [not_taken, overall, group, standard]
          - not_null

      - name: enrollment_resolution
        data_type: string
        description: >-
          How the section enrollment was resolved: subject_section (the section
          for the assessment's subject, active on the test date) or homeroom
          (the student's HR section, used when no subject section resolved).

      - name: scale_score
        data_type: numeric
        description: >-
          Scale score achieved. Every source except Illuminate, which reports
          percent_correct instead. Scales differ by source and are not
          comparable across sources or subjects; within i-Ready the scale also
          compresses at higher grades, so a change in score is not comparable
          between elementary and middle grades.

      - name: percent_correct
        data_type: numeric
        description: >-
          Percent of questions answered correctly. Illuminate only; null for
          every other source.

      - name: national_percentile
        data_type: numeric
        description: >-
          National norm-referenced percentile rank for the attempt where the
          vendor provides one (i-Ready percentile, STAR percentile rank, DIBELS
          measure percentile). This is an achievement percentile, not a growth
          percentile. Null for internal and state assessments.

      - name: proficiency_level
        data_type: string
        description: >-
          Proficiency label; the vocabulary is per source. i-Ready: 3 or More
          Grade Levels Below, 2 Grade Levels Below, 1 Grade Level Below, Early
          On Grade Level, Mid or Above Grade Level. DIBELS: Well Below
          Benchmark, Below Benchmark, At Benchmark, Above Benchmark, and Tested
          Out on some subtest (group) rows. STAR and FL state: Level 1 to Level
          5; STAR is null on a share of rows. NJSLA and NJSLA Science: Did Not
          Yet Meet Expectations, Partially Met Expectations, Approached
          Expectations, Met Expectations, Exceeded Expectations. NJGPA:
          Graduation Ready, Not Yet Graduation Ready. Illuminate: the
          performance band label. Tier-movement rates are not comparable across
          instruments: fewer, wider tiers mechanically raise the stayed-the-same
          rate.

      - name: is_mastery
        data_type: boolean
        description: >-
          Per-row proficient flag that pct_proficient is built from. The bar is
          per source: i-Ready, Early On Grade Level and Mid or Above Grade Level
          — Early On is a looser bar than at or above grade level; DIBELS, At
          and Above Benchmark; STAR and FL, Level 3 and up; NJSLA, Met and
          Exceeded Expectations; NJGPA, Graduation Ready; Illuminate, set by
          each assessment's band set, so an Illuminate rate mixes different
          bars. Null where the source gives no verdict: Illuminate not_taken
          rows, DIBELS Tested Out subtests, and STAR rows with no level.

      # Lineage: custom_code (Illuminate standard rows), domain_name (i-Ready),
      # measure_standard (DIBELS). Also a surrogate-key discriminator for
      # breakdown rows that would otherwise collide on assessment,
      # administration and student.
      - name: response_type_code
        data_type: string
        description: >-
          Breakdown identifier — the standard code on Illuminate standard rows,
          the domain on i-Ready group rows, the subtest on DIBELS group rows.
          Null on Illuminate group rows and on every overall and not_taken row.
          Some CCSS Math standards carry 2 spellings (8.EE.C.8.b and 8.EE.C.8b),
          and a small share of older rows have an empty code (an empty string,
          not null).

      # Lineage: an Illuminate standard's own description or its reporting-group
      # label, the rendered i-Ready domain name, or the DIBELS measure_name.
      - name: response_type_description
        data_type: string
        description: >-
          Human-readable breakdown label. Populated on standard rows and every
          group row; null on overall and not_taken. A few standards carry
          whitespace variants of the same label.

      - name: response_type_root_description
        data_type: string
        description: >-
          CCSS domain the standard rolls up to. Populated only on Illuminate
          standard rows that resolve a parent standard. Unreliable for
          Illuminate content aligned to Florida's own standards, whose codes do
          not fit the CCSS hierarchy.

      - name: is_replacement
        data_type: boolean
        description: >-
          Illuminate-only flag. TRUE when a K-8 student sat a
          replacement-curriculum assessment off their enrolled grade level. Null
          for every other source (the state tests and the i-Ready, DIBELS and
          STAR diagnostics), which have no replacement-curriculum concept.

      - name: performance_band_label_number
        data_type: numeric
        description: >-
          Position of the score's band within the performance band set it was
          scored against. Illuminate only; null for every other source. Band
          sets differ in cut points, in band count, and in which band starts
          mastery, so band 5 is not always the top. Not comparable across
          assessments, or across response types within one assessment: standard
          and group rows can carry different band labels than the assessment's
          overall rows.
