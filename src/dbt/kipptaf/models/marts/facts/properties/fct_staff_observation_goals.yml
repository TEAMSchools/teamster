models:
  - name: fct_staff_observation_goals
    description: >-
      Staff observation goal assignment fact table. One row per teacher x goal
      assignment. Records each goal or look-for assigned to a teacher through
      SchoolMint Grow assignments, linked to the 4-level goal taxonomy. Foreign
      keys to dim_staff (teacher and creator as role-playing dimensions) and
      dim_staff_observation_goal_types.
    columns:
      - name: staff_observation_goal_key
        data_type: string
        description: >-
          Surrogate primary key derived from teacher employee number,
          assignment_id, and goal tag_id. Generated with
          generate_surrogate_key(["gu.internal_id_int", "a.assignment_id",
          "m.tag_id"]).
        constraints:
          - type: primary_key
            warn_unsupported: false
        data_tests:
          - unique

      - name: teacher_staff_key
        data_type: string
        description: >-
          Foreign key to dim_staff for the teacher receiving the goal. Surrogate
          key derived from employee_number.
        config:
          meta:
            foreign_key:
              to: ref('dim_staff')
              to_columns: [staff_key]
      - name: staff_observation_goal_type_key
        data_type: string
        description: >-
          Foreign key to dim_staff_observation_goal_types. Surrogate key derived
          from the goal tag_id.
        config:
          meta:
            foreign_key:
              to: ref('dim_staff_observation_goal_types')
              to_columns: [staff_observation_goal_type_key]

      - name: creator_staff_key
        data_type: string
        description: >-
          Foreign key to dim_staff for the person who created the assignment.
          Null when the creator's observation-platform user has no staff id.

        config:
          meta:
            foreign_key:
              to: ref('dim_staff')
              to_columns: [staff_key]
      - name: assignment_date
        data_type: date
        description: >-
          Local date when the assignment was created.

      - name: assignment_created_timestamp
        data_type: timestamp
        description: >-
          UTC timestamp when the assignment was created.

      - name: academic_year
        data_type: int64
        description: >-
          Academic year derived from the assignment creation date.

unit_tests:
  - name: test_fct_staff_observation_goals_creator_resolves_by_user_id
    description:
      Locks the creator lookup on the observation-platform user id. A name match
      against the staff roster once left creator_staff_key null on every row.
      Feeds one assignment whose creator has a staff id and one whose creator
      does not; asserts the first carries the hashed staff id and the second is
      null.
    model: fct_staff_observation_goals
    given:
      - input: ref('stg_schoolmint_grow__assignments')
        rows:
          - assignment_id: a1
            user_id: u1
            creator_id: u2
            created_date_local: 2025-09-15
          - assignment_id: a2
            user_id: u1
            creator_id: u3
            created_date_local: 2025-09-15
      - input: ref('stg_schoolmint_grow__users')
        rows:
          - user_id: u1
            internal_id_int: 101
          - user_id: u2
            internal_id_int: 202
          - user_id: u3
            internal_id_int: null
      - input: ref('int_schoolmint_grow__assignments__tags')
        rows:
          - assignment_id: a1
            tag_id: t1
          - assignment_id: a2
            tag_id: t1
      - input: ref('int_schoolmint_grow__microgoals')
        rows:
          - tag_id: t1
    expect:
      rows:
        # md5 of internal id 202, the staff_key macro's hash
        # trunk-ignore(gitleaks/generic-api-key): md5 test fixture, not a secret
        - creator_staff_key: 854d6fae5ee42911677c739ee1734486
        - creator_staff_key: null
