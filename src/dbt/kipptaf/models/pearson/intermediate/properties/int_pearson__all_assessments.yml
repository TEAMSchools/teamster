models:
  - name: int_pearson__all_assessments
    description: >-
      Passthrough union of the Newark, Camden and Paterson
      int_pearson__all_assessments tables: the frozen Pearson history (PARCC,
      NJSLA, NJSLA Science, NJGPA) that the districts no longer rebuild. Column
      docs live on the pearson package model. int_assessments__state_nj_scores
      renames these columns to the shared NJ vocabulary and unions them with
      Cambium.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studenttestuuid
          config:
            severity: error
    columns:
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from _dbt_source_relation.
