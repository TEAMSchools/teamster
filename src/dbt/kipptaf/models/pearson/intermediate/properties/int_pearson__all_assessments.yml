models:
  - name: int_pearson__all_assessments
    description: >
      Network-level union of state assessment results (PARCC, NJSLA, NJSLA
      Science, NJGPA) enriched with student crosswalk lookups and standardized
      metadata. NJGPA is dual-vendor -- Pearson through the Fall 2025
      administration, Cambium TIDE starting Spring 2026 -- unioned into this
      same shape. The model's Pearson-only name is a known misnomer now that a
      second vendor feeds it; a rename is pending. The aligned demographic
      labels, proficiency banding, and subject/test-code normalization are
      computed upstream: int_pearson__all_assessments in the pearson package per
      district, and stg_cambium__njgpa in the cambium package. This model only
      unions the district copies, repairs localstudentidentifier from the
      crosswalk, and casts the state id.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studenttestuuid
    columns:
      - name: assessment_version
        data_type: string
        description: >-
          Which version of the assessment produced the row, set as a literal by
          each vendor's staging model. NJGPA splits into NJGPA for the retired
          Pearson form and NJGPA-A for the Cambium adaptive form, which use
          different score scales and therefore different cut scores. Every other
          assessment repeats assessment_name, having only one version.
          Graduation pathway cut scores join on this value, so a score is only
          ever compared against the threshold set for its own scale.
        data_tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: [PARCC, NJSLA, NJSLA Science, NJGPA, NJGPA-A]
              config:
                severity: error

      - name: assessment_type
        data_type: string
        description: >-
          Program-lineage label ('state_nj_parcc' / '..._njsla' /
          '..._njsla_science' / '..._njgpa') computed upstream. Marts hash it
          into assessment_key. Tested here because union_relations null-fills a
          column a relation forgot to supply: a null or unknown value means a
          feeding relation lost its aligned columns.
        data_tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values:
                  - state_nj_parcc
                  - state_nj_njsla
                  - state_nj_njsla_science
                  - state_nj_njgpa
              config:
                severity: error

      - name: _dbt_source_relation
        data_type: string
        description: Source relation identifier from dbt_utils.union_relations.

      - name: _dbt_source_project
        data_type: string
        description: >-
          Dagster code-location identifier propagated from the staging union;
          identifies the district source project (e.g. kippnewark).

      - name: academic_year
        data_type: int64
        description: Academic year the assessment was administered.

      - name: americanindianoralaskanative
        data_type: string
        description: >
          American Indian or Alaska Native race indicator from Pearson ('Y' or
          null).

      - name: asian
        data_type: string
        description: Asian race indicator from Pearson ('Y' or null).

      - name: assessment_name
        data_type: string
        description: Assessment program name (e.g. NJSLA, NJGPA, PARCC).

      - name: assessmentgrade
        data_type: string
        description: >-
          Assessment grade level as reported by the vendor. Pearson sent 'Grade
          11' on every row. Cambium sends the test DESIGN level instead — 'Grade
          10' for ELAGP and 'Grade 11' for MATGP — so this column carries two
          values and is NOT the student's grade. Use test_grade (always 11 for
          NJGPA) or the enrollment for reporting grade level.

      - name: assessmentyear
        data_type: string
        description: Assessment year as reported by Pearson (string format).

      - name: test_date
        data_type: date
        description: >-
          Date the student took the assessment (per-student testing date,
          derived from the per-student online unit start datetime). Null for
          legacy records that carry no recorded testing date.

      - name: blackorafricanamerican
        data_type: string
        description:
          Black or African American race indicator from Pearson ('Y' or null).

      - name: discipline
        data_type: string
        description: Subject discipline category (Math, ELA, Science, etc.).

      - name: hispanicorlatinoethnicity
        data_type: string
        description:
          Hispanic or Latino ethnicity indicator from Pearson ('Y' or null).

      - name: is_proficient
        data_type: boolean
        description:
          Whether the student scored at or above the proficiency threshold.

      - name: is_bl_fb
        data_type: boolean
        description: >
          Whether the student scored at the Below or Far Below proficiency band.

      - name: nativehawaiianorotherpacificislander
        data_type: string
        description: >
          Native Hawaiian or Other Pacific Islander race indicator from Pearson
          ('Y' or null).

      - name: period
        data_type: string
        description: >
          Testing period from Pearson (e.g. Spring, FallBlock); used to derive
          admin and season. Spring is the only period officially reported.

      - name: firstname
        data_type: string
        description: Student first name as reported by Pearson.

      - name: lastorsurname
        data_type: string
        description: Student last name or surname as reported by Pearson.

      - name: subject
        data_type: string
        quote: true
        description:
          Full subject name as reported by Pearson (e.g. English Language
          Arts/Literacy, Mathematics).

      - name: subject_area
        data_type: string
        description: >
          Subject area from the staging model, used for stacked reporting across
          assessment programs.

      - name: module_code
        data_type: string
        description: >
          Module code from the staging model, used as the assessment
          administration grain identifier.

      - name: administration_period
        data_type: string
        description: >
          Testing administration period as reported by Pearson (e.g. Spring,
          FallBlock).

      - name: testcode
        data_type: string
        description: Raw test code from Pearson (e.g. ELA05, SC08, ALG01).

      - name: studenttestuuid
        data_type: string
        description:
          Globally unique identifier for the student's test-taking event.

      - name: test_grade
        data_type: int64
        description: Numeric grade level at which the test was taken.

      - name: testperformancelevel_text
        data_type: string
        description:
          Performance level label as reported by Pearson (e.g. 'Level 4').

      - name: testperformancelevel
        data_type: float64
        description: Numeric performance level as reported by Pearson.

      - name: testscalescore
        data_type: float64
        description: Student's raw scale score on the assessment.

      - name: testscorecomplete
        data_type: float64
        description: >-
          Score completeness indicator as reported by the vendor. Pearson set it
          to 1 on every row surviving the staging filter. Cambium does not
          populate it, so it is NULL for all Cambium NJGPA rows; consumers must
          coalesce rather than compare directly.

      - name: twoormoreraces
        data_type: string
        description: Two or more races indicator from Pearson ('Y' or null).

      - name: white
        data_type: string
        description: White race indicator from Pearson ('Y' or null).

      - name: statestudentidentifier
        data_type: string
        description: State student identifier cast to string.

      - name: localstudentidentifier
        data_type: int64
        description: >
          Local student identifier — resolved from the Pearson student crosswalk
          when available, otherwise the raw value from the source file. Used to
          work around incorrect studentidentifiers provided during testing.

      - name: admin
        data_type: string
        quote: true
        description: >
          Testing administration period with 'FallBlock' normalized to 'Fall';
          reserved word alias for Tableau.
