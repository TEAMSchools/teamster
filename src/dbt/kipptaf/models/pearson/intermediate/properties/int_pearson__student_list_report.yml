models:
  - name: int_pearson__student_list_report
    description: >-
      Union of each NJ district's int_pearson__student_list_report (the pearson
      package model). Column docs live there; this wrapper adds
      _dbt_source_project.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - _dbt_source_project
              - academic_year
              - administration
              - state_id
              - aligned_test_code
    columns:
      - name: _dbt_source_relation
        data_type: string
        description: Source relation identifier from dbt_utils.union_relations.

      - name: _dbt_source_project
        data_type: string
        description: District code location derived from `_dbt_source_relation`.
