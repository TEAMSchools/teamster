models:
  - name: stg_pearson__njsla_science
    description: >
      NJSLA science student test records from Pearson, unioned across Newark and
      Camden (district stg_pearson__njsla_science) and Paterson
      (int_pearson__njsla_science). Passes through every column of those
      district models, which document them.
    config:
      materialized: table
      meta:
        contains_pii: true
    columns:
      - name: _dbt_source_project
        data_type: string
        description: >
          District project the row came from, extracted from
          _dbt_source_relation (kippnewark, kippcamden, or kipppaterson).
