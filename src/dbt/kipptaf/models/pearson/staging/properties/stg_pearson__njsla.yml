models:
  - name: stg_pearson__njsla
    description: >
      NJSLA ELA and math student test records from Pearson, unioned across
      Newark and Camden (district stg_pearson__njsla) and Paterson
      (int_pearson__njsla). Passes through every column of those district
      models, which document them.
    config:
      materialized: table
      meta:
        contains_pii: true
    columns:
      - name: _dbt_source_project
        data_type: string
        description: >
          District project the row came from, extracted from
          _dbt_source_relation (kippnewark, kippcamden, or kipppaterson).
