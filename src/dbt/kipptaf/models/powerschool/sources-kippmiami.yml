      SIS moved to Focus). Rebuilt once on 2026-09-09 from the frozen externals
      with the 8400 Focus prefix on student_number and an AY2025 bound applied
      (#5012). The dataset must not be dropped. Declared BQ-native (plain
      schema, no target branch) so every target reads the prod tables directly.
