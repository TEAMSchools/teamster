sources:
  - name: kippmiami_powerschool
    description: >-
      Miami's PowerSchool archive (final ODBC pull 2026-07-01; Miami's SIS moved
      to Focus). Permanent history source for stored grades, attendance, and the
      course enrollments they hang off (#5193). Rebuilt from the frozen
      externals with the 8400 Focus prefix on student_number and an AY2025 bound
      applied (#5012). The dataset must not be dropped. Declared BQ-native
      (plain schema, no target branch) so every target reads the prod tables
      directly.
    schema: kippmiami_powerschool
    tables:
      - name: stg_powerschool__courses
        config:
          meta:
            dagster:
              group: powerschool
              asset_key:
                - kippmiami
                - powerschool
                - stg_powerschool__courses
      - name: stg_powerschool__storedgrades
