models:
  - name: int_powerschool__calendar_day
    description: >-
      Union of each region's int_powerschool__calendar_day: one row per
      PowerSchool calendar day with the covering year term and the school's
      name, abbreviation, level, and city attached. Column docs live on the
      package model.
    config:
      materialized: table
    columns:
      - name: _dbt_source_relation
        data_type: string
      - name: _dbt_source_project
        data_type: string
      - name: id
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: date_value
        data_type: date
      - name: insession
        data_type: int64
      - name: membershipvalue
        data_type: float64
      - name: week_start_date
        data_type: date
      - name: week_end_date
        data_type: date
      - name: yearid
        data_type: int64
      - name: academic_year
        data_type: int64
      - name: school_name
        data_type: string
      - name: school_abbreviation
        data_type: string
      - name: school_level
        data_type: string
      - name: schoolcity
        data_type: string
