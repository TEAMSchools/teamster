models:
  - name: int_powerschool__gpa
    description: >-
      Network-wide union of the districts' term-grained GPA joined to cumulative
      GPA. Column semantics live on the package model.
    config:
      meta:
        contains_pii: true
    columns:
      - name: _dbt_source_relation
        data_type: string
        description: District relation the row was unioned from.
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from `_dbt_source_relation`.
      - name: studentid
        data_type: int64
        description:
          The internal number and ID of the associated Students record.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__storedgrades
            source_column: studentid
            column_role: foreign_key
      - name: schoolid
        data_type: int64
        description: The School_Number of the associated Schools record.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: schoolid
      - name: yearid
        data_type: int64
        description:
          A number representing which year the term belongs to, such as 13 for
          2003-2004. Thenumber is equal to the ID of the year term divided by
          100. Maintained in the Terms table.Required. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__gradeschoolconfig
            source_column: yearid
      - name: academic_year
        data_type: int64
        description:
          The academic year the term belongs to, named for the fall of the
          school year. Derived in the powerschool package from yearid.
      - name: term_name
        data_type: string
        description: Name of the reporting term the row is graded at.
      - name: semester
        data_type: string
        description: Name of the semester the reporting term falls in.
      - name: gpa_term
        data_type: float64
        description: Weighted GPA earned in this term alone.
      - name: gpa_y1
        data_type: float64
        description: Weighted year-to-date GPA as of this term.
      - name: gpa_y1_unweighted
        data_type: float64
        description: Unweighted year-to-date GPA as of this term.
      - name: gpa_semester
        data_type: float64
        description: Weighted GPA earned across the semester this term sits in.
      - name: n_failing_y1
        data_type: int64
        description: Count of year-to-date course grades below passing.
      - name: total_credit_hours_term
        data_type: float64
        description: Credit hours attempted in this term alone.
      - name: total_credit_hours_y1
        data_type: float64
        description: Credit hours attempted year-to-date as of this term.
      - name: grade_avg_term
        data_type: float64
        description: Average percent grade across this term's courses.
      - name: grade_avg_y1
        data_type: float64
        description: Average percent grade across year-to-date courses.
      - name: students_student_number
        data_type: int64
        description: Network student number carried from the students record.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: student_number
            contains_pii: true
      - name: cumulative_y1_gpa
        data_type: float64
        description: Weighted GPA across every year of high school to date.
      - name: cumulative_y1_gpa_unweighted
        data_type: float64
        description: Unweighted GPA across every year of high school to date.
      - name: cumulative_y1_gpa_projected
        data_type: float64
        description:
          Cumulative weighted GPA projected to the end of the current year.
      - name: earned_credits_cum
        data_type: float64
        description: Credits earned across every year of high school to date.
      - name: potential_credits_cum
        data_type: float64
        description:
          Credits attempted across every year of high school to date, whether
          earned or not.
