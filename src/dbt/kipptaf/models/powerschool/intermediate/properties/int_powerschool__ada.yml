models:
  - name: int_powerschool__ada
    config:
      materialized: table
    columns:
      - name: _dbt_source_relation
        data_type: string
      - name: _dbt_source_project
        data_type: string
      - name: studentid
        data_type: int64
        description:
          The internal number and ID of the associated Students record.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__storedgrades
            source_column: studentid
            column_role: foreign_key
      - name: student_number
        data_type: int64
        description:
          Network student number. Miami's frozen PowerSchool archive was rebuilt
          with the 8400 Focus prefix applied (#5012), so every project's rows
          share one id space with no offset here.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: student_number
            contains_pii: true
      - name: yearid
        data_type: int64
        description:
          A number representing which year the term belongs to, such as 13 for
          2003-2004. Thenumber is equal to the ID of the year term divided by
          100. Maintained in the Terms table.Required. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__gradeschoolconfig
            source_column: yearid
      - name: days_in_membership
        data_type: float64
      - name: days_present
        data_type: float64
      - name: days_absent_unexcused
        data_type: float64
      - name: ada
        data_type: float64
