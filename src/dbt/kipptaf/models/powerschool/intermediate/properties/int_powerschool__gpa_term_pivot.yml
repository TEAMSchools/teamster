models:
  - name: int_powerschool__gpa_term_pivot
    config:
      materialized: table
      meta:
        contains_pii: true
    description: >-
      Union of each region's int_powerschool__gpa_term_pivot (the powerschool
      package model). Column docs and the per-instance tests live in the
      package; this wrapper adds _dbt_source_project so studentid, which is only
      unique within one PowerSchool instance, can be disambiguated downstream.
      Includes the frozen Miami archive (AY2025 and earlier).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - _dbt_source_relation
              - studentid
              - yearid
    columns:
      - name: _dbt_source_relation
        data_type: string
        description: Source relation identifier from dbt_utils.union_relations.

      - name: _dbt_source_project
        data_type: string
        description: >-
          District code location derived from _dbt_source_relation. Needed to
          disambiguate studentid, which is only unique within a single
          PowerSchool instance.
