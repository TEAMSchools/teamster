models:
  - name: int_powerschool__sections_union
    description: >-
      Cross-district union of the four PowerSchool district
      `base_powerschool__sections` sources (Newark, Camden, Miami, Paterson),
      with `_dbt_source_project` extracted from `_dbt_source_relation`. Exists
      so the SIS-neutral `int_students__course_sections` model can `ref()` it
      instead of inlining `dbt_utils.union_relations`.
    config:
      materialized: table
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sections_dcid
              - _dbt_source_project
    columns:
      - name: _dbt_source_project
        description: >-
          Source-project discriminator (`kippnewark`, `kippcamden`, `kippmiami`,
          `kipppaterson`) extracted from `_dbt_source_relation`. Materialized at
          the union point so downstream consumers can join and hash on a stable
          value.
        data_type: string
