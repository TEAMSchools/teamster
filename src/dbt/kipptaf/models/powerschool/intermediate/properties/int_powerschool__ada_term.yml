models:
  - name: int_powerschool__ada_term
    description:
      Average daily attendance per student per term, with semester, year, and
      year-to-date rollups in both unweighted and weighted forms. Every ADA
      column is a rate in the range 0 to 1. Weighted variants divide the summed
      weighted present-day value by the same in-session day count the unweighted
      variants use; starting SY26, high schools report on the weighted measure.
      Every rate is aggregated in exact decimal and emitted as FLOAT64, so one
      landing on a rounding midpoint resolves the same way in every build.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - _dbt_source_project
              - student_number
              - academic_year
              - term
          config:
            severity: error
    columns:
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from `_dbt_source_project`.
      - name: student_number
        data_type: int64
        description:
          Network student number. The model's grain key -- studentid is
          PowerSchool-internal and null for every Focus-sourced (Miami) row, so
          it cannot key a network-wide model.
        config:
          meta:
            contains_pii: true
      - name: studentid
        data_type: int64
        description:
          The internal number and ID of the associated Students record. Null for
          every Focus-sourced (Miami) row -- carried through as `max(studentid)`
          per student_number so NJ consumers that still join on it keep working.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__storedgrades
            source_column: studentid
            column_role: foreign_key
      - name: academic_year
        data_type: int64
      - name: term
        data_type: string
      - name: ada_term
        data_type: float64
        description:
          Unweighted average daily attendance for the term, the mean of daily
          attendance values across the term's in-session days.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: between 0 and 1
              config:
                severity: error
      - name: ada_semester
        data_type: float64
        description:
          Unweighted average daily attendance for the semester, attendance
          values summed across the semester's in-session days divided by the
          count of those days.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: between 0 and 1
              config:
                severity: error
      - name: ada_year
        data_type: float64
        description:
          Unweighted average daily attendance across the full academic year,
          attendance values summed over all in-session days divided by the count
          of those days.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: between 0 and 1
              config:
                severity: error
      - name: ada_year_running
        data_type: float64
        description:
          Unweighted average daily attendance for the academic year through the
          end of the current term, accumulating term by term.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: between 0 and 1
              config:
                severity: error
      - name: ada_weighted_term
        data_type: float64
        description:
          Weighted average daily attendance for the term, the summed weighted
          present-day value divided by the count of the term's in-session days.
          Runs below the unweighted rate because partial-day presence earns
          partial credit.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: between 0 and 1
              config:
                severity: error
      - name: ada_weighted_semester
        data_type: float64
        description:
          Weighted average daily attendance for the semester, weighted
          present-day values summed across the semester's in-session days
          divided by the count of those days.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: between 0 and 1
              config:
                severity: error
      - name: ada_weighted_year
        data_type: float64
        description:
          Weighted average daily attendance across the full academic year.
          Consumers should read this through `int_powerschool__ada_term_pivot`,
          which reshapes it to one row per student per year.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: between 0 and 1
              config:
                severity: error
      - name: ada_weighted_year_running
        data_type: float64
        description:
          Weighted average daily attendance for the academic year through the
          end of the current term, accumulating term by term.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: between 0 and 1
              config:
                severity: error
