models:
  - name: int_powerschool__gpa_cumulative_year
    description: >-
      Network union of the district int_powerschool__gpa_cumulative_year models
      (Newark, Camden, Paterson) — one row per student, school, and academic
      year with cumulative Y1 GPA as of the end of that year. Running totals
      accumulate within a student-school pair, so a student who changed schools
      restarts at the new school. Completed-year rows are recomputed from Y1
      stored grades; the current-year row (is_projected = true) copies the
      projected values from int_powerschool__gpa_cumulative for students with a
      current-year primary enrollment at that school. Also carries
      students_dcid, students_student_number, school_name, school_abbreviation,
      and school_level unchanged from the package model of the same name, which
      is where their descriptions live.
    config:
      meta:
        contains_pii: true
    columns:
      - name: _dbt_source_relation
        data_type: string
        description: Source relation identifier from dbt_utils.union_relations.
      - name: studentid
        data_type: int64
        description:
          The internal number and ID of the associated Students record.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__storedgrades
            source_column: studentid
            column_role: foreign_key
      - name: schoolid
        data_type: int64
        description: >-
          School_Number of the school where the grades were stored (completed
          years) or where the student is currently enrolled (projected row).
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: schoolid
      - name: academic_year
        data_type: int64
        description: >-
          Academic year the cumulative values run through — start-year
          convention (2024 means SY2024-25).
      - name: grade_level
        data_type: int64
        description: >-
          Student's grade level in that academic year, from the year's primary
          enrollment. NULL for stored years with no matching enrollment.
      - name: earned_credits_cum
        data_type: float64
        description: >-
          Running earned credit hours at this school through this academic year,
          excluding grades flagged excludefromgraduation. On the current-year
          row, `earned_credits_cum_projected` from
          int_powerschool__gpa_cumulative.
      - name: potential_gpa_credits_cum
        data_type: float64
        description: >-
          Running potential GPA credit hours at this school through this
          academic year, excluding grades flagged excludefromgpa — the
          denominator of the cumulative GPAs. On the current-year row,
          `potential_gpa_credits_cum_projected` from
          int_powerschool__gpa_cumulative.
      - name: cumulative_y1_gpa
        data_type: float64
        description: >-
          Cumulative weighted Y1 GPA at this school through this academic year —
          credit-weighted GPA points over potential GPA credits, rounded to two
          decimals. On the current-year row, `cumulative_y1_gpa_projected` from
          int_powerschool__gpa_cumulative.
      - name: cumulative_y1_gpa_unweighted
        data_type: float64
        description: >-
          Cumulative unweighted Y1 GPA at this school through this academic
          year, using grade points from the unweighted grade scale, rounded to
          two decimals. On the current-year row,
          `cumulative_y1_gpa_projected_unweighted` from
          int_powerschool__gpa_cumulative.
      - name: is_projected
        data_type: boolean
        description: >-
          False for completed years recomputed from stored grades; true for the
          current-year row sourced from projected values.
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from `_dbt_source_relation`.
