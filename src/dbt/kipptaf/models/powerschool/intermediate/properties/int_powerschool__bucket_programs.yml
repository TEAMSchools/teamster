models:
  - name: int_powerschool__bucket_programs
    description: >-
      PowerSchool Bucket special programs ("Bucket 1 - ELA"), decoded to a
      bucket and subject, across the NJ regions and the frozen Miami archive.
      One row per academic_year x _dbt_source_project x student_number x subject
      x assignment_date (the program enter date). When 2 programs share an enter
      date, the active one wins, then the later exit, then the lower-numbered
      bucket. 2 concurrent buckets for 1 subject are a PowerSchool data-entry
      error and the lower-numbered one is correct; the PowerSchool package test
      int_powerschool__spenrollments__no_concurrent_bucket_per_subject lists
      them for correction. Read through int_students__bucket_assignments.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - _dbt_source_project
              - student_number
              - subject
              - assignment_date
          config:
            severity: error
    columns:
      - name: academic_year
        description: Academic year of the program.
      - name: _dbt_source_project
        description: >-
          District code location the program came from, carried through from
          int_powerschool__spenrollments.
      - name: student_number
        description: Network student number.
      - name: subject
        description: >-
          Reading or Math, decoded from the program name; null when the name has
          no hyphenated discipline token or the token is neither ELA nor Math.
      - name: bucket
        description: Bucket label, the program name before the hyphen.
      - name: assignment_date
        description: Program enter date.
      - name: exit_date
        description: >-
          Program exit date, the first day the program no longer applies. Live
          programs carry a scheduled year-end exit.
      - name: n_active_assignments
        description: >-
          Count of the student's programs for the year and subject still active
          today (no exit date, or a future one), counted before the same-day
          pick. More than 1 means a double upload.

unit_tests:
