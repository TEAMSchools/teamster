models:
  - name: int_powerschool__gpa_term
    description:
      Term and year-to-date GPA, one row per student, academic year, and term,
      per district. GPA spans every school where the student earned GPA-eligible
      grades that year, so join on studentid, yearid, and _dbt_source_project,
      not schoolid.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - yearid
              - term_name
              - _dbt_source_project
    columns:
      - name: _dbt_source_relation
        data_type: string
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from `_dbt_source_relation`.
      - name: studentid
        data_type: int64
        description:
          The internal number and ID of the associated Students record.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__storedgrades
            source_column: studentid
            column_role: foreign_key
      - name: schoolid
        data_type: int64
        description:
          The school where the student earned the most GPA credit hours that
          year, ties broken by the higher school number. A label for the row,
          not a join key.
      - name: yearid
        data_type: int64
        description:
          A number representing which year the term belongs to, such as 13 for
          2003-2004. Thenumber is equal to the ID of the year term divided by
          100. Maintained in the Terms table.Required. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__gradeschoolconfig
            source_column: yearid
      - name: term_name
        data_type: string
      - name: semester
        data_type: string
      - name: is_current
        data_type: boolean
      - name: gpa_points_total_term
        data_type: float64
      - name: gpa_term
        data_type: float64
      - name: gpa_points_total_y1
        data_type: float64
      - name: gpa_y1
        data_type: float64
      - name: gpa_y1_unweighted
        data_type: float64
      - name: n_failing_y1
        data_type: int64
      - name: total_credit_hours_term
        data_type: float64
      - name: total_credit_hours_y1
        data_type: float64
      - name: grade_avg_term
        data_type: float64
      - name: grade_avg_y1
        data_type: float64
      - name: weighted_gpa_points_term
        data_type: float64
      - name: weighted_gpa_points_y1
        data_type: float64
      - name: weighted_gpa_points_y1_unweighted
        data_type: float64
      - name: gpa_points_total_semester
        data_type: float64
      - name: weighted_gpa_points_semester
        data_type: float64
      - name: total_credit_hours_semester
        data_type: float64
      - name: grade_avg_semester
        data_type: float64
      - name: gpa_semester
        data_type: float64
