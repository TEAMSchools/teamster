models:
  - name: int_powerschool__student_y1_target
    description: >-
      Union of the NJ districts' `int_powerschool__student_y1_target`, one row
      per current-year high school student with the unweighted letter target,
      the weighted need on their open courses, and the pace status. Column
      semantics live on the package model.
    config:
      materialized: table
      meta:
        contains_pii: true
    columns:
      - name: _dbt_source_relation
        data_type: string
      - name: studentid
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: student_number
        data_type: int64
      - name: is_cumulative_3_0_attainable
        data_type: boolean
      - name: cumulative_y1_gpa_projected_unweighted
        data_type: float64
      - name: n_courses_unlocked
        data_type: int64
      - name: pace_status
        data_type: string
      - name: schedule_bump
        data_type: float64
      - name: n_courses_below_target
        data_type: int64
      - name: gpa_needed_unweighted
        data_type: float64
      - name: target_cutoff_percent
        data_type: float64
      - name: target_letter_grade
        data_type: string
      - name: target_grade_points
        data_type: float64
      - name: gpa_needed_weighted
        data_type: float64
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from `_dbt_source_relation`.
