models:
  - name: int_powerschool__gradebook_assignments_scores
    description: >-
      Union of the per-region PowerSchool gradebook assignment-score models. One
      row per assignment section per student enrolled in that section on the
      assignment's due date, whether or not the student is expected to have a
      score for it, with the score where one was entered and the derived
      presence, timeliness and category flags.


      NJ-only by design: this unions the district PowerSchool packages, and
      Miami's gradebook is in Focus, not PowerSchool. No PowerSchool gradebook
      history for Miami is kept.


      Every column except _dbt_source_relation and _dbt_source_project comes
      through unchanged from the package model of the same name, which is where
      the authoritative column descriptions live.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - _dbt_source_project
              - assignmentsectionid
              - students_dcid
    columns:
      - name: _dbt_source_relation
        data_type: string
        description: Source relation identifier from dbt_utils.union_relations.
      - name: assignmentsectionid
        data_type: int64
        description:
          Primary key. Unique sequential number generated by the application.
          Required. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__assignmentsection
            source_column: assignmentsectionid
            column_role: primary_key
      - name: sectionsdcid
        data_type: int64
        description:
          Foreign key. Internal number for the associated sections.DCID record.
          Required. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__assignmentsection
            source_column: sectionsdcid
            column_role: foreign_key
      - name: assignmentid
        data_type: int64
        description:
          Foreign key. Internal number for the associated Assignment.ID record.
          Required. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__assignmentsection
            source_column: assignmentid
            column_role: foreign_key
      - name: assignment_name
        data_type: string
        description: Name the teacher gave the assignment in the gradebook.
      - name: duedate
        data_type: date
        description:
          The date the assignment is due. Defaults to the system date + 1 day.
          Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__assignmentsection
            source_column: duedate
      - name: scoretype
        data_type: string
        description:
          How the assignment is scored (POINTS, PERCENT, GRADESCALE, or
          COLLECTED).
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__assignmentsection
            source_column: scoretype
      - name: totalpointvalue
        data_type: float64
        description:
          This is the total weighted points that the assignment is worth. If the
          entry points are 25, and the weight is 4, then the total point value
          is 100.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__assignmentsection
            source_column: totalpointvalue
      - name: category_name
        data_type: string
        description:
          Name of the gradebook category the assignment belongs to, resolved
          from the district category where one exists and the teacher category
          otherwise.
      - name: category_code
        data_type: string
        description:
          First letter of the category name, upper-cased. H, W, F and S carry
          the category-specific score rules.
      - name: iscountedinfinalgrade
        data_type: int64
        description:
          "Indicates if the assignment will count toward the final grade. Valid
          values: 0=Does not count toward final grade, 1=Counts toward final
          grade. Defaults to 1. Required."
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__assignmentsection
            source_column: iscountedinfinalgrade
      - name: scorepoints
        data_type: float64
        description: Indicates the number of points for a score.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__assignmentscore
            source_column: scorepoints
      - name: actualscoreentered
        data_type: string
        description:
          Identifies the score entered for this assignment. This field may be
          Null.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__assignmentscore
            source_column: actualscoreentered
      - name: academic_year
        data_type: int64
        description: >-
          Academic year of the course enrollment the assignment was matched to,
          expressed as the starting calendar year.
      - name: students_dcid
        data_type: int64
        description:
          Durable internal key of the student the row belongs to. Part of the
          grain with _dbt_source_project and assignmentsectionid.
      - name: student_number
        data_type: int64
        description:
          Student number of the student the assignment row belongs to, from the
          course-enrollment join.
        config:
          meta:
            source_system: PowerSchool
            source_model: base_powerschool__course_enrollments
            source_column: students_student_number
            contains_pii: true
      - name: course_name
        data_type: string
        description: Name of the course the assignment's section belongs to.
        config:
          meta:
            source_system: PowerSchool
            source_model: base_powerschool__course_enrollments
            source_column: courses_course_name
      - name: teacher_name
        data_type: string
        description: Teacher of record for the assignment's section, last-first.
        config:
          meta:
            source_system: PowerSchool
            source_model: base_powerschool__course_enrollments
            source_column: teacher_lastfirst
            contains_pii: true
      - name: school_level_alt
        data_type: string
        description:
          School level of the enrollment, with the package's override for one
          Camden school where the custom grade level and the school level
          disagree. The MS and HS flag rules read it.
      - name: is_late
        data_type: int64
        description:
          The gradebook's late marker, zero-filled where no score row exists.
      - name: is_exempt
        data_type: int64
        description:
          The gradebook's exempt marker, zero-filled where no score row exists.
      - name: is_missing
        data_type: int64
        description:
          The gradebook's missing marker, zero-filled where no score row exists.
      - name: is_expected
        data_type: boolean
        description: >
          True when the student is expected to have a score for this assignment:
          not exempt and counted in final grade. False otherwise.
      - name: score_entered
        data_type: float64
        description:
          The score as a number. Points scored for POINTS assignments and the
          entered value cast to numeric otherwise. Null when no score was
          entered.
      - name: points_earned
        data_type: float64
        description: >-
          Raw points scored, populated only when source `scoretype = POINTS`
          (NULL for PERCENT/GRADESCALE/COLLECTED). Ed-Fi studentGradebookEntry
          `points_earned`.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__assignmentscore
            source_column: scorepoints
      - name: numeric_grade_earned
        data_type: float64
        description: >-
          Numeric grade scored (0-100 percent or letter-grade equivalent),
          populated only when source `scoretype` is `PERCENT`, `GRADESCALE`, or
          `COLLECTED` (NULL for POINTS). Ed-Fi studentGradebookEntry
          `numeric_grade_earned`.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__assignmentscore
            source_column: actualscoreentered
      - name: assign_final_score_percent
        data_type: float64
        description:
          The score as a percentage of the total point value for POINTS
          assignments, rounded to two places, and the entered value cast to
          numeric for every other score type.
      - name: half_total_point_value
        data_type: float64
        description:
          Half the assignment's total point value, the threshold the two
          fifty-percent summative flags compare against.
      - name: is_expected_zero
        data_type: int64
        description:
          1 where the student is expected to have a score and score_entered is
          exactly zero, 0 otherwise.
      - name: is_expected_academic_dishonesty
        data_type: int64
        description:
          1 where an expected HS assignment scored zero without being marked
          missing, 0 otherwise.
      - name: is_expected_null
        data_type: int64
        description:
          1 where the student is expected to have a score and no score was
          entered, 0 otherwise.
      - name: is_expected_late
        data_type: int64
        description:
          1 where the student is expected to have a score and the gradebook
          marks the work late, 0 otherwise.
      - name: is_expected_missing
        data_type: int64
        description:
          1 where the student is expected to have a score and the gradebook
          marks the work missing, 0 otherwise.
      - name: is_expected_scored
        data_type: boolean
        description:
          True where the student is expected to have a score and one was
          entered, whatever its value.
      - name: assign_score_above_max
        data_type: boolean
        description:
          True where an expected score_entered exceeds totalpointvalue. For
          non-POINTS assignments score_entered is the entered value, not points.
      - name: assign_mh_hwf_score_less_5
        data_type: boolean
        description: >-
          Expected H, W, or F category assignment, not marked missing, where
          score_entered < 5. Applies at every school level.
      - name: assign_ms_hwf_missing_score_not_5
        data_type: boolean
        description: >-
          H, W, or F category MS assignment with is_expected_missing = 1 where
          score_entered != 5.
      - name: assign_hs_hwfs_missing_score_not_0
        data_type: boolean
        description: >-
          H, W, F, or S category HS assignment with is_expected_missing = 1
          where score_entered != 0.
      - name: assign_ms_s_score_less_50p
        data_type: boolean
        description: >-
          Expected S category MS assignment where score_entered <
          half_total_point_value.
      - name: assign_hs_s_score_less_50p
        data_type: boolean
        description: >-
          Expected S category HS assignment, not marked missing, where
          score_entered < half_total_point_value.
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from _dbt_source_relation.
