models:
  - name: stg_cambium__njsla
    description: >-
      Union of Newark, Camden and Paterson stg_cambium__njsla (the cambium
      package model), which already carries the shared NJ-assessment shape for
      both NJSLA and NJSLA Science. Column docs and tests live there; this
      wrapper adds _dbt_source_project.
    config:
      materialized: table
    columns:
      - name: _dbt_source_project
        data_type: string
        description: >-
          Source REGION ('kippnewark' / 'kippcamden' / 'kipppaterson'), from
          extract_source_project(). Despite the name it is not the vendor.
