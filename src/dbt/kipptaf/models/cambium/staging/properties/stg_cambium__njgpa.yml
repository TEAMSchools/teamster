models:
  - name: stg_cambium__njgpa
    description: >-
      Union of Newark and Camden stg_cambium__njgpa (the cambium package model),
      in Cambium's own column names. Column docs and tests live there. No model
      reads this union; it hosts the not-empty test. Each district's
      int_cambium__all_assessments maps its own package staging models to the
      shared NJ-assessment shape.
    config:
      materialized: table
      meta:
        contains_pii: true
    columns:
      - name: _dbt_source_project
        data_type: string
        description: >-
          Source REGION ('kippnewark' / 'kippcamden'), from
          extract_source_project(). Despite the name it is not the vendor.
