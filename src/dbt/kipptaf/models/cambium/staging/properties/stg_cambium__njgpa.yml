models:
  - name: stg_cambium__njgpa
    description: >-
      Newark and Camden Cambium TIDE NJGPA results, unioned and mapped into the
      shared NJ state assessment column shape so int_pearson__all_assessments
      can union them alongside the Pearson relations. Every Cambium-to-shared
      translation lives here.
    config:
      materialized: table
    columns:
      # Columns carrying per-column data_tests sort to the top of the list, per
      # src/dbt/CLAUDE.md. Every test sets severity explicitly: kipptaf defaults
      # data_tests to +severity: warn, so a staging test without it silently
      # degrades to a warning and never fails CI.
      - name: studenttestuuid
        data_type: string
        description: >-
          Cambium's per-test identifier, unique per row. Note these are
          Cambium's own UUIDs, not Pearson's, so existing student-crosswalk rows
          keyed on Pearson UUIDs will not match Cambium records.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: period
        data_type: string
        description: >-
          Raw vendor-reported administration season, unnormalized. Contrast with
          administration_period, which case-insensitively collapses this value
          ('Fall', 'FALL', 'FallBlock') to a single 'Fall' token. This test
          exists so a novel fall token Cambium has never sent fails the build
          loudly instead of flowing through unnormalized and quietly forking a
          second Fall series downstream.

          The value list mirrors ADMINISTRATIONS in each region's
          cambium/assets.py exactly. Those are the only tokens the filename
          regex matches, so they are the only values that can reach this column;
          a token in one list and not the other fails the build on a file the
          pipeline handled correctly.
        data_tests:
          # accepted_values passes NULLs, so not_null is required alongside it
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: [Spring, Fall, FALL, FallBlock]
              config:
                severity: error
      - name: administration_period
        data_type: string
        description: >-
          Normalized from `period`, case-insensitively: 'FallBlock', 'Fall', and
          'FALL' all collapse to 'Fall'. The vendor's fall token has drifted
          historically, and an un-normalized value would create a separate
          dim_assessment_administrations tuple from the Pearson 'Fall' rows,
          splitting the Fall series on the dashboard with nothing erroring.
        data_tests:
          # accepted_values passes NULLs, so not_null is required alongside it
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: [Spring, Fall]
              config:
                severity: error
      - name: test_grade
        data_type: int64
        description: >-
          11 for both NJGPA test codes, asserted via a case over `test_code`
          rather than a bare literal so an unrecognized code yields NULL instead
          of a confident 11. NJGPA's reported grade is 11 across all Pearson
          history including 12th-grade fall retakers, and neither Cambium field
          reproduces that. See the design spec, decision D3.
        data_tests:
          # accepted_values passes NULLs, so not_null is required alongside it.
          # Together these make an unrecognized test_code fail loudly rather than
          # flowing a NULL grade level into dim_assessments, where grade_level is
          # absent from the dedup partition and so a row-count check cannot catch it.
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: [11]
                quote: false
              config:
                severity: error
      - name: testscorecomplete
        data_type: numeric
        description: >-
          Passthrough, and genuinely NULL for every Cambium row — Cambium does
          not populate it where Pearson set it to 1. Deliberately NOT
          synthesized to a constant; int_students__graduation_path_codes
          coalesces it instead. See the design spec, decision D2.
      - name: assessment_name
        data_type: string
        description: Constant 'NJGPA'.
      - name: assessment_version
        data_type: string
        description: >-
          Constant 'NJGPA-A', marking every row here as the adaptive form of the
          assessment. Cambium replaced Pearson at the spring 2026
          administration, and the adaptive form uses a different score scale, so
          graduation pathway cut scores are keyed to this value rather than to
          the student's cohort. Both vendors report the same assessment_name and
          the same testcode, so this literal is the only thing distinguishing
          the two scales downstream.
      - name: subject_area
        data_type: string
        description: >-
          Normalized from `subject`. Cambium already sends 'English Language
          Arts', so the Pearson '/Literacy' normalization is a passthrough here.
      - name: module_code
        data_type: string
        description: >-
          Equal to `testcode` (ELAGP, MATGP). The NJSLA Science SC-to-SCI remap
          in the Pearson model does not apply to NJGPA.
      - name: _dbt_source_relation
        data_type: string
        description: >-
          Source relation identifier emitted by dbt_utils.union_relations.
          Selected explicitly because int_pearson__all_assessments' include list
          expects it to arrive from the relation, not to be regenerated.
      - name: _dbt_source_project
        data_type: string
        description: >-
          Source REGION ('kippnewark' / 'kippcamden'), from
          extract_source_project(). Despite the name it is not the vendor.
      - name: results_type
        data_type: string
        description: Constant 'Actual', matching the Pearson relations.
      - name: district_state
        data_type: string
        description: Constant 'KTAF NJ', matching the Pearson relations.
      - name: assessment_type
        data_type: string
        description: Constant 'state_nj_njgpa', matching the Pearson NJGPA rows.
      - name: aligned_test_code
        data_type: string
        description:
          Equal to testcode (ELAGP, MATGP), as in the Pearson relations.
      - name: aligned_subject
        data_type: string
        description: Equal to subject_area.
      - name: admin
        data_type: string
        quote: true
        description:
          Equal to administration_period; reserved-word alias for Tableau.
      - name: illuminate_subject
        data_type: string
        description: "'Text Study' for ELA, else the subject as sent."
      - name: aligned_performance_band_group
        data_type: string
        description:
          "'Lvl 4' for Graduation Ready (level 2), 'Lvl 3' for level 1."
      - name: is_approaching_int
        data_type: int64
        description: Always 0 for NJGPA, as in the Pearson rows.
      - name: is_below_int
        data_type: int64
        description: >-
          1 for every NJGPA row, matching the Pearson macro's ELA/Math branch
          (any level below 3). Parity with prod, not a proficiency judgment.
      - name: is_proficient_int
        data_type: int64
        description: is_proficient as 1/0.
      - name: njsla_aggregated_proficiency
        data_type: string
        description: Always null; NJSLA-only column carried for the union.
      - name: njsla_performance_band_group_label
        data_type: string
        description: Always null; NJSLA-only column carried for the union.
      - name: is_504
        data_type: boolean
        description: True when student_with_disabilities is '504' or 'B'.
      - name: lep_status
        data_type: boolean
        description: True when multilingual_learner is 'Y'.
      - name: aligned_ml_status
        data_type: string
        description: "'ML' when lep_status, else 'Not ML'."
      - name: iep_status
        data_type: string
        description:
          "'Has IEP' when student_with_disabilities is 'IEP' or 'B', else 'No
          IEP'."
      - name: aligned_iep_status
        data_type: string
        description:
          "'Students With Disabilities' or 'Students Without Disabilities'."
      - name: race_ethnicity
        data_type: string
        description: >-
          Single-character code from the Cambium race flags, same priority as
          the Pearson mapping (T, H, I, A, B, P, W). Duplicated here on purpose;
          see the SQL comment.
      - name: aligned_aggregate_ethnicity
        data_type: string
        description:
          race_ethnicity expanded to the shared label; null maps to 'Blank'.
