models:
  - name: int_cambium__all_assessments
    description: >-
      Passthrough union of the Newark, Camden and Paterson
      int_cambium__all_assessments tables: Cambium TIDE NJGPA, NJSLA, NJSLA
      Science and end-of-course results, already mapped to the shared NJ
      vocabulary by the cambium package. Column docs live on the package model.
      int_assessments__state_nj_scores unions it with the Pearson history.
    config:
      meta:
        contains_pii: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_test_uuid
          config:
            severity: error
    columns:
      - name: _dbt_source_project
        data_type: string
        description: District code location derived from _dbt_source_relation.
