models:
  - name: int_illuminate__root_standards
    description: >-
      Maps each Illuminate standard to its root (top-level) standard by walking
      parent_standard_id down from standards whose parent_standard_id is 0. One
      row per standard reachable from a root; a root maps to itself. Standards
      that do not trace to a root are absent.
    config:
      materialized: table
    columns:
      - name: standard_id
        data_type: int64
        description: Illuminate standard id.
        data_tests:
          - unique
      - name: root_standard_id
        data_type: int64
        description: The top-level ancestor's standard_id.
      - name: parent_standard_id
        data_type: int64
        description: The standard's immediate parent. 0 on root rows.
