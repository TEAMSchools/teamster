models:
  - name: stg_google_sheets__coupa__school_name_lookup
    description:
      Hand-kept Google Sheet mapping an ADP home business unit, department, and
      job title to the school name Coupa shows for a user. A job title of
      `Default` is the fallback for a business unit and department with no
      title-specific row. `rpt_coupa__users` joins on all three ADP columns.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: stg_google_sheets__coupa__school_name_lookup_adp_key_unique
          description:
            The Coupa school name lookup sheet has two rows for the same ADP
            business unit, department, and job title, so every matching Coupa
            user gets two rows. To fix, delete the extra row in the sheet.
          arguments:
            combination_of_columns:
              - adp_business_unit_home_code
              - adp_department_home_name
              - adp_job_title
          config:
            severity: error
    columns:
      - name: adp_business_unit_home_code
        data_type: string
        description: ADP home business unit code.
      - name: adp_department_home_name
        data_type: string
        description: ADP home department name.
      - name: adp_job_title
        data_type: string
        description:
          ADP job title, or `Default` for the row that covers every title in the
          business unit and department.
      - name: coupa_school_name
        data_type: string
        description: School name Coupa displays for users matching this row.
