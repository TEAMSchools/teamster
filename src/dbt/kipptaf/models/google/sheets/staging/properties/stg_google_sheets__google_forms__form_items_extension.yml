models:
  - name: stg_google_sheets__google_forms__form_items_extension
    columns:
      - name: form_id
        data_type: string
      - name: item_id
        data_type: string
      - name: question_id
        data_type: string
      - name: title
        data_type: string
      - name: abbreviation
        data_type: string
      - name: url_id
        data_type: string
      - name: rated_department_code
        data_type: string
        description: >-
          Stable snake_case code for the department a survey question rates,
          hand-entered by Ops. Blank or null on questions that rate no
          department, which the Survey Dashboard routes to its most restricted
          audience. Several question abbreviations may share one code -- that is
          how departments that have merged are expressed.
      - name: rated_department_name
        data_type: string
        description: >-
          Display label for rated_department_code, hand-entered by Ops.
          Presentation only; authorization matches on the code.
