models:
  - name: stg_google_sheets__google_forms__form_items_extension
    columns:
      - name: rated_department_code
        data_type: string
        description: >-
          Stable snake_case code for the department a survey question rates,
          hand-entered by Ops. Blank or null on questions that rate no
          department, which the Survey Dashboard routes to its most restricted
          audience. Several question abbreviations may share one code -- that is
          how departments that have merged are expressed. Purchasing questions
          carry finance, student recruitment questions carry
          marketing_comms_enrollment, facilities questions carry
          real_estate_facilities, and the retired advocacy questions carry
          development.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - compliance
                  - data
                  - development
                  - finance
                  - human_resources_operations
                  - leadership_development
                  - marketing_comms_enrollment
                  - operations
                  - real_estate_facilities
                  - special_education
                  - talent_acquisition
                  - teacher_development
                  - teaching_learning
                  - technology
              config:
                severity: error
      - name: rated_department_name
        data_type: string
        description: >-
          Display label for rated_department_code, hand-entered by Ops.
          Presentation only; authorization matches on the code.
      - name: form_id
        data_type: string
      - name: item_id
        data_type: string
      - name: question_id
        data_type: string
      - name: title
        data_type: string
      - name: abbreviation
        data_type: string
      - name: url_id
        data_type: string
