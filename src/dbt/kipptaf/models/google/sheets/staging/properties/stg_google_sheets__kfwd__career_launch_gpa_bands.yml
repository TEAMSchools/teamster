models:
  - name: stg_google_sheets__kfwd__career_launch_gpa_bands
    description: >-
      GPA bands for the Career Launch GPA indicator and the points each adds to
      the launch score, from the GPA Bands tab of the Career Launch Scoring
      Rubric sheet. A band runs from its min_gpa up to, not including, the next
      band's min_gpa.
    columns:
      - name: band_key
        data_type: string
        description: Stable key for the band.
        data_tests:
          - unique:
              config:
                severity: error
      - name: min_gpa
        data_type: float64
        description: Lowest GPA in the band, inclusive.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: points
        data_type: int64
        description: >-
          Points the band adds to the launch score. Scoring treats a blank as 0
          points, so fill it on the GPA Bands tab.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: label
        data_type: string
        description: Band name shown to staff.
