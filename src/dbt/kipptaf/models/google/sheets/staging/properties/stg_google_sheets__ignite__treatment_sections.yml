models:
  - name: stg_google_sheets__ignite__treatment_sections
    description:
      The IGNITE site-lead classroom list, resolved to PowerSchool course and
      section numbers. One row per class the site leads reported running an R2I
      practice in. The resolved academic years also define the study years —
      every IGNITE model scopes to the years that appear here. Teacher names are
      deliberately absent — they are staff PII and the resolution worksheet
      holding them stays in local scratch. Match a `ref_id` beginning `Q` to the
      correspondingly numbered question in that worksheet. Resolution used class
      period plus the ICR/ICS suffix PowerSchool carries in section numbers,
      corroborated by teacher-of-record; course names could not be matched
      directly because the site-lead list numbers courses in Arabic (ENG100,
      Algebra 1) where PowerSchool uses Roman (English I, Algebra I).
    columns:
      - name: ref_id
        data_type: string
        description:
          Stable row label. `R` rows are resolved; `Q` rows correspond to the
          numbered questions sent to school staff.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: status
        data_type: string
        description:
          One of `resolved`, `pending` or `duplicate`. Only `resolved` rows are
          read downstream, so a pending section contributes no treated students.
          A `duplicate` row names a section another row already resolves — it is
          kept so the question it answers stays auditable, and excluded so the
          section join cannot fan out.
        data_tests:
          - accepted_values:
              arguments:
                values: [resolved, pending, duplicate]
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: school_name
        data_type: string
        description:
          PowerSchool school name, used as part of the section join key.

      - name: academic_year
        data_type: int64
        description:
          Start year of the school year, so 2024 is SY2024-2025. The site-lead
          list expressed these as `24-25` and `25-26`.

      - name: course_number
        data_type: string
        description:
          PowerSchool course number. Null while `status` is `pending`.

      - name: section_number
        data_type: string
        description:
          PowerSchool section number. Null while `status` is `pending`.

      - name: class_period
        data_type: string
        description:
          Class period as the site leads reported it, kept as text because
          double-block classes read `1-2` and `5-6`. Retained for audit; the
          join uses course and section number.

      - name: treatment_cp
        data_type: int64
        description:
          Co-planning indicator. Zero on every row — Mathematica confirmed only
          routine data cycles ran at KIPP NJ.

      - name: treatment_rdc
        data_type: int64
        description: Routine data cycles indicator.

      - name: treatment_rr
        data_type: int64
        description: Repeated reading indicator. Zero on every row.
