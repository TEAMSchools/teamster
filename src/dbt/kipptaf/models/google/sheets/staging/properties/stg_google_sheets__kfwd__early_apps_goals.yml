models:
  - name: stg_google_sheets__kfwd__early_apps_goals
    description: >-
      KIPP Forward early-application goals, 1 row per goal, from the goals tab
      of the KIPP Forward Early Apps Settings sheet. Each goal belongs to 1 GPA
      band and sets the college type, URM bar, and number of colleges a senior
      needs. KIPP Forward edits the goals on the sheet.
    columns:
      - name: criterion_code
        data_type: string
        description: Stable key for the goal.
        data_tests:
          - unique:
              config:
                severity: error
      - name: criterion_sort
        data_type: int64
        description: Display order of the goal within the tracker.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: gpa_band
        data_type: string
        description: >-
          GPA band the goal applies to. Must match a gpa_band on the gpa_bands
          tab, or no senior is scored against the goal.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('stg_google_sheets__kfwd__early_apps_gpa_bands')
                field: gpa_band
              config:
                severity: error
      - name: criterion_label
        data_type: string
        description: Readable goal name the tracker shows.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: required_type
        data_type: string
        description: >-
          Application type a college must have to count — ED, EA, or any.
        data_tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: [ED, EA, any]
              config:
                severity: error
      - name: urm_bar
        data_type: int64
        description:
          Minimum URM graduation rate, 0 to 100, a college needs to qualify.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: required_count
        data_type: int64
        description: Number of qualifying colleges the goal needs.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: type_label
        data_type: string
        description: >-
          The required type as the near-miss text names it, such as ED, EA, ED
          or EA, or early.
      - name: requires_full_need
        data_type: boolean
        description: True when a qualifying college must meet full need.
      - name: sets_aside_full_need
        data_type: boolean
        description: >-
          True for the goal that does not count the college already used for the
          band's full-need goal.
