models:
  - name: stg_google_sheets__dibels_foundation_goals
    description: >-
      KIPP Foundation's DIBELS benchmark goal rates by region, grade, period,
      population and goal type, transcribed from T&L's DIBELS goals tab. Long
      grain -- one row per academic year, region, grade, period, population and
      goal type. See the dibels-dashboard skill for the transcription rule and
      generator script.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - region
              - grade_level
              - period
              - population
              - grade_goal_type
          config:
            severity: error
    columns:
      - name: period
        data_type: string
        description: MOY or EOY.
        data_tests:
          - accepted_values:
              arguments:
                values: [MOY, EOY]
              config:
                severity: error
      - name: population
        data_type: string
        description: >-
          All, IEP or MLL. IEP goals exist starting AY2025 and are sparse --
          Newark and Camden grades K-5 only as of AY2025, none for grades 6-8 or
          Paterson. Absence means no goal was set, not zero. MLL goals as of
          AY2025 are placeholder values (half of the matching IEP row), not real
          T&L numbers -- see the dibels-dashboard skill.
        data_tests:
          - accepted_values:
              arguments:
                values: [All, IEP, MLL]
              config:
                severity: error
      - name: grade_goal_type
        data_type: string
        description: At/Above or Well Below.
        data_tests:
          - accepted_values:
              arguments:
                values: [At/Above, Well Below]
              config:
                severity: error
      - name: academic_year
        data_type: int64
        description: >-
          Fall-start convention -- 2025 means school year 2025-26.
      - name: region
        data_type: string
        description: Newark, Camden, Miami or Paterson.
      - name: grade_range
        data_type: string
        description: >-
          Cosmetic 3-way label -- K-2, 3-5 or 6-8. A pure function of
          grade_level, kept for continuity with the prior schema. Not used by
          tiering logic -- see grade_band.
      - name: grade_band
        data_type: string
        description: >-
          GK-5 or G6-8. Drives which row of the Bright Spot tier lookup applies
          -- G6-8 at MOY is measured against the EOY goal, not a MOY goal.
          Sheet-maintained rather than derived from grade_level, since T&L can
          change grade groupings.
      - name: grade_level
        data_type: int64
        description: Individual grade, K = 0.
      - name: grade_goal_low
        data_type: float64
        description: Low end of the goal range as published by T&L.
      - name: grade_goal_high
        data_type: float64
        description: High end of the goal range as published by T&L.
      - name: grade_goal
        data_type: float64
        description: >-
          Single-point goal used downstream, derived from
          grade_goal_low/grade_goal_high: grade_goal_low when grade_goal_type is
          At/Above, grade_goal_high when Well Below. Verified against historical
          goal values rather than assumed -- holds for MOY and EOY alike.
      - name: grade_range_goal
        data_type: float64
        description: >-
          The K-2 band-aggregate goal, same low/high rule applied to the K-2
          band row. Populated only when grade_level is 0, 1 or 2; null
          otherwise. There is no equivalent 3-5 or 6-8 band row in the source
          tab.
