models:
  - name: stg_google_sheets__assessments__academic_goals
    description: >-
      Assessment goal targets from the academic goals Google Sheet, at grade,
      school, region, network, grade-band, and assessment-band levels. One row
      per sheet row. The intended key (year, school, grade, state assessment
      code, subject) is tested at warn severity, because the sheet is
      hand-entered and can carry duplicate rows; downstream,
      `dim_assessment_goals` keeps the higher school goal when it does.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - Academic_Year
              - School_ID
              - Grade_Level
              - State_Assessment_Code
              - Illuminate_Subject_Area
    columns:
      - name: Academic_Year
        data_type: int64
        description: Academic year of the goal.
      - name: School_ID
        data_type: int64
        description: School number the goal applies to.
      - name: Grade_Level
        data_type: int64
        description: Grade level the goal applies to (0 is kindergarten).
      - name: State_Assessment_Code
        data_type: string
        description: State assessment code the goal applies to.
      - name: Illuminate_Subject_Area
        data_type: string
        description: Illuminate subject area the goal applies to.
      - name: Grade_Goal
        data_type: float64
        description: Grade-level goal.
      - name: School_Goal
        data_type: float64
        description: School-level goal.
      - name: Region_Goal
        data_type: float64
        description: Region-level goal.
      - name: Organization_Goal
        data_type: float64
        description: Network-level goal.
      - name: Grade_Band_Goal
        data_type: float64
        description: Grade-band goal.
      - name: Assessment_Band_Goal
        data_type: float64
        description: Assessment-band goal.
