models:
  - name: stg_google_sheets__dibels_expected_assessments_by_levels
    description: >
      The 18-column by-levels Expected Assessments range, cleaned -- which
      DIBELS measures each region expects to progress-monitor, per grade, round
      and student cohort. The aimline method's configuration table.

      The sibling of stg_google_sheets__dibels_expected_assessments, which backs
      the internal method from the 16-column range. Two things separate them.
      This range carries measure_standard_level, the cohort a PM row applies to,
      so each row of the internal sheet appears here twice -- once per cohort.
      And it carries PM rows only -- Benchmark was stripped out, because
      Benchmark tests every student against one set of expectations and has no
      cohort split. Benchmark is sourced from the 16-column range alone.

      Only SY25-26 forward exists here. The cohort split was introduced with
      this range, and academics confirmed there is no need to reconstruct
      earlier years.

      The sheet, not SQL, decides what is live. assessment_include is the off
      switch and pm_goal_include marks a scaffold row; both pass through
      untouched for consumers to filter.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - region
              - grade
              - admin_season
              - test_code
              - measure_standard
              - measure_standard_level
          config:
            severity: error
    columns:
      - name: academic_year
        data_type: int64
        description: >
          Academic year as the starting calendar year -- 2025 is SY25-26.
      - name: region
        data_type: string
        description: Region name -- Camden, Miami, Newark or Paterson.
      - name: grade
        data_type: int64
        description:
          Grade level the expectation applies to, with kindergarten as 0.
      - name: test_type
        data_type: string
        description: Assessment family the row belongs to, from the sheet.
      - name: discipline
        data_type: string
        description: Discipline the measure sits under, from the sheet.
      - name: subject_area
        data_type: string
        description: Subject area the measure sits under, from the sheet.
      - name: measure_standard_level
        data_type: string
        description: >
          Cohort the expectation applies to -- Below Benchmark or Well Below
          Benchmark. Written with the full benchmark-level names so it matches
          int_amplify__all_assessments.measure_standard_level and the enrollment
          extract's composite columns without a mapping step.

          This is the column that makes the range by-levels, and it is what a
          consumer must match a student on. As of SY25-26 the two cohorts carry
          identical measure sets everywhere in the sheet, because the rows were
          generated by duplicating the internal sheet per cohort -- so it
          discriminates nothing yet. It is still part of the key, so that a
          round academics later expects of one cohort only needs no
          restructuring downstream.
      - name: measure_standard
        data_type: string
        description: >
          Raw measure and standard token from the sheet, such as an individual
          measure at a benchmark level. The three expected_measure_ columns are
          parsed out of it with regexes on the underscore delimiters.
      - name: test_code
        data_type: string
        description: >
          Reporting term code for the round -- LIT1 through LIT11. Joined to
          reporting terms downstream to pick up the round's date window. Renamed
          to code at the intermediate layer, matching what
          int_google_sheets__dibels_pm_expectations calls it.
      - name: admin_season
        data_type: string
        description: >
          PM season the round sits in -- BOY->MOY or MOY->EOY. Matches the
          reporting terms name column. Never a Benchmark season here, since the
          range carries no Benchmark rows.
      - name: month_round
        data_type: string
        description: >
          Month label for the round, hand-written on the sheet. It has drifted
          from the real calendar before -- it was copied forward as a fixed
          label per season and never checked against each region's own window,
          which is wrong wherever a region does not test in the canonical month.
          Derive it from the round's start date rather than trusting the label.
      - name: illuminate_subject
        data_type: string
        description: Illuminate subject the measure maps to, from the sheet.
      - name: iready_subject
        data_type: string
        description: i-Ready subject the measure maps to, from the sheet.
      - name: ps_credit_type
        data_type: string
        description:
          PowerSchool credit type the measure maps to, from the sheet.
      - name: assessment_include
        data_type: boolean
        description: >
          The off switch. Null means the row is live; false means excluded. A
          round cancelled mid-year is switched off here rather than deleted, so
          consumers express liveness as assessment_include is null. Carried
          through unfiltered -- which years and rounds count is a sheet
          decision, not a SQL one.
      - name: pm_goal_include
        data_type: boolean
        description: >
          False marks a scaffold-fill row -- a measure tested at least once in
          the season but not in this round.

          The scaffold belongs to the internal method, which needs a continuous
          goal trajectory across untested rounds. Aimline has no trajectory and
          no use for these rows. They are present anyway, because the by-levels
          rows were generated by duplicating the internal sheet, so an aimline
          consumer must filter pm_goal_include is null rather than assume the
          column is already null.
      - name: pm_goal_criteria
        data_type: string
        description: >
          Whether a student must meet all tested standards in a round or any of
          them. AND network-wide for SY26-27, every grade -- academics confirmed
          no round mixes the two this year.
      - name: assessment_type
        data_type: string
        description: >
          Benchmark or PM, authored on the sheet rather than derived from
          admin_season. PM on every row here.
      - name: matching_bm_season
        data_type: string
        description: >
          The Benchmark season a PM round sits behind -- BOY for a BOY->MOY
          round, MOY for a MOY->EOY round. It names the benchmark administration
          whose composite decides which cohort a student belongs to for that
          season, so a consumer knows to read a BOY composite against a BOY->MOY
          round.

          It runs the opposite way to dibels_goals_long.matching_pm_season,
          which maps a Benchmark season to the PM season it is the target of.
          That one answers "which season is growing toward this benchmark"; this
          one answers "which benchmark did this season start from".
      - name: expected_measure_name_code
        data_type: string
        description: >
          Measure code parsed from measure_standard, such as ORF or WRF.
      - name: expected_measure_name
        data_type: string
        description: >
          Measure name parsed from measure_standard, such as Oral Reading
          Fluency.
      - name: expected_measure_standard
        data_type: string
        description: >
          Benchmark level parsed from measure_standard. This is what a student
          score is compared against, and the key that reaches dibels_goals_long.
      - name: grade_level_text
        data_type: string
        description: Grade level as text, with 0 rendered as K.
      - name: round_number
        data_type: int64
        description: >
          Round number parsed from test_code with a regex. Miami runs 11 rounds,
          so reading the code's last character would fold rounds 10 and 11 onto
          0 and 1.
