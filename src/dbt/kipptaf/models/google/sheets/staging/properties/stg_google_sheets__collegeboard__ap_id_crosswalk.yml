models:
  - name: stg_google_sheets__collegeboard__ap_id_crosswalk
    columns:
      - name: PowerSchool_Student_Number
        data_type: int64
        data_tests:
          # TODO(#5558): runbook
          - not_null:
              config:
                severity: warn
                description: >-
                  A College Board ID on the AP ID crosswalk sheet has no
                  PowerSchool student number. Fill in the student number on the
                  sheet; int_collegeboard__ap_unpivot drops that ID's AP scores
                  until then.
      - name: College_Board_ID
        data_type: string
