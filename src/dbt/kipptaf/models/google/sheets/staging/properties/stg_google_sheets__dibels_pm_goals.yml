models:
  - name: stg_google_sheets__dibels_pm_goals
    description: >-
      The frozen snapshot of the internal method's progress-monitoring goals,
      and the copy every evaluation reads.

      These rows are calculated by `rpt_gsheets__dibels_pm_goal_setting` and
      then copy-pasted by hand into the Google Sheet behind this model. The
      freeze is the point, not an accident of process: the goal is derived from
      the cohort's own average benchmark score, so it moves as scores arrive.
      Pasting it fixes the year's goals once they are set.

      Consequences for anyone reading this model. It is not live — a value here
      can lag the calculation, and the calculation is the thing to re-run if the
      two disagree. It carries history, unlike the goal-setting model, which
      computes `current_academic_year` only. And `Benchmark_Goal` is already
      padded by 3 words; the padding happens in the calculation, so never add it
      again here or downstream.
    columns:
      - name: Academic_Year
        data_type: int64
      - name: Region
        data_type: string
      - name: Admin_Season
        data_type: string
      - name: Assessment_Grade
        data_type: string
      - name: Assessment_Grade_Int
        data_type: int64
      - name: Measure_Standard
        data_type: string
      - name: Starting_Words
        data_type: int64
      - name: Round_Number
        data_type: int64
      - name: PM_Goal_Include
        data_type: boolean
      - name: PM_Goal_Criteria
        data_type: string
      - name: PM_Round_Days
        data_type: int64
      - name: Benchmark_Goal
        data_type: float64
      - name: Required_Growth_Words
        data_type: int64
      - name: PM_Days
        data_type: int64
      - name: Daily_Growth_Rate
        data_type: float64
      - name: Round_Growth_Words_Goal
        data_type: int64
      - name: Cumulative_Growth_Words
        data_type: float64
