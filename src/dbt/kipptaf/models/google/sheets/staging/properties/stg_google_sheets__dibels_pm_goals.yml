models:
  - name: stg_google_sheets__dibels_pm_goals
    description: >-
      The frozen snapshot of the internal method's progress-monitoring goals,
      and the copy every evaluation reads.

      These rows are calculated by `rpt_gsheets__dibels_pm_goal_setting` and
      then copy-pasted by hand into the Google Sheet behind this model. The
      freeze is the point, not an accident of process: the goal is derived from
      the cohort's own average benchmark score, so it moves as scores arrive.
      Pasting it fixes the year's goals once they are set.

      Consequences for anyone reading this model. It is not live — a value here
      can lag the calculation, and the calculation is the thing to re-run if the
      two disagree. And it carries history, unlike the goal-setting model, which
      computes `current_academic_year` only.

      `benchmark_goal` and `benchmark_goal_padded` split what used to be a
      single column holding the padded figure under the bare name.
      `benchmark_goal` is now Amplify's published grade-level standard and
      `benchmark_goal_padded` is that standard plus academics' 3-word planning
      buffer — the figure every calculation reads and the bar the at-grade-level
      verdict compares against. Both years already on the sheet were backfilled,
      so consumers read the padded column directly and need no fallback.

      `benchmark_goal_padded` carries a `not_null` test for that reason. It is a
      hand-pasted column, and a paste that omits it would otherwise make every
      at-grade-level comparison read 0 — `if(score >= null, 1, 0)` returns 0,
      not null. Failing the build is the intended behaviour.
    columns:
      - name: benchmark_goal_padded
        data_type: float64
        description: >-
          Amplify's grade-level standard plus academics' 3-word planning buffer.
          The bar every downstream at-grade-level verdict compares against.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: academic_year
        data_type: int64
      - name: region
        data_type: string
      - name: admin_season
        data_type: string
      - name: assessment_grade
        data_type: string
      - name: assessment_grade_int
        data_type: int64
      - name: measure_standard
        data_type: string
      - name: starting_words
        data_type: int64
      - name: round_number
        data_type: int64
      - name: pm_goal_include
        data_type: boolean
      - name: pm_goal_criteria
        data_type: string
      - name: pm_round_days
        data_type: int64
      - name: benchmark_goal
        data_type: float64
      - name: required_growth_words
        data_type: int64
      - name: pm_days
        data_type: int64
      - name: daily_growth_rate
        data_type: float64
      - name: round_growth_words_goal
        data_type: int64
      - name: cumulative_growth_words
        data_type: float64
