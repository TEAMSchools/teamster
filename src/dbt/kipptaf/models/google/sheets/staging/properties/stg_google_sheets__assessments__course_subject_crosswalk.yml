models:
  - name: stg_google_sheets__assessments__course_subject_crosswalk
    description: >-
      One row per course per SIS. Classifies PowerSchool and Focus courses for
      subject reporting and names each course's SIS-independent display label.
      Maintained by the data team.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - SIS
              - PowerSchool_Course_Number
          config:
            severity: error
    columns:
      - name: SIS
        description: >-
          The student information system the course number belongs to,
          PowerSchool or Focus. Part of the key, because a course number is only
          unique within one SIS.
        data_type: string
        data_tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: [PowerSchool, Focus]
              config:
                severity: error
      - name: PowerSchool_Course_Number
        description: >-
          The course number in its SIS. Holds the Florida state course code on
          Focus rows; the header keeps its original name because renaming a
          Sheets header rebuilds the external table.
        data_type: string
        data_tests:
          - not_null:
              config:
                severity: error
      - name: Core_Subject
        description: >-
          ELA or Math when the course is a student's main class in that subject.
          Blank for intervention and second courses such as Intensive Reading,
          Foundational ELA and Foundation Skills Math.
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: [ELA, Math]
              config:
                severity: error
      - name: Standard_Course_Name
        description: >-
          SIS-independent display name. PowerSchool rows carry their PowerSchool
          course name; Focus rows carry the matching NJ-style label, for example
          ELA Gr3.
        data_type: string
        data_tests:
          - not_null:
              config:
                severity: error
      - name: PowerSchool_Course_Name
        description: >-
          The course name in its SIS at the time the row was entered.
        data_type: string
      - name: Illuminate_Subject_Area
        description: >-
          Illuminate subject area used by assessment reporting. Blank on Focus
          rows.
        data_type: string
      - name: Is_Foundations
        description:
          Whether the course is a foundations course. Blank on Focus rows.
        data_type: boolean
      - name: Is_Advanced_Math
        description:
          Whether the course is an advanced math course. Blank on Focus rows.
        data_type: boolean
      - name: Discipline
        description: >-
          Academic discipline used by course and grade reporting. Blank on Focus
          rows.
        data_type: string
