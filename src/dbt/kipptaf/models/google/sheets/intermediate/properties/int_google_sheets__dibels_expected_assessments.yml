models:
  - name: int_google_sheets__dibels_expected_assessments
    description: >
      Which DIBELS measures each region expects to administer, to which grade,
      in which window -- the membership gate every downstream DIBELS model
      inner-joins to decide whether a score counts.

      Two data models run in parallel and are stacked here, told apart by
      data_model. The internal branch reads the 16-column Expected Assessments
      range and carries no cohort. The aimline branch reads the 18-column
      by-levels range, which splits each row into a Below and a Well Below copy.
      Consumers pick a branch; they are not meant to be read together, because a
      consumer that joins both matches each score twice.

      Both branches join the same reporting terms CTE, which explodes grade_band
      into one row per grade level so a grade picks up its own band's window
      rather than whichever band the join happened to reach first. A Benchmark
      window carries no band and applies to every grade.

      Rows are switched off with assessment_include rather than filtered in SQL,
      so which years and grades are live is a sheet decision. A non-null
      assessment_include means excluded, and downstream models express that as
      assessment_include is null.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - data_model
              - academic_year
              - region
              - grade
              - admin_season
              - test_code
              - measure_standard
              - measure_standard_level
    columns:
      - name: data_model
        description: >
          Which PM data model produced the row -- internal or aimline. Part of
          the grain, so a consumer must filter to one branch. Also partitions
          min_pm_round and max_pm_round, so the two models' round ranges never
          mix.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - internal
                  - aimline
      - name: academic_year
        description: >
          Academic year as the starting calendar year -- 2025 is SY25-26.
      - name: region
        description: Region name -- Camden, Miami, Newark or Paterson.
      - name: grade
        description:
          Grade level the expectation applies to, with kindergarten as 0.
      - name: measure_standard_level
        description: >
          Cohort the row applies to -- Below or Well Below. Populated only on
          the aimline branch; the internal branch's 16-column source predates
          the cohort split and tests one measure set for everyone, so it is null
          there. Part of the grain -- without it the aimline branch's two cohort
          copies collide.
      - name: assessment_include
        description: >
          The off switch. Null means the row is live; false means it is
          excluded, and every downstream consumer expresses that as
          assessment_include is null. Used to retire a year or a grade band
          without deleting sheet rows -- AY2024 PM is off on both branches, and
          99 AY2023 Benchmark rows are off because upper grades did not sit the
          assessment that year.
      - name: pm_goal_include
        description: >
          Gates whether a PM row's goal is displayed. False marks a
          scaffold-fill row -- a measure tested at least once that season but
          not in this round, kept so the goal trajectory stays continuous. Null
          means the measure is tested this round. The internal model scaffolds;
          the aimline model has no use for it, because Amplify supplies a
          per-student goal directly.
      - name: pm_goal_criteria
        description: >
          Whether a student must meet all tested standards in a round or any of
          them. AND network-wide for SY26-27.
      - name: assessment_type
        description: >
          Benchmark or PM. Derived from admin_season in the internal branch's
          staging model; authored on the sheet in the aimline branch's.
      - name: test_type
        description: Assessment family the row belongs to, from the sheet.
      - name: discipline
        description: Discipline the measure sits under, from the sheet.
      - name: subject_area
        description: Subject area the measure sits under, from the sheet.
      - name: measure_standard
        description: >
          Raw measure and standard token from the sheet, such as the composite
          or an individual measure at a benchmark level. The three
          expected_measure_ columns below are parsed out of it.
      - name: test_code
        description: >
          Reporting term code the row maps to -- LIT1 through LIT11 for a PM
          round, LIT1 to LIT3 for a Benchmark season. Joined to the terms CTE to
          pick up the window.
      - name: admin_season
        description: >
          BOY, MOY or EOY for a Benchmark row; BOY->MOY or MOY->EOY for a PM
          round. Matches the reporting terms name column.
      - name: month_round
        description: Month label for the round, derived from its own start date.
      - name: illuminate_subject
        description: Illuminate subject the measure maps to, from the sheet.
      - name: iready_subject
        description: i-Ready subject the measure maps to, from the sheet.
      - name: ps_credit_type
        description:
          PowerSchool credit type the measure maps to, from the sheet.
      - name: matching_pm_season
        description: >
          The PM season a Benchmark row anchors -- BOY maps to BOY->MOY, MOY to
          MOY->EOY. Null on PM rows. Lets a PM goal reach back to the Benchmark
          score it grows from.
      - name: expected_measure_name_code
        description: Measure code parsed from measure_standard.
      - name: expected_measure_name
        description: Measure name parsed from measure_standard.
      - name: expected_measure_standard
        description: >
          Benchmark level parsed from measure_standard. This is what a student
          score is compared against.
      - name: grade_level_text
        description: Grade level as text, with 0 rendered as K.
      - name: round_number
        description: >
          Round number parsed from test_code with a regex, so a double-digit
          round survives. Miami runs 11 rounds, and reading the last character
          would fold rounds 10 and 11 onto 0 and 1.
      - name: start_date
        description: >
          First day of the window, from the terms CTE. Null when no reporting
          terms row covers the row's year, region, season, code and grade --
          either the calendar is not entered yet, or the sheet defines an
          expectation for a grade the region did not enrol that year.
      - name: end_date
        description: Last day of the window, from the terms CTE.
      - name: min_pm_round
        description: >
          Lowest round number in the row's season, per data model, year, region,
          season and grade. Marks where a season's trajectory starts.
      - name: max_pm_round
        description: >
          Highest round number in the row's season, on the same partition as
          min_pm_round. Marks where a season's trajectory ends.
