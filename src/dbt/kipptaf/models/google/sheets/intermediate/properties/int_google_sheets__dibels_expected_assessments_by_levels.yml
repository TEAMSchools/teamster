models:
  - name: int_google_sheets__dibels_expected_assessments_by_levels
    description: >
      Which DIBELS measures each region expects to progress-monitor, per grade,
      round and student cohort -- the aimline method's membership gate, the
      by-levels sibling of int_google_sheets__dibels_expected_assessments.

      Separate model rather than a branch inside that one. The two methods were
      briefly unioned behind a data_model discriminator; splitting them at the
      source keeps the internal model's column set identical to what its
      consumers already expect and removes the trap where any consumer
      forgetting to filter data_model matched every score twice.

      PM only. The by-levels range carries no Benchmark rows and never will --
      Benchmark tests every student against one set of expectations, so it has
      no cohort split, and it is sourced from the 16-column range alone.

      The reporting terms CTE explodes grade_band into one row per grade level
      so a grade picks up its own band's window rather than whichever band the
      join reached first. The unnest is a cross join here, not a left join:
      every row in this source is a PM round, and every PM terms row carries a
      band.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - region
              - grade
              - admin_season
              - test_code
              - measure_standard
              - measure_standard_level
    columns:
      - name: measure_standard_level
        description: >
          Cohort the expectation applies to -- Below Benchmark or Well Below
          Benchmark, matching the vocabulary of
          int_amplify__all_assessments.measure_standard_level so a consumer
          compares them without mapping. Part of the grain, and it partitions
          min_pm_round and max_pm_round: the same measure and round can be
          expected of one cohort and not the other, and when that happens the
          two cohorts' round ranges differ.
        data_tests:
          - not_null
      - name: academic_year
        description: >
          Academic year as the starting calendar year -- 2025 is SY25-26.
      - name: region
        description: Region name -- Camden, Miami, Newark or Paterson.
      - name: grade
        description:
          Grade level the expectation applies to, with kindergarten as 0.
      - name: assessment_include
        description: >
          The off switch. Null means the row is live; false means excluded. Used
          to retire a round without deleting sheet rows -- a cancelled round is
          switched off here rather than filtered in SQL.
      - name: pm_goal_include
        description: >
          False marks a scaffold-fill row -- a measure tested at least once that
          season but not in this round. The scaffold belongs to the internal
          method, which needs a continuous goal trajectory; aimline has no
          trajectory and no use for these rows. They are present anyway, because
          the by-levels rows were generated by duplicating the internal sheet
          per cohort, so a consumer must filter them rather than assume they are
          absent.
      - name: pm_goal_criteria
        description: >
          Whether a student must meet all tested standards in a round or any of
          them. AND network-wide for SY26-27.
      - name: assessment_type
        description: >
          Benchmark or PM, authored on the sheet. PM on every row here.
      - name: test_type
        description: Assessment family the row belongs to, from the sheet.
      - name: discipline
        description: Discipline the measure sits under, from the sheet.
      - name: subject_area
        description: Subject area the measure sits under, from the sheet.
      - name: measure_standard
        description: >
          Raw measure and standard token from the sheet. The three
          expected_measure_ columns below are parsed out of it.
      - name: test_code
        description: >
          Reporting term code the round maps to -- LIT1 through LIT11. Joined to
          the terms CTE to pick up the window.
      - name: admin_season
        description: >
          PM season the round sits in -- BOY->MOY or MOY->EOY. Matches the
          reporting terms name column.
      - name: month_round
        description: Month label for the round, derived from its own start date.
      - name: illuminate_subject
        description: Illuminate subject the measure maps to, from the sheet.
      - name: iready_subject
        description: i-Ready subject the measure maps to, from the sheet.
      - name: ps_credit_type
        description:
          PowerSchool credit type the measure maps to, from the sheet.
      - name: matching_pm_season
        description: >
          The PM season a Benchmark row anchors. Null on every row here, since
          this source carries no Benchmark rows.
      - name: expected_measure_name_code
        description: Measure code parsed from measure_standard.
      - name: expected_measure_name
        description: Measure name parsed from measure_standard.
      - name: expected_measure_standard
        description: >
          Benchmark level parsed from measure_standard. This is what a student
          score is compared against.
      - name: grade_level_text
        description: Grade level as text, with 0 rendered as K.
      - name: round_number
        description: >
          Round number parsed from test_code with a regex, so a double-digit
          round survives. Miami runs 11 rounds, and reading the last character
          would fold rounds 10 and 11 onto 0 and 1.
      - name: start_date
        description: >
          First day of the round's window, from the terms CTE. Null when no
          reporting terms row covers the row's year, region, season, code and
          grade -- either the calendar is not entered yet, or the sheet defines
          an expectation for a grade the region did not enrol that year.
      - name: end_date
        description: Last day of the round's window, from the terms CTE.
      - name: min_pm_round
        description: >
          Lowest round number in the row's season, per year, region, season,
          grade and cohort.
      - name: max_pm_round
        description: >
          Highest round number in the row's season, on the same partition as
          min_pm_round.
