models:
  - name: int_google_sheets__kippfwd__goals_unpivot
    description: >-
      KIPP Forward's college-entrance assessment goals paired with the threshold
      each one is measured against, so a consumer gets the target percentage and
      the bar from a single model instead of joining two sheets itself.


      Two branches, because the reporting views disagree on grain, and
      rpt_consumers names which views read each one. Edit the branch your view
      is listed on; the column is the record of what else that edit moves.


      The by-grade branch is driven from stg_google_sheets__kippfwd__goals with
      a left join to the scaffold, one row per academic year, test type, grade
      level, score type, and metric. A goal whose score type has no scaffold row
      survives with a null expected_min_score rather than disappearing —
      psat10nmsqt_total is currently in that state, being a combined PSAT10 and
      PSAT NMSQT row on the goals sheet with no matching scaffold row.


      The over-time branch is driven from the scaffold instead, so it carries
      every threshold the scaffold states rather than only those a goal was
      written for. grade_level and cohort are null on it: over time reports on
      neither, tracking a cohort's full score history instead. Its percentages
      come from the goals sheet's over-time columns, which state one
      cohort-independent goal — see is_over_time_goal on the staging model.


      Attempts metrics appear on the over-time branch at the total grain only.
      An attempt is a sitting of a test, captured on the total row, so a section
      row carries no attempt count to compare against. The scaffold populates
      a1_attempt_min_score and a2_plus_attempts_min_score on every row including
      sections, and taking those literally invented 44 goal combinations the
      report has never had. Growth is excluded for the same kind of reason — a
      score change is not a sitting.


      See docs/models/carat-dashboard-data-model.md.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - test_type
              - grade_level
              - score_type
              - expected_metric_type
          config:
            severity: error
            # error, not the project's warn default, because on the by-grade
            # branch every key column is taken from the goals side of the join. A
            # fan-out on the scaffold side therefore lands as duplicate rows
            # identical in all five, and an avg() over them would skew a reported
            # goal rather than fail. The key holds across the union without
            # naming the branch: grade_level is non-null on every by-grade row
            # and null on every over-time row.
    columns:
      - name: academic_year
        data_type: int64
        description: >-
          Academic year the goal applies to, start-year convention, so SY26-27
          reads 2026.
      - name: test_type
        data_type: string
        description: Official or Practice, matching both assessment hubs.
      - name: grade_level
        data_type: string
        description: >-
          Grade the goal applies to, from the goals sheet. Always a single grade
          on the by-grade branch — the scaffold's multi-grade rows are split to
          match it rather than the reverse. Null on the over-time branch, which
          reports on cohort rather than grade, and so also the column that tells
          the two branches apart.
      - name: cohort
        data_type: string
        description: >-
          Graduating class the goal applies to, an alternate key to grade_level
          for the same students. Null on the over-time branch.
      - name: score_type
        data_type: string
        description: >-
          Score identifier the goal is measured against, matching score_type on
          the assessment hubs.
      - name: expected_metric_type
        data_type: string
        description: >-
          Which metric the goal targets — pct_1_attempt, pct_2_plus_attempts,
          pct_hs_ready, or pct_college_ready. Part of the join key, so the
          scaffold's min-score column names are mapped onto this vocabulary
          rather than carried as their own.
      - name: expected_goal_type
        data_type: string
        description: >-
          Attempts or Benchmark. Attempts compares against a count of sittings,
          Benchmark against a scale score, which is what expected_min_score
          means in each case.
      - name: expected_goal_subtype
        data_type: string
        description: >-
          The metric as the reporting views label it — 1 Attempt, 2+ Attempts,
          HS-Ready, College-Ready.
      - name: expected_metric_goal
        data_type: float64
        description: >-
          Share of students expected to meet the metric, as a 0-1 fraction. On
          the over-time branch a Benchmark goal is always the sheet's
          cohort-independent one; the Attempts metrics have no such column and
          take the per-grade goal, which is unambiguous because a score type's
          grades state the same attempt target.
          test_kippfwd_goals_over_time_collapse fails if that stops holding.


          Null where the scaffold states a threshold no goal was written for,
          which is most of the over-time branch — the ACT and every section.
      - name: expected_scope
        data_type: string
        description: >-
          The test itself — SAT, ACT, PSAT 8/9, PSAT10, PSAT NMSQT — from the
          scaffold. The goals sheet carries no scope, so this is the only place
          consumers can get it. Null on a by-grade row where no scaffold row
          matched.
      - name: expected_aligned_scope
        data_type: string
        description: >-
          Scope with ACT and SAT folded together and the two PSAT windows folded
          together, for attainment comparisons only. Never max a score
          partitioned on it. Null where no scaffold row matched.
      - name: expected_subject_area
        data_type: string
        description: >-
          Section as the source systems spell it — Combined or Composite on a
          total row. Null where no scaffold row matched.
      - name: expected_aligned_subject_area
        data_type: string
        description: >-
          Subject area with Composite and Combined folded to Total, matching
          aligned_subject_area on the assessment hub. Derived here rather than
          taken from the scaffold's same-named column, which folds the reading
          variants together as well and so belongs on expected_aligned_subject
          instead.
      - name: expected_aligned_subject
        data_type: string
        description: >-
          Subject area with the reading and EBRW variants additionally folded to
          EBRW/Reading, for comparison across test generations, matching
          aligned_subject on the assessment hub. This is the scaffold's
          expected_aligned_subject_area passed through — it already folds both
          ways.
      - name: expected_min_score
        data_type: int64
        description: >-
          The bar the metric is measured against, from the scaffold — a count of
          sittings for the Attempts metrics and a scale score for the Benchmark
          ones. Null where a goal's score type has no scaffold row; never null
          on the over-time branch, which is driven from the scaffold.
      - name: rpt_consumers
        data_type: array<string>
        description: >-
          The reporting views that read this row's branch. Repointing a view at
          a branch means appending it here, which is how a future edit can tell
          what it will move.


          A consumer selects its branch with cross join unnest(rpt_consumers) as
          rpt_consumer, then filters that plain column, so appending a consumer
          never changes an existing filter. An array rather than a delimited
          string for the same reason, and because it cannot then be joined into
          a grouping key by accident.
      - name: expected_metric_label
        data_type: string
        description: >-
          Scope and metric joined into one token — sat_1_attempt,
          psat89_hs_ready — reproducing the vocabulary the retired goals sheet
          derived, so a consumer can PIVOT on it to reach a column per metric.
          Null where no scaffold row matched, since the scope half is unknown.


          Not unique per row. Grades 11 and 12 both carry sat_total_score, so
          each SAT label appears twice on the by-grade branch. The Attempts
          metrics hold the same threshold and target at both grades, so
          aggregating over the label is safe for those. The Benchmark metrics do
          not — grade 11 and 12 differ on the target — so a PIVOT that groups on
          this column alone averages two grades into one wrong number. Keep
          grade_level in the grouping for anything Benchmark.
      - name: expected_metric_name
        data_type: string
        description: >-
          The metric as the over-time view labels it. Benchmark rows read the
          goal subtype alone — HS-Ready, College-Ready — and Attempts rows carry
          the scope too, ACT 1 Attempt or SAT 2+ Attempts, because an attempt
          count is only meaningful against a named test. Reproduces the strings
          the retired goals sheet emitted, so predicates already keyed on them
          keep working.
