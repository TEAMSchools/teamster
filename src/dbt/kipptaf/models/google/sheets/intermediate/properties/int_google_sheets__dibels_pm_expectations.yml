models:
  - name: int_google_sheets__dibels_pm_expectations
    description: >
      The PM side of the expected-assessments gate, with each round's date
      window, how many school days it spans, and the Benchmark goal its growth
      trajectory starts from. One row per measure a student in a given region,
      grade and round is expected to be progress-monitored on.

      Serves both PM data models, told apart by data_model. The internal model
      uses pm_round_days and pm_days to spread growth across a round, plus
      benchmark_goal as the target. The aimline model gets its per-student goal
      from Amplify, so it needs no day count, but it does need benchmark_goal --
      meeting the aimline while still short of the benchmark goal is a different
      category from meeting both -- and it needs the window, since a student not
      tested inside it counts as not tested.

      pm_round_days counts the round's LIT testing window plus its PLIT
      instructional window. PLIT supplies most of the count, which is why the
      round regex matches both.

      The window comes through from
      int_google_sheets__dibels_expected_assessments, which resolves it against
      each grade's own band. Re-joining reporting terms here would match every
      band at once and pick an arbitrary one.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - data_model
              - academic_year
              - region
              - grade
              - admin_season
              - code
              - expected_measure_standard
              - measure_standard_level
    columns:
      - name: data_model
        data_type: string
        description: >
          Which PM data model the row belongs to -- internal or aimline. Part of
          the grain; a consumer that does not filter it matches each score under
          both models.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - internal
                  - aimline
      - name: measure_standard_level
        data_type: string
        description: >
          Cohort the row applies to -- Below or Well Below -- and part of the
          grain. Null on every internal row, whose source has no cohort split.
          On aimline rows it decides which measures a student is held to, so the
          below-aimline-on-one-or-more-measures test is evaluated against the
          right measure set.
      - name: academic_year
        data_type: int64
        description: >
          Academic year as the starting calendar year -- 2025 is SY25-26.
      - name: region
        data_type: string
        description: Region name -- Camden, Miami, Newark or Paterson.
      - name: grade
        data_type: int64
        description:
          Grade level the expectation applies to, with kindergarten as 0.
      - name: admin_season
        data_type: string
        description: >
          PM season the round sits in -- BOY->MOY or MOY->EOY. Benchmark rows
          are excluded from this model.
      - name: code
        data_type: string
        description: >
          Reporting term code for the round -- LIT1 through LIT11. Passed
          through from the expected-assessments row rather than re-joined.
      - name: round_number
        data_type: int64
        description: >
          Round number parsed from the code. Miami runs 11 rounds, so this is a
          regex rather than the code's last character.
      - name: min_pm_round
        data_type: int64
        description:
          Lowest round number in this season, for this grade and region.
      - name: max_pm_round
        data_type: int64
        description:
          Highest round number in this season, for this grade and region.
      - name: month_round
        data_type: string
        description: Month label for the round, derived from its start date.
      - name: start_date
        data_type: date
        description: >
          First day of the round's testing window. Rows whose grade has no
          covering term row are dropped, so this is never null.
      - name: end_date
        data_type: date
        description: >
          Last day of the round's testing window. A PM score outside the window
          does not count toward the round.
      - name: pm_round_days
        data_type: int64
        description: >
          In-session school days in this round -- its LIT testing window plus
          its PLIT instructional window, counted across every non-HS school in
          the region that enrolled students that year. The internal model
          divides growth across these days. Read from the SIS-neutral calendar,
          so Miami's Focus years are not served stale PowerSchool days.
      - name: pm_days
        data_type: int64
        description: >
          Total in-session days across every round in the season, so a round's
          share of the year's growth can be worked out.
      - name: pm_goal_include
        data_type: boolean
        description: >
          False marks a scaffold-fill row -- a measure tested at least once this
          season but not this round, kept so the trajectory stays continuous.
          Null means the measure is tested this round. Always null on aimline
          rows.
      - name: pm_goal_criteria
        data_type: string
        description: >
          Whether a student must meet all tested standards in the round or any
          of them. AND network-wide for SY26-27.
      - name: expected_measure_name_code
        data_type: string
        description: Measure code, such as ORF or WRF.
      - name: expected_measure_name
        data_type: string
        description: Measure name, such as Oral Reading Fluency.
      - name: expected_measure_standard
        data_type: string
        description: >
          Measure and benchmark level a score is compared against. Joins
          dibels_goals_long to reach the Benchmark goal.
      - name: benchmark_season
        data_type: string
        description: >
          Benchmark season the goal was taken from -- BOY for a BOY->MOY round,
          MOY for MOY->EOY.
      - name: benchmark_goal
        data_type: float64
        description: >
          Benchmark score the round's growth is aimed at. A null means the
          measure was assigned outside its valid grade range, not that a goal is
          missing -- dibels_goals_long is University of Oregon's own DIBELS 8
          table, unchanged since 2020, and UO defines no goal where the measure
          is not designed to be given. In SY25-26 Miami assigned Word Reading at
          grades 4-5 (UO defines it for 0-3) and Reading Accuracy at grade 0 (UO
          defines it for 1-8). Treat a null as a testing-assignment error to
          raise with academics; it cannot be fixed by adding rows to the goals
          table. It also leaves the at-or-above-benchmark test unevaluable,
          which is what separates on-track from off-track.
