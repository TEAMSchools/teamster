models:
  - name: int_google_sheets__dibels_pm_expectations
    description: >
      The PM side of the expected-assessments gate, with each round's date
      window, how many school days it spans, and the Benchmark goal its growth
      trajectory starts from. One row per measure a student in a given region,
      grade and round is expected to be progress-monitored on.

      Internal model only -- it reads the internal branch of
      int_google_sheets__dibels_expected_assessments and nothing else. The
      internal method spreads a cohort's required growth across a round using
      pm_round_days and pm_days, against benchmark_goal as the target. The
      aimline method compares a per-student aimline instead and needs no day
      count, so it gets its own models rather than sharing this one behind a
      discriminator.

      How the day count is built, and the three decisions inside it.

      The schools it counts over come from int_students__school_directory,
      filtered two ways. Finalsite rows are next year's recruiting rather than a
      year students attended, so there is no calendar to count days in. High
      schools are excluded because DIBELS is K-8 and a high school contributing
      in-session days would inflate pm_round_days -- measured as no change on
      current data, since a high school shares its region's calendar, but it is
      wrong in principle and would bite the moment one diverges. Grade level
      drops out of the directory grain because days are counted per school-year,
      which is what the select distinct projects away.

      The calendar is int_students__calendar_day, deliberately not
      stg_powerschool__calendar_day. Miami is Focus-only from AY2026, and the
      frozen PowerSchool archive still serves a rolled-forward Miami calendar
      with phantom in-session days -- July 2026, Aug 3-11 before Focus's real
      Aug 12 start, and Jun 4-29 after its real Jun 3 end. Because the Aug 3-11
      block coincides with PLIT1's start anchor, the PowerSchool path yields
      Miami round boundaries that are wrong without looking wrong. The
      SIS-neutral model substitutes Focus for Focus-covered years and is
      day-for-day identical for all three NJ regions.

      Joining the calendar on academic_year as well as school is what handles
      the Miami SIS boundary, and it needs no hardcoded cutover year: the
      directory already assigns Miami's SY25-26 and earlier to PowerSchool and
      SY26-27 onward to Focus, so a school only contributes days to years it
      actually enrolled students in.

      The round regex is anchored, and P?LIT matches PLIT on purpose -- a
      round's day count is its LIT testing window plus its PLIT instructional
      window, and PLIT supplies most of it. Anchoring keeps that deliberate
      rather than relying on LIT matching inside PLIT, which any future code
      containing the letters LIT would also do. Reading the code's last
      character instead folds Miami's LIT10 and LIT11 onto rounds 0 and 1.

      The window comes through from
      int_google_sheets__dibels_expected_assessments, which resolves it against
      each grade's own band. Re-joining reporting terms here would match every
      band at once and pick an arbitrary one -- that re-join is what left a 7.6x
      fan-out sitting in prod. Rows whose grade no covering term row exists for
      are dropped on a null start_date, which is what the old inner join to
      terms did implicitly.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - region
              - grade
              - admin_season
              - code
              - expected_measure_standard
    columns:
      - name: academic_year
        data_type: int64
        description: >
          Academic year as the starting calendar year -- 2025 is SY25-26.
      - name: region
        data_type: string
        description: Region name -- Camden, Miami, Newark or Paterson.
      - name: grade
        data_type: int64
        description:
          Grade level the expectation applies to, with kindergarten as 0.
      - name: admin_season
        data_type: string
        description: >
          PM season the round sits in -- BOY->MOY or MOY->EOY. Benchmark rows
          are excluded from this model.
      - name: code
        data_type: string
        description: >
          Reporting term code for the round -- LIT1 through LIT11. Passed
          through from the expected-assessments row rather than re-joined.
      - name: round_number
        data_type: int64
        description: >
          Round number parsed from the code with an anchored regex. Miami runs
          11 rounds, so reading the code's last character folds rounds 10 and 11
          onto 0 and 1.
      - name: min_pm_round
        data_type: int64
        description:
          Lowest round number in this season, for this grade and region.
      - name: max_pm_round
        data_type: int64
        description:
          Highest round number in this season, for this grade and region.
      - name: month_round
        data_type: string
        description: Month label for the round, derived from its start date.
      - name: start_date
        data_type: date
        description: >
          First day of the round's testing window, resolved upstream against the
          grade's own band. Rows whose grade has no covering term row are
          dropped, so this is never null -- a grade the region did not enrol
          that year has no band covering it, which is how Paterson's AY2025
          grades 4 and 8 leave the model.
      - name: end_date
        data_type: date
        description: >
          Last day of the round's testing window. A PM score outside the window
          does not count toward the round.
      - name: pm_round_days
        data_type: int64
        description: >
          In-session school days in this round -- its LIT testing window plus
          its PLIT instructional window, counted across every non-HS school in
          the region that enrolled students that year. The internal model
          divides growth across these days. Read from the SIS-neutral calendar,
          so Miami's Focus years are not served stale PowerSchool days.
      - name: pm_days
        data_type: int64
        description: >
          Total in-session days across every round in the season, so a round's
          share of the year's growth can be worked out.
      - name: pm_goal_include
        data_type: boolean
        description: >
          False marks a scaffold-fill row -- a measure tested at least once this
          season but not this round, kept so the trajectory stays continuous.
          Null means the measure is tested this round.
      - name: pm_goal_criteria
        data_type: string
        description: >
          Whether a student must meet all tested standards in the round or any
          of them. AND network-wide for SY26-27.
      - name: expected_measure_name_code
        data_type: string
        description: Measure code, such as ORF or WRF.
      - name: expected_measure_name
        data_type: string
        description: Measure name, such as Oral Reading Fluency.
      - name: expected_measure_standard
        data_type: string
        description: >
          Measure and benchmark level a score is compared against. Joins
          dibels_goals_long to reach the Benchmark goal.
      - name: benchmark_season
        data_type: string
        description: >
          Benchmark season the goal was taken from -- BOY for a BOY->MOY round,
          MOY for MOY->EOY.
      - name: benchmark_goal
        data_type: float64
        description: >
          Benchmark score the round's growth is aimed at. A null means the
          measure was assigned outside its valid grade range, not that a goal is
          missing -- dibels_goals_long is University of Oregon's own DIBELS 8
          table, unchanged since 2020, and UO defines no goal where the measure
          is not designed to be given. In SY25-26 Miami assigned Word Reading at
          grades 4-5 (UO defines it for 0-3) and Reading Accuracy at grade 0 (UO
          defines it for 1-8). Treat a null as a testing-assignment error to
          raise with academics; it cannot be fixed by adding rows to the goals
          table. It also leaves the at-or-above-benchmark test unevaluable,
          which is what separates on-track from off-track.
