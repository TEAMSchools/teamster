models:
  - name: int_google_sheets__dibels_pm_expectations_aimline
    description: >
      The aimline method's PM expectations -- which measures a student in a
      given region, grade, round and cohort is expected to be progress-monitored
      on, with the round's window and the Benchmark goal.

      The aimline sibling of int_google_sheets__dibels_pm_expectations, and
      deliberately a separate model rather than a branch inside it. The two
      methods share almost nothing: the internal one spreads a cohort's required
      growth across a round using school-day counts, so it needs pm_round_days,
      pm_days and the whole calendar-counting apparatus. Amplify supplies an
      aimline goal per student, so none of that applies here and this model
      carries no day counts, no school directory and no calendar dependency.

      What it does carry, and why. measure_standard_level is part of the grain
      because the source declares an expectation per cohort, and the two cohorts
      are allowed to differ -- a round may test one and not the other. In
      SY25-26 they do not differ anywhere in the sheet, so the column
      discriminates nothing yet, but a consumer must still match a student to
      their own cohort: the moment academics splits a round, a consumer joining
      without it counts a Below student as failing to participate in a round
      they were correctly absent from. benchmark_goal is still needed even
      though Amplify supplies the goal, because meeting the aimline while still
      short of the benchmark goal is a different reporting category from meeting
      both. And the window is needed because a student not tested inside it
      counts as not tested.

      pm_goal_include is filtered rather than projected. It marks the internal
      method's scaffold-fill rows -- a measure tested elsewhere in the season
      but not this round, kept so a growth trajectory stays continuous. Aimline
      has no trajectory, so it has no use for them. That is a statement about
      what aimline needs, not about what the source contains: the by-levels rows
      were generated by duplicating the internal sheet per cohort, so they carry
      the scaffold verbatim. Dropping the column without filtering on it would
      emit every scaffold row as a real expectation.

      assessment_include is filtered here too. The internal chain leaves it to
      its consumers, which is prod behavior and stays that way; a new model has
      no such contract to keep, and a cancelled round is not an expectation. The
      two methods therefore disagree today on whether a cancelled round counts
      as expected -- a question for academics, not something to settle by
      quietly changing what the internal model has always returned.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - academic_year
              - region
              - grade
              - admin_season
              - code
              - expected_measure_standard
              - measure_standard_level
    columns:
      - name: measure_standard_level
        data_type: string
        description: >
          Cohort the expectation applies to -- Below Benchmark or Well Below
          Benchmark, matching the vocabulary of
          int_amplify__all_assessments.measure_standard_level and the enrollment
          extract's dibels_*_composite, so a consumer compares them without
          mapping. Part of the grain -- the same measure and round can be
          expected of one cohort and not the other.
        data_tests:
          - not_null
      - name: academic_year
        data_type: int64
        description: >
          Academic year as the starting calendar year -- 2025 is SY25-26.
      - name: region
        data_type: string
        description: Region name -- Camden, Miami, Newark or Paterson.
      - name: grade
        data_type: int64
        description:
          Grade level the expectation applies to, with kindergarten as 0.
      - name: admin_season
        data_type: string
        description: >
          PM season the round sits in -- BOY->MOY or MOY->EOY. Benchmark rows
          are excluded from this model.
      - name: code
        data_type: string
        description: >
          Reporting term code for the round -- LIT1 through LIT11. Passed
          through from the expected-assessments row.
      - name: round_number
        data_type: int64
        description: >
          Round number parsed from the code. Miami runs 11 rounds, so this is a
          regex rather than the code's last character.
      - name: min_pm_round
        data_type: int64
        description:
          Lowest round number in this season, for this grade and region.
      - name: max_pm_round
        data_type: int64
        description: >
          Highest round number in this season, for this grade and region. Marks
          the last round of the season without implying a growth trajectory.
      - name: month_round
        data_type: string
        description: Month label for the round, derived from its start date.
      - name: start_date
        data_type: date
        description: >
          First day of the round's window. Rows with no covering term row are
          dropped, so this is never null.
      - name: end_date
        data_type: date
        description: >
          Last day of the round's window. A score outside it does not count
          toward the round, which is what makes a student Not Tested.
      - name: pm_goal_criteria
        data_type: string
        description: >
          Whether a student must meet all tested standards in the round or any
          of them. AND network-wide for SY26-27, which is what makes below the
          aimline on one or more measures enough to place a student below.
      - name: expected_measure_name_code
        data_type: string
        description: Measure code, such as ORF or WRF.
      - name: expected_measure_name
        data_type: string
        description: Measure name, such as Oral Reading Fluency.
      - name: expected_measure_standard
        data_type: string
        description: >
          Measure and benchmark level a score is compared against. Joins
          dibels_goals_long to reach the Benchmark goal.
      - name: benchmark_season
        data_type: string
        description: >
          Benchmark season the goal was taken from -- BOY for a BOY->MOY round,
          MOY for MOY->EOY.
      - name: benchmark_goal
        data_type: float64
        description: >
          Benchmark score the student is measured against for the on-track half
          of the category. A null means the measure was assigned outside its
          valid grade range rather than a goal being missing --
          dibels_goals_long is University of Oregon's DIBELS 8 table, goals
          unchanged since July 2020, and UO defines none where the measure is
          not designed to be given at that grade. A null leaves the
          at-or-above-benchmark test unevaluable, which is exactly what
          separates On Track and Meeting Aimline from Meeting Aimline,
          Off-Track.
