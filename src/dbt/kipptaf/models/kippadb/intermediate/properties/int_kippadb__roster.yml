models:
  - name: int_kippadb__roster
    columns:
      - name: student_number
        data_type: int64
        data_tests:
          - unique:
              config:
                severity: error
        description: Student Number assigned by the school. Indexed.
        config:
          meta:
            source_system: PowerSchool
            source_model: stg_powerschool__students
            source_column: student_number
            contains_pii: true
            column_role: primary_key

      - name: out_of_pocket_matriculated
        data_type: float64
        description:
          Overgrad award-letter out-of-pocket cost for the college the student
          matriculated to. The matriculated school is the student's
          base_kippadb__application row flagged is_matriculated, bridged to the
          Overgrad admission by NCES/IPEDS id; null when the student has no
          matriculated application or no matching Overgrad award letter.
        config:
          meta:
            source_system: Overgrad
            source_model: int_overgrad__admissions
            source_column: award_letter__out_of_pocket

      - name: unmet_need_matriculated
        data_type: float64
        description:
          Overgrad award-letter unmet need for the college the student
          matriculated to. The matriculated school is the student's
          base_kippadb__application row flagged is_matriculated, bridged to the
          Overgrad admission by NCES/IPEDS id; null when the student has no
          matriculated application or no matching Overgrad award letter.
        config:
          meta:
            source_system: Overgrad
            source_model: int_overgrad__admissions
            source_column: award_letter__unmet_need

      - name: contact_current_college_cumulative_gpa_source
        data_type: string
        description: >-
          Source__c of the Salesforce GPA record behind
          contact_current_college_cumulative_gpa, such as Unofficial Transcript
          or Student Portal. Taken from the contact's Cumulative College GPA
          record whose GPA matches the contact GPA to 2 decimals; when several
          match, the one stg_kippadb__gpa ranks first in
          rn_student_record_type_gpa. Null when the contact has no current
          college GPA.
        config:
          meta:
            source_system: Salesforce
            source_model: stg_kippadb__gpa
            source_column: source
            contains_pii: true
