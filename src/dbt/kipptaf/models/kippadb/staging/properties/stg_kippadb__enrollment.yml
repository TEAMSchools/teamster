models:
  - name: stg_kippadb__enrollment
    description: >-
      One row per Salesforce Enrollment record that is not deleted. When a
      Graduated record has an Actual End Date after today, actual_end_date is
      blank, because a graduation cannot end in the future.
      test_sf_enrollment_graduated_end_date_future lists those records from raw
      Salesforce data.
    columns:
      - name: id
        data_type: string
        description: Salesforce id of the record.
        data_tests:
          - unique:
              config:
                severity: error
      - name: name
        data_type: string
        description: >-
          Salesforce record name (auto-number or label) of the record.
      - name: record_type_id
        data_type: string
        description: Salesforce id of the record type of the Enrollment record.
      - name: created_by_id
        data_type: string
        description: Salesforce id of the user who created the record.
      - name: created_date
        data_type: timestamp
        description: Timestamp when the record was created in Salesforce.
      - name: last_activity_date
        data_type: date
        description: >-
          Date of the most recent activity logged on the record in Salesforce.
      - name: last_modified_by_id
        data_type: string
        description: Salesforce id of the user who last modified the record.
      - name: last_modified_date
        data_type: timestamp
        description: Timestamp when the record was last modified in Salesforce.
      - name: last_referenced_date
        data_type: timestamp
        description: >-
          Timestamp when the record was last referenced in Salesforce.
      - name: last_viewed_date
        data_type: timestamp
        description: Timestamp when the record was last viewed in Salesforce.
      - name: system_modstamp
        data_type: timestamp
        description: >-
          Timestamp of the last change to the record, including system changes,
          in Salesforce.
      - name: account_type
        data_type: string
        description: Value of the Salesforce field Account_Type__c.
      - name: actual_end_date
        data_type: date
        description: Date the student actually ended the enrollment.
        config:
          meta:
            contains_pii: true
      - name: anticipated_graduation
        data_type: date
        description: Date the student is expected to graduate.
      - name: apex_updated
        data_type: numeric
        description: Value of the Salesforce field Apex_Updated__c.
      - name: attending_status
        data_type: string
        description: Value of the Salesforce field Attending_Status__c.
      - name: class_rank_percentile
        data_type: numeric
        description: Student's class rank percentile.
        config:
          meta:
            contains_pii: true
      - name: college_major_declared
        data_type: boolean
        description: Value of the Salesforce field College_Major_Declared__c.
      - name: college_standing
        data_type: string
        description: Value of the Salesforce field College_Standing__c.
      - name: college_transcript_sort_order
        data_type: numeric
        description: >-
          Value of the Salesforce field College_Transcript_Sort_Order__c.
      - name: created_for_nsc_data
        data_type: boolean
        description: Value of the Salesforce field Created_for_NSC_Data__c.
      - name: credential_attainment_sort_order
        data_type: numeric
        description: >-
          Value of the Salesforce field Credential_Attainment_Sort_Order__c.
      - name: date_last_verified
        data_type: date
        description: Date the enrollment was last verified.
      - name: diploma_or_degree_level
        data_type: string
        description: Value of the Salesforce field Diploma_or_Degree_Level__c.
      - name: do_not_overwrite_with_nsc_data
        data_type: boolean
        description: >-
          Value of the Salesforce field Do_Not_Overwrite_with_NSC_Data__c.
      - name: do_not_send_kipp_hs_class_email
        data_type: boolean
        description: >-
          Value of the Salesforce field Do_Not_Send_KIPP_HS_Class_Email__c.
      - name: dual_enrollment
        data_type: boolean
        description: Value of the Salesforce field Dual_Enrollment__c.
      - name: ending_grade
        data_type: numeric
        description: Value of the Salesforce field EndingGrade__c.
      - name: enrollment_count
        data_type: numeric
        description: Value of the Salesforce field Enrollment_Count__c.
      - name: final_gpa
        data_type: string
        description: Student's final GPA at the school, stored as text.
        config:
          meta:
            contains_pii: true
      - name: grad_year
        data_type: string
        description: Value of the Salesforce field Grad_Year__c.
        config:
          meta:
            contains_pii: true
      - name: has_terminal_status
        data_type: boolean
        description: Value of the Salesforce field Has_Terminal_Status__c.
      - name: highest_sat_score
        data_type: numeric
        description: Value of the Salesforce field Highest_SAT_Score__c.
        config:
          meta:
            contains_pii: true
      - name: living_on_campus
        data_type: boolean
        description: Value of the Salesforce field Living_on_Campus__c.
      - name: major
        data_type: string
        description: Student's major.
        config:
          meta:
            contains_pii: true
      - name: major_area
        data_type: string
        description: Value of the Salesforce field Major_Area__c.
        config:
          meta:
            contains_pii: true
      - name: major_status
        data_type: string
        description: Value of the Salesforce field Major_Status__c.
      - name: matriculated_terms
        data_type: numeric
        description: Value of the Salesforce field Matriculated_Terms__c.
      - name: most_recent_term_start_date
        data_type: date
        description: >-
          Value of the Salesforce field Most_Recent_Term_Start_Date__c.
      - name: notes
        data_type: string
        description: Free-text notes staff entered on the enrollment.
        config:
          meta:
            contains_pii: true
      - name: nsc_match_code
        data_type: string
        description: Value of the Salesforce field NSC_Match_Code__c.
      - name: nsc_verified
        data_type: boolean
        description: Value of the Salesforce field NSC_Verified__c.
      - name: number_of_marking_periods
        data_type: numeric
        description: Value of the Salesforce field Number_of_Marking_Periods__c.
      - name: of_credits_required_for_graduation
        data_type: numeric
        description: >-
          Value of the Salesforce field of_Credits_Required_for_Graduation__c.
      - name: other_major
        data_type: string
        description: Value of the Salesforce field Other_Major__c.
        config:
          meta:
            contains_pii: true
      - name: prod_migration
        data_type: boolean
        description: Value of the Salesforce field Prod_Migration__c.
      - name: pursuing_degree_type
        data_type: string
        description: Value of the Salesforce field Pursuing_Degree_Type__c.
      - name: school
        data_type: string
        description: Salesforce id of the school Account record.
      - name: source
        data_type: string
        description: Value of the Salesforce field Source__c.
      - name: special_enrollment_circumstance
        data_type: string
        description: >-
          Value of the Salesforce field Special_Enrollment_Circumstance__c.
      - name: start_date
        data_type: date
        description: Date the student started the enrollment.
        config:
          meta:
            contains_pii: true
      - name: starting_grade
        data_type: numeric
        description: Value of the Salesforce field StartingGrade__c.
      - name: status
        data_type: string
        description: Enrollment status of the student, as entered in Salesforce.
        config:
          meta:
            contains_pii: true
      - name: student
        data_type: string
        description: Salesforce id of the student's Contact record.
      - name: student_hs_cohort
        data_type: string
        description: Value of the Salesforce field Student_HS_Cohort__c.
      - name: subtype
        data_type: string
        description: Value of the Salesforce field Subtype__c.
      - name: terminal_status_sort_order
        data_type: numeric
        description: >-
          Value of the Salesforce field Terminal_Status_Sort_Order__c.
      - name: terms
        data_type: numeric
        description: Value of the Salesforce field Terms__c.
      - name: transfer_reason
        data_type: string
        description: Value of the Salesforce field Transfer_Reason__c.
        config:
          meta:
            contains_pii: true
      - name: type
        data_type: string
        description: Value of the Salesforce field Type__c.
      - name: start_date_year
        data_type: int64
        description: Calendar year of start_date.
      - name: rn_stu_school_start
        data_type: int64
        description: >-
          Row number among the student's enrollments at the same school and
          start year, ordered by start_date.

unit_tests:
  - name: unit_stg_kippadb__enrollment_graduated_future_end_date
    description: >-
      Enrollment e1 is Graduated with an end date after today, so its end date
      is blank. Enrollment e2 is Graduated with a past end date, and e3 is
      Withdrawn with a future end date; both keep their dates.
    model: stg_kippadb__enrollment
    given:
      - input: source("kippadb", "enrollment")
        rows:
          - id: e1
            status__c: Graduated
            actual_end_date__c: 2099-05-01
            isdeleted: false
          - id: e2
            status__c: Graduated
            actual_end_date__c: 2025-05-01
            isdeleted: false
          - id: e3
            status__c: Withdrawn
            actual_end_date__c: 2099-05-01
            isdeleted: false
    expect:
      rows:
        - id: e1
          actual_end_date: null
        - id: e2
          actual_end_date: 2025-05-01
        - id: e3
          actual_end_date: 2099-05-01
