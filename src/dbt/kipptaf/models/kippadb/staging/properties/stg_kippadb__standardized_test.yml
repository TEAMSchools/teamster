unit_tests:
  - name: unit_stg_kippadb__standardized_test_dedup
    description: >-
      Records t1 and t2 are the same SAT for the same student on the same date,
      so only t2, the more recently edited copy, is kept. Record t3 is a
      different date and is kept. Deleted record t4 is dropped.
    model: stg_kippadb__standardized_test
    given:
      - input: source("kippadb", "standardized_test")
        rows:
          - id: t1
            contact__c: c1
            test_type__c: SAT
            date__c: 2025-10-04
            subject__c: Total
            sat_total_score__c: 1000
            lastmodifieddate: 2025-10-10T00:00:00
            isdeleted: false
          - id: t2
            contact__c: c1
            test_type__c: SAT
            date__c: 2025-10-04
            subject__c: Total
            sat_total_score__c: 1050
            lastmodifieddate: 2025-11-01T00:00:00
            isdeleted: false
          - id: t3
            contact__c: c1
            test_type__c: SAT
            date__c: 2026-03-07
            subject__c: Total
            sat_total_score__c: 1100
            lastmodifieddate: 2026-03-20T00:00:00
            isdeleted: false
          - id: t4
            contact__c: c1
            test_type__c: SAT
            date__c: 2026-03-07
            subject__c: Math
            sat_total_score__c: 1200
            lastmodifieddate: 2026-03-21T00:00:00
            isdeleted: true
    expect:
      rows:
        - id: t2
          sat_total_score: 1050
        - id: t3
          sat_total_score: 1100
