models:
  - name: stg_kippadb__standardized_test
    description: >-
      One row per Standardized Test record in Salesforce (KIPP Forward), with
      ACT, SAT, PSAT and AP scores held as wide columns. When a contact has more
      than one record for the same test, date and subject, only the most
      recently edited record is kept. test_sf_standardized_test_duplicate lists
      the extra copies from raw Salesforce data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - contact
              - test_type
              - date
              - subject
          config:
            severity: error
    columns:
      - name: id
        data_type: string
      - name: name
        data_type: string
      - name: contact
        data_type: string
      - name: last_modified_date
        data_type: timestamp
        description: >-
          Timestamp when the record was last modified in Salesforce. Breaks ties
          between duplicate records.
      - name: date
        data_type: date
      - name: test_type
        data_type: string
      - name: subject
        data_type: string
      - name: scoring_irregularity
        data_type: boolean
      - name: administration_round
        data_type: string
      - name: act_composite
        data_type: numeric
      - name: act_ela
        data_type: numeric
      - name: act_english
        data_type: numeric
      - name: act_math
        data_type: numeric
      - name: act_reading
        data_type: numeric
      - name: act_science
        data_type: numeric
      - name: act_stem
        data_type: numeric
      - name: act_writing
        data_type: numeric
      - name: sat_total_score
        data_type: numeric
      - name: sat_ebrw
        data_type: numeric
      - name: sat_essay_analysis
        data_type: numeric
      - name: sat_essay_reading
        data_type: numeric
      - name: sat_essay_writing
        data_type: numeric
      - name: sat_math
        data_type: numeric
      - name: sat_math_test_score
        data_type: numeric
      - name: sat_reading_test_score
        data_type: numeric
      - name: sat_verbal
        data_type: numeric
      - name: sat_writing
        data_type: numeric
      - name: sat_critical_reading_pre_2016
        data_type: numeric
      - name: sat_math_pre_2016
        data_type: numeric
      - name: sat_writing_and_language_test_score
        data_type: numeric
      - name: sat_writing_pre_2016
        data_type: numeric
      - name: ap
        data_type: numeric
      - name: psat_total_score
        data_type: numeric
      - name: psat_ebrw
        data_type: numeric
      - name: psat_math
        data_type: numeric
      - name: psat_math_test_score
        data_type: numeric
      - name: psat_reading_test_score
        data_type: numeric
      - name: psat_verbal
        data_type: numeric
      - name: psat_writing
        data_type: numeric
      - name: psat_writing_and_language_test_score
        data_type: numeric
      - name: psat_critical_reading_pre_2016
        data_type: numeric
      - name: psat_math_pre_2016
