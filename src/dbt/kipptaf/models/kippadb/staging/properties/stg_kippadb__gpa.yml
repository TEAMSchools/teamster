        config:
          meta:
            contains_pii: true
      - name: rn_student_record_type_gpa
        data_type: int64
        description: >-
          Rank of the record among the student's records of the same record type
          and gpa_rounded, latest transcript_date first, then latest
          last_modified_date, then highest id. 1 marks the record that backs a
          contact GPA field holding that value, such as the current college
          cumulative GPA on int_kippadb__roster.
