data_tests:
  - name: test_kippfwd_goals_over_time_collapse
    description: >-
      int_google_sheets__kippfwd__goals_unpivot collapses the goals sheet's
      grade rows to one row for the over time branch, taking the over time goal
      where the sheet states one and the per-grade goal otherwise. Either path
      is a silent pick if the values being collapsed disagree, so the failure is
      a wrong network goal reported without complaint rather than an error.
      Fires on both shapes -- an over time goal stated inconsistently across a
      score type's grade rows, or a per-grade goal that disagrees where no over
      time goal exists to override it.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: stg_google_sheets__kippfwd__goals

  - name: test_kippfwd_goals_long_join_grain
    description: >-
      rpt_gsheets__college_assessments_long joins the All Grades benchmark goals
      on test type and score type alone, with no academic year binding, and
      resolves its pivot with any_value(). A second academic year stating a goal
      for a key that already has one would double every matching score row and
      pick a threshold arbitrarily, so the failure is a silently wrong reported
      threshold rather than an error -- which is the wrong loudness for a
      warning. The goals model already spans two academic years and stays
      unambiguous only because the earlier rows are practice ACT while the later
      ACT rows are official, a property of the data rather than of the model.
      int_google_sheets__kippfwd__goals_unpivot's own uniqueness test carries
      academic_year and so cannot catch this.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: int_google_sheets__kippfwd__goals_unpivot

  - name: test_kippfwd_miami_roster_current_year_not_empty
    description: >-
      rpt_gsheets__kippfwd_miami_roster must hold at least one row for
      var("current_academic_year"). This is the exact regression this model
      shipped once already -- the prior version verified only the prior academic
      year and silently produced zero current-year rows after the July rollover,
      because Miami PowerSchool holds no current-year data and the model still
      read PowerSchool-anchored joins for its year filter. Fails loudly if the
      current year ever again comes back empty, instead of only being caught by
      manual spot-checking.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: rpt_gsheets__kippfwd_miami_roster

  - name: test_int_finalsite__status_order_matches_crosswalk_ranking
    description: >-
      detailed_status_ranking (stg_google_sheets__finalsite__status_crosswalk,
      manually maintained) is hand-duplicated into a hardcoded CASE
      (status_order, int_finalsite__status_report_unpivot.sql) rather than
      joined live, per this repo's convention against staging-layer joins to
      Google Sheets sources. Nothing keeps the two in sync automatically --
      editing the sheet's ranking (reordering, or adding a new status) doesn't
      update the hardcoded CASE, and a drift silently produces wrong
      same-day-tie tie-breaking in int_tableau__finalsite_student_scaffold's
      latest_status_calc with no error. This test fails loudly on any
      fs_status_field whose ranking differs between the two, or that's present
      in one but missing from the other, scoped to the current Finalsite
      academic year.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: int_finalsite__status_report_unpivot

  - name: test_int_tableau__fresh_goals_scaffold_region_matches_scaffold
    description: >-
      int_tableau__fresh_goals_scaffold's inner join to the goals sheet keys on
      (schoolid, grade_level, academic_year) and region -- for any
      PowerSchool-sourced scaffold row, region comes from extract_region(), not
      the same hand-typed sheet the goals data comes from, so the match is
      coincidental rather than guaranteed. Scoped to real schools (schoolid !=
      0) -- the schoolid = 0 "Region/Grade Level" sentinel is intentionally
      shared across all four regions, so joining on schoolid alone (without
      region) fans this test out across regions for that sentinel; the real join
      in int_tableau__fresh_goals_scaffold already scopes on region too and
      handles it correctly. Warns (not errors) on any goals-sheet row for a real
      school whose typed region doesn't match the scaffold's derived region for
      the same school/grade -- that row is being silently dropped from
      int_tableau__fresh_goals_scaffold's inner join.
    config:
      meta:
        dagster:
          ref:
            name: int_tableau__fresh_goals_scaffold

  - name: test_stg_google_sheets__finalsite__status_crosswalk_single_year
    description: >-
      status_crosswalk must hold config for exactly one academic year at a time
      (a documented convention, not an enforced constraint). Several FRESH
      dashboard models/tests hardcode "the current Finalsite cycle" as a literal
      year (see the fresh-dashboard skill's year-toggle procedure) that must
      match whichever year the sheet is actually configured for -- if two years'
      config ever accumulates, joins scoped to that literal would silently miss
      or double-count rows with no error. This test fails loudly on that
      condition instead.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: stg_google_sheets__finalsite__status_crosswalk

  - name: test_int_surveys__manager_survey_details__terms_coverage
    description: >-
      Warns when int_surveys__manager_survey_details has a
      (campaign_academic_year, campaign_reporting_term) tuple with no matching
      (name='Manager Survey', type='SURVEY') row in
      stg_google_sheets__reporting__terms. Surfaces Manager Survey admin-tuple
      coverage gaps that would otherwise drop archive rows at the
      fct_survey_submissions terms join.
    config:
      meta:
        dagster:
          ref:
            name: int_surveys__manager_survey_details

  - name: dim_work_assignment_primary__no_overlapping_primary_spans
    description: >-
      Within a `staff_key` partition, the primary-position spans (joined from
      `dim_work_assignment_primary` to `dim_staff_work_assignments`, filtered to
      `is_primary_position`) must not overlap. A `lead(effective_start_date)`
      value less than or equal to the current row's `effective_end_date` means a
      staff member had two simultaneously-primary work assignments — which would
      fan out any point-in-time lookup that resolves a single primary assignment
      per staff at a date (e.g. the Cube `staff_reporting_relationships` manager
      resolver). Guards the primary-exclusivity invariant that resolver's grain
      depends on.
    config:
      meta:
        dagster:
          ref:
            name: dim_work_assignment_primary

  - name: dim_student_iep_status__no_overlapping_spans
    description: >-
      Within a `student_key` partition, consecutive IEP status spans must not
      overlap. A `lead(effective_date_start_key)` value less than or equal to
      the current row's `effective_date_end_key` indicates two
      simultaneously-active classifications for the same student in the same
      source — most often caused by EdPlan emitting two snapshot rows with
      overlapping date ranges and different `spedlep` values.

      TODO(#4801): downgraded to warn for one bad Focus record — enrollment
      771691 carries an end date two years past its school year, so it contains
      two of the same student's other AY2021 stints. Restore severity: error
      once Ops corrects it.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: dim_student_iep_status

  - name: dim_student_ell_status__no_overlapping_spans
    description: >-
      Within a `student_key` partition, consecutive ELL status spans must not
      overlap. Every emitted row implies `is_ell = true`; overlapping spans
      indicate a single source emitted two simultaneous LEP windows for the same
      student — typically the primary `lepbegindate` and a secondary
      `lepbegindate2` with overlapping ranges.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: dim_student_ell_status

  - name: dim_student_meal_eligibility_status__no_overlapping_spans
    description: >-
      Within a `student_key` partition, consecutive meal-eligibility spans must
      not overlap. The NJ leg trims each Titan annual window's end to
      day-before-next-row's-start so academic-year boundary overlaps don't
      surface in the dim.

      TODO(#4801): downgraded to warn for the same bad Focus record as the IEP
      span test — enrollment 771691. Restore severity: error once Ops corrects
      it.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: dim_student_meal_eligibility_status

  - name: test_assessment_completion
    config:
      enabled: false
      meta:
        dagster:
          ref:
            name: int_assessments__scaffold

  - name: test_current_courses_on_lookup
    config:
      enabled: false
      meta:
        dagster:
          ref:
            name: base_powerschool__course_enrollments

  - name: test_dim_regions_business_unit_code_coverage
    description: >-
      Asserts `dim_regions` has every `business_unit_code` that downstream FKs
      target. `dim_regions` is derived from
      `int_adp_workforce_now__workers__work_assignments__organizational_units__pivot`
      filtered to `business_unit_code is not null` — if ADP stops emitting a
      code that location/staff models still hash on, the chain orphans silently.
      This test fires before that happens.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: dim_regions

  - name: test_incorrect_student_number_pearson
    config:
      meta:
        dagster:
          ref:
            name: int_pearson__all_assessments

  - name: test_people__locations_drift
    description: >-
      Returns rows when the canonical-grain location master and the alias
      crosswalk drift apart. Two-direction check: `missing_in_master` — alias
      `clean_name` not present as a master `location_name` (INNER-join consumers
      would silently drop these aliases; LEFT-join consumers would propagate
      NULL canonical attrs); `missing_in_alias` — master `location_name` not
      present as an alias `clean_name` (aliases are how upstream typed strings —
      PowerSchool school names, ADP location strings, Zendesk slugs — resolve to
      a canonical row, so a master row without aliases is unreachable from most
      upstream lookups).
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: stg_google_sheets__people__locations

  - name: test_sf_contact_note_duplicate
    config:
      meta:
        dagster:
          ref:
            name: stg_kippadb__contact_note

  - name: int_assessments__resolved_section_enrollments__unique_per_score
    description: >-
      Asserts that int_assessments__resolved_section_enrollments contains one
      row per score. The score grain spans all three source branches (internal,
      state_nj, state_fl): (powerschool_student_number, _dbt_source_project,
      source_type, canonical_assessment_id, academic_year,
      administration_period, subject_area). NULL-safe via format("%T|...") so
      NULL canonical_assessment_id on state rows and NULL
      academic_year/administration_period on internal rows do not collapse the
      distinct count.
    config:
      meta:
        dagster:
          ref:
            name: int_assessments__resolved_section_enrollments

  - name: fct_assessment_scores_enrollment_scoped__term_covers_assessment_date
    description: >-
      Asserts that each score's resolved reporting quarter contains the date the
      score was administered or taken. Any resolution grain coarser than the
      score row — through the section enrollment, or through the per-score-grain
      anchor date in int_assessments__resolved_section_enrollments — assigns
      quarters that do not cover the row's own date, which is the #4484 defect.
      Failure rows name the score, its date, and the quarter it landed in.
    config:
      meta:
        dagster:
          ref:
            name: fct_assessment_scores_enrollment_scoped

  - name: int_collegeboard__ap_unpivot__crosswalk_resolves
    description: >-
      Returns one row per `stg_collegeboard__ap.ap_number_ap_id` that has no
      matching `college_board_id` in
      `stg_google_sheets__collegeboard__ap_id_crosswalk`. Each row is an
      unresolved CB-file student whose AP scores are dropped from
      `int_assessments__ap_assessments`. Ops signal to add the missing IDs to
      the crosswalk; failure rows persist in `kipptaf_dbt_test__audit` for
      direct query.
    config:
      meta:
        dagster:
          ref:
            name: int_collegeboard__ap_unpivot

  - name: rpt_focus__demographics__language_crosswalk_resolves
    description: >-
      Returns one row per `int_finalsite__contact_custom_attributes` record
      whose non-null `lang_parent_ss` has no matching `finalsite_language` in
      `stg_google_sheets__focus__language_code_crosswalk`. Each row is a
      Finalsite language value that falls through to a null Focus code in
      `rpt_focus__demographics` (LANG / PRIMARY_HOME_LANG / NATIVE_PARENT_LANG).
      Ops signal to add the missing value to the crosswalk sheet; failure rows
      persist in `kipptaf_dbt_test__audit` for direct query.
    config:
      meta:
        dagster:
          ref:
            name: int_finalsite__contact_custom_attributes

  - name: dim_student_section_enrollments__no_multi_stint_overlap
    description: >-
      Warns when a non-dropped course-enrollment (cc) record overlaps more than
      one school enrollment stint. dim_student_section_enrollments resolves
      these to a single stint (covering-first, else earliest), so a nonzero
      count is a known, monitored condition rather than a failure. Almost all
      are genuine mid-year drop/re-enroll. Miami contributes 16, and that number
      is stable across every environment measured. The New Jersey component
      drifts with the live school year -- it read 135 in one build and 128 in CI
      hours later -- so treat the total as roughly 150 rather than a fixed
      number, and watch the Miami component and the trend instead. Miami became
      visible only with this change, which added the Focus branch upstream and
      made the test's join, date predicate and drop filter null-safe; earlier
      baselines predate all three and are not comparable.
    config:
      meta:
        dagster:
          ref:
            name: dim_student_section_enrollments

  - name: test_miami_section_enrollment_orphan_rate
    description: >-
      Warns if Miami's current-year null-student_enrollment_key rate in
      dim_student_section_enrollments rises materially above where it shipped.
      Focus leaves a course period's end_date null while the schedule is open
      (coalesced to an open-ended sentinel for the stint join), so a residual of
      unmatched rows is expected, not a defect. Re-measured 2026-08-27, the
      largest cause is degenerate stint windows whose exitdate lands on or
      before their entrydate (1,332 of 1,886 same-school orphans, tracked on
      #5024), not the null end_date. Shipped at 10.5% (2,025 of 19,295 AY2026
      rows); NJ's own completed-year norm runs higher (18.16% AY2024, 19.75%
      AY2025) once a year is no longer mid-accumulation, so 15% is a real
      ceiling on the still-growing current year, not an arbitrary number.
      Tracked in #4970 -- do not drive this to zero by widening the overlap
      predicate, which would attach rows to the wrong stint.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: dim_student_section_enrollments

  - name: test_miami_section_enrollment_dropped_rate
    description: >-
      Warns if Miami's current-year `is_dropped_section` rate leaves the band
      the inference was validated against, or if the flag goes null again. Focus
      has no drop convention, so the Miami value is inferred (#4968): the
      schedule row's end_date falls before its marking period ends, and the
      student still holds an open schedule row that year. The second half
      excludes a withdrawal sweep. Both halves are assumptions about Focus
      behavior, and this test is what notices when either stops holding -- a
      bulk close of schedule rows, or a change that breaks the sweep exclusion,
      would show up as a rate spike. Shipped at 2.97% (576 of 19,363 AY2026
      rows) against a like-for-like NJ band of 0.23% to 8.55% at the same point
      in the year. The 20% ceiling sits above every NJ completed-year rate
      (17.35% Camden AY2025 is the highest measured), so it does not fire when
      Miami's own year finishes accumulating. The null check is the other
      direction: a regression in the Focus branch would restore the nulls this
      replaced, and a null flag silently removes Miami from every report using
      the bare `not is_dropped_section` idiom (#4996).
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: int_students__course_enrollments

  - name: test_focus_course_enrollment_joins_resolve_miami
    description: >-
      Fails when either repointed course-enrollment model holds zero Miami rows.
      Both models once joined students on PowerSchool's internal `cc_studentid`
      / `studentid`, which Focus leaves null on every row, so both returned no
      Miami data in any academic year while every test stayed green -- the
      breakage produced no error, only absent rows. This asserts presence rather
      than a count, because Miami's volume moves with enrollment and a floor
      would drift stale or fire on legitimate change, while zero is always
      wrong. It stays year-agnostic on purpose. #4968 made the Focus drop flags
      non-null, and #5043 made the section-count filter null-safe and added
      `scheduled_end_date`, so both models now carry Miami AY2026. The assertion
      stays presence-only and year-agnostic anyway: the two models reach Miami
      through different filters, so a year-scoped count would be measuring two
      different things at once.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: int_extracts__course_enrollments_by_term

  - name: test_focus_course_sections_teacher_resolves
    description: >-
      Warns on Focus course periods whose lead teacher does not resolve through
      the staff roster (by `ein`, falling back to email), scoped to the Focus
      population by year so the frozen Miami PowerSchool archive (which predates
      the roster and will never resolve) doesn't inflate the count. Measured
      floor is 80 AY2026 course periods: 67 with no teacher assigned in Focus at
      all, plus 13 whose assigned user resolves through neither `ein` nor email.
      Both are source data gaps in Focus / the roster, not a modeling defect.
      (`int_focus__course_periods` also holds 21 stale AY2025 rows that the
      year-scope filter correctly excludes here -- a raw, unscoped count over
      all course periods would show 101 unresolved instead, double-counting that
      stale year.)
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: int_students__course_sections

  - name: rpt_tableau__gpa_cumulative_year__one_latest_graded_year
    description: >-
      Exactly one academic year may carry `is_latest_graded_year`. More than one
      means the latest-graded-year CTE fanned out; zero means no year has posted
      Y1 grades, which would leave the dashboard with no default year.
    config:
      meta:
        dagster:
          ref:
            name: rpt_tableau__gpa_cumulative_year

  - name: int_google_sheets__gpa_goals__grade_coverage_consistent
    description: >-
      int_gpa__goal_aggregations inner-joins the student spine to the goals
      sheet, so a grade with no goal row produces no output row at all — no
      null, no zero, no error. That is correct (the goal row supplies the
      metric, threshold, direction, and the aggregation_hash grain key, so a
      goalless row could not be computed) but it means an omission in the sheet
      is invisible downstream. This test catches the likely shape of that
      omission — Ops enters goals per school, so a fat-fingered or skipped row
      leaves one grain short while its siblings are complete, and only that
      grain's grade silently disappears. Fails on any grade covered by one grain
      but missing from another grain of the SAME org level with goals for the
      same metric and year. Comparison is pooled within org level, never across
      it, so a school serving a narrower grade band than the network does not
      read as an omission. A school newer than its peers and still adding a
      grade a year does still flag against them — the same limit as grade 12
      below, in that intent is not recorded anywhere the test can read. Grains
      with no goals at all for a metric are not checked, so a metric
      intentionally scoped to fewer org levels does not fire, and coverage is
      scoped to years the student spine covers so an in-progress rollout of a
      future year's goals does not fire either. A grade omitted uniformly across
      an entire org level is indistinguishable from a deliberate choice and is
      NOT caught here — grade 12 has no Y1 GPA goal by design, and detecting
      that case would need the intent recorded in the sheet.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: stg_google_sheets__gpa_goals

  - name: int_google_sheets__gpa_goals__every_goal_aggregates
    description: >-
      The mirror of the silent-drop problem above — a goal row that matches no
      student also vanishes without a signal, because int_gpa__goal_aggregations
      is built through an inner join from the student spine. A typo in schoolid,
      a misspelled region, or a grade_low/grade_high range covering nobody all
      produce a goal that exists in the sheet, aggregates to nothing, and
      appears nowhere in rpt_tableau__gpa_goals. Fails on any goal row with no
      matching aggregation. Scoped to academic years the student spine covers so
      a goal entered ahead of its year does not fail before enrollment data
      exists, but deliberately not scoped by region — Paterson is absent from
      the spine and runs ES and MS only, so a Paterson-scoped GPA goal targets
      no students and genuinely reaches no dashboard, which is worth flagging
      rather than suppressing. Not expressible as a relationships test —
      aggregation_hash alone is not unique across years and metrics, so the
      check needs the full three-column key.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: stg_google_sheets__gpa_goals

  - name: int_people__staff_roster__locations_resolve_to_crosswalk
    description: >-
      Every active staff member's home_work_location_name must resolve to a
      canonical location_clean_name in int_people__location_crosswalk. That
      clean name is what the Tableau permissions block concatenates into a
      KNJ-SG-Tableau All Staff group name, so an unresolved location does not
      fail visibly -- it gates the row to nobody. A school added to ADP but not
      to the locations sheet is the way this breaks, which makes it a launch
      risk every time the network opens a campus.
    config:
      meta:
        dagster:
          ref:
            name: int_people__staff_roster

  - name: int_people__staff_roster__tableau_location_set_expected
    description: >-
      The set of gated locations is a known 30, and each one needs a matching
      Tableau group to gate against. Unlike the coverage test above, this fires
      when a location resolves correctly but is simply new -- the crosswalk is
      satisfied while Tableau still has no group of that name. Failing here is
      the prompt to create the group before the extract starts emitting rows
      nobody can see. Update the expected count in the same change that adds the
      group.
    config:
      meta:
        dagster:
          ref:
            name: int_people__staff_roster

  - name: int_people__staff_roster__mail_populated_with_sam
    description: >-
      Anyone holding a sam_account_name must also hold a mail value. The Tableau
      permissions block compares USERNAME() against both, and after the Entra
      identity cutover USERNAME() returns email rather than the AD username --
      so a person with a sam_account_name and no mail keeps group-based access
      but loses the self-access and manager-access tiers that match on identity.
      Warn rather than error: the population is normally zero but a single
      in-flight provisioning record should not block the run.
    config:
      meta:
        dagster:
          ref:
            name: int_people__staff_roster

  - name: rpt_clever__sections__enr_teacher_id_is_the_dso
    description: >-
      The auto-generated ENR sections must list the school's DSO as their
      primary teacher, never the School Leader. Both titles match the same
      filter in rpt_clever__sections, so the pick is stable only because
      sortorder ranks them -- without that rank the two swap on BigQuery's scan
      order, which is how ~90 sections silently changed hands and tripped
      Clever's churn alert in August 2026. Errors rather than warns: Clever
      derives each section's display name from its primary teacher, so a
      regression here rewrites every ENR section name in the feed.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: rpt_clever__sections

  - name: rpt_clever__school_id_resolves_to_schools_feed
    description: >-
      Cross-feed referential integrity for the six Clever SFTP extracts -- every
      school_id in enrollments, sections, teachers and staff must exist in
      schools. The six feeds each carry their own region filter, so a region
      added to or removed from one but not the others ships rows referencing
      schools Clever was never sent, which it silently drops or misroutes rather
      than rejecting. Errors rather than warns: this is the gate on restarting
      the hourly Clever schedule, and an orphan here means the roster Clever
      receives is internally inconsistent.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: rpt_clever__schools

  - name: rpt_clever__enrollments__student_id_resolves_to_students_feed
    description: >-
      Cross-feed referential integrity for the six Clever SFTP extracts -- every
      student_id in enrollments must exist in students. students is scoped to
      the current academic year and enrollments is not, so a region whose SIS is
      frozen at a prior year keeps shipping course enrollments for students that
      no longer appear in the student feed. Warns rather than errors, unlike the
      school_id check, because the two feeds rebuild asymmetrically under
      state:modified+ -- students descends from
      int_extracts__student_enrollments while enrollments descends only from the
      powerschool staging models, so a PR touching the enrollment chain rebuilds
      one side and reads the other frozen from the staging defer copies. That
      vintage gap alone produces orphans and blocks CI on changes that cannot
      affect feed membership.
    config:
      meta:
        dagster:
          ref:
            name: rpt_clever__students

  - name: rpt_parentsquare__sections__staff_id_resolves_at_its_own_school
    description: >-
      Every ParentSquare section's owner must hold a staff row at that section's
      own school, not merely somewhere in staff.csv. The relationships test on
      sections.staff_id is single-column, so an owner drawn from another region
      satisfies it while dangling in this region's file -- and these views span
      every NJ region, with each district wrapper slicing one region out. The
      staff feed fans a leader across the schools of their own region only, so
      (school_id, staff_id) is the pair that has to resolve. Errors rather than
      warns: ParentSquare rejects a section naming a staff member it has no
      record of at that school, which fails the whole sections import rather
      than one row.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: rpt_parentsquare__sections

  - name: rpt_parentsquare__students__every_student_has_a_roster_row
    description: >-
      Every student in the ParentSquare students feed must also appear in the
      rosters feed. A student present in students.csv with no roster row is not
      a vendor error -- ParentSquare accepts both files -- but that student sits
      in no school-and-grade section, so they silently drop out of every
      audience the feed exists to build. The rosters relationships tests only
      check the child-to-parent direction, so nothing else catches this. It
      matters because five models independently restate the same
      enrolled-student filter (_dbt_source_project, academic_year, rn_year,
      is_out_of_district, enroll_status) and the design's guarantee that rosters
      covers students rests on those copies staying textually identical. This
      test is what makes that a checked invariant rather than an assumption.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: rpt_parentsquare__students

  - name: int_students__calendar_day__zero_enrollment_in_session_days
    description: >-
      Focus in-session days at a school that enrolled nobody that year. Five
      Focus schools carry unfiltered 212-day calendars including holidays and
      breaks; two of them are closed but still map to live network location
      keys, so their days reach dim_school_calendars. The fix belongs in Focus
      configuration, so this warns rather than errors -- it makes the rows
      visible without hiding them.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: int_students__calendar_day

  - name: stg_google_sheets__google_forms__question_department_crosswalk__unique_lowered_abbreviation
    description: >-
      int_surveys__survey_responses lowers abbreviation on both sides of the
      department join, because sheet entry is not case-constrained. A plain
      unique test on the raw column therefore does not protect the join: two
      rows entered as A1 and a1 both pass it and then collide once lowered,
      fanning out every response for that question and breaking the
      response-grain uniqueness test downstream. This test asserts uniqueness on
      the lowered value, which is the grain the join actually uses, and so
      subsumes the raw unique test rather than sitting alongside it.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: stg_google_sheets__google_forms__question_department_crosswalk

  - name: rpt_tableau__okrts_behavior__all_categories_mapped
    description: >-
      Fires when stg_deanslist__behavior holds a behavior_category that is
      neither mapped in rpt_tableau__okrts_behavior's category_type CASE nor on
      the test's deliberate-exclusion list. Such a category is dropped from the
      OKRTS extract silently, which is how the AY2026 taxonomy change went
      unnoticed. A hit means either map it in the CASE, or add it to the
      exclusion list if it is intentionally out of scope.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: stg_deanslist__behavior

  - name: stg_google_sheets__google_forms__question_department_crosswalk__covers_all_abbreviations
    description: >-
      The crosswalk is maintained by hand and separately from the form items
      sheet, so a question added to a new survey form arrives with no crosswalk
      row and its responses join to a null department. That routes them to the
      Survey Dashboard's most restricted audience, which fails safe rather than
      leaking, so this warns rather than errors -- it surfaces the abbreviations
      Ops still needs to map without blocking a build.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: stg_google_sheets__google_forms__question_department_crosswalk

  - name: int_gpa__student_goal_definitions__org_rung_covers_all_rungs
    description: >-
      Asserts every region- and school-rung GPA goal's grade band is contained
      within a network-rung goal's grade band at the same academic year and
      metric. int_gpa__student_goal_definitions inner joins the network rung to
      scope its population, so a school goal without a network parent would drop
      those students with no error.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: stg_google_sheets__gpa_goals

  - name: rpt_tableau__gpa_goal_progress__goals_land_on_students
    description: >-
      Mirrors the coverage guard above from the other direction. That test
      guards the goals-sheet side of the wrapper's join —
      int_gpa__student_goal_definitions inner joins the network rung, so a
      school goal without a network parent drops silently. Nothing guarded the
      wrapper's own left join landing on students: if
      int_extracts__student_enrollments' rn_year semantics change, or a
      student_number key drifts, every high school student would silently lose
      their goal, the dashboard's goal line would go blank, and no test would
      fail. Fails on any grade 9-12 row of rpt_tableau__gpa_goal_progress with a
      null gpa_goal_proportion_org in an academic year the goals sheet covers.
      Scoped to academic years present in int_google_sheets__gpa_goals so it
      cannot false-fire for a year the goals sheet has not loaded yet.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: rpt_tableau__gpa_goal_progress

  - name: stg_cambium__njgpa__not_empty
    description: >-
      stg_cambium__njgpa must never build empty. If Cambium drops or renames a
      column the model depends on -- Summative Flag, say -- that column reads
      entirely NULL, the district staging filter (where summative_flag = 'Y' and
      test_attemptedness_flag = 'Y') returns zero rows, and unique / not_null
      pass vacuously over an empty relation. The Avro schema check cannot catch
      it either: it compares record fields against schema fields and warns only
      on extras, so a removed column produces no signal and fastavro writes
      null. Without this test NJGPA disappears from every downstream model with
      every other test still green. Declared here in kipptaf rather than in the
      cambium package because both district projects set an unscoped
      `data_tests: +severity: warn`, which overrides installed-package test
      config -- an `error` declared in the package silently resolves to `warn`,
      leaving this guard non-blocking. kipptaf's root-project tests do hold
      `error`.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: stg_cambium__njgpa
