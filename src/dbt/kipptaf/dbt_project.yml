name: kipptaf
version: 1.0.0
config-version: 2

profile: kipptaf

dbt-cloud:
  project-id: 211862

model-paths: [models]
analysis-paths: [analyses]
test-paths: [tests]
seed-paths: [seeds]
macro-paths: [macros]
snapshot-paths: [snapshots]

target-path: target
clean-targets:
  - target
  - dbt_packages

data_tests:
  +severity: warn
  +store_failures: true
  +store_failures_as: view

vars:
  local_timezone: America/New_York
  cloud_storage_uri_base: gs://teamster-kipptaf/dagster/kipptaf
  bigquery_external_connection_name: projects/teamster-332318/locations/us/connections/biglake-teamster-gcs
  current_academic_year: 2026
  current_fiscal_year: 2027
  # Distinct from current_academic_year -- SRE's recruitment cycle rolls over
  # on its own fluid timeline, not the July 1 academic-year cadence. See the
  # fresh-dashboard skill's "Update the Finalsite recruitment year" procedure
  # before bumping this.
  finalsite_recruitment_year: 2026
  # IGNITE R2I evaluation extract (#4753). Population parameters -- academic
  # years are START years, so 2024 is SY2024-2025 and Mathematica's school_year
  # 2025. Set ignite_regions to [Newark] alone if Mathematica confirms the study
  # population excludes Camden.
  ignite_academic_years: [2024, 2025]
  ignite_grade_levels: [9, 10, 11, 12]
  ignite_regions: [Newark, Camden]
  # NEVER change this salt. The masked stu_id must stay identical between the
  # phase-1 submission and the phase-2 state-assessment upload in October, or
  # Mathematica cannot join the two files and both become unusable.
  ignite_id_salt: ignite-r2i-2026

