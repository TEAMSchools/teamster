name: kippcamden
version: 1.0.0
config-version: 2

profile: kippcamden

model-paths: [models]
analysis-paths: [analyses]
test-paths: [tests]
seed-paths: []
macro-paths: [macros]
snapshot-paths: [snapshots]

target-path: target
clean-targets:
  - target
  - dbt_packages

data_tests:
  +store_failures: true
  +store_failures_as: view
  kippcamden:
    +severity: warn
  # The Pearson score models below are frozen: Cambium replaced Pearson from
  # Spring 2026, and kipptaf reads the last int_pearson__all_assessments
  # table as history. Disabling a model leaves its tests enabled, so each is
  # disabled by dbt's generated name.
  pearson:
    intermediate:
      properties:
        dbt_utils_unique_combination_of_columns_int_pearson__all_assessments_studenttestuuid:
          +enabled: false

vars:
  local_timezone: America/New_York
  current_academic_year: 2026
  current_fiscal_year: 2027
  cloud_storage_uri_base: gs://teamster-kippcamden/dagster/kippcamden
  bigquery_external_connection_name: projects/teamster-332318/locations/us/connections/biglake-teamster-gcs

models:
  kippcamden:
    extracts:
      +schema: extracts
      +contract:
        enforced: true
    powerschool:
      +materialized: table
      +schema: powerschool
      sis:
        staging:
          +contract:
            enforced: true
  finalsite:
    api:
      +enabled: true
  cambium:
    +materialized: table
  deanslist:
    +materialized: table
    staging:
      stg_deanslist__followups:
        +enabled: false
  edplan:
    +materialized: table
    staging:
      stg_edplan__njsmart_powerschool_archive:
        +enabled: false
  overgrad:
    +materialized: table
    staging:
      stg_overgrad__followings:
        +enabled: false
      stg_overgrad__schools:
        +enabled: false
  pearson:
    +materialized: table
    # Frozen: the last prod tables stay as history (see data_tests above).
    intermediate:
      int_pearson__all_assessments:
        +enabled: false
    staging:
      stg_pearson__njgpa:
        +enabled: false
      stg_pearson__njsla:
        +enabled: false
      stg_pearson__njsla_science:
        +enabled: false
      stg_pearson__parcc:
        +enabled: false
  powerschool:
    +materialized: table
    sis:
      intermediate:
        int_powerschool__contacts:
          +enabled: false
        int_powerschool__person_contacts:
          +enabled: false
  titan:
    +materialized: table
    staging:
      stg_titan__income_form_data:
        +enabled: false

sources:
  finalsite:
    finalsite:
      contacts:
        +enabled: true
  titan:
    titan:
      src_titan__income_form_data:
        +enabled: false
