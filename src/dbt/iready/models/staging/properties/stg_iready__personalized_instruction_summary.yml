models:
  - name: stg_iready__personalized_instruction_summary
    description: >-
      One row per student per date range per subject from the vendor's
      Personalized Instruction Summary export, typed and with the vendor's per-
      domain and per-strand columns renamed. Covers both classic i-Ready lessons
      and i-Ready Pro lessons, with lesson counts for classic i-Ready domains
      and skill counts for i-Ready Pro strands. Students who used only one
      product carry zeros in the other product's count columns and blanks in its
      percent columns, so read a zero together with the percent and the all-
      lessons totals. Comprehension and vocabulary counts take the classic value
      whenever it is present, including 0, so students who used only i-Ready Pro
      show 0 there; the comprehension and vocabulary percents fall through to
      the Pro value when the classic percent is blank.
    columns:
      - name: student_id
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: The vendor's Student ID for the student, cast to integer.
        data_tests:
          - not_null
      - name: academic_year
        data_type: string
        description: >-
          The academic year label as reported in the vendor's export. See
          academic_year_int for the integer form.
      - name: all_lessons_completed
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Number of classic i-Ready and i-Ready Pro lessons the student
          completed in the date range.
      - name: all_lessons_passed
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Number of classic i-Ready and i-Ready Pro lessons the student passed
          in the date range.
      - name: class_es
        data_type: string
        description: >-
          Name(s) of the class(es) the student is enrolled in within i-Ready.
      - name: class_teacher_s
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Name(s) of the teacher(s) of record for the student's i-Ready
          class(es).
      - name: date_range_end
        data_type: date
        description: >-
          Last date of the date range this row covers, parsed from the vendor's
          month/day/year text.
      - name: date_range_start
        data_type: date
        description: >-
          First date of the date range this row covers, parsed from the vendor's
          month/day/year text.
      - name: date_range
        data_type: string
        description: >-
          Label for the date range this row covers, either a week or the year to
          date, as selected in the vendor export.
      - name: economically_disadvantaged
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Flag for whether the student is economically disadvantaged, per the
          roster i-Ready received.
      - name: english_language_learner
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Flag for whether the student is an English Language Learner, per the
          roster i-Ready received.
      - name: enrolled
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Flag for whether the student is currently enrolled in i-Ready. The
          export includes both enrolled and unenrolled students who worked on
          lessons in the period.
      - name: first_name
        data_type: string
        config:
          meta:
            contains_pii: true
        description: The student's first name, as loaded from the vendor roster.
      - name: hispanic_or_latino
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Flag for whether the student is Hispanic or Latino, per the roster
          i-Ready received.
      - name: last_name
        data_type: string
        config:
          meta:
            contains_pii: true
        description: The student's last name, as loaded from the vendor roster.
      - name: migrant
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Flag for whether the student is a migrant student, per the roster
          i-Ready received.
      - name: percent_all_lessons_passed
        data_type: numeric
        config:
          meta:
            contains_pii: true
        description: >-
          Percent of classic i-Ready and i-Ready Pro lessons the student passed
          in the date range, kept as a decimal.
      - name: race
        data_type: string
        config:
          meta:
            contains_pii: true
        description: The student's race, per the roster i-Ready received.
      - name: report_group_s
        data_type: string
        description: >-
          Name(s) of the i-Ready Report Group(s) the student belongs to.
      - name: school
        data_type: string
        description: >-
          The school the student is rostered to in i-Ready, as reported in the
          vendor export.
      - name: sex
        data_type: string
        config:
          meta:
            contains_pii: true
        description: The student's sex, per the roster i-Ready received.
      - name: special_education
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Flag for whether the student receives special education services, per
          the roster i-Ready received.
      - name: student_grade
        data_type: string
        config:
          meta:
            contains_pii: true
        description: The student's grade level, as reported by the vendor.
      - name: subject
        data_type: string
        description: >-
          The subject of the export the row came from, as reported by the
          vendor.
      - name: total_lesson_time_on_task_min
        data_type: int64
        config:
