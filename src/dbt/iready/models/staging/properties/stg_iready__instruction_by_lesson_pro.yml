models:
  - name: stg_iready__instruction_by_lesson_pro
    description: >-
      One row per student per completed i-Ready Pro lesson from the vendor's Pro
      Instruction by Lesson SFTP export, typed and with a numeric pass flag.
      Covers i-Ready Pro lessons only; classic i-Ready lessons are in
      stg_iready__instruction_by_lesson.
    columns:
      - name: student_id
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The vendor's Student ID for the student in the i-Ready roster, cast to
          an integer.
        data_tests:
          - not_null
      - name: academic_year_int
        data_type: int64
        description: >-
          The academic year the export was pulled for, as the integer start year
          of the school year. Taken from the Dagster partition.
      - name: school
        data_type: string
        description: >-
          The name of the school i-Ready has the student enrolled at.
      - name: subject
        data_type: string
        description: >-
          The subject of the completed lesson, Math or Reading.
      - name: level
        data_type: string
        description: >-
          The level the completed lesson is in.
      - name: topic
        data_type: string
        description: >-
          The topic the completed lesson is in.
      - name: lesson_title
        data_type: string
        description: >-
          The title of the completed lesson.
      - name: lesson_status
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Where the student is in lesson completion or retry, such as lesson
          completed, retry available, or retry completed.
      - name: lesson_result
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Result after the student completed the lesson, Passed or Not Passed.
      - name: lesson_time_on_task_min
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Minutes the student spent on the completed lesson, including time on
          lesson retries if completed, cast to an integer.
      - name: lesson_language
        data_type: string
        description: >-
          The language of the completed lesson.
      - name: skills_completed
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Total number of skills in the completed lesson, cast to an integer.
          One column covers both the vendor's Math skills and Reading
          foundational skills fields.
      - name: skills_successful
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Number of skills the student was successful on in the completed
          lesson, cast to an integer. One column covers both the vendor's Math
          skills and Reading foundational skills fields.
      - name: items_completed
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Number of Language Comprehension items the student completed in the
          lesson, cast to an integer. Reading only.
      - name: items_correct
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          Number of Language Comprehension items the student answered correctly,
          cast to an integer. Reading only.
      - name: percent_items_correct
        data_type: numeric
        config:
          meta:
            contains_pii: true
        description: >-
          Percent of Language Comprehension items the student answered
          correctly, cast to numeric. Reading only.
      - name: completion_date
        data_type: date
        config:
          meta:
            contains_pii: true
        description: >-
          The date the student completed the lesson, parsed from the vendor's
          month/day/year text.
      - name: student_grade
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's grade level, as loaded from the vendor roster.
      - name: percent_skills_successful
        data_type: numeric
        config:
          meta:
            contains_pii: true
        description: >-
          Percent of skills the student was successful on in the lesson, cast to
          numeric. One column covers both the vendor's Math skills and Reading
          foundational skills fields.
      - name: passed_or_not_passed_numeric
        data_type: float64
        config:
          meta:
            contains_pii: true
        description: >-
          Numeric pass flag derived from lesson_result, 1.0 when the value is
          Passed and 0.0 otherwise, so it can be averaged into a pass rate.

unit_tests:
  - name: unit_iready_instruction_by_lesson_pro_decimal_formatted_ints
    description:
      Verifies the integer columns survive a source value formatted with two
      decimal places. Every column in the i-Ready Avro external is STRING, and
      the vendor export intermittently writes whole numbers as 9.00, which a
      bare cast to int64 rejects with Bad int64 value. The first row supplies
      that formatting for all five integer columns; the second supplies plain
      integers to prove the numeric round trip leaves clean values unchanged.
    model: stg_iready__instruction_by_lesson_pro
    given:
      - input: source('iready', 'src_iready__instruction_by_lesson_pro')
        format: sql
        rows: |
          select
              2026 as _dagster_partition_academic_year,
              'KIPP Miami' as school,
              '9' as student_grade,
              'Math' as `subject`,
              'Level 9' as `level`,
              'Rational Numbers' as topic,
              'Completed' as lesson_status,
              'Passed' as lesson_result,
              'English' as lesson_language,
              'Compare Rational Numbers' as lesson_title,
              '12.00' as lesson_time_on_task_min,
              '9.00' as skills_completed,
              '8.00' as skills_successful,
              '88.50' as percent_skills_successful,
              '10.00' as items_completed,
              '9.00' as items_correct,
              '90.00' as percent_items_correct,
              '900001' as student_id,
              '09/02/2026' as completion_date

          union all

          select
              2026 as _dagster_partition_academic_year,
              'KIPP Miami' as school,
              '8' as student_grade,
              'Reading' as `subject`,
              'Level 8' as `level`,
              'Vocabulary' as topic,
              'Completed' as lesson_status,
              'Not Passed' as lesson_result,
              'English' as lesson_language,
              'Context Clues' as lesson_title,
              '7' as lesson_time_on_task_min,
              '4' as skills_completed,
              '2' as skills_successful,
              '50' as percent_skills_successful,
              '6' as items_completed,
              '3' as items_correct,
              '50' as percent_items_correct,
              '900002' as student_id,
              '09/02/2026' as completion_date
    expect:
      rows:
        - student_id: 900001
          academic_year_int: 2026
          school: KIPP Miami
          subject: Math
          level: Level 9
          topic: Rational Numbers
          lesson_title: Compare Rational Numbers
          lesson_status: Completed
          lesson_result: Passed
          lesson_time_on_task_min: 12
          lesson_language: English
          skills_completed: 9
          skills_successful: 8
          items_completed: 10
          items_correct: 9
          percent_items_correct: 90.00
          completion_date: 2026-09-02
          student_grade: "9"
          percent_skills_successful: 88.50
          passed_or_not_passed_numeric: 1.0
        - student_id: 900002
          academic_year_int: 2026
          school: KIPP Miami
          subject: Reading
          level: Level 8
          topic: Vocabulary
          lesson_title: Context Clues
          lesson_status: Completed
          lesson_result: Not Passed
          lesson_time_on_task_min: 7
          lesson_language: English
          skills_completed: 4
          skills_successful: 2
          items_completed: 6
          items_correct: 3
          percent_items_correct: 50
          completion_date: 2026-09-02
          student_grade: "8"
          percent_skills_successful: 50
          passed_or_not_passed_numeric: 0.0
