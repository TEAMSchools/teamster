models:
  - name: stg_iready__instructional_usage_data
    description: >-
      One row per student per subject per last-week window from the vendor's
      legacy Instructional Usage export, with typed counts, percents, minutes,
      and dates. Each row also carries monthly and year-to-date totals by
      domain. This lineage is disabled and no longer refreshed.
    config:
      enabled: false
    columns:
      - name: student_id
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
          The vendor's Student ID for the student in the i-Ready roster.
        data_tests:
          - not_null:
              config:
                enabled: false
      - name: academic_year
        data_type: string
        description: >-
          The academic year label i-Ready assigns to the row, as reported in the
          vendor's export.
      - name: class_es
        data_type: string
        description: >-
          Name(s) of the class(es) the student is enrolled in within i-Ready.
      - name: class_teacher_s
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Name(s) of the teacher(s) of record for the student's i-Ready
          class(es).
      - name: economically_disadvantaged
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student is economically disadvantaged, per
          the district roster i-Ready received.
      - name: english_language_learner
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student is an English Language Learner, per
          the district roster i-Ready received.
      - name: enrolled
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student is currently enrolled in an i-Ready
          class.
      - name: first_name
        data_type: string
        config:
          meta:
            contains_pii: true
        description: The student's first name, as loaded from the vendor roster.
      - name: hispanic_or_latino
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student is identified as Hispanic or Latino,
          per the district roster i-Ready received.
      - name: last_name
        data_type: string
        config:
          meta:
            contains_pii: true
        description: The student's last name, as loaded from the vendor roster.
      - name: migrant
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student is identified as a migrant student,
          per the district roster i-Ready received.
      - name: race
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's race, per the district roster i-Ready received.
      - name: report_group_s
        data_type: string
        description: >-
          Name(s) of the Report Group(s) the student is enrolled in within
          i-Ready.
      - name: school
        data_type: string
        description: The name of the school i-Ready has the student enrolled at.
      - name: sex
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          The student's sex, per the district roster i-Ready received.
      - name: special_education
        data_type: string
        config:
          meta:
            contains_pii: true
        description: >-
          Y/N flag for whether the student receives special education services,
          per the district roster i-Ready received.
      - name: subject
        data_type: string
        description: >-
          The i-Ready subject (reading or math) the usage row covers, as
          reported in the vendor's export.
      - name: user_name
        data_type: string
        config:
          meta:
            contains_pii: true
        description: The student's i-Ready login username.
      - name: april_lessons_completed
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: Number of i-Ready lessons the student completed in April.
      - name: april_lessons_passed
        data_type: numeric
        config:
          meta:
            contains_pii: true
        description: Number of i-Ready lessons the student passed in April.
      - name: april_percent_lessons_passed
        data_type: numeric
        config:
          meta:
            contains_pii: true
        description: Percent of i-Ready lessons the student passed in April.
      - name: april_total_time_on_task_min
        data_type: int64
        config:
          meta:
            contains_pii: true
        description: >-
