models:
  - name: int_deanslist__students__custom_fields__pivot
    description: >-
      One row per DeansList student, with one column per student custom field.
      Pivots int_deanslist__students__custom_fields on the field's display name
      (field_name), so a field created under a different display name at one
      school does not reach its column. Values are the text staff enter in
      DeansList; a column is null where no one entered a value.
    config:
      materialized: table
      meta:
        contains_pii: true
    columns:
      - name: student_school_id
        data_type: string
        description: >-
          The student's school-facing ID in DeansList, which is the PowerSchool
          student_number. Unique within one district.
        data_tests:
          - unique:
              config:
                severity: error
      - name: 10th_hours
        data_type: string
        description: >-
          Community service hours from 10th grade, from the "10th hours" field
          (key HOURS-10TH).
      - name: 11th_hours
        data_type: string
        description: >-
          Community service hours from 11th grade, from the "11th hours" field
          (key HOURS-11TH).
      - name: 12th_hours
        data_type: string
        description: >-
          Community service hours from 12th grade, from the "12th hours" field
          (key HOURS-12TH).
      - name: 9th_hours
        data_type: string
        description: >-
          Community service hours from 9th grade, from the "9th hours" field
          (key HOURS-9TH).
      - name: asset_tag
        data_type: string
        description: >-
          Asset tag of the Chromebook deployed to the student, from the "Asset
          tag" field (key CHROMEBOOK-TAG).
      - name: date_deployed
        data_type: string
        description: >-
          Date the student's Chromebook was deployed, as entered text, from the
          "Date deployed" field (key CHROMEBOOK-DATE).
      - name: example_checkbox
        data_type: string
        description: >-
          A test field with no key, left from DeansList setup. Not used for
          reporting.
      - name: graduation_date
        data_type: string
        description: >-
          Graduation date as entered text, from the "Graduation Date" field (key
          GRAD-DATE).
      - name: hotspot_info
        data_type: string
        description: >-
          Details of a wifi hotspot loaned to the student, from the "Hotspot
          info" field (key HOTSPOT-INFO).
      - name: locker_combo
        data_type: string
        description: >-
          Locker combination, from the "Locker Combo" field (key LOCKER-COMBO).
      - name: locker_number
        data_type: string
        description: >-
          Locker number, from the "Locker Number" field (key LOCKER-NUMBER).
      - name: njsla_portal_code
        data_type: string
        description: >-
          The student's NJSLA Family Portal access code, from the "NJSLA Portal
          Code" field (key NJSLA-CODE). Families use it to see the student's
          state test results online, so handle it like a password.
