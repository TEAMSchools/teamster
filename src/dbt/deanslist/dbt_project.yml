name: deanslist
version: 1.0.0
config-version: 2
require-dbt-version: [">=1.3.0", <2.0.0]

profile: deanslist

model-paths: [models]
analysis-paths: [analyses]
test-paths: [tests]
seed-paths: []
macro-paths: [macros]
snapshot-paths: [snapshots]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  bigquery_external_connection_name: null
  # DeansList data starts in 2015-16; earlier dates are data-entry typos
  deanslist_min_valid_date: "2015-07-01"

models:
  +schema: deanslist
  deanslist:
    staging:
      +contract:
        enforced: true
