models:
  - name: int_focus__course_periods__pivot
    description: >-
      Decoded labels for the CoursePeriod select custom fields, one row per
      Focus course_period_id. Join to stg_focus__course_periods on
      course_period_id.
    columns:
      - name: course_period_id
        description: Primary key — Focus course period (section) id.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: fefp_number_label
        description: Decoded label for the fefp_number select field.
      - name: scheduling_method_label
        description: Decoded label for the scheduling_method select field.
      - name: facility_type_label
        description: Decoded label for the facility_type select field.
      - name: cert_licensure_qual_status_label
        description:
          Decoded label for the cert_licensure_qual_status select field.
      - name: highly_qualified_label
        description: Decoded label for the highly_qualified select field.
      - name: reading_intervention_component_label
        description:
          Decoded label for the reading_intervention_component select field.
      - name: location_of_student_label
        description: Decoded label for the location_of_student select field.
      - name: eoc_exam_term_label
        description: Decoded label for the eoc_exam_term select field.
      - name: basic_skills_exam_label
        description: Decoded label for the basic_skills_exam select field.
      - name: dual_enrollment_indicator_label
        description:
          Decoded label for the dual_enrollment_indicator select field.
      - name: team_teacher_training_label
        description: Decoded label for the team_teacher_training select field.
      - name: age_inst_setting_label
        description: >-
          Decoded label for the age_inst_setting select field — the Adult
          General Education institutional setting.
      - name: age_online_course_label
        description: >-
          Decoded label for the age_online_course select field — the Adult
          General Education online delivery indicator.
      - name: cte_de_location_label
        description: >-
          Decoded label for the cte_de_location select field — where a CTE dual
          enrollment course is taught.
      - name: de_inst_type_label
        description: >-
          Decoded label for the de_inst_type select field — the type of
          institution granting dual enrollment credit.
      - name: de_student_type_label
        description: >-
          Decoded label for the de_student_type select field — the dual
          enrollment student category.
      - name: function_level_label
        description: Decoded label for the function_level select field.
      - name: online_course_label
        description: Decoded label for the online_course select field.
      - name: math_intervention_label
        description: Decoded label for the math_intervention select field.
      - name: alt_date_certain_label
        description: >-
          Decoded label for the alt_date_certain select field — the alternate
          date-certain day of week the section is scheduled.
