models:
  - name: int_focus__marking_periods
    description: >-
      Focus marking periods conformed to the network terms vocabulary, one row
      per school year, semester or quarter per school. Progress periods are
      dropped -- they have no PowerSchool equivalent. Floored at 2018, KIPP
      Miami's first school year, because Focus carries template marking periods
      for two schools in every syear back to 1980.
    columns:
      - name: marking_period_id
        description: Primary key — Focus internal id of the marking period.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: school_id
        description: >-
          Focus internal school id. Not the network school number, and not the
          Florida school code the package exposes as school_number.
      - name: type
        description: One of year, semester or quarter.
      - name: title
        description: Common name for the marking period (e.g. Quarter 1).
      - name: short_name
        description: Short code for the marking period (e.g. Q1, S1, FY).
      - name: start_date
        description: First calendar date of the marking period.
      - name: end_date
        description: Last calendar date of the marking period.
      - name: academic_year
        description: Focus syear the marking period belongs to.
      - name: quarter_semester
        description: >-
          Semester the quarter falls in — S1 for Q1 and Q2, S2 otherwise.
          Meaningful only on quarter rows.
      - name: is_within_dates
        description: >-
          Whether today falls between start_date and end_date, evaluated in the
          district's local timezone.
