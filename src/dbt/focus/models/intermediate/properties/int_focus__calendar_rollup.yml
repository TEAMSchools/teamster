models:
  - name: int_focus__calendar_rollup
    description: >-
      Per-school-per-year Focus instructional day totals, one row per school per
      academic year. Emits Focus's internal schoolid; kipptaf crosswalks it.
      Internal-only -- a rpt_ view must sit between this model and any external
      consumer.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [schoolid, academic_year]
          config:
            severity: error
    columns:
      - name: schoolid
        description: >-
          Focus internal school id, not the network school number. kipptaf
          resolves it through the locations crosswalk.
      - name: academic_year
        description:
          Academic year start year (2026 = 2026-27), from Focus syear.
      - name: min_school_date
        description: First in-session day of the school year.
      - name: max_school_date
        description: Last in-session day of the school year.
      - name: days_total
        description: Total in-session days in the school year.
      - name: days_remaining
        description: In-session days still in the future as of today.
