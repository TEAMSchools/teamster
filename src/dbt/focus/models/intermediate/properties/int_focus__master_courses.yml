models:
  - name: int_focus__master_courses
    description: >-
      Focus master courses (the course catalog) with their select custom fields
      decoded to labels — every stg_focus__master_courses column plus the
      int_focus__master_courses__pivot labels. This is the model to consume; the
      pivot is a decode companion that drops entities whose custom fields are
      all null, so it is not a complete spine on its own. Column docs live on
      the two upstream models.
    columns:
      - name: course_id
        description: Primary key — Focus master course id.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
