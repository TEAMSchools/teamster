models:
  - name: int_focus__students
    description: >-
      Focus students with their select custom fields decoded to labels — every
      stg_focus__students column plus the int_focus__students__pivot labels.
      This is the model to consume; the pivot is a decode companion that drops
      entities whose custom fields are all null, so it is not a complete spine
      on its own. Column docs live on the two upstream models, except for the
      conformed columns below, which this model derives.
    config:
      meta:
        contains_pii: true
    columns:
      - name: homeless_code
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: [N, Y1, Y2]
        description:
          Network homelessness code. N when the student is recorded as not
          homeless, Y2 when homeless and not in a parent or guardian's custody,
          Y1 when homeless otherwise. Null when Focus records nothing.
      - name: student_id
        description: Primary key — Focus local student id.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: is_homeless
        data_type: boolean
        description:
          True when homeless_code is Y1 or Y2. Matches the formula the
          PowerSchool staging models use so both SIS branches agree.
      - name: homeless_primary_nighttime_residence_code
        data_type: int64
        description:
          Network primary-nighttime-residence code — 1 for shelters and
          transitional housing, 2 for doubled-up, 3 for unsheltered, 4 for
          hotels or motels. Null for students who are not homeless and for those
          awaiting foster care, which has no network analogue.
      - name: lunchstatus
        data_type: string
        description:
          Network meal-eligibility code — F for free, R for reduced, P for paid.
          Null where Focus records a school-level program status such as CEP or
          USDA Provision 2, which says nothing about the individual student.
      - name: student_number
        description: >-
          Canonical network student number for Miami: the Focus student_id,
          which carries the 8400 Miami-Dade district prefix. The bare
          pre-migration number is on powerschool_id for returning students.
        config:
          meta:
            contains_pii: true
      - name: dob
        description: Date of birth, cast from the birthdate timestamp.
        config:
          meta:
            contains_pii: true
      - name: gender
        description: >-
          Single-character gender code, extracted from the bracketed code in the
          Focus sex label.
      - name: state_studentnumber
        description: >-
          MDCPS student id, from disis_id, left-padded to the 7 digits MDCPS
          issues — Focus stores it as NUMERIC, which drops the leading zero most
          of them carry. Populated only for students the PowerSchool migration
          brought over.
        config:
          meta:
            contains_pii: true
      - name: has_iep
        description: >-
          True when the student has an ESE Exceptionalities log entry that is
          placed (P or T), not dismissed, and not gifted (L). The log is the
          determination record Focus's own "ESE Primary Computed" field reads;
          the ESE FEFP funding code is a downstream consequence and is not
          consulted.
      - name: spedlep
        description: >-
          IEP classification in the network domain. 'SPED' where has_iep, else
          null — a missing log entry does not assert that the student has no
          IEP.
      - name: fedethnicity
        description: >-
          Hispanic/Latino flag in the PowerSchool domain: 1 for the "Yes"
          option, 0 for "No", null where unset.
      - name: is_504
        description: >-
          Section 504 status from custom_621. True for codes Y and N (both
          assert a 504 plan), false for I and Z, null where the field is unset —
          a blank does not assert that the student has no plan.
      - name: gifted_and_talented
        description: >-
          Y where Gifted Eligibility names a qualifying FLDOE criteria
          paragraph, N where it records not-eligible, null where unset.
      - name: lep_status
        description: >-
          English learner status. True for LY, false for the followup, exited
          and not-applicable codes, and null for the tested-or-pending codes,
          which are unknown rather than negative.
      - name: idea_educational_environment_code
        description: >-
          Focus option code for custom_863, the IDEA educational environment. C,
          D, F, H and P are the age 6-21 out-of-district placements Florida
          reports; Z is the default and N/A is explicit not-applicable; the
          remaining codes are the age 3-5 options. Passed through from
          int_focus__students__pivot, which decodes it in its own pivot;
          int_students__student_enrollments derives is_out_of_district from this
          code rather than the editable label.
      - name: idea_educational_environment_label
        description: >-
          Decoded label for custom_863, passed through from
          int_focus__students__pivot. Supplies reporting_school_name for a Miami
          out-of-district placement, the way PowerSchool supplies the special
          program's name.
      - name: race_count
        description: Number of race flags set on the student.
      - name: ethnicity
        description: >-
          Single-character race code in the network domain. Multiple races yield
          T, a single race yields its code, and no recorded race yields null
          rather than a fabricated category.
