models:
  - name: int_focus__student_enrollment
    description: >-
      Focus student enrollments with their select custom fields decoded to
      labels — every stg_focus__student_enrollment column plus the
      int_focus__student_enrollment__pivot labels. This is the model to consume;
      the pivot is a decode companion that drops entities whose custom fields
      are all null, so it is not a complete spine on its own. Column docs live
      on the two upstream models. The denormalized enrollment spine that used to
      occupy this name — student and school attributes, decoded grade level,
      entry and exit codes, enroll_status, point-in-time flags and the
      year-in-school counters — is now int_focus__student_enrollment_roster.
    config:
      meta:
        contains_pii: true
    columns:
      - name: id
        description: >-
          Primary key — Focus student enrollment id; one row per enrollment
          stint.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
