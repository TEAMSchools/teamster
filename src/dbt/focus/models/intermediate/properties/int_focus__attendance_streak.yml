models:
  - name: int_focus__attendance_streak
    description: >-
      Consecutive-day Focus attendance streaks. Two streak families in one
      relation, distinguished by streak_type: daily_code streaks (grouped on
      Focus's raw daily attendance code, null for a present streak) and
      state_value streaks (grouped on the stringified present/absent value).
      Keyed on student_number throughout, since Focus does not populate a
      separate internal student id at this grain. Internal-only — a rpt_ view
      must sit between this model and any external consumer.
    columns:
      - name: streak_id
        description: >-
          Surrogate key for the streak, hashed from the streak family, project
          name, student_number, academic_year, the code or value, and the gap
          between the membership-day number and the per-code row number.
        data_tests:
          - unique:
              config:
                severity: error
      - name: student_number
        description: Network student number, unprefixed.
        config:
          meta:
            contains_pii: true
        data_tests:
          - not_null:
              config:
                severity: error
      - name: academic_year
        description: Academic year start year (2026 = 2026-27).
      - name: streak_type
        description: >-
          Which streak family the row belongs to — daily_code or state_value.
      - name: streak_value
        description: >-
          The grouped daily_code for a daily_code streak (null for a present
          streak), or the stringified state_value for a state_value streak.
      - name: streak_start_date
        description: First session day in the streak.
      - name: streak_end_date
        description: Last session day in the streak.
      - name: streak_length_days
        description: Count of session days in the streak.
      - name: streak_length_calendar_days
        description: >-
          Calendar days spanned by the streak, inclusive. Larger than
          streak_length_days when the streak spans a weekend or break.
