models:
  - name: int_focus__students__pivot
    description: >-
      SISStudent select custom fields decoded three ways, one row per student_id
      -- value_ is the raw stored option id or code, code_ is the Focus option
      code, and label_ is the human label. BigQuery names multi-aggregate PIVOT
      outputs {aggregate}_{field}, which is why the prefix leads. A null label
      means the student had no value for that field.
    config:
      meta:
        contains_pii: true
    columns:
      - name: student_id
        description: Primary key — Focus local student id.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: value_ethnicity_hispanic_or_latino
        description: >-
          Stored value for the ethnicity_hispanic_or_latino select field -- the
          option id or code Focus persists on the student record, before
          decoding.
        config:
          meta:
            contains_pii: true
      - name: code_ethnicity_hispanic_or_latino
        description: >-
          Focus option code for the ethnicity_hispanic_or_latino select field --
          the stable import/export value, as opposed to the editable label.
        config:
          meta:
            contains_pii: true
      - name: label_ethnicity_hispanic_or_latino
        description: >-
          Decoded label for the ethnicity_hispanic_or_latino select field.
        config:
          meta:
            contains_pii: true
