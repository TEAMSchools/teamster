models:
  - name: int_focus__schools
    description: >-
      Focus schools with their select custom fields decoded to labels — every
      stg_focus__schools column plus the int_focus__schools__pivot labels. This
      is the model to consume; the pivot is a decode companion that drops
      entities whose custom fields are all null, so it is not a complete spine
      on its own. Column docs live on the two upstream models.
    columns:
      - name: id
        description: Primary key — Focus school id.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
