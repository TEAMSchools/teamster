models:
  - name: stg_focus__apex_band_set_assessments
    description: >-
      Links between Focus Apex assessments and the mastery band set that scores
      them — one row per assessment-set pair.
    columns:
      - name: id
        description: Primary key — Focus apex_band_set_assessments id.
        data_type: int
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: band_set_id
        description: Focus apex_band_sets id.
        data_type: int
        data_tests:
          - not_null:
              config:
                severity: error
      - name: assessment_id
        description: Focus apex_assessments id.
        data_type: int
        data_tests:
          - not_null:
              config:
                severity: error
      - name: created_at
        description: Row creation timestamp in Focus.
        data_type: timestamp
      - name: updated_at
        description: Row last-update timestamp in Focus.
        data_type: timestamp
