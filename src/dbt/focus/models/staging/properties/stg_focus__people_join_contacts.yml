models:
  - name: stg_focus__people_join_contacts
    description: >-
      Focus person-to-contact-detail link — one row per contact detail (phone,
      email, etc.) attached to a person. `value` holds the contact value and
      `title` the contact-type label.
    columns:
      - name: id
        description: Primary key — Focus people-join-contacts id.
        data_type: int
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: person_id
        description: Focus person id this contact detail belongs to.
        data_type: int
        config:
          meta:
            contains_pii: true
      - name: detail_priority
        description: Ordering priority of this contact detail for the person.
        data_type: int
      - name: title
        description: Contact-type label for the detail (e.g. the contact type).
        data_type: string
      - name: value
        description: >-
          Contact value (e.g. the phone number or email address), blank-trimmed
          and normalized to null when empty.
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: imported
        description: Y/N — whether the contact detail originated from an import.
        data_type: string
      - name: unlisted
        description: Y/N — whether the contact detail is flagged unlisted.
        data_type: string
      - name: callout
        description: Y/N — whether the contact detail is included in callouts.
        data_type: string
      - name: blocked
        description: Y/N — whether the contact detail is blocked.
        data_type: string
      - name: sms
        description: Y/N — whether the contact detail can receive SMS messages.
        data_type: string
      - name: unsubscribe
        description: Y/N — whether the contact has unsubscribed from messaging.
        data_type: string
      - name: uuid
        description: Focus global unique identifier for the row.
        data_type: string
      - name: created_at
        description: Row creation timestamp in Focus.
        data_type: timestamp
      - name: updated_at
        description: Row last-update timestamp in Focus.
        data_type: timestamp
      - name: is_email_title
        description: >-
          Whether title is email-shaped (e.g. "Home Email") — when true, value
          is an email address and must never be typed as a phone.
        data_type: boolean
      - name: phone_type
        description: >-
          Inferred phone type (mobile / home / work / daytime) mapped from title
          by regex. Focus titles are free-typed and Focus publishes no type
          vocabulary, so this mapping is inferred and guarded by the
          focus_unmapped_phone_contact_titles test. Null when title matches no
          phone-type pattern.
        data_type: string
