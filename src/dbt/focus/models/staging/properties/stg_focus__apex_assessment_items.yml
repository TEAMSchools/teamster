models:
  - name: stg_focus__apex_assessment_items
    description: >-
      Focus Apex assessment items — one row per item placed on an assessment,
      with its position and point value. An item groups one or more questions
      (stg_focus__apex_item_questions).
    columns:
      - name: id
        description: Primary key — Focus apex_assessment_items id.
        data_type: int
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: assessment_id
        description: Focus apex_assessments id the item belongs to.
        data_type: int
        data_tests:
          - not_null:
              config:
                severity: error
      - name: item_id
        description: >-
          Focus Apex item id; joins to stg_focus__apex_item_questions.item_id.
        data_type: int
        data_tests:
          - not_null:
              config:
                severity: error
      - name: section_id
        description: Focus id of the assessment section holding the item.
        data_type: int
      - name: sort_order
        description: Position of the item within the assessment.
        data_type: int
      - name: points
        description: Points the item is worth on this assessment.
        data_type: numeric
      - name: conditions_json
        description: >-
          JSON text of display conditions for the item (when it is shown).
        data_type: string
      - name: created_at
        description: Row creation timestamp in Focus.
        data_type: timestamp
      - name: updated_at
        description: Row last-update timestamp in Focus.
        data_type: timestamp
