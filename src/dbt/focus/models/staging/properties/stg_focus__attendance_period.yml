models:
  - name: stg_focus__attendance_period
    description: >-
      Focus period attendance — one row per student per course period per school
      day, carrying the period-level attendance code taken by the teacher and
      any administrative override.
    columns:
      - name: id
        description: Primary key — Focus period attendance record id.
        data_type: int
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: student_id
        description: >-
          Focus student id. Note this is the network student number prefixed
          with `8400` (Miami-Dade's FLDOE district number), not the bare student
          number.
        data_type: int
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('stg_focus__students')
                field: student_id
              config:
                severity: error
        config:
          meta:
            contains_pii: true
      - name: school_date
        description: The attendance date.
        data_type: date
        data_tests:
          - not_null:
              config:
                severity: error
      - name: period_id
        description: >-
          Focus school period the attendance was taken in (joins
          `stg_focus__school_periods`).
        data_type: int
      - name: course_period_id
        description: >-
          Focus course period (section) the attendance was taken in (joins
          `stg_focus__course_periods`).
        data_type: int
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('stg_focus__course_periods')
                field: course_period_id
              config:
                severity: error
      - name: marking_period_id
        description: >-
          Focus marking period the attendance falls in (joins
          `stg_focus__marking_periods`). This table carries no `syear` — the
          marking period supplies the school year.
        data_type: int
      - name: attendance_code
        description: >-
          Official period attendance code id (joins
          `stg_focus__attendance_codes` on `id`) — the code of record after any
          administrative override.
        data_type: int
      - name: attendance_teacher_code
        description: >-
          Period attendance code id as originally taken by the teacher (joins
          `stg_focus__attendance_codes` on `id`). Differs from `attendance_code`
          where an administrator overrode the teacher's entry.
        data_type: int
      - name: attendance_reason
        description: Reason recorded alongside the period attendance code.
        data_type: string
      - name: hourly_attendance
        description: Y/N — whether the period is tracked as hourly attendance.
        data_type: string
      - name: hours
        description: Hours attended in the period, as an `HH:MM` string.
        data_type: string
      - name: minutes_present
        description: Minutes the student was present in the period.
        data_type: numeric
      - name: minutes_absent
        description: Minutes the student was absent from the period.
        data_type: numeric
      - name: breaks
        description: Number of breaks taken during the period.
        data_type: int
      - name: break_minutes
        description: Total break minutes during the period.
        data_type: numeric
      - name: break_times
        description: Break start/end times recorded for the period.
        data_type: string
      - name: break_out_time
        description: Clock-out time for the current open break.
        data_type: numeric
      - name: admin
        description: >-
          Y/N — whether an administrator, rather than the teacher, set the code
          of record.
        data_type: string
      - name: admin_user_id
        description: Focus user id of the administrator who set the code.
        data_type: int
      - name: mass_assigned
        description: >-
          Y/N — whether the code was applied by a mass-assign action rather than
          entered per student.
        data_type: string
      - name: notified
        description: Y/N — whether a notification was sent for the period.
        data_type: string
      - name: notified_callouts
        description: Callout notifications sent for the period attendance.
        data_type: string
      - name: last_updated_user
        description: Identifier of the user who last updated the record.
        data_type: int
      - name: last_updated_date
        description: Source last-updated timestamp.
        data_type: timestamp
      - name: imported
        description: Y/N — whether the record was imported.
        data_type: string
      - name: uuid
        description: Focus global unique identifier for the row.
        data_type: string
      - name: created_at
        description: Row creation timestamp in Focus.
        data_type: timestamp
      - name: updated_at
        description: Row last-update timestamp in Focus.
        data_type: timestamp
