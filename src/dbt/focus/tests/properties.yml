data_tests:
  - name: test_focus__custom_field_options_known_fields
    description: >-
      Guards the decode join: the three sentinel (source_class, column_name)
      pairs must each resolve to at least one option in
      int_focus__custom_field_options. Any returned row is a failure.
    config:
      meta:
        dagster:
          ref:
            name: int_focus__custom_field_options
            package: focus
  - name: focus_unmapped_phone_contact_titles
    description: >-
      Warns when a people_join_contacts title matches neither the phone-type nor
      email regexes used by int_focus__student_contacts (an unmapped title
      needing a new mapping), or matches both (an ambiguous title the model
      silently excludes as email, potentially dropping a real phone value).
    config:
      meta:
        dagster:
          ref:
            name: stg_focus__people_join_contacts
            package: focus
