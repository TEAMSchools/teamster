data_tests:
  - name: test_focus__custom_field_options_known_fields
    description: >-
      Guards the decode join: the three sentinel (source_class, column_name)
      pairs must each resolve to at least one option in
      int_focus__custom_field_options. Any returned row is a failure.
    config:
      meta:
        dagster:
          ref:
            name: int_focus__custom_field_options
            package: focus
  - name: test_focus__school_level_labels_known
    description: >-
      Guards the school_level decode in int_focus__schools, which maps SISSchool
      level labels to the ES/MS/HS abbreviation. A Focus label rename, or a new
      level Focus starts assigning, would null school_level silently. C -
      Combined is known and intentionally unmapped. Any returned row is a
      failure.
    config:
      meta:
        dagster:
          ref:
            name: int_focus__schools__pivot
            package: focus
  - name: test_focus__idea_educational_environment_classified
    description: >-
      Guards the custom_863 decode that drives is_out_of_district and its three
      companion columns on the Focus branch of int_students__student_enrollments
      (#5041). The derivation classifies seven of the field's options -- C
      correctional facility, D center school, F public residential facility, H
      hospital/homebound and P private school with public school services are
      out-of-district placements, matching PowerSchool's definition of the flag
      exactly; Z (the default) and N/A are no placement. Every other option is
      one of Florida's age 3-5 codes, left unclassified because Miami enrolls no
      pre-K and nobody has reviewed whether a 3-5 placement should read as
      out-of-district. A returned row means such a code landed, so a student now
      reports as in-district on an unexamined assumption -- classify the code in
      the derivation rather than widening this test. Null passes, and 190 Miami
      students have no value today. Asserted on the option code rather than the
      decoded label because the labels are Focus-editable prose, and left-joined
      so a stored value matching no option also fails. It runs at warn severity,
      so it is a signal to act on, not a broken pipeline.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: int_focus__students
            package: focus
  - name: focus_unmapped_phone_contact_titles
    description: >-
      Warns when a stg_focus__people_join_contacts row has neither phone_type
      nor is_email_title set (an unmapped title needing a new mapping), or has
      both set (an ambiguous title the model silently excludes as email,
      potentially dropping a real phone value). A null title is treated as
      unmapped. Rows with no value are ignored.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: stg_focus__people_join_contacts
            package: focus
  - name: stg_focus__student_enrollment__one_primary_per_stint
    description: >-
      Guards the same-start-date dedupe in int_focus__student_enrollment_roster.
      When a student holds two enrollments sharing a year and a start date at
      different schools, exactly one must leave the Focus "Second School"
      checkbox (custom_9) unchecked -- that row is the primary, home-campus
      enrollment, and the roster drops the marked one before the dedupe. Two
      unchecked rows leave the dedupe to pick between two schools arbitrarily;
      zero unchecked rows drop the student from the roster. Either way a student
      is attributed to a campus by accident. Asserted on the staging model
      because the roster has already dropped rows, and a uniqueness test on the
      deduped grain cannot fail by construction. Same-school duplicates are out
      of scope; the dedupe resolves those without a primary marker, as are
      groups where one row has no school at all -- there is no second school to
      be primary over, and no such row exists in Focus today.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: stg_focus__student_enrollment
            package: focus
  - name: stg_focus__student_enrollment__second_school_has_open_primary
    description: >-
      Every Focus enrollment marked "Second School" (custom_9) must sit inside a
      primary enrollment the same student holds that year, open on the second
      school's start date. int_focus__student_enrollment_roster drops
      second-school rows, so one with no open primary either removes the student
      from the roster or, when the primary closed first, hides a real transfer
      and leaves the student without a stint from that date. Any returned row is
      a Focus data-entry problem -- uncheck "Second School" on a real transfer,
      or add the missing primary enrollment.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: stg_focus__student_enrollment
            package: focus
  - name: int_focus__student_enrollment__no_overlapping_stints
    description: >-
      A student holds one enrollment stint at a time. Focus accepts a second
      open stint at another school without closing the first.
      int_focus__student_enrollment_roster trims the earlier stint to the day
      before the next one starts, so downstream models never see the overlap and
      a test on the roster could not fail; this one reads the pre-trim
      enrollment rows. Strict on the boundary, so a stint that starts on the day
      another ends passes as a sequential transfer, and an open stint ends June
      30 like the roster's default. Any returned row is a failure, and the fix
      is in Focus — close the earlier stint.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: int_focus__student_enrollment
            package: focus
  - name: int_focus__schedule__no_overlapping_course_periods
    description: >-
      A student must not sit in two course periods of the same course, in the
      same class period, at overlapping times. Resolved through the marking
      period dates on int_focus__schedule — its end_date is null on most rows
      because Focus bounds a schedule row by its marking period, so a literal
      reading makes every Semester 1 row collide with its Semester 2 partner.
      Scoped to a shared period_id — the same course in different class periods
      is a separate pattern with Ops for a ruling. Any returned row is a
      failure.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: int_focus__schedule
            package: focus

  - name: int_focus__student_enrollment_roster__no_skipped_grade
    description: >-
      A Focus high school student (grade 9 to 12) whose grade rose by more than
      1 between consecutive school years. Each year is the student's
      highest-grade stint, with no-shows excluded. A skipped grade puts the
      student ahead of the cohort they entered with, which matters for the
      4-year graduation cohort. Fix the grade level on the enrollment, or move
      the enrollment to the right school year, in Focus. New Jersey's version is
      int_powerschool__ps_enrollment_all__no_skipped_grade in the powerschool
      package.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: int_focus__student_enrollment_roster
            package: focus
