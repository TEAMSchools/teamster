data_tests:
  - name: test_focus__custom_field_options_known_fields
    description: >-
      Guards the decode join: the three sentinel (source_class, column_name)
      pairs must each resolve to at least one option in
      int_focus__custom_field_options. Any returned row is a failure.
    config:
      meta:
        dagster:
          ref:
            name: int_focus__custom_field_options
            package: focus
  - name: test_focus__school_level_labels_known
    description: >-
      Guards the school_level decode in int_focus__schools, which maps SISSchool
      level labels to the ES/MS/HS abbreviation. A Focus label rename, or a new
      level Focus starts assigning, would null school_level silently. C -
      Combined is known and intentionally unmapped. Any returned row is a
      failure.
    config:
      meta:
        dagster:
          ref:
            name: int_focus__schools__pivot
            package: focus
  - name: test_focus__idea_educational_environment_classified
    description: >-
      Guards the custom_863 decode that drives is_out_of_district and its three
      companion columns on the Focus branch of int_students__student_enrollments
      (#5041). The derivation classifies seven of the field's options -- C
      correctional facility, D center school, F public residential facility, H
      hospital/homebound and P private school with public school services are
      out-of-district placements, matching PowerSchool's definition of the flag
      exactly; Z (the default) and N/A are no placement. Every other option is
      one of Florida's age 3-5 codes, left unclassified because Miami enrolls no
      pre-K and nobody has reviewed whether a 3-5 placement should read as
      out-of-district. A returned row means such a code landed, so a student now
      reports as in-district on an unexamined assumption -- classify the code in
      the derivation rather than widening this test. Null passes, and 190 Miami
      students have no value today. Asserted on the option code rather than the
      decoded label because the labels are Focus-editable prose, and left-joined
      so a stored value matching no option also fails. It inherits the project
      default warn severity, so it is a signal to act on, not a broken pipeline.
    config:
      meta:
        dagster:
          ref:
            name: int_focus__students
            package: focus
  - name: focus_unmapped_phone_contact_titles
    description: >-
      Warns when a stg_focus__people_join_contacts row has neither phone_type
      nor is_email_title set (an unmapped title needing a new mapping), or has
      both set (an ambiguous title the model silently excludes as email,
      potentially dropping a real phone value). A null title is treated as
      unmapped.
    config:
      meta:
        dagster:
          ref:
            name: stg_focus__people_join_contacts
            package: focus
  - name: stg_focus__student_enrollment__one_primary_per_stint
    description: >-
      Guards the tie-break of the same-start-date dedupe in
      int_focus__student_enrollment. When a student holds two enrollments
      sharing a year and a start date at different schools, exactly one must
      leave the Focus "Second School" checkbox (custom_9) unchecked -- that row
      is the primary, home-campus enrollment, and it is the one the dedupe
      keeps. Two unchecked rows leave the dedupe with no signal and it picks
      between two schools arbitrarily; zero unchecked rows mean the primary
      record is missing. Either way a student is attributed to a campus by
      accident, which is what happened before the tie-break read this field
      (#5003). Asserted on the staging model because the dedupe has already
      dropped one row by the intermediate layer, and a uniqueness test on the
      deduped grain cannot fail by construction. Same-school duplicates are out
      of scope; the dedupe resolves those without a primary marker, as are
      groups where one row has no school at all -- there is no second school to
      be primary over, and no such row exists in Focus today.
    config:
      severity: error
      meta:
        dagster:
          ref:
            name: stg_focus__student_enrollment
            package: focus
  - name: int_focus__student_enrollment_roster__no_overlapping_stints
    description: >-
      A student holds one enrollment stint at a time. Focus accepts a second
      open stint at another school without closing the first, and every model
      that scaffolds days from the roster then carries that student twice per
      day: int_focus__attendance_daily and its consumers, and the kipptaf grain
      test on int_students__attendance_daily, which dedupes the Focus branch
      while this warning is live. Strict on the boundary, so a stint that starts
      on the day another ends passes as a sequential transfer. Failing with 1
      pair as of 2026-09-04, one AY2026 student open at 2 schools from
      2026-09-04. Runs at the consuming district project's default warn
      severity. Any returned row is a failure, and the fix is in Focus: close
      the stale stint.
    config:
      meta:
        dagster:
          ref:
            name: int_focus__student_enrollment_roster
            package: focus
  - name: int_focus__schedule__no_overlapping_course_periods
    description: >-
      A student must not sit in two course periods of the same course, in the
      same class period, at overlapping times. Resolved through the marking
      period: int_focus__schedule.end_date is null on 18,412 of 19,699 rows
      because Focus bounds a schedule row by its course period's marking period,
      so a literal reading makes every Semester 1 row collide with its Semester
      2 partner (188 false pairs). Scoped to a shared period_id -- the same
      course in different class periods is a separate 776-group pattern with Ops
      for a ruling. Failing with 2 rows as of 2026-08-28, both the same student
      in two courses at period_id 2373, where the outgoing section runs
      2026-08-12 to 2026-08-13 while the incoming one starts 2026-08-12. Runs at
      the consuming district project's default warn severity. Any returned row
      is a failure.
    config:
      meta:
        dagster:
          ref:
            name: int_focus__schedule
            package: focus
