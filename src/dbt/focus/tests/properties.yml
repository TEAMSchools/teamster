data_tests:
  - name: test_focus__custom_field_options_known_fields
    description: >-
      Guards the decode join: the three sentinel (source_class, column_name)
      pairs must each resolve to at least one option in
      int_focus__custom_field_options. Any returned row is a failure.
    config:
      meta:
        dagster:
          ref:
            name: int_focus__custom_field_options
            package: focus
  - name: test_focus__school_level_labels_known
    description: >-
      Guards the school_level decode in int_focus__student_enrollment, which
      maps SISSchool level labels to the ES/MS/HS abbreviation. A Focus label
      rename, or a new level Focus starts assigning, would null school_level
      silently. C - Combined is known and intentionally unmapped. Any returned
      row is a failure.
    config:
      meta:
        dagster:
          ref:
            name: int_focus__schools__pivot
            package: focus
  - name: focus_unmapped_phone_contact_titles
    description: >-
      Warns when a stg_focus__people_join_contacts row has neither phone_type
      nor is_email_title set (an unmapped title needing a new mapping), or has
      both set (an ambiguous title the model silently excludes as email,
      potentially dropping a real phone value). A null title is treated as
      unmapped.
    config:
      meta:
        dagster:
          ref:
            name: stg_focus__people_join_contacts
            package: focus
  - name: stg_focus__student_enrollment__same_startdate_stints_share_school
    description: >-
      Guards the unstated premise of the same-start-date dedupe in
      int_focus__student_enrollment: two enrollment rows sharing a student,
      year, and start date must be the same school. Two stints at different
      schools are distinct enrollments, so demoting one silently deletes it and
      orphans every schedule row belonging to the dropped school. Asserted on
      the staging model because the dropped row exists only upstream of the
      dedupe -- a uniqueness test on the dedupe's own key can never fail by
      construction. Same-school duplicates are not flagged; those are the case
      the dedupe exists to resolve.

      TODO(#4905): downgraded to warn for one live Focus record -- a single
      AY2026 student holds two open stints, same start date, at two different
      schools, which strands 4 course enrollments (#5003). It is the only
      violation in Focus data back to AY2018, and the only same-start-date
      duplicate of any kind. Restore severity: error once Ops corrects it.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: stg_focus__student_enrollment
            package: focus
