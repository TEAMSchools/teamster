models:
  - name: stg_cambium__njsla
    description: >-
      Cambium TIDE NJSLA district summative record file, one row per student per
      subject test, filtered to summative, attempted records and mapped into the
      shared NJ state assessment shape that int_pearson__all_assessments
      produces for the Pearson relations. Cambium ships English Language Arts,
      Mathematics and Science in the District Summative Record File, and the
      Algebra I, Algebra II and Geometry end-of-course tests in a separate EOC
      file with an identical header. This model unions both files, carries the
      NJSLA and the NJSLA Science assessments, and branches every
      subject-dependent column on subject. Every Cambium-to-shared translation
      lives here; kipptaf unions the result as a passthrough.
    columns:
      # Columns carrying per-column data_tests sort to the top. Every test sets
      # severity explicitly.
      - name: studenttestuuid
        data_type: string
        description: >-
          Cambium's per-test identifier, unique per row. These are Cambium's own
          UUIDs, not Pearson's, so student-crosswalk rows keyed on Pearson UUIDs
          will not match Cambium records.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: test_date
        data_type: date
        description: >-
          Date of the earliest online unit start across units 1 through 4,
          coalesced to the parsed assessment session start. The coalesce is
          required, not defensive: unit timestamps are populated for ELA only,
          so unit-only derivation nulls every Mathematics row.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: period
        data_type: string
        description: >-
          Raw vendor-reported administration season, unnormalized. NJSLA is
          administered in spring only, so the accepted value list is narrower
          than the NJGPA model's — a fall or block token fails the build instead
          of quietly forking a second series downstream.
        data_tests:
          # accepted_values passes NULLs, so not_null is required alongside it
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: [Spring]
              config:
                severity: error
      - name: administration_period
        data_type: string
        description: >-
          Normalized from period, case-insensitively: any 'FALL' prefix
          collapses to 'Fall' so Cambium rows would share the Pearson 'Fall'
          series in dim_assessment_administrations. Spring in practice for every
          delivered row.
        data_tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: [Spring, Fall]
              config:
                severity: error
      - name: test_grade
        data_type: int64
        description: >-
          Grade number parsed out of assessment_grade, which Cambium sends as
          'Grade 3' through 'Grade 11'. NULL for the Algebra I, Algebra II and
          Geometry end-of-course tests, whose forms have no grade, matching the
          Pearson rows. An unparseable value on any other row yields NULL and
          fails here rather than flowing a NULL grade into dim_assessments.
        data_tests:
          - not_null:
              config:
                severity: error
                where:
                  "`subject` not in ('Algebra I', 'Algebra II', 'Geometry')"
          - accepted_values:
              arguments:
                values: [3, 4, 5, 6, 7, 8, 9, 11]
                quote: false
              config:
                severity: error
      - name: assessment_name
        data_type: string
        description: >-
          'NJSLA Science' for Science rows, 'NJSLA' for English Language Arts
          and Mathematics. This is the column int_pearson__all_assessments
          branches on, so the two assessments stay distinguishable after the
          union even though they arrive in one file.
        data_tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: [NJSLA, NJSLA Science]
              config:
                severity: error
      - name: subject
        data_type: string
        quote: true
        description: >-
          'English Language Arts', 'Mathematics', 'Science', or one of the
          end-of-course subjects 'Algebra I', 'Algebra II' and 'Geometry'.
          Drives every subject-dependent derivation in this model, so an
          unrecognized subject fails here rather than silently landing on the
          ELA branch.
        data_tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values:
                  - English Language Arts
                  - Mathematics
                  - Science
                  - Algebra I
                  - Algebra II
                  - Geometry
              config:
                severity: error
      - name: discipline
        data_type: string
        description: >-
          'Math' for Mathematics and the end-of-course subjects, 'Science' for
          Science, else 'ELA'.
        data_tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: [ELA, Math, Science]
              config:
                severity: error
      - name: statestudentidentifier
        data_type: int64
        description: NJ SMART state student identifier (10 digits).
      - name: localstudentidentifier
        data_type: int64
        description: >-
          PowerSchool student_number. Null for a small number of students each
          administration; patched in kipptaf from the student crosswalk sheet.
      - name: firstname
        data_type: string
        description: Student first name as reported by Cambium.
      - name: lastorsurname
        data_type: string
        description: Student surname as reported by Cambium.
      - name: academic_year
        data_type: int64
        description:
          Start year of assessmentyear, e.g. '2025-2026' becomes 2025.
      - name: assessmentyear
        data_type: string
        description: Vendor-reported school year, e.g. '2025-2026'.
      - name: assessmentgrade
        data_type: string
        description: >-
          The test DESIGN level as Cambium sends it, e.g. 'Grade 5'. NULL for
          end-of-course tests, whose 'Grade 11' is a placeholder, matching the
          Pearson rows. test_grade is the parsed integer; gradelevelwhenassessed
          is the student's own grade.
      - name: gradelevelwhenassessed
        data_type: int64
        description: >-
          The student's grade at the time of testing. Equals test_grade on every
          grade-level test; on end-of-course tests, where test_grade is NULL, it
          is the only grade.
      - name: test_status
        data_type: string
        description: >-
          Cambium test lifecycle status — 'completed' for nearly every row, with
          occasional 'invalidated' and 'pending' records that the summative and
          attemptedness filter does not remove. Not filtered on, matching the
          NJGPA model and the Pearson relations. Cambium-only.
      - name: subject_area
        data_type: string
        description: >-
          Normalized from subject. Cambium already sends 'English Language
          Arts', so the Pearson '/Literacy' normalization is a passthrough.
      - name: aligned_subject
        data_type: string
        description: Equal to subject_area.
      - name: testcode
        data_type: string
        description: >-
          Cambium test code — ELA03 through ELA09, MAT03 through MAT08, SC05,
          SC08, SC11 for Science, and ALG01, ALG02 and GEO01 for the
          end-of-course tests.
      - name: module_code
        data_type: string
        description: >-
          testcode with the Science codes remapped to the Pearson spelling: SC05
          becomes SCI05, SC08 becomes SCI08, SC11 becomes SCI11. ELA and Math
          codes pass through unchanged.
      - name: aligned_test_code
        data_type: string
        description: Equal to module_code, as in the Pearson relations.
      - name: admin
        data_type: string
        quote: true
        description:
          Equal to administration_period; reserved-word alias for Tableau.
      - name: testperformancelevel
        data_type: numeric
        description: >-
          1 through 5 for English Language Arts and Mathematics, 1 through 4 for
          Science. The same number means different things per subject, which is
          why every level-derived column below branches on subject.
      - name: testperformancelevel_text
        data_type: string
        description: >-
          Performance level label. Science tops out at level 4 and maps it to
          'Exceeded Expectations'; ELA and Math reach level 5 for the same label
          and add 'Partially Met Expectations' at level 2, which Science has no
          equivalent for.
      - name: aligned_performance_band_group
        data_type: string
        description: >-
          'Lvl 1' through 'Lvl 5', mapped from testperformancelevel_text using
          the same label-to-band map the Pearson relations use. A consequence of
          sharing that map is that Science level 4 lands on 'Lvl 5' and Science
          never produces 'Lvl 2' — matching existing Pearson NJSLA Science
          output rather than correcting it.
      - name: testscalescore
        data_type: numeric
        description: Scale score.
      - name: testscorecomplete
        data_type: numeric
        description: >-
          Entirely NULL from Cambium, where Pearson set it to 1 on every
          filtered row. Deliberately not synthesized, as in the NJGPA model.
      - name: is_proficient
        data_type: boolean
        description: >-
          True at level 3 or above for Science, level 4 or above for English
          Language Arts and Mathematics.
      - name: is_proficient_int
        data_type: int64
        description: is_proficient as 1/0.
      - name: is_bl_fb
        data_type: boolean
        description: >-
          True below level 3 for English Language Arts and Mathematics. NULL for
          Science, matching stg_pearson__njsla_science, which omits the column
          and lets the kipptaf union null-fill it.
      - name: is_approaching_int
        data_type: int64
        description: >-
          1 at level 2 for Science and level 3 for English Language Arts and
          Mathematics, else 0 — the level immediately below proficient in each
          scale.
      - name: is_below_int
        data_type: int64
        description: >-
          1 below level 2 for Science and below level 3 for English Language
          Arts and Mathematics, else 0.
      - name: njsla_aggregated_proficiency
        data_type: string
        description: >-
          'Below/Far Below', 'Approaching' or 'At/Above' for English Language
          Arts and Mathematics. NULL for Science, which has no equivalent
          grouping in the Pearson relations.
      - name: njsla_performance_band_group_label
        data_type: string
        description: >-
          'Not Proficient (1-2)', 'Bubble (3)' or 'Proficient (4-5)' for English
          Language Arts and Mathematics. NULL for Science, whose 4-level scale
          the labels do not describe.
      - name: assessment_version
        data_type: string
        description: >-
          Equal to assessment_name. NJSLA has no vendor-specific cut-score
          consumer the way NJGPA's graduation pathway does, so the Cambium and
          Pearson rows share a version and stay unified in the dashboard;
          _dbt_source_relation still distinguishes the vendors.
      - name: assessment_type
        data_type: string
        description: >-
          'state_nj_njsla_science' for Science, 'state_nj_njsla' for English
          Language Arts and Mathematics.
      - name: results_type
        data_type: string
        description: Constant 'Actual'.
      - name: district_state
        data_type: string
        description: Constant 'KTAF NJ'.
      - name: studentwithdisabilities
        data_type: string
        description: N, IEP, 504, or B (both IEP and 504).
      - name: is_504
        data_type: boolean
        description: True when studentwithdisabilities is '504' or 'B'.
      - name: iep_status
        data_type: string
        description:
          "'Has IEP' when studentwithdisabilities is 'IEP' or 'B', else 'No
          IEP'."
      - name: aligned_iep_status
        data_type: string
        description:
          "'Students With Disabilities' or 'Students Without Disabilities'."
      - name: englishlearnerel
        data_type: string
        description:
          Y/N multilingual learner flag, under the Pearson column name.
      - name: lep_status
        data_type: boolean
        description: True when englishlearnerel is 'Y'.
      - name: aligned_ml_status
        data_type: string
        description: "'ML' when lep_status, else 'Not ML'."
      - name: hispanicorlatinoethnicity
        data_type: string
        description: Y/N federal ethnicity flag.
      - name: americanindianoralaskanative
        data_type: string
        description: Y/N federal race flag.
      - name: asian
        data_type: string
        description: Y/N federal race flag.
      - name: blackorafricanamerican
        data_type: string
        description: Y/N federal race flag.
      - name: nativehawaiianorotherpacificislander
        data_type: string
        description: Y/N federal race flag.
      - name: twoormoreraces
        data_type: string
        description: Y/N federal race flag.
      - name: white
        data_type: string
        description: Y/N federal race flag.
      - name: race_ethnicity
        data_type: string
        description: >-
          Single-character code from the race flags, same priority as the
          Pearson mapping (T, H, I, A, B, P, W).
      - name: aligned_aggregate_ethnicity
        data_type: string
        description:
          race_ethnicity expanded to the shared label; null maps to 'Blank'.
