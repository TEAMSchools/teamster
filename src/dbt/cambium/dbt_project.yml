name: cambium
version: 1.0.0
config-version: 2
require-dbt-version: [">=1.3.0", <2.0.0]

profile: integration_tests

model-paths: [models]
analysis-paths: [analyses]
test-paths: [tests]
seed-paths: []
macro-paths: [macros]
snapshot-paths: [snapshots]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  bigquery_external_connection_name: null
  # Staging relations int_cambium__all_assessments reads. stg_cambium__njsla
  # carries the end-of-course tests too. A district that disables NJGPA
  # overrides this list in its dbt_project.yml (see kipppaterson); the NJGPA
  # branch compiles only when stg_cambium__njgpa is listed.
  cambium_state_assessment_relations:
    - stg_cambium__njsla
    - stg_cambium__njgpa

models:
  +schema: cambium
  cambium:
    staging:
      +contract:
        enforced: true
