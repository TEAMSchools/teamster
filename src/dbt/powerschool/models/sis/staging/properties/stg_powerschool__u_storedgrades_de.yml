models:
  - name: stg_powerschool__u_storedgrades_de
    description: >-
      PowerSchool dual-enrollment (DE) extension of stored grades. Each row is
      the college course result behind one stored grade for one college
      semester. The dlt variant keeps one row per stored grade and semester.
      When PowerSchool holds the same result twice, it keeps the row with a
      college course name, then the row with an institution, then the newest id.
      The singular test
      stg_powerschool__u_storedgrades_de__no_duplicate_semester lists the
      duplicates for cleanup in PowerSchool.
    columns:
      - name: id
        data_type: int64
        description: PowerSchool record id of the DE extension row.
        data_tests:
          - unique:
              config:
                severity: error
        constraints:
          - type: primary_key
      - name: storedgradesdcid
        data_type: int64
        description:
          DCID (unique identifier) of the associated Storedgrade record.
          Indexed.
        constraints:
          - type: foreign_key
      - name: de_course_name
        data_type: string
        description: College course name. Null when no college course is set.
      - name: de_institution
        data_type: string
        description: College that granted the grade.
      - name: de_pass_yn
        data_type: int64
        description:
          1 when the student passed the college course, 0 when not, null when
          not recorded.
        config:
          meta:
            contains_pii: true
      - name: de_score
        data_type: string
        description: College course grade, usually a letter grade.
        config:
          meta:
            contains_pii: true
      - name: de_semester
        data_type: string
        description: College semester of the result, such as Fall or Spring.
