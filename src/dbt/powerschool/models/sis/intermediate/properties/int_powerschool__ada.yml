models:
  - name: int_powerschool__ada
    description: >-
      One row per student per school year (studentid, yearid), summing the daily
      values in int_powerschool__ps_adaadm_daily_ctod. It counts only days with
      a membership value of 1 that are on or before today.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - yearid
          config:
            severity: error
    columns:
      - name: studentid
        data_type: int64
        description: The internal number of the student.
      - name: student_number
        data_type: int64
        description: Student number assigned by the school.
        config:
          meta:
            contains_pii: true
      - name: yearid
        data_type: int64
        description:
          The year of the school year. It is the academic year minus 1990.
      - name: academic_year
        data_type: int64
        description: The school year's starting year, which is yearid plus 1990.
      - name: days_in_membership
        data_type: float64
        description: The sum of membershipvalue over the counted days.
      - name: days_present
        data_type: float64
        description:
          The sum of attendancevalue over the counted days. NULL days add
          nothing.
      - name: days_absent_unexcused
        data_type: float64
        description: >-
          The sum of the shortfall from a full attendance value, which is the
          absolute value of attendancevalue minus 1, over the counted days.
      - name: ada
        data_type: float64
        description: >-
          The average daily attendance, which is the average attendancevalue
          over the counted days. NULL days are left out of the average.
