models:
  - name: int_powerschool__calendar_day
    description: >-
      One row per PowerSchool calendar day with the covering year term and the
      school's name, abbreviation, level, and city attached, so consumers do not
      join terms or schools themselves. Left joins: a day outside every year
      term has a null yearid and academic_year.
    data_tests:
      - unique:
          column_name: id
          config:
            severity: error
    columns:
      - name: id
        data_type: int64
      - name: date_value
        data_type: date
      - name: scheduleid
        data_type: string
      - name: note
        data_type: string
      - name: type
        data_type: string
      - name: psguid
        data_type: string
      - name: whomodifiedtype
        data_type: string
      - name: ip_address
        data_type: string
      - name: dcid
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: a
        data_type: int64
      - name: b
        data_type: int64
      - name: c
        data_type: int64
      - name: d
        data_type: int64
      - name: e
        data_type: int64
      - name: f
        data_type: int64
      - name: insession
        data_type: int64
      - name: membershipvalue
        data_type: float64
      - name: cycle_day_id
        data_type: int64
      - name: bell_schedule_id
        data_type: int64
      - name: week_num
        data_type: int64
      - name: whomodifiedid
        data_type: int64
      - name: week_start_date
        data_type: date
      - name: week_end_date
        data_type: date
      - name: yearid
        data_type: int64
      - name: academic_year
        data_type: int64
      - name: school_name
        data_type: string
      - name: school_abbreviation
        data_type: string
      - name: school_level
        data_type: string
      - name: schoolcity
        data_type: string
