models:
  - name: int_powerschool__ps_membership_reg
    description: >-
      One row per student per in-session calendar day, from each enrollment
      stint in int_powerschool__ps_enrollment_all joined to the school's
      calendar over the half-open `[entrydate, exitdate_clipped)`. The clipped
      exit comes from int_powerschool__ps_enrollment_all, which cuts a stint off
      where the next stint at the same school begins, so overlapping stints
      cannot emit 2 rows for one student-day here. The `(studentid,
      calendardate)` grain test guards that.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - calendardate
    columns:
      - name: studentid
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: student_track
        data_type: string
      - name: fteid
        data_type: int64
      - name: dflt_att_mode_code
        data_type: string
      - name: dflt_conversion_mode_code
        data_type: string
      - name: grade_level
        data_type: int64
      - name: yearid
        data_type: int64
      - name: calendardate
        data_type: date
      - name: a
        data_type: int64
      - name: b
        data_type: int64
      - name: c
        data_type: int64
      - name: d
        data_type: int64
      - name: e
        data_type: int64
      - name: f
        data_type: int64
      - name: bell_schedule_id
        data_type: int64
      - name: cycle_day_id
        data_type: int64
      - name: attendance_conversion_id
        data_type: int64
      - name: studentmembership
        data_type: float64
      - name: calendarmembership
        data_type: float64
      - name: ontrack
        data_type: int64
      - name: offtrack
        data_type: int64
