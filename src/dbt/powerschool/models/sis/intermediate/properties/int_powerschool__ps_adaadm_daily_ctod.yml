models:
  - name: int_powerschool__ps_adaadm_daily_ctod
    description: >-
      One row per student per in-session day (studentid, calendardate), with the
      day's attendance, potential attendance, and membership values. Built from
      int_powerschool__ps_membership_reg, with the daily attendance record from
      int_powerschool__ps_attendance_daily, the attendance conversion items from
      stg_powerschool__attendance_conversion_items, and the calendar week from
      int_powerschool__calendar_week.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - calendardate
          config:
            severity: error
    columns:
      - name: studentid
        data_type: int64
        description: The internal number of the student.
      - name: student_number
        data_type: int64
        description: Student number assigned by the school.
        config:
          meta:
            contains_pii: true
      - name: schoolid
        data_type: int64
        description: The school the student was enrolled in on this day.
      - name: entrydate
        data_type: date
        description:
          The entry date of the enrollment stint that covers this day.
      - name: att_code
        data_type: string
        description: >-
          The code of the day's daily attendance record, or NULL when the
          student has no record that day.
      - name: calendardate
        data_type: date
        description: The in-session calendar day.
      - name: fteid
        data_type: int64
        description: >-
          The full-time equivalency (FTE) record on the student's enrollment. It
          sets which attendance conversion values apply.
      - name: attendance_conversion_id
        data_type: int64
        description: >-
          The attendance conversion on the day's bell schedule. Together with
          fteid and the attendance code, it selects the conversion value.
      - name: grade_level
        data_type: int64
        description: The student's grade level on the enrollment.
      - name: ontrack
        data_type: int64
        description: >-
          1 when the student's track is in session on this day or the student
          has no track, otherwise 0. All 3 day values are multiplied by it.
      - name: offtrack
        data_type: int64
        description:
          1 when the student's track is not in session on this day, otherwise 0.
      - name: student_track
        data_type: string
        description:
          The track (A to F) on the student's enrollment, or NULL when the
          student has none.
      - name: yearid
        data_type: int64
        description: >-
          The year of the school's year term that contains the day. It is the
          academic year minus 1990.
      - name: attendancevalue
        data_type: float64
        description: >-
          The day's attendance value, from 0 to 1. It is 0 when the student has
          a daily attendance record whose code has count_for_ada = 0. Otherwise
          it is the attendance conversion value for the student's FTE, the bell
          schedule's attendance conversion, and the attendance code, times
          ontrack. The code is the day's attendance code when the record has
          count_for_ada = 1, and the school's Present code when the student has
          no record. NULL in 4 cases. The enrollment's fteid is not an FTE of
          that school and year. No codeday conversion item exists for that FTE,
          attendance conversion, and code. The school has no Present code for
          the year and the student has no record. Or the only attendance record
          is at a school where the student was not enrolled that day, so its
          code does not match the enrollment's conversion items.
          fct_student_attendance_enrollment_daily skips NULL days when it counts
          membership and present days.
      - name: potential_attendancevalue
        data_type: float64
        description: >-
          The attendance value the day would carry if the student were Present.
          It is the conversion value for the student's FTE, the bell schedule's
          attendance conversion, and the school's Present code, times ontrack.
          It is 0 when the student has a daily attendance record with
          count_for_ada = 1. NULL when no conversion item matches.
      - name: membershipvalue
        data_type: float64
        description: >-
          The day's membership, from 0 to 1. It is 0 when the student has a
          daily attendance record whose code has count_for_adm = 0. Otherwise it
          is the smaller of the enrollment's membership share and the calendar
          day's membership value, times ontrack.
      - name: week_start_monday
        data_type: date
        description: Monday of the calendar week containing calendardate.
      - name: week_end_sunday
        data_type: date
        description: Sunday of the calendar week containing calendardate.
      - name: week_number_academic_year
        data_type: int64
        description: 1-based week index within the school's academic year.
