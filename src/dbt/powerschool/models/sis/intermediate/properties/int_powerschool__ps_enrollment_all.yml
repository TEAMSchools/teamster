models:
  - name: int_powerschool__ps_enrollment_all
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: int_powerschool__ps_enrollment_all__unique_student_entrydate
          description: >-
            A PowerSchool student has 2 enrollment stints that start on the same
            day. Downstream models that key a stint on student and entry date
            keep only 1 of them. Delete or correct the duplicate enrollment
            record in PowerSchool.
          arguments:
            combination_of_columns:
              - studentid
              - entrydate
          config:
            # no-shows share entry and exit date; inverted stints are flagged on
            # stg_powerschool__students and stg_powerschool__reenrollments
            where: schoolid != 999999 and entrydate < exitdate
            severity: warn
    columns:
      - name: studentid
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: entrydate
        data_type: date
      - name: entrycode
        data_type: string
      - name: exitdate
        data_type: date
      - name: exitcode
        data_type: string
      - name: grade_level
        data_type: int64
      - name: programid
        data_type: int64
      - name: fteid
        data_type: int64
      - name: membershipshare
        data_type: float64
      - name: track
        data_type: string
      - name: yearid
        data_type: int64
      - name: dflt_att_mode_code
        data_type: string
      - name: dflt_conversion_mode_code
        data_type: string
      - name: exitdate_clipped
        data_type: date
        description: >-
          `exitdate`, cut back to the next stint's `entrydate` when a later
          stint at any school starts before this one ends. PowerSchool holds one
          enrollment at a time, so a transfer whose old stint was left open is
          cut at the new school's start. Date-range joins that must stay one row
          per student-day (int_powerschool__ps_membership_reg) use this instead
          of `exitdate`; overlapping stints are a source defect surfaced by
          test_int_powerschool__ps_enrollment_all__no_overlapping_stints.
