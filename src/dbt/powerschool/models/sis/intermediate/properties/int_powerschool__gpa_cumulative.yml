  - name: unit_gpa_cumulative_needed_gpa_full_schedule
    description: >-
      The needed-GPA denominator counts every GPA course on this year's
      schedule, graded or not, keyed on the rn_year = 1 school, while the
      projection keeps counting only graded courses in a term covering today.
      Student 7 has a prior F-year over 5 credits; this year C1 is graded B in a
      Q1 term covering today and also has a future Q2 row, C2 is an ungraded
      second-semester course with two future term rows, C3 is already stored for
      the current year (its live row must not double count), and C4 is excluded
      from GPA. Current credits are 15 (C1, C2, C3), needed is (3 x 20 - 0) / 15
      = 4.0, and the max (4.0 everywhere) makes it attainable. The projection
      sees only C1 and C3 over 15 cumulative credits at 2.5. Student 8 has one
      zero-credit ungraded course covering today, so every GPA column is NULL.
      Student 9 has a prior B-year over 5 credits and one ungraded 5-credit
      future course, so needed is 3.0 and attainable. Student 10 has a
      first-semester course whose terms have all ended with no stored Y1, a B
      after Q1 that fell to an F by Q2, plus an ungraded future course: the
      ended course is locked at its final 0 points, not its best 3.0, so the max
      is 2.0 against a needed 3.0 and the flag reads false. Student 11 has a
      graded course covering today and an ungraded future course on an
      unresolvable grade scale, so needed computes over both but the flag is
      NULL. Student 12 has an ended course with no Y1 at all plus a future
      course: the ended course's max is unknown, so needed computes over both
      and the flag is NULL. Student 13 is enrolled at school 102 but has a
      stored current-year course at school 101: the stored row still rolls up at
      101 with no needed GPA, and the needed GPA at 102 counts both the live and
      the stored course.
    model: int_powerschool__gpa_cumulative
    overrides:
      vars:
        current_academic_year: 2025
    given:
