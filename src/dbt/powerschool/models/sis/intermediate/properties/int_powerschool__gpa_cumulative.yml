models:
  - name: int_powerschool__gpa_cumulative
    description: >-
      One row per student per school with cumulative Y1 GPA aggregates across
      all stored academic years — weighted, unweighted, and core-subject
      variants, plus projected variants that blend stored grades with
      in-progress current-year final grades — alongside earned/potential credit
      totals and the needed-GPA / attainability pair for finishing with a 3.00
      unweighted cumulative.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - schoolid
    columns:
      - name: is_cumulative_3_0_attainable
        data_type: boolean
        description: >-
          True when `gpa_needed_for_cumulative_3_0` is less than or equal to the
          credit-weighted maximum unweighted GPA achievable across every GPA
          course on the student's current-year schedule. A course still running
          is capped at the max grade points of its unweighted grade scale; a
          course whose terms have all ended is locked at its final unweighted Y1
          points (the last term's running value, not the best one); a course
          already stored this year is locked at its stored unweighted points.
          NULL when the needed value is NULL, or when any course's max is
          unknown — an unresolvable unweighted grade scale, or an ended course
          with no Y1 — so the flag reads unknown rather than a misstated value.
        data_tests:
          - not_null:
              config:
                where: gpa_needed_for_cumulative_3_0 is not null
        config:
          meta:
            contains_pii: true
      - name: studentid
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: students_dcid
        data_type: int64
      - name: students_student_number
        data_type: int64
        config:
          meta:
            contains_pii: true
      - name: school_name
        data_type: string
      - name: school_abbreviation
        data_type: string
      - name: school_level
        data_type: string
      - name: earned_credits_cum
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: potential_credits_cum
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: earned_credits_cum_projected
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: earned_credits_cum_projected_s1
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa_unweighted
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa_projected
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa_projected_s1
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: cumulative_y1_gpa_projected_s1_unweighted
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: core_cumulative_y1_gpa
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: potential_gpa_credits_cum_projected
        data_type: float64
        config:
          meta:
            contains_pii: true
        description: >-
          Sum of potential GPA credit hours across all years, including
          in-progress current-year courses — the denominator behind
          `cumulative_y1_gpa_projected`, exposed so the projected ratio is
          auditable and joinable downstream.
      - name: potential_gpa_credits_current_year
        data_type: float64
        config:
          meta:
            contains_pii: true
        description: >-
          Potential GPA credit hours across every GPA course on the student's
          current-year schedule, graded or not, plus any already-stored
          current-year courses — the denominator behind
          `gpa_needed_for_cumulative_3_0`. Keyed on the student's rn_year = 1
          school, so a stored course from an earlier school this year counts
          here and not on that school's row. Differs from the projection's
          denominator, which counts graded courses only. NULL when the student
          has no current-year GPA credits at this school.
      - name: gpa_needed_for_cumulative_3_0
        data_type: float64
        config:
          meta:
            contains_pii: true
        description: >-
          Unweighted Y1 GPA the student must average across every GPA course on
          this year's schedule, graded or not, to finish with a cumulative Y1
          GPA (unweighted) of exactly 3.00. Computed as (3.0 x (prior credits +
          current credits) - prior unweighted points) / current credits, where
          current credits is `potential_gpa_credits_current_year`. Course
          adds/drops move the target. Negative values mean 3.00 is already
          guaranteed; values above the student's unweighted scale maximum are
          not attainable this year. NULL when the student has no current-year
          GPA credits.

unit_tests:
  - name: unit_gpa_cumulative_needed_gpa
    description: >-
      Needed-GPA algebra and attainability flag on an unweighted basis. Student
      1 (junior, prior two A-years and one F-year over 105 credits, 35 current
      credits) needs a 4.0 this year — exactly the unweighted scale max, so
      attainable. Student 2 (freshman, no prior years) needs exactly 3.0.
      Student 3 (prior four A-years over 140 credits) needs -1.0 — already
      guaranteed, still attainable. Student 4 (prior one F-year over 35 credits)
      needs 6.0 — above the 4.0 unweighted scale max, not attainable. Student 5
      has no current-year enrollment — needed and flag are NULL. Student 6 has
      one current course on an unresolvable unweighted grade scale (orphaned
      gradescaleid) — needed is still computed but the flag is NULL because the
      max attainable unweighted GPA is unknowable.
    model: int_powerschool__gpa_cumulative
    overrides:
      vars:
        current_academic_year: 2025
