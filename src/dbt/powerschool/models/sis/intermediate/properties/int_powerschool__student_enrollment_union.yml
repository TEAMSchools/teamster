models:
  - name: int_powerschool__student_enrollment_union
    description: >-
      One row per student-school enrollment event. Graduated students carry
      placeholder rows with null entry and exit dates, one row per academic year
      per student and district. Surrogate keys must include academic_year or
      those rows collide. One row per (student_number, academic_year,
      entrydate): PowerSchool data entry occasionally puts two stints on one
      entrydate, and the dedupe keeps the rn_year = 1 stint so downstream
      rn_year = 1 filters see the row that survived. Permanent guard, not a
      cleanup workaround.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_number
              - academic_year
              - entrydate
    columns:
      - name: studentid
        data_type: int64
      - name: students_dcid
        data_type: int64
      - name: student_number
        data_type: int64
      - name: reenrollments_dcid
        data_type: int64
      - name: grade_level
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: entrydate
        description: >-
          Date the student entered the school for this stint. Null on graduate
          placeholder rows, which a date-range join silently drops.
        data_type: date
      - name: exitdate
        description: >-
          Date the student left the school for this stint. Null on graduate
          placeholder rows, which a date-range join silently drops.
        data_type: date
      - name: exitdate_clipped
        description: >-
          `exitdate`, cut back to the next stint's `entrydate` when a later
          stint at any school starts before this one ends, so the later stint
          owns the overlapping days. A stint nested inside a longer one also
          ends the longer one at the nested stint's start. Only stints this
          model keeps can clip, so summer-school and zero-length stints do not;
          int_powerschool__ps_enrollment_all counts them, and its
          `exitdate_clipped` can end earlier. Exclusive, like `exitdate`.
          Date-range joins that must stay one row per student-day use this
          instead of `exitdate`. Overlapping stints are a PowerSchool data-entry
          defect that
          test_int_powerschool__ps_enrollment_all__no_overlapping_stints warns
          on. Null on graduate placeholder rows.
        data_type: date
      - name: entrycode
        data_type: string
      - name: exitcode
        data_type: string
      - name: exitcomment
        data_type: string
      - name: lunchstatus
        data_type: string
      - name: fteid
        data_type: int64
      - name: state_studentnumber
        data_type: string
      - name: first_name
        data_type: string
      - name: middle_name
        data_type: string
      - name: last_name
        data_type: string
      - name: lastfirst
        data_type: string
      - name: enroll_status
        data_type: int64
      - name: dob
        data_type: date
      - name: street
        data_type: string
      - name: city
        data_type: string
      - name: state
        data_type: string
      - name: zip
        data_type: string
      - name: home_phone
        data_type: string
      - name: fedethnicity
        data_type: int64
      - name: next_school
        data_type: int64
      - name: sched_nextyeargrade
        data_type: int64
      - name: highest_grade_level_achieved
        data_type: int64
      - name: gender
        data_type: string
      - name: ethnicity
        data_type: string
      - name: yearid
        data_type: int64
      - name: academic_year
        data_type: int64
      - name: track
        data_type: string
unit_tests:
  - name: unit_student_enrollment_union_drops_inverted_stints
    description: >-
      Proves the defense behind the entrydate <= exitdate warn tests on
      stg_powerschool__students and stg_powerschool__reenrollments. Both
      branches keep only stints whose exitdate is after entrydate, so a stint
      PowerSchool dates backwards never reaches enrollment. Student 101 has a
      valid current stint and a valid re-enrollment, which both survive, and an
      inverted re-enrollment, which is dropped. Student 103's current stint is
      inverted and is dropped. Every inverted stint starts inside a year term,
      so only the date filter can remove it.
    model: int_powerschool__student_enrollment_union
    given:
      - input: ref('stg_powerschool__students')
        rows:
          - {
              id: 1,
              dcid: 11,
              student_number: 101,
              schoolid: 10,
              grade_level: 5,
              enroll_status: 0,
              entrydate: 2024-09-03,
              exitdate: 2025-06-20,
            }
          - {
              id: 3,
              dcid: 13,
              student_number: 103,
              schoolid: 10,
              grade_level: 5,
              enroll_status: 0,
              entrydate: 2024-10-01,
              exitdate: 2024-09-15,
            }
      - input: ref('stg_powerschool__reenrollments')
        rows:
          - {
              dcid: 501,
              studentid: 1,
              schoolid: 10,
              grade_level: 4,
              entrydate: 2023-09-05,
              exitdate: 2024-06-20,
            }
          - {
              dcid: 502,
              studentid: 1,
              schoolid: 10,
              grade_level: 4,
              entrydate: 2023-08-15,
              exitdate: 2023-08-10,
            }
      - input: ref('stg_powerschool__terms')
        rows:
          - {
              schoolid: 10,
              yearid: 33,
              academic_year: 2023,
              isyearrec: 1,
              firstday: 2023-08-01,
              lastday: 2024-06-30,
            }
          - {
              schoolid: 10,
              yearid: 34,
              academic_year: 2024,
              isyearrec: 1,
              firstday: 2024-08-01,
              lastday: 2025-06-30,
            }
    expect:
      rows:
        - {
            student_number: 101,
            reenrollments_dcid: null,
            entrydate: 2024-09-03,
            exitdate: 2025-06-20,
          }
        - {
            student_number: 101,
            reenrollments_dcid: 501,
            entrydate: 2023-09-05,
            exitdate: 2024-06-20,
          }
