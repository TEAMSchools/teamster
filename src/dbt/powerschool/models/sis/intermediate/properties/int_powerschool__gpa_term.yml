models:
  - name: int_powerschool__gpa_term
    description:
      Term and year-to-date GPA, one row per student, academic year, and term.
      GPA spans every school where the student earned GPA-eligible grades that
      year, so join on studentid and yearid, not schoolid.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - yearid
              - term_name
    columns:
      - name: studentid
        data_type: int64
      - name: schoolid
        data_type: int64
        description:
          The school where the student earned the most GPA credit hours that
          year, ties broken by the higher school number. A label for the row,
          not a join key.
      - name: students_dcid
        data_type: int64
      - name: students_student_number
        data_type: int64
        config:
          meta:
            contains_pii: true
      - name: school_name
        data_type: string
      - name: school_abbreviation
        data_type: string
      - name: school_level
        data_type: string
      - name: yearid
        data_type: int64
      - name: academic_year
        data_type: int64
        description:
          Academic year the term falls in, as the calendar year the year
          started. PowerSchool's yearid plus 1990.
      - name: term_name
        data_type: string
      - name: semester
        data_type: string
      - name: is_current
        data_type: boolean
      - name: gpa_points_total_term
        data_type: float64
      - name: gpa_term
        data_type: float64
      - name: gpa_points_total_y1
        data_type: float64
      - name: gpa_y1
        data_type: float64
      - name: gpa_y1_unweighted
        data_type: float64
      - name: n_failing_y1
        data_type: int64
      - name: total_credit_hours_term
        data_type: float64
      - name: total_credit_hours_y1
        data_type: float64
      - name: grade_avg_term
        data_type: float64
      - name: grade_avg_y1
        data_type: float64
      - name: weighted_gpa_points_term
        data_type: float64
      - name: weighted_gpa_points_y1
        data_type: float64
      - name: weighted_gpa_points_y1_unweighted
        data_type: float64
      - name: gpa_points_total_semester
        data_type: float64
      - name: weighted_gpa_points_semester
        data_type: float64
      - name: total_credit_hours_semester
        data_type: float64
      - name: grade_avg_semester
        data_type: float64
      - name: gpa_semester
        data_type: float64
