models:
  - name: int_powerschool__category_grades_pivot
    description: |
      Category grades pivoted to one row per student, year, school, reporting
      term, and course, with running year-to-date columns.

      Built once a day at local midnight on the same tick as its parent
      `int_powerschool__category_grades`, so `~any_deps_in_progress` builds it
      after the parent. Its only consumer, `rpt_deanslist__final_grades`, is
      extracted at 01:25. Refs #5213.
    config:
      materialized: table
      meta:
        dagster:
          automation_condition:
            cron_schedule: 0 0 * * *
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - studentid
              - yearid
              - schoolid
              - reporting_term
              - course_number
          config:
            severity: error
    columns:
      - name: studentid
        data_type: int64
      - name: yearid
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: credittype
        data_type: string
      - name: course_number
        data_type: string
      - name: reporting_term
        data_type: string
      - name: is_current
        data_type: boolean
      - name: f_rt1
        data_type: float64
      - name: f_rt2
        data_type: float64
      - name: f_rt3
        data_type: float64
      - name: f_rt4
        data_type: float64
      - name: f_cur
        data_type: float64
      - name: f_y1
        data_type: float64
      - name: s_rt1
        data_type: float64
      - name: s_rt2
        data_type: float64
      - name: s_rt3
        data_type: float64
      - name: s_rt4
        data_type: float64
      - name: s_cur
        data_type: float64
      - name: s_y1
        data_type: float64
      - name: w_rt1
        data_type: float64
      - name: w_rt2
        data_type: float64
      - name: w_rt3
        data_type: float64
      - name: w_rt4
        data_type: float64
      - name: w_cur
        data_type: float64
      - name: w_y1
        data_type: float64
      - name: e_rt1
        data_type: float64
      - name: e_rt2
        data_type: float64
      - name: e_rt3
        data_type: float64
      - name: e_rt4
        data_type: float64
      - name: e_cur
        data_type: float64
      - name: e_y1
