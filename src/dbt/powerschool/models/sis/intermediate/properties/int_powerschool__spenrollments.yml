models:
  - name: int_powerschool__spenrollments
    columns:
      - name: dcid
        data_type: int64
      - name: id
        data_type: int64
      - name: studentid
        data_type: int64
      - name: programid
        data_type: int64
      - name: gradelevel
        data_type: int64
      - name: sp_comment
        data_type: string
      - name: enter_date
        data_type: date
      - name: exit_date
        data_type: date
      - name: exitcode
        data_type: string
      - name: academic_year
        data_type: int64
      - name: specprog_name
        data_type: string
      - name: student_number
        data_type: int64
        description:
          School-facing student number, from stg_powerschool__students joined on
          studentid. Null when the program enrollment's student has no student
          record.
        config:
          meta:
            contains_pii: true
      - name: is_out_of_district
        data_type: boolean
      - name: is_self_contained
        data_type: boolean
