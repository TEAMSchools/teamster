models:
  - name: int_powerschool__gpa_term_current
    description: >-
      int_powerschool__gpa_term filtered to the current term per student and
      school. Declared ephemeral here; district projects materialize it as a
      table. kipptaf does not wrap it and filters its own gpa_term wrapper
      instead. Column list is partial; grade_avg_*, gpa_points_total_*,
      weighted_gpa_points_*, and total_credit_hours_* are undocumented
      student-level grade content.
    config:
      materialized: ephemeral
    columns:
      - name: studentid
        data_type: int64
      - name: schoolid
        data_type: int64
      - name: yearid
        data_type: int64
      - name: term_name
        data_type: string
      - name: semester
        data_type: string
      - name: is_current
        data_type: boolean
      - name: gpa_term
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: gpa_y1
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: gpa_y1_unweighted
        data_type: float64
        config:
          meta:
            contains_pii: true
      - name: n_failing_y1
        data_type: int64
        config:
          meta:
            contains_pii: true
      - name: gpa_semester
        data_type: float64
        config:
          meta:
            contains_pii: true
