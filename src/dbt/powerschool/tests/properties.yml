data_tests:
  - name: test_int_powerschool__ps_enrollment_all__fteid_belongs_to_school_year
    description: >-
      Every enrollment row's `fteid` must point to an FTE record whose
      `schoolid` and `yearid` match the enrollment's. PowerSchool defines each
      FTE per `(schoolid, yearid)`; assigning a student an `fteid` from a
      different school or year produces silent NULLs in
      `int_powerschool__ps_adaadm_daily_ctod` because the `(fteid,
      attendance_conversion_id)` join in that model resolves only when the FTE
      matches the school's bell-schedule conversion config. Graduated stints
      (`schoolid = 999999`) and stints with no days left after clipping
      (`entrydate >= exitdate_clipped`) are excluded — neither gets a membership
      day, so a mismatched FTE there never reaches attendance. Fix it in
      PowerSchool by setting the enrollment's FTE to the one defined for that
      school and year.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: int_powerschool__ps_enrollment_all
            package: powerschool

  - name: test_int_powerschool__ps_enrollment_all__no_overlapping_stints
    description: >-
      A PowerSchool student has two enrollment stints that overlap, at the same
      or different schools. A stint's `entrydate` falls inside an earlier
      stint's half-open `[entrydate, exitdate)`, usually because the old stint
      was left open after a transfer. Fix it in PowerSchool by closing the
      earlier stint, or correcting its exit date, so it ends on or before the
      later stint's entry date. Downstream, `exitdate_clipped` on this model
      cuts the earlier stint off at the later stint's `entrydate`, so
      `int_powerschool__ps_membership_reg` stays at one row per student-day
      instead of double-counting the overlap in attendance.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: int_powerschool__ps_enrollment_all
            package: powerschool

  - name: int_powerschool__student_enrollment_union_no_shared_stint_boundary
    description: >-
      A PowerSchool student's enrollment stint exits on the same date the next
      stint enters. The normal pattern is an exit on one day and re-entry the
      next, so a shared boundary date puts the student in both stints that day
      and fans out date-range joins on it (for example survey attribution and
      attendance windows). Fix it in PowerSchool by moving the earlier stint's
      exit date back one day, or the later stint's entry date forward one day.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: int_powerschool__student_enrollment_union
            package: powerschool

  - name: test_int_powerschool__gpa_cumulative_year__reconciles_stored
    description: >-
      Drift guard for the year-grain recompute — for each student-school, the
      latest completed-year row of int_powerschool__gpa_cumulative_year must
      match int_powerschool__gpa_cumulative within one rounding step on both
      weighted and unweighted cumulative GPA, for students with no stored
      current-year Y1 grades (once current-year grades store, the original model
      includes them and the comparison is no longer like-for-like). Identical
      filters and rounding make this exact in practice; the comparison threshold
      is 0.015 so the one-cent rounding-boundary flip from float summation-order
      noise passes while real drift (0.02 or more) still warns. Runs at warn
      severity so a transient discrepancy surfaces without blocking district
      prod builds — investigate any warning immediately.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: int_powerschool__gpa_cumulative_year
            package: powerschool

  - name: base_powerschool__course_enrollments__no_studyear_course_overlap
    description: >-
      Within a (student, year, course) -- cc_studyear is PowerSchool's composite
      student-and-year identifier -- consecutive enrollment rows must not have
      date ranges that overlap by more than one day. A single shared boundary
      day is a normal sequential transfer and is allowed; multi-day overlap is
      the source-side defect that fans out cc date-range joins. Dropped sections
      (`is_dropped_section`) are excluded, because a drop and its replacement
      section normally overlap and most consumers filter drops out. A failure
      means PowerSchool holds two live section enrollments in one course for the
      same student and year. Fix it in PowerSchool by dropping the duplicate
      section enrollment, or end-dating it the day the other one starts.
      Downstream, `rn_course_number_year` on
      base_powerschool__course_enrollments ranks the enrollments per student,
      year, and course, so consumers that filter on 1 keep only the latest.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: base_powerschool__course_enrollments
            package: powerschool

  - name: base_powerschool__course_enrollments__no_concurrent_ap_subject
    description: >-
      A student enrolled in two different courses carrying the same AP subject
      code at the same time. The AP subject code (`ap_course_subject`, from the
      NJ course extension) says which AP exam a course prepares for, so two
      concurrent courses with one code usually means a support course such as a
      recitation section was tagged as if it were the AP course itself.
      Downstream, the student then looks enrolled in that AP course twice. The
      fix is in PowerSchool, clearing the AP subject on the support course;
      kipptaf's `int_students__course_enrollments.rn_ap_course_subject_year`
      keeps consumers to one course per subject in the meantime. A sequential
      switch between two courses with the same code is not flagged. Dropped
      sections are excluded, as in the overlap test above. Warn, since each row
      is a PowerSchool course record to correct.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: base_powerschool__course_enrollments
            package: powerschool

  - name: base_powerschool__student_enrollments__cohort_not_ahead_of_entry
    description: >-
      A current high school student should never be ahead of the cohort they
      entered with. For grade 9 and up, cohort freezes at the student's first
      year in the school, which is correct for New Jersey's 4-year adjusted
      cohort graduation rate. Falling behind that cohort is ordinary retention
      and is not a defect, so only the other direction is tested -- a student
      whose grade level implies an earlier graduating class (`cohort_primary`)
      than their recorded cohort. Three causes produce that shape. A skipped
      grade and a missing enrollment year are records problems, corrected in
      PowerSchool. Summer credit recovery is not -- a student can advance a
      grade over the summer with no enrollment row to show for it, because
      int_powerschool__student_enrollment_union filters out the summer school,
      so the records are already right. Warn rather than error, because no
      result here is fixed by a code change. Miami's version is
      int_extracts__student_enrollments__miami_cohort_not_ahead_of_entry in
      kipptaf.
    config:
      severity: warn
      meta:
        dagster:
          ref:
            name: base_powerschool__student_enrollments
            package: powerschool
