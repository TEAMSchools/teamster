      - name: shipreportschoolcode
        data_type: int64
      - name: shipreportdistrictcode
        data_type: int64
      - name: academic_year
        data_type: int64
        description: First four characters of assessmentyear, as an integer.
      - name: test_grade
        data_type: int64
        description:
          Grade number extracted from assessmentgrade ('Grade 5' → 5).
      - name: discipline
        data_type: string
        description: >-
          'ELA' when subject is 'English Language Arts/Literacy', else 'Math'.
      - name: is_proficient
        data_type: boolean
        description: True when testperformancelevel is 4 or higher.
        config:
          meta:
            contains_pii: true
      - name: testperformancelevel_text
        data_type: string
        description: >-
          Label for testperformancelevel — 5 'Exceeded Expectations', 4 'Met
          Expectations', 3 'Approached Expectations', 2 'Partially Met
          Expectations', 1 'Did Not Yet Meet Expectations'.
        config:
          meta:
            contains_pii: true
      - name: is_bl_fb
        data_type: boolean
        description: >-
          Below or far below — true when testperformancelevel is 2 or lower.
        config:
          meta:
            contains_pii: true
      - name: test_date
        data_type: date
        description: >-
          Date the student took the assessment, derived from the earliest online
          start datetime across units 1 to 4 (parsed as month/day/year hour and
          minute), falling back to the date part of attemptcreatedate. Null when
          neither parses.
      - name: assessment_version
        data_type: string
        description: >-
          Literal 'PARCC'. PARCC has only one version, so the value restates
          assessment_name. It is set here so every relation unioned into
          int_pearson__all_assessments supplies the column rather than
          null-filling it.
      - name: subject_area
        data_type: string
        description:
          Normalized from `subject` ('English Language Arts/Literacy' → 'English
          Language Arts').
      - name: administration_period
        data_type: string
        description: Normalized from `period` ('FallBlock' → 'Fall').
      - name: module_code
        data_type: string
        description:
          Normalized from `testcode` (SC05/SC08/SC11 remapped to
          SCI05/SCI08/SCI11).
