models:
  - name: stg_pearson__parcc
    description: >-
      Pearson PARCC ELA and Math summative score records, the New Jersey state
      test before NJSLA, one row per student test (studenttestuuid). Keeps only
      rows with summativeflag and testattemptednessflag both 'Y'. Source columns
      pass through with a star select, with codes and scores cast to numeric
      types. Frozen history; no new rows are expected.
