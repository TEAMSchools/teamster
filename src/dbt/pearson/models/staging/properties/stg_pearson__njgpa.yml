      - name: assessmentyear
        data_type: string
      - name: period
        data_type: string
      - name: subject
        data_type: string
      - name: testcode
        data_type: string
      - name: testperformancelevel
        data_type: numeric
      - name: testscalescore
        data_type: numeric
      - name: testscorecomplete
        data_type: numeric
      - name: studentwithdisabilities
        data_type: string
      - name: englishlearnerel
        data_type: string
      - name: hispanicorlatinoethnicity
        data_type: string
      - name: americanindianoralaskanative
        data_type: string
      - name: asian
        data_type: string
      - name: blackorafricanamerican
        data_type: string
      - name: nativehawaiianorotherpacificislander
        data_type: string
      - name: white
        data_type: string
