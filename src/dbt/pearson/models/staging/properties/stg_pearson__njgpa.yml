models:
  - name: stg_pearson__njgpa
    columns:
      - name: statestudentidentifier
        data_type: int64
      - name: localstudentidentifier
        data_type: int64
      - name: firstname
        data_type: string
      - name: lastorsurname
        data_type: string
      - name: assessmentgrade
        data_type: string
      - name: assessmentyear
        data_type: string
      - name: period
        data_type: string
      - name: subject
        data_type: string
      - name: testcode
        data_type: string
      - name: testperformancelevel
        data_type: numeric
      - name: testscalescore
        data_type: numeric
      - name: testscorecomplete
        data_type: numeric
      - name: studentwithdisabilities
        data_type: string
      - name: englishlearnerel
        data_type: string
      - name: hispanicorlatinoethnicity
        data_type: string
      - name: americanindianoralaskanative
        data_type: string
      - name: asian
        data_type: string
      - name: blackorafricanamerican
        data_type: string
      - name: nativehawaiianorotherpacificislander
        data_type: string
      - name: white
        data_type: string
      - name: twoormoreraces
        data_type: string
      - name: unit1onlineteststartdatetime
        data_type: string
      - name: unit1onlinetestenddatetime
        data_type: string
      - name: unit2onlineteststartdatetime
        data_type: string
      - name: unit2onlinetestenddatetime
        data_type: string
      - name: unit3onlineteststartdatetime
        data_type: string
      - name: unit3onlinetestenddatetime
        data_type: string
      - name: paperattemptcreatedate
        data_type: string
      - name: assessment_name
        data_type: string
      - name: academic_year
        data_type: int64
      - name: test_grade
        data_type: int64
      - name: staffmemberidentifier
        data_type: int64
      - name: testadministrator
        data_type: int64
      - name: testcsemprobablerange
        data_type: numeric
      - name: testreadingcsem
        data_type: numeric
      - name: testreadingscalescore
        data_type: numeric
      - name: testwritingcsem
        data_type: numeric
      - name: testwritingscalescore
        data_type: numeric
      - name: discipline
        data_type: string
      - name: season
        data_type: string
      - name: is_proficient
        data_type: boolean
      - name: testperformancelevel_text
        data_type: string
      - name: studenttestuuid
        data_type: string
      - name: test_date
        data_type: date
        description:
          Earliest online unit start date across all attempted units, or the
          paper attempt create date when no online unit datetimes are present.
          Null when no unit datetime or paper date is available.
      - name: assessment_version
        data_type: string
        description: >-
          Literal 'NJGPA', marking every row here as the retired Pearson form of
          the assessment. int_pearson__all_assessments carries the value up so
          graduation pathway cut scores can be keyed to the score scale the row
          was produced on, rather than to the student's cohort.
      - name: subject_area
        data_type: string
        description:
          Normalized from `subject` ('English Language Arts/Literacy' → 'English
          Language Arts').
      - name: administration_period
        data_type: string
        description: Normalized from `period` ('FallBlock' → 'Fall').
      - name: module_code
        data_type: string
        description:
          Normalized from `testcode` (SC05/SC08/SC11 remapped to
          SCI05/SCI08/SCI11).
      - name: results_type
        data_type: string
        description: Always 'Actual'; student list reports carry 'Preliminary'.
      - name: district_state
        data_type: string
        description: Network district/state identifier; always 'KTAF NJ'.
      - name: aligned_test_code
        data_type: string
        description: >-
          Alias of module_code — the test code normalized for stacked reporting
          across assessment programs (SC05/SC08/SC11 remapped to
          SCI05/SCI08/SCI11).
      - name: aligned_subject
        data_type: string
        description: >-
          Alias of subject_area — 'English Language Arts/Literacy' shortened to
          'English Language Arts'; all other subjects pass through.
      - name: admin
        data_type: string
        description:
          Alias of administration_period; reserved-word alias kept for Tableau.
      - name: is_504
        data_type: boolean
        description: True when studentwithdisabilities is '504' or 'B'.
      - name: lep_status
        data_type: boolean
        description: True when englishlearnerel is 'Y'.
      - name: iep_status
        data_type: string
        description:
          "'Has IEP' when studentwithdisabilities is 'IEP' or 'B', else 'No
          IEP'."
      - name: is_proficient_int
        data_type: int64
        description: is_proficient as 1/0.
      - name: race_ethnicity
        data_type: string
        description: >-
          Single-character race/ethnicity code from the Pearson indicator flags,
          priority T, H, I, A, B, P, W.
      - name: illuminate_subject
        data_type: string
        description: >-
          ELA subjects map to 'Text Study'; Algebra I, Algebra II and Geometry
          map to 'Mathematics'; all others pass through.
      - name: njsla_aggregated_proficiency
        data_type: string
        description: >-
          NJSLA only: levels 1-2 'Below/Far Below', 3 'Approaching', 4+
          'At/Above'. Null for other assessments.
      - name: njsla_performance_band_group_label
        data_type: string
        description: >-
          NJSLA only: levels 1-2 'Not Proficient (1-2)', 3 'Bubble (3)', 4+
          'Proficient (4-5)'. Null for other assessments.
      - name: aligned_performance_band_group
        data_type: string
        description: >-
          'Lvl 1' to 'Lvl 5' from testperformancelevel_text; the two NJGPA
          labels map to 'Lvl 3' and 'Lvl 4'.
      - name: is_approaching_int
        data_type: int64
        description: >-
          1 for NJSLA Science level 2 or ELA/Math level 3, else 0. Always 0 for
          NJGPA.
      - name: is_below_int
        data_type: int64
        description: >-
          1 for NJGPA level 1, NJSLA Science below level 2, or ELA/Math below
          level 3, else 0.
      - name: assessment_type
        data_type: string
        description: >-
          Program-lineage label from assessment_name ('state_nj_parcc',
          'state_nj_njsla', 'state_nj_njsla_science', 'state_nj_njgpa'). Marts
          hash it into assessment_key.
      - name: aligned_aggregate_ethnicity
        data_type: string
        description: >-
          race_ethnicity expanded to the label used across comparison sources (B
          'African American', H 'Hispanic', ...); null maps to 'Blank'.
      - name: aligned_ml_status
        data_type: string
        description: "'ML' when lep_status, else 'Not ML'."
      - name: aligned_iep_status
        data_type: string
        description:
          "'Students With Disabilities' or 'Students Without Disabilities'."
