models:
  - name: stg_pearson__njgpa
    description: >-
      Pearson NJGPA (New Jersey Graduation Proficiency Assessment) summative
      score records, one row per student test (studenttestuuid). Keeps only rows
      with summativeflag and testattemptednessflag both 'Y'. Frozen history; no
      new rows are expected.
    columns:
      - name: statestudentidentifier
        data_type: int64
        config:
          meta:
            contains_pii: true
      - name: localstudentidentifier
        data_type: int64
        config:
          meta:
            contains_pii: true
      - name: firstname
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: lastorsurname
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: assessmentgrade
        data_type: string
      - name: assessmentyear
        data_type: string
      - name: period
        data_type: string
      - name: subject
        data_type: string
      - name: testcode
        data_type: string
      - name: testperformancelevel
        data_type: numeric
        config:
          meta:
            contains_pii: true
      - name: testscalescore
        data_type: numeric
        config:
          meta:
            contains_pii: true
      - name: testscorecomplete
        data_type: numeric
        config:
          meta:
            contains_pii: true
      - name: studentwithdisabilities
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: englishlearnerel
        data_type: string
        description: >-
          English learner flag, taken from multilinguallearnerml when present
          and englishlearnerel otherwise.
        config:
          meta:
            contains_pii: true
      - name: hispanicorlatinoethnicity
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: americanindianoralaskanative
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: asian
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: blackorafricanamerican
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: nativehawaiianorotherpacificislander
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: white
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: twoormoreraces
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: unit1onlineteststartdatetime
        data_type: string
      - name: unit1onlinetestenddatetime
        data_type: string
      - name: unit2onlineteststartdatetime
        data_type: string
      - name: unit2onlinetestenddatetime
        data_type: string
      - name: unit3onlineteststartdatetime
        data_type: string
      - name: unit3onlinetestenddatetime
        data_type: string
      - name: paperattemptcreatedate
        data_type: string
      - name: assessment_name
        data_type: string
        description: Literal 'NJGPA'.
      - name: academic_year
        data_type: int64
        description: First four characters of assessmentyear, as an integer.
      - name: test_grade
        data_type: int64
        description:
          Grade number extracted from assessmentgrade ('Grade 11' → 11).
      - name: staffmemberidentifier
        data_type: int64
        config:
          meta:
            contains_pii: true
      - name: testadministrator
        data_type: int64
        config:
          meta:
            contains_pii: true
      - name: testcsemprobablerange
        data_type: numeric
        config:
          meta:
            contains_pii: true
      - name: testreadingcsem
        data_type: numeric
        config:
          meta:
            contains_pii: true
      - name: testreadingscalescore
        data_type: numeric
        config:
          meta:
            contains_pii: true
      - name: testwritingcsem
        data_type: numeric
        config:
          meta:
            contains_pii: true
      - name: testwritingscalescore
        data_type: numeric
        config:
          meta:
            contains_pii: true
      - name: discipline
        data_type: string
        description: "'Math' when subject is 'Mathematics', else 'ELA'."
      - name: is_proficient
        data_type: boolean
        description: True when testperformancelevel is 2 (Graduation Ready).
        config:
          meta:
            contains_pii: true
      - name: testperformancelevel_text
        data_type: string
        description: >-
          Label for testperformancelevel — 2 'Graduation Ready', 1 'Not Yet
          Graduation Ready'.
        config:
          meta:
            contains_pii: true
      - name: studenttestuuid
        data_type: string
      - name: test_date
        data_type: date
        description:
          Earliest online unit start date across all attempted units, or the
          paper attempt create date when no online unit datetimes are present.
          Null when no unit datetime or paper date is available.
      - name: assessment_version
        data_type: string
        description: >-
          Literal 'NJGPA', marking every row here as the retired Pearson form of
          the assessment. int_pearson__all_assessments carries the value up so
          graduation pathway cut scores can be keyed to the score scale the row
          was produced on, rather than to the student's cohort.
      - name: subject_area
        data_type: string
        description:
          Normalized from `subject` ('English Language Arts/Literacy' → 'English
          Language Arts').
      - name: administration_period
        data_type: string
        description: Normalized from `period` ('FallBlock' → 'Fall').
      - name: module_code
        data_type: string
        description:
          Normalized from `testcode` (SC05/SC08/SC11 remapped to
          SCI05/SCI08/SCI11).
