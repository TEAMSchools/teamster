      - name: assessment_name
        data_type: string
        description: Literal 'NJSLA Science'.
      - name: discipline
        data_type: string
        description: Literal 'Science'.
      - name: academic_year
        data_type: int64
        description: First four characters of assessmentyear, as an integer.
      - name: test_grade
        data_type: int64
        description:
          Grade number extracted from assessmentgrade ('Grade 8' → 8).
      - name: is_proficient
        data_type: boolean
        description: True when testperformancelevel is 3 or higher.
        config:
          meta:
            contains_pii: true
      - name: test_code
        data_type: string
        description: >-
          Normalized from `testcode` (SC05/SC08/SC11 remapped to
          SCI05/SCI08/SCI11); same value as module_code.
      - name: testperformancelevel_text
        data_type: string
        description: >-
          Label for testperformancelevel — 4 'Exceeded Expectations', 3 'Met
          Expectations', 2 'Approached Expectations', 1 'Did Not Yet Meet
          Expectations'.
        config:
          meta:
            contains_pii: true
      - name: test_date
        data_type: date
        description: >-
          Date the student took the assessment, derived from the earliest online
          start datetime across units 1 to 4, falling back to the paper attempt
          create date. Start datetimes without seconds are also parsed.
      - name: homeless_primary_nighttime_residence
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: multilinguallearneraccommodatedresponse
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: requiredhighschoolmathassessment
        data_type: string
        config:
          meta:
            contains_pii: true
      - name: assessment_version
        data_type: string
        description: >-
          Literal 'NJSLA Science'. NJSLA Science has only one version, so the
          value restates assessment_name. It is set here so every relation
          unioned into int_pearson__all_assessments supplies the column rather
          than null-filling it.
      - name: subject_area
        data_type: string
        description:
          Normalized from `subject` ('English Language Arts/Literacy' → 'English
          Language Arts').
      - name: administration_period
        data_type: string
        description: Normalized from `period` ('FallBlock' → 'Fall').
      - name: module_code
        data_type: string
        description:
          Normalized from `testcode` (SC05/SC08/SC11 remapped to
          SCI05/SCI08/SCI11).
