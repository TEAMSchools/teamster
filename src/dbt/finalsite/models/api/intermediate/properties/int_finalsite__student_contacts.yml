models:
  - name: int_finalsite__student_contacts
    description:
      SIS-agnostic long-format contact list for Finalsite student records — one
      row per (student, contact slot), grain `(finalsite_enrollment_id,
      contact_slot)`. Parent slots (`contact_1`, `contact_2`, ...) come from
      every relationship flagged `primary` or `financial` whose related contact
      is an adult (Finalsite status `not_in_workflow`), ranked by the `primary`
      flag, then by sharing a household with the student, then by
      `relationship_id`, and numbered densely with no fixed upper bound —
      families with more recorded parent-type relationships get more slots.
      Household co-membership orders candidates rather than excluding them, so a
      non-resident parent still fills a slot. `emergency_1` through
      `emergency_4` are the `custom_attributes` `emrg_N` sets mapped
      positionally — `emergency_N` is `emrg_N` as-is, with no priority re-sort
      and no gap-filling. Sparse — a slot row is emitted only when that slot has
      data, so emergency slots may have gaps. Feeds the downstream
      PowerSchool/Focus contact receivers built on top of this model.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - finalsite_enrollment_id
              - contact_slot
          config:
            severity: error
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              regexp_contains(contact_slot, r'^(contact_[0-9]+|emergency_[1-4])$')
          config:
            severity: error
    columns:
      - name: finalsite_enrollment_id
        data_type: string
        description:
          Finalsite contact UUID of the student this contact belongs to.
        data_tests:
          - not_null:
              config:
                severity: error
        config:
          meta:
            contains_pii: true
      - name: contact_slot
        data_type: string
        description:
          Which contact this row represents. Parent slots are numbered densely
          from `contact_1` by rank with no fixed upper bound — `contact_1` is
          the top-ranked parent rather than strictly the `primary` relationship.
          `emergency_1` through `emergency_4` are the four fixed
          `custom_attributes` `emrg_N` sets mapped positionally.
      - name: finalsite_contact_id
        data_type: string
        description:
          The contact person's own Finalsite contact UUID (their
          `finalsite_enrollment_id`), resolved through the selected
          relationship's `rel_id`. Populated for `contact_1` and `contact_2`;
          null for `emergency_*` slots, which are free-text custom-field sets
          with no linked contact record.
        config:
          meta:
            contains_pii: true
      - name: contact_name
        data_type: string
        description:
          Contact's name — the relationship's `rel_name` for `contact_1` and
          `contact_2`, or the concatenated first/last name from the matching
          `emrg_N_name_*` fields for an emergency slot.
        config:
          meta:
            contains_pii: true
      - name: contact_first_name
        data_type: string
        description:
          Contact's first name — the related person's Finalsite `first_name` for
          `contact_1` and `contact_2`, or `emrg_N_name_first_name` for an
          emergency slot.
        config:
          meta:
            contains_pii: true
      - name: contact_last_name
        data_type: string
        description:
          Contact's last name — the related person's Finalsite `last_name` for
          `contact_1` and `contact_2`, or `emrg_N_name_last_name` for an
          emergency slot.
        config:
          meta:
            contains_pii: true
      - name: relationship
        data_type: string
        description:
          Relationship to the student — the relationship's `rel_type` for
          `contact_1` and `contact_2`, or `emrg_N_relationship_ss` (falling back
          to `emrg_N_relationship_txt`) for an emergency slot.
      - name: email
        data_type: string
        description:
          Contact's email address, from the related person's Finalsite contact
          record for `contact_1` and `contact_2` or `emrg_N_email` for an
          emergency slot.
        config:
          meta:
            contains_pii: true
      - name: phone_mobile
        data_type: string
        description:
          The contact's phone number typed `Cell`, if any. Already normalized to
          E.164 upstream — in `stg_finalsite__contacts` for `contact_1` and
          `contact_2`, in `int_finalsite__contact_custom_attributes` for an
          emergency slot.
        config:
          meta:
            contains_pii: true
      - name: phone_home
        data_type: string
        description:
          The contact's phone number typed `Home`, if any. Already normalized to
          E.164 upstream.
        config:
          meta:
            contains_pii: true
      - name: phone_work
        data_type: string
        description:
          The contact's phone number typed `Work`, if any. Already normalized to
          E.164 upstream.
        config:
          meta:
            contains_pii: true
      - name: phone_daytime
        data_type: string
        description:
          Always null — Finalsite has no equivalent phone type; carried for
          downstream SIS receiver shape parity.
        config:
          meta:
            contains_pii: true
      - name: phone_primary
        data_type: string
        description:
          The contact's first phone number regardless of type — a fallback for
          phones with a blank `_type` that the typed columns miss. Already
          normalized to E.164 upstream.
        config:
          meta:
            contains_pii: true
      - name: home_address
        data_type: string
        description:
          Comma-joined household address (`address_1, address_2, city, state,
          zip`) from the related person's Finalsite contact record. Always null
          for `emergency_*` slots — emergency sets carry no address.
        config:
          meta:
            contains_pii: true
      - name: is_pickup
        data_type: boolean
        description:
          Whether the contact is authorized for pickup. Always null for
          `contact_1` and `contact_2`; `emrg_N_pickup_yn` for an emergency slot.
      - name: is_custodial
        data_type: boolean
        description:
          Whether the contact has custody. Always null for `contact_1` and
          `contact_2`; `emrg_N_custody_yn` for an emergency slot.
      - name: is_household_member
        data_type: boolean
        description:
          Whether the contact lives with the student. Always null for every
          parent slot (household co-membership now orders parent slots rather
          than gating them, so a parent slot implies nothing about
          co-residence); `emrg_N_lives_with_yn` for an emergency slot.
      - name: is_emergency
        data_type: boolean
        description:
          False for `contact_1` and `contact_2`; true for every `emergency_*`
          slot.

unit_tests:
  - name: test_student_contacts_phone_typed_slots
    description:
      A contact_1 row routes each of the related person's phones to the slot
      matching its type label — `Cell` to phone_mobile, `Home` to phone_home, an
      absent type to a null slot — and carries phone_1 through as phone_primary
      regardless of type. Phones arrive already normalized to E.164 from
      `stg_finalsite__contacts`; this model passes them through unchanged.
    model: int_finalsite__student_contacts
    given:
      - input: ref('stg_finalsite__contact_relationships')
        format: sql
        rows: |
          select
            'stu1' as finalsite_enrollment_id,
            'rel1' as relationship_id,
            'con1' as rel_id,
            'Jane Doe' as rel_name,
            'parent' as rel_type,
            true as is_primary,
            true as is_financial,
            cast(null as boolean) as is_parent2
      - input: ref('stg_finalsite__contacts')
        format: sql
        rows: |
          select
            'con1' as finalsite_enrollment_id,
            'not_in_workflow' as status,
            'jane@example.com' as email,
            'Jane' as first_name,
            'Doe' as last_name,
            '+18623007240' as phone_1_number,
            'Cell' as phone_1_type,
            '+19292255670' as phone_2_number,
            'Home' as phone_2_type,
            cast(null as string) as phone_3_number,
            cast(null as string) as phone_3_type,
            cast(null as string) as address_1,
            cast(null as string) as address_2,
            cast(null as string) as city,
            cast(null as string) as state,
            cast(null as string) as zip
      - input: ref('int_finalsite__contacts__households')
        rows: []
      - input: ref('int_finalsite__contact_custom_attributes')
        rows: []
    expect:
      format: sql
      rows: |
        select
          'stu1' as finalsite_enrollment_id,
          'contact_1' as contact_slot,
          'con1' as finalsite_contact_id,
          'Jane Doe' as contact_name,
          'Jane' as contact_first_name,
          'Doe' as contact_last_name,
          'parent' as relationship,
          'jane@example.com' as email,
          cast(null as string) as phone_daytime,
          cast(null as string) as home_address,
          cast(null as boolean) as is_pickup,
          cast(null as boolean) as is_custodial,
          cast(null as boolean) as is_household_member,
          false as is_emergency,
          '+18623007240' as phone_mobile,
          '+19292255670' as phone_home,
          cast(null as string) as phone_work,
          '+18623007240' as phone_primary

  - name: test_student_contacts_parent_2
    description:
      Dense slot assignment. stu1 has a primary parent (con1), a financial
      stepparent sharing stu1's household (con2), and a financial parent in a
      different household (con3) -- yielding contact_1, contact_2, contact_3,
      with con3 ranked last because it shares no household with the student
      rather than being excluded. stu2 has no primary and two financial
      relationships -- yielding contact_1 and contact_2, where the old rule
      yielded nothing. con6 is a financial relationship to another STUDENT
      record and is excluded from stu2 entirely by the adult guard.
    model: int_finalsite__student_contacts
    given:
      - input: ref('stg_finalsite__contact_relationships')
        format: sql
        rows: |
          select
            'stu1' as finalsite_enrollment_id,
            'rel1' as relationship_id,
            'con1' as rel_id,
            'Jane Doe' as rel_name,
            'parent' as rel_type,
            true as is_primary,
            true as is_financial,
            false as is_parent2
          union all
          select
            'stu1', 'rel2', 'con2', 'John Doe', 'stepparent',
            cast(null as boolean), true, false
          union all
          select
            'stu1', 'rel3', 'con3', 'Jim Poe', 'parent',
            cast(null as boolean), true, false
          union all
          select
            'stu2', 'rel4', 'con4', 'Fay Ray', 'parent',
            cast(null as boolean), true, false
          union all
          select
            'stu2', 'rel5', 'con5', 'Gus Ray', 'parent',
            cast(null as boolean), true, false
          union all
          select
            'stu2', 'rel6', 'con6', 'Kid Ray', 'sibling',
            cast(null as boolean), true, false
      - input: ref('stg_finalsite__contacts')
        format: sql
        rows: |
          select
            'stu1' as finalsite_enrollment_id,
            'enrolled' as status,
            cast(null as string) as email,
            'Stu' as first_name,
            'One' as last_name,
            cast(null as string) as phone_1_number,
            cast(null as string) as phone_1_type,
            cast(null as string) as phone_2_number,
            cast(null as string) as phone_2_type,
            cast(null as string) as phone_3_number,
            cast(null as string) as phone_3_type,
            cast(null as string) as address_1,
            cast(null as string) as address_2,
            cast(null as string) as city,
            cast(null as string) as state,
            cast(null as string) as zip
          union all
          select
            'stu2', 'enrolled', cast(null as string), 'Stu', 'Two',
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string), cast(null as string)
          union all
          select
            'con1', 'not_in_workflow', 'jane@example.com', 'Jane', 'Doe',
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string), cast(null as string)
          union all
          select
            'con2', 'not_in_workflow', 'john@example.com', 'John', 'Doe',
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string), cast(null as string)
          union all
          select
            'con3', 'not_in_workflow', 'jim@example.com', 'Jim', 'Poe',
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string), cast(null as string)
          union all
          select
            'con4', 'not_in_workflow', 'fay@example.com', 'Fay', 'Ray',
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string), cast(null as string)
          union all
          select
            'con5', 'not_in_workflow', 'gus@example.com', 'Gus', 'Ray',
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string), cast(null as string)
          union all
          select
            'con6', 'enrolled', 'kid@example.com', 'Kid', 'Ray',
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string),
            cast(null as string), cast(null as string), cast(null as string)
      - input: ref('int_finalsite__contacts__households')
        format: sql
        rows: |
          select 'stu1' as finalsite_enrollment_id, 'hh1' as household_id
          union all
          select 'con1', 'hh1'
          union all
          select 'con2', 'hh1'
          union all
          select 'con3', 'hh2'
          union all
          select 'stu2', 'hh3'
          union all
          select 'con4', 'hh3'
          union all
          select 'con5', 'hh3'
          union all
          select 'con6', 'hh3'
      - input: ref('int_finalsite__contact_custom_attributes')
        rows: []
    expect:
      rows:
        - finalsite_enrollment_id: stu1
          contact_slot: contact_1
          finalsite_contact_id: con1
          contact_name: Jane Doe
          contact_first_name: Jane
          contact_last_name: Doe
          relationship: parent
        - finalsite_enrollment_id: stu1
          contact_slot: contact_2
          finalsite_contact_id: con2
          contact_name: John Doe
          contact_first_name: John
          contact_last_name: Doe
          relationship: stepparent
        - finalsite_enrollment_id: stu1
          contact_slot: contact_3
          finalsite_contact_id: con3
          contact_name: Jim Poe
          contact_first_name: Jim
          contact_last_name: Poe
          relationship: parent
        - finalsite_enrollment_id: stu2
          contact_slot: contact_1
          finalsite_contact_id: con4
          contact_name: Fay Ray
          contact_first_name: Fay
          contact_last_name: Ray
          relationship: parent
        - finalsite_enrollment_id: stu2
          contact_slot: contact_2
          finalsite_contact_id: con5
          contact_name: Gus Ray
          contact_first_name: Gus
          contact_last_name: Ray
          relationship: parent
