models:
  - name: stg_finalsite__contact_relationships
    description:
      One row per (contact, relationship) — the family-graph edges (guardians,
      siblings, children) attached to each Finalsite contact, unnested from the
      `relationships` array. `rel_id` is the related person's Finalsite contact
      UUID; join it to `stg_finalsite__contacts` for the related person's
      details (guardians resolve there; sibling/child links to people outside
      the pulled cohort will not match).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - finalsite_enrollment_id
              - relationship_id
          config:
            severity: error
    columns:
      - name: finalsite_enrollment_id
        data_type: string
        description:
          Finalsite contact UUID of the student this relationship belongs to.
      - name: relationship_id
        data_type: string
        description: Finalsite relationship UUID; unique within a contact.
      - name: rel_id
        data_type: string
        description:
          Finalsite contact UUID of the related person; join to
          `stg_finalsite__contacts` for their details.
      - name: rel_name
        data_type: string
        description: Name of the related person as stored on the relationship.
      - name: rel_type
        data_type: string
        description:
          Relationship type (e.g. parent, guardian, sibling, child) — not
          gendered.
      - name: is_primary
        data_type: boolean
        description: Whether this is the primary relationship for the contact.
      - name: is_financial
        data_type: boolean
        description:
          Whether this relationship is the financially responsible party.
      - name: has_portal_access
        data_type: boolean
        description: Whether the related person has Finalsite portal access.
      - name: household_1_id
        data_type: string
        description:
          Finalsite id of the OWNING contact's first household ("household 1") —
          a record-owner field carried onto the relationship grain, matching
          `stg_finalsite__contacts.household_1_id` for
          `finalsite_enrollment_id`. It never describes the related person
          (`rel_id`).
      - name: is_parent2
        data_type: boolean
        description:
          Boolean value of the OWNING contact's `is_parent2` custom field ("this
          student has a Parent 2"); null when the field is unset. A record-owner
          field carried onto the relationship grain — it never describes the
          related person (`rel_id`).

unit_tests:
  - name: test_relationships_do_not_fan_out_across_partitions
    description: One deduped contact with two relationships yields exactly two
      rows. Reading the deduped model instead of the accumulated source is what
      prevents the cross join multiplying each relationship by the number of
      partitions the contact appears in. See #4715.
    model: stg_finalsite__contact_relationships
    given:
      - input: ref('stg_finalsite__contacts')
        format: sql
        rows: |
          select
            'con1' as finalsite_enrollment_id,
            'hh1' as household_1_id,
            array<struct<field_name string, value struct<boolean_value bool>>>[]
              as custom_attributes,
            [
              struct(
                'rel1' as id,
                'adult1' as rel_id,
                'Ann Doe' as rel_name,
                'mother' as rel_type,
                true as `primary`,
                true as financial,
                true as portal_access
              ),
              struct(
                'rel2' as id,
                'adult2' as rel_id,
                'Bob Doe' as rel_name,
                'father' as rel_type,
                cast(null as bool) as `primary`,
                false as financial,
                false as portal_access
              )
            ] as relationships
    expect:
      format: sql
      rows: |
        select
          'con1' as finalsite_enrollment_id,
          'rel1' as relationship_id,
          'adult1' as rel_id,
          'Ann Doe' as rel_name,
          'mother' as rel_type,
          true as is_primary,
          true as is_financial,
          true as has_portal_access,
          'hh1' as household_1_id,
          cast(null as bool) as is_parent2
        union all
        select
          'con1' as finalsite_enrollment_id,
          'rel2' as relationship_id,
          'adult2' as rel_id,
          'Bob Doe' as rel_name,
          'father' as rel_type,
          cast(null as bool) as is_primary,
          false as is_financial,
          false as has_portal_access,
          'hh1' as household_1_id,
          cast(null as bool) as is_parent2
