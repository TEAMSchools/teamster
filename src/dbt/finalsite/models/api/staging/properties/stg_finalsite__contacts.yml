models:
  - name: stg_finalsite__contacts
    description:
      One row per Finalsite Enrollment contact (the student/applicant record)
      from the REST API `/contacts` endpoint. Flattens the populated base
      fields, the grade / school-year / prospect-entry structs, the primary
      household address, and up to three phones (normalized to E.164 here, the
      earliest point each is a scalar column); the custom / id / track attribute
      arrays are passed through whole (key-value style) for downstream models to
      pivot. Fields the API exposes but that are unpopulated for this tenant are
      intentionally omitted (billing / financial-aid / scholarship /
      account-balance fields, `previous_school_1`, `review_decision`,
      `is_alumni`). Medical custom fields are not surfaced pending the
      medical-destination decision.
    columns:
      - name: finalsite_enrollment_id
        data_type: string
        description: Finalsite contact UUID; the natural key for this grain.
        data_tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error
      - name: first_name
        data_type: string
        description: Contact's first name.
      - name: middle_name
        data_type: string
        description: Contact's middle name.
      - name: last_name
        data_type: string
        description: Contact's last name.
      - name: full_name
        data_type: string
        description: Contact's full name as composed by Finalsite.
      - name: preferred_name
        data_type: string
        description: Contact's preferred name.
      - name: email
        data_type: string
        description: Contact's email address.
      - name: gender
        data_type: string
        description: Gender code as stored in Finalsite.
      - name: gender_display
        data_type: string
        description: Display form of the gender value.
      - name: gender_full_text
        data_type: string
        description: Full-text form of the gender value.
      - name: status
        data_type: string
        description: Current Finalsite workflow status for the contact.
      - name: enrollment_type
        data_type: string
        description: Finalsite enrollment type classification.
      - name: inquiry_submit_date
        data_type: string
        description: Raw inquiry submission timestamp string from the API.
      - name: application_submit_date
        data_type: string
        description: Raw application submission timestamp string from the API.
      - name: contract_submit_date
        data_type: string
        description: Raw enrollment-contract submission timestamp string.
      - name: grade_canonical_name
        data_type: string
        description: Canonical name of the contact's current grade.
      - name: grade_name
        data_type: string
        description: Display name of the contact's current grade.
      - name: grade_school_level
        data_type: string
        description: School level of the contact's current grade.
      - name: prospect_entry_grade_canonical_name
        data_type: string
        description: Canonical name of the grade the prospect is entering.
      - name: school_year_start
        data_type: int64
        description: Start year of the contact's active school year.
      - name: prospect_entry_year_start
        data_type: int64
        description: Start year of the prospect's intended entry school year.
      - name: phone_1_type
        data_type: string
        description: Type label of the first phone.
      - name: phone_1_number
        data_type: string
        description:
          Number of the first phone, normalized to E.164 — `+1XXXXXXXXXX` for a
          valid US number, `+<cc><national>` for an explicit international one,
          with an `xNNNN` suffix when the raw value carried an extension. A
          value that cannot be confidently parsed passes through as entered
          (control characters stripped) rather than becoming null.
      - name: phone_2_type
        data_type: string
        description: Type label of the second phone.
      - name: phone_2_number
        data_type: string
        description:
          Number of the second phone, normalized to E.164 on the same rules as
          `phone_1_number`.
      - name: phone_3_type
        data_type: string
        description: Type label of the third phone.
      - name: phone_3_number
        data_type: string
        description:
          Number of the third phone, normalized to E.164 on the same rules as
          `phone_1_number`.
      - name: custom_attributes
        data_type:
          array<struct<field_id string, field_name string, field_display_name
          string, value struct<boolean_value bool, string_value string,
          array_string_value array<string>>>>
        description:
          Repeated key-value custom fields; `value` is a typed union struct
          (boolean / string / string-array). Passed through whole for downstream
          pivoting.
      - name: id_attributes
        data_type:
          array<struct<field_id string, field_name string, field_display_name
          string, value struct<boolean_value bool, string_value string,
          array_string_value array<string>>>>
        description:
          Repeated identifier fields (e.g. minted student number) in the same
          key-value shape as `custom_attributes`. Passed through whole.
      - name: track_attributes
        data_type:
          array<struct<field_id string, field_name string, field_display_name
          string, value struct<boolean_value bool, string_value string,
          array_string_value array<string>>, school_year struct<id string, name
          string, start_year int64, created_at string>>>
        description:
          Repeated per-school-year ("track") custom fields; same key-value shape
          as `custom_attributes` plus the `school_year` the value applies to.
          Passed through whole.
      - name: households
        data_type:
          array<struct<id string, address_1 string, address_2 string, city
          string, state string, zip string, country string>>
        description:
          Repeated raw household struct, passed through unnormalized (Finalsite
          emits empty strings rather than null, and mixed-case states). This
          model's scalar `address_*` columns are this array's first element
          only; `int_finalsite__contacts__households` flattens every element per
          contact, with the same blank-to-null and state-uppercasing
          normalization applied downstream.
      - name: birth_date
        data_type: date
        description: Contact's date of birth, cast from the source string.
      - name: household_1_id
        data_type: string
        description:
          Finalsite id of the contact's first household ("household 1") — the
          household whose address populates the address columns. Finalsite
          households carry only an id and an address; membership roles do not
          exist, so parent/guardian semantics come from `relationships` and
          custom fields, not from the household.
      - name: household_ids
        data_type: array<string>
        description:
          Finalsite ids of every household the contact belongs to. Used to test
          household co-membership between a student and a related contact.
      - name: address_1
        data_type: string
        description:
          Line 1 of the primary household address; blank values normalized to
          null.
        config:
          meta:
            contains_pii: true
      - name: address_2
        data_type: string
        description:
          Line 2 of the primary household address; blank values normalized to
          null.
        config:
          meta:
            contains_pii: true
      - name: city
        data_type: string
        description:
          City of the primary household address; blank values normalized to
          null.
        config:
          meta:
            contains_pii: true
      - name: state
        data_type: string
        description:
          State of the primary household address, uppercased; blank values
          normalized to null.
      - name: zip
        data_type: string
        description:
          ZIP code of the primary household address; blank values normalized to
          null.
        config:
          meta:
            contains_pii: true
      - name: country
        data_type: string
        description: Country of the primary household address.
      - name: relationships
        data_type:
          array<struct<id string, rel_id string, rel_name string, rel_type
          string, `primary` bool, financial bool, portal_access bool>>
        description:
          Raw bidirectional relationship links for this contact, passed through
          whole so `stg_finalsite__contact_relationships` unnests a deduped copy
          instead of re-reading the accumulated source. `primary` is a
          per-record singleton and is NULL, not false, when unset.

unit_tests:
  - name: test_contacts_phone_normalization
    description:
      Each phone normalizes to E.164 as it is flattened out of its source struct
      — a control-char-garbled number and a parenthesized-and-dashed number both
      resolve to `+1XXXXXXXXXX`, while a value with no parseable digits passes
      through as entered rather than becoming null. Also covers the
      household-address normalization applied in the same select — blank to
      null, state uppercased.
    model: stg_finalsite__contacts
    given:
      - input: source('finalsite', 'contacts')
        format: sql
        rows: |
          select
            'con1' as id,
            'Jane' as first_name,
            'Q' as middle_name,
            'Doe' as last_name,
            'Jane Q Doe' as full_name,
            'Janie' as preferred_name,
            'jane@example.com' as email,
            'F' as gender,
            'Female' as gender_display,
            'Female' as gender_full_text,
            'enrolled' as status,
            'returning' as enrollment_type,
            '2025-01-02' as inquiry_submit_date,
            '2025-01-03' as application_submit_date,
            '2025-01-04' as contract_submit_date,
            struct(
              '5' as canonical_name, 'Grade 5' as name, 'ES' as school_level
            ) as grade,
            struct('6' as canonical_name) as prospect_entry_grade,
            struct(2025 as start_year) as school_year,
            struct(2026 as start_year) as prospect_entry_year,
            struct(
              'Cell' as phone_type,
              code_points_to_string([8234])
                || '+1 (862) 300'
                || code_points_to_string([8209])
                || '7240'
                || code_points_to_string([8236]) as number
            ) as phone_1,
            struct('Home' as phone_type, '(929) 225-5670' as number) as phone_2,
            struct(
              cast(null as string) as phone_type, 'no phone' as number
            ) as phone_3,
            array<struct<field_name string, value struct<string_value string>>>[]
              as custom_attributes,
            array<struct<field_name string, value struct<string_value string>>>[]
              as id_attributes,
            array<struct<field_name string, value struct<string_value string>>>[]
              as track_attributes,
            '2015-04-05' as birth_date,
            [
              struct(
                'hh1' as id,
                '123 Main St' as address_1,
                '' as address_2,
                ' Miami ' as city,
                ' fl ' as state,
                '33101' as zip,
                'US' as country
              )
            ] as households,
            array<
              struct<
                id string,
                rel_id string,
                rel_name string,
                rel_type string,
                `primary` bool,
                financial bool,
                portal_access bool
              >
            >[] as relationships,
            '2026-08-11' as _dagster_partition_date
    expect:
      format: sql
      rows: |
        select
          'con1' as finalsite_enrollment_id,
          'Jane' as first_name,
          'Q' as middle_name,
          'Doe' as last_name,
          'Jane Q Doe' as full_name,
          'Janie' as preferred_name,
          'jane@example.com' as email,
          'F' as gender,
          'Female' as gender_display,
          'Female' as gender_full_text,
          'enrolled' as status,
          'returning' as enrollment_type,
          '2025-01-02' as inquiry_submit_date,
          '2025-01-03' as application_submit_date,
          '2025-01-04' as contract_submit_date,
          '5' as grade_canonical_name,
          'Grade 5' as grade_name,
          'ES' as grade_school_level,
          '6' as prospect_entry_grade_canonical_name,
          2025 as school_year_start,
          2026 as prospect_entry_year_start,
          'Cell' as phone_1_type,
          'Home' as phone_2_type,
          cast(null as string) as phone_3_type,
          array<struct<field_name string, value struct<string_value string>>>[]
            as custom_attributes,
          array<struct<field_name string, value struct<string_value string>>>[]
            as id_attributes,
          array<struct<field_name string, value struct<string_value string>>>[]
            as track_attributes,
          [
            struct(
              'hh1' as id,
              '123 Main St' as address_1,
              '' as address_2,
              ' Miami ' as city,
              ' fl ' as state,
              '33101' as zip,
              'US' as country
            )
          ] as households,
          cast('2015-04-05' as date) as birth_date,
          'hh1' as household_1_id,
          '123 Main St' as address_1,
          cast(null as string) as address_2,
          'Miami' as city,
          'FL' as state,
          '33101' as zip,
          'US' as country,
          ['hh1'] as household_ids,
          '+18623007240' as phone_1_number,
          '+19292255670' as phone_2_number,
          'no phone' as phone_3_number,
          array<
            struct<
              id string,
              rel_id string,
              rel_name string,
              rel_type string,
              `primary` bool,
              financial bool,
              portal_access bool
            >
          >[] as relationships

  - name: test_contacts_dedupe_newest_partition_wins
    description: Accumulated partitions hold the same contact more than once.
      The newest `_dagster_partition_date` wins and exactly one row survives per
      contact, so the singleton grain every downstream model assumes still
      holds. Guards the `is_primary` and address-of-record picks in #4616 / #4617 / #4680.
