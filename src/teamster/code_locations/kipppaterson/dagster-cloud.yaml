locations:
  - location_name: kipppaterson
    code_source:
      module_name: teamster.code_locations.kipppaterson.definitions
    build:
      directory: ./
      registry: us-central1-docker.pkg.dev/teamster-332318/teamster/kipppaterson
    working_directory: /app
    container_context:
      k8s:
        volume_mounts:
          - name: deanslist-keys
            readOnly: true
            mountPath: /etc/deanslist
        volumes:
          - name: deanslist-keys
            projected:
              sources:
                - secret:
                    name: op-deanslist-api-kipppaterson
        server_k8s_config:
          pod_spec_config:
            affinity:
              podAntiAffinity:
                # Preferred, not required. With one replica per location this
                # spreads nothing; as `required` its only live effect was
                # forbidding the replacement pod from the outgoing pod's node
                # during a rollover -- the one node guaranteed to have arm64
                # Scale-Out capacity sized for a code server and, by the run-pod
                # anti-affinity, no run pods on it. Under `preferred` that node
                # becomes FEASIBLE again, which is what removes the NAP wait --
                # the scheduler still penalizes it, twice counting the hostname
                # topologySpreadConstraint, and will usually pick elsewhere when
                # anything else fits. Cross-location spreading is unchanged; it
                # comes from topologySpreadConstraints in the Helm values.
                # Rollover co-location risks are modelled in the spec:
                # docs/superpowers/specs/2026-08-18-code-server-scheduling-resilience-design.md
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchExpressions:
                          - key: location_name
                            operator: In
                            values:
                              - kipppaterson
                      topologyKey: kubernetes.io/hostname
          container_config:
            env:
              - name: COUCHDROP_SFTP_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: op-couchdrop-sftp
                    key: password
              - name: COUCHDROP_SFTP_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: op-couchdrop-sftp
                    key: username
              - name: COUCHDROP_SFTP_HOST
                valueFrom:
                  secretKeyRef:
                    name: op-couchdrop-sftp
                    key: URL
              - name: AMPLIFY_SFTP_HOST
                valueFrom:
                  secretKeyRef:
                    name: op-amplify-sftp-kipppaterson
                    key: URL
              - name: AMPLIFY_SFTP_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: op-amplify-sftp-kipppaterson
                    key: password
              - name: AMPLIFY_SFTP_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: op-amplify-sftp-kipppaterson
                    key: username
              - name: EDPLAN_SFTP_HOST
